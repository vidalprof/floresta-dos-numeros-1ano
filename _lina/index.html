:root{--verde:#5bbf3a;--verde-d:#3f9a26;--sol:#ffd43b;--sol-d:#eab000;--terra:#a6703c;
  --coral:#ff7a6b;--rosa:#ff8ac2;--roxo:#7d3fe0;--texto:#3a3020;--card:#fffdf6;--linha:#e6dcc6}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0}
html,body{height:100%;overflow:hidden}
body{font-family:"Fredoka",ui-rounded,"Segoe UI",system-ui,Arial,sans-serif;color:var(--texto);background:#bfe9ff;-webkit-user-select:none;user-select:none}
#bg{position:fixed;inset:0;z-index:0;background:#cdeeff center/cover no-repeat;background-image:url(img/lt_fundo.png)}
#ceu{position:fixed;inset:0;width:100%;height:100%;display:block;z-index:1;pointer-events:none}
#app{position:fixed;inset:0;z-index:2}
.tela{position:absolute;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch;display:-webkit-box;display:flex;-webkit-box-orient:vertical;-webkit-flex-direction:column;flex-direction:column;-webkit-box-align:center;align-items:center;padding:calc(40px + env(safe-area-inset-top)) 16px calc(104px + env(safe-area-inset-bottom));-webkit-animation:fade .45s;animation:fade .45s}
@-webkit-keyframes fade{from{opacity:0}to{opacity:1}}@keyframes fade{from{opacity:0}to{opacity:1}}
/* marcador: balao que NAO ganha alto-falante (tela do professor). Sem
   gravacao, o botao ficaria mudo — melhor nao existir. */
.semzap{padding-right:18px}
.balao{position:relative;max-width:430px;background:rgba(255,253,246,.95);border:0;border-radius:22px;padding:13px 18px;font-size:17px;font-weight:600;text-align:center;line-height:1.35;
  -webkit-box-shadow:0 6px 18px rgba(30,50,20,.22);box-shadow:0 6px 18px rgba(30,50,20,.22)}
.balao b{color:#2c7318}
/* ⭐ REGRA DO MOTOR — O ENUNCIADO NUNCA ENCOSTA NO QUE VEM DEPOIS.
   O Marcos cobrou isto DUAS vezes noutras atividades (*"as opcoes de resposta
   estao encostando no enunciado"* e, depois, *"esse encosto no enunciado eu ja
   tinha comentado antes"*). Aqui o portao de leiaute achou o mesmo defeito em
   10 telas x 6 tamanhos: folga ZERO. O balao tem sombra, e o vizinho colado por
   baixo entra nela e parece grudado. Regra de motor, nao conserto de fase — e a
   unica forma de o defeito nao voltar na proxima tela que alguem montar.     */
.balao + *{margin-top:13px}
.balao + .balao{margin-top:8px}

/* ⚠️ o balanco era translateY + rotate(1.5deg). A Lina usa BONE, e girar o
   corpo inteiro faz a aba do bone varrer a tela: a crianca ve o CHAPEU se
   mexendo enquanto ela fala, e nao a boca. Agora ela RESPIRA — sobe 3px e
   incha 1,5%, sem girar. Quem se mexe ao falar e a boca. */
@-webkit-keyframes bob{0%,100%{-webkit-transform:translateY(0) scale(1)}50%{-webkit-transform:translateY(-3px) scale(1.015)}}
@keyframes bob{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-3px) scale(1.015)}}
.btn{border:0;cursor:pointer;font-family:inherit;font-weight:700;font-size:20px;color:#fff;letter-spacing:.4px;padding:16px 34px;border-radius:999px;
  background:-webkit-linear-gradient(top,#3f9a26,#256113);background:linear-gradient(#3f9a26,#256113);
  -webkit-box-shadow:0 6px 0 var(--verde-d),0 12px 18px rgba(0,0,0,.25);box-shadow:0 6px 0 var(--verde-d),0 12px 18px rgba(0,0,0,.25);
  -webkit-animation:beat 1.7s ease-in-out infinite;animation:beat 1.7s ease-in-out infinite}
.btn:active{-webkit-transform:translateY(4px) scale(.98);transform:translateY(4px) scale(.98);-webkit-box-shadow:0 2px 0 var(--verde-d);box-shadow:0 2px 0 var(--verde-d)}
.btn.amarelo{background:-webkit-linear-gradient(top,#ffe06b,var(--sol));background:linear-gradient(#ffe06b,var(--sol));color:#6a4b00;-webkit-box-shadow:0 6px 0 var(--sol-d),0 12px 18px rgba(0,0,0,.25);box-shadow:0 6px 0 var(--sol-d),0 12px 18px rgba(0,0,0,.25);-webkit-animation:none;animation:none}
.btn.peq{font-size:17px;padding:12px 24px;-webkit-animation:none;animation:none}
@-webkit-keyframes beat{0%,100%{-webkit-transform:scale(1)}50%{-webkit-transform:scale(1.04)}}@keyframes beat{0%,100%{transform:scale(1)}50%{transform:scale(1.04)}}
.prog{position:absolute;top:calc(12px + env(safe-area-inset-top));left:16px;right:16px;height:14px;background:rgba(255,255,255,.55);border-radius:999px;overflow:hidden;z-index:3;-webkit-box-shadow:inset 0 1px 3px rgba(0,0,0,.15);box-shadow:inset 0 1px 3px rgba(0,0,0,.15)}
.prog>i{position:absolute;left:0;top:0;bottom:0;background:-webkit-linear-gradient(top,#8be05a,var(--verde));background:linear-gradient(#8be05a,var(--verde));border-radius:999px;-webkit-transition:width .5s cubic-bezier(.2,.8,.3,1);transition:width .5s cubic-bezier(.2,.8,.3,1)}

/* PREVER (POE) */
/* ⚠️ a mesma conta que subiu para o motor do esqueleto (ago/2026): 400px sem
   piso de altura da 400x59 = 6,8 vezes mais largo que alto, acima do teto de
   6 do diretor de arte. 360/62 = 5,8. A Lina e feita a mao, entao a regra
   tem que ser repetida aqui — e por isso ela mora no motor para as novas. */
.opts{display:-webkit-box;display:-webkit-flex;display:flex;-webkit-flex-direction:column;flex-direction:column;gap:10px;margin-top:14px;width:100%;max-width:360px}

.opt:active{-webkit-transform:translateY(2px);transform:translateY(2px)}
.opt.ok{border-color:var(--verde);background:#eafce0}
.opt.no{border-color:var(--coral);background:#ffece9}
.selo{display:inline-block;background:var(--roxo);color:#fff;font-size:13px;font-weight:700;padding:5px 12px;border-radius:999px;margin-bottom:8px}

.vaso.no{border-color:var(--coral);background:#ffece9}
/* cartas */
.cartas{display:-webkit-box;display:-webkit-flex;display:flex;-webkit-flex-wrap:wrap;flex-wrap:wrap;gap:10px;-webkit-box-pack:center;justify-content:center;margin-top:10px;max-width:470px}
.carta{position:relative;width:96px;min-height:116px;background:rgba(255,253,246,.72);-webkit-backdrop-filter:blur(7px);backdrop-filter:blur(7px);border:2px solid var(--linha);border-bottom-width:5px;border-radius:20px;cursor:pointer;padding:8px 6px 6px;text-align:center;

.carta.no{border-color:var(--coral);background:#ffece9;-webkit-animation:shk .4s;animation:shk .4s}
@-webkit-keyframes shk{0%,100%{-webkit-transform:translateX(0)}25%{-webkit-transform:translateX(-6px)}50%{-webkit-transform:translateX(6px)}75%{-webkit-transform:translateX(-4px)}}
@keyframes shk{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}50%{transform:translateX(6px)}75%{transform:translateX(-4px)}}
/* precisa */
.bins{display:-webkit-box;display:flex;gap:14px;margin-top:14px}
.bin{width:136px;padding:14px;border-radius:20px;text-align:center;font-weight:700;font-size:16px;color:#fff;cursor:pointer;-webkit-box-shadow:0 5px 0 rgba(0,0,0,.16),0 8px 14px rgba(0,0,0,.18);box-shadow:0 5px 0 rgba(0,0,0,.16),0 8px 14px rgba(0,0,0,.18)}
.bin:active{-webkit-transform:translateY(3px);transform:translateY(3px)}
.bin.sim{background:-webkit-linear-gradient(top,#3f9a26,#256113);background:linear-gradient(#3f9a26,#256113)}

.itemCard{width:150px;min-height:156px;background:rgba(255,253,246,.72);-webkit-backdrop-filter:blur(7px);backdrop-filter:blur(7px);border:2px solid var(--linha);border-bottom-width:6px;border-radius:24px;padding:12px;text-align:center;display:-webkit-box;display:flex;-webkit-box-orient:vertical;-webkit-flex-direction:column;flex-direction:column;-webkit-box-align:center;align-items:center;-webkit-box-pack:center;justify-content:center;-webkit-box-shadow:0 8px 18px rgba(30,50,20,.2);box-shadow:0 8px 18px rgba(30,50,20,.2);-webkit-transition:border-color .2s;transition:border-color .2s}
.itemCard img{width:100px;height:100px;object-fit:contain;-webkit-animation:pop .35s;animation:pop .35s}

@-webkit-keyframes pop{from{-webkit-transform:scale(.5);opacity:0}to{-webkit-transform:scale(1);opacity:1}}
@keyframes pop{from{transform:scale(.5);opacity:0}to{transform:scale(1);opacity:1}}

.partes{position:relative;width:308px;height:308px;margin-top:13px}

.zona.pisca{-webkit-animation:zp 1.1s ease-in-out infinite;animation:zp 1.1s ease-in-out infinite}
@-webkit-keyframes zp{0%,100%{-webkit-box-shadow:0 0 0 0 rgba(255,255,255,0)}50%{-webkit-box-shadow:0 0 0 7px rgba(255,255,255,.55)}}

/* banner */
.banner{position:fixed;left:0;right:0;bottom:0;z-index:20;padding:18px 18px calc(20px + env(safe-area-inset-bottom));max-width:520px;margin:0 auto;

.banner.show{-webkit-transform:none;transform:none}.banner.bom{background:#dcffbe}
.banner .msg{font-size:18px;font-weight:700;color:#3f7d04;margin-bottom:12px;text-align:center}
.banner .cta2{width:100%;border:0;cursor:pointer;font-family:inherit;font-weight:700;font-size:18px;color:#fff;padding:15px;border-radius:18px;background:var(--verde);-webkit-box-shadow:0 4px 0 var(--verde-d);box-shadow:0 4px 0 var(--verde-d);text-transform:uppercase}
/* ⚠️ LICAO PAGA (ago/2026, e o Marcos so viu o SINTOMA: "falta a comemoracao
   com confetes"). O confete existia e nunca aparecia. `canvas` e elemento
   SUBSTITUIDO: com `inset:0` e largura automatica, o navegador NAO estica —
   usa o tamanho intrinseco, 300x150, no canto de cima. Entao `cc.height`
   valia 150, e o `lcf()` apagava na hora todo papel nascido abaixo de 170px
   (`p.y>cc.height+20`), que e a tela inteira. O `#ceu` ja tinha o conserto
   (width/height 100%) e este ficou para tras. Elemento substituido SEMPRE
   pede largura e altura explicitas.                                     */
#conf{position:fixed;inset:0;width:100%;height:100%;display:block;z-index:15;pointer-events:none}
.hint{margin-top:10px;font-size:13px;color:#fff;font-weight:600;text-shadow:0 1px 4px rgba(0,0,0,.4);background:rgba(40,52,20,.82);padding:6px 13px;border-radius:999px;max-width:340px;text-align:center;line-height:1.3}
@media (max-height:620px){ .tela{padding-bottom:calc(104px + env(safe-area-inset-bottom))} }
.dicain{background:#fff6d8;margin-top:9px;-webkit-animation:pop .3s;animation:pop .3s}
/* cracha no fim */
.cracha{position:relative;display:-webkit-box;display:-webkit-flex;display:flex;-webkit-box-align:center;-webkit-align-items:center;align-items:center;gap:12px;background:rgba(255,253,246,.74);-webkit-backdrop-filter:blur(7px);backdrop-filter:blur(7px);border:2px solid var(--linha);border-bottom-width:5px;border-radius:20px;padding:10px 18px 10px 10px;margin-top:14px;max-width:300px;-webkit-box-shadow:0 8px 18px rgba(30,50,20,.26);box-shadow:0 8px 18px rgba(30,50,20,.26);-webkit-animation:pop .5s;animation:pop .5s}
.cracha .cfoto{width:62px;height:62px;-webkit-flex:none;flex:none;object-fit:contain;background:#eafce0;border:2px solid var(--verde);border-radius:50%;padding:3px}
.cracha .ctx{text-align:left;min-width:0}
.cracha .csel{color:#245f13 !important;font-size:11px;font-weight:700;letter-spacing:.6px}
.cracha .cnome{font-size:20px;font-weight:700;color:var(--texto);line-height:1.15;word-break:break-word}
.cracha .cfun{color:#6b6252 !important;font-size:12px;font-weight:600;color:#8a7f68}
.cracha:before{content:"";position:absolute;top:-7px;left:50%;margin-left:-11px;width:22px;height:9px;border:2px solid var(--linha);border-bottom:0;border-radius:11px 11px 0 0;background:transparent}
/* ===== ARRASTAR A LETRA (a peca vai na mao ate a lacuna) ===== */
.pecas{display:-webkit-box;display:-webkit-flex;display:flex;-webkit-flex-wrap:wrap;flex-wrap:wrap;gap:12px;-webkit-box-pack:center;justify-content:center;margin-top:14px}
.peca{width:62px;height:66px;border-radius:14px;background:rgba(255,253,246,.97);border:2px solid var(--linha);border-bottom-width:5px;text-align:center;line-height:60px;font-size:30px;font-weight:700;color:var(--texto);cursor:grab;-webkit-box-shadow:0 5px 12px rgba(30,50,20,.18);box-shadow:0 5px 12px rgba(30,50,20,.18)}
.peca.sel{border-color:var(--sol);background:#fff7d6}
.peca.usada{opacity:.28}
.peca.voa{position:fixed;z-index:40;pointer-events:none;opacity:.95;-webkit-transform:scale(1.06);transform:scale(1.06)}
/* a figura dentro do cartao de ligar: cabe inteira, sem esticar */
.figLig{width:56px;height:56px;object-fit:contain;display:block;margin:0 auto}
.tvaga{display:inline-block;min-width:46px;height:54px;line-height:50px;border-radius:12px;background:rgba(255,253,246,.93);border:2px dashed #b9a97f;font-size:28px;font-weight:700;color:var(--texto);vertical-align:middle}
.tvaga.sob{border-color:var(--sol);background:#fff7d6;border-style:solid}
.tvaga.cheia{border:2px solid var(--verde);border-bottom-width:4px;color:var(--verde-d);background:var(--card)}
.tvaga.errou{border-color:var(--coral);background:#ffece9;-webkit-animation:shk .4s;animation:shk .4s}
/* ===== MECANICAS EXTRAS: caca-palavras / montar / memoria / relampago ===== */
.grade{display:-webkit-box;display:-webkit-flex;display:flex;-webkit-flex-wrap:wrap;flex-wrap:wrap;width:100%;max-width:340px;margin-top:8px;background:rgba(255,253,246,.96);border:2px solid var(--linha);border-radius:16px;padding:6px;-webkit-box-shadow:0 6px 14px rgba(30,50,20,.18);box-shadow:0 6px 14px rgba(30,50,20,.18)}
.cel{width:16.66%;height:46px;line-height:46px;text-align:center;font-size:18px;font-weight:700;cursor:pointer;color:#5a5346;border-radius:8px}
.cel.sel{background:var(--sol);color:#5a4200}
.cel.ok{background:#cdf0bd;color:#2c6b13}
/* ⭐ CADA PALAVRA ACHADA GANHA A SUA COR (pedido do Marcos, ago/2026: *"tem que
   colorir diferente as palavras encontradas... fantastico para os pequenos"*).
   Antes as seis saiam todas do mesmo verde: a crianca achava a terceira e a
   grade nao mudava de conversa. Com cor propria ela VE o que ja conquistou, e o
   chip da lista embaixo acende na MESMA cor — e a ligacao entre a palavra e o
   lugar dela no quadro. Todos os pares tem letra escura sobre fundo claro para
   passar no portao de contraste. */
.cel.ok1,.pchip.feito1{background:#cdf0bd;color:#2c6b13}
.cel.ok2,.pchip.feito2{background:#cfe6ff;color:#10457f}
.cel.ok3,.pchip.feito3{background:#ffd6e7;color:#8a1c4d}
.cel.ok4,.pchip.feito4{background:#ffe9a8;color:#6b4a00}
.cel.ok5,.pchip.feito5{background:#e2d7ff;color:#4a2a8f}
.cel.ok6,.pchip.feito6{background:#ffdcc0;color:#8a3a00}
/* a palavra recem-achada PULA — o olho vai nela sem precisar de seta */
.cel.pulou{-webkit-animation:cacapula .45s ease;animation:cacapula .45s ease}
@-webkit-keyframes cacapula{0%,100%{-webkit-transform:scale(1)}45%{-webkit-transform:scale(1.22)}}
@keyframes cacapula{0%,100%{transform:scale(1)}45%{transform:scale(1.22)}}
@media (prefers-reduced-motion:reduce){ .cel.pulou{-webkit-animation:none;animation:none} }
.cel.no{background:#ffd3cd;color:#8e2418}
.lista{display:-webkit-box;display:-webkit-flex;display:flex;-webkit-flex-wrap:wrap;flex-wrap:wrap;gap:8px;-webkit-box-pack:center;justify-content:center;margin-top:10px;max-width:340px}
.pchip{background:rgba(255,253,246,.95);border-radius:999px;padding:6px 14px;font-size:15px;font-weight:700;color:var(--texto);-webkit-box-shadow:0 3px 8px rgba(30,50,20,.18);box-shadow:0 3px 8px rgba(30,50,20,.18)}
/* ⚠️ so o RISCO fica aqui: a COR do chip vem da classe numerada (.feito1..6),
   senao esta regra — que vem depois no arquivo e tem a mesma forca — pintava
   os seis chips do mesmo verde e a ligacao com a cor da palavra se perdia.
   Foi o que aconteceu na primeira tentativa, e so a medicao no navegador
   mostrou: a grade tinha duas cores e a lista embaixo, uma so. */
.pchip.feito{text-decoration:line-through}
.slots{display:-webkit-box;display:-webkit-flex;display:flex;gap:8px;-webkit-box-pack:center;justify-content:center;margin-top:12px}
/* ⚠️ a lacuna vazia tinha fundo com 32% de opacidade: a rua de pedra do
   fundo aparecia DENTRO da caixa onde a crianca vai escrever. Lugar de
   escrever e papel: opaco, com a borda tracejada por cima. */
.slot{width:46px;height:52px;border-radius:12px;background:rgba(255,253,246,.93);border:2px dashed #b9a97f;text-align:center;line-height:48px;font-size:26px;font-weight:700;color:var(--texto);-webkit-box-shadow:0 3px 8px rgba(30,50,20,.16);box-shadow:0 3px 8px rgba(30,50,20,.16)}
.slot.cheio{background:var(--card);border:2px solid var(--verde);border-bottom-width:4px;color:var(--verde-d);-webkit-animation:pop .3s;animation:pop .3s}
.letras{display:-webkit-box;display:-webkit-flex;display:flex;-webkit-flex-wrap:wrap;flex-wrap:wrap;gap:9px;-webkit-box-pack:center;justify-content:center;margin-top:16px;max-width:340px}
.tec{width:50px;height:56px;border-radius:14px;background:rgba(255,253,246,.96);border:2px solid var(--linha);border-bottom-width:5px;text-align:center;line-height:50px;font-size:26px;font-weight:700;color:var(--texto);cursor:pointer;-webkit-box-shadow:0 5px 12px rgba(30,50,20,.18);box-shadow:0 5px 12px rgba(30,50,20,.18)}
.tec:active{-webkit-transform:translateY(2px);transform:translateY(2px)}
.tec.usada{opacity:.25}
.tec.no{border-color:var(--coral);background:#ffece9;-webkit-animation:shk .4s;animation:shk .4s}
.mcartas{display:-webkit-box;display:-webkit-flex;display:flex;-webkit-flex-wrap:wrap;flex-wrap:wrap;gap:10px;-webkit-box-pack:center;justify-content:center;margin-top:12px;max-width:430px;width:100%}
.mcarta{width:48%;max-width:210px;height:104px;min-height:104px;border-radius:16px;cursor:pointer;padding:0;background:none;border:0;-webkit-perspective:700px;perspective:700px}
.mcin{position:relative;width:100%;height:100%;-webkit-transition:-webkit-transform .35s;transition:transform .35s;-webkit-transform-style:preserve-3d;transform-style:preserve-3d}

.mface{position:absolute;top:0;left:0;right:0;bottom:0;border-radius:16px;-webkit-backface-visibility:hidden;backface-visibility:hidden;display:-webkit-box;display:-webkit-flex;display:flex;-webkit-box-orient:vertical;-webkit-flex-direction:column;flex-direction:column;-webkit-box-align:center;align-items:center;-webkit-box-pack:center;justify-content:center;padding:5px;text-align:center;line-height:1.2;overflow:hidden;-webkit-box-shadow:0 5px 12px rgba(30,50,20,.2);box-shadow:0 5px 12px rgba(30,50,20,.2)}

@-webkit-keyframes mbri{0%{left:-70%}60%,100%{left:130%}}

.mfrente{-webkit-transform:rotateY(180deg);transform:rotateY(180deg);background:var(--card);border:2px solid var(--linha);color:var(--texto);font-size:13px;font-weight:700}

/* ⚠️ o verde da casa (--verde-d) da 3.5:1 sobre o cartao claro: abaixo do
   minimo de 4.5 que a crianca precisa para enxergar. Verde ESCURO aqui. */
.mplacar{font-weight:800;color:#2c6b13;background:var(--card);border:2px solid var(--linha);border-radius:12px;padding:4px 12px;margin:2px auto 0;display:inline-block;font-size:14px}
/* PC velho sem 3D de verdade: a carta TROCA de face em vez de girar. Sem
   isto ela ficaria virada de costas para sempre e a fase travava. */
@supports not ((transform-style:preserve-3d) or (-webkit-transform-style:preserve-3d)){
  .mcarta.vira .mcin{-webkit-transform:none;transform:none}
  .mfrente{-webkit-transform:none;transform:none;opacity:0}
  .mcarta.vira .mfrente{opacity:1;z-index:2}
}

/* ⭐ ALTO-FALANTE NA PERGUNTA (pedido do Marcos, ago/2026: "precisa acrescentar
   um botao de som na atividade do 2 ano onde sao as perguntas, para ajudar quem
   nao sabe ler"). No 2o ano MUITA crianca ainda nao le: a narracao toca sozinha
   uma vez, mas se ela se distrai, perdeu. O botao "Ouvir de novo" existe la
   embaixo, na barra — longe do texto e com NOME ESCRITO, que e justamente o que
   ela nao le. O lugar do botao e GRUDADO no enunciado, e ele e um desenho de
   alto-falante, nao uma palavra.                                            */
/* ⚠️ O BOTAO NAO PODE TAPAR A PERGUNTA. A primeira versao pousava no canto de
   cima do balao e cobria a ultima palavra ("Toque na RAI[z]", "Que parte da
   planta e esta[?]"). Um botao de acessibilidade que esconde justamente o texto
   que a crianca precisa e o contrario do que ele existe para fazer. Agora o
   balao ABRE ESPACO para ele (classe `comzap`) e o botao mora dentro desse
   espaco, no meio da altura.                                               */
.balao.comzap{padding-right:56px}

/* ============ A OFICINA DE LETREIROS (fases escritas a mao) ============

   CSS clonado (`.palavraGrande`, `.opt.letra`, `.placa`). O `node --check`

   inventada pelo JS tem que nascer com a regra dela no mesmo commit.        */
.palavraGrande{display:-webkit-box;display:-webkit-flex;display:flex;-webkit-flex-wrap:wrap;flex-wrap:wrap;

var narr=document.getElementById("narr");

   baixo"). O `falaAtual` guarda o ULTIMO audio tocado — e quem toca audio aqui

   repetir a curiosidade. O botao "Ouvir de novo" ja tinha esse defeito ha

function ehSecundaria(id){ return /_cur_|_dica$|_acerto\d|_erro\d/.test(id||""); }

   `falar()` só vale na 1ª rodada, e o alto-falante do enunciado passa a repetir

function falaDaTela(id){ telaNarrou=false; falar(id); }

function fimFala(){ paraBoca(); if(btnOuvir) btnOuvir.className="mini"; var c=falandoCb; falandoCb=null; if(c)c(); }

var ceu=document.getElementById("ceu"),cx=ceu.getContext("2d"),CW,CH,TK=0,motes=[],pingos=[];

/* ============ 4: A LETRA NA MAO (ARRASTAR ate a lacuna) ============
   ⭐ DEGRAU CONCRETO. Tocar num botao e simbolico; LEVAR a letra ate o buraco
   da palavra e o mesmo gesto do imã na geladeira — a crianca sente que a letra
   ocupa um lugar. Por isso esta fase vem ANTES da que so pede um toque.
   Molde: `_mapa` "MONTE A LEGENDA" (`arrasta`), a versao mais corrigida.
   ⚠️ AS TRES PORTAS, e este defeito foi pego DUAS vezes: mouse, dedo e TOQUE
   SIMPLES (tocar a letra, tocar a lacuna). Nunca `preventDefault` no
   `touchstart`, e guarda contra o clique FANTASMA que o celular dispara
   depois do toque.                                                        */
var ARRASTA=[{p:"CAMPO",esc:"CA_PO",fig:"lt_campo",cert:"M",dep:"P"},
             {p:"BOMBA",esc:"BO_BA",fig:"lt_bomba",cert:"M",dep:"B"},
             {p:"PONTE",esc:"PO_TE",fig:"lt_ponte",cert:"N",dep:"T"},
             {p:"TAMBOR",esc:"TA_BOR",fig:"lt_tambor",cert:"M",dep:"B"},
             {p:"VENTO",esc:"VE_TO",fig:"lt_vento",cert:"N",dep:"T"}];
function telaArrasta(){
  limpa();var t=el("div","tela");setProg(t,19);
  t.appendChild(el("div","balao","Leve a <b>letra certa</b> at&#233; o buraco da palavra. Pode arrastar ou tocar nas duas."));
  var cen=el("div","centro");
  var fig=imgEl(ARRASTA[0].fig,"figFalta");
  var cxf=el("div","figbox"); cxf.appendChild(fig); cen.appendChild(cxf);
  var linha=el("div","palavraGrande");
  var pecas=el("div","pecas");
  cen.appendChild(linha); cen.appendChild(pecas);
  cen.appendChild(el("div","hint","Olhe a letra que vem DEPOIS do buraco."));
  t.appendChild(cen);app.appendChild(t);
  var pi=0,errI=0,trava=false,sel=null,ultimoToque=0,vaga=null;
  function pinta(){
    var it=ARRASTA[pi],k; linha.innerHTML=""; fig.src="img/"+it.fig+".png";
    for(k=0;k<it.esc.length;k++){
      var ch=it.esc.charAt(k);
      if(ch==="_"){ vaga=el("span","tvaga",""); vaga.setAttribute("data-vaga","1"); linha.appendChild(vaga); }
      else linha.appendChild(el("i","letraFixa",ch));
    }
  }
  function solta(L,alvo){
    var it=ARRASTA[pi]; if(!it||trava) return;
    if(L===it.cert){ trava=true; alvo.innerHTML=L; alvo.className="tvaga cheia"; sCerto(); elogio();
      reg("regra",true,1);
      var cc=centroTela(alvo); faisca(cc[0],cc[1],"#8be05a",12);
      setTimeout(function(){ pi++; trava=false; sel=null;
        if(pi>=ARRASTA.length){ depoisDaFala("lt_arr_revela",8000,function(){
          mostraBanner("Voc&#234; p&#244;s a letra certa nas <b>"+ARRASTA.length+"</b> palavras!",telaFalta); }); }
        else { pinta(); mostra(); dizRodada(ARRASTA[pi].p); } },820);
    } else { alvo.className="tvaga errou"; sErro(); errI++; reg("regra",false,2);
      setTimeout(function(){ if(alvo.className.indexOf("cheia")<0) alvo.className="tvaga"; },600);
      ajudaJd(errI,{dica:"Depois do buraco vem <b>"+it.dep+"</b>. P e B pedem M; as outras pedem N.",
        concreto:function(){ var n=pecas.getElementsByClassName("peca"),z;
          for(z=0;z<n.length;z++) if(n[z].innerHTML===it.cert) n[z].className="peca sel"; },
        revelar:function(){ mostraDica("Depois vem <b>"+it.dep+"</b>, ent&#227;o entra <b>"+it.cert+"</b>: "+it.p+"."); }});
    }
  }
  function mostra(){
    pecas.innerHTML="";
    var lista=(Math.random()<0.5)?["M","N"]:["N","M"],k;
    for(k=0;k<2;k++){(function(L){
      var b=el("div","peca",L);
      /* PORTA 1 e 2: arrastar com o mouse e com o dedo */
      function comeca(x,y,toque){
        if(trava) return;
        var r=b.getBoundingClientRect(),movido=false;
        var g=b.cloneNode(true); g.className="peca voa";
        g.style.width=r.width+"px"; g.style.height=r.height+"px";
        document.body.appendChild(g);
        function poe(px,py){ g.style.left=(px-r.width/2)+"px"; g.style.top=(py-r.height/2)+"px"; }
        poe(x,y); b.className="peca sel"; sel=L; arma(); sTap();
        function sob(px,py){ g.style.display="none";
          var e=document.elementFromPoint(px,py); g.style.display="";
          while(e&&e!==document.body){ if(e.getAttribute&&e.getAttribute("data-vaga")) return e; e=e.parentNode; }
          return null; }
        function move(ev){ var q=toque?ev.touches[0]:ev; movido=true; poe(q.clientX,q.clientY);
          var v=sob(q.clientX,q.clientY);
          if(vaga&&vaga.className.indexOf("cheia")<0) vaga.className=(vaga===v)?"tvaga sob":"tvaga";
          if(toque&&ev.preventDefault) ev.preventDefault(); }
        function larga(ev){
          if(toque){ document.removeEventListener("touchmove",move,false);
                     document.removeEventListener("touchend",larga,false);
                     ultimoToque=(new Date()).getTime(); }
          else { document.removeEventListener("mousemove",move,false);
                 document.removeEventListener("mouseup",larga,false); }
          var q=toque?(ev.changedTouches&&ev.changedTouches[0]):ev;
          var v=q?sob(q.clientX,q.clientY):null;
          if(g.parentNode) g.parentNode.removeChild(g);
          if(vaga&&vaga.className.indexOf("cheia")<0) vaga.className="tvaga";
          b.className="peca";
          if(movido&&v) solta(L,v);
        }
        if(toque){ document.addEventListener("touchmove",move,false);
                   document.addEventListener("touchend",larga,false); }
        else { document.addEventListener("mousemove",move,false);
               document.addEventListener("mouseup",larga,false); }
      }
      b.onmousedown=function(e){ if((new Date()).getTime()-ultimoToque<700) return; comeca(e.clientX,e.clientY,false); };
      b.addEventListener("touchstart",function(e){ var q=e.touches[0]; comeca(q.clientX,q.clientY,true); },false);
      /* PORTA 3: o TOQUE SIMPLES — tocar a letra e depois tocar o buraco */
      b.onclick=function(){ if((new Date()).getTime()-ultimoToque<700) return;
        if(trava) return; arma(); sTap();
        var n=pecas.getElementsByClassName("peca"),z;
        for(z=0;z<n.length;z++) n[z].className="peca";
        b.className="peca sel"; sel=L; };
      pecas.appendChild(b);
    })(lista[k]);}
    if(vaga) vaga.onclick=function(){ if(sel&&!trava) solta(sel,vaga); };
  }
  pinta(); mostra();
  montaBarra("lt_arr_dica","A letra que manda e a que vem DEPOIS do buraco.");
  falar("lt_arr_intro");
  dizRodada(ARRASTA[0].p,3200);
}

}

/* ============ 13: A CRUZADINHA DA OFICINA ============
   ⚠️ GESTO QUE O MARCOS NOMEOU. Aqui a palavra nao vem numa lista para
   escolher: a crianca LE a dica, decide a palavra e ESCREVE letra por letra —
   e as palavras se cruzam, entao uma ajuda a outra (a letra do cruzamento ja
   aparece preenchida quando a vizinha ficou pronta).
   A grade foi conferida ANTES de virar codigo: cinco palavras, 22 casas,
   nenhum choque de letra.                                                    */
var CRUZ=[{p:"SEMPRE",d:"h",l:3,c:1,dica:"O contr&#225;rio de nunca."},
          {p:"BOMBA", d:"v",l:1,c:3,dica:"Puxa a &#225;gua do po&#231;o."},
          {p:"CAMPO", d:"h",l:5,c:2,dica:"Onde o time do bairro joga bola."},
          {p:"PONTE", d:"v",l:4,c:6,dica:"Liga um lado do rio ao outro."},
          {p:"VENTO", d:"v".replace("v","h"),l:7,c:3,dica:"Balan&#231;a a roupa no varal."}];
var CRUZL0=1,CRUZC0=1,CRUZLN=8,CRUZCN=7;
function telaCruz(){
  limpa();var t=el("div","tela");setProg(t,86);
  t.appendChild(el("div","balao","A cruzadinha da oficina. Escreva a palavra da <b>dica</b> em destaque."));
  var cen=el("div","centro");
  var casas={},i,j,k;
  /* onde cada casa fica, e de quais palavras ela participa */
  for(i=0;i<CRUZ.length;i++){ var w=CRUZ[i];
    for(k=0;k<w.p.length;k++){
      var ll=(w.d==="h")?w.l:w.l+k, cc=(w.d==="h")?w.c+k:w.c;
      casas[ll+","+cc]=w.p.charAt(k);
    } }
  var grade=el("div","cgrade"),cel={};
  for(i=CRUZL0;i<=CRUZLN;i++){
    var lin=el("div","clin");
    for(j=CRUZC0;j<=CRUZCN;j++){
      var ch=casas[i+","+j];
      var d=el("div","ccel"+(ch?"":" vazia"),"");
      if(ch) cel[i+","+j]=d;
      lin.appendChild(d);
    }
    grade.appendChild(lin);
  }
  var pista=el("div","balao pequeno","");
  var lista=el("div","cdicas");
  var letras=el("div","letras");
  var atual=null,passo=0,err=0,prontas=0,fimC=false,chips=[];
  function casasDe(w){ var out=[],z;
    for(z=0;z<w.p.length;z++){
      var ll=(w.d==="h")?w.l:w.l+z, cc=(w.d==="h")?w.c+z:w.c;
      out.push(cel[ll+","+cc]);
    } return out; }
  function jaTem(d){ return d && d.innerHTML !== ""; }
  /* a marca do "toque aqui" anda junto: sempre no primeiro chip que falta.
     E o mesmo cuidado do sim/nao — marca fixa aponta para quem ja foi feito. */
  function proximaPalavra(){
    var z;
    for(z=0;z<CRUZ.length;z++){
      var cs=casasDe(CRUZ[z]),c3,falta=false;
      for(c3=0;c3<cs.length;c3++) if(!jaTem(cs[c3])){ falta=true; break; }
      if(falta) return CRUZ[z];
    }
    return null;
  }
  function segue(){
    var w=proximaPalavra();
    if(w){ escolhe(w); }
    else { atual=null; marca(); letras.innerHTML="";
           letras.removeAttribute("data-qa"); }
  }
  function marca(){
    var z,c2; for(z=0;z<CRUZ.length;z++){
      var cs=casasDe(CRUZ[z]);
      /* ⚠️ redesenhar o realce NAO pode apagar o que ja esta escrito: a casa
         cheia continua verde, senao a crianca ve a palavra "desfeita". */
      for(c2=0;c2<cs.length;c2++) if(cs[c2])
        cs[c2].className="ccel"+(jaTem(cs[c2])?" cheia":"")
                         +(atual===CRUZ[z]?" ativa":"");
    }
  }
  function proximaVaga(){
    var cs=casasDe(atual),z;
    for(z=0;z<cs.length;z++) if(!jaTem(cs[z])) return z;
    return -1;
  }
  function escolhe(w,chip){
    if(fimC) return; arma(); sTap();
    atual=w; passo=0; err=0;    /* sempre do comeco: a palavra se escreve inteira */
    pista.innerHTML="<b>"+(w.d==="h"?"Deitada":"Em p&#233;")+":</b> "+w.dica;
    marca(); teclado();
  }
  function teclado(){
    letras.innerHTML="";
    /* ⚠️ o `data-qa` do teclado ANUNCIA qual palavra se escreve agora. Sem
       apaga-lo entre uma palavra e outra, ele continuava anunciando a
       ANTERIOR — e quem fosse escrever (o auditor, ou a crianca guiada pelo
       destaque) procurava teclas de uma palavra que nao esta mais em jogo. */
    if(!atual){ letras.removeAttribute("data-qa"); return; }
    letras.setAttribute("data-qa",atual.p);
    var pool=atual.p.split("");
    if(pool.indexOf("M")<0) pool.push("M");
    if(pool.indexOf("N")<0) pool.push("N");
    var ls=baguncar(pool),z,bts={};
    for(z=0;z<ls.length;z++){(function(L){
      var b=el("div","tec",L);
      if(!bts[L]) bts[L]=[]; bts[L].push(b);
      b.onclick=function(){ if(fimC||!t.parentNode||!atual) return; arma();
        if(b.className.indexOf("usada")>=0) return;
        var cs=casasDe(atual);
        if(passo>=cs.length) return;
        /* ⚠️ LICAO PAGA (ago/2026): o codigo PULAVA a casa do cruzamento, que ja
           vem escrita pela palavra vizinha. So que ninguem digita pulando
           letra: a crianca (e o auditor) escrevem a palavra INTEIRA, e o
           toque na letra do cruzamento caia como ERRO — na palavra certa.
           Agora a letra do cruzamento e aceita: ela so nao precisa ser
           escrita de novo, mas continua valendo como passo. */
        /* ⚠️ NUNCA PULAR CASA, nem a do cruzamento que ja veio escrita. Quem
           escreve — a crianca ou o auditor — conta pelo que JA DIGITOU; um
           avanco por dentro, sem tecla, deixa os dois defasados: a tela mostra
           uma letra e o app espera outra. A letra do cruzamento se digita
           tambem; ela so nao precisa ser pintada de novo. */
        if(L===atual.p.charAt(passo)){
          if(!jaTem(cs[passo])){ cs[passo].innerHTML=L; cs[passo].className="ccel cheia"; }
          b.className="tec usada"; sPop(passo); passo++;
          if(passo>=cs.length){
            sCerto(); reg("escrever",err===0,err+1); prontas++;
            var ce=centroTela(grade); faisca(ce[0],ce[1],"#ffd43b",14);
            var z2; for(z2=0;z2<chips.length;z2++)
              if(chips[z2].__w===atual) chips[z2].className="pchip feito feito"+((z2%6)+1);
            atual=null; marca(); letras.innerHTML="";
            letras.removeAttribute("data-qa");
            if(prontas<CRUZ.length){ segue(); }
            if(prontas>=CRUZ.length){ fimC=true; document.onkeydown=null;
              festa();
              setTimeout(function(){ depoisDaFala("lt_cruz_revela",8000,function(){
                mostraBanner("A cruzadinha inteira, e todas com a letra certa!",telaRelampago); }); },450); }
          }
        } else { err++; b.className="tec no"; sErro();
          setTimeout(function(){ if(b.className==="tec no") b.className="tec"; },420);
          ajudaJd(err,{dica:"Diga a palavra devagar e escute a s&#237;laba do meio.",
            concreto:function(){ var L2=atual.p.charAt(passo),a=bts[L2]||[],y;
              for(y=0;y<a.length;y++) if(a[y].className.indexOf("usada")<0){ a[y].className="tec pisca"; return; } },
            revelar:function(){ mostraDica("A palavra e <b>"+atual.p+"</b>."); }});
        }
      };
      letras.appendChild(b);
    })(ls[z]);}
    equilibra(letras, ls.length, 50);
    document.onkeydown=function(ev){

/* ⚠️ LETRA ORFA: com 6 teclas o teclado quebrava 5 + 1 — uma letra sozinha na
   segunda linha, torta no meio da tela. A largura do bloco passa a sair da
   CONTAGEM: com n teclas em L linhas, cabem ceil(n/L) por linha, e as linhas
   ficam do mesmo tamanho. So vale para teclado pequeno (ate 8): o alfabeto
   inteiro da forca continua em linhas de 5, que e o que a mao alcanca.      */

    if(c1===c2){ d=r2>r1?1:-1; for(x=r1;;x+=d){ out.push([x,c1]); if(x===r2)break; } return out; }

function segredoRelatorio(elm){
  if(!elm) return;
  var tmr=null;
  function comeca(){ if(tmr) clearTimeout(tmr);
    tmr=setTimeout(function(){ tmr=null; telaPainel(); },2000); }
  function para(){ if(tmr){ clearTimeout(tmr); tmr=null; } }
  elm.addEventListener("mousedown",comeca);
  elm.addEventListener("touchstart",comeca);
  elm.addEventListener("mouseup",para);
  elm.addEventListener("mouseleave",para);
  elm.addEventListener("touchend",para);
  elm.addEventListener("touchcancel",para);
}

/* ---------- TREINAR SO O QUE FALTOU ----------
   Pergunta do Marcos (ago/2026): "se ela nao domina, ela consegue fazer so as
   atividades que nao domina?". Da: o app ja mede cada objetivo (DOM). Aqui ele
   monta um percurso CURTO so com as fases dos objetivos fracos e volta para a
   medalha no fim. A crianca nao repete o que ja sabe — isso e o que mantem ela
   na tarefa em vez de enjoar.
   Truque para nao mexer em nenhuma fase: enquanto o treino roda, o mostraBanner
   ignora o "proximo" original e chama a proxima fase da fila.               */
var FILATREINO=null;
var _bannerOriginal=mostraBanner;
mostraBanner=function(msg,cb){ _bannerOriginal(msg, FILATREINO ? proximoTreino : cb); };
function fracos(){
  var k,out=[];
  for(k in DOM){ if(DOM.hasOwnProperty(k)&&(DOM[k]||0)<0.75&&TREINO[k]) out.push(k); }
  return out;
}
function proximoTreino(){
  if(!FILATREINO||!FILATREINO.length){ FILATREINO=null; salvaEstado(); TELAFIM(); return; }
  var f=FILATREINO.shift();
  try{ f(); }catch(e){ proximoTreino(); }
}
function treinarFracos(){
  var f=fracos(),i,fila=[];
  for(i=0;i<f.length;i++) fila.push(TREINO[f[i]]);
  if(!fila.length){ TELAFIM(); return; }
  FILATREINO=fila; proximoTreino();
}
