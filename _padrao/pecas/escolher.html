<!DOCTYPE html>
<html lang="pt-BR"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>PEÇA — escolher (quiz)</title>
<!-- ============================================================
     PEÇA: ESCOLHER / QUIZ  (copiada do _padrao/pecas/MOLDE.html)

     A armadilha desta mecânica, em uma linha (DINAMICAS.md):
       "embaralhar as opções — na Fábrica de Estrelas a certa era sempre a 1ª
        e a criança aprendeu a POSIÇÃO, não o conteúdo".
     Por isso as opções passam SEMPRE por baguncar() antes de ir para a tela.

     O resto que esta peça guarda pronto:
       · alvo de toque grande (.opt tem min-height 48px);
       · nada essencial só na cor — a opção certa acende E ganha a palavra
         "certo" na dica; a errada apaga E sai do alcance;
       · funciona no mudo (todo som tem gêmeo visual);
       · o erro NÃO pune: sErro() + andaime que CRESCE (dica -> apoio concreto
         -> revela e deixa seguir). Nunca X vermelho, nunca a palavra "errou";
       · data-qa="1" na opção que serve AGORA — é assim que o auditor-jogador
         consegue fechar a fase (e é só para ele);
       · nunca trava: depois do 3º erro a resposta certa fica à mostra e
         clicável, então sempre há caminho para fechar.
     ES5 puro, um arquivo só, sem biblioteca (Chrome 109 / Firefox 106).
     ============================================================ -->
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:"Segoe UI",Arial,sans-serif;background:#2b2118;color:#f4efe6}
#app{max-width:520px;margin:0 auto;padding:10px 12px 28px}
.prog{height:9px;background:rgba(255,255,255,.16);border-radius:9px;overflow:hidden;margin:6px 0 12px}
.prog i{display:block;height:100%;background:#59c24b;width:0;-webkit-transition:width .5s;transition:width .5s}
.selo{display:inline-block;background:#3c6ee0;color:#fff;font-weight:700;font-size:13px;
      letter-spacing:.4px;padding:6px 14px;border-radius:20px;margin:0 auto 10px;display:block;
      width:-webkit-fit-content;width:fit-content}
.balao{position:relative;background:rgba(255,253,246,.96);color:#221a12;border-radius:20px;
       padding:13px 17px;font-size:17px;font-weight:600;text-align:center;line-height:1.35;
       box-shadow:0 5px 16px rgba(0,0,0,.28)}
.balao b{color:#1f6b12}
.balao + *{margin-top:13px}
.centro{text-align:center}
.opts{display:block}
/* ⭐ FILEIRA RETA E BOTAO VIVO (ordem do Marcos, ago/2026: *"nada de botoes
   muito esticado, quero tudo simetrico no app"* e *"botoes lindos... quero
   bonito, animacoes etc"*).
   ⚠️ MEDIDO pelo Diretor de Arte: as opcoes tinham 55px e 65px na mesma
   fileira — a que quebrava em duas linhas crescia e a fila ficava torta. O
   olho ve a fileira desalinhada antes de ler qualquer palavra.
   Conserto: altura minima que ja cabe DUAS linhas, e o texto centrado na
   vertical. Uma linha ou duas, o botao e o mesmo tamanho. */
.opt{display:-webkit-box;display:flex;
     -webkit-box-align:center;align-items:center;
     -webkit-box-pack:center;justify-content:center;
     background:#fffdf6;color:#221a12;border:0;border-radius:16px;padding:12px 16px;
     margin:9px auto;font-size:16px;font-weight:600;min-height:62px;max-width:430px;
     text-align:center;cursor:pointer;box-shadow:0 4px 0 #c9bda6;
     -webkit-transition:-webkit-transform .12s ease, box-shadow .12s ease;
     transition:transform .12s ease, box-shadow .12s ease}
/* o botao RESPONDE ao dedo: sobe um pouco quando a crianca encosta e afunda
   quando ela aperta. E o retorno que faz o toque parecer de app, nao de pagina */
.opt:hover{-webkit-transform:translateY(-2px);transform:translateY(-2px);
     box-shadow:0 6px 0 #c9bda6}
.opt:active{-webkit-transform:translateY(3px);transform:translateY(3px);box-shadow:0 1px 0 #c9bda6}
@media (prefers-reduced-motion:reduce){
  .opt{-webkit-transition:none;transition:none}
  .opt:hover{-webkit-transform:none;transform:none;box-shadow:0 4px 0 #c9bda6}
}
.opt.ok{background:#d6f5c8;box-shadow:0 4px 0 #7cb464}
.opt.no{background:#f7d9d2;box-shadow:0 4px 0 #c08c80}
.hint{font-size:14px;opacity:.85;margin-top:10px}
.dica{background:#fff3c9;color:#3a2c07;border-radius:14px;padding:10px 14px;margin-top:12px;
      font-size:15px;font-weight:600}
.tela{display:block}
/* ⚠️ o banner escondido nao pode contar como "resposta fora da tela": ele nao
   existe para a crianca ainda. `visibility` tira do alcance do dedo e do
   leitor de tela — so `bottom:-260px` deixava o botao clicavel no escuro. */
.banner{position:fixed;left:0;right:0;bottom:-260px;background:#1f6b12;color:#fff;text-align:center;
        padding:18px 16px 22px;border-radius:22px 22px 0 0;visibility:hidden;
        -webkit-transition:bottom .35s;transition:bottom .35s}
.banner.show{bottom:0;visibility:visible}
.btn{background:#ffd54a;color:#33280a;border:0;border-radius:16px;padding:13px 26px;font-size:17px;
     font-weight:800;min-height:48px;cursor:pointer;box-shadow:0 4px 0 #c9a52f}
/* ====== CSS DESTA PEÇA ====== */
/* a opcao revelada depois do 3o erro: acende E ganha a marca escrita (nada
   essencial so na cor). A marca e texto de verdade, entao serve no mudo e
   para quem nao distingue verde de vermelho. */
.opt.rev{background:#d6f5c8;box-shadow:0 0 0 3px #ffd54a,0 4px 0 #7cb464}
.marca{display:inline-block;background:#1f6b12;color:#fff;font-size:12px;font-weight:800;
       border-radius:9px;padding:2px 8px;margin-left:8px;vertical-align:middle}
/* a medalha fecha a peca: e por ela que o auditor-jogador sabe que chegou ao
   fim (e nao fica rodando 5200 giros a toa). A estrela vem do CSS, nao e emoji
   e nao e texto medido pelo portao de contraste. */
.medal{width:104px;height:104px;margin:2px auto 12px;border-radius:50%;background:#f6c23a;
       border:6px solid #fff3c9;box-shadow:0 6px 16px rgba(0,0,0,.35);color:#4a3608;
       font-size:44px;line-height:92px;text-align:center;font-weight:800}
.medal:before{content:"\2605"}
</style></head>
<body>
<div id="app"></div>
<div id="banner" class="banner"><div id="bmsg"></div><button id="bcta" class="btn" style="margin-top:12px">Continuar</button></div>
<script>
/* ====== MOTORZINHO DA PEÇA (os mesmos nomes das atividades) ====== */
var app=document.getElementById("app"), banner=document.getElementById("banner"),
    bmsg=document.getElementById("bmsg"), bcta=document.getElementById("bcta");
function el(t,c,h){var e=document.createElement(t);if(c)e.className=c;if(h!==undefined&&h!==null)e.innerHTML=h;return e;}
function limpa(){app.innerHTML="";}
function setProg(t,p){var pr=el("div","prog");var i=el("i");i.style.width=p+"%";pr.appendChild(i);t.appendChild(pr);}
/* ⚠️ A DICA TEM QUE CABER NA TELA (ago/2026). Ela era o ULTIMO filho do
   `.centro`, e em janela apertada (320x568 e 1024x420 — o monitor da escola)
   caia 25 a 96 px ABAIXO DA DOBRA: a crianca que errou precisava ROLAR para ler
   a ajuda, justo no momento em que esta perdida. Agora ela entra LOGO DEPOIS do
   enunciado, que e onde o olho ja esta. Defeito estrutural: valia para as 57
   pecas de uma vez. */
function mostraDica(txt){var d=document.getElementById("dicaP");
  if(!d){ d=el("div","dica"); d.id="dicaP";
    var b=app.getElementsByClassName("balao")[0];
    if(b&&b.parentNode) b.parentNode.insertBefore(d,b.nextSibling);
    else (app.querySelector(".centro")||app).appendChild(d);
  } d.innerHTML=txt;}
function mostraBanner(msg,cb){bmsg.innerHTML=msg;banner.className="banner show";festa();
  bcta.onclick=function(){banner.className="banner";if(cb)cb();};}
function baguncar(a){var i,j,x;for(i=a.length-1;i>0;i--){j=Math.floor(Math.random()*(i+1));x=a[i];a[i]=a[j];a[j]=x;}return a;}
/* som: os numeros vieram da pesquisa (PESQUISA-SOM-E-GAMEFEEL). "ding" e
   sintetizado — MP3 chega atrasado e mata a sensacao de causa-efeito. */
var AC=null;
function ac(){try{if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();
  if(AC.state==="suspended")AC.resume();}catch(e){}return AC;}
function nota(f,dur,vol,tipo,atraso){var c=ac();if(!c)return;
  var o=c.createOscillator(),g=c.createGain(),t=c.currentTime+(atraso||0);
  o.type=tipo||"triangle";o.frequency.value=f;
  g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol||.18,t+.014);
  g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(g);g.connect(c.destination);o.start(t);o.stop(t+dur+.02);}
function sCerto(){nota(523.25,.35,.18,"triangle",0);nota(659.25,.35,.16,"triangle",.055);nota(783.99,.35,.15,"triangle",.11);}
function sErro(){nota(300,.14,.12,"sine",0);nota(318,.14,.12,"sine",0);}
function sTap(){nota(880,.012,.10,"square",0);}
function festa(){sCerto();}
document.addEventListener("pointerdown",function(){ac();},false);
</script>
<script>
/* ====== A PEÇA COMEÇA AQUI ====== */

/* O CONTEÚDO É SÓ EXEMPLO (partes da planta, 8 anos). Ao copiar a peça para
   uma atividade, troque APENAS este bloco de dados: pergunta, a certa, as
   erradas e as TRÊS dicas (dica -> apoio concreto -> revela).                */
/* ⚠️ TRÊS DISTRATORES, não dois. Com só 3 opções na tela a criança elimina as
   duas erradas e o 3º degrau do andaime (o de REVELAR) nunca acontece — o
   apoio concreto ficava sendo o último. Quatro opções é o mínimo para o
   andaime dica -> apoio -> revela existir de verdade.                      */
var QZ=[
 {p:"Qual parte da planta fica <b>embaixo da terra</b> e bebe a água?",
  c:"A RAIZ", e:["A FLOR","A FOLHA","O CAULE"],
  d:["Ela fica escondida, debaixo do chão.",
     "É a parte que segura a planta no lugar e puxa a água da terra.",
     "É a RAIZ. Ela está acesa aí embaixo: toque nela para seguir."]},
 {p:"Qual parte é <b>verde e chata</b> e faz o alimento com a luz do sol?",
  c:"A FOLHA", e:["A RAIZ","O CAULE","A FLOR"],
  d:["Ela fica no ar, virada para o sol.",
     "É verde, fina e cheia de linhas: o sol bate nela o dia inteiro.",
     "É a FOLHA. Ela está acesa aí embaixo: toque nela para seguir."]},
 {p:"Qual parte é o <b>caminho</b> que leva a água da raiz até as folhas?",
  c:"O CAULE", e:["A FLOR","A SEMENTE","A RAIZ"],
  d:["Pense num cano em pé, no meio da planta.",
     "É a parte comprida que segura as folhas lá em cima.",
     "É o CAULE. Ele está aceso aí embaixo: toque nele para seguir."]}
];

var qi=0;      /* rodada de agora */
var err=0;     /* erros DESTA rodada (o andaime cresce com ele) */
var ger=0;     /* geracao da tela: mata setTimeout de fase que ja saiu */

function pecaEscolher(){
  var f=QZ[qi];
  if(!f){ fimDaPeca(); return; }
  err=0; ger++;
  limpa();
  var t=el("div","tela");
  setProg(t, Math.round(qi*100/QZ.length));
  var c=el("div","centro");
  c.appendChild(el("div","selo","PARTES DA PLANTA"));
  c.appendChild(el("div","balao",f.p));
  /* ⭐ A ARMADILHA DA MECÂNICA: embaralhar SEMPRE. */
  var lista=[{txt:f.c,ok:1}], i;
  for(i=0;i<f.e.length;i++) lista.push({txt:f.e[i],ok:0});
  baguncar(lista);
  var box=el("div","opts");
  for(i=0;i<lista.length;i++) box.appendChild(fazOpcao(lista[i]));
  c.appendChild(box);
  c.appendChild(el("div","hint","Pergunta "+(qi+1)+" de "+QZ.length+". Toque na resposta."));
  t.appendChild(c);
  app.appendChild(t);
}

function fazOpcao(it){
  var o=el("div","opt",it.txt);
  /* data-qa="1" = "esta serve AGORA". Existe SÓ para o auditor-jogador
     conseguir terminar a fase; a criança não vê diferença nenhuma. */
  if(it.ok) o.setAttribute("data-qa","1");
  o.onclick=function(){ responde(o,it.ok); };
  return o;
}

function responde(o,certa){
  if(o.className.indexOf("no")>=0) return;   /* opcao ja apagada: nao responde */
  var f=QZ[qi];
  if(certa){
    sCerto();
    o.className="opt ok";
    o.innerHTML=o.innerHTML+'<span class="marca">certo</span>';
    trancaTudo();
    var g=ger;
    setTimeout(function(){
      if(g!==ger) return;                    /* a fase ja mudou: nao mexe */
      qi++;
      if(qi<QZ.length) pecaEscolher();
      else mostraBanner("Você já conhece as partes da planta!", fimDaPeca);
    },560);
    return;
  }
  /* ERRO: não pune. Som grave curto + a opção sai do alcance + o andaime CRESCE. */
  sErro();
  o.className="opt no";
  o.onclick=null;
  err++;
  /* rede de segurança: se as erradas acabaram, revela na hora — a criança
     não pode ficar olhando uma tela onde só resta uma opção sem ninguém
     dizer nada. Com 4 opções isso coincide com o 3º erro.                 */
  var acabou=(sobramErradas()===0);
  mostraDica(acabou ? f.d[f.d.length-1] : f.d[Math.min(err,f.d.length)-1]);
  if(err>=3||acabou) revela();
}

function sobramErradas(){
  var a=app.getElementsByClassName("opt"), i, n=0;
  for(i=0;i<a.length;i++)
    if(a[i].getAttribute("data-qa")!=="1"&&a[i].className.indexOf("no")<0) n++;
  return n;
}

/* 3º erro: revela a certa e DEIXA SEGUIR. É o degrau que garante que a peça
   nunca trava — sempre existe caminho para fechar. */
function revela(){
  var a=app.getElementsByClassName("opt"), i;
  for(i=0;i<a.length;i++){
    if(a[i].getAttribute("data-qa")==="1"){
      a[i].className="opt rev";
      if(a[i].innerHTML.indexOf("marca")<0)
        a[i].innerHTML=a[i].innerHTML+'<span class="marca">é esta</span>';
    }
  }
}

function trancaTudo(){
  var a=app.getElementsByClassName("opt"), i;
  for(i=0;i<a.length;i++) a[i].onclick=null;
}

function fimDaPeca(){
  ger++;
  limpa();
  var t=el("div","tela");
  setProg(t,100);
  var c=el("div","centro");
  c.appendChild(el("div","selo","PEÇA FECHADA"));
  c.appendChild(el("div","medal",""));
  c.appendChild(el("div","balao","Você respondeu as "+QZ.length+" perguntas."));
  var b=el("button","btn","Jogar de novo");
  b.onclick=function(){ qi=0; pecaEscolher(); };
  c.appendChild(b);
  c.appendChild(el("div","hint","Esta é a peça ESCOLHER: opções embaralhadas, erro que ajuda."));
  t.appendChild(c);
  app.appendChild(t);
}

pecaEscolher();
</script>
</body></html>
