<!DOCTYPE html>
<html lang="pt-BR"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>PEÇA — contadores (montar a quantidade)</title>
<!-- ============================================================
     PEÇA: CONTADORES — MONTAR A QUANTIDADE (produzir, não escolher)
     (copiada do _padrao/pecas/MOLDE.html)

     POR QUE ELA EXISTE:
     quase toda tela de matemática pede para a criança ESCOLHER um número entre
     quatro. Escolher se resolve por eliminação, por chute, pelo desenho maior —
     e a criança que ainda não conta bem passa igual. Aqui ela PRODUZ: põe uma
     semente de cada vez e o total APARECE DE CONTAR o que ela mesma montou.
     Não há resposta para chutar; há uma quantidade para construir.
     (Contagem um-a-um, cardinalidade — o último número dito É quantos são.)

     AS ARMADILHAS QUE ESTA PEÇA FECHA:
       · PASSO DE UM. Nada de "+5": o pulo esconde justamente a contagem.
       · BOTÃO GRANDE (dedo de criança de 7 anos, alvo bem acima de 44px) e
         separado do "− tirar", para o dedo não acionar o outro.
       · O TOTAL NUNCA É DIGITADO: não há campo de texto nesta peça. O número
         nasce da contagem, item por item.
       · A VOZ CONTA JUNTO: cada semente que acende diz o seu número em voz alta
         (Web Speech). E TUDO tem gêmeo visual — o número aparece escrito dentro
         da semente que acendeu. Funciona no mudo, funciona no sem-voz.
       · NUNCA TRAVA: os botões continuam vivos, e no 3º tropeço o andaime diz
         quantas faltam (ou quantas sobram) e aponta o botão.
       · ERRO NÃO PUNE: quem contou 6 quando queria 7 ouve uma PERGUNTA
         ("falta muito?"), nunca "errou".
       · data-qa="1" no botão que serve AGORA — só para o auditor-jogador.
     ES5 puro, um arquivo só, sem biblioteca (Chrome 109 / Firefox 106).
     ============================================================ -->
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
/* ⚠️ A BANCADA TAMBEM DECLARA O TEMA (ago/2026). As pecas passaram a usar
   `var(--texto)` para seguir a atividade em que caem — mas aqui, sozinha,
   nao havia quem definisse o token, e a cor de reserva escura caia no fundo
   escuro da propria bancada: 1,06:1. O molde define o token que combina com
   o fundo DELE; a atividade redefine com o dela. */
:root{--texto:#f4efe6}
body{margin:0;font-family:"Segoe UI",Arial,sans-serif;background:#2b2118;color:#f4efe6}
#app{max-width:520px;margin:0 auto;padding:10px 12px 28px}
.prog{height:9px;background:rgba(255,255,255,.16);border-radius:9px;overflow:hidden;margin:6px 0 12px}
.prog i{display:block;height:100%;background:#59c24b;width:0;-webkit-transition:width .5s;transition:width .5s}
.selo{display:inline-block;background:#3c6ee0;color:#fff;font-weight:700;font-size:13px;
      letter-spacing:.4px;padding:6px 14px;border-radius:20px;margin:0 auto 10px;display:block;
      width:-webkit-fit-content;width:fit-content}
.balao{position:relative;background:rgba(255,253,246,.96);color:#221a12;border-radius:20px;
       padding:13px 17px;font-size:17px;font-weight:600;text-align:center;line-height:1.35;
       box-shadow:0 5px 16px rgba(0,0,0,.28)}
.balao b{color:#1f6b12}
.balao + *{margin-top:13px}
.centro{text-align:center}
.opts{display:block}
.opt{display:block;background:#fffdf6;color:#221a12;border:0;border-radius:16px;padding:13px 16px;
     margin:9px auto;font-size:16px;font-weight:600;min-height:48px;max-width:430px;cursor:pointer;
     box-shadow:0 4px 0 #c9bda6}
.opt:active{-webkit-transform:translateY(3px);transform:translateY(3px);box-shadow:0 1px 0 #c9bda6}
.opt.ok{background:#d6f5c8;box-shadow:0 4px 0 #7cb464}
.opt.no{background:#f7d9d2;box-shadow:0 4px 0 #c08c80}
.hint{font-size:14px;opacity:.85;margin-top:10px}
.dica{background:#fff3c9;color:#3a2c07;border-radius:14px;padding:10px 14px;margin-top:12px;
      font-size:15px;font-weight:600}
.tela{display:block}
/* ⚠️ o banner escondido nao pode contar como "resposta fora da tela": ele nao
   existe para a crianca ainda. `visibility` tira do alcance do dedo e do
   leitor de tela — so `bottom:-260px` deixava o botao clicavel no escuro. */
.banner{position:fixed;left:0;right:0;bottom:-260px;background:#1f6b12;color:#fff;text-align:center;
        padding:18px 16px 22px;border-radius:22px 22px 0 0;visibility:hidden;
        -webkit-transition:bottom .35s;transition:bottom .35s}
.banner.show{bottom:0;visibility:visible}
.btn{background:#ffd54a;color:#33280a;border:0;border-radius:16px;padding:13px 26px;font-size:17px;
     font-weight:800;min-height:48px;cursor:pointer;box-shadow:0 4px 0 #c9a52f}
/* ====== CSS DESTA PEÇA ====== */
/* ⭐ A BANDEJA (Marcos, ago/2026: "uma bandeja para colocar as coisas... deixe
   mais bonita, premium"). Antes era a "terra" marrom escura; virou uma bandeja
   de madeira clara com brilho, rima com as frutas. Quando a rodada é de semente
   (sem `item`), o `.canteiro.terra` volta a ser o canteiro escuro de sempre. */
.canteiro{background:-webkit-linear-gradient(#f0e2c4,#dcc196);background:linear-gradient(#f0e2c4,#dcc196);
          border:3px solid #c2a468;border-radius:18px;
          -webkit-box-shadow:inset 0 2px 6px rgba(255,255,255,.6),inset 0 -7px 14px rgba(150,110,50,.22),0 6px 14px rgba(0,0,0,.22);
          box-shadow:inset 0 2px 6px rgba(255,255,255,.6),inset 0 -7px 14px rgba(150,110,50,.22),0 6px 14px rgba(0,0,0,.22);
          min-height:88px;padding:12px 8px;margin:13px auto 0;max-width:430px;
          /* segue abaixo o flex; o `.terra` (rodada de semente) reverte a cor */
          display:-webkit-box;display:-webkit-flex;display:flex;
          -webkit-flex-wrap:wrap;flex-wrap:wrap;
          -webkit-box-pack:center;-webkit-justify-content:center;justify-content:center;
          -webkit-box-align:center;-webkit-align-items:center;align-items:center}
/* rodada de SEMENTE (sem `item`): volta a ser o canteiro escuro de terra */
.canteiro.terra{background:#4a3626;border-color:#6b4b2a;
  -webkit-box-shadow:inset 0 2px 8px rgba(0,0,0,.35);box-shadow:inset 0 2px 8px rgba(0,0,0,.35)}
.sem{width:32px;height:32px;margin:3px;border-radius:50%;background:#e8c46a;
     border:3px solid #b3903c;color:#3a2c07;font-size:15px;font-weight:800;line-height:26px;
     text-align:center}
/* ⭐ ITEM DE VERDADE (Marcos, ago/2026: "o certo ao clicar era aparecer a fruta
   que ela fala, e não bolinhas"). Quando a rodada traz `item` (arte de IA), a
   contagem mostra A FRUTA — sem o círculo/borda, imagem limpa. O número contado
   aparece numa etiqueta no canto para não tapar a fruta. */
.sem.temfoto{width:44px;height:44px;background:transparent !important;border:0 !important;
     border-radius:0;background-repeat:no-repeat;background-position:center;
     -webkit-background-size:contain;background-size:contain;position:relative;line-height:0}
.sem.temfoto.acesa{-webkit-box-shadow:none;box-shadow:none;
     -webkit-filter:drop-shadow(0 0 6px #ffd54a);filter:drop-shadow(0 0 6px #ffd54a)}
.sem.temfoto .nrot{position:absolute;right:-4px;top:-4px;min-width:18px;height:18px;
     line-height:18px;border-radius:9px;background:#1f6b12;color:#fff;font-size:12px;
     font-weight:800;padding:0 3px}
.sem.nova{-webkit-animation:pula .32s ease-out;animation:pula .32s ease-out}
@-webkit-keyframes pula{0%{-webkit-transform:scale(.2);opacity:.2}70%{-webkit-transform:scale(1.15)}100%{-webkit-transform:scale(1);opacity:1}}
@keyframes pula{0%{transform:scale(.2);opacity:.2}70%{transform:scale(1.15)}100%{transform:scale(1);opacity:1}}
/* a semente que a voz está contando AGORA: acende E mostra o número escrito
   (no mudo, o número é quem conta). */
.sem.acesa{background:#fff3c9;border-color:#ffd54a;
           -webkit-box-shadow:0 0 0 4px rgba(255,213,74,.45);box-shadow:0 0 0 4px rgba(255,213,74,.45)}
.sem.vazia{background:transparent;border:3px dashed #9c8156;color:#c9bda6}
/* o molde do 2º degrau do andaime: um lugar para cada semente (um-a-um) */
.molde{margin-top:8px;display:-webkit-box;display:-webkit-flex;display:flex;
       -webkit-flex-wrap:wrap;flex-wrap:wrap;
       -webkit-box-pack:center;-webkit-justify-content:center;justify-content:center}
.mvaga{width:24px;height:24px;margin:2px;border-radius:50%;border:3px dashed #9c8156}
.mvaga.cheia{background:#e8c46a;border:3px solid #b3903c}
.molderot{font-size:13px;font-weight:700;color:var(--texto,#f4efe6);margin-top:6px}
/* o mostrador: o número que ela PRODUZIU, nunca um campo para digitar */
.linc{margin-top:12px;display:-webkit-box;display:-webkit-flex;display:flex;
      -webkit-flex-wrap:wrap;flex-wrap:wrap;
      -webkit-box-align:center;-webkit-align-items:center;align-items:center;
      -webkit-box-pack:center;-webkit-justify-content:center;justify-content:center}
.mostra{min-width:96px;margin:0 10px;background:rgba(255,255,255,.10);border-radius:14px;
        padding:5px 8px;color:#f4efe6;background:rgba(22,24,30,.82);color:#f4efe6;}
.mostra i{display:block;font-size:11px;font-weight:800;letter-spacing:.5px;font-style:normal}
.mostra b{display:block;font-size:26px;font-weight:800;line-height:1.1;color:#ffd54a}
.btn.mais{background:#ffd54a;min-width:88px}
.btn.menos{background:#e4d9c2;box-shadow:0 4px 0 #b0a68f;min-width:88px}
/* apagado por COR, nunca por `opacity` (a letra desbota junto e o contraste cai) */
.btn.off{background:#b8ad95;color:#2a2415;box-shadow:0 4px 0 #8e8571}
.btn.aponta{-webkit-box-shadow:0 0 0 4px #fff3c9,0 4px 0 #c9a52f;box-shadow:0 0 0 4px #fff3c9,0 4px 0 #c9a52f}
.cconta{margin-top:10px}
.total{margin-top:9px;font-size:17px;font-weight:800;color:var(--texto,#f4efe6);min-height:24px;background:rgba(22,24,30,.82);color:#f4efe6;border-radius:12px;padding:5px 12px;display:inline-block;}
.total b{color:#ffd54a}
.total.ok{display:inline-block;background:#d6f5c8;color:#1a3d10;border-radius:12px;padding:3px 12px}
.total.ok b{color:#1a3d10}
.medal{width:104px;height:104px;margin:2px auto 12px;border-radius:50%;background:#f6c23a;
       border:6px solid #fff3c9;box-shadow:0 6px 16px rgba(0,0,0,.35);color:#4a3608;
       font-size:44px;line-height:92px;text-align:center;font-weight:800}
.medal:before{content:"\2605"}
/* tela ESTREITA: os dois botões + o mostrador não cabem lado a lado em 320px
   dentro da atividade montada (o motor come largura). Encolhe o mínimo dos
   botões — segue acima de 40px de alvo — e o mostrador; o flex-wrap do .linc é
   a rede de segurança para nunca vazar da tela. (defeito da prova por lote.) */
@media (max-width:380px){
  .btn.mais,.btn.menos{min-width:70px;padding:13px 14px}
  .mostra{min-width:78px;margin:0 6px}
}
/* janela baixa: encolhe a semente e a letra, NUNCA os botões */
@media (max-height:520px){
  .prog{margin:4px 0 8px}
  .selo{margin-bottom:6px}
  .canteiro{min-height:70px;margin-top:8px;padding:6px 5px}
  .sem{width:28px;height:28px;font-size:14px;line-height:22px}
  .linc{margin-top:8px}
  .mostra b{font-size:22px}
  .cconta{margin-top:6px}
  .total{margin-top:6px;font-size:15px}
  .balao{font-size:15px;padding:9px 14px}
  .hint{margin-top:6px}
}

</style></head>
<body>
<div id="app"></div>
<div id="banner" class="banner"><div id="bmsg"></div><button id="bcta" class="btn" style="margin-top:12px">Continuar</button></div>
<script>
/* ====== MOTORZINHO DA PEÇA (os mesmos nomes das atividades) ====== */
var app=document.getElementById("app"), banner=document.getElementById("banner"),
    bmsg=document.getElementById("bmsg"), bcta=document.getElementById("bcta");
function el(t,c,h){var e=document.createElement(t);if(c)e.className=c;if(h!==undefined&&h!==null)e.innerHTML=h;return e;}
function limpa(){app.innerHTML="";}
function setProg(t,p){var pr=el("div","prog");var i=el("i");i.style.width=p+"%";pr.appendChild(i);t.appendChild(pr);}
/* ⚠️ A DICA TEM QUE CABER NA TELA (ago/2026). Ela era o ULTIMO filho do
   `.centro`, e em janela apertada (320x568 e 1024x420 — o monitor da escola)
   caia 25 a 96 px ABAIXO DA DOBRA: a crianca que errou precisava ROLAR para ler
   a ajuda, justo no momento em que esta perdida. Agora ela entra LOGO DEPOIS do
   enunciado, que e onde o olho ja esta. Defeito estrutural: valia para as 57
   pecas de uma vez. */
function mostraDica(txt){var d=document.getElementById("dicaP");
  if(!d){ d=el("div","dica"); d.id="dicaP";
    var b=app.getElementsByClassName("balao")[0];
    if(b&&b.parentNode) b.parentNode.insertBefore(d,b.nextSibling);
    else (app.querySelector(".centro")||app).appendChild(d);
  } d.innerHTML=txt;}
function mostraBanner(msg,cb){bmsg.innerHTML=msg;banner.className="banner show";festa();
  bcta.onclick=function(){banner.className="banner";if(cb)cb();};}
function baguncar(a){var i,j,x;for(i=a.length-1;i>0;i--){j=Math.floor(Math.random()*(i+1));x=a[i];a[i]=a[j];a[j]=x;}return a;}
/* som: os numeros vieram da pesquisa (PESQUISA-SOM-E-GAMEFEEL). "ding" e
   sintetizado — MP3 chega atrasado e mata a sensacao de causa-efeito. */
var AC=null;
function ac(){try{if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();
  if(AC.state==="suspended")AC.resume();}catch(e){}return AC;}
function nota(f,dur,vol,tipo,atraso){var c=ac();if(!c)return;
  var o=c.createOscillator(),g=c.createGain(),t=c.currentTime+(atraso||0);
  o.type=tipo||"triangle";o.frequency.value=f;
  g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol||.18,t+.014);
  g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(g);g.connect(c.destination);o.start(t);o.stop(t+dur+.02);}
function sCerto(){nota(523.25,.35,.18,"triangle",0);nota(659.25,.35,.16,"triangle",.055);nota(783.99,.35,.15,"triangle",.11);}
function sErro(){nota(300,.14,.12,"sine",0);nota(318,.14,.12,"sine",0);}
function sTap(){nota(880,.012,.10,"square",0);}
function festa(){sCerto();}
document.addEventListener("pointerdown",function(){ac();},false);
</script>
<script>
/* ====== A PEÇA COMEÇA AQUI ====== */

/* O CONTEÚDO É SÓ EXEMPLO (7 a 8 anos, quantidades até 9). Para reusar a peça,
   troque SÓ este bloco.
   ⚠️ A ESCADA: a 1ª começa do zero (só pôr); a 2ª já tem parte posta (ela
   precisa CONTINUAR a contagem, não recomeçar do um); a 3ª começa com SEMENTE
   DEMAIS — tirar é tão parte de montar quanto pôr, e é o degrau que ninguém
   costuma dar. */
/* Campos opcionais de tema (para o montador conhecê-los): `item` (arte da coisa
   contada), `pl`/`sing` (nome no plural/singular), `verbo` (ex.: "Ponha"/"Junte"),
   `onde` ("na cesta"), `label` ("NA CESTA"), `selo` ("A CESTA"). Sem eles, é o
   canteiro de sementes de sempre. */
var CNT=[
 {alvo:5, ini:0, item:"", pl:"sementes", sing:"semente", verbo:"Ponha", onde:"na terra", label:"NA TERRA", selo:"O CANTEIRO"},
 {alvo:8, ini:3},
 {alvo:6, ini:9}
];
var NUM=["zero","um","dois","três","quatro","cinco","seis","sete","oito","nove","dez", /*TECNICA*/
         "onze","doze"];
var MAXSEM=12;   /* teto: acima disto o canteiro não caberia na tela */

/* ⭐ TEMA DA RODADA (Marcos, ago/2026). Se a rodada declara `item` (arte de IA da
   atividade), a contagem deixa de ser "sementes na terra" e passa a ser a coisa
   que a criança conta e ouve (maçãs na cesta). Sem `item`, é o canteiro de sempre
   — nenhuma atividade antiga muda. */
function temaR(){
  var r=CNT[ri]||{};
  return {
    item:  r.item || null,
    pl:    r.pl   || "sementes",
    sing:  r.sing || "semente",
    verbo: r.verbo|| "Ponha",
    onde:  r.onde || "na terra",
    label: r.label|| "NA TERRA",
    selo:  r.selo || "O CANTEIRO"
  };
}
function fazSem(cls){
  var t=temaR(), s=el("div",cls,"");
  if(t.item){ s.className+=" temfoto"; s.style.backgroundImage="url(\"img/"+t.item+".png\")"; }
  return s;
}

var ri=0;        /* rodada de agora */
var qtd=0;       /* quantas sementes estão na terra */
var err=0;       /* contagens que não bateram: é o que faz o andaime crescer */
var molde=false; /* o apoio concreto (um lugar para cada semente) está ligado? */
var contando=false;
var ger=0;
var elCant,elMostra,elTotal,btMais,btMenos,btConta,elMolde;

function alvoAtual(){ return CNT[ri] ? CNT[ri].alvo : 0; }  /* guarda: apos a ultima rodada ri passa do fim; toque residual do fim da fase nao pode estourar (bug pego pelo _qa/jogador.js) */

/* A VOZ QUE CONTA JUNTO. Web Speech: se o PC não tiver voz, a peça continua
   inteira — o número aparece ESCRITO dentro da semente que acende. */
function diz(txt){
  try{
    if(!window.speechSynthesis||!window.SpeechSynthesisUtterance) return;
    var u=new SpeechSynthesisUtterance(txt);
    u.lang="pt-BR"; u.rate=1; u.pitch=1.05;
    window.speechSynthesis.cancel();
    window.speechSynthesis.speak(u);
  }catch(e){}
}
function nomeNum(n){ return (n>=0&&n<NUM.length) ? NUM[n] : (""+n); }
/* ⭐ FALA UM NÚMERO e avisa quando TERMINOU — para a luz acompanhar a voz e
   nunca pular (Marcos, ago/2026, cobrado 3x). `pronto()` só dispara quando a
   voz acabou de dizer o número INTEIRO **e** já passou um tempo mínimo de
   contagem (para não correr num PC que devolve `onend` na hora / sem voz).
   Antes a contagem tinha DOIS relógios (setTimeout fixo × Web Speech), que
   desencontravam; agora quem manda no ritmo é a VOZ. */
/* ⚠️⚠️ LIÇÃO PAGA (Marcos, ago/2026, Feirinha da Dona Coruja): a versão
   "guiada pela voz" (esperava `speechSynthesis.onend` para andar) TRAVAVA no
   Chrome real — depois da 1ª contagem os números PARAVAM de aparecer, porque o
   `onend` do navegador não vinha e a cadeia de `passo` ficava esperando para
   sempre. Também era a voz-ROBÔ do navegador, diferente da voz gravada do resto
   (por isso "não conta junto"). Conserto:
     · RITMO = relógio fixo (850ms). Nunca trava; os números sempre aparecem.
     · VOZ = a GRAVADA da casa (`diz`, a mesma de todo o resto → "contar junto"),
       tocada em paralelo, sem controlar o compasso.
   A luz não pula porque o passo (850ms) é um pouco maior que a palavra falada. */
function dizConta(txt, pronto){
  /* ⭐ SINCRONIA PERFEITA (Marcos, ago/2026: "tem que contar em pausa, em
     sintonia com a luz... ela pula os números, tudo tem que estar em sintonia").
     A PRÓXIMA semente só acende quando a VOZ GRAVADA deste número TERMINA — usa o
     `falar(id, cb)` do motor, cujo `cb` vem do evento `ended` do áudio. Assim a
     luz nunca corre na frente da voz e nunca pula. Um respiro curto (220ms) entre
     os números dá o compasso de "contar junto". Rede de segurança: se o áudio não
     vier (bloqueado/lento), um teto solta o passo — nunca trava. */
  try{
    if(typeof temVoz==="function" && typeof falar==="function"){
      var k=temVoz(txt);
      if(k){
        var foi=false, segue=function(){ if(foi) return; foi=true; if(pronto) setTimeout(pronto,220); };
        falar("op_"+k, segue);
        setTimeout(segue, 2600);      /* teto de segurança: nunca trava */
        return;
      }
    }
  }catch(e){}
  /* bancada / sem gravação: voz best-effort + ritmo fixo (não trava) */
  try{ if(typeof diz==="function") diz(txt); }catch(e){}
  setTimeout(function(){ if(pronto) pronto(); }, 850);
}
function sPoe(){ nota(392,.07,.13,"triangle",0); nota(523.25,.09,.11,"triangle",.05); }
function sTira(){ nota(392,.07,.12,"triangle",0); nota(294,.09,.11,"triangle",.05); }
function sConta(){ nota(659.25,.05,.10,"triangle",0); }

function pecaContadores(){
  if(!CNT[ri]){ fimDaPeca(); return; }
  var r=CNT[ri];
  qtd=r.ini; err=0; molde=false; contando=false; ger++;
  limpa();
  var t=el("div","tela");
  setProg(t, Math.round(ri*100/CNT.length));
  var c=el("div","centro");
  var TM=temaR();
  c.appendChild(el("div","selo",TM.selo));
  c.appendChild(el("div","balao",TM.verbo+" <b>"+r.alvo+"</b> "+TM.pl+" "+TM.onde+"."));
                   /* ⚠️ Marcos (ago/2026): NAO repetir o numero por extenso entre
                      parenteses ("10 (dez)") — o digito basta no enunciado; a VOZ
                      ja diz o numero. Redundancia polui a leitura da crianca. */
  elCant=el("div","canteiro"+(TM.item?"":" terra"),"");
  c.appendChild(elCant);
  elMolde=el("div","molde","");
  c.appendChild(elMolde);

  var lin=el("div","linc");
  btMenos=el("button","btn menos","&minus; tirar");
  elMostra=el("div","mostra","<i>NA TERRA</i><b>0</b>");
  btMais=el("button","btn mais","+ p&ocirc;r");
  btMenos.onclick=function(){ tira(); };
  btMais.onclick=function(){ poe(); };
  lin.appendChild(btMenos); lin.appendChild(elMostra); lin.appendChild(btMais);
  c.appendChild(lin);

  var cc=el("div","cconta");
  btConta=el("button","btn","Contar comigo");
  btConta.onclick=function(){ contaComigo(); };
  cc.appendChild(btConta);
  c.appendChild(cc);

  elTotal=el("div","total","");
  c.appendChild(elTotal);
  c.appendChild(el("div","hint","Canteiro "+(ri+1)+" de "+CNT.length+
                   ". Ponha uma de cada vez e depois conte."));
  t.appendChild(c);
  app.appendChild(t);
  desenha(0);
}

function desenha(novas){
  var i,s;
  elCant.innerHTML="";
  for(i=0;i<qtd;i++){
    s=fazSem((novas>0&&i>=qtd-novas)?"sem nova":"sem");
    elCant.appendChild(s);
  }
  if(qtd===0) elCant.appendChild(el("div","sem vazia",""));
  elMostra.innerHTML="<i>"+temaR().label+"</i><b>"+qtd+"</b>";
  desenhaMolde();
  atualizaBotoes();
}

/* O APOIO CONCRETO (2º degrau): um lugar para cada semente. É a correspondência
   um-a-um — a criança vê o buraco vazio em vez de ouvir "está errado". */
function desenhaMolde(){
  var i,v;
  elMolde.innerHTML="";
  if(!molde) return;
  for(i=0;i<alvoAtual();i++){
    v=el("div",(i<qtd)?"mvaga cheia":"mvaga","");
    elMolde.appendChild(v);
  }
  elMolde.appendChild(el("div","molderot","um lugar para cada "+temaR().sing));
}

function atualizaBotoes(){
  var a=alvoAtual();
  btMais.removeAttribute("data-qa");
  btMenos.removeAttribute("data-qa");
  btConta.removeAttribute("data-qa");
  btMenos.className=(qtd<=0)?"btn menos off":"btn menos";
  btMais.className=(qtd>=MAXSEM)?"btn mais off":"btn mais";
  btConta.className="btn";
  /* data-qa="1" = "este serve AGORA": só o auditor-jogador usa. */
  if(contando) return;
  if(qtd<a) btMais.setAttribute("data-qa","1");
  else if(qtd>a) btMenos.setAttribute("data-qa","1");
  else btConta.setAttribute("data-qa","1");
}

function poe(){
  if(contando) return;
  if(qtd>=MAXSEM){ sTap(); return; }
  qtd++;
  sPoe();
  desenha(1);
  diz(nomeNum(qtd));            /* a voz conta junto com a semente que cai */
  limpaTotal();
}
function tira(){
  if(contando) return;
  if(qtd<=0){ sTap(); return; }
  qtd--;
  sTira();
  desenha(0);
  diz(nomeNum(qtd));
  limpaTotal();
}
function limpaTotal(){
  elTotal.className="total";
  elTotal.innerHTML="";
}

/* CONTAR COMIGO: acende uma semente de cada vez, diz o número em voz alta e
   escreve o número dentro dela. O TOTAL só existe no fim — é o último número
   dito (cardinalidade), nunca um número digitado. */
function contaComigo(){
  if(contando) return;
  contando=true;
  atualizaBotoes();
  limpaTotal();
  var itens=elCant.getElementsByClassName("sem"), i=0, g=ger;
  if(qtd===0){
    contando=false;
    atualizaBotoes();
    elTotal.className="total";
    elTotal.innerHTML="Est&aacute; vazio: <b>zero</b>. Quantas faltam?";
    diz("zero");
    naoBateu();
    return;
  }
  var passo=function(){
    if(g!==ger) return;
    if(i>=qtd){ fechaContagem(); return; }
    /* ⭐ Marcos (ago/2026): na hora de CONTAR, o item vira a BOLA com o NÚMERO
       dentro (para o número aparecer bem claro). A fruta é só no ATO de pôr; ao
       ser contada, ela acende como bola numerada. */
    itens[i].style.backgroundImage="";
    itens[i].className="sem acesa";
    itens[i].innerHTML=""+(i+1);
    sConta();
    var n=i+1;
    i++;
    /* ⚠️ Marcos (ago/2026, 3x): a LUZ acompanha a VOZ e NÃO pula números. A
       próxima semente só acende quando a voz TERMINA de dizer este número
       (`dizConta` avisa no fim) e depois de um respiro curto. A voz manda no
       compasso — nada de setTimeout fixo correndo por fora. */
    dizConta(nomeNum(n), function(){ if(g===ger) setTimeout(passo,260); });
  };
  passo();
}

function fechaContagem(){
  var a=alvoAtual(), g=ger;
  contando=false;
  atualizaBotoes();
  if(qtd===a){
    /* ⚠️ dica VELHA some quando ela já fez o que a dica pedia — andaime que
       continua mandando fazer o que está feito confunde mais do que ajuda. */
    var dv=document.getElementById("dicaP");
    if(dv&&dv.parentNode) dv.parentNode.removeChild(dv);
    elTotal.className="total ok";
    elTotal.innerHTML="Contamos <b>"+qtd+"</b>: s&atilde;o "+nomeNum(qtd)+" "+temaR().pl+"!";
    diz("Total: "+nomeNum(qtd)+". Você conseguiu!");
    sCerto();
    setTimeout(function(){
      if(g!==ger) return;
      ri++;
      if(ri<CNT.length) pecaContadores();
      /* ⚠️ o fim passa PELO BANNER de propósito: o auditor-jogador só reconhece
         que acabou quando a `.medal` aparece LOGO DEPOIS de um toque dele. */
      else mostraBanner("<b>Voc&ecirc; contou tudo!</b><br>O total &eacute; o &uacute;ltimo n&uacute;mero da contagem.", fimDaPeca);
    },800);
    return;
  }
  elTotal.className="total";
  elTotal.innerHTML="Contamos <b>"+qtd+"</b>, e a gente queria <b>"+a+"</b>.";
  diz("Contamos "+nomeNum(qtd)+". A gente queria "+nomeNum(a));
  naoBateu();
}

/* O ANDAIME QUE CRESCE: pergunta -> um lugar para cada semente -> diz quantas
   faltam e aponta o botão. Nunca a palavra "errou". */
function naoBateu(){
  var a=alvoAtual(), falta=a-qtd;
  sErro();
  err++;
  if(err===1){
    mostraDica("Conte de novo bem devagar, uma de cada vez. "+
               (falta>0?"Falta muito para chegar em <b>"+a+"</b>?"
                       :"Ser&aacute; que tem "+temaR().sing+" <b>sobrando</b>?"));
  }else if(err===2){
    molde=true;
    desenhaMolde();
    mostraDica("Olhe os lugares a&iacute; embaixo: <b>um lugar para cada "+temaR().sing+"</b>. "+
               (falta>0?"Ainda tem lugar vazio?":"Sobrou "+temaR().sing+" fora do lugar?"));
  }else{
    if(falta>0){
      mostraDica("Faltam <b>"+falta+"</b>. Toque em <b>+ p&ocirc;r</b> "+falta+
                 (falta>1?" vezes.":" vez."));
      btMais.className="btn mais aponta";
    }else{
      mostraDica("Sobra"+((-falta)>1?"m":"")+" <b>"+(-falta)+"</b>. Toque em <b>&minus; tirar</b> "+
                 (-falta)+((-falta)>1?" vezes.":" vez."));
      btMenos.className="btn menos aponta";
    }
  }
}

/* ⚠️⚠️ TODA PECA FECHA POR `fimDaPeca` (set/2026). Esta peca terminava numa
   funcao com nome proprio — e o integrador so consegue religar a continuacao do
   motor em quem termina por `fimDaPeca` (ele reaponta esse nome antes de a peca
   comecar). Havia dois caminhos ate a tela de BANCADA ("peca fechada", "Jogar de
   novo"): o callback do banner, que o integrador troca, e a guarda "acabaram as
   rodadas", que ele NAO via — a crianca podia cair no beco. Um nome so fecha os
   dois. Na bancada nada muda: `fimDaPeca` e a tela de sempre. */
function fimDaPeca(){
  ger++;
  limpa();
  var t=el("div","tela");
  setProg(t,100);
  var c=el("div","centro");
  c.appendChild(el("div","selo","PE&Ccedil;A FECHADA"));
  c.appendChild(el("div","medal",""));
  c.appendChild(el("div","balao","Voc&ecirc; montou <b>"+CNT.length+"</b> canteiros contando "+
                   "de um em um."));
  var b=el("button","btn","Jogar de novo");
  b.onclick=function(){ ri=0; pecaContadores(); };
  c.appendChild(b);
  c.appendChild(el("div","hint","O total n&atilde;o se adivinha: ele &eacute; o &uacute;ltimo "+
                   "n&uacute;mero da contagem."));
  t.appendChild(c);
  app.appendChild(t);
}

pecaContadores();
</script>
</body></html>
