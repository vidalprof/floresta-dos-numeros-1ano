<!DOCTYPE html>
<html lang="pt-BR"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>PEÇA — digitar-numero (digite o resultado)</title>
<!-- ============================================================
     PEÇA: DIGITAR-NUMERO / DIGITE O RESULTADO (teclado numérico + suporte visual)
     Cópia do MOLDE.html — só o bloco "A PEÇA COMEÇA AQUI" mudou.

     Pedido do Marcos (ago/2026): *"digitar resultado com suporte visual"*. A
     criança CALCULA uma conta e digita a resposta num TECLADO NUMÉRICO; as
     frutas da conta ficam desenhadas para ela CONTAR (concreto → figural →
     simbólico, Bruner/CPA).

     Armadilhas desta mecânica (_padrao/DINAMICAS.md, linha "digitar-numero"),
     medidas pelo `_qa/dinamicas.py`:
       · AS DUAS PORTAS: teclado numérico 0-9 na tela (alvo ≥48px) **e**
         `document.onkeydown` (dígitos + Backspace). No PC da escola tem teclado
         e a criança vai digitar; no celular, não tem;
       · A VOZ DO DÍGITO: cada tecla diz o número por extenso ao ser tocada
         (mapa `NOMEDIG` + `diz`) e o alto-falante diz a conta ("três mais
         dois"). Marcos: *"o alto-falante nas respostas também, para ajudar os
         alunos que não sabem ler"*;
       · O SUPORTE VISUAL É ARTE DE IA, NÃO CSS (campo `img`, do motor por
         `figEl`). Na subtração as ÚLTIMAS `b` frutas saem riscadas (modelo
         "tirar"). Sem `img`/`figEl` cai numa ficha neutra só na bancada;
       · tremor/pisca com DUAS classes + `setTimeout`, NUNCA `@keyframes` (o
         integrador prefixa o CSS e engole os keyframes da peça);
       · o andaime CRESCE (dica → frutas piscam/conte → revela e segue), nunca
         "errou", nunca trava;
       · ⚠️ o `setTimeout` que troca de rodada continua correndo depois que a
         tela sai: sem o guarda `!telaAtual.parentNode` ele reinstala o
         `onkeydown` POR CIMA da tela seguinte. Guarda no temporizador E dentro
         do próprio `teclaReal`;
       · `data-qa` com a resposta da vez em `.numtecs`, para o auditor-jogador
         bater dígito a dígito e terminar a peça sozinho.
     ============================================================ -->
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
/* ⚠️ A BANCADA TAMBEM DECLARA O TEMA (ago/2026). As pecas passaram a usar
   `var(--texto)` para seguir a atividade em que caem — mas aqui, sozinha,
   nao havia quem definisse o token, e a cor de reserva escura caia no fundo
   escuro da propria bancada: 1,06:1. O molde define o token que combina com
   o fundo DELE; a atividade redefine com o dela. */
:root{--texto:#f4efe6}
body{margin:0;font-family:"Segoe UI",Arial,sans-serif;background:#2b2118;color:#f4efe6}
#app{max-width:520px;margin:0 auto;padding:10px 12px 28px}
.prog{height:9px;background:rgba(255,255,255,.16);border-radius:9px;overflow:hidden;margin:6px 0 12px}
.prog i{display:block;height:100%;background:#59c24b;width:0;-webkit-transition:width .5s;transition:width .5s}
.selo{display:inline-block;background:#3c6ee0;color:#fff;font-weight:700;font-size:13px;
      letter-spacing:.4px;padding:6px 14px;border-radius:20px;margin:0 auto 10px;display:block;
      width:-webkit-fit-content;width:fit-content}
.balao{position:relative;background:rgba(255,253,246,.96);color:#221a12;border-radius:20px;
       padding:13px 17px;font-size:17px;font-weight:600;text-align:center;line-height:1.35;
       box-shadow:0 5px 16px rgba(0,0,0,.28)}
.balao b{color:#1f6b12}
.balao + *{margin-top:13px}
.centro{text-align:center}
.opts{display:block}
.opt{display:block;background:#fffdf6;color:#221a12;border:0;border-radius:16px;padding:13px 16px;
     margin:9px auto;font-size:16px;font-weight:600;min-height:48px;max-width:430px;cursor:pointer;
     box-shadow:0 4px 0 #c9bda6}
.opt:active{-webkit-transform:translateY(3px);transform:translateY(3px);box-shadow:0 1px 0 #c9bda6}
.opt.ok{background:#d6f5c8;box-shadow:0 4px 0 #7cb464}
.opt.no{background:#f7d9d2;box-shadow:0 4px 0 #c08c80}
.hint{font-size:14px;opacity:.85;margin-top:10px}
.dica{background:#fff3c9;color:#3a2c07;border-radius:14px;padding:10px 14px;margin-top:12px;
      font-size:15px;font-weight:600}
.tela{display:block}
/* ⚠️ o banner escondido nao pode contar como "resposta fora da tela": ele nao
   existe para a crianca ainda. `visibility` tira do alcance do dedo e do
   leitor de tela — so `bottom:-260px` deixava o botao clicavel no escuro. */
.banner{position:fixed;left:0;right:0;bottom:-260px;background:#1f6b12;color:#fff;text-align:center;
        padding:18px 16px 22px;border-radius:22px 22px 0 0;visibility:hidden;
        -webkit-transition:bottom .35s;transition:bottom .35s}
.banner.show{bottom:0;visibility:visible}
.btn{background:#ffd54a;color:#33280a;border:0;border-radius:16px;padding:13px 26px;font-size:17px;
     font-weight:800;min-height:48px;cursor:pointer;box-shadow:0 4px 0 #c9a52f}
/* ---------------- CSS DESTA PEÇA: DIGITE O RESULTADO ---------------- */
/* ⚠️ os 13px de folga em cima sao obrigatorios: o balao tem sombra e nenhuma
   margem por baixo, entao o que vem colado nele vira um bloco so (regra 9 do
   _qa/leiaute.js, cobrada DUAS vezes pelo Marcos). */
/* a linha da PERGUNTA + o alto-falante que diz a CONTA por extenso (copiado
   do `digitar`): o que a crianca VE (a conta) e o que ela OUVE, juntos. */
.dglin{display:-webkit-box;display:-webkit-flex;display:flex;
      -webkit-box-align:center;align-items:center;
      -webkit-box-pack:center;justify-content:center;
      margin:8px auto 0;max-width:430px}
/* ⚠️ ESTE TEXTO CARREGA A MESA DELE (ago/2026): fundo proprio para ser legivel
   em qualquer tema — cor fixa clara morre no tema claro; seguir `--texto`
   morre no tema escuro. A mesa resolve nos dois. */
.dgpista{display:inline-block;font-size:15px;font-weight:700;line-height:1.25;
      text-align:center;background:rgba(18,16,12,.62);border-radius:10px;padding:4px 10px;color:#f7f3ea}
/* ⭐ O SUPORTE VISUAL: a conta desenhada com frutas. Flex-WRAP para que contas
   grandes quebrem em varias linhas sem estourar a tela. */
.dncontas{display:-webkit-box;display:-webkit-flex;display:flex;
      -webkit-flex-wrap:wrap;flex-wrap:wrap;
      -webkit-box-align:center;align-items:center;
      -webkit-box-pack:center;-webkit-justify-content:center;justify-content:center;
      max-width:900px;margin:12px auto 6px;padding:12px 14px;
      background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.45);border-radius:20px;
      -webkit-transition:box-shadow .18s ease;transition:box-shadow .18s ease}
/* 2o degrau do andaime: a conta ACENDE (sem @keyframes — a mesma licao do molde) */
.dncontas.dnpisca{-webkit-box-shadow:0 0 0 4px #ffd54a;box-shadow:0 0 0 4px #ffd54a}
/* cada grupo = BANDEJA com 5 frutas por fileira (quadro de dez): quantidade
   maior fica facil de contar ("5 e mais 2"), nunca um amontoado. */
.dngrupo{display:-webkit-box;display:-webkit-flex;display:flex;
      -webkit-flex-wrap:wrap;flex-wrap:wrap;
      -webkit-box-align:center;align-items:center;
      -webkit-box-pack:center;-webkit-justify-content:center;justify-content:center;
      width:288px;max-width:288px;padding:8px 6px;
      background:rgba(255,255,255,.66);border:2px solid rgba(120,80,40,.20);border-radius:16px;
      -webkit-box-shadow:inset 0 1px 0 #fff,0 2px 5px rgba(0,0,0,.12);box-shadow:inset 0 1px 0 #fff,0 2px 5px rgba(0,0,0,.12)}
.dnfruta{display:-webkit-inline-box;display:-webkit-inline-flex;display:inline-flex;
      -webkit-box-align:center;align-items:center;
      -webkit-box-pack:center;-webkit-justify-content:center;justify-content:center;
      width:50px;height:50px;margin:3px}
.dnfruta img{width:48px;height:48px;max-width:100%;
      -o-object-fit:contain;object-fit:contain;object-position:center}
/* ficha neutra da BANCADA (quando nao ha arte de IA) — a crianca da atividade nunca ve */
.dnfruta.dnvazia{border-radius:50%;background:#ff8a5c;
      -webkit-box-shadow:inset 0 -3px 0 rgba(0,0,0,.18);box-shadow:inset 0 -3px 0 rgba(0,0,0,.18)}
/* fruta RISCADA (o que se TIRA na subtracao): opacidade baixa + um risco */
.dnfruta.dnriscada{opacity:.32;position:relative}
.dnfruta.dnriscada:after{content:"";position:absolute;left:2px;right:2px;top:50%;
      height:3px;margin-top:-1px;background:#c0392b;
      -webkit-transform:rotate(-18deg);transform:rotate(-18deg);border-radius:2px}
/* os sinais + − ÷ × = , grandes */
.dnsinal{display:inline-block;margin:0 6px;font-size:30px;font-weight:800;color:#221a12;background:#fff8e7;border-radius:10px;padding:2px 11px;box-shadow:0 2px 4px rgba(0,0,0,.22)}
/* número grande p/ divisão/multiplicação (5º ano: divisor de 2 algarismos, sem frutas) */
.dnbig{display:inline-block;margin:0 4px;font-size:clamp(30px,9vw,46px);font-weight:800;color:#221a12;background:#fff8e7;border-radius:12px;padding:4px 16px;box-shadow:0 2px 5px rgba(0,0,0,.22)}
/* as vagas da resposta, logo depois do "=" */
.dnvagas{display:inline-block;margin:0 0 0 4px}
/* a vaga: cheia = borda INTEIRA + o digito dentro (forma, nao so cor). E o
   digito ENTRA COMEMORANDO (duas transicoes, sem `@keyframes`). */
.vaga{display:inline-block;vertical-align:top;width:44px;height:50px;line-height:44px;margin:0 2px;
      border:3px dashed #a08e73;border-radius:12px;background:rgba(255,255,255,.10);
      color:#f4efe6;font-size:24px;font-weight:800;text-align:center;
      -webkit-transition:-webkit-transform .16s ease;transition:transform .16s ease}
.vaga.cheia{border-style:solid;border-color:#59c24b;background:#fffdf6;color:#221a12;
      -webkit-transform:scale(1.14);transform:scale(1.14)}
.vaga.cheia.pousa{-webkit-transform:none;transform:none}
/* tremor do erro: DUAS classes + transicao, NUNCA @keyframes (licao do molde) */
.vaga.cheia.treme{-webkit-transform:translateX(-7px);transform:translateX(-7px)}
.vaga.cheia.treme2{-webkit-transform:translateX(7px);transform:translateX(7px)}
/* ⭐ O TECLADO NUMERICO: teclas grandes (alvo >=48px, regra da casa) */
.numtecs{display:-webkit-box;display:-webkit-flex;display:flex;
      -webkit-flex-wrap:wrap;flex-wrap:wrap;
      -webkit-box-pack:center;-webkit-justify-content:center;justify-content:center;
      max-width:320px;margin:12px auto 4px}
.numtec{-webkit-box-flex:0;-webkit-flex:0 0 auto;flex:0 0 auto;
      width:58px;height:58px;line-height:58px;margin:5px;padding:0;
      background:#fffdf6;color:#221a12;border:0;border-radius:14px;font-size:26px;font-weight:800;
      text-align:center;cursor:pointer;-webkit-box-shadow:0 4px 0 #c9bda6;box-shadow:0 4px 0 #c9bda6;
      -webkit-transition:-webkit-transform .12s ease, box-shadow .12s ease;
      transition:transform .12s ease, box-shadow .12s ease}
.numtec:hover{-webkit-transform:translateY(-2px);transform:translateY(-2px);
      background:#fffefa;-webkit-box-shadow:0 6px 0 #c9bda6;box-shadow:0 6px 0 #c9bda6}
.numtec:active{-webkit-transform:translateY(3px);transform:translateY(3px);
      -webkit-box-shadow:0 1px 0 #c9bda6;box-shadow:0 1px 0 #c9bda6}
/* a tecla APAGAR: mesma altura, um tom mais quente */
.numtec.numdel{background:#f6e0ae;font-size:22px}
/* ⭐ O ALTO-FALANTE (pilar SONORA da casa) — o MESMO glifo do motor, disco
   claro e desenho escuro (o botao pousa no fundo da tela, nao num cartao). */
.zap{display:inline-block;vertical-align:middle;-webkit-flex:none;flex:none;
     width:46px;height:46px;min-width:46px;margin-left:10px;padding:0;border:0;
     border-radius:50%;cursor:pointer;opacity:1;
     background-color:#efe6d2;
     background-image:url("data:image/svg+xml;charset=utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 20 20'%3E%3Cpath fill='%233a3020' d='M4 7.6h3.1L11 3.9v12.2L7.1 12.4H4z'/%3E%3Cpath fill='none' stroke='%233a3020' stroke-width='1.7' stroke-linecap='round' d='M13.3 7.1a4.2 4.2 0 0 1 0 5.8'/%3E%3C/svg%3E");
     background-repeat:no-repeat;background-position:center center;
     -webkit-background-size:24px 24px;background-size:24px 24px;
     -webkit-transition:background-color .15s;transition:background-color .15s}
.zap:hover{background-color:#ded3b8}
.zap:active,.zap.tocando{background-color:#ffd54a}
.medal{width:96px;height:96px;line-height:96px;margin:6px auto 0;border-radius:50%;
       background:#ffd54a;color:#33280a;font-size:20px;font-weight:800;text-align:center;
       box-shadow:0 6px 0 #c9a52f}
@media (prefers-reduced-motion:reduce){
  .numtec,.vaga,.dncontas{-webkit-transition:none;transition:none}
  .numtec:hover{-webkit-transform:none;transform:none;box-shadow:0 4px 0 #c9bda6}
  .vaga.cheia{-webkit-transform:none;transform:none}
}
/* tela baixa: encolhe as teclas e as frutas, nunca some com elas */
@media (max-height:560px){
  .numtec{width:50px;height:50px;line-height:50px;font-size:22px;margin:4px}
  .dnfruta,.dnfruta.dnvazia{width:48px;height:48px}
  .dnfruta img{width:32px;height:32px}
}
</style></head>
<body>
<div id="app"></div>
<div id="banner" class="banner"><div id="bmsg"></div><button id="bcta" class="btn" style="margin-top:12px">Continuar</button></div>
<script>
/* ====== MOTORZINHO DA PEÇA (os mesmos nomes das atividades) ====== */
var app=document.getElementById("app"), banner=document.getElementById("banner"),
    bmsg=document.getElementById("bmsg"), bcta=document.getElementById("bcta");
function el(t,c,h){var e=document.createElement(t);if(c)e.className=c;if(h!==undefined&&h!==null)e.innerHTML=h;return e;}
function limpa(){app.innerHTML="";}
function setProg(t,p){var pr=el("div","prog");var i=el("i");i.style.width=p+"%";pr.appendChild(i);t.appendChild(pr);}
/* ⚠️ A DICA TEM QUE CABER NA TELA (ago/2026). Ela era o ULTIMO filho do
   `.centro`, e em janela apertada (320x568 e 1024x420 — o monitor da escola)
   caia 25 a 96 px ABAIXO DA DOBRA: a crianca que errou precisava ROLAR para ler
   a ajuda, justo no momento em que esta perdida. Agora ela entra LOGO DEPOIS do
   enunciado, que e onde o olho ja esta. Defeito estrutural: valia para as 57
   pecas de uma vez. */
function mostraDica(txt){var d=document.getElementById("dicaP");
  if(!d){ d=el("div","dica"); d.id="dicaP";
    var b=app.getElementsByClassName("balao")[0];
    if(b&&b.parentNode) b.parentNode.insertBefore(d,b.nextSibling);
    else (app.querySelector(".centro")||app).appendChild(d);
  } d.innerHTML=txt;}
function mostraBanner(msg,cb){bmsg.innerHTML=msg;banner.className="banner show";festa();
  bcta.onclick=function(){banner.className="banner";if(cb)cb();};}
function baguncar(a){var i,j,x;for(i=a.length-1;i>0;i--){j=Math.floor(Math.random()*(i+1));x=a[i];a[i]=a[j];a[j]=x;}return a;}
/* som: os numeros vieram da pesquisa (PESQUISA-SOM-E-GAMEFEEL). "ding" e
   sintetizado — MP3 chega atrasado e mata a sensacao de causa-efeito. */
var AC=null;
function ac(){try{if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();
  if(AC.state==="suspended")AC.resume();}catch(e){}return AC;}
function nota(f,dur,vol,tipo,atraso){var c=ac();if(!c)return;
  var o=c.createOscillator(),g=c.createGain(),t=c.currentTime+(atraso||0);
  o.type=tipo||"triangle";o.frequency.value=f;
  g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol||.18,t+.014);
  g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(g);g.connect(c.destination);o.start(t);o.stop(t+dur+.02);}
function sCerto(){nota(523.25,.35,.18,"triangle",0);nota(659.25,.35,.16,"triangle",.055);nota(783.99,.35,.15,"triangle",.11);}
function sErro(){nota(300,.14,.12,"sine",0);nota(318,.14,.12,"sine",0);}
function sTap(){nota(880,.012,.10,"square",0);}
function festa(){sCerto();}
document.addEventListener("pointerdown",function(){ac();},false);
</script>
<script>
/* ====== A PEÇA COMEÇA AQUI ====== */
/* DIGITE O RESULTADO — a crianca CALCULA uma conta e digita a resposta num
   TECLADO NUMERICO na tela, COM SUPORTE VISUAL: as frutas da conta desenhadas
   para ela CONTAR. Pedido do Marcos (ago/2026): "digitar resultado com suporte
   visual". Concreto -> figural -> simbolico (Bruner/CPA): a crianca conta as
   frutas, ve a conta e escreve o numero.
   ⭐ Cada conta traz:
     · a, b     = os dois numeros; op = "+" ou "-";
     · img      = a arte de IA da fruta (sem a pasta e sem o `.png`), que vira o
                  SUPORTE VISUAL. OPCIONAL: sem ela (ou sem o motor) a conta
                  aparece com fichas neutras — a fase roda, e o contrato;
     · resp     = o resultado (define QUANTAS vagas tem a resposta);
     · dic      = o 1o degrau do andaime.                                        */
var ENUN="Digite quanto d&#225;.";
var FECHO="Voc&#234; calculou todas as contas!";
var CONTAS=[
  {a:3,b:2,op:"+",img:"",resp:5,dic:"Conte as 3 e continue: <b>4, 5</b>."},
  {a:8,b:3,op:"-",img:"",resp:5,dic:"Do 8, tire 3: <b>7, 6, 5</b>."},
  {a:84,b:7,op:"÷",resp:12,dic:"Quantas vezes o <b>7</b> cabe no 84? Pense na tabuada do 7."}
];
var DIGS="0123456789"; /*TECNICA*/
var rodada=0, escrito="", errosSeg=0, telaAtual=null, barraP=null;
var resp="", vagas=[], numteclas=[];

/* o digito por extenso: a tecla FALA o numero ao ser tocada (apoio de quem
   ainda nao le o algarismo — Marcos, ago/2026: "o alto-falante nas respostas
   tambem, para ajudar os alunos que nao sabem ler"). */
var NOMEDIG={"0":"zero","1":"um","2":"dois","3":"três","4":"quatro",
  "5":"cinco","6":"seis","7":"sete","8":"oito","9":"nove"};
/* o sinal por extenso, para o alto-falante da conta */
var OPNOME={"+":"mais","-":"menos","−":"menos","÷":"dividido por",":":"dividido por","/":"dividido por","×":"vezes","x":"vezes","*":"vezes"};
function ehDivMult(op){ return op==="÷"||op===":"||op==="/"||op==="×"||op==="x"||op==="*"; }

/* ⚠️ A FIGURA (a fruta do suporte visual) vem do MOTOR (`imgEl`, que sabe onde
   mora a pasta `img/`). Aqui na bancada ela nao existe, e a conta aparece com
   fichas neutras — que e o proprio contrato: `img` e OPCIONAL. Pegar por
   `window.imgEl` (e nao `typeof imgEl`) deixa o nome DECLARADO, e o portao
   "funcao que nao existe" consegue medir. */
var figEl = window.imgEl || null;

/* ⚠️⚠️ A VOZ É GRAVADA, SEMPRE. Dentro da atividade montada a ponte do
   integrador REAPONTA este `diz` para o mp3 da casa (Edge TTS). Sozinha, na
   bancada, a peça fica calada de propósito: voz-robô do navegador nunca vai
   para a criança (portão `_qa/vozrobo.py`). */
function diz(txt){
  if(!txt) return;
  if(typeof window.temVoz!=="function"||typeof window.tocaVoz!=="function") return;
  var k=window.temVoz(txt);
  if(k) window.tocaVoz(k);
}
function sPing(){ nota(880,.09,.12,"triangle",0); }

/* a conta por extenso, para o alto-falante: "tres mais dois" / "oito menos tres" */
function contaFalada(r){
  return String(NOMEDIG[String(r.a)]||r.a)+" "+(OPNOME[r.op]||r.op)+" "
    +String(NOMEDIG[String(r.b)]||r.b);
}

/* ⭐ O ALTO-FALANTE QUE DIZ A CONTA — o apoio de quem ainda nao le os sinais.
   ⚠️ ele NAO digita nada: so fala. O evento para nele para que tocar no botao
   nunca conte como digito. (copiado do `digitar`) */
function fazZap(txt,rot){
  var z=el("button","zap","");
  z.type="button";
  z.setAttribute("aria-label","Ouvir "+(rot||txt));
  /* ⭐ DECLARA a voz (o motor e o portao fala_o_escrito leem data-voz). Sem
     isto o portao caia no texto do balao pai ("Quanto da?") e reprovava,
     e o motor nao tinha como saber que este alto-falante diz a CONTA. */
  z.setAttribute("data-voz",txt);
  z.onclick=function(ev){
    var e=ev||window.event;
    if(e.stopPropagation) e.stopPropagation(); else e.cancelBubble=true;
    if(e.preventDefault) e.preventDefault();
    sPing(); diz(txt);
    z.className="zap tocando";
    setTimeout(function(){ z.className="zap"; },900);
    return false;
  };
  return z;
}

/* ---------- o SUPORTE VISUAL: a conta desenhada com frutas ---------- */
/* ⭐🎨 REGRA DA CASA (Marcos, ago/2026): "nas interacoes dinamicas sempre usar
   imagens geradas pela IA". A fruta e ARTE DE IA (`figEl`), nunca desenho de
   CSS. So na bancada, quando nao ha `figEl`, cai numa ficha neutra (`.dnvazia`)
   — que a crianca da atividade NUNCA ve. */
function grupoFrutas(n,img,riscarDoFim){
  var g=el("div","dngrupo",""), i, corte=(riscarDoFim||0);
  for(i=0;i<n;i++){
    var celf=el("span","dnfruta","");
    if(img&&figEl){ celf.appendChild(figEl(img)); }
    else{ celf.className="dnfruta dnvazia"; } /* reserva neutra de bancada */
    /* na subtracao, as ULTIMAS `corte` frutas saem riscadas: e o que se TIRA */
    if(corte&&i>=n-corte) celf.className=celf.className+" dnriscada";
    g.appendChild(celf);
  }
  return g;
}
/* monta a linha da conta e devolve a caixa; a crianca le da esquerda para a
   direita: [frutas] [sinal] ... [=] [vagas]. Para grupos grandes o CSS quebra
   em varias linhas (flex-wrap), para nao estourar a tela. */
function suporteVisual(r){
  var box=el("div","dncontas","");
  /* ⭐ DIVISÃO/MULTIPLICAÇÃO (5º ano): números grandes, SEM frutas — 84 frutas
     seria um amontoado. A conta aparece simbólica: "84 ÷ 7 = [ ]". */
  if(ehDivMult(r.op)){
    var sinal=(r.op==="×"||r.op==="x"||r.op==="*")?"×":"÷";
    box.appendChild(el("span","dnbig",String(r.a)));
    box.appendChild(el("span","dnsinal",sinal));
    box.appendChild(el("span","dnbig",String(r.b)));
    box.appendChild(el("span","dnsinal","="));
    return box;
  }
  /* ⭐ DOIS BLOCOS (Marcos, ago/2026): bloco à esquerda, sinal no meio, bloco à
     direita, `=` e resposta — tudo numa linha, sinais alinhados. Vale para + e −. */
  box.appendChild(grupoFrutas(r.a,r.img,0));
  box.appendChild(el("span","dnsinal",(r.op==="-"?"−":"+")));
  box.appendChild(grupoFrutas(r.b,r.img,0));
  box.appendChild(el("span","dnsinal","="));
  return box;
}

function telaConta(){
  limpa();
  escrito=""; errosSeg=0; vagas=[]; numteclas=[];
  var r=CONTAS[rodada];
  resp=String(r.resp);
  var t=el("div","tela"); telaAtual=t;
  setProg(t,Math.round(rodada*100/CONTAS.length));
  barraP=t.querySelector(".prog i");
  var c=el("div","centro"), i;
  c.appendChild(el("div","selo","CONTA "+(rodada+1)+" DE "+CONTAS.length));
  c.appendChild(el("div","balao",ENUN));
  /* a pergunta com o alto-falante que fala a conta por extenso: o que a crianca
     VE (a conta) e o que ela OUVE ("tres mais dois"), juntos. */
  var ln=el("div","dglin","");
  ln.appendChild(el("span","dgpista",(r.op==="-"?"Quanto sobra?":"Quanto d&#225;?")));
  ln.appendChild(fazZap(contaFalada(r),"a conta"));
  c.appendChild(ln);
  /* O SUPORTE VISUAL + as vagas da resposta, logo depois do "=" */
  var box=suporteVisual(r);
  var cx=el("span","dnvagas","");
  for(i=0;i<resp.length;i++){ var v=el("div","vaga",""); cx.appendChild(v); vagas.push(v); }
  box.appendChild(cx);
  c.appendChild(box);
  /* O TECLADO NUMERICO na tela: 0-9 grandes + APAGAR. `data-qa` na caixa e so
     para o auditor-jogador (ele bate digito por digito, na ordem da resposta);
     a crianca nao ve nada disso. */
  var tec=el("div","numtecs");
  tec.setAttribute("data-qa",resp);
  var d;
  for(i=0;i<=9;i++){
    d=el("button","numtec",String(i));
    d.type="button";
    d.dig=String(i);
    d.onclick=toqueNum;
    tec.appendChild(d); numteclas.push(d);
  }
  /* a tecla APAGAR (tira o ultimo digito) */
  var del=el("button","numtec numdel","⌫");
  del.type="button";
  del.setAttribute("aria-label","Apagar");
  del.onclick=function(){ if(!telaAtual||!telaAtual.parentNode) return; sTap(); apagaUm(); };
  tec.appendChild(del);
  c.appendChild(tec);
  c.appendChild(el("div","hint","Toque nos n&#250;meros <b>ou</b> use o teclado do computador."));
  t.appendChild(c); app.appendChild(t);
  /* PORTA 2: o teclado de verdade. No PC da escola tem teclado e a crianca vai
     digitar; no celular, nao tem. Nunca so uma porta (regra das DUAS PORTAS). */
  document.onkeydown=teclaReal;
}

/* ---------- as DUAS portas de entrada do mesmo digito ---------- */
/* ⭐ a tecla DIZ O PROPRIO NUMERO ao ser tocada (voz da casa): a crianca ouve
   "cinco" enquanto escreve o 5 — apoio de quem ainda nao le o algarismo. */
function toqueNum(){
  if(!telaAtual||!telaAtual.parentNode) return;
  sTap(); diz(NOMEDIG[this.dig]||this.dig);
  poeDigito(this.dig);
}
/* ⚠️ o guarda `!telaAtual.parentNode` aqui e o que impede o teclado de ficar
   preso na fase anterior quando a tela ja trocou. */
function teclaReal(ev){
  if(!telaAtual||!telaAtual.parentNode) return;
  var k=ev.key||"";
  if(!k&&(ev.keyCode||ev.which)) k=String.fromCharCode(ev.keyCode||ev.which);
  k=String(k);
  if(k==="Backspace"||k==="Delete"){ sTap(); apagaUm(); return; }
  if(k.length!==1||DIGS.indexOf(k)<0) return;
  sTap(); diz(NOMEDIG[k]||k);
  poeDigito(k);
}

/* ---------- a regra da fase ---------- */
function poeDigito(d){
  if(!telaAtual||!telaAtual.parentNode) return;
  if(escrito.length>=resp.length) return;
  var v=vagas[escrito.length];
  v.className="vaga cheia";
  v.innerHTML=d;
  /* ⭐ o digito entra COMEMORANDO: cresce e pousa de volta (duas transicoes,
     sem `@keyframes` — ver a licao no destreme/CSS). */
  pousaVaga(v);
  escrito=escrito+d;
  sCerto();
  if(escrito.length>=resp.length) confere();
}
function apagaUm(){
  if(!telaAtual||!telaAtual.parentNode) return;
  if(!escrito.length) return;
  escrito=escrito.slice(0,-1);
  var v=vagas[escrito.length];
  v.className="vaga"; v.innerHTML="";
}
function pousaVaga(v){
  setTimeout(function(){
    if(!telaAtual||!telaAtual.parentNode) return;
    if(v.className.indexOf("cheia")>=0&&v.className.indexOf("pousa")<0)
      v.className=v.className+" pousa";
  },170);
}
function confere(){
  if(!telaAtual||!telaAtual.parentNode) return;
  if(escrito===resp){
    errosSeg=0;
    apagaDica(); limpaPisca();
    if(barraP) barraP.style.width=Math.round((rodada+1)*100/CONTAS.length)+"%";
    fechaRodada();
  }else{
    erraConta();
  }
}
function erraConta(){
  sErro(); errosSeg++;
  /* as vagas TREMEM (duas classes + transicao, NUNCA @keyframes — a licao do
     molde `digitar`: os keyframes da peca se perdem quando o integrador prefixa
     o CSS, e o erro deixava de responder DENTRO da atividade). */
  var i;
  for(i=0;i<vagas.length;i++){ if(vagas[i].className.indexOf("cheia")>=0){ vagas[i].className="vaga cheia treme"; destreme(vagas[i]); } }
  /* LIMPA as vagas para ela tentar de novo, e sobe o ANDAIME. */
  setTimeout(function(){
    if(!telaAtual||!telaAtual.parentNode) return;
    var j;
    for(j=0;j<vagas.length;j++){ vagas[j].className="vaga"; vagas[j].innerHTML=""; }
    escrito="";
    ajuda(errosSeg);
  },300);
}
/* ⚠️ o tremor e feito com DUAS classes e transicao, nao com `@keyframes` — os
   keyframes da peca se perdem quando o integrador prefixa o CSS dela (medido
   no `pecas.css`), e o erro deixava de responder DENTRO da atividade, que e
   justamente onde a crianca esta. Esquerda -> direita -> parado. */
function destreme(b){
  setTimeout(function(){
    if(!telaAtual||!telaAtual.parentNode) return;
    if(b.className.indexOf("cheia")>=0) b.className="vaga cheia treme2";
  },110);
  setTimeout(function(){
    if(!telaAtual||!telaAtual.parentNode) return;
    if(b.className.indexOf("cheia")>=0) b.className="vaga cheia";
  },240);
}
/* o andaime CRESCE: dica -> as frutas PISCAM/contam -> revelar e seguir.
   Nunca X, nunca "errou", nunca fica travado. */
function ajuda(n){
  if(n===1){
    mostraDica(CONTAS[rodada].dic);
  }else if(n===2){
    /* 2o degrau: destaca o SUPORTE VISUAL e manda contar as frutas do resultado */
    mostraDica("Conte as frutas: s&#227;o <b>"+resp+"</b>.");
    acendeFrutas();
  }else{
    /* 3o degrau: revela, poe a resposta certa e segue */
    mostraDica("Era <b>"+resp+"</b>! Eu coloco e voc&#234; segue.");
    seguraDica(4000);
    revela();
  }
}
function acendeFrutas(){
  limpaPisca();
  var box=telaAtual&&telaAtual.getElementsByClassName("dncontas")[0];
  if(box) box.className="dncontas dnpisca";
}
function limpaPisca(){
  var box=telaAtual&&telaAtual.getElementsByClassName("dncontas")[0];
  if(box) box.className="dncontas";
}
function revela(){
  /* poe a resposta certa, digito a digito, e confere (que ai avanca) */
  limpaPisca();
  var i;
  escrito="";
  for(i=0;i<resp.length;i++){
    vagas[i].className="vaga cheia";
    vagas[i].innerHTML=resp.charAt(i);
    pousaVaga(vagas[i]);
    escrito=escrito+resp.charAt(i);
  }
  sCerto();
  if(barraP) barraP.style.width=Math.round((rodada+1)*100/CONTAS.length)+"%";
  fechaRodada();
}
/* ⚠️ LICAO PAGA (ago/2026), a mesma da `linha-do-tempo` e da `ordenar`: o 3o
   degrau do andaime escreve "Era N! Eu coloco e voce segue" e chama `revela()`
   — que poe a resposta e, no caminho do acerto, APAGA A DICA. A frase aparecia
   e sumia no mesmo pisco, justo para a crianca que mais precisava dela. A dica
   presa sai sozinha depois, para nao entulhar a tela. */
var dicaPresaAte = 0;
function seguraDica(ms){ dicaPresaAte = (new Date()).getTime() + (ms||4000); }
function apagaDica(){
  var dd=document.getElementById("dicaP");
  if(!dd||!dd.parentNode) return;
  var falta = dicaPresaAte - (new Date()).getTime();
  if(falta > 0){ setTimeout(apagaDica, falta + 30); return; }
  dd.parentNode.removeChild(dd);
}
/* ⚠️ o temporizador da rodada continua correndo depois que a tela sai. Sem o
   guarda `!telaAtual.parentNode` ele montaria a rodada seguinte por cima de
   outra tela — e o `onkeydown` ficaria preso na fase anterior. */
function fechaRodada(){
  setTimeout(function(){
    if(!telaAtual||!telaAtual.parentNode) return;
    proxima();
  },900);
}
function proxima(){
  rodada++;
  if(rodada<CONTAS.length){ telaConta(); return; }
  document.onkeydown=null;
  mostraBanner(FECHO,telaFim);
}

function telaFim(){
  limpa(); document.onkeydown=null;
  var t=el("div","tela"); telaAtual=t; setProg(t,100);
  var c=el("div","centro");
  c.appendChild(el("div","selo","PRONTO"));
  c.appendChild(el("div","medal","MEDALHA"));
  c.appendChild(el("div","balao","Voc&#234; calculou <b>contando as frutas</b>."));
  var b=el("button","btn","Jogar de novo");
  b.onclick=recomeca;
  c.appendChild(b);
  t.appendChild(c); app.appendChild(t);
}
function recomeca(){ rodada=0; telaConta(); }
telaConta();
</script>
</body></html>
