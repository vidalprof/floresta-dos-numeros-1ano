<!DOCTYPE html>
<html lang="pt-BR"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>PEÇA — teia alimentar com cascata</title>
<!-- ============================================================
     PEÇA: TEIA ALIMENTAR COM CASCATA (copiada do _padrao/pecas/MOLDE.html)

     Duas partes, e a segunda só existe por causa da primeira:
       1) TRAÇAR "quem come quem" — a criança liga cada bicho ao que ele come
          e a seta fica desenhada na tela. A teia não vem pronta: ela é
          construída, que é o que a pesquisa chama de "construir vale muito
          mais que copiar";
       2) TIRAR UM BICHO e ver o resto REAGIR EM CASCATA — as barras dos
          outros sobem e caem, uma depois da outra, na frente dela.

     As armadilhas desta mecânica (REGRAS-INTERATIVIDADE.md, linha "Sistemas /
     equilíbrio" e linha "Traçar caminho / circuito"):
       · **poucas espécies e BARRAS, nunca enxame animado** — o PC da escola é
         fraco e um bando de bichinhos andando derruba a aula. Aqui são 5
         espécies e 5 barras de CSS, sem canvas e sem laço de animação;
       · sem andaime vira "mexer à toa": por isso cada rodada PEDE qual bicho
         tirar e termina com uma pergunta sobre o que aconteceu;
       · a consequência tem que ser VISÍVEL E IMEDIATA — a barra anda em meio
         segundo, uma de cada vez, para a cascata ser vista como cascata;
       · nada essencial só na cor: a barra que muda também escreve SUBIU/CAIU
         e o nível vem em palavras (MUITOS / MÉDIO / POUCOS / SUMIU);
       · traçar: `touchmove` com tolerância, NUNCA `preventDefault` no
         `touchstart` (mata o toque no celular) e guarda `ultimoToque` contra
         o clique FANTASMA que o celular dispara depois do dedo;
       · quiz: opções EMBARALHADAS (`baguncar`), senão ela decora a posição.

     Mais o que o contrato cobra: alvo >= 44px, funciona no mudo, erro com
     sErro() + andaime que cresce (dica -> apoio -> revela), `data-qa` no que o
     auditor-jogador precisa, nunca trava e a peça termina numa `.medal`.
     ES5 puro, um arquivo só, sem biblioteca (Chrome 109 / Firefox 106).
     ============================================================ -->
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
/* ⚠️ A BANCADA TAMBEM DECLARA O TEMA (ago/2026). As pecas passaram a usar
   `var(--texto)` para seguir a atividade em que caem — mas aqui, sozinha,
   nao havia quem definisse o token, e a cor de reserva escura caia no fundo
   escuro da propria bancada: 1,06:1. O molde define o token que combina com
   o fundo DELE; a atividade redefine com o dela. */
:root{--texto:#f4efe6}
body{margin:0;font-family:"Segoe UI",Arial,sans-serif;background:#2b2118;color:#f4efe6}
#app{max-width:520px;margin:0 auto;padding:10px 12px 28px}
.prog{height:9px;background:rgba(255,255,255,.16);border-radius:9px;overflow:hidden;margin:6px 0 12px}
.prog i{display:block;height:100%;background:#59c24b;width:0;-webkit-transition:width .5s;transition:width .5s}
.selo{display:inline-block;background:#3c6ee0;color:#fff;font-weight:700;font-size:13px;
      letter-spacing:.4px;padding:6px 14px;border-radius:20px;margin:0 auto 10px;display:block;
      width:-webkit-fit-content;width:fit-content}
.balao{position:relative;background:rgba(255,253,246,.96);color:#221a12;border-radius:20px;
       padding:13px 17px;font-size:17px;font-weight:600;text-align:center;line-height:1.35;
       box-shadow:0 5px 16px rgba(0,0,0,.28)}
.balao b{color:#1f6b12}
.balao + *{margin-top:13px}
.centro{text-align:center}
.opts{display:block}
.opt{display:block;background:#fffdf6;color:#221a12;border:0;border-radius:16px;padding:13px 16px;
     margin:9px auto;font-size:16px;font-weight:600;min-height:48px;max-width:430px;cursor:pointer;
     box-shadow:0 4px 0 #c9bda6}
.opt:active{-webkit-transform:translateY(3px);transform:translateY(3px);box-shadow:0 1px 0 #c9bda6}
.opt.ok{background:#d6f5c8;box-shadow:0 4px 0 #7cb464}
.opt.no{background:#f7d9d2;box-shadow:0 4px 0 #c08c80}
.hint{font-size:14px;opacity:.85;margin-top:10px}
.dica{background:#fff3c9;color:#3a2c07;border-radius:14px;padding:10px 14px;margin-top:12px;
      font-size:15px;font-weight:600}
.tela{display:block}
/* ⚠️ o banner escondido nao pode contar como "resposta fora da tela": ele nao
   existe para a crianca ainda. `visibility` tira do alcance do dedo e do
   leitor de tela — so `bottom:-260px` deixava o botao clicavel no escuro. */
.banner{position:fixed;left:0;right:0;bottom:-260px;background:#1f6b12;color:#fff;text-align:center;
        padding:18px 16px 22px;border-radius:22px 22px 0 0;visibility:hidden;
        -webkit-transition:bottom .35s;transition:bottom .35s}
.banner.show{bottom:0;visibility:visible}
.btn{background:#ffd54a;color:#33280a;border:0;border-radius:16px;padding:13px 26px;font-size:17px;
     font-weight:800;min-height:48px;cursor:pointer;box-shadow:0 4px 0 #c9a52f}
/* ====== CSS DESTA PEÇA ====== */
/* --- parte 1: tracar quem come quem (duas colunas + linhas por cima) --- */
/* ⚠️ LARGURA DO QUADRO (mesma licao do ligar, ago/2026): a `.centro` do motor e
   flex `align-items:center`, entao um filho SEM largura ENCOLHE para o conteudo
   (~196px) e os cartoes de coluna ficam estreitos, com o texto estourando. Da
   largura cheia com teto para os 48% das colunas virarem cartoes largos. */
.ligbox{position:relative;font-size:0;margin:13px auto 0;width:94%;max-width:360px}
.lcol{display:inline-block;vertical-align:top;width:48%;font-size:15px}
.lesq{margin-right:4%}
.ldir{margin-right:0}
/* os DOIS lados usam .lig: dentro de uma atividade e essa classe que ganha o
   alto-falante automatico do motor. min-height 62px = alvo folgado. */
.lig{display:block;width:100%;min-height:62px;background:#fffdf6;color:#221a12;border:0;
     border-radius:14px;padding:11px 10px;margin-bottom:8px;font-size:14px;font-weight:700;
     line-height:1.28;cursor:pointer;box-shadow:0 4px 0 #c9bda6;
     -webkit-user-select:none;user-select:none}
.lig.sel{background:#fff3c9;box-shadow:0 0 0 4px #ffd54a,0 4px 0 #c9a52f;
         -webkit-transform:translateY(-3px);transform:translateY(-3px)}
.lig.feita{background:#d6f5c8;box-shadow:0 3px 0 #7cb464;cursor:default}
.lig.pisca{background:#fff3c9;box-shadow:0 0 0 4px #ffd54a,0 4px 0 #c9a52f}
.linhas{position:absolute;left:0;top:0;right:0;bottom:0;z-index:5;pointer-events:none}
.linha{position:absolute;height:6px;margin-top:-3px;border-radius:6px;background:#8fe07a;
       -webkit-transform-origin:0 50%;transform-origin:0 50%}
.linha.viva{background:#ffd54a}
/* --- parte 2: as barras da teia (o motor da cascata) --- */
/* a LINHA de uma especie e um .opt: alvo grande, ja estilizado, e e a classe
   que o auditor-jogador enxerga. Dentro dela: nome, barra e as palavras. */
.esp{text-align:left;padding:10px 12px}
.espn{display:inline-block;width:33%;vertical-align:middle;font-size:14px;font-weight:800}
.espb{display:inline-block;width:38%;vertical-align:middle;height:18px;border-radius:9px;
      background:#e3dcc9;overflow:hidden}
.espf{display:block;height:100%;width:0;background:#3f8f2c;border-radius:9px;
      -webkit-transition:width .5s;transition:width .5s}
.espq{display:inline-block;width:27%;vertical-align:middle;text-align:right;
      font-size:12px;font-weight:700;line-height:1.2}
.espd{display:block;font-size:11px;font-weight:800;color:#1f4b8f}
/* o bicho tirado da teia: alem da cor, a palavra SAIU e a barra vazia */
.esp.fora{background:#e8e2d4;box-shadow:0 3px 0 #b7ad96;cursor:default;opacity:.9}
.esp.fora .espf{width:0}
/* o pedido da rodada quando a crianca erra duas vezes: borda amarela grossa */
.esp.pisca{background:#fff3c9;box-shadow:0 0 0 4px #ffd54a,0 4px 0 #c9a52f}
/* a medalha fecha a peca: e por ela que o auditor-jogador sabe que chegou ao
   fim. A estrela vem do CSS — nao e emoji e nao entra na conta do contraste. */
.medal{width:104px;height:104px;margin:2px auto 12px;border-radius:50%;background:#f6c23a;
       border:6px solid #fff3c9;box-shadow:0 6px 16px rgba(0,0,0,.35);color:#4a3608;
       font-size:44px;line-height:92px;text-align:center;font-weight:800}
.medal:before{content:"\2605"}
/* ⚠️ JANELA BAIXA (1024x420 — o projetor da sala e o PC com muitas barras).
   Medido pelo `_qa/leiaute.js`: com a altura cheia, a ULTIMA linha da teia
   ficava abaixo da dobra e a tela nao rolava — a crianca via meia teia e
   achava que era tudo. Aqui a peca encolhe (letra e folga), NUNCA o alvo:
   nada desce de 42px de altura, que continua acima do piso de 40.        */
@media (max-height:520px){
  #app{padding-top:6px}
  .prog{margin:4px 0 8px}
  .selo{margin-bottom:6px;padding:4px 12px;font-size:12px}
  .balao{font-size:15px;padding:9px 14px}
  .lig{min-height:52px;margin-bottom:6px;font-size:13px;padding:8px}
  .opt{min-height:44px;margin:6px auto;font-size:15px;padding:9px 12px}
  .esp{padding:6px 10px}
  .espn{font-size:13px}
  .hint{font-size:12px;margin-top:6px}
}
</style></head>
<body>
<div id="app"></div>
<div id="banner" class="banner"><div id="bmsg"></div><button id="bcta" class="btn" style="margin-top:12px">Continuar</button></div>
<script>
/* ====== MOTORZINHO DA PEÇA (os mesmos nomes das atividades) ====== */
var app=document.getElementById("app"), banner=document.getElementById("banner"),
    bmsg=document.getElementById("bmsg"), bcta=document.getElementById("bcta");
function el(t,c,h){var e=document.createElement(t);if(c)e.className=c;if(h!==undefined&&h!==null)e.innerHTML=h;return e;}
function limpa(){app.innerHTML="";}
function setProg(t,p){var pr=el("div","prog");var i=el("i");i.style.width=p+"%";pr.appendChild(i);t.appendChild(pr);}
/* ⚠️ A DICA TEM QUE CABER NA TELA (ago/2026). Ela era o ULTIMO filho do
   `.centro`, e em janela apertada (320x568 e 1024x420 — o monitor da escola)
   caia 25 a 96 px ABAIXO DA DOBRA: a crianca que errou precisava ROLAR para ler
   a ajuda, justo no momento em que esta perdida. Agora ela entra LOGO DEPOIS do
   enunciado, que e onde o olho ja esta. Defeito estrutural: valia para as 57
   pecas de uma vez. */
function mostraDica(txt){var d=document.getElementById("dicaP");
  if(!d){ d=el("div","dica"); d.id="dicaP";
    var b=app.getElementsByClassName("balao")[0];
    if(b&&b.parentNode) b.parentNode.insertBefore(d,b.nextSibling);
    else (app.querySelector(".centro")||app).appendChild(d);
  } d.innerHTML=txt;}
function mostraBanner(msg,cb){bmsg.innerHTML=msg;banner.className="banner show";festa();
  bcta.onclick=function(){banner.className="banner";if(cb)cb();};}
function baguncar(a){var i,j,x;for(i=a.length-1;i>0;i--){j=Math.floor(Math.random()*(i+1));x=a[i];a[i]=a[j];a[j]=x;}return a;}
/* som: os numeros vieram da pesquisa (PESQUISA-SOM-E-GAMEFEEL). "ding" e
   sintetizado — MP3 chega atrasado e mata a sensacao de causa-efeito. */
var AC=null;
function ac(){try{if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();
  if(AC.state==="suspended")AC.resume();}catch(e){}return AC;}
function nota(f,dur,vol,tipo,atraso){var c=ac();if(!c)return;
  var o=c.createOscillator(),g=c.createGain(),t=c.currentTime+(atraso||0);
  o.type=tipo||"triangle";o.frequency.value=f;
  g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol||.18,t+.014);
  g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(g);g.connect(c.destination);o.start(t);o.stop(t+dur+.02);}
function sCerto(){nota(523.25,.35,.18,"triangle",0);nota(659.25,.35,.16,"triangle",.055);nota(783.99,.35,.15,"triangle",.11);}
function sErro(){nota(300,.14,.12,"sine",0);nota(318,.14,.12,"sine",0);}
function sTap(){nota(880,.012,.10,"square",0);}
function festa(){sCerto();}
document.addEventListener("pointerdown",function(){ac();},false);
</script>
<script>
/* ====== A PEÇA COMEÇA AQUI ====== */

/* O CONTEÚDO É SÓ EXEMPLO (uma teia de campo, 9 anos). Ao copiar a peça para
   uma atividade troque APENAS estes blocos. Regra dura: no máximo 5 ou 6
   espécies. Acima disso a cascata vira bagunça e o PC da escola sofre.     */

/* parte 1 — os pares de "quem come quem" (o lado direito é embaralhado) */
var COME= /*TECNICA*/ [
  {k:"c0", t:"O GAFANHOTO", s:"Come folhas e capim"},
  {k:"c1", t:"O SAPO",      s:"Come insetos que pulam"},
  {k:"c2", t:"A COBRA",     s:"Come sapos perto da &#225;gua"},
  {k:"c3", t:"O GAVI&#195;O",   s:"Pega cobras l&#225; do alto"}
];
var DICAS= /*TECNICA*/ [
  "Pense no tamanho: bicho grande come bicho menor.",
  "O gafanhoto come planta. O sapo come inseto. A cobra pega o sapo. O gavi&#227;o v&#234; tudo do alto.",
  "A resposta certa est&#225; com a borda amarela do outro lado. Toque nela."
];

/* parte 2 — as espécies e o nível de cada uma (0 a 3) */
var ESP= /*TECNICA*/ [
  {k:"capim",  n:"O CAPIM"},
  {k:"gafa",   n:"O GAFANHOTO"},
  {k:"sapo",   n:"O SAPO"},
  {k:"cobra",  n:"A COBRA"},
  {k:"gaviao", n:"O GAVI&#195;O"}
];
var INICIAL= /*TECNICA*/ {capim:3, gafa:2, sapo:2, cobra:2, gaviao:2};
var PALAVRA= /*TECNICA*/ ["SUMIU","POUCOS","M&#201;DIO","MUITOS"];

/* cada rodada: qual bicho sai, o que muda (na ordem da cascata) e a pergunta */
var RODADAS= /*TECNICA*/ [
  {tira:"sapo", nome:"O SAPO",
   passos:[["gafa",3,"SUBIU"],["capim",1,"CAIU"],["cobra",1,"CAIU"],["gaviao",1,"CAIU"]],
   p:"Sem o sapo, o que aconteceu com os <b>gafanhotos</b>?",
   c:"Ficaram MAIS: ningu&#233;m come eles",
   e:["Ficaram MENOS","Sumiram de uma vez","Ficou tudo igual"],
   d:["Olhe a barra do gafanhoto: ela subiu ou desceu?",
      "O sapo era quem comia gafanhoto. Sem ele, sobrou gafanhoto solto no campo.",
      "A resposta certa est&#225; acesa: os gafanhotos ficaram MAIS."]},
  {tira:"capim", nome:"O CAPIM",
   passos:[["gafa",0,"CAIU"],["sapo",1,"CAIU"],["cobra",1,"CAIU"],["gaviao",1,"CAIU"]],
   p:"Sem o capim, <b>quem sentiu falta primeiro</b>?",
   c:"O gafanhoto, que come capim",
   e:["O gavi&#227;o, que voa alto","A cobra, que fica na &#225;gua","Ningu&#233;m sentiu falta"],
   d:["Procure quem estava comendo o capim.",
      "A planta &#233; o come&#231;o da teia: quem come planta sente primeiro.",
      "A resposta certa est&#225; acesa: o gafanhoto come capim."]}
];

var caixaL=null;   /* a .ligbox — as linhas sao medidas a partir dela */
var camadaL=null;  /* a .linhas, onde as linhas moram */
var barraP=null;   /* a barrinha, para andar sem refazer a tela */
var FEITOS=[];     /* pares ja fechados, para redesenhar as linhas */ /*TECNICA*/
var marcada=null;  /* a ponta escolhida pelo toque simples */
var ger=0;         /* geracao da tela: mata setTimeout de tela que ja saiu */

/* ⭐ O GUARDA DO MOUSE FANTASMA. O celular dispara mousedown/mousemove/mouseup
   FALSOS logo depois do toque; sem este carimbo eles desmarcavam a ponta que a
   criança tinha acabado de escolher. Defeito pego DUAS vezes pelo Marcos.  */
var ultimoToque=0;
var pegou=null, linhaViva=null, x0=0, y0=0, arrastando=false, fimArrasto=0;

function agora(){ return (new Date()).getTime(); }
function souDedo(){ return agora()-ultimoToque<800; }
function cliqueDeArrasto(){ return agora()-fimArrasto<350; }
function temClasse(e,c){
  if(!e||e.nodeType!==1) return false;
  return (" "+String(e.className)+" ").indexOf(" "+c+" ")>=0;
}

/* ============ TELA 1: TRAÇAR QUEM COME QUEM ============ */
function pecaTeia(){
  FEITOS=[]; marcada=null; pegou=null; arrastando=false; ger++;
  limpa();
  var t=el("div","tela");
  setProg(t,0);
  barraP=t.querySelector(".prog i");
  var c=el("div","centro");
  c.appendChild(el("div","selo","QUEM COME QUEM"));
  c.appendChild(el("div","balao","Ligue cada bicho ao que ele <b>come</b>. Assim a teia fica montada."));

  caixaL=el("div","ligbox");
  camadaL=el("div","linhas");
  caixaL.appendChild(camadaL);

  var esq=el("div","lcol lesq"), dir=el("div","lcol ldir"), i;
  var sort=[];
  for(i=0;i<COME.length;i++) sort.push(COME[i]);
  /* o lado direito vai EMBARALHADO: senao ela liga pela posicao (linha 1 com
     linha 1) e nao pelo sentido. */
  baguncar(sort);
  for(i=0;i<COME.length;i++) esq.appendChild(fazPonta(COME[i],"e",COME[i].t));
  for(i=0;i<sort.length;i++)  dir.appendChild(fazPonta(sort[i],"d",sort[i].s));
  caixaL.appendChild(esq);
  caixaL.appendChild(dir);
  c.appendChild(caixaL);

  c.appendChild(el("div","hint","Toque de um lado e depois do outro. Tamb&#233;m d&#225; para puxar com o dedo ou com o mouse."));
  t.appendChild(c);
  app.appendChild(t);
}

function fazPonta(dado,lado,texto){
  var l=el("div","lig",texto);
  /* os DOIS lados publicam a MESMA chave: é assim que o auditor-jogador
     consegue fechar a fase. A criança não vê diferença nenhuma. */
  l.setAttribute("data-qa",dado.k);
  l._lado=lado;
  l.onclick=function(){
    if(cliqueDeArrasto()) return;   /* este clique e o rabo do arrasto */
    if(souDedo()) return;           /* o CLIQUE FANTASMA do dedo: ja tratado no touchend */
    toca(l);
  };
  l.onmousedown=function(ev){
    if(souDedo()) return;           /* mouse FANTASMA do celular: ignora */
    comeca(l,ev.clientX,ev.clientY);
  };
  l.addEventListener("touchstart",function(ev){
    ultimoToque=agora();
    var d=ev.touches[0];
    comeca(l,d.clientX,d.clientY);
  },false);
  return l;
}

/* ⚠️ NUNCA `preventDefault` no touchstart acima — mata o toque no celular.
   Ele mora no touchmove, mais abaixo, e só enquanto há ponta na mão.       */
/* ⚠️ LIÇÃO: aqui NÃO se marca a ponta. Marcar no mousedown fazia o `click`
   que vem logo depois cair em "já estava marcada" e DESMARCAR.             */
function comeca(l,x,y){
  if(temClasse(l,"feita")) return;
  pegou=l; x0=x; y0=y; arrastando=false;
}

function move(x,y){
  if(!pegou||!caixaL) return;
  if(!arrastando){
    if(Math.abs(x-x0)+Math.abs(y-y0)<10) return;   /* tolerancia do traco */
    arrastando=true;
    marca(pegou);
  }
  var b=caixaL.getBoundingClientRect();
  if(linhaViva&&linhaViva.parentNode) linhaViva.parentNode.removeChild(linhaViva);
  var p=ponto(pegou);
  linhaViva=traca(p.x,p.y,x-b.left,y-b.top,"viva");
}

function solta(x,y,doDedo){
  if(!pegou) return;
  var l=pegou; pegou=null;
  if(linhaViva&&linhaViva.parentNode) linhaViva.parentNode.removeChild(linhaViva);
  linhaViva=null;
  if(!arrastando){ if(doDedo) toca(l); return; }   /* foi so um toque do dedo */
  arrastando=false; fimArrasto=agora();
  var alvo=document.elementFromPoint(x,y);
  while(alvo&&alvo.nodeType===1&&!temClasse(alvo,"lig")) alvo=alvo.parentNode;
  if(alvo&&temClasse(alvo,"lig")&&alvo!==l) juntar(l,alvo);
}

document.onmousemove=function(ev){ if(souDedo()) return; move(ev.clientX,ev.clientY); };
document.onmouseup=function(ev){ if(souDedo()) return; solta(ev.clientX,ev.clientY,false); };
document.addEventListener("touchmove",function(ev){
  ultimoToque=agora();
  if(!pegou) return;
  var d=ev.touches[0];
  move(d.clientX,d.clientY);
  if(arrastando) ev.preventDefault();   /* so aqui, e so com ponta na mao */
},{passive:false});
document.addEventListener("touchend",function(ev){
  ultimoToque=agora();
  var d=ev.changedTouches[0];
  solta(d.clientX,d.clientY,true);
},false);

/* ---- o TOQUE SIMPLES: escolhe de um lado, escolhe do outro ---- */
function toca(l){
  if(temClasse(l,"feita")) return;
  if(!marcada){ sTap(); marca(l); return; }
  if(marcada===l){ sTap(); desmarca(); return; }
  if(marcada._lado===l._lado){ sTap(); marca(l); return; }   /* mesmo lado: troca */
  juntar(marcada,l);
}

function marca(l){ desmarca(); l.className="lig sel"; marcada=l; }

function desmarca(){
  var a=app.getElementsByClassName("lig"), i;
  for(i=0;i<a.length;i++) if(!temClasse(a[i],"feita")) a[i].className="lig";
  marcada=null;
}

function juntar(a,b){
  if(!a||!b||a===b) return;
  if(temClasse(a,"feita")||temClasse(b,"feita")) return;
  if(a._lado===b._lado) return;
  if(a.getAttribute("data-qa")===b.getAttribute("data-qa")){
    sCerto();
    a.className="lig feita"; b.className="lig feita";
    marcada=null;
    FEITOS.push([a,b]);
    redesenha();
    if(barraP) barraP.style.width=Math.round(FEITOS.length*50/COME.length)+"%";
    if(FEITOS.length>=COME.length){
      var ge=ger;
      setTimeout(function(){
        if(ge!==ger) return;
        mostraBanner("A teia est&#225; montada! Agora vem a parte que assusta.", telaCascata);
      },520);
    }
    return;
  }
  /* ERRO: não pune. Som grave curto, as pontas voltam e o andaime CRESCE. */
  sErro();
  a._err=(a._err||0)+1;
  mostraDica(DICAS[Math.min(a._err,DICAS.length)-1]);
  var guardar=a;
  desmarca();
  if(guardar._err>=3) revelaPar(guardar);
}

/* 3º erro: acende a ponta certa do outro lado e DEIXA seguir — é o que
   garante que a peça nunca trava. */
function revelaPar(l){
  var a=app.getElementsByClassName("lig"), i, k=l.getAttribute("data-qa");
  for(i=0;i<a.length;i++){
    if(temClasse(a[i],"feita")) continue;
    if(a[i]!==l&&a[i].getAttribute("data-qa")===k) a[i].className="lig pisca";
  }
  l.className="lig sel";
  marcada=l;
}

/* ---- as linhas do traço ---- */
function ponto(l){
  var r=l.getBoundingClientRect(), b=caixaL.getBoundingClientRect();
  var x=(l._lado==="e") ? (r.right-b.left) : (r.left-b.left);
  return {x:x, y:r.top+r.height/2-b.top};
}

function traca(x1,y1,x2,y2,extra){
  var dx=x2-x1, dy=y2-y1, comp=Math.sqrt(dx*dx+dy*dy);
  var ang=Math.atan2(dy,dx)*180/Math.PI;
  var ln=el("div","linha");
  if(extra) ln.className="linha viva";
  ln.style.left=x1+"px"; ln.style.top=y1+"px"; ln.style.width=comp+"px";
  ln.style.webkitTransform="rotate("+ang+"deg)";
  ln.style.transform="rotate("+ang+"deg)";
  camadaL.appendChild(ln);
  return ln;
}

function redesenha(){
  if(!camadaL) return;
  camadaL.innerHTML="";
  linhaViva=null;
  var i,p1,p2;
  for(i=0;i<FEITOS.length;i++){
    p1=ponto(FEITOS[i][0]); p2=ponto(FEITOS[i][1]);
    traca(p1.x,p1.y,p2.x,p2.y,"");
  }
}
/* a tela do PC vira ao contrario e as linhas ficariam tortas: redesenha */
/* ⚠️ `window.onresize=` APAGAVA o ouvinte de qualquer outra peca (o ligar fazia o
   mesmo) e continuava vivo depois da fase acabar. Ouvinte proprio, e so enquanto a
   camada estiver no documento. */
window.addEventListener("resize",function(){ if(camadaL&&document.body.contains(camadaL)) redesenha(); },false);

/* ============ TELA 2: TIRAR UM BICHO, A TEIA REAGE ============ */
var NIV={};        /* nivel de agora de cada especie (0 a 3) */
var rod=0;         /* rodada da cascata */
var errC=0;        /* erros da rodada (o andaime cresce com eles) */
var LINHAS={};     /* a linha .esp de cada especie, para mexer sem refazer */
var rodando=false; /* enquanto a cascata anda, nao aceita toque */

function telaCascata(){
  if(rod>=RODADAS.length){ fimDaPeca(); return; }
  ger++; errC=0; rodando=false; LINHAS={};
  var i;
  for(i=0;i<ESP.length;i++) NIV[ESP[i].k]=INICIAL[ESP[i].k];
  var f=RODADAS[rod];
  limpa();
  var t=el("div","tela");
  setProg(t, 50+Math.round(rod*25));
  var c=el("div","centro");
  c.appendChild(el("div","selo","TIRE UM DA TEIA"));
  c.appendChild(el("div","balao","Toque em <b>"+f.nome+"</b> para tirar da teia. Veja o que acontece com os outros."));

  var cx=el("div","opts");
  for(i=0;i<ESP.length;i++) cx.appendChild(fazLinha(ESP[i],f));
  c.appendChild(cx);
  c.appendChild(el("div","hint","As barras mostram quantos existem no campo. Rodada "+(rod+1)+" de "+RODADAS.length+"."));
  t.appendChild(c);
  app.appendChild(t);
}

function fazLinha(e,f){
  var l=el("div","opt esp");
  var nome=el("span","espn",e.n);
  var barra=el("span","espb");
  var fill=el("i","espf");
  barra.appendChild(fill);
  var qua=el("span","espq",PALAVRA[NIV[e.k]]);
  l.appendChild(nome); l.appendChild(barra); l.appendChild(qua);
  LINHAS[e.k]={caixa:l, fill:fill, qua:qua};
  /* a barra so cresce DEPOIS de a linha entrar na tela: assim a criança ve o
     tamanho aparecer, e nao um valor que ja estava la. */
  setTimeout(function(){ fill.style.width=(NIV[e.k]*33)+"%"; },60);
  /* data-qa="1" = "esta serve AGORA", só para o auditor-jogador. */
  if(e.k===f.tira) l.setAttribute("data-qa","1");
  l.onclick=function(){ tiraBicho(e,f,l); };
  return l;
}

function tiraBicho(e,f,l){
  if(rodando) return;
  if(temClasse(l,"fora")) return;
  if(e.k!==f.tira){
    /* não pune: só reconduz, e o andaime cresce */
    sErro(); errC++;
    mostraDica(errC<2 ? ("Nesta rodada a gente tira <b>"+f.nome+"</b>. Procure o nome dele na lista.")
                      : ("<b>"+f.nome+"</b> est&#225; com a borda amarela. Toque nele."));
    if(errC>=2&&LINHAS[f.tira]) LINHAS[f.tira].caixa.className="opt esp pisca";
    return;
  }
  rodando=true;
  sTap();
  /* o bicho sai: barra a zero, palavra SAIU DA TEIA, e a linha fica travada */
  NIV[e.k]=0;
  l.className="opt esp fora";
  l.onclick=null;
  l.removeAttribute("data-qa");
  LINHAS[e.k].fill.style.width="0%";
  LINHAS[e.k].qua.innerHTML="SAIU DA TEIA";
  travaLinhas();
  cascata(f,0);
}

/* trava as outras linhas: durante a cascata elas não respondem ao toque, e
   somem do alcance do auditor (senão ele fica tocando na lista para sempre). */
function travaLinhas(){
  var i,k;
  for(i=0;i<ESP.length;i++){
    k=ESP[i].k;
    if(!LINHAS[k]) continue;
    LINHAS[k].caixa.onclick=null;
    LINHAS[k].caixa.removeAttribute("data-qa");
  }
}

/* ⭐ A CASCATA. Um passo de cada vez, com meio segundo entre eles: é isso que
   faz a criança VER que uma coisa puxou a outra. Tudo com barra de CSS —
   nada de bichinho animado, que é o que derruba o PC da escola.           */
function cascata(f,i){
  var ge=ger;
  if(i>=f.passos.length){ setTimeout(function(){ if(ge===ger) perguntaDaRodada(f); },420); return; }
  var p=f.passos[i], k=p[0], novo=p[1], palavra=p[2];
  var ln=LINHAS[k];
  if(ln){
    NIV[k]=novo;
    ln.fill.style.width=(novo*33)+"%";
    ln.qua.innerHTML=PALAVRA[novo]+'<i class="espd">'+palavra+"</i>";
    if(palavra==="SUBIU") nota(660,.12,.12,"triangle",0); else nota(330,.12,.12,"sine",0);
  }
  setTimeout(function(){ if(ge===ger) cascata(f,i+1); },520);
}

function perguntaDaRodada(f){
  var c=app.querySelector(".centro");
  if(!c) return;
  var cx=el("div","opts"); cx.id="pergP";
  c.appendChild(el("div","balao",f.p));
  var lista=[{txt:f.c,ok:1}], i;
  for(i=0;i<f.e.length;i++) lista.push({txt:f.e[i],ok:0});
  baguncar(lista);   /* ⭐ ARMADILHA DO QUIZ: embaralhar SEMPRE */
  for(i=0;i<lista.length;i++) cx.appendChild(fazOpcao(lista[i],f));
  c.appendChild(cx);
}

function fazOpcao(it,f){
  var o=el("div","opt",it.txt);
  if(it.ok) o.setAttribute("data-qa","1");
  o.onclick=function(){ respondeC(o,it.ok,f); };
  return o;
}

function respondeC(o,certa,f){
  if(o.className.indexOf("no")>=0) return;
  if(certa){
    sCerto();
    o.className="opt ok";
    trancaOpcoes();
    var ge=ger;
    setTimeout(function(){
      if(ge!==ger) return;
      rod++;
      if(rod<RODADAS.length) mostraBanner("A teia se refez. Vamos tirar outro.", telaCascata);
      else mostraBanner("Voc&#234; viu: mexer em um mexe em todos.", fimDaPeca);
    },620);
    return;
  }
  sErro();
  o.className="opt no";
  o.onclick=null;
  errC++;
  var acabou=(sobramErradas()===0);
  mostraDica(acabou ? f.d[f.d.length-1] : f.d[Math.min(errC,f.d.length)-1]);
  if(errC>=3||acabou) revelaCerta();
}

function sobramErradas(){
  var cx=document.getElementById("pergP"); if(!cx) return 0;
  var a=cx.getElementsByClassName("opt"), i, n=0;
  for(i=0;i<a.length;i++)
    if(a[i].getAttribute("data-qa")!=="1"&&a[i].className.indexOf("no")<0) n++;
  return n;
}

/* 3º erro: acende a certa e DEIXA seguir — a peça nunca trava. */
function revelaCerta(){
  var cx=document.getElementById("pergP"); if(!cx) return;
  var a=cx.getElementsByClassName("opt"), i;
  for(i=0;i<a.length;i++)
    if(a[i].getAttribute("data-qa")==="1") a[i].className="opt pisca";
}

function trancaOpcoes(){
  var cx=document.getElementById("pergP"); if(!cx) return;
  var a=cx.getElementsByClassName("opt"), i;
  for(i=0;i<a.length;i++) a[i].onclick=null;
}

/* ============ FIM ============ */
function fimDaPeca(){
  ger++;
  caixaL=null; camadaL=null; linhaViva=null; marcada=null; pegou=null;
  limpa();
  var t=el("div","tela");
  setProg(t,100);
  var c=el("div","centro");
  c.appendChild(el("div","selo","PE&#199;A FECHADA"));
  c.appendChild(el("div","medal",""));
  c.appendChild(el("div","balao","Voc&#234; montou a teia e viu a cascata: tirar <b>um</b> mexeu com <b>todos</b>."));
  var b=el("button","btn","Jogar de novo");
  b.onclick=function(){ rod=0; pecaTeia(); };
  c.appendChild(b);
  c.appendChild(el("div","hint","Esta &#233; a pe&#231;a TEIA ALIMENTAR: poucas esp&#233;cies, barras e cascata."));
  t.appendChild(c);
  app.appendChild(t);
}

pecaTeia();
</script>
