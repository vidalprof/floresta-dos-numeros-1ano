<title>PEÇA — qual não pertence? (o intruso)</title>
<!-- ============================================================
     PEÇA: O INTRUSO — "QUAL NÃO PERTENCE?"
     Cópia do _padrao/pecas/MOLDE.html: só o bloco "A PEÇA COMEÇA AQUI" mudou.

     O QUE ELA É: quatro coisas, três da mesma família e uma de fora. A criança
     acha a de fora — e DEPOIS tem que dizer POR QUÊ, tocando na razão.

     ⚠️ O SEGUNDO PASSO É A PEÇA INTEIRA. Sem ele isto é um quiz: a criança
     acerta por eliminação ("essa é diferente") sem nunca formular o critério, e
     o professor não fica sabendo se ela viu a categoria ou o tamanho da letra.
     O "por quê" é tocado, NUNCA digitado — no 1º/2º ano escrever a justificativa
     mede a escrita, não o raciocínio, e a criança que pensa certo se cala.

     ⚠️ O DISTRATOR TEM QUE SER PLAUSÍVEL. "Porque a cenoura é laranja" é
     VERDADE — e é exatamente por isso que serve: obriga a separar "o que é
     verdade sobre ela" de "o que separa o grupo". Distrator absurdo transforma
     as quatro razões em uma só.

     A ESCADA (degraus de verdade): categoria concreta (frutas) -> propriedade
     da figura (quantos lados) -> propriedade do número (par/ímpar) -> para que
     serve (função). Concreto -> figural -> simbólico -> abstrato.

     AS ARMADILHAS QUE ESTA PEÇA FECHA:
       · opção já tentada NÃO se distingue só pela cor e NÃO responde com
         silêncio: ganha a etiqueta em palavras "já tentamos" e som de retorno —
         quem não distingue cor tocava ali para sempre achando que travou;
       · o andaime cresce nos DOIS passos, com textos diferentes em cada degrau;
       · a 3ª dica FICA NA TELA: revela primeiro, escreve a explicação DEPOIS, e
         a rodada só anda quando a criança toca em "Continuar" — antes a tela
         seguinte apagava a explicação no mesmo quadro;
       · trava no instante do acerto (criança toca duas vezes) e todo
         temporizador guarda a GERAÇÃO da rodada;
       · TRÊS distratores em cada passo (nunca dois): com dois, a criança
         elimina tudo antes do 3º erro e o degrau "revelar" vira código morto —
         e ainda sobra uma tela com uma opção só. Há também a REDE
         (`sobramErradas`) para quando o conteúdo for trocado por um menor;
       · as quatro coisas e as quatro razões vão EMBARALHADAS (na Fábrica de
         Estrelas a certa era sempre a 1ª e a criança aprendeu a posição);
       · NENHUMA razão vem em negrito: quando só a certa tinha `<b>`, o próprio
         estilo apontava a resposta — a criança acertava sem ler. Todas iguais;
       · `data-qa` na resposta que serve agora, para o auditor-jogador fechar;
       · termina numa `.medal`.
     ES5 puro, um arquivo só, sem biblioteca (Chrome 109 / Firefox 106).
     ============================================================ -->
<style>

/* --- as figuras da rodada das formas (mesma cor de proposito: quem separa o

.infig{display:inline-block;vertical-align:middle;margin-right:12px}

         max-width:400px;font-size:15px;font-weight:600;line-height:1.45;text-align:left}

/* a medalha fecha a peca: e por ela que o auditor-jogador sabe que chegou ao

       border:6px solid #fff3c9;box-shadow:0 6px 16px rgba(0,0,0,.35);color:#4a3608;
       font-size:44px;line-height:92px;text-align:center;font-weight:800}
.medal:before{content:"\2605"}
/* tela baixa (projetor, janela do PC da escola): tudo que se toca continua

<body>
<div id="app"></div>
<div id="banner" class="banner"><div id="bmsg"></div><button id="bcta" class="btn" style="margin-top:12px">Continuar</button></div>
<script>
/* ====== MOTORZINHO DA PEÇA (os mesmos nomes das atividades) ====== */
var app=document.getElementById("app"), banner=document.getElementById("banner"),
    bmsg=document.getElementById("bmsg"), bcta=document.getElementById("bcta");
function el(t,c,h){var e=document.createElement(t);if(c)e.className=c;if(h!==undefined&&h!==null)e.innerHTML=h;return e;}
function limpa(){app.innerHTML="";}
function setProg(t,p){var pr=el("div","prog");var i=el("i");i.style.width=p+"%";pr.appendChild(i);t.appendChild(pr);}
/* ⚠️ A DICA TEM QUE CABER NA TELA (ago/2026). Ela era o ULTIMO filho do
   `.centro`, e em janela apertada (320x568 e 1024x420 — o monitor da escola)
   caia 25 a 96 px ABAIXO DA DOBRA: a crianca que errou precisava ROLAR para ler
   a ajuda, justo no momento em que esta perdida. Agora ela entra LOGO DEPOIS do
   enunciado, que e onde o olho ja esta. Defeito estrutural: valia para as 57
   pecas de uma vez. */
function mostraDica(txt){var d=document.getElementById("dicaP");
  if(!d){ d=el("div","dica"); d.id="dicaP";
    var b=app.getElementsByClassName("balao")[0];
    if(b&&b.parentNode) b.parentNode.insertBefore(d,b.nextSibling);
    else (app.querySelector(".centro")||app).appendChild(d);
  } d.innerHTML=txt;}
function mostraBanner(msg,cb){bmsg.innerHTML=msg;banner.className="banner show";festa();
  bcta.onclick=function(){banner.className="banner";if(cb)cb();};}
function baguncar(a){var i,j,x;for(i=a.length-1;i>0;i--){j=Math.floor(Math.random()*(i+1));x=a[i];a[i]=a[j];a[j]=x;}return a;}
/* som: os numeros vieram da pesquisa (PESQUISA-SOM-E-GAMEFEEL). "ding" e
   sintetizado — MP3 chega atrasado e mata a sensacao de causa-efeito. */
var AC=null;
function ac(){try{if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();
  if(AC.state==="suspended")AC.resume();}catch(e){}return AC;}
function nota(f,dur,vol,tipo,atraso){var c=ac();if(!c)return;
  var o=c.createOscillator(),g=c.createGain(),t=c.currentTime+(atraso||0);
  o.type=tipo||"triangle";o.frequency.value=f;
  g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol||.18,t+.014);
  g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(g);g.connect(c.destination);o.start(t);o.stop(t+dur+.02);}
function sCerto(){nota(523.25,.35,.18,"triangle",0);nota(659.25,.35,.16,"triangle",.055);nota(783.99,.35,.15,"triangle",.11);}
function sErro(){nota(300,.14,.12,"sine",0);nota(318,.14,.12,"sine",0);}
function sTap(){nota(880,.012,.10,"square",0);}
function festa(){sCerto();}
document.addEventListener("pointerdown",function(){ac();},false);
</script>
<script>
/* ====== A PEÇA COMEÇA AQUI ====== */

/* ---------------- O CONTEÚDO ----------------
   `itens` = as quatro coisas (a de fora é `fora`).
   `razoes` = as três justificativas; `ok:1` é a que separa o grupo, e as
   outras duas são VERDADES sobre o intruso que NÃO separam o grupo (é o que
   faz o segundo passo valer alguma coisa).
   `d1..d3` = os degraus do andaime no passo ACHAR;
   `p1..p3` = os degraus do andaime no passo POR QUÊ;
   `regra`  = a frase que a criança leva embora.                            */
var RODADAS=[
 { selo:"A CESTA DA FEIRA", tipo:"texto",
   enun:"Tr&#234;s destas s&#227;o da mesma fam&#237;lia. <b>Qual n&#227;o pertence?</b>",
   itens:[{k:"maca",n:"MA&#199;&#195;"},{k:"banana",n:"BANANA"},{k:"uva",n:"UVA"},{k:"cenoura",n:"CENOURA"}],
   fora:"cenoura", nomeFora:"CENOURA",
   d1:"Pense em <b>onde cada uma cresce</b>. Alguma delas cresce debaixo da terra?",
   d2:"Tr&#234;s delas nascem da flor de uma planta e a gente chama de <b>fruta</b>. Procure a que n&#227;o &#233;.",
   d3:"A de fora &#233; a <b>cenoura</b>: as outras tr&#234;s s&#227;o frutas.",
   razoes:[
     {t:"As outras tr&#234;s s&#227;o frutas; a cenoura &#233; raiz.",ok:1},
     {t:"Porque a cenoura &#233; laranja.",ok:0},
     {t:"Porque a cenoura &#233; a mais comprida.",ok:0},
     {t:"Porque a cenoura a gente come cozida.",ok:0}],
   p1:"O que voc&#234; tocou at&#233; pode ser verdade. Mas olhe as OUTRAS tr&#234;s: o que elas t&#234;m em comum?",
   p2:"Cor e tamanho mudam de uma cenoura para outra. O que n&#227;o muda &#233; o <b>tipo</b> de alimento.",
   p3:"Ma&#231;&#227;, banana e uva s&#227;o <b>frutas</b>. A cenoura &#233; a raiz da planta &#8212; por isso ela &#233; a de fora.",
   regra:"ma&#231;&#227;, banana e uva s&#227;o frutas; cenoura &#233; raiz" },

 { selo:"AS QUATRO FIGURAS", tipo:"forma",
   enun:"Tr&#234;s figuras t&#234;m uma coisa igual. <b>Qual n&#227;o pertence?</b>",
   itens:[{k:"quad",n:"QUADRADO",fig:"inquad"},{k:"ret",n:"RET&#194;NGULO",fig:"inret"},
          {k:"los",n:"LOSANGO",fig:"inlos"},{k:"tri",n:"TRI&#194;NGULO",fig:"intri"}],
   fora:"tri", nomeFora:"TRI&#194;NGULO",
   d1:"<b>Conte os lados</b> de cada figura com o dedo, uma por uma.",
   d2:"Tr&#234;s delas t&#234;m <b>4 lados</b>, mesmo estando viradas de jeitos diferentes.",
   d3:"A de fora &#233; o <b>tri&#226;ngulo</b>: ele tem 3 lados e os outros t&#234;m 4.",
   razoes:[
     {t:"As outras tr&#234;s t&#234;m 4 lados; o tri&#226;ngulo tem 3.",ok:1},
     {t:"Porque o tri&#226;ngulo tem uma ponta para cima.",ok:0},
     {t:"Porque o tri&#226;ngulo &#233; a figura mais baixa.",ok:0},
     {t:"Porque o tri&#226;ngulo n&#227;o tem todos os lados iguais.",ok:0}],
   p1:"Isso at&#233; pode ser verdade. Mas virar a figura n&#227;o muda o que ela &#233;. O que d&#225; para <b>contar</b> em todas?",
   p2:"Conte os lados de novo: 4, 4, 4 e... quantos no &#250;ltimo?",
   p3:"Quadrado, ret&#226;ngulo e losango t&#234;m <b>4 lados</b>. O tri&#226;ngulo tem 3 &#8212; por isso ele &#233; o de fora.",
   regra:"quadrado, ret&#226;ngulo e losango t&#234;m 4 lados; tri&#226;ngulo tem 3" },

 { selo:"A FILA DOS N&#218;MEROS", tipo:"numero",
   enun:"Tr&#234;s n&#250;meros t&#234;m algo em comum. <b>Qual n&#227;o pertence?</b>",
   itens:[{k:"2",n:"2"},{k:"4",n:"4"},{k:"6",n:"6"},{k:"9",n:"9"}],
   fora:"9", nomeFora:"9",
   d1:"Tente separar cada n&#250;mero em <b>duas partes iguais</b>. Com qual deles n&#227;o d&#225;?",
   d2:"2 s&#227;o 1 e 1; 4 s&#227;o 2 e 2; 6 s&#227;o 3 e 3. Um deles sempre <b>sobra um</b>.",
   d3:"O de fora &#233; o <b>9</b>: ele n&#227;o d&#225; para partir ao meio sem sobrar.",
   razoes:[
     {t:"Os outros tr&#234;s s&#227;o pares; o 9 &#233; &#237;mpar.",ok:1},
     {t:"Porque o 9 &#233; o maior de todos.",ok:0},
     {t:"Porque o 9 vem depois do 6.",ok:0},
     {t:"Porque o 9 &#233; quase 10.",ok:0}],
   p1:"Isso at&#233; &#233; verdade sobre o 9. Mas separa o grupo? Pense no que d&#225; para <b>dividir no meio</b>.",
   p2:"Troque o 9 pelo 11: ele deixa de ser o maior e continua sendo o de fora. Ent&#227;o o que decide?",
   p3:"2, 4 e 6 s&#227;o <b>pares</b>: partem ao meio sem sobrar. O 9 &#233; &#237;mpar &#8212; por isso ele &#233; o de fora.",
   regra:"2, 4 e 6 s&#227;o pares; 9 &#233; &#237;mpar" },

 { selo:"A CAIXA DE FERRAMENTAS", tipo:"texto",
   enun:"Tr&#234;s servem para a mesma coisa. <b>Qual n&#227;o pertence?</b>",
   itens:[{k:"martelo",n:"MARTELO"},{k:"serrote",n:"SERROTE"},{k:"alicate",n:"ALICATE"},{k:"vassoura",n:"VASSOURA"}],
   fora:"vassoura", nomeFora:"VASSOURA",
   d1:"Pergunte de cada uma: <b>para que ela serve</b>?",
   d2:"Tr&#234;s delas ajudam a <b>construir e consertar</b>. Uma ajuda a cuidar da casa.",
   d3:"A de fora &#233; a <b>vassoura</b>: ela serve para limpar, n&#227;o para consertar.",
   razoes:[
     {t:"As outras tr&#234;s servem para consertar; a vassoura serve para limpar.",ok:1},
     {t:"Porque a vassoura &#233; a mais comprida.",ok:0},
     {t:"Porque a vassoura n&#227;o &#233; de metal.",ok:0},
     {t:"Porque a vassoura fica na cozinha.",ok:0}],
   p1:"Isso pode ser verdade. Mas o que junta as outras tr&#234;s &#233; o <b>trabalho</b> que elas fazem.",
   p2:"Uma chave de fenda &#233; pequena e n&#227;o &#233; toda de metal &#8212; e mesmo assim ficaria no grupo. O que decide?",
   p3:"Martelo, serrote e alicate servem para <b>construir e consertar</b>. A vassoura serve para limpar &#8212; por isso ela &#233; a de fora.",
   regra:"martelo, serrote e alicate consertam; vassoura limpa" }
];

/* ---------------- ESTADO ---------------- */
var rodada=0, feitos=0, totalGeral=8, descobertas=[];
var telaAtual=null, barraP=null, ger=0, travada=false, errosSeg=0;
var caixas=[], areaBotao=null;

function temClasse(e,c){
  if(!e||e.nodeType!==1) return false;
  return (" "+String(e.className)+" ").indexOf(" "+c+" ")>=0;
}
function viva(){ return telaAtual&&telaAtual.parentNode; }
/* ⚠️ tela antiga continua clicavel embaixo do banner: toda funcao que mexe no
   estado comeca perguntando se a partida ainda esta de pe. */
function emJogo(){ return viva()&&!travada; }
function apagaDica(){
  var d=document.getElementById("dicaP");
  if(d&&d.parentNode) d.parentNode.removeChild(d);
}
/* ⚠️ o temporizador continua correndo depois do limpa(): sem o guarda da
   geracao ele mexeria numa tela que ja saiu (e deixaria a tela nova travada). */
function destreme(b,base){
  var g=ger;
  setTimeout(function(){
    if(g!==ger||!viva()) return;
    if(!temClasse(b,"injat")&&!temClasse(b,"ok")) b.className=base;
  },340);
}
/* ⭐ A REDE DAS ERRADAS QUE ACABAM (licao do CONTRATO, secao 6): "um quiz com
   2 distratores faz a crianca eliminar tudo antes do 3o erro — o degrau
   REVELAR vira codigo morto". Aqui cada passo tem TRES erradas, entao os tres
   degraus acontecem de verdade; mas se alguem trocar o conteudo por um com
   menos opcoes, esta conta avisa e o revelar entra na hora, em vez de deixar
   uma tela com uma opcao so e nada acontecendo.                            */
function sobramErradas(){
  var i,n=0;
  for(i=0;i<caixas.length;i++)
    if(!temClasse(caixas[i],"injat")&&!temClasse(caixas[i],"ok")&&
       caixas[i].getAttribute("data-qa")==="0") n++;
  return n;
}
/* o botao que a crianca toca para seguir. Ele existe para que a EXPLICACAO
   fique na tela o tempo que ela quiser — a tela nao troca sozinha. */
function poeBotao(txt,cb){
  if(!areaBotao) return;
  areaBotao.innerHTML="";
  var b=el("button","btn",txt);
  b.setAttribute("data-qa","1");
  b.onclick=function(){ if(viva()) cb(); };
  areaBotao.appendChild(b);
}

/* ================= PASSO 1: ACHAR O INTRUSO ================= */
function pecaIntruso(){
  ger++; limpa();
  if(rodada<0||rodada>=RODADAS.length) rodada=0;
  var R=RODADAS[rodada];
  caixas=[]; errosSeg=0; travada=false;
  var t=el("div","tela"); telaAtual=t;
  setProg(t,Math.round(feitos*100/totalGeral));
  barraP=t.querySelector(".prog i");
  var c=el("div","centro");
  c.appendChild(el("div","selo",R.selo));
  c.appendChild(el("div","balao",R.enun));
  var box=el("div","opts"), i;
  /* ⚠️ EMBARALHADAS: na Fabrica de Estrelas a certa era sempre a 1a e a
     crianca aprendeu a POSICAO, nao o conteudo. */
  var ordem=baguncar(R.itens.slice(0));
  for(i=0;i<ordem.length;i++) box.appendChild(fazCoisa(ordem[i],R));
  c.appendChild(box);
  areaBotao=el("div","opts");
  c.appendChild(areaBotao);
  c.appendChild(el("div","hint","Toque na que n&#227;o combina com as outras tr&#234;s."));
  t.appendChild(c); app.appendChild(t);
}
function fazCoisa(o,R){
  var b=el("div","opt","");
  b.className="opt incoisa";
  if(o.fig) b.appendChild(el("span","infig "+o.fig,""));
  b.appendChild(el("span",(R.tipo==="numero")?"innome innum":"innome",o.n));
  b._o=o;
  /* a tela publica em data-qa a resposta que serve AGORA — so para o
     auditor-jogador conseguir fechar a fase (convencao da casa). */
  b.setAttribute("data-qa",(o.k===R.fora)?"1":"0");
  b.onclick=function(){ tocaCoisa(b); };
  caixas.push(b);
  return b;
}
function tocaCoisa(b){
  if(!viva()) return;
  if(travada){ sTap(); return; }        /* rodada ja resolvida: responde, nao emudece */
  var R=RODADAS[rodada];
  /* ⚠️ JA TENTADA: responde com SOM e com PALAVRAS, nunca com silencio. */
  if(temClasse(b,"injat")){
    sTap();
    mostraDica("Nesta n&#243;s j&#225; tentamos. Olhe as outras <b>tr&#234;s</b>.");
    return;
  }
  if(b._o.k===R.fora){ achou(b,false); return; }
  sErro(); errosSeg++;
  b.className="opt incoisa injat";
  b.appendChild(el("span","inmarca","j&#225; tentamos"));
  b.setAttribute("data-qa","0");
  destreme(b,"opt incoisa injat");
  if(errosSeg===1) mostraDica(R.d1);
  else if(errosSeg===2) mostraDica(R.d2);
  if(errosSeg>=3){ mostraDica("Deixa comigo: eu mostro qual &#233; a de fora e explico."); esperaERevela1(1100); }
  else if(sobramErradas()===0) esperaERevela1(2600);   /* a rede: erradas acabaram antes */
}
/* ⚠️ DEFEITO PAGO EM CINCO PEÇAS DE UM LOTE SÓ (ago/2026): no 3º degrau a
   explicacao era escrita e APAGADA no mesmo quadro, porque o "revelar" trocava
   de tela. Ordem certa: espera a dica ser lida, REVELA, escreve a explicacao
   DEPOIS — e a tela so troca quando a crianca toca em "Continuar".        */
function esperaERevela1(atraso){
  var g=ger, R=RODADAS[rodada];
  setTimeout(function(){
    if(g!==ger||!viva()||travada) return;
    var i,alvo=null;
    for(i=0;i<caixas.length;i++) if(caixas[i]._o.k===R.fora) alvo=caixas[i];
    if(!alvo) return;
    achou(alvo,true);
    if(g!==ger||!viva()) return;
    mostraDica(R.d3);
  },atraso||1100);
}
function achou(b,revelado){
  var R=RODADAS[rodada];
  /* ⚠️ A TRAVA VAI NO INSTANTE DO ACERTO, nao no fim da animacao: a crianca
     toca duas vezes, e o segundo toque caia na tela seguinte com o estado
     antigo. */
  travada=true;
  b.className="opt incoisa ok";
  b.appendChild(el("span","inmarca inok","a de fora"));
  b.setAttribute("data-qa","0");
  var i;
  for(i=0;i<caixas.length;i++) if(caixas[i]!==b) caixas[i].setAttribute("data-qa","0");
  if(!revelado){ sCerto(); apagaDica(); feitos++; if(barraP) barraP.style.width=Math.round(feitos*100/totalGeral)+"%"; }
  poeBotao("E por qu&#234;?",telaPorque);
}

/* ================= PASSO 2: POR QUÊ? =================
   ⚠️ ESTE PASSO É A PEÇA. Sem ele, achar o intruso é um quiz: a criança
   elimina pela aparência e ninguém fica sabendo se ela viu a categoria. Aqui
   ela TOCA na razão — nunca digita, porque escrever mediria a escrita e
   calaria quem pensa certo e escreve devagar.                             */
function telaPorque(){
  ger++; limpa();
  if(rodada<0||rodada>=RODADAS.length) rodada=0;
  var R=RODADAS[rodada];
  caixas=[]; errosSeg=0; travada=false;
  var t=el("div","tela"); telaAtual=t;
  setProg(t,Math.round(feitos*100/totalGeral));
  barraP=t.querySelector(".prog i");
  var c=el("div","centro");
  c.appendChild(el("div","selo","POR QU&#202;?"));
  c.appendChild(el("div","balao","<b>"+R.nomeFora+"</b> &#233; a de fora. E <b>por qu&#234;</b> ela n&#227;o pertence ao grupo?"));
  var box=el("div","opts"), i;
  var ordem=baguncar(R.razoes.slice(0));
  for(i=0;i<ordem.length;i++) box.appendChild(fazRazao(ordem[i]));
  c.appendChild(box);
  areaBotao=el("div","opts");
  c.appendChild(areaBotao);
  c.appendChild(el("div","hint","Tr&#234;s destas at&#233; s&#227;o verdade. S&#243; uma explica o <b>grupo</b>."));
  t.appendChild(c); app.appendChild(t);
}
function fazRazao(r){
  var b=el("div","opt","");
  b.className="opt inrazao";
  b.innerHTML=r.t;
  b._r=r;
  b.setAttribute("data-qa",r.ok?"1":"0");
  b.onclick=function(){ tocaRazao(b); };
  caixas.push(b);
  return b;
}
function tocaRazao(b){
  if(!viva()) return;
  if(travada){ sTap(); return; }        /* rodada ja resolvida: responde, nao emudece */
  var R=RODADAS[rodada];
  if(temClasse(b,"injat")){
    sTap();
    mostraDica("Nesta n&#243;s j&#225; tentamos. Leia as outras com calma.");
    return;
  }
  if(b._r.ok){ fechaRazao(b,false); return; }
  sErro(); errosSeg++;
  b.className="opt inrazao injat";
  b.appendChild(el("span","inmarca","j&#225; tentamos"));
  b.setAttribute("data-qa","0");
  destreme(b,"opt inrazao injat");
  if(errosSeg===1) mostraDica(R.p1);
  else if(errosSeg===2) mostraDica(R.p2);
  if(errosSeg>=3){ mostraDica("Deixa comigo: eu marco a raz&#227;o certa e explico."); esperaERevela2(1100); }
  else if(sobramErradas()===0) esperaERevela2(2600);   /* a rede: erradas acabaram antes */
}
function esperaERevela2(atraso){
  var g=ger, R=RODADAS[rodada];
  setTimeout(function(){
    if(g!==ger||!viva()||travada) return;
    var i,alvo=null;
    for(i=0;i<caixas.length;i++) if(caixas[i]._r.ok) alvo=caixas[i];
    if(!alvo) return;
    fechaRazao(alvo,true);
    if(g!==ger||!viva()) return;
    mostraDica(R.p3);
  },atraso||1100);
}
function fechaRazao(b,revelado){
  var R=RODADAS[rodada];
  travada=true;
  b.className="opt inrazao ok";
  b.appendChild(el("span","inmarca inok","&#233; esta"));
  b.setAttribute("data-qa","0");
  var i;
  for(i=0;i<caixas.length;i++) if(caixas[i]!==b) caixas[i].setAttribute("data-qa","0");
  if(descobertas.indexOf(R.regra)<0) descobertas.push(R.regra);
  if(!revelado){
    sCerto(); apagaDica();
    feitos++; if(barraP) barraP.style.width=Math.round(feitos*100/totalGeral)+"%";
    mostraDica(R.p3);
  }
  poeBotao("Continuar",proximaRodada);
}
function proximaRodada(){
  rodada++;
  if(rodada>=RODADAS.length) fimDaPeca(); else pecaIntruso();
}

function fimDaPeca(){
  ger++; limpa();
  areaBotao=null; travada=false; caixas=[];
  var t=el("div","tela"); telaAtual=t; setProg(t,100);
  var c=el("div","centro");
  c.appendChild(el("div","selo","PE&#199;A FECHADA"));
  c.appendChild(el("div","medal",""));
  /* FECHO COM GANCHO: a peca termina deixando uma pergunta aberta. */
  c.appendChild(el("div","balao","Voc&#234; achou <b>4 intrusos</b> e disse por qu&#234;. Agora invente um: tr&#234;s coisas da sua casa e uma de fora."));
  var i, regras=descobertas.length?descobertas:regrasTodas(), txt="O que separou cada grupo:";
  for(i=0;i<regras.length;i++) txt+="<br>&#8226; <b>"+regras[i]+"</b>";
  c.appendChild(el("div","inregra",txt));
  var b=el("button","btn","Jogar de novo");
  b.onclick=recomeca;
  c.appendChild(b);
  c.appendChild(el("div","hint","Esta &#233; a pe&#231;a O INTRUSO: achar e dizer POR QU&#202;."));
  t.appendChild(c); app.appendChild(t);
}
function regrasTodas(){
  var i,r=[];
  for(i=0;i<RODADAS.length;i++) r.push(RODADAS[i].regra);
  return r;
}
function recomeca(){ rodada=0; feitos=0; descobertas=[]; pecaIntruso(); }

pecaIntruso();
</script>
