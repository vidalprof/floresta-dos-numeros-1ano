<title>PEÇA — ordenar</title>
<!-- ============================================================
     PEÇA: ORDENAR (por 5 itens em ordem)
     Cópia do MOLDE.html — só o bloco "A PEÇA COMEÇA AQUI" mudou.

     Armadilhas desta mecânica (_padrao/DINAMICAS.md, linha "Ordenar / linha
     do tempo" e linha "Arrastar"), cada uma já paga em atividade de verdade:
       · TRÊS caminhos: mouse, dedo (arrasto real) e TOQUE SIMPLES;
       · NUNCA `preventDefault` no `touchstart` — mata o toque no celular;
       · guarda contra o evento de mouse FANTASMA que o celular dispara
         depois do toque (`ultimoToque`): sem ele o clique fantasma
         desmarca/reaciona a peça. Defeito pego DUAS vezes pelo Marcos;
       · nunca trava: no 3º erro a peça é revelada e a fila anda;
       · `data-qa` publicado (peça que serve AGORA = "1", e a vaga da vez
         também = "1") para o auditor-jogador conseguir terminar.

     ⭐ MAIS VISUAL E MAIS SONORA (ordem do Marcos, ago/2026: *"as dinâmicas
        interativas têm que ser mais VISUAIS e SONORAS para os pequenos"*):
       · **a ficha pode ter FIGURA** — `ORDEM` aceita o valor solto (como sempre)
         **ou** `{v, img, nome}`. Ordenar do menor para o maior só faz sentido
         para quem não lê se ela VIR o bicho. Sem `img` nada muda de aparência:
         as fases que já estão no ar continuam idênticas;
       · **alto-falante em cada ficha**, e ele NÃO responde — só fala (tocar no
         som para conferir o nome não pode custar um erro). Ele só aparece
         quando a fase deu um `nome`: botão sem o que dizer é pior que botão
         nenhum;
       · **a ficha diz o nome ao ser PEGA** e de novo ao assentar no lugar;
       · **as três dicas são FALADAS** — no 1º ano nada essencial fica só
         escrito;
       · ⚠️ **voz GRAVADA, nunca `speechSynthesis`** (`diz`, a ponte do
         integrador). A voz do navegador não existe no PC da escola e falha
         calada — portão `_qa/vozrobo.py`;
       · **acabamento:** ficha com brilho e sombra, destaque ao passar o dedo, e
         a vaga ASSENTA a ficha com um pop curto ao encaixar;
       · **ficha usada some de verdade** (`display:none`): com
         `visibility:hidden` ficava um buraco no banco — armadilha que já estava
         escrita no `_padrao/DINAMICAS.md` e continuava aqui dentro;
       · **o texto todo virou conteúdo** (`ORDTXT`): selo, balão, hint, as TRÊS
         dicas e o fecho. As dicas ainda diziam *"procure a MENOR de todas"* na
         fase do ALFABETO, que existe e está no ar.
     ============================================================ -->
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
/* ⚠️ A BANCADA TAMBEM DECLARA O TEMA (ago/2026). As pecas passaram a usar
   `var(--texto)` para seguir a atividade em que caem — mas aqui, sozinha,
   nao havia quem definisse o token, e a cor de reserva escura caia no fundo
   escuro da propria bancada: 1,06:1. O molde define o token que combina com
   o fundo DELE; a atividade redefine com o dela. */
:root{--texto:#f4efe6}
body{margin:0;font-family:"Segoe UI",Arial,sans-serif;background:#2b2118;color:#f4efe6}
#app{max-width:520px;margin:0 auto;padding:10px 12px 28px}
.prog{height:9px;background:rgba(255,255,255,.16);border-radius:9px;overflow:hidden;margin:6px 0 12px}
.prog i{display:block;height:100%;background:#59c24b;width:0;-webkit-transition:width .5s;transition:width .5s}
.selo{display:inline-block;background:#3c6ee0;color:#fff;font-weight:700;font-size:13px;
      letter-spacing:.4px;padding:6px 14px;border-radius:20px;margin:0 auto 10px;display:block;
      width:-webkit-fit-content;width:fit-content}
.balao{position:relative;background:rgba(255,253,246,.96);color:#221a12;border-radius:20px;
       padding:13px 17px;font-size:17px;font-weight:600;text-align:center;line-height:1.35;
       box-shadow:0 5px 16px rgba(0,0,0,.28)}
.balao b{color:#1f6b12}
.balao + *{margin-top:13px}
.centro{text-align:center}
.opts{display:block}
.opt{display:block;background:#fffdf6;color:#221a12;border:0;border-radius:16px;padding:13px 16px;
     margin:9px auto;font-size:16px;font-weight:600;min-height:48px;max-width:430px;cursor:pointer;
     box-shadow:0 4px 0 #c9bda6}
.opt:active{-webkit-transform:translateY(3px);transform:translateY(3px);box-shadow:0 1px 0 #c9bda6}
.opt.ok{background:#d6f5c8;box-shadow:0 4px 0 #7cb464}
.opt.no{background:#f7d9d2;box-shadow:0 4px 0 #c08c80}
.hint{font-size:14px;opacity:.85;margin-top:10px}

.tela{display:block}
/* ⚠️ o banner escondido nao pode contar como "resposta fora da tela": ele nao
   existe para a crianca ainda. `visibility` tira do alcance do dedo e do
   leitor de tela — so `bottom:-260px` deixava o botao clicavel no escuro. */
.banner{position:fixed;left:0;right:0;bottom:-260px;background:#1f6b12;color:#fff;text-align:center;
        padding:18px 16px 22px;border-radius:22px 22px 0 0;visibility:hidden;

.banner.show{bottom:0;visibility:visible}
.btn{background:#ffd54a;color:#33280a;border:0;border-radius:16px;padding:13px 26px;font-size:17px;

/* ---------------- A PEÇA: ORDENAR ---------------- */
/* ⚠️ a folga de 13px em cima e OBRIGATORIA: o balao tem sombra e nenhuma
   margem por baixo, entao o que vem colado nele vira um bloco so (regra 9 do
   _qa/leiaute.js, cobrada DUAS vezes pelo Marcos). */
.fila{display:block;text-align:center;margin:13px auto 12px}
.cam{display:inline-block;vertical-align:top;min-width:56px;min-height:60px;margin:3px;
     padding:5px 4px;border:3px dashed #a08e73;border-radius:14px;background:rgba(255,255,255,.10);
     color:#f4efe6;font-size:15px;font-weight:700;text-align:center;line-height:1.15;background:rgba(22,24,30,.82);color:#f4efe6;}
/* o numero do lugar ("1o", "2o") continua visivel de longe na vaga vazia */
.cam .vez{display:block;padding:12px 0}
/* certo = borda INTEIRA + a ficha dentro: forma, nao so cor (funciona no mudo
   e para quem nao distingue verde) */
.cam.ok{border-style:solid;border-color:#59c24b;background:#fffdf6;color:#221a12;font-size:24px;font-weight:800;
        -webkit-animation:opoe .3s ease;animation:opoe .3s ease}
/* ⭐ A ANIMACAO CURTA DO ENCAIXE: a ficha ASSENTA no lugar (nasce menor e
   acomoda). E o "ploc" que diz `entrou aqui` sem nenhuma palavra. */
@-webkit-keyframes opoe{0%{-webkit-transform:scale(.8)}60%{-webkit-transform:scale(1.08)}100%{-webkit-transform:scale(1)}}
@keyframes opoe{0%{transform:scale(.8)}60%{transform:scale(1.08)}100%{transform:scale(1)}}
.banco{display:block;text-align:center;margin-top:6px}
/* ⚠️ GESTO NO CELULAR: sem touch-action o navegador ROLA a pagina ao arrastar
   a peca — o dedo mexe a tela, nao a peca. `-ms-` cobre o Edge/IE antigo
   do PC da escola. Regenerado no pecas.css pelo integrar.py. */
.pc{-ms-touch-action:none;touch-action:none}
.pc{display:inline-block;vertical-align:top;color:#221a12;border:0;border-radius:16px;
    background:#fffdf6;
    background:-webkit-gradient(linear,left top,left bottom,from(#fffdf6),to(#f2e6cb));
    background:linear-gradient(#fffdf6,#f2e6cb);
    min-width:56px;min-height:56px;margin:5px 4px;padding:5px 6px;font-size:23px;font-weight:800;
    text-align:center;line-height:1.15;cursor:pointer;
    -webkit-box-shadow:inset 0 2px 0 rgba(255,255,255,.95),0 4px 0 #c9bda6,0 8px 13px rgba(0,0,0,.24);
    box-shadow:inset 0 2px 0 rgba(255,255,255,.95),0 4px 0 #c9bda6,0 8px 13px rgba(0,0,0,.24);
    -webkit-transition:-webkit-transform .16s;transition:transform .16s}
/* destaque de quem esta com o dedo/o mouse em cima */
.pc:hover{-webkit-transform:translateY(-2px);transform:translateY(-2px)}
.pc:active{-webkit-transform:translateY(3px);transform:translateY(3px);
           -webkit-box-shadow:0 1px 0 #c9bda6;box-shadow:0 1px 0 #c9bda6}
.pc.sel{background:#ffeeb0;-webkit-box-shadow:0 4px 0 #c9a52f,0 0 0 3px #ffd54a;
        box-shadow:0 4px 0 #c9a52f,0 0 0 3px #ffd54a}
/* ⚠️ FICHA USADA SOME DE VERDADE (`display:none`, lição do `_padrao/DINAMICAS.md`).
   Com `visibility:hidden` o retangulo invisivel continuava ocupando lugar — um
   buraco no banco — e ainda era medido pelos portoes como "resposta fora da
   tela". Some, e o banco se fecha sozinho. */
.pc.usada{display:none;pointer-events:none}
.pc.pisca{-webkit-animation:pisca .7s infinite;animation:pisca .7s infinite}
.pc.treme{-webkit-animation:treme .32s;animation:treme .32s}
@-webkit-keyframes pisca{0%,100%{box-shadow:0 4px 0 #c9bda6}50%{box-shadow:0 0 0 5px #ffd54a}}
@keyframes pisca{0%,100%{box-shadow:0 4px 0 #c9bda6}50%{box-shadow:0 0 0 5px #ffd54a}}
@-webkit-keyframes treme{25%{-webkit-transform:translateX(-6px)}75%{-webkit-transform:translateX(6px)}}
@keyframes treme{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
/* ⭐⭐ A FIGURA DE CADA FICHA (o pilar BEM ILUSTRADA).
   No 1o ano a criança nao le: ordenar "formiga, gato, cavalo" so tem sentido se
   ela VIR o bicho. A figura entra quando a fase traz o campo `img`; sem ele a
   ficha continua sendo so o valor, e nenhuma atividade antiga muda de aparencia.
   ⚠️ `contain` + fundo claro, NUNCA `cover`: proporcao que nao bate corta o
   topo da figura (regra da casa, ja paga). */
.ofig{width:64px;height:64px;margin:0 auto 3px;border-radius:12px;background:#efe6d2;
      display:-webkit-box;display:flex;-webkit-box-align:center;align-items:center;
      -webkit-box-pack:center;justify-content:center;overflow:hidden}
.ofig img{width:100%;height:100%;object-fit:contain}
/* a reserva de quando a figura ainda nao existe: a palavra escrita, escura sobre
   o claro (o caso em que ela e a UNICA coisa ali, entao tem que se ler bem) */
.ofig .semfig{font-size:12px;font-weight:800;color:#2f2718;padding:3px;letter-spacing:.3px}
/* ficha de TEXTO (cena da historia): larga o bastante para a frase caber e
   legivel para o 5o ano — nao e um numerinho, e uma cena para LER.
   ⚠️ LICAO PAGA (Teatro, ago/2026): frases de tamanhos diferentes quebravam em
   1 ou 2 linhas e a fileira ficava TORTA (o portao 5b reprovou: .pc de 75..93px
   na mesma fila). Altura minima igual + conteudo centralizado deixa todas as
   fichas do mesmo tamanho, caiba a frase em 1 ou em 2 linhas. */
.pc.txt{max-width:150px;min-width:132px;font-size:14px;padding:9px 12px;box-sizing:border-box;
    min-height:98px;display:inline-flex;flex-direction:column;
    -webkit-box-align:center;align-items:center;-webkit-box-pack:center;justify-content:center;
    vertical-align:top}
/* ⚠️ LICAO PAGA (Teatro, ago/2026): o motor forca `.pc:has(>.zap){min-height:70px}`
   (0,4,0) e vence o `.pc.txt`. Em vez de brigar por especificidade, o TEXTO
   reserva SEMPRE 2 linhas (a cena mais longa tem 2) e centraliza: frase de 1 ou
   de 2 linhas ocupa a MESMA altura, entao a fileira nunca fica torta — caiba o
   que couber no motor. */
.onom.otexto{max-width:138px;font-size:13.5px;line-height:1.28;letter-spacing:0;
      white-space:normal;overflow:visible;text-overflow:clip;
      min-height:2.56em;display:-webkit-box;display:flex;
      -webkit-box-align:center;align-items:center;
      -webkit-box-pack:center;justify-content:center}
.onom{display:block;font-size:12px;font-weight:800;letter-spacing:.3px;max-width:92px;
      margin:0 auto;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.oval{display:block}
/* ⭐ O ALTO-FALANTE DA FICHA (pilar SONORA). So aparece quando a fase deu um
   NOME para dizer — botao que nao tem o que falar e pior que botao nenhum. */
.zap{display:inline-block;vertical-align:middle;width:44px;height:44px;margin:3px 0 0;
     border:0;border-radius:12px;background-color:#efe6d2;cursor:pointer;padding:0;line-height:44px}
.zap:hover{background-color:#e6d9bd}
.zap:active{background-color:#ded3b8}
/* ⚠️ o alto-falante e um SVG embutido (§5 da RECEITA): ele se centra sozinho
   pelo `viewBox` e nao tem coordenada para errar. A cor mora DENTRO do SVG, por
   isso `background-color` e `background-image` andam separados. */
.fone{display:inline-block;vertical-align:middle;width:22px;height:22px;
      background:url("data:image/svg+xml;charset=utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 20 20'%3E%3Cpath fill='%2333280a' d='M4 7.6h3.1L11 3.9v12.2L7.1 12.4H4z'/%3E%3Cpath fill='none' stroke='%2333280a' stroke-width='1.7' stroke-linecap='round' d='M13.3 7.1a4.2 4.2 0 0 1 0 5.8'/%3E%3C/svg%3E") center center no-repeat;
      -webkit-background-size:22px 22px;background-size:22px 22px}
/* a sombra que segue o dedo/o mouse durante o arrasto. pointer-events:none
   para nao roubar o hit-test de quem esta embaixo. */
.somb{position:fixed;min-width:52px;min-height:52px;padding:5px 6px;text-align:center;border-radius:16px;
      background:#fffdf6;color:#221a12;font-size:23px;font-weight:800;pointer-events:none;z-index:60;
      line-height:1.15;box-shadow:0 8px 18px rgba(0,0,0,.45)}
/* ⚠️ TELA BAIXA (o monitor 1024x420 da escola): encolhe a figura e o respiro,
   nunca o alvo de dedo — a ficha continua acima dos 44px. */
@media (max-height:560px){
  .ofig{width:56px;height:56px}
  .fila{margin:10px auto 8px}
  .cam{min-height:54px;margin:2px}
  .cam .vez{padding:9px 0}
  .pc{margin:4px 3px}
}
/* ⚠️ CELULAR PEQUENO (320px), e isto foi MEDIDO com a fase de figuras: as cinco
   vagas quebravam em duas fileiras e empurravam o banco 25px para baixo da
   dobra. Vaga mais estreita = uma fileira só, e as fichas voltam para dentro da
   tela. O alvo de dedo continua acima de 44px; quem encolhe é a figura. */
@media (max-width:400px){
  .cam{min-width:48px;margin:2px}
  .cam .vez{padding:10px 0}
  .cam .ofig{width:48px;height:48px}
  .ofig{width:56px;height:56px}
  .onom{font-size:11px;max-width:74px}
  .pc{margin:4px 3px}
}
.medal{width:96px;height:96px;line-height:96px;margin:6px auto 0;border-radius:50%;
       background:#ffd54a;color:#33280a;font-size:20px;font-weight:800;text-align:center;
       box-shadow:0 6px 0 #c9a52f}

<div id="app"></div>
<div id="banner" class="banner"><div id="bmsg"></div><button id="bcta" class="btn" style="margin-top:12px">Continuar</button></div>
<script>
/* ====== MOTORZINHO DA PEÇA (os mesmos nomes das atividades) ====== */
var app=document.getElementById("app"), banner=document.getElementById("banner"),
    bmsg=document.getElementById("bmsg"), bcta=document.getElementById("bcta");
function el(t,c,h){var e=document.createElement(t);if(c)e.className=c;if(h!==undefined&&h!==null)e.innerHTML=h;return e;}
function limpa(){app.innerHTML="";}
function setProg(t,p){var pr=el("div","prog");var i=el("i");i.style.width=p+"%";pr.appendChild(i);t.appendChild(pr);}
/* ⚠️ A DICA TEM QUE CABER NA TELA (ago/2026). Ela era o ULTIMO filho do
   `.centro`, e em janela apertada (320x568 e 1024x420 — o monitor da escola)
   caia 25 a 96 px ABAIXO DA DOBRA: a crianca que errou precisava ROLAR para ler
   a ajuda, justo no momento em que esta perdida. Agora ela entra LOGO DEPOIS do
   enunciado, que e onde o olho ja esta. Defeito estrutural: valia para as 57
   pecas de uma vez. */
function mostraDica(txt){var d=document.getElementById("dicaP");
  if(!d){ d=el("div","dica"); d.id="dicaP";
    var b=app.getElementsByClassName("balao")[0];
    if(b&&b.parentNode) b.parentNode.insertBefore(d,b.nextSibling);
    else (app.querySelector(".centro")||app).appendChild(d);
  } d.innerHTML=txt;}
function mostraBanner(msg,cb){bmsg.innerHTML=msg;banner.className="banner show";festa();
  bcta.onclick=function(){banner.className="banner";if(cb)cb();};}
function baguncar(a){var i,j,x;for(i=a.length-1;i>0;i--){j=Math.floor(Math.random()*(i+1));x=a[i];a[i]=a[j];a[j]=x;}return a;}
/* som: os numeros vieram da pesquisa (PESQUISA-SOM-E-GAMEFEEL). "ding" e
   sintetizado — MP3 chega atrasado e mata a sensacao de causa-efeito. */
var AC=null;
function ac(){try{if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();
  if(AC.state==="suspended")AC.resume();}catch(e){}return AC;}
function nota(f,dur,vol,tipo,atraso){var c=ac();if(!c)return;
  var o=c.createOscillator(),g=c.createGain(),t=c.currentTime+(atraso||0);
  o.type=tipo||"triangle";o.frequency.value=f;
  g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol||.18,t+.014);
  g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(g);g.connect(c.destination);o.start(t);o.stop(t+dur+.02);}
function sCerto(){nota(523.25,.35,.18,"triangle",0);nota(659.25,.35,.16,"triangle",.055);nota(783.99,.35,.15,"triangle",.11);}
function sErro(){nota(300,.14,.12,"sine",0);nota(318,.14,.12,"sine",0);}
function sTap(){nota(880,.012,.10,"square",0);}
function festa(){sCerto();}
document.addEventListener("pointerdown",function(){ac();},false);
</script>
<script>
/* ====== A PEÇA COMEÇA AQUI ====== */
/* ORDENAR — a crianca poe 5 fichas em ordem, do MENOR para o MAIOR.
   Conteudo neutro de proposito: numero e o mesmo em qualquer disciplina.
   Trocar `ORDEM` (e o texto do balao) ja adapta a peca a outro conteudo,
   desde que a lista continue tendo UMA ordem certa e so uma. */
/* ⭐⭐ CADA FICHA PODE SER SÓ O VALOR **OU** UMA FIGURA (ago/2026, ordem do
   Marcos: *"as dinâmicas interativas têm que ser mais VISUAIS e SONORAS para os
   pequenos"*). Os dois formatos valem, e é de propósito:

     var ORDEM=[2,5,9,14,21];                    <- como sempre foi
     var ORDEM=[{v:1, img:"xx_formiga", nome:"FORMIGA"},
                {v:2, img:"xx_gato",    nome:"GATO"}];   <- com desenho e voz
     (o `xx_` do exemplo e de proposito: citar o nome de arte de OUTRA
      atividade, mesmo dentro de um comentario, faz o portao de resto-de-clone
      acusar prefixo alheio — e ele esta certo, porque comentario viaja junto)

   · v    — o valor que manda na ORDEM (é por ele que a peça confere)
   · img  — o nome da figura (img/<img>.png). A criança do 1º ano não lê:
            ordenar bichos do menor para o maior só faz sentido VENDO o bicho
   · nome — o que está escrito embaixo e o que o alto-falante DIZ

   ⚠️ O formato antigo continua valendo palavra por palavra — as fases que já
   existem (`[2,5,9,14,21]`, `["A","B","C","D","E"]`) não mudam em nada. É por
   isso que o exemplo aqui embaixo continua sendo o dos números: peça que muda
   de formato quebra a atividade que já está no ar. */
var ORDEM=[2,5,9,14,21];
/* ⭐ O TEXTO DA PECA E CONTEUDO, NAO MOLDE (licao paga ago/2026).
   Esta peca compara por POSICAO NA LISTA (`b.num===ORDEM[vagaAtual]`), entao
   ela ja servia para letras — `ORDEM=["A","B","C"]` funciona. So que o balao
   dizia, fixo, "da menor para a maior": a crianca do 1o ano ia ler isso na fase
   do ALFABETO. Numa atividade montada o enunciado da fase fica escondido quando
   a peca poe o balao dela, entao seria essa a unica instrucao na tela — e
   estaria errada. Agora o texto vem na gaveta e acompanha o conteudo. */
/* ⚠️ E AS DICAS TAMBÉM SÃO CONTEÚDO — a mesma lição, pega de novo (ago/2026).
   O balão já tinha saído do corpo, mas os TRÊS degraus do andaime continuavam
   cravados dizendo *"procure a MENOR de todas"*. Na fase do ALFABETO
   (`ORDEM=["A","B","C","D","E"]`, que existe e está no ar) a criança erra, pede
   ajuda, e a ajuda fala de tamanho — sobre letras. Agora elas moram aqui, e
   quem troca o conteúdo troca a ajuda junto.
   ⚠️ Escrito com acento de verdade, não com `&#225;`: este texto é FALADO, e a
   gravação é feita a partir do próprio texto. Entidade HTML na fala vira uma
   chave que não existe — e o botão fica mudo. */
var ORDTXT={selo:"EM ORDEM",
            balao:"Ponha as fichas <b>da menor para a maior</b>.",
            hint:"Toque na ficha ou arraste até a fila.",
            d:["Olhe as fichas soltas e procure a <b>menor</b> de todas.",
               "A menor que sobrou está <b>piscando</b>. Toque nela.",
               "Era esta! Vamos juntos: eu coloco e você segue."],
            fim:"Fila pronta! Da menor para a maior."};
var vagaAtual=0, errosSeg=0, telaAtual=null, barraP=null;
var pecas=[], camas=[];
/* a FIGURA vem do MOTOR (`imgEl`, que sabe onde mora a pasta `img/`). Na
   bancada ela não existe e a peça escreve o nome no lugar — nunca um
   quadradinho vazio, que é pior que figura nenhuma. Pegar por `window.imgEl`
   (e não por `typeof`) deixa o nome DECLARADO: se um dia o motor trocar essa
   ferramenta de nome, o portão "função que não existe" avisa em vez de a
   figura sumir calada. */
var figEl = window.imgEl || null;

/* ---------- ler a ficha, venha ela como valor ou como objeto ---------- */
function ehObj(it){ return it!==null && typeof it==="object"; }
function valDe(it){ return ehObj(it) ? it.v : it; }
function imgDe(it){ return ehObj(it) ? (it.img||it.fig||"") : ""; }
function nomeDe(it){ return ehObj(it) ? (it.nome||"") : ""; }
/* o que a voz diz desta ficha: o nome, se a fase deu um. Número solto não vira
   voz — não há gravação para "14", e botão mudo é pior que botão nenhum. */
function vozDe(it){ return nomeDe(it); }

/* ⚠️⚠️ A VOZ É GRAVADA, SEMPRE. Quem fala é o motor: a ponte do integrador
   injeta um `diz(txt)` que toca o MP3 do Edge TTS. Aqui NUNCA se chama
   `speechSynthesis` — no PC da escola essa voz não existe e falha CALADA (o
   portão `_qa/vozrobo.py` mede isso). Sozinha na bancada a peça fica sem voz,
   e continua inteira: tudo o que a voz diz também está escrito e desenhado. */
var _vozTxt="", _vozQuando=0;
function voz(txt){
  if(!txt) return;
  var t=String(txt).replace(/<[^>]+>/g,""), agora=(new Date()).getTime();
  /* sem eco: a mesma ficha é dita ao ser PEGA e ao ser POSTA, e tocar o mesmo
     mp3 de novo o reinicia — a criança ouve a palavra picada. */
  if(t===_vozTxt && agora-_vozQuando<1000) return;
  _vozTxt=t; _vozQuando=agora;
  if(typeof diz==="function") diz(t);
}
/* a dica falada espera meio segundo: a criança acabou de ouvir o nome da ficha
   que pegou, e falar por cima corta justamente a voz que ela pediu. */
function dizDica(txt){
  var t=telaAtual;
  setTimeout(function(){ if(!t||!t.parentNode) return; voz(txt); },520);
}

/* ---------- o corpo da ficha: figura + nome + valor ---------- */
function corpoFicha(it, dentro){
  var im=imgDe(it), nm=nomeDe(it);
  if(im){
    var f=el("div","ofig");
    /* ⚠️ FIGURA QUE NÃO EXISTE NÃO VAI PARA A TELA (regra da casa): quadradinho
       vazio é pior que figura nenhuma. Na bancada, onde o motor não está, o
       lugar da figura mostra o VALOR — e nunca o nome, que já está escrito
       logo abaixo (o mesmo texto duas vezes na mesma ficha é sujeira). */
    if(figEl){ f.appendChild(figEl(im)); }
    else { f.appendChild(el("div","semfig", ""+valDe(it))); }
    dentro.appendChild(f);
    if(nm) dentro.appendChild(el("span","onom", nm));
    return;
  }
  /* ⚠️ LICAO PAGA (Teatro das Palavras, ago/2026): sem figura, a ficha e de
     TEXTO — uma CENA da historia ("Tico subiu ao palco."). Mostra o NOME, nunca
     o valor cru: com so "1/2/3" a crianca ordena os numeros sem LER as cenas, e
     o balao ja pede "coloque as cenas na ordem". So cai no valor quando nao ha
     nem figura nem nome (ordenar numerico puro, do menor para o maior). */
  if(nm){ dentro.className+=" txt"; dentro.appendChild(el("span","onom otexto", nm)); }
  else { dentro.appendChild(el("span","oval", ""+valDe(it))); }
}
/* ⚠️ o guarda do MOUSE FANTASMA: o celular dispara mousedown/click DEPOIS do
   toque. Sem esta marca de tempo a peca era acionada duas vezes (o toque
   colocava e o fantasma tentava colocar de novo). */
var ultimoToque=0, pego=null, somb=null, px0=0, py0=0, moveu=false;

function telaOrdenar(){
  limpa(); document.onkeydown=null; soltaSombra();
  vagaAtual=0; errosSeg=0; pecas=[]; camas=[];
  var t=el("div","tela"); telaAtual=t; setProg(t,0);
  barraP=t.querySelector(".prog i");
  var c=el("div","centro");
  c.appendChild(el("div","selo",ORDTXT.selo||"EM ORDEM"));
  c.appendChild(el("div","balao",ORDTXT.balao||"Ponha as fichas <b>da menor para a maior</b>."));
  var f=el("div","fila"), i, cm, b, n;
  for(i=0;i<ORDEM.length;i++){
    cm=el("div","cam","");
    cm.appendChild(el("span","vez",(i+1)+"&#186;"));
    f.appendChild(cm); camas.push(cm);
  }
  c.appendChild(f);
  var bc=el("div","banco");
  var sorteadas=baguncar(ORDEM.slice(0));
  for(i=0;i<sorteadas.length;i++){
    n=sorteadas[i];
    b=el("div","pc","");
    b.item=n;
    b.num=valDe(n);
    corpoFicha(n, b);
    poeFalante(b, n);
    ligaFicha(b);
    bc.appendChild(b); pecas.push(b);
  }
  c.appendChild(bc);
  c.appendChild(el("div","hint",ORDTXT.hint||"Toque na ficha ou arraste at&#233; a fila."));
  t.appendChild(c); app.appendChild(t);
  marcaQualServe();
  voz(ORDTXT.balao||"");
}

/* ⭐ O ALTO-FALANTE DA FICHA. Ele NÃO escolhe: só fala — sem isto, tocar no
   alto-falante para conferir o nome valia como resposta e a criança levava um
   erro por ter querido ouvir. E `data-voz` DECLARA o texto: assim o motor não
   precisa adivinhar pelo que está escrito dentro do cartão. */
function poeFalante(b, it){
  var t=vozDe(it);
  if(!t) return;
  var z=el("button","zap","");
  z.type="button";
  z.appendChild(el("i","fone",""));
  z.setAttribute("aria-label","Ouvir "+t);
  z.setAttribute("data-voz", t);
  /* ⚠️ O TOQUE NO ALTO-FALANTE NÃO PODE SUBIR até a ficha — se subir, ele vale
     como RESPOSTA e a criança que só queria conferir o nome leva um erro.
     Segurar só o `click` não basta: o `mousedown` e o `touchend` da ficha
     resolvem sozinhos (é o arrasto), e são eles que precisam ser barrados. */
  z.onmousedown=paraAqui;
  z.addEventListener("touchstart",paraAqui,false);
  z.addEventListener("touchend",function(ev){
    paraAqui(ev); ultimoToque=Date.now(); falaFicha(t);
  },false);
  z.onclick=function(ev){ paraAqui(ev); falaFicha(t); return false; };
  b.appendChild(z);
}
function paraAqui(ev){
  var e=ev||window.event;
  if(e.stopPropagation) e.stopPropagation(); else e.cancelBubble=true;
}
/* o `voz()` já engole a repetição do mesmo texto em menos de 1s, então o clique
   FANTASMA que vem depois do toque não faz a palavra tocar duas vezes. */
function falaFicha(t){ sTap(); voz(t); }

/* ---------- as TRES portas de entrada da mesma ficha ---------- */
/* ⚠️ o `touchstart` recebe uma funcao COM NOME de proposito: assim nenhum
   `preventDefault` fica perto dele. preventDefault no touchstart mata o
   toque no celular (armadilha registrada no _padrao/DINAMICAS.md). */
function ligaFicha(b){
  b.onclick=cliqueFicha;
  b.onmousedown=mouseIni;
  b.addEventListener("touchstart",toqueIni,false);
  b.addEventListener("touchmove",toqueMeio,false);
  b.addEventListener("touchend",toqueFim,false);
}
function cliqueFicha(){
  if(Date.now()-ultimoToque<700) return;   /* clique FANTASMA depois do toque */
  tocaFicha(this);
}
function mouseIni(ev){
  if(Date.now()-ultimoToque<700) return;
  pegaEm(this,ev.clientX,ev.clientY);
}
function toqueIni(ev){
  ultimoToque=Date.now();
  var to=ev.touches[0]; if(!to) return;
  pegaEm(this,to.clientX,to.clientY);
}
function toqueMeio(ev){
  if(!pego) return;
  var to=ev.touches[0]; if(!to) return;
  moveEm(to.clientX,to.clientY);
  if(moveu) ev.preventDefault();   /* so no MEIO do arrasto, nunca no comeco */
}
function toqueFim(ev){
  ultimoToque=Date.now();
  var to=ev.changedTouches[0], arrastou=moveu, alvo=this;
  if(to) soltaEm(to.clientX,to.clientY); else soltaSombra();
  if(!arrastou) tocaFicha(alvo);   /* toque simples: vale como clique */
}
function moveMouse(ev){ if(pego) moveEm(ev.clientX,ev.clientY); }
function soltaMouse(ev){ if(pego) soltaEm(ev.clientX,ev.clientY); }
document.onmousemove=moveMouse;
document.onmouseup=soltaMouse;

/* ---------- o arrasto de verdade (mouse e dedo usam o mesmo caminho) ---- */
function pegaEm(b,x,y){
  if(!b||b.className.indexOf("usada")>=0) return;
  pego=b; px0=x; py0=y; moveu=false;
  /* ⭐ PEGOU A FICHA: som na hora E O NOME DITO. No 1º ano é assim que a
     criança sabe o que tem na mão — ela escolhe pela figura e confirma pela
     voz. Sem nome (fase de números/letras) fica só o som do toque. */
  sTap(); voz(vozDe(b.item));
  b.className="pc sel";
  somb=el("div","somb","");
  corpoFicha(b.item, somb);
  somb.style.left=(x-26)+"px"; somb.style.top=(y-26)+"px";
  somb.style.display="none";
  document.body.appendChild(somb);
}
function moveEm(x,y){
  if(!pego||!somb) return;
  if(!moveu&&(Math.abs(x-px0)>8||Math.abs(y-py0)>8)){ moveu=true; somb.style.display="block"; }
  if(moveu){ somb.style.left=(x-26)+"px"; somb.style.top=(y-26)+"px"; }
}
function soltaEm(x,y){
  var b=pego, arrastou=moveu;
  soltaSombra();
  if(!b) return;
  if(b.className.indexOf("usada")<0) b.className="pc";
  if(!arrastou) return;            /* nao arrastou: quem resolve e o clique */
  if(naFila(x,y)) tocaFicha(b);
}
function soltaSombra(){
  if(somb&&somb.parentNode) somb.parentNode.removeChild(somb);
  somb=null; pego=null; moveu=false;
}
function naFila(x,y){
  var e=document.elementFromPoint(x,y), n=0;
  while(e&&n<6){
    var cl=" "+String(e.className||"")+" ";
    if(cl.indexOf(" cam ")>=0||cl.indexOf(" fila ")>=0) return true;
    e=e.parentNode; n++;
  }
  return false;
}

/* ---------- a regra da fase ---------- */
function tocaFicha(b){
  if(!b||b.className.indexOf("usada")>=0) return;
  if(vagaAtual>=ORDEM.length) return;
  if(b.num===valDe(ORDEM[vagaAtual])) poeNaFila(b); else erraFicha(b);
}
function poeNaFila(b){
  var cm=camas[vagaAtual];
  cm.className="cam ok"; cm.innerHTML="";
  corpoFicha(b.item, cm);
  b.className="pc usada";
  sCerto();
  /* a ficha assentou: o nome dela é dito de novo, agora no lugar certo — é o
     fecho sonoro do gesto (e quem não lê ouve a fila se formando). */
  voz(vozDe(b.item));
  vagaAtual++; errosSeg=0;
  apagaDica();
  if(barraP) barraP.style.width=Math.round(vagaAtual*100/ORDEM.length)+"%";
  marcaQualServe();
  if(vagaAtual>=ORDEM.length) fechaFase();
}
function erraFicha(b){
  sErro(); errosSeg++;
  b.className="pc treme";
  destreme(b);
  ajuda(errosSeg);
}
/* ⚠️ o temporizador continua correndo depois do limpa(): sem o guarda
   `!telaAtual.parentNode` ele mexeria numa tela que ja saiu. */
function destreme(b){
  setTimeout(function(){
    if(!telaAtual||!telaAtual.parentNode) return;
    if(b.className.indexOf("usada")<0) b.className="pc";
  },340);
}
function dicaN(n, reserva){
  var d=ORDTXT.d||[];
  return d[n-1] || reserva;
}
function ajuda(n){
  var txt;
  if(n===1){
    txt=dicaN(1,"Olhe as fichas soltas e procure a <b>menor</b> de todas.");
    mostraDica(txt); dizDica(txt);
  }else if(n===2){
    txt=dicaN(2,"A menor que sobrou está <b>piscando</b>. Toque nela.");
    mostraDica(txt); dizDica(txt);
    acendeCerta();
  }else{
    txt=dicaN(3,"Era esta! Vamos juntos: eu coloco e você segue.");
    mostraDica(txt); dizDica(txt);
    seguraDica(4000);   /* por a ficha APAGA a dica: segura para dar tempo de ler */
    revela();
  }
}
function acendeCerta(){
  var i,b;
  for(i=0;i<pecas.length;i++){
    b=pecas[i];
    if(b.className.indexOf("usada")>=0) continue;
    b.className=(b.num===valDe(ORDEM[vagaAtual]))?"pc pisca":"pc";
  }
}
function revela(){
  var i,b;
  for(i=0;i<pecas.length;i++){
    b=pecas[i];
    if(b.className.indexOf("usada")<0&&b.num===valDe(ORDEM[vagaAtual])){ poeNaFila(b); return; }
  }
}
/* ⚠️ MESMO DEFEITO DA `linha-do-tempo`, achado pelo mesmo portao (ago/2026):
   no 3o tropeco o andaime revela — escreve "Era esta! Vamos juntos" e poe a
   ficha. So que POR a ficha passa pelo caminho do acerto, que chama
   `apagaDica()`: a frase aparecia e sumia no mesmo pisco, e quem mais precisava
   da explicacao era a unica crianca que nao conseguia ler a dela.
   Defeito de FAMILIA, nao de arquivo: vale para toda peca em que revelar
   tambem AVANCA a fase. */
var dicaPresaAte = 0;
function seguraDica(ms){ dicaPresaAte = (new Date()).getTime() + (ms||4000); }
function apagaDica(){
  var d=document.getElementById("dicaP");
  if(!d||!d.parentNode) return;
  var falta = dicaPresaAte - (new Date()).getTime();
  if(falta > 0){ setTimeout(apagaDica, falta + 30); return; }
  d.parentNode.removeChild(d);
}
/* data-qa: a ficha que serve AGORA e a vaga da vez ficam com "1". E so para o
   auditor-jogador (_qa/jogador.js) conseguir terminar a peca sozinho. */
function marcaQualServe(){
  var i,b;
  for(i=0;i<pecas.length;i++){
    b=pecas[i];
    b.setAttribute("data-qa",(b.className.indexOf("usada")<0&&vagaAtual<ORDEM.length&&b.num===valDe(ORDEM[vagaAtual]))?"1":"0");
  }
  for(i=0;i<camas.length;i++) camas[i].setAttribute("data-qa",(i===vagaAtual)?"1":"0");
}
function fechaFase(){
  setTimeout(function(){
    if(!telaAtual||!telaAtual.parentNode) return;
    var f=ORDTXT.fim||"Fila pronta! Da menor para a maior.";
    voz(f);
    mostraBanner(f,telaFim);
  },420);
}

function telaFim(){
  limpa(); document.onkeydown=null; soltaSombra();
  var t=el("div","tela"); telaAtual=t; setProg(t,100);
  var c=el("div","centro");
  c.appendChild(el("div","selo","PRONTO"));
  c.appendChild(el("div","medal","MEDALHA"));
  c.appendChild(el("div","balao","Voc&#234; colocou tudo <b>em ordem</b>."));
  var b=el("button","btn","Jogar de novo");
  b.onclick=telaOrdenar;
  c.appendChild(b);
  t.appendChild(c); app.appendChild(t);
}
telaOrdenar();
</script>
</body></html>
