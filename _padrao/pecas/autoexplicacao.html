<!-- ============================================================
     PEÇA: AUTOEXPLICAÇÃO INDUZIDA  (copiada do _padrao/pecas/MOLDE.html)

     O que a criança faz: resolve um passo e, DEPOIS DE ACERTAR, o mascote
     pergunta "por que deu certo?" — e ela TOCA NO DESENHO que mostra a razão.

     Por que existe: é a mecânica com a evidência mais limpa do nosso leque —
     g ≈ 0,55 em 64 estudos (REGRAS-INTERATIVIDADE, linha "Autoexplicação
     induzida"). Acertar sem saber por quê não fica; explicar fixa.

     A armadilha, em uma linha (mesma tabela):
       "se virar campo de digitar no 2º ano: BARREIRA MOTORA".
     Por isso aqui NÃO EXISTE campo de texto: a razão é um CARTÃO COM DESENHO
     (SVG embutido) e uma frase curta. Um toque, e pronto.

     A segunda regra, tão importante quanto: O MASCOTE NUNCA DÁ A RESPOSTA.
     Ele só PERGUNTA, cada vez mais de perto ("o que a planta recebe na janela
     que não recebe no armário?"). Quem revela, no 3º erro, é o ANDAIME do
     motor — e revela para ninguém ficar preso, nunca como fala dele.

     Outras armadilhas fechadas aqui:
       · os cartões vão EMBARALHADOS (`baguncar`): senão a criança aprende a
         posição, não a razão;
       · o erro não pune — treme, fica riscado e o mascote pergunta de novo;
         nunca X vermelho, nunca a palavra "errou";
       · com 3 opções o degrau "revelar" viraria código morto se as erradas
         acabassem antes: há a REDE (`sobrouSoACerta`) que revela na hora;
       · `data-qa="1"` no que serve AGORA, para o auditor-jogador terminar;
       · cada tela se vira sozinha (`garanteRodada`) — os portões abrem cada
         tela do zero, sem passar pelas anteriores.
     ============================================================ -->
<style>

   escuro da propria bancada: 1,06:1. O molde define o token que combina com
   o fundo DELE; a atividade redefine com o dela. */

.byte{width:62px;height:62px;margin:6px auto 8px}

/* ⚠️ A PECA SO SABIA MEDIR SVG (ago/2026). A figura pode vir de tres jeitos
   (`img` da arte, `svg` da bancada, ou nada — ver `figuraDe`), e so o SVG
   tinha tamanho declarado. Com `img`, o <img> entrava no cartao com o tamanho
   NATURAL do arquivo: 584px de figura dentro de uma opcao de 150px, vazando
   322px para fora — o portao do vazamento pegou nos quatro tamanhos de tela.
   Regra: quem aceita mais de uma FORMA de figura declara o tamanho das duas. */
.esc svg,.esc img{display:block;width:44px;height:44px;object-fit:contain;margin:0 auto 4px}
/* o CARTÃO DA RAZÃO: desenho à esquerda, frase curta à direita. Nunca um
   campo de digitar — a razão se APONTA.
   ⚠️ o cartão é um `.opt` puro de propósito: o _qa/dinamicas.py só reconhece a
   mecânica "escolher" quando enxerga `el("div","opt"` — com a classe composta

/* ⚠️ FILEIRA TORTA (portao 5b, janela baixa): os cartoes da razao tem
   frases de tamanhos diferentes, entao um fica com 47px e o outro com 65px

.cardfig svg,.cardfig img{display:block;width:100%;height:100%;object-fit:contain}

  .byte{width:44px;height:44px;margin:2px auto 6px}

  .hint{display:none}

<script>
/* ====== MOTORZINHO DA PEÇA (os mesmos nomes das atividades) ====== */
var app=document.getElementById("app"), banner=document.getElementById("banner"),
    bmsg=document.getElementById("bmsg"), bcta=document.getElementById("bcta");
function el(t,c,h){var e=document.createElement(t);if(c)e.className=c;if(h!==undefined&&h!==null)e.innerHTML=h;return e;}
function limpa(){app.innerHTML="";}
function setProg(t,p){var pr=el("div","prog");var i=el("i");i.style.width=p+"%";pr.appendChild(i);t.appendChild(pr);}
/* ⚠️ A DICA TEM QUE CABER NA TELA (ago/2026). Ela era o ULTIMO filho do
   `.centro`, e em janela apertada (320x568 e 1024x420 — o monitor da escola)
   caia 25 a 96 px ABAIXO DA DOBRA: a crianca que errou precisava ROLAR para ler
   a ajuda, justo no momento em que esta perdida. Agora ela entra LOGO DEPOIS do
   enunciado, que e onde o olho ja esta. Defeito estrutural: valia para as 57
   pecas de uma vez. */
function mostraDica(txt){var d=document.getElementById("dicaP");
  if(!d){ d=el("div","dica"); d.id="dicaP";
    var b=app.getElementsByClassName("balao")[0];
    if(b&&b.parentNode) b.parentNode.insertBefore(d,b.nextSibling);
    else (app.querySelector(".centro")||app).appendChild(d);
  } d.innerHTML=txt;}
function mostraBanner(msg,cb){bmsg.innerHTML=msg;banner.className="banner show";festa();
  bcta.onclick=function(){banner.className="banner";if(cb)cb();};}
function baguncar(a){var i,j,x;for(i=a.length-1;i>0;i--){j=Math.floor(Math.random()*(i+1));x=a[i];a[i]=a[j];a[j]=x;}return a;}
/* som: os numeros vieram da pesquisa (PESQUISA-SOM-E-GAMEFEEL). "ding" e
   sintetizado — MP3 chega atrasado e mata a sensacao de causa-efeito. */
var AC=null;
function ac(){try{if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();
  if(AC.state==="suspended")AC.resume();}catch(e){}return AC;}
function nota(f,dur,vol,tipo,atraso){var c=ac();if(!c)return;
  var o=c.createOscillator(),g=c.createGain(),t=c.currentTime+(atraso||0);
  o.type=tipo||"triangle";o.frequency.value=f;
  g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol||.18,t+.014);
  g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(g);g.connect(c.destination);o.start(t);o.stop(t+dur+.02);}
function sCerto(){nota(523.25,.35,.18,"triangle",0);nota(659.25,.35,.16,"triangle",.055);nota(783.99,.35,.15,"triangle",.11);}
function sErro(){nota(300,.14,.12,"sine",0);nota(318,.14,.12,"sine",0);}
function sTap(){nota(880,.012,.10,"square",0);}
function festa(){sCerto();}
document.addEventListener("pointerdown",function(){ac();},false);
</script>

  cards:[{svg:SVG_LUZFOLHA,t:"A folha usa a <b>luz do sol</b> para fabricar o alimento dela.",c:true},
         {svg:SVG_VASOGRANDE,t:"O vaso da janela é <b>maior</b> que o outro.",c:false},
         {svg:SVG_VENTO,t:"Perto da janela o <b>vento</b> empurra a planta para cima.",c:false}]},
 {selo:"OS DOIS COPOS",
  tarefa:"Dois copos iguais, com água igual. Um no sol, outro na sombra. <b>Qual seca primeiro?</b>",
  dicas:["Pense em que lugar as coisas ficam mais <b>quentes</b>.",
         "Risquei um que não serve. Onde bate o <b>sol</b>?"],
  esc:[{svg:SVG_COPOSOL,r:"O copo do sol",c:true},
       {svg:SVG_COPOSOMBRA,r:"O copo da sombra",c:false},
       {svg:SVG_DOISCOPOS,r:"Os dois juntos",c:false}],
  pq:"Isso! E <b>por que</b> o copo do sol seca primeiro?",
  perguntas:["Deixa eu perguntar de outro jeito: o sol deixa a água <b>como</b>?",
             "Olhe o desenho da água <b>subindo em fiozinhos</b>. Para onde será que ela vai?"],
  cards:[{svg:SVG_VAPOR,t:"O <b>calor</b> do sol faz a água virar vapor e subir para o ar.",c:true},
         {svg:SVG_FUNDO,t:"O copo do sol é mais <b>fundo</b> que o outro.",c:false},
         {svg:SVG_PESO,t:"A água da sombra é mais <b>pesada</b>.",c:false}]}
];

var rodada=0, errosSeg=0, respondida=false, telaAtual=null, cartoes=[];

/* ⚠️ cada tela pode ser aberta SOZINHA (é o que os portões de contraste e de
   leiaute fazem). Sem isto, telaPorque() com `rodada` fora da lista montaria
   uma tela vazia — e tela vazia derruba o portão inteiro. */
function garanteRodada(){ if(!RODADAS[rodada]) rodada=0; }

/* ---------------- 1) A TAREFA (só o gatilho) ---------------- */
function telaTarefa(){
  limpa(); garanteRodada();
  errosSeg=0; respondida=false; cartoes=[];
  var f=RODADAS[rodada];
  var t=el("div","tela"); telaAtual=t; setProg(t,rodada*50+4);
  var c=el("div","centro");
  c.appendChild(el("div","selo",f.selo));
  c.appendChild(el("div","balao",f.tarefa));
  var box=el("div","escs"), lista=baguncar(f.esc.slice(0)), i, d;
  for(i=0;i<lista.length;i++){
    d=el("div","opt esc",figuraDe(lista[i])+"<span>"+lista[i].r+"</span>");
    d.dado=lista[i]; d.base="opt esc";
    d.setAttribute("data-qa",lista[i].c?"1":"0");
    d.onclick=escolheuTarefa;
    box.appendChild(d); cartoes.push(d);
  }
  c.appendChild(box);
  c.appendChild(el("div","hint","Escolha e depois eu vou querer saber o porquê."));
  t.appendChild(c); app.appendChild(t);
}
function escolheuTarefa(){
  if(respondida) return;
  sTap();
  if(this.dado.c){ fechaTarefa(this); return; }
  sErro(); errosSeg++;
  this.className="opt esc no treme";
  destreme(this);
  if(errosSeg>=3){ revelaTarefa(); return; }
  mostraDica(RODADAS[rodada].dicas[errosSeg-1]);
  if(errosSeg===2) riscaUmaErrada();
  if(sobrouSoACerta()) revelaTarefa();
}
/* ⚠️ `manter` existe por causa de um defeito achado testando o caminho do ERRO
   (o auditor-jogador só percorre o caminho bom): na revelação do 3º erro a
   frase que EXPLICA a revelação aparecia e sumia no mesmo instante, porque o
   fecho apagava a dica. Quem mais precisa dela é justamente quem errou três
   vezes — então na revelação a dica fica, e a tela seguinte espera. */
function fechaTarefa(b,manter){
  respondida=true;
  b.className="opt esc ok";
  sCerto(); if(!manter) apagaDica();
  setTimeout(function(){
    if(!telaAtual||!telaAtual.parentNode) return;
    telaPorque();
  },manter?1600:800);
}
function revelaTarefa(){
  var i;
  for(i=0;i<cartoes.length;i++) if(cartoes[i].dado&&cartoes[i].dado.c){
    mostraDica("Este é o lugar. Agora vem a parte boa: <b>o porquê</b>.");
    fechaTarefa(cartoes[i],true); return;
  }
}

/* ---------------- 2) O PORQUÊ (o coração da mecânica) ---------------- */
/* O mascote pergunta e a criança APONTA o desenho. Nunca digitar: campo de
   texto aqui vira barreira motora e mata a mecânica. */
function telaPorque(){
  limpa(); garanteRodada();
  errosSeg=0; respondida=false; cartoes=[];
  var f=RODADAS[rodada];
  var t=el("div","tela"); telaAtual=t; setProg(t,rodada*50+28);
  var c=el("div","centro");
  c.appendChild(el("div","selo","POR QUE DEU CERTO?"));
  c.appendChild(el("div","byte",svgByte()));
  c.appendChild(el("div","balao",f.pq));
  var lista=baguncar(f.cards.slice(0)), i, b;
  var cx=el("div","opts");
  for(i=0;i<lista.length;i++){
    b=el("div","opt",
        '<span class="cardfig">'+figuraDe(lista[i])+'</span><span class="cardtxt">'+lista[i].t+'</span>');
    b.dado=lista[i]; b.base="opt";
    b.setAttribute("data-qa",lista[i].c?"1":"0");
    b.onclick=escolheuPorque;
    cx.appendChild(b); cartoes.push(b);
  }
  c.appendChild(cx);
  c.appendChild(el("div","hint","Toque no desenho que mostra a razão."));
  t.appendChild(c); app.appendChild(t);
}
function escolheuPorque(){
  if(respondida) return;
  sTap();
  if(this.dado.c){ fechaPorque(this); return; }
  sErro(); errosSeg++;
  this.className="opt no treme";
  destreme(this);
  /* ⚠️ o mascote NUNCA responde: ele estreita a PERGUNTA. Quem revela, no 3º
     erro, é o andaime — e só para ninguém ficar preso. */
  if(errosSeg>=3){ revelaPorque(); return; }
  mostraDica(RODADAS[rodada].perguntas[errosSeg-1]);
  if(sobrouSoACerta()) revelaPorque();
}
function fechaPorque(b,manter){
  respondida=true;
  b.className="opt ok";
  sCerto(); if(!manter) apagaDica();
  setTimeout(function(){
    if(!telaAtual||!telaAtual.parentNode) return;
    proxima();
  },manter?1700:900);
}
function revelaPorque(){
  var i;
  for(i=0;i<cartoes.length;i++) if(cartoes[i].dado&&cartoes[i].dado.c){
    mostraDica("Olhe esta comigo e leia devagar. <b>É essa</b> a razão.");
    fechaPorque(cartoes[i],true); return;
  }
}
function proxima(){
  rodada++;
  if(rodada<RODADAS.length){
    mostraBanner("Você não só acertou: <b>explicou</b>.",telaTarefa);
    return;
  }
  mostraBanner("Duas explicações no bolso!",telaFim);
}

/* ---------------- 3) O FIM (medalha + gancho) ---------------- */
function telaFim(){
  limpa();
  var t=el("div","tela"); telaAtual=t; setProg(t,100);
  var c=el("div","centro");
  c.appendChild(el("div","selo","EXPLICADOR"));
  c.appendChild(el("div","medal","POR QUÊ"));
  c.appendChild(el("div","balao","Quem sabe <b>dizer o porquê</b> não esquece mais."));
  /* fecho com gancho: termina deixando uma pergunta aberta */
  c.appendChild(el("div","hint","E se o copo do sol ficasse <b>tapado</b> com um pratinho? Por quê?"));
  var b=el("button","btn","Explicar de novo");
  b.setAttribute("data-qa","1");
  b.onclick=function(){sTap();rodada=0;telaTarefa();};
  c.appendChild(b);
  t.appendChild(c); app.appendChild(t);
}

/* ---------------- apoio ---------------- */
/* depois da tremida a opção fica RISCADA (forma, não só cor): mostra o que já
   foi descartado — o contrário de punir. Continua tocável, então nunca trava. */
function destreme(b){
  setTimeout(function(){
    if(!telaAtual||!telaAtual.parentNode) return;
    if(b.className.indexOf("ok")<0) b.className=b.base+" fora";
  },340);
}
function riscaUmaErrada(){
  var i,b;
  for(i=0;i<cartoes.length;i++){
    b=cartoes[i];
    if(!b.dado.c&&b.className.indexOf("fora")<0){ b.className=b.base+" fora"; return; }
  }
}
/* ⚠️ A REDE (lição das primeiras peças, CONTRATO §6): com 3 opções as erradas
   podem acabar ANTES do 3º erro. Sem isto, sobraria uma tela com uma opção só
   e o degrau "revelar" viraria código morto. */
function sobrouSoACerta(){
  var i,vivas=0;
  for(i=0;i<cartoes.length;i++)
    if(!cartoes[i].dado.c&&cartoes[i].className.indexOf("fora")<0) vivas++;
  return vivas===0;
}
function apagaDica(){
  var d=document.getElementById("dicaP");
  if(d&&d.parentNode) d.parentNode.removeChild(d);
}
telaTarefa();
</script>
</body></html>
