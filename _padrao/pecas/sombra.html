<!DOCTYPE html>
<html lang="pt-BR"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>PEÇA — sombra</title>
<!-- ============================================================
     PEÇA: SOMBRA (casar a figura com a SILHUETA dela)
     Cópia do MOLDE.html — só o bloco "A PEÇA COMEÇA AQUI" mudou.

     O que esta mecânica ensina: olhar o CONTORNO, não a cor. A criança
     precisa reconhecer a forma quando toda a informação de cor foi embora —
     é observação dirigida de verdade, e prepara a leitura de silhueta, de
     mapa e de gráfico.

     Armadilhas desta mecânica (_padrao/DINAMICAS.md, linha "Sombra / ache
     o par"), cada uma já paga em atividade de verdade:
       · ⭐ A SILHUETA TEM QUE SER DA MESMA FIGURA. Se ela é desenhada
         "parecida", a criança compara coisas diferentes e a fase vira
         adivinhação. Aqui isso é impossível por construção: a MESMA função
         `desenho(tipo)` monta os dois lados; a sombra é a figura com as
         peças pintadas de escuro (a classe `som`). Não há como as formas
         divergirem — mudar a figura muda a sombra no mesmo instante;
       · par que acerta ACENDE E PULSA (o fecho tem que ser visível, não só
         uma cor trocada);
       · o lado das sombras vai EMBARALHADO, senão a criança casa pela
         posição (1ª com 1ª) e não pela forma;
       · nunca trava: no 3º erro a sombra certa acende e a peça anda;
       · erro não vira X vermelho nem a palavra "errou";
       · `data-qa` com a MESMA chave nos dois lados — é assim que o
         auditor-jogador fecha a peça sozinho.
     ⚠️ Voz: numa atividade de verdade o alto-falante vai no lado que TEM
        NOME (a figura). Pôr voz na silhueta entregaria a resposta.
     ============================================================ -->
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:"Segoe UI",Arial,sans-serif;background:#2b2118;color:#f4efe6}
#app{max-width:520px;margin:0 auto;padding:10px 12px 28px}
.prog{height:9px;background:rgba(255,255,255,.16);border-radius:9px;overflow:hidden;margin:6px 0 12px}
.prog i{display:block;height:100%;background:#59c24b;width:0;-webkit-transition:width .5s;transition:width .5s}
.selo{display:inline-block;background:#3c6ee0;color:#fff;font-weight:700;font-size:13px;
      letter-spacing:.4px;padding:6px 14px;border-radius:20px;margin:0 auto 10px;display:block;
      width:-webkit-fit-content;width:fit-content}
.balao{position:relative;background:rgba(255,253,246,.96);color:#221a12;border-radius:20px;
       padding:13px 17px;font-size:17px;font-weight:600;text-align:center;line-height:1.35;
       box-shadow:0 5px 16px rgba(0,0,0,.28)}
.balao b{color:#1f6b12}
.balao + *{margin-top:13px}
.centro{text-align:center}
.opts{display:block}
.opt{display:block;background:#fffdf6;color:#221a12;border:0;border-radius:16px;padding:13px 16px;
     margin:9px auto;font-size:16px;font-weight:600;min-height:48px;max-width:430px;cursor:pointer;
     box-shadow:0 4px 0 #c9bda6}
.opt:active{-webkit-transform:translateY(3px);transform:translateY(3px);box-shadow:0 1px 0 #c9bda6}
.opt.ok{background:#d6f5c8;box-shadow:0 4px 0 #7cb464}
.opt.no{background:#f7d9d2;box-shadow:0 4px 0 #c08c80}
.hint{font-size:14px;opacity:.85;margin-top:10px}
.dica{background:#fff3c9;color:#3a2c07;border-radius:14px;padding:10px 14px;margin-top:12px;
      font-size:15px;font-weight:600}
.tela{display:block}
/* ⚠️ o banner escondido nao pode contar como "resposta fora da tela": ele nao
   existe para a crianca ainda. `visibility` tira do alcance do dedo e do
   leitor de tela — so `bottom:-260px` deixava o botao clicavel no escuro. */
.banner{position:fixed;left:0;right:0;bottom:-260px;background:#1f6b12;color:#fff;text-align:center;
        padding:18px 16px 22px;border-radius:22px 22px 0 0;visibility:hidden;
        -webkit-transition:bottom .35s;transition:bottom .35s}
.banner.show{bottom:0;visibility:visible}
.btn{background:#ffd54a;color:#33280a;border:0;border-radius:16px;padding:13px 26px;font-size:17px;
     font-weight:800;min-height:48px;cursor:pointer;box-shadow:0 4px 0 #c9a52f}

/* ====== CSS DESTA PEÇA ====== */
/* ⚠️ 13px de folga do enunciado: o balao tem sombra e nenhuma margem por
   baixo (regra 9 do _qa/leiaute.js, cobrada DUAS vezes pelo Marcos). */
.sbox{position:relative;font-size:0;margin-top:13px}
.scol{display:inline-block;vertical-align:top;width:48%;font-size:14px}
.sesq{margin-right:4%}
.sdir{margin-right:0}
/* o cartao dos DOIS lados usa .lig — e a classe que, dentro de uma
   atividade, ganha o alto-falante automatico do motor. */
.lig{display:block;width:100%;min-height:62px;background:#fffdf6;color:#221a12;border:0;
     border-radius:14px;padding:6px 8px;margin-bottom:8px;cursor:pointer;
     box-shadow:0 4px 0 #c9bda6;text-align:center;
     -webkit-user-select:none;user-select:none}
/* escolhido: NAO e so a cor — ganha borda grossa e sobe um degrau */
.lig.sel{background:#fff3c9;box-shadow:0 0 0 4px #ffd54a,0 4px 0 #c9a52f;
         -webkit-transform:translateY(-3px);transform:translateY(-3px)}
/* par fechado: cor + o V de conferido (forma, funciona no mudo e para quem
   nao distingue verde) */
.lig.feita{background:#d6f5c8;box-shadow:0 3px 0 #7cb464;cursor:default}
.lig.pulsa{-webkit-animation:pulsa .55s 2;animation:pulsa .55s 2}
.lig.pisca{background:#fff3c9;box-shadow:0 0 0 4px #ffd54a,0 4px 0 #c9a52f}
@-webkit-keyframes pulsa{50%{-webkit-transform:scale(1.07)}}
@keyframes pulsa{50%{transform:scale(1.07)}}
.fbox{position:relative;display:inline-block;vertical-align:middle;width:46px;height:46px}
.fnome{display:inline-block;vertical-align:middle;font-size:13px;font-weight:800;line-height:1.1;
       letter-spacing:.3px;margin-left:6px;text-align:left}
.vok{display:inline-block;vertical-align:middle;font-size:17px;font-weight:800;color:#1f6b12;margin-left:4px}
/* ---- O DESENHO ----
   ⭐ tudo em PORCENTAGEM dentro do quadrado de 46px, e toda parte recebe a
   cor por `background`. A SOMBRA e o MESMO desenho com a classe `som`: a
   regra abaixo troca a cor de TODA parte por escuro. Assim a silhueta nao
   pode "desencontrar" da figura — e a mesma forma, so preenchida.
   ⚠️ nao escrever aqui a palavra que o _qa/dinamicas.py usa para reconhecer
   o marca-texto: comentario de CSS entra na conta do portao e ele passa a
   cobrar de uma peca as armadilhas de OUTRA mecanica.                    */
.fig{position:relative;display:block;width:100%;height:100%}
.pt{position:absolute}
.som .pt{background:#1c1610}
/* ARVORE */
.acopa{left:8%;top:0;width:84%;height:64%;border-radius:50%;background:#3f9c46}
.atron{left:40%;bottom:0;width:20%;height:40%;background:#8a5a2b}
/* CASA */
.ctelh{left:0;top:0;width:100%;height:46%;background:#c0562f;
       -webkit-clip-path:polygon(50% 0,100% 100%,0 100%);clip-path:polygon(50% 0,100% 100%,0 100%)}
.cpar{left:14%;bottom:0;width:72%;height:56%;background:#e8cf9f}
/* SORVETE */
.sbola{left:16%;top:0;width:68%;height:48%;border-radius:50%;background:#f0a0bd}
.scasq{left:16%;top:42%;width:68%;height:58%;background:#d9a05b;
       -webkit-clip-path:polygon(0 0,100% 0,50% 100%);clip-path:polygon(0 0,100% 0,50% 100%)}
/* PEIXE */
.pcorp{left:22%;top:24%;width:64%;height:52%;border-radius:50%;background:#f0a63a}
.pcaud{left:0;top:28%;width:26%;height:44%;background:#d8862a;
       -webkit-clip-path:polygon(0 0,100% 50%,0 100%);clip-path:polygon(0 0,100% 50%,0 100%)}
/* a medalha fecha a peca: e por ela que o auditor-jogador sabe que chegou ao
   fim. A estrela vem do CSS — nao e emoji e nao entra na conta do contraste. */
.medal{width:104px;height:104px;margin:2px auto 12px;border-radius:50%;background:#f6c23a;
       border:6px solid #fff3c9;box-shadow:0 6px 16px rgba(0,0,0,.35);color:#4a3608;
       font-size:44px;line-height:92px;text-align:center;font-weight:800}
.medal:before{content:"\2605"}
/* tela baixa (projetor, janela do PC da escola): tudo encolhe junto para que
   NADA que se toca saia da area visivel. */
@media(max-height:500px){
  .balao{font-size:15px;padding:10px 14px}
  .lig{min-height:54px;margin-bottom:5px}
  .fbox{width:40px;height:40px}
  .hint{display:none}
}
</style></head>
<body>
<div id="app"></div>
<div id="banner" class="banner"><div id="bmsg"></div><button id="bcta" class="btn" style="margin-top:12px">Continuar</button></div>
<script>
/* ====== MOTORZINHO DA PEÇA (os mesmos nomes das atividades) ====== */
var app=document.getElementById("app"), banner=document.getElementById("banner"),
    bmsg=document.getElementById("bmsg"), bcta=document.getElementById("bcta");
function el(t,c,h){var e=document.createElement(t);if(c)e.className=c;if(h!==undefined&&h!==null)e.innerHTML=h;return e;}
function limpa(){app.innerHTML="";}
function setProg(t,p){var pr=el("div","prog");var i=el("i");i.style.width=p+"%";pr.appendChild(i);t.appendChild(pr);}
function mostraDica(txt){var d=document.getElementById("dicaP");if(!d){d=el("div","dica");d.id="dicaP";
  var c=app.querySelector(".centro")||app;c.appendChild(d);}d.innerHTML=txt;}
function mostraBanner(msg,cb){bmsg.innerHTML=msg;banner.className="banner show";festa();
  bcta.onclick=function(){banner.className="banner";if(cb)cb();};}
function baguncar(a){var i,j,x;for(i=a.length-1;i>0;i--){j=Math.floor(Math.random()*(i+1));x=a[i];a[i]=a[j];a[j]=x;}return a;}
/* som: os numeros vieram da pesquisa (PESQUISA-SOM-E-GAMEFEEL). "ding" e
   sintetizado — MP3 chega atrasado e mata a sensacao de causa-efeito. */
var AC=null;
function ac(){try{if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();
  if(AC.state==="suspended")AC.resume();}catch(e){}return AC;}
function nota(f,dur,vol,tipo,atraso){var c=ac();if(!c)return;
  var o=c.createOscillator(),g=c.createGain(),t=c.currentTime+(atraso||0);
  o.type=tipo||"triangle";o.frequency.value=f;
  g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol||.18,t+.014);
  g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(g);g.connect(c.destination);o.start(t);o.stop(t+dur+.02);}
function sCerto(){nota(523.25,.35,.18,"triangle",0);nota(659.25,.35,.16,"triangle",.055);nota(783.99,.35,.15,"triangle",.11);}
function sErro(){nota(300,.14,.12,"sine",0);nota(318,.14,.12,"sine",0);}
function sTap(){nota(880,.012,.10,"square",0);}
function festa(){sCerto();}
document.addEventListener("pointerdown",function(){ac();},false);
</script>
<script>
/* ====== A PEÇA COMEÇA AQUI ====== */
/* CASE A FIGURA COM A SOMBRA DELA.
   Conteúdo neutro de propósito: quatro formas que qualquer criança de 8
   anos reconhece. Trocar a tabela FORMAS (e as partes de cada desenho)
   adapta a peça a qualquer conteúdo — folhas, animais, instrumentos,
   peças de um mapa. A regra que NÃO se troca: a sombra sai do MESMO
   desenho, nunca de um segundo desenho "parecido". */
var FORMAS=[
  {k:"arvore",  n:"&#193;RVORE",  p:["acopa","atron"]},
  {k:"casa",    n:"CASA",         p:["ctelh","cpar"]},
  {k:"sorvete", n:"SORVETE",      p:["sbola","scasq"]},
  {k:"peixe",   n:"PEIXE",        p:["pcorp","pcaud"]}
];
var DICAS=[
  "Olhe o <b>contorno</b> da sombra: o que ela tem em cima e o que ela tem embaixo?",
  "Compare o tamanho: a sombra da &#225;rvore &#233; redonda em cima; a da casa tem <b>bico</b>.",
  "&#201; esta! A sombra certa est&#225; com a borda amarela. Toque nela."
];

var telaAtual=null, barraP=null, ger=0;
var marcada=null, feitos=0, erros=0;

function viva(){ return telaAtual&&telaAtual.parentNode; }
function temClasse(e,c){
  if(!e||e.nodeType!==1) return false;
  return (" "+String(e.className)+" ").indexOf(" "+c+" ")>=0;
}

/* ⭐ O CORAÇÃO DA PEÇA: um desenho só, dois usos. `som=true` só acrescenta a
   classe que pinta as partes de escuro — a GEOMETRIA é exatamente a mesma. */
function desenho(f,som){
  var d=el("div","fig"+(som?" som":"")), i;
  for(i=0;i<f.p.length;i++) d.appendChild(el("div","pt "+f.p[i],""));
  return d;
}

function pecaSombra(){
  ger++; limpa();
  marcada=null; feitos=0; erros=0;
  var t=el("div","tela"); telaAtual=t; setProg(t,0);
  barraP=t.querySelector(".prog i");
  var c=el("div","centro");
  c.appendChild(el("div","selo","ACHE A SOMBRA"));
  c.appendChild(el("div","balao","Toque na figura e depois na <b>sombra</b> dela."));

  var box=el("div","sbox");
  var esq=el("div","scol sesq"), dir=el("div","scol sdir"), i;
  /* o lado das sombras vai EMBARALHADO: senao a crianca casa pela posicao
     (a 1a com a 1a) em vez de casar pela FORMA. */
  var sombras=baguncar(FORMAS.slice(0));
  for(i=0;i<FORMAS.length;i++) esq.appendChild(fazCartao(FORMAS[i],false));
  for(i=0;i<sombras.length;i++) dir.appendChild(fazCartao(sombras[i],true));
  box.appendChild(esq); box.appendChild(dir);
  c.appendChild(box);
  c.appendChild(el("div","hint","S&#227;o quatro pares. A sombra tem a mesma <b>forma</b> da figura."));
  t.appendChild(c); app.appendChild(t);
}

function fazCartao(f,som){
  var l=el("div","lig");
  var cx=el("span","fbox");
  cx.appendChild(desenho(f,som));
  l.appendChild(cx);
  if(!som) l.appendChild(el("span","fnome",f.n));
  /* os DOIS lados publicam a MESMA chave: e assim que o auditor-jogador
     (_qa/jogador.js) consegue fechar a peca sozinho. */
  l.setAttribute("data-qa",f.k);
  l._k=f.k; l._lado=som?"d":"e";
  l.onclick=function(){ toca(l); };
  return l;
}

/* ---------- o toque simples: um lado, depois o outro ---------- */
function toca(l){
  if(temClasse(l,"feita")) return;
  if(!marcada){ sTap(); marca(l); return; }
  if(marcada===l){ sTap(); desmarca(); return; }
  if(marcada._lado===l._lado){ sTap(); marca(l); return; }   /* mesmo lado: troca */
  junta(marcada,l);
}
function marca(l){
  desmarca();
  l.className="lig sel";
  marcada=l;
}
function desmarca(){
  var a=app.getElementsByClassName("lig"), i;
  for(i=0;i<a.length;i++) if(!temClasse(a[i],"feita")) a[i].className="lig";
  marcada=null;
}

function junta(a,b){
  if(!a||!b||a===b||a._lado===b._lado) return;
  if(temClasse(a,"feita")||temClasse(b,"feita")) return;
  if(a._k===b._k){ fecha(a,b); return; }
  /* ERRO NAO PUNE: som grave curto, as pontas voltam e o andaime CRESCE.
     Nunca um X vermelho, nunca a palavra "errou". */
  sErro(); erros++;
  var guardar=a;
  desmarca();
  mostraDica(DICAS[Math.min(erros,DICAS.length)-1]);
  if(erros>=3) revela(guardar);
}

/* ⭐ o par que fecha ACENDE E PULSA: sem isso a crianca nao tem certeza de
   que acertou, e fica tocando de novo no que ja esta pronto.
   ⚠️ o temporizador continua correndo depois que a tela sai: sem o guarda da
   geracao (`ger`) ele mexeria numa tela que ja foi embora.
   ⚠️ e este aviso mora AQUI FORA de proposito: a bancada descobre as telas
   procurando a chamada de faxina dentro do corpo da funcao, e ela nao sabe
   distinguir codigo de comentario — com o aviso la dentro, a bancada chamava
   `fecha()` sem argumento nenhum e o portao estourava numa peca sadia. */
function fecha(a,b){
  sCerto();
  a.className="lig feita pulsa"; b.className="lig feita pulsa";
  a.appendChild(el("span","vok","&#10003;"));
  marcada=null; feitos++;
  apagaDica();
  if(barraP) barraP.style.width=Math.round(feitos*100/FORMAS.length)+"%";
  var g=ger;
  setTimeout(function(){
    if(g!==ger||!viva()) return;
    if(temClasse(a,"feita")) a.className="lig feita";
    if(temClasse(b,"feita")) b.className="lig feita";
  },1180);
  if(feitos>=FORMAS.length){
    setTimeout(function(){
      if(g!==ger||!viva()) return;
      mostraBanner("Voc&#234; achou as <b>4 sombras</b>! Olhou a forma, n&#227;o a cor.",fimDaPeca);
    },560);
  }
}

/* 3º erro: a sombra certa acende e a crianca segue. Nunca prende ninguem. */
function revela(l){
  if(!l) return;
  var a=app.getElementsByClassName("lig"), i;
  for(i=0;i<a.length;i++){
    if(temClasse(a[i],"feita")) continue;
    if(a[i]!==l&&a[i]._k===l._k) a[i].className="lig pisca";
  }
  l.className="lig sel";
  marcada=l;
}
function apagaDica(){
  var d=document.getElementById("dicaP");
  if(d&&d.parentNode) d.parentNode.removeChild(d);
}

function fimDaPeca(){
  ger++; limpa(); marcada=null;
  var t=el("div","tela"); telaAtual=t; setProg(t,100);
  var c=el("div","centro");
  c.appendChild(el("div","selo","PE&#199;A FECHADA"));
  c.appendChild(el("div","medal",""));
  c.appendChild(el("div","balao","A sombra tem a <b>mesma forma</b> da figura."));
  var b=el("button","btn","Jogar de novo");
  b.onclick=pecaSombra;
  c.appendChild(b);
  c.appendChild(el("div","hint","Esta &#233; a pe&#231;a SOMBRA: a silhueta sai do mesmo desenho."));
  t.appendChild(c); app.appendChild(t);
}
pecaSombra();
</script>
</body></html>
