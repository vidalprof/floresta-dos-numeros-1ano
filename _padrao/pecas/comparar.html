<title>PEÇA — comparar (ver quem tem mais e só então escolher o sinal)</title>
<!-- ============================================================
     PEÇA: MAIOR, MENOR OU IGUAL — o olho compara ANTES do símbolo
     (copiada do _padrao/pecas/MOLDE.html)

     POR QUE ELA EXISTE:
     "5 > 3" só quer dizer alguma coisa para quem JÁ VIU que cinco é mais
     que três. O jeito comum de ensinar isso — mostrar dois números e pedir
     o sinal — pula justamente a parte que ensina, e sobra decorar para que
     lado abre a boca do jacaré. Aqui a ordem é a inversa e é inegociável:
     primeiro as duas quantidades ficam LADO A LADO, começando no mesmo
     lugar, para o olho ver quem sobra; o sinal vem depois, para dar NOME
     ao que a criança acabou de enxergar.

     O QUE FAZ ESTA MECÂNICA VALER:
       · DOIS PASSOS, SEMPRE NESSA ORDEM. Passo 1: "quem tem mais?" —
         responde-se tocando na própria fileira (ou em "têm o mesmo
         tanto"). Passo 2, e só então: o sinal. Nunca o sinal sozinho.
       · AS FILEIRAS COMEÇAM NO MESMO LUGAR. Comparar comprimentos que
         começam em pontos diferentes é o erro clássico da comparação; aqui
         as duas partem da mesma borda e o que sobra fica à vista.
       · O EMPATE EXISTE. Uma das rodadas é 4 contra 4: sem ela, "igual"
         vira um botão que nunca serve e a criança aprende que sempre há um
         vencedor.
       · CONCRETO -> SIMBÓLICO DE VERDADE: as três primeiras rodadas
         mostram as fileiras e só revelam os números depois; a última mostra
         os NÚMEROS primeiro (a criança prevê) e revela as fileiras para
         CONFIRMAR. Mesmo ali a comparação é vista antes do sinal.
       · O SINAL NUNCA É SÓ O SÍMBOLO: cada botão traz o desenho E as
         palavras ("MAIOR QUE"), e a resposta final é lida como frase
         ("5 é maior que 3"). Quem não decodifica o símbolo continua junto.

     AS ARMADILHAS QUE ESTA PEÇA FECHA:
       · O LADO É SORTEADO (`baguncar`): sem isso a maior seria sempre a de
         cima e a criança aprenderia a POSIÇÃO, não a comparação. A ordem
         dos três sinais também é sorteada.
       · SÓ EXISTEM 3 SINAIS — ou seja, 2 distratores. Com 2 erradas a
         criança elimina tudo antes do 3º erro e o degrau "revelar" viraria
         CÓDIGO MORTO. Por isso há a rede `sobrouErrada()`: quando as
         erradas acabam, a peça revela na hora — e as TRÊS frases do andaime
         chegam mesmo assim (a 3ª é escrita DEPOIS da revelação).
       · REVELA E DEPOIS EXPLICA: a dica que explica a revelação é escrita
         depois que o sinal entra no lugar, nunca no mesmo quadro.
       · TRAVA NO INSTANTE DO TOQUE (`travada=true`), nunca no fim da
         animação — criança toca duas vezes.
       · GERAÇÃO (`ger`) em todo setTimeout: relógio de rodada velha não
         mexe em tela nova.
       · A VOZ ACOMPANHA A TROCA DE ENUNCIADO: quando o passo 2 começa, o
         balão muda E a voz fala na mesma hora.
       · AS DUAS PORTAS: dá para tocar E para escolher pelo TECLADO (1, 2,
         3 nas opções) — no PC da escola tem teclado.
       · NUNCA TRAVA: em qualquer passo a peça revela e anda.
     ES5 puro, um arquivo só, sem biblioteca (Chrome 109 / Firefox 106).
     ============================================================ -->
<style>

       box-shadow:0 5px 12px rgba(0,0,0,.24),inset 0 1px 0 rgba(255,255,255,.35)}
/* ⚠️ estas duas regras existem porque `.grupo.opt` vem DEPOIS de `.opt.ok`

<div id="app"></div>
<div id="banner" class="banner"><div id="bmsg"></div><button id="bcta" class="btn" style="margin-top:12px">Continuar</button></div>
<script>
/* ====== MOTORZINHO DA PEÇA (os mesmos nomes das atividades) ====== */
var app=document.getElementById("app"), banner=document.getElementById("banner"),
    bmsg=document.getElementById("bmsg"), bcta=document.getElementById("bcta");
function el(t,c,h){var e=document.createElement(t);if(c)e.className=c;if(h!==undefined&&h!==null)e.innerHTML=h;return e;}
function limpa(){app.innerHTML="";}
function setProg(t,p){var pr=el("div","prog");var i=el("i");i.style.width=p+"%";pr.appendChild(i);t.appendChild(pr);}
/* ⚠️ A DICA TEM QUE CABER NA TELA (ago/2026). Ela era o ULTIMO filho do
   `.centro`, e em janela apertada (320x568 e 1024x420 — o monitor da escola)
   caia 25 a 96 px ABAIXO DA DOBRA: a crianca que errou precisava ROLAR para ler
   a ajuda, justo no momento em que esta perdida. Agora ela entra LOGO DEPOIS do
   enunciado, que e onde o olho ja esta. Defeito estrutural: valia para as 57
   pecas de uma vez. */
function mostraDica(txt){var d=document.getElementById("dicaP");
  if(!d){ d=el("div","dica"); d.id="dicaP";
    var b=app.getElementsByClassName("balao")[0];
    if(b&&b.parentNode) b.parentNode.insertBefore(d,b.nextSibling);
    else (app.querySelector(".centro")||app).appendChild(d);
  } d.innerHTML=txt;}
function mostraBanner(msg,cb){bmsg.innerHTML=msg;banner.className="banner show";festa();
  bcta.onclick=function(){banner.className="banner";if(cb)cb();};}
function baguncar(a){var i,j,x;for(i=a.length-1;i>0;i--){j=Math.floor(Math.random()*(i+1));x=a[i];a[i]=a[j];a[j]=x;}return a;}
/* som: os numeros vieram da pesquisa (PESQUISA-SOM-E-GAMEFEEL). "ding" e
   sintetizado — MP3 chega atrasado e mata a sensacao de causa-efeito. */
var AC=null;
function ac(){try{if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();
  if(AC.state==="suspended")AC.resume();}catch(e){}return AC;}
function nota(f,dur,vol,tipo,atraso){var c=ac();if(!c)return;
  var o=c.createOscillator(),g=c.createGain(),t=c.currentTime+(atraso||0);
  o.type=tipo||"triangle";o.frequency.value=f;
  g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol||.18,t+.014);
  g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(g);g.connect(c.destination);o.start(t);o.stop(t+dur+.02);}
function sCerto(){nota(523.25,.35,.18,"triangle",0);nota(659.25,.35,.16,"triangle",.055);nota(783.99,.35,.15,"triangle",.11);}
function sErro(){nota(300,.14,.12,"sine",0);nota(318,.14,.12,"sine",0);}
function sTap(){nota(880,.012,.10,"square",0);}
function festa(){sCerto();}
document.addEventListener("pointerdown",function(){ac();},false);
</script>
<script>
/* ====== A PEÇA COMEÇA AQUI ====== */

/* O CONTEÚDO É SÓ EXEMPLO (6 a 9 anos). Para reusar a peça troque SÓ este
   bloco: os dois números de cada rodada e o modo.
   ⚠️ A ESCADA: 5x3 (diferença grande, dá para ver de longe) -> 4x4 (o
   EMPATE, sem o qual "igual" vira botão decorativo) -> 7x9 (diferença de 2,
   já precisa correr o dedo) -> 12x8 em modo NÚMEROS, onde a criança prevê
   pelo símbolo e as fileiras aparecem para confirmar. */
var RODS=[
 /* ⭐ imgA/imgB VAZIOS no exemplo: declaram os campos (para o montador saber que
    a peca os LE) sem carregar imagem nenhuma na bancada (""=sem figura, cai no
    modo blocos). Numa atividade de dinheiro, a gaveta preenche com a cedula. */
 {a:5,b:3,modo:"blocos",imgA:"",imgB:"",selo:"QUEM TEM MAIS?",
  enun:"Olhe as duas fileiras. <b>Quem tem mais</b>?",
  voz:"Olhe as duas fileiras. Quem tem mais?"},
 {a:4,b:4,modo:"blocos",selo:"SER&Aacute; QUE EMPATA?",
  enun:"E agora? Olhe bem: <b>quem tem mais</b>?",
  voz:"E agora? Olhe bem: quem tem mais?"},
 {a:7,b:9,modo:"blocos",selo:"POR POUCO",
  enun:"Estas duas est&atilde;o quase iguais. <b>Quem tem mais</b>?",
  voz:"Estas duas estão quase iguais. Quem tem mais?"},
 {a:12,b:8,modo:"numeros",selo:"S&Oacute; OS N&Uacute;MEROS",
  enun:"Agora s&oacute; os n&uacute;meros. <b>Qual &eacute; o maior</b>?",
  voz:"Agora só os números. Qual é o maior?"},
 /* ⭐ declara `pergunta` ("mais"/"menos") e `semSinal` (pula o passo do sinal,
    p/ o 1º ano) — sem eles o montador acha que a peca nao le esses campos e a
    fase de dinheiro sairia vazia. Esta rodada tambem exercita os dois caminhos
    novos no peca.sh (blocos, sem imagem). */
 {a:6,b:9,modo:"blocos",selo:"QUEM TEM MENOS?",
  enun:"Agora ao contr&aacute;rio: <b>quem tem menos</b>?",
  voz:"Agora ao contrário. Quem tem menos?", pergunta:"menos", semSinal:true}
];
var NOMEA="TURMA AZUL", NOMEB="TURMA LARANJA";
var VOZA="turma azul", VOZB="turma laranja";
/* ⚠️ LICAO PAGA (ago/2026, Lojinha): a lista ia so ate DOZE, mas a atividade de
   dinheiro compara 20 (a nota de vinte). `nomeNum(20)` devolvia "20" e o
   alto-falante do painel ficava mudo. Estender ate vinte cobre as cedulas e
   moedas (1,2,5,10,20). Esta lista TEM QUE bater com `_NUM_EXTENSO` no
   `montar.py` — quem grava a voz do painel usa a MESMA palavra por extenso;
   se divergir, a chave nao bate e o botao volta a ficar mudo. */
var UNM=["zero","um","dois","três","quatro","cinco","seis","sete","oito","nove","dez",
         "onze","doze","treze","catorze","quinze","dezesseis","dezessete","dezoito",
         "dezenove","vinte"];

/* O ANDAIME DO PASSO 1 (quem tem mais). Frases GENÉRICAS de propósito: o
   nome do que está na tela sai de uma função, nunca escrito à mão em cada
   dica — senão a 2ª rodada continuaria falando da 1ª. */
var D1=[
 "As duas fileiras come&ccedil;am no <b>mesmo lugar</b>. Olhe onde cada uma <b>termina</b>.",
 "Corra o dedo pelas duas ao mesmo tempo. A que ainda tem pe&ccedil;a quando a outra acabou &eacute; a que tem <b>mais</b>."
];

var ri=0, passo=1, errosP1=0, errosSin=0, deprimeira=0;
var ger=0, travada=false;
var vTopo=0, vBaixo=0;
var telaAtual=null, balaoEl=null, acaoEl=null, msgEl=null, fraseEl=null, slotEl=null;
var painelA=null, painelB=null, numA=null, numB=null, filA=null, filB=null, optIgual=null;
/* ⭐ 1º ANO SEM SINAL (pedido do Marcos, ago/2026): os sinais >,<,= entram so no
   2º/3º ano. Por rodada, `semSinal:true` PULA o passo do sinal (fica so o "qual
   vale mais/menos/igual" em PALAVRA) e `pergunta:"menos"` inverte a pergunta.
   Aditivo: rodada sem esses campos segue idêntica (com sinal). */
var pergAtual="mais", semSinalAtual=false, mostrouSinal=false;

function rod(){ return RODS[ri]||RODS[0]; }
function viva(){ return telaAtual&&telaAtual.parentNode; }
function temClasse(e,c){ if(!e||e.nodeType!==1) return false;
  return (" "+String(e.className)+" ").indexOf(" "+c+" ")>=0; }
function nomeNum(n){ return (n>=0&&n<UNM.length)?UNM[n]:(""+n); }
function simbolo(){ return vTopo>vBaixo ? "&gt;" : (vTopo<vBaixo ? "&lt;" : "="); }
function palavraSin(){ return vTopo>vBaixo ? "maior que" : (vTopo<vBaixo ? "menor que" : "igual a"); }

/* A VOZ. Web Speech: se o PC nao tiver voz, a peca continua inteira — toda
   frase falada tambem esta escrita na tela. */
function diz(txt){
  try{
    if(!window.speechSynthesis||!window.SpeechSynthesisUtterance) return;
    var u=new SpeechSynthesisUtterance(txt);
    u.lang="pt-BR"; u.rate=1; u.pitch=1.05;
    window.speechSynthesis.cancel();
    window.speechSynthesis.speak(u);
  }catch(e){}
}
function sPop(){ nota(659.25,.09,.13,"triangle",0); }
function sNeutro(){ nota(440,.12,.12,"triangle",0); nota(587.33,.16,.11,"triangle",.07); }

/* ---------------------------------------------------------------
   A TELA DA RODADA. Passo 1 (ver) e passo 2 (nomear) moram na mesma
   tela: a comparação continua à vista enquanto o sinal é escolhido.
   --------------------------------------------------------------- */
function telaComp(){
  limpa();
  ger++; travada=false; passo=1; errosP1=0; errosSin=0;
  document.onkeydown=null;
  fraseEl=null; slotEl=null;
  var g=ger, r=rod();
  pergAtual = (r.pergunta==="menos") ? "menos" : "mais";
  semSinalAtual = !!r.semSinal;
  var temImg=!!(r.imgA||r.imgB);
  /* ⚠️ SORTEIA QUAL VALOR FICA EM CIMA. Sem isto a maior seria sempre a
     primeira e a crianca aprenderia a POSICAO, nao a comparacao.
     ⚠️⚠️ LICAO PAGA (Lojinha, ago/2026): embaralhar SO o valor deixava a
     imagem para tras — a moeda de 1 real aparecia com o numero "2". O sorteio
     tem que levar o PAR (valor + figura) junto, senao figura e numero
     divergem. */
  var par=baguncar([{v:r.a,img:r.imgA},{v:r.b,img:r.imgB}]);
  vTopo=par[0].v; vBaixo=par[1].v;

  var t=el("div","tela"); telaAtual=t;
  setProg(t, Math.round(ri*100/RODS.length));
  var c=el("div","centro");
  c.appendChild(el("div","selo",r.selo));
  balaoEl=el("div","balao",r.enun);
  c.appendChild(balaoEl);

  var cmp=el("div","cmp","");
  /* no modo dinheiro nao ha "TURMA AZUL/LARANJA": a resposta e a propria
     cedula, o rotulo de turma so confundiria. */
  painelA=fazPainel("A",temImg?"":NOMEA,vTopo,r.modo,par[0].img);
  painelB=fazPainel("B",temImg?"":NOMEB,vBaixo,r.modo,par[1].img);
  cmp.appendChild(painelA); cmp.appendChild(painelB);
  c.appendChild(cmp);

  var temImg=!!(r.imgA||r.imgB);
  msgEl=el("div","msgc","");
  msgEl.innerHTML = temImg
    ? (pergAtual==="menos" ? "Olhe o dinheiro: <b>qual vale menos</b>?"
                           : "Olhe o dinheiro: <b>qual vale mais</b>?")
    : ((r.modo==="numeros")
       ? "Sem contar nada: <b>qual n&uacute;mero &eacute; o maior</b>?"
       : "As duas come&ccedil;am na mesma borda.");
  c.appendChild(msgEl);

  acaoEl=el("div","acao","");
  c.appendChild(acaoEl);
  c.appendChild(el("div","hint", temImg
                   ? ((pergAtual==="menos" ? "Toque no dinheiro que vale menos" : "Toque no dinheiro que vale mais")+" &#8212; ou use as teclas <b>1</b>, <b>2</b> e <b>3</b>.")
                   : "Toque na fileira que tem mais &#8212; ou use as teclas <b>1</b>, <b>2</b> e <b>3</b>."));
  t.appendChild(c); app.appendChild(t);

  montaPasso1(g);
  diz(r.voz);
}

/* ---------- um painel: rótulo, fileira e o número ----------
   No modo "blocos" o numero comeca escondido (ele e a RECOMPENSA de ter
   olhado); no modo "numeros" e a fileira que comeca escondida (ela e a
   CONFIRMACAO do palpite). Nos dois casos a comparacao aparece inteira
   ANTES do sinal — que e a regra desta peca. */
function fazPainel(lado,nome,valor,modo,img){
  var p=el("div","grupo","");
  if(nome) p.appendChild(el("span","rotulo",nome));
  var f=el("div","fileira",""), i, b;
  /* ⭐ MODO DINHEIRO (pedido do Marcos, 1º ano): quando a gaveta traz `img`, o
     painel mostra a CÉDULA/MOEDA de verdade (não blocos abstratos) + o número
     visível ao lado. A criança compara "qual vale mais" olhando o dinheiro. Os
     blocos não fazem sentido aqui (20 reais não são 20 quadradinhos), então a
     fileira nasce vazia e escondida. Sem `img`, a peça segue idêntica. */
  var temImg=!!img, fig=null;
  if(temImg){
    fig=el("img","cmpfig"); fig.src="img/"+img+".png"; fig.alt="";
  }else{
    for(i=0;i<valor;i++){
      b=el("i","bloco","");
      b.className = (lado==="A") ? "bloco bA" : "bloco bB";
      f.appendChild(b);
    }
  }
  var n=el("b","numg",""+valor);
  if(temImg){
    f.className="fileira escondido";     /* sem blocos no dinheiro */
    n.className="numg";                   /* número sempre visível junto da nota */
  }else if(modo==="numeros"){
    f.className="fileira escondido";
    n.className="numg grandao";
  }else{
    n.className="numg escondido";
  }
  if(fig) p.appendChild(fig);
  p.appendChild(f);
  p.appendChild(n);
  p._v=valor; p._lado=lado; p._fil=f; p._num=n;
  /* ⭐ ALTO-FALANTE DA RESPOSTA (regra do Marcos: "para quem nao le"). O painel
     e uma resposta tocavel (`.opt`), entao o motor (`poeZap`) poe o botaozinho
     de som — mas so se o `data-voz` tiver gravacao. Aqui ele DECLARA a
     QUANTIDADE por extenso ("cinco", "vinte"): serve a qualquer tema (e sempre
     uma comparacao de quantidade) e, no dinheiro, um aluno que ainda nao
     reconhece o "20" ouve "vinte". Nao estraga a resposta: e um botao SEPARADO,
     opcional; o toque no painel continua sendo a escolha. */
  p.setAttribute("data-voz", nomeNum(valor));
  if(lado==="A"){ filA=f; numA=n; } else { filB=f; numB=n; }
  return p;
}

/* ---------------------------------------------------------------
   PASSO 1 — VER. Toca-se na própria fileira; o "têm o mesmo tanto"
   é uma opção de verdade, e uma das rodadas é empate mesmo.
   --------------------------------------------------------------- */
function montaPasso1(g){
  passo=1;
  painelA.className="grupo opt";
  painelB.className="grupo opt";
  painelA.onclick=function(){ escolheLado(g,painelA); };
  painelB.onclick=function(){ escolheLado(g,painelB); };
  acaoEl.innerHTML="";
  optIgual=el("div","opt","OS DOIS T&Ecirc;M O MESMO TANTO");
  optIgual.onclick=function(){ escolheLado(g,optIgual); };
  acaoEl.appendChild(optIgual);
  marcaCerto1();
  ligaTeclado(g,[painelA,painelB,optIgual]);
}
/* o data-qa="1" e so para o auditor-jogador: sem ele a partida ficaria na
   sorte e uma peca perfeita levaria "PRESO". */
/* o painel CERTO no passo 1: com pergunta "mais" e o maior; com "menos", o
   menor; no empate e sempre o "os dois tem o mesmo tanto". */
function alvoCerto1(){
  if(vTopo===vBaixo) return optIgual;
  var maior=(vTopo>vBaixo)?painelA:painelB;
  var menor=(vTopo>vBaixo)?painelB:painelA;
  return (pergAtual==="menos") ? menor : maior;
}
function marcaCerto1(){
  painelA.removeAttribute("data-qa");
  painelB.removeAttribute("data-qa");
  optIgual.removeAttribute("data-qa");
  alvoCerto1().setAttribute("data-qa","1");
}
function certo1(alvo){
  return alvo===alvoCerto1();
}
function escolheLado(g,alvo){
  if(g!==ger||travada||passo!==1) return;
  if(temClasse(alvo,"no")||temClasse(alvo,"ok")) return;
  if(certo1(alvo)){
    travada=true;                         /* ⚠️ trava NO INSTANTE do acerto */
    alvo.className = (alvo===optIgual) ? "opt ok" : "grupo opt ok";
    alvo.removeAttribute("data-qa");
    sCerto();
    if(errosP1===0) deprimeira++;
    revelaTudo();
    msgEl.className="msgc ok";
    msgEl.innerHTML=frasePasso1();
    diz(vozPasso1());
    setTimeout(function(){
      if(g!==ger||!viva()) return;
      if(semSinalAtual) fechaRodada(g,900); else montaPasso2(g);
    },1600);
    return;
  }
  errosP1++;
  sErro();
  alvo.className = (alvo===optIgual) ? "opt no" : "grupo opt no";
  alvo.removeAttribute("data-qa");
  ajudaComp(errosP1,D1);
  /* ⚠️ A REDE: so ha 3 opcoes, entao as erradas acabam no 2º erro. Sem isto
     a crianca ficaria diante de UMA opcao so — que nao e escolha nenhuma — e
     o degrau "revelar" nunca chegaria em ninguem. */
  if(errosP1>=3||!sobrouErrada1()) esperaERevela1(g);
}
function sobrouErrada1(){
  var l=[painelA,painelB,optIgual], i, n=0;
  for(i=0;i<l.length;i++)
    if(!temClasse(l[i],"no")&&l[i].getAttribute("data-qa")!=="1") n++;
  return n>0;
}
/* ⚠️ ORDEM SAGRADA: revela PRIMEIRO, explica DEPOIS. Ao contrario (defeito
   que apareceu em 5 de 6 pecas de um lote) a peca se conserta sozinha e a
   crianca nao sabe por que. */
/* ⚠️ 1500ms, e nao 1000 (medido pelo errador, ago/2026): so ha 3 opcoes,
   entao a REDE dispara ja no 2º erro — e a dica do degrau do meio seria
   apagada pela dica da revelacao antes de a crianca conseguir ler. Degrau
   que existe no codigo e nao chega no olho e degrau que nao existe. */
function esperaERevela1(g){
  travada=true;
  setTimeout(function(){
    if(g!==ger||!viva()) return;
    var alvo = (vTopo>vBaixo)?painelA:((vTopo<vBaixo)?painelB:optIgual);
    alvo.className = (alvo===optIgual) ? "opt ok" : "grupo opt ok";
    alvo.removeAttribute("data-qa");
    revelaTudo(); sNeutro();
    msgEl.className="msgc ok";
    msgEl.innerHTML=frasePasso1();
    mostraDica(explica1());
    diz(vozPasso1());
    setTimeout(function(){
      if(g!==ger||!viva()) return;
      if(semSinalAtual) fechaRodada(g,1100); else montaPasso2(g);
    },1700);
  },1500);
}
function revelaTudo(){
  if(!painelA||!painelB) return;
  if(filA) filA.className="fileira";
  if(filB) filB.className="fileira";
  if(numA) numA.className="numg";
  if(numB) numB.className="numg";
  painelA.onclick=null; painelB.onclick=null;
  painelA.className="grupo"; painelB.className="grupo";
  if(optIgual&&optIgual.parentNode) optIgual.parentNode.removeChild(optIgual);
}
function frasePasso1(){
  if(vTopo===vBaixo)
    return "As duas t&ecirc;m <b>"+vTopo+"</b>: terminam no <b>mesmo lugar</b>.";
  var maiorN=(vTopo>vBaixo)?NOMEA:NOMEB, mv=Math.max(vTopo,vBaixo), nv=Math.min(vTopo,vBaixo);
  return "A <b>"+maiorN+"</b> tem <b>"+mv+"</b> e a outra tem <b>"+nv+"</b>: sobraram <b>"+
         (mv-nv)+"</b>.";
}
function vozPasso1(){
  if(vTopo===vBaixo) return "As duas têm " + nomeNum(vTopo) + ". Terminam no mesmo lugar.";
  var maiorV=(vTopo>vBaixo)?VOZA:VOZB;
  return "A " + maiorV + " tem " + nomeNum(Math.max(vTopo,vBaixo)) + " e a outra tem " +
         nomeNum(Math.min(vTopo,vBaixo)) + ".";
}
function explica1(){
  if(vTopo===vBaixo)
    return "Repare: as duas fileiras <b>terminam juntas</b>. Quando isso acontece, "+
           "ningu&eacute;m tem mais &#8212; elas s&atilde;o <b>iguais</b>.";
  return "Repare: uma fileira <b>passa</b> da outra. A que vai mais longe &eacute; a que tem <b>mais</b>.";
}

/* ---------------------------------------------------------------
   PASSO 2 — NOMEAR. Só agora entra o sinal, e ele nunca aparece
   sozinho: a frase inteira fica montada com os dois números.
   --------------------------------------------------------------- */
function montaPasso2(g){
  if(g!==ger||!viva()) return;
  passo=2; travada=false; errosSin=0; mostrouSinal=true;
  /* ⚠️ o enunciado MUDA dentro da fase: entao a voz fala na MESMA hora. */
  balaoEl.innerHTML="Agora d&ecirc; um <b>nome</b> ao que voc&ecirc; viu: escolha o <b>sinal</b>.";
  diz("Agora escolha o sinal.");
  msgEl.className="msgc";
  msgEl.innerHTML="O sinal vai no meio dos dois n&uacute;meros.";

  fraseEl=el("div","frase","");
  fraseEl.appendChild(el("i","bloco bA",""));
  fraseEl.appendChild(el("b","numf",""+vTopo));
  slotEl=el("span","slotsin","?");
  fraseEl.appendChild(slotEl);
  fraseEl.appendChild(el("i","bloco bB",""));
  fraseEl.appendChild(el("b","numf",""+vBaixo));
  msgEl.parentNode.insertBefore(fraseEl,msgEl);

  acaoEl.innerHTML="";
  var cx=el("div","linha",""), i;
  var sinais=baguncar([
    {s:"&gt;",p:"MAIOR QUE",k:"maior"},
    {s:"&lt;",p:"MENOR QUE",k:"menor"},
    {s:"=",   p:"IGUAL A",  k:"igual"}
  ]);
  var kcerto = (vTopo>vBaixo)?"maior":((vTopo<vBaixo)?"menor":"igual");
  var botoes=[];
  for(i=0;i<sinais.length;i++){
    (function(sn){
      var b=el("div","opt","<span class=\"sinal\">"+sn.s+"</span>"+
                           "<span class=\"sinword\">"+sn.p+"</span>");
      if(sn.k===kcerto) b.setAttribute("data-qa","1");
      b.onclick=function(){ escolheSinal(g,sn,b,kcerto); };
      cx.appendChild(b);
      botoes.push(b);
    })(sinais[i]);
  }
  acaoEl.appendChild(cx);
  ligaTeclado(g,botoes);
}
function escolheSinal(g,sn,b,kcerto){
  if(g!==ger||travada||passo!==2) return;
  if(temClasse(b,"no")||temClasse(b,"ok")) return;
  if(sn.k===kcerto){
    travada=true;                         /* ⚠️ trava NO INSTANTE do acerto */
    b.className="opt ok"; b.removeAttribute("data-qa");
    poeSinal(sn.s);
    sCerto();
    if(errosSin===0&&errosP1===0) deprimeira++;
    msgEl.className="msgc ok";
    msgEl.innerHTML="<b>"+vTopo+"</b> &eacute; <b>"+palavraSin()+"</b> <b>"+vBaixo+"</b>.";
    diz(nomeNum(vTopo) + " é " + palavraSin() + " " + nomeNum(vBaixo) + ".");
    fechaRodada(g,1900);
    return;
  }
  errosSin++;
  sErro();
  b.className="opt no"; b.removeAttribute("data-qa");
  ajudaComp(errosSin,dicasSin());
  /* mesma rede do passo 1: com 3 sinais as erradas acabam no 2º erro */
  if(errosSin>=3||!sobrouErradaSin()) esperaERevelaSin(g);
}
function sobrouErradaSin(){
  if(!acaoEl) return false;
  var l=acaoEl.getElementsByClassName("opt"), i, n=0;
  for(i=0;i<l.length;i++)
    if(!temClasse(l[i],"no")&&l[i].getAttribute("data-qa")!=="1") n++;
  return n>0;
}
function dicasSin(){
  if(vTopo===vBaixo) return [
    "As duas fileiras terminam no <b>mesmo lugar</b>: nenhuma tem mais.",
    "N&atilde;o &eacute; maior nem menor. Procure o sinal dos <b>dois tracinhos iguais</b>.",
    "Quando o tanto &eacute; o mesmo, o sinal &eacute; o de <b>igual</b>."
  ];
  var lado=(vTopo>vBaixo)?"primeiro":"segundo";
  return [
    "O <b>bico aberto</b> do sinal olha sempre para o lado que tem <b>mais</b>.",
    "Aqui o maior &eacute; o <b>"+lado+"</b> n&uacute;mero da frase. A boca do sinal abre para <b>ele</b>.",
    "Por isso o sinal &eacute; este: a boca aberta fica do lado do <b>"+
    Math.max(vTopo,vBaixo)+"</b>, e a pontinha do lado do <b>"+Math.min(vTopo,vBaixo)+"</b>."
  ];
}
/* mesma razao do passo 1: a dica do meio precisa de tempo de leitura antes
   de a explicacao da revelacao tomar o lugar dela. */
function esperaERevelaSin(g){
  travada=true;
  setTimeout(function(){
    if(g!==ger||!viva()) return;
    var l=acaoEl.getElementsByClassName("opt"), i;
    for(i=0;i<l.length;i++)
      if(l[i].getAttribute("data-qa")==="1"){ l[i].className="opt ok"; l[i].removeAttribute("data-qa"); }
    poeSinal(simbolo());
    sNeutro();
    msgEl.className="msgc ok";
    msgEl.innerHTML="<b>"+vTopo+"</b> &eacute; <b>"+palavraSin()+"</b> <b>"+vBaixo+"</b>.";
    /* revela PRIMEIRO (o sinal ja entrou), explica DEPOIS */
    mostraDica(dicasSin()[2]);
    diz(nomeNum(vTopo) + " é " + palavraSin() + " " + nomeNum(vBaixo) + ".");
    fechaRodada(g,2100);
  },1500);
}
function poeSinal(s){
  if(!slotEl) return;
  slotEl.className="slotsin cheio";
  slotEl.innerHTML=s;
}

/* ---------- os ajudantes de sempre ---------- */
function ajudaComp(n,lista){
  var i=n; if(i<1) i=1; if(i>lista.length) i=lista.length;
  mostraDica(lista[i-1]);
}
/* AS DUAS PORTAS: no PC da escola tem teclado e a crianca vai usar. */
function ligaTeclado(g,alvos){
  document.onkeydown=function(ev){
    var e=ev||window.event, k=e.keyCode||e.which, n=k-48;
    if(travada||g!==ger) return;
    if(n>=1&&n<=alvos.length&&alvos[n-1]&&alvos[n-1].onclick){
      alvos[n-1].onclick();
      if(e.preventDefault) e.preventDefault();
    }
  };
}
function fechaRodada(g,ms){
  document.onkeydown=null;
  setTimeout(function(){
    if(g!==ger||!viva()) return;
    ri++;
    if(ri<RODS.length){ telaComp(); return; }
    mostraBanner(mostrouSinal
      ? "<b>Voc&ecirc; comparou e deu nome!</b><br>Primeiro a gente <b>v&ecirc;</b> "+
        "quem tem mais; o sinal s&oacute; conta isso por escrito."
      : "<b>Voc&ecirc; comparou o dinheiro!</b><br>Olhando os dois, d&aacute; para ver "+
        "qual vale <b>mais</b>, qual vale <b>menos</b> e quando valem <b>igual</b>.", fimComp);
  },ms);
}

/* ---------------------------------------------------------------
   A MEDALHA. Parecer em palavras, nunca nota.
   --------------------------------------------------------------- */
function fimComp(){
  limpa();
  ger++; travada=false;
  document.onkeydown=null;
  var t=el("div","tela"); telaAtual=t;
  setProg(t,100);
  var c=el("div","centro");
  c.appendChild(el("div","selo","PE&Ccedil;A FECHADA"));
  c.appendChild(el("div","medal",""));
  var parecer;
  if(deprimeira>=6) parecer="Voc&ecirc; viu quem tinha mais <b>e</b> deu o nome certo quase sempre "+
                            "de primeira. Olho e sinal andando juntos!";
  else if(deprimeira>=3) parecer="Voc&ecirc; j&aacute; olha as duas fileiras <b>antes</b> de escolher o "+
                                 "sinal. &Eacute; assim que o sinal faz sentido.";
  else parecer="Voc&ecirc; descobriu o principal: o sinal n&atilde;o &eacute; um desenho para decorar "+
               "&#8212; ele <b>conta</b> quem tem mais.";
  c.appendChild(el("div","balao",parecer));
  var b=el("button","btn","Jogar de novo");
  b.onclick=function(){ ri=0; deprimeira=0; telaComp(); };
  c.appendChild(b);
  c.appendChild(el("div","hint","E se as duas fileiras come&ccedil;assem em lugares "+
                   "<b>diferentes</b>? Daria para comparar s&oacute; olhando?"));
  t.appendChild(c); app.appendChild(t);
  diz("Peça fechada!");
}

telaComp();
</script>
