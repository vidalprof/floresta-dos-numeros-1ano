<!DOCTYPE html>
<html lang="pt-BR"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>PEÇA — montar a frase (peças por classe de palavra)</title>
<!-- ============================================================
     PEÇA: MONTAR A FRASE COM PEÇAS POR CLASSE DE PALAVRA
     Cópia do MOLDE.html — só o bloco "A PEÇA COMEÇA AQUI" mudou.

     POR QUE ESTA PEÇA EXISTE: numa lista de palavras a criança decora o nome
     das classes; aqui ela MONTA a frase e a estrutura fica VISÍVEL — cada
     classe tem uma FORMA de encaixe própria (a vaga tem a mesma silhueta da
     peça). O gesto é o conceito: o "nome" não entra no lugar da "ação".

     ⭐ NADA ESSENCIAL SÓ NA COR (regra da casa): cada classe tem, ao mesmo
     tempo, FORMA (silhueta da peça e da vaga), COR e ETIQUETA escrita
     ("nome", "ação", "como é", "quando"). Quem não distingue a cor continua
     jogando pela forma e pela palavra.

     AS ARMADILHAS QUE ESTA PEÇA FECHA (_padrao/DINAMICAS.md, linha "Arrastar"):
       · A FRASE CABE NA TELA SEM ROLAR — se a linha da frase rola, a estrutura
         (que é o conteúdo!) some da vista e a peça perde o sentido. Por isso
         vaga fluida, `flex-wrap` e no máximo 5 vagas;
       · TRÊS CAMINHOS: mouse, dedo (arrasto real) e TOQUE SIMPLES;
       · NUNCA `preventDefault` no `touchstart` — mata o toque no celular;
       · guarda contra o clique de mouse FANTASMA que o celular dispara depois
         do toque (`ultimoToque`). Defeito pego DUAS vezes pelo Marcos;
       · nunca trava: no 3º erro a peça é revelada e a frase anda;
       · `data-qa` publicado (a peça que serve AGORA e a vaga da vez = "1") e
         RETIRADO quando a rodada fecha — senão o auditor-jogador fica batendo
         na peça que sobrou.
     ============================================================ -->
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:"Segoe UI",Arial,sans-serif;background:#2b2118;color:#f4efe6}
#app{max-width:520px;margin:0 auto;padding:10px 12px 28px}
.prog{height:9px;background:rgba(255,255,255,.16);border-radius:9px;overflow:hidden;margin:6px 0 12px}
.prog i{display:block;height:100%;background:#59c24b;width:0;-webkit-transition:width .5s;transition:width .5s}
.selo{display:inline-block;background:#3c6ee0;color:#fff;font-weight:700;font-size:13px;
      letter-spacing:.4px;padding:6px 14px;border-radius:20px;margin:0 auto 10px;display:block;
      width:-webkit-fit-content;width:fit-content}
.balao{position:relative;background:rgba(255,253,246,.96);color:#221a12;border-radius:20px;
       padding:13px 17px;font-size:17px;font-weight:600;text-align:center;line-height:1.35;
       box-shadow:0 5px 16px rgba(0,0,0,.28)}
.balao b{color:#1f6b12}
.balao + *{margin-top:13px}
.centro{text-align:center}
.opts{display:block}
.opt{display:block;background:#fffdf6;color:#221a12;border:0;border-radius:16px;padding:13px 16px;
     margin:9px auto;font-size:16px;font-weight:600;min-height:48px;max-width:430px;cursor:pointer;
     box-shadow:0 4px 0 #c9bda6}
.opt:active{-webkit-transform:translateY(3px);transform:translateY(3px);box-shadow:0 1px 0 #c9bda6}
.opt.ok{background:#d6f5c8;box-shadow:0 4px 0 #7cb464}
.opt.no{background:#f7d9d2;box-shadow:0 4px 0 #c08c80}
.hint{font-size:14px;opacity:.85;margin-top:10px}
.dica{background:#fff3c9;color:#3a2c07;border-radius:14px;padding:10px 14px;margin-top:12px;
      font-size:15px;font-weight:600}
.tela{display:block}
/* ⚠️ o banner escondido nao pode contar como "resposta fora da tela": ele nao
   existe para a crianca ainda. `visibility` tira do alcance do dedo e do
   leitor de tela — so `bottom:-260px` deixava o botao clicavel no escuro. */
.banner{position:fixed;left:0;right:0;bottom:-260px;background:#1f6b12;color:#fff;text-align:center;
        padding:18px 16px 22px;border-radius:22px 22px 0 0;visibility:hidden;
        -webkit-transition:bottom .35s;transition:bottom .35s}
.banner.show{bottom:0;visibility:visible}
.btn{background:#ffd54a;color:#33280a;border:0;border-radius:16px;padding:13px 26px;font-size:17px;
     font-weight:800;min-height:48px;cursor:pointer;box-shadow:0 4px 0 #c9a52f}

/* ---------------- A PEÇA: MONTAR A FRASE ----------------
   ⚠️ a folga de 13px em cima e OBRIGATORIA: o balao tem sombra e nenhuma
   margem por baixo, entao o que vem colado nele vira um bloco so (regra 9 do
   _qa/leiaute.js, cobrada DUAS vezes pelo Marcos).                          */
.frase{display:block;text-align:center;margin:13px auto 6px;line-height:0}
.legenda{font-size:12px;opacity:.9;margin:0 0 8px;line-height:1.3}
/* a VAGA tem a MESMA silhueta da peca que serve nela: a crianca ve o encaixe
   antes de ler qualquer coisa (forma, nao so cor). */
.cam{display:inline-block;vertical-align:top;min-width:80px;height:54px;margin:4px 3px;
     border:3px dashed #a08e73;background:rgba(255,255,255,.10);color:#f0e9dd;
     font-size:12px;font-weight:700;line-height:1.15;padding:8px 6px 0;text-align:center}
.cam.agora{border-color:#ffd54a;background:rgba(255,213,74,.16)}
/* cheia = borda INTEIRA + a palavra dentro: forma, nao so cor */
.cam.ok{border-style:solid;border-color:#59c24b;color:#221a12;font-size:17px;font-weight:800;
        line-height:38px;padding:0 8px}
.banco{display:block;text-align:center;margin-top:2px;line-height:0}
.pc{display:inline-block;vertical-align:top;border:3px solid rgba(0,0,0,.14);color:#221a12;
    min-width:80px;height:54px;margin:5px 3px;padding:6px 8px 0;font-size:17px;font-weight:800;
    line-height:1.1;text-align:center;cursor:pointer;box-shadow:0 4px 0 rgba(0,0,0,.28)}
.pc:active{-webkit-transform:translateY(3px);transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.28)}
.pc.sel{box-shadow:0 0 0 4px #ffd54a}
.pc.usada{visibility:hidden;pointer-events:none}
.pc.pisca{-webkit-animation:pisca .7s infinite;animation:pisca .7s infinite}
.pc.treme{-webkit-animation:treme .32s;animation:treme .32s}
@-webkit-keyframes pisca{0%,100%{box-shadow:0 4px 0 rgba(0,0,0,.28)}50%{box-shadow:0 0 0 5px #ffd54a}}
@keyframes pisca{0%,100%{box-shadow:0 4px 0 rgba(0,0,0,.28)}50%{box-shadow:0 0 0 5px #ffd54a}}
@-webkit-keyframes treme{25%{-webkit-transform:translateX(-6px)}75%{-webkit-transform:translateX(6px)}}
@keyframes treme{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
/* a etiqueta escrita da classe (o que salva quem nao distingue cor) */
.eti{display:block;font-size:10px;font-weight:700;letter-spacing:.4px;opacity:.85;margin-top:2px}
/* a sombra que segue o dedo/o mouse durante o arrasto. pointer-events:none
   para nao roubar o hit-test de quem esta embaixo. */
.somb{position:fixed;min-width:80px;height:54px;padding:6px 8px 0;text-align:center;
      color:#221a12;font-size:17px;font-weight:800;line-height:1.1;pointer-events:none;z-index:60;
      box-shadow:0 8px 18px rgba(0,0,0,.45)}

/* ====== AS FORMAS DE CADA CLASSE ======
   Vem DEPOIS de .pc/.cam/.somb de proposito: mesma forca de seletor, quem
   vem por ultimo vence. Assim a MESMA silhueta serve a peca, a vaga e a
   sombra do arrasto, sem repetir regra.                                   */
.f-art{border-radius:999px}                    /* pastilha  — o / a        */
.f-sub{border-radius:6px}                      /* tijolo    — nome         */
.f-adj{border-radius:22px 6px 22px 6px}        /* folha     — como e       */
.f-ver{border-radius:6px 26px 26px 6px}        /* seta      — acao         */
.f-adv{border-radius:26px 26px 6px 6px}        /* arco      — quando       */
.c-art{background:#e6d9f6}
.c-sub{background:#cfe3ff}
.c-adj{background:#d6f0cd}
.c-ver{background:#ffe0bd}
.c-adv{background:#ffeeb0}
.medal{width:96px;height:96px;line-height:96px;margin:6px auto 0;border-radius:50%;
       background:#ffd54a;color:#33280a;font-size:20px;font-weight:800;text-align:center;
       box-shadow:0 6px 0 #c9a52f}
/* tela baixa: encolhe a LETRA e a folga, nunca o alvo do dedo */
@media (max-height:470px){.legenda{margin-bottom:4px}.pc{margin:3px 3px}.cam{margin:3px 3px}}
</style></head>
<body>
<div id="app"></div>
<div id="banner" class="banner"><div id="bmsg"></div><button id="bcta" class="btn" style="margin-top:12px">Continuar</button></div>
<script>
/* ====== MOTORZINHO DA PEÇA (os mesmos nomes das atividades) ====== */
var app=document.getElementById("app"), banner=document.getElementById("banner"),
    bmsg=document.getElementById("bmsg"), bcta=document.getElementById("bcta");
function el(t,c,h){var e=document.createElement(t);if(c)e.className=c;if(h!==undefined&&h!==null)e.innerHTML=h;return e;}
function limpa(){app.innerHTML="";}
function setProg(t,p){var pr=el("div","prog");var i=el("i");i.style.width=p+"%";pr.appendChild(i);t.appendChild(pr);}
function mostraDica(txt){var d=document.getElementById("dicaP");if(!d){d=el("div","dica");d.id="dicaP";
  var c=app.querySelector(".centro")||app;c.appendChild(d);}d.innerHTML=txt;}
function mostraBanner(msg,cb){bmsg.innerHTML=msg;banner.className="banner show";festa();
  bcta.onclick=function(){banner.className="banner";if(cb)cb();};}
function baguncar(a){var i,j,x;for(i=a.length-1;i>0;i--){j=Math.floor(Math.random()*(i+1));x=a[i];a[i]=a[j];a[j]=x;}return a;}
/* som: os numeros vieram da pesquisa (PESQUISA-SOM-E-GAMEFEEL). "ding" e
   sintetizado — MP3 chega atrasado e mata a sensacao de causa-efeito. */
var AC=null;
function ac(){try{if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();
  if(AC.state==="suspended")AC.resume();}catch(e){}return AC;}
function nota(f,dur,vol,tipo,atraso){var c=ac();if(!c)return;
  var o=c.createOscillator(),g=c.createGain(),t=c.currentTime+(atraso||0);
  o.type=tipo||"triangle";o.frequency.value=f;
  g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol||.18,t+.014);
  g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(g);g.connect(c.destination);o.start(t);o.stop(t+dur+.02);}
function sCerto(){nota(523.25,.35,.18,"triangle",0);nota(659.25,.35,.16,"triangle",.055);nota(783.99,.35,.15,"triangle",.11);}
function sErro(){nota(300,.14,.12,"sine",0);nota(318,.14,.12,"sine",0);}
function sTap(){nota(880,.012,.10,"square",0);}
function festa(){sCerto();}
document.addEventListener("pointerdown",function(){ac();},false);
</script>
<script>
/* ====== A PEÇA COMEÇA AQUI ====== */
/* MONTAR A FRASE — a crianca encaixa as palavras nas vagas, da esquerda para a
   direita. Cada CLASSE tem forma, cor e etiqueta proprias; a vaga tem a
   silhueta da peca que serve nela.

   Trocar `FRASES` ja adapta a peca a outro conteudo. A unica regra: a frase
   precisa ter UMA ordem certa e caber em ate 5 vagas (senao a linha da frase
   rola e a estrutura, que e o conteudo, some da vista).                     */
var CLA={
  art:{r:"o / a",   d:"a palavrinha <b>o</b> ou <b>a</b>, que vem antes do nome"},
  sub:{r:"nome",    d:"o <b>nome</b> da coisa ou do bicho"},
  adj:{r:"como &#233;", d:"<b>como</b> a coisa &#233;"},
  ver:{r:"a&#231;&#227;o", d:"a <b>a&#231;&#227;o</b>: o que aconteceu"},
  adv:{r:"quando",  d:"<b>quando</b> aconteceu"}
};
var FRASES=[
 {w:["O","gato","preto","dormiu"],      c:["art","sub","adj","ver"], apoio:true},
 {w:["A","flor","amarela","cresceu"],   c:["art","sub","adj","ver"], apoio:false},
 {w:["A","turma","jogou","hoje"],       c:["art","sub","ver","adv"], apoio:false}
];

var rodada=0, vagaAtual=0, errosSeg=0, telaAtual=null, barraP=null;
var pecas=[], camas=[], frase=null;
/* ⚠️ o guarda do MOUSE FANTASMA: o celular dispara mousedown/click DEPOIS do
   toque. Sem esta marca de tempo a peca era acionada duas vezes (o toque
   colocava e o fantasma tentava colocar de novo). */
var ultimoToque=0, pego=null, somb=null, px0=0, py0=0, moveu=false;

function telaFrase(){
  limpa(); document.onkeydown=null; soltaSombra();
  if(rodada>=FRASES.length) rodada=0;
  frase=FRASES[rodada];
  vagaAtual=0; errosSeg=0; pecas=[]; camas=[];
  var t=el("div","tela"); telaAtual=t;
  setProg(t,Math.round(rodada*100/FRASES.length));
  barraP=t.querySelector(".prog i");
  var c=el("div","centro");
  c.appendChild(el("div","selo","MONTE A FRASE "+(rodada+1)+"/"+FRASES.length));
  c.appendChild(el("div","balao","Cada vaga tem uma <b>forma</b>. Ponha a palavra que encaixa."));

  /* AS VAGAS: cada uma com a silhueta e a etiqueta da classe que serve nela */
  var f=el("div","frase"), i, cm;
  for(i=0;i<frase.c.length;i++){
    cm=el("div","cam f-"+frase.c[i],CLA[frase.c[i]].r);
    f.appendChild(cm); camas.push(cm);
  }
  c.appendChild(f);
  /* A ESCADA (o `apoio` da rodada): na 1a rodada a peca vem com a ETIQUETA da
     classe escrita nela — a crianca casa etiqueta com etiqueta e entende a
     regra do jogo. Da 2a em diante a etiqueta SAI: sobram a forma e a cor, e
     ela precisa decidir sozinha o que aquela palavra e. Mesma mecanica, um
     degrau acima — e nada essencial fica so na cor, porque cada classe tem a
     SUA forma (`.f-*`) e a vaga continua dizendo o nome dela por escrito. */
  c.appendChild(el("div","legenda", frase.apoio
    ? "Forma e cor mostram a classe; o nome dela est&#225; escrito na vaga e na pe&#231;a."
    : "Agora as pe&#231;as v&#234;m <b>sem etiqueta</b>: use a forma, a cor e o nome da vaga."));

  /* AS PECAS: as mesmas palavras, bagunçadas */
  var bc=el("div","banco"), ordem=[], b;
  for(i=0;i<frase.w.length;i++) ordem.push(i);
  baguncar(ordem);
  for(i=0;i<ordem.length;i++){
    b=el("div","pc f-"+frase.c[ordem[i]]+" c-"+frase.c[ordem[i]],
         frase.w[ordem[i]]+(frase.apoio
           ? '<i class="eti">'+CLA[frase.c[ordem[i]]].r+'</i>' : ''));
    b.idx=ordem[i];
    ligaFicha(b);
    bc.appendChild(b); pecas.push(b);
  }
  c.appendChild(bc);
  c.appendChild(el("div","hint","Toque na palavra ou arraste at&#233; a vaga."));
  t.appendChild(c); app.appendChild(t);
  marcaQualServe();
}

/* ---------- as TRES portas de entrada da mesma peca ---------- */
/* ⚠️ o `touchstart` recebe uma funcao COM NOME de proposito: assim nenhum
   `preventDefault` fica perto dele. preventDefault no touchstart mata o
   toque no celular (armadilha registrada no _padrao/DINAMICAS.md). */
function ligaFicha(b){
  b.onclick=cliqueFicha;
  b.onmousedown=mouseIni;
  b.addEventListener("touchstart",toqueIni,false);
  b.addEventListener("touchmove",toqueMeio,false);
  b.addEventListener("touchend",toqueFim,false);
}
function cliqueFicha(){
  if(Date.now()-ultimoToque<700) return;   /* clique FANTASMA depois do toque */
  tocaFicha(this);
}
function mouseIni(ev){
  if(Date.now()-ultimoToque<700) return;
  pegaEm(this,ev.clientX,ev.clientY);
}
function toqueIni(ev){
  ultimoToque=Date.now();
  var to=ev.touches[0]; if(!to) return;
  pegaEm(this,to.clientX,to.clientY);
}
function toqueMeio(ev){
  if(!pego) return;
  var to=ev.touches[0]; if(!to) return;
  moveEm(to.clientX,to.clientY);
  if(moveu) ev.preventDefault();   /* so no MEIO do arrasto, nunca no comeco */
}
function toqueFim(ev){
  ultimoToque=Date.now();
  var to=ev.changedTouches[0], arrastou=moveu, alvo=this;
  if(to) soltaEm(to.clientX,to.clientY); else soltaSombra();
  if(!arrastou) tocaFicha(alvo);   /* toque simples: vale como clique */
}
function moveMouse(ev){ if(pego) moveEm(ev.clientX,ev.clientY); }
function soltaMouse(ev){ if(pego) soltaEm(ev.clientX,ev.clientY); }
document.onmousemove=moveMouse;
document.onmouseup=soltaMouse;

/* ---------- o arrasto de verdade (mouse e dedo usam o mesmo caminho) ---- */
function pegaEm(b,x,y){
  if(!b||b.className.indexOf("usada")>=0) return;
  pego=b; px0=x; py0=y; moveu=false;
  sTap();
  b.className=classeDe(b)+" sel";
  somb=el("div","somb f-"+frase.c[b.idx]+" c-"+frase.c[b.idx],frase.w[b.idx]);
  somb.style.left=(x-40)+"px"; somb.style.top=(y-27)+"px";
  somb.style.display="none";
  document.body.appendChild(somb);
}
function moveEm(x,y){
  if(!pego||!somb) return;
  if(!moveu&&(Math.abs(x-px0)>8||Math.abs(y-py0)>8)){ moveu=true; somb.style.display="block"; }
  if(moveu){ somb.style.left=(x-40)+"px"; somb.style.top=(y-27)+"px"; }
}
function soltaEm(x,y){
  var b=pego, arrastou=moveu;
  soltaSombra();
  if(!b) return;
  if(b.className.indexOf("usada")<0) b.className=classeDe(b);
  if(!arrastou) return;            /* nao arrastou: quem resolve e o clique */
  if(naFrase(x,y)) tocaFicha(b);
}
function soltaSombra(){
  if(somb&&somb.parentNode) somb.parentNode.removeChild(somb);
  somb=null; pego=null; moveu=false;
}
function naFrase(x,y){
  var e=document.elementFromPoint(x,y), n=0, cl;
  while(e&&n<6){
    cl=" "+String(e.className||"")+" ";
    if(cl.indexOf(" cam ")>=0||cl.indexOf(" frase ")>=0) return true;
    e=e.parentNode; n++;
  }
  return false;
}
/* a classe base da peca (forma + cor), sem os estados sel/pisca/treme */
function classeDe(b){ return "pc f-"+frase.c[b.idx]+" c-"+frase.c[b.idx]; }

/* ---------- a regra da fase ---------- */
function tocaFicha(b){
  if(!b||b.className.indexOf("usada")>=0) return;
  if(vagaAtual>=frase.w.length) return;
  if(b.idx===vagaAtual) poeNaFrase(b); else erraFicha(b);
}
function poeNaFrase(b){
  var cm=camas[vagaAtual];
  cm.className="cam f-"+frase.c[vagaAtual]+" c-"+frase.c[vagaAtual]+" ok";
  cm.innerHTML=frase.w[vagaAtual];
  b.className=classeDe(b)+" usada";
  sCerto();
  vagaAtual++; errosSeg=0;
  apagaDica();
  if(barraP) barraP.style.width=
    Math.round((rodada+vagaAtual/frase.w.length)*100/FRASES.length)+"%";
  marcaQualServe();
  if(vagaAtual>=frase.w.length) fechaRodada();
}
function erraFicha(b){
  sErro(); errosSeg++;
  b.className=classeDe(b)+" treme";
  destreme(b);
  ajuda(errosSeg);
}
/* ⚠️ o temporizador continua correndo depois do limpa(): sem o guarda
   `!telaAtual.parentNode` ele mexeria numa tela que ja saiu. */
function destreme(b){
  setTimeout(function(){
    if(!telaAtual||!telaAtual.parentNode) return;
    if(b.className.indexOf("usada")<0) b.className=classeDe(b);
  },340);
}
/* O ANDAIME QUE CRESCE — dica, apoio concreto, e por fim revela e segue.
   Erro nunca vira X vermelho nem a palavra "errou": a peca treme e a ajuda
   aumenta.                                                                */
/* ⚠️ A ORDEM DO 3o DEGRAU E O CONSERTO (defeito medido ago/2026): a dica saia
   ANTES do `revela()`, e o `poeNaFrase()` de dentro dele chama `apagaDica()` —
   a fala que EXPLICA a revelacao aparecia e sumia no mesmo quadro. A crianca
   via a palavra entrar sozinha na frase sem entender de onde veio. Revela-se
   primeiro; a dica vem depois e fica na tela. */
function ajuda(n){
  var k=frase.c[vagaAtual], palavra=frase.w[vagaAtual];
  if(n===1){
    mostraDica("Esta vaga pede "+CLA[k].d+".");
  }else if(n===2){
    mostraDica("Olhe a <b>forma</b> da vaga: a pe&#231;a que encaixa est&#225; <b>piscando</b>.");
    acendeCerta();
  }else{
    revela();
    mostraDica("Era esta: <b>"+palavra+"</b>. Eu coloquei, e a pr&#243;xima &#233; sua.");
  }
}
function acendeCerta(){
  var i,b;
  for(i=0;i<pecas.length;i++){
    b=pecas[i];
    if(b.className.indexOf("usada")>=0) continue;
    b.className=classeDe(b)+((b.idx===vagaAtual)?" pisca":"");
  }
}
function revela(){
  var i,b;
  for(i=0;i<pecas.length;i++){
    b=pecas[i];
    if(b.className.indexOf("usada")<0&&b.idx===vagaAtual){ poeNaFrase(b); return; }
  }
}
function apagaDica(){
  var d=document.getElementById("dicaP");
  if(d&&d.parentNode) d.parentNode.removeChild(d);
}
/* data-qa: a peca que serve AGORA e a vaga da vez ficam com "1". E so para o
   auditor-jogador (_qa/jogador.js) conseguir terminar a peca sozinho.
   ⚠️ quando a rodada fecha, o data-qa SAI de todas: senao o jogador fica
   batendo eternamente numa peca que nao serve mais para nada.             */
function marcaQualServe(){
  var i,b,fim=(vagaAtual>=frase.w.length);
  for(i=0;i<pecas.length;i++){
    b=pecas[i];
    if(fim){ b.removeAttribute("data-qa"); continue; }
    b.setAttribute("data-qa",(b.className.indexOf("usada")<0&&b.idx===vagaAtual)?"1":"0");
  }
  for(i=0;i<camas.length;i++){
    if(fim){ camas[i].removeAttribute("data-qa"); camas[i].className=
      camas[i].className.replace(" agora",""); continue; }
    camas[i].setAttribute("data-qa",(i===vagaAtual)?"1":"0");
    if(i===vagaAtual&&camas[i].className.indexOf("ok")<0&&camas[i].className.indexOf("agora")<0)
      camas[i].className+=" agora";
    if(i!==vagaAtual) camas[i].className=camas[i].className.replace(" agora","");
  }
}
function fechaRodada(){
  setTimeout(function(){
    if(!telaAtual||!telaAtual.parentNode) return;
    var i,txt="";
    for(i=0;i<frase.w.length;i++) txt+=(i?" ":"")+frase.w[i];
    rodada++;
    mostraBanner("Frase montada: <b>"+txt+".</b>",
                 (rodada<FRASES.length)?telaFrase:telaFimFrase);
  },420);
}

/* O CONCEITO VEM POR ULTIMO (Portao 0 da filosofia): so agora, depois de a
   crianca ter montado tres frases, a peca nomeia o que ela fez.            */
function telaFimFrase(){
  limpa(); document.onkeydown=null; soltaSombra();
  rodada=0;
  var t=el("div","tela"); telaAtual=t; setProg(t,100);
  var c=el("div","centro");
  c.appendChild(el("div","selo","PRONTO"));
  c.appendChild(el("div","medal","MEDALHA"));
  c.appendChild(el("div","balao","Toda frase tem <b>pe&#231;as de tipos diferentes</b>: "+
    "o <b>nome</b>, a <b>a&#231;&#227;o</b>, o <b>como &#233;</b>. Cada uma com a sua forma."));
  var b=el("button","btn","Jogar de novo");
  b.onclick=telaFrase;
  c.appendChild(b);
  t.appendChild(c); app.appendChild(t);
}
telaFrase();
</script>
