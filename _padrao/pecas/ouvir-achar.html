<title>PEÇA — ouvir e achar (o som chama, a figura responde)</title>
<!-- ============================================================
     PEÇA: OUVIR E ACHAR — toca a palavra, a criança acha a figura.
     (copiada do _padrao/pecas/MOLDE.html; só o bloco "A PEÇA COMEÇA AQUI" muda)

     POR QUE ELA EXISTE:
     no pré e no 1º ano a criança ainda não lê — ela OUVE. Esta é a mecânica que
     deixa a atividade inteira acessível a quem ainda soletra: o enunciado chega
     pelo ouvido e a resposta é uma FIGURA, não uma frase. E é também a porta da
     consciência fonológica: da palavra inteira (rodada 1 e 2) para o SOM DO
     COMEÇO (rodada 3), que é o degrau que abre a leitura.

     ⚠️ A REGRA QUE MANDA AQUI: ELA TEM QUE FUNCIONAR NO MUDO.
     PC de escola sem caixa de som existe, e é a regra da casa que todo som tenha
     gêmeo visual. Então a palavra da vez aparece SEMPRE ESCRITA, em letra
     grande, ao lado do botão de ouvir; e cada figura tem o nome escrito embaixo.
     Quem tem som ouve e acha; quem não tem, lê e acha; quem não lê nem ouve,
     ainda tem o alto-falante de cada resposta. Nenhuma criança fica de fora.

     A VOZ AQUI É `speechSynthesis` SÓ PARA PROVAR O CONTRATO. Na atividade de
     verdade, cada chamada de `diz(...)` vira `falaDaTela(id)` (o MP3 gravado
     pelo `entregar.yml` a partir do `falas.json`) e o alto-falante de cada
     resposta vira `op_<chave>.mp3` + `VOZOK`, como manda o pilar SONORA.

     AS ARMADILHAS QUE ESTA PEÇA FECHA:
       · EXATAMENTE 3 DISTRATORES. Com 2, a criança elimina tudo antes do 3º erro
         e o degrau "revelar" vira código morto; com 5, o andaime nunca chega.
       · OPÇÃO JÁ TENTADA não se distingue só pela cor nem responde com silêncio:
         ganha a etiqueta em PALAVRAS ("já tentamos") e um som de retorno.
       · A CORRIDA DO TOQUE DUPLO: `travada = true` no INSTANTE do acerto, nunca
         no fim da animação — criança toca duas vezes, é o normal dela.
       · A 3ª DICA INVISÍVEL: o revelar acende a certa e SÓ DEPOIS escreve a
         explicação, que fica 2,2s de pé. Nas cinco peças de ago/2026 ela era
         escrita e apagada no mesmo quadro.
       · TEMPORIZADOR DE RODADA VELHA: todo setTimeout guarda a GERAÇÃO.
       · OPÇÕES EMBARALHADAS: na Fábrica de Estrelas a certa era sempre a 1ª e a
         criança aprendeu a posição, não o conteúdo.
       · NUNCA TRAVA: o 3º erro resolve a rodada sozinho.

     REGRAS DA PEÇA: ES5 puro, 1 arquivo, sem biblioteca (Chrome 109/Firefox
     106); alvo >= 44px; nada essencial só na cor; funciona no mudo; publica
     data-qa; termina em .medal. Toda figura é desenhada em CSS — sem arquivo
     externo, porque a peça tem que rodar sozinha em qualquer lugar.
     ============================================================ -->
<style>

/* ⚠️ o banner escondido nao pode contar como "resposta fora da tela": ele nao

/* ====== CSS DESTA PEÇA ====== */
/* A CAIXA DE SOM: o botao de ouvir E a palavra ESCRITA, lado a lado. A palavra
   escrita nao e enfeite — e o gemeo visual do som, o que faz a peca funcionar

         padding:7px 10px;text-align:center}

.palvbox{display:inline-block;vertical-align:middle;margin-left:11px;text-align:left}

/* O ALTO-FALANTE DESENHADO (nada de emoji).
   ⚠️ DEFEITO PEGO NO PRINT (ago/2026): na 1a versao o corpinho ficava do lado
   errado do cone e o desenho virava uma SETA PARA A ESQUERDA — a crianca lia
   "voltar" num botao que fala. Corpo a ESQUERDA, cone abrindo para a DIREITA,
   e a ondinha de som na frente: ai nao se confunde com seta.

   ⚠️ E ELE ERA DESENHADO A BORDA (corpo no `:after`, onda no `:before`, cone
   numa borda-triangulo) num elemento de tamanho ZERO. Deu defeito duas vezes:
   a onda escapava do botao (`:before` ia ate 26px num circulo de 30) e, num
   elemento sem tamanho, o flex centra o PONTO e nao a tinta — o desenho saia
   torto. Agora e UM SVG embutido: o glifo se centra pelo proprio `viewBox`, o
   elemento tem tamanho de verdade e fica nitido em qualquer zoom. Data URI =
   continua 1 arquivo so, sem pedido de rede. O MESMO glifo serve o botao
   "Ouvir" do enunciado e o alto-falante de cada resposta — dois desenhos
   diferentes de alto-falante no mesmo app e amadorismo. */
.fone{display:inline-block;vertical-align:middle;width:22px;height:22px;margin:0 8px 0 4px;
      background:url("data:image/svg+xml;charset=utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 20 20'%3E%3Cpath fill='%2333280a' d='M4 7.6h3.1L11 3.9v12.2L7.1 12.4H4z'/%3E%3Cpath fill='none' stroke='%2333280a' stroke-width='1.7' stroke-linecap='round' d='M13.3 7.1a4.2 4.2 0 0 1 0 5.8'/%3E%3C/svg%3E") center center no-repeat;
      -webkit-background-size:22px 22px;background-size:22px 22px}
.fone:after,.fone:before{content:none;display:none}

/* AS FIGURAS. Duas colunas no celular; em janela baixa viram quatro numa linha
   so (a altura e o que falta la, nao a largura). */
.fig{display:inline-block;vertical-align:top;width:47%;max-width:190px;position:relative;
     margin:4px 1%;padding:6px 6px 19px;min-height:0;text-align:center}
.destxt{font-size:46px;font-weight:800;color:#2b2118;line-height:1}

/* alto-falante de CADA resposta (pilar SONORA: no pre/1o ano tem quem nao le,
   e sem a voz a escolha vira loteria) */

     border:0;border-radius:12px;background:#efe6d2;cursor:pointer;padding:0;line-height:44px}
.zap:active{background:#ded3b8}
/* ETIQUETA EM PALAVRAS, nunca so a cor: quem nao distingue cor precisa LER que

.fig.certa{background:#d6f5c8;-webkit-box-shadow:0 4px 0 #7cb464,0 0 0 4px #2f7a1c;

/* ⭐⭐ O CARTAO DA FIGURA — refeito (cobranca do Marcos, ago/2026: *"o dizer da
   figura fica fora do quadrado branco, ficou feio, isso teria que ficar mais
   profissional, com uma moldura, ou sem fundo somente a imagem sem fundo e seu
   nome embaixo"*).

   O que estava errado: esta peca nasceu com figuras DESENHADAS EM CSS, de 46px.
   Quando ela passou a aceitar ARTE DE IA, o cartao nao acompanhou — a figura
   ficou perdida num canto, o nome caiu PARA FORA da borda branca e os cartoes
   encostaram na esquerda com um vazio enorme a direita.

   O molde agora: cartao centrado e largo, com MOLDURA propria em volta da
   figura (fundo creme, borda suave), a figura GRANDE dentro dela, e o nome
   LOGO ABAIXO, dentro do cartao. O alto-falante fica a direita, no meio. */
/* ⭐ NO JEITO DO BROTO: cartao quadrado, figura GRANDE em cima e o nome
   EMBAIXO, dentro do cartao — nunca pendurado para fora. Dois por linha. */
/* ⚠️ LICAO PAGA (ago/2026): o MOTOR tem `.opts{flex-direction:column}` (vem do
   Broto, onde as respostas sao uma lista). Esta regra aqui define `display` e
   `flex-wrap`, mas eu NAO tinha escrito a DIRECAO — e especificidade vale por
   PROPRIEDADE: a coluna do motor continuava mandando, e os cartoes ficavam
   empilhados por mais que a largura coubesse dois. Medido no navegador
   (`display:flex, wrap:wrap, largura 179px, pai 380px`) — deduzir nao resolveu,
   MEDIR resolveu. Toda regra de flex que disputa com o motor escreve a direcao. */
.opts{display:-webkit-box;display:flex;
  -webkit-box-orient:horizontal;-webkit-box-direction:normal;
  -webkit-flex-direction:row;flex-direction:row;
  -webkit-flex-wrap:wrap;flex-wrap:wrap;
  -webkit-box-pack:center;justify-content:center;
  -webkit-box-align:start;align-items:flex-start;
  gap:10px;max-width:412px;margin:12px auto 0}
/* ⭐ VIDRO FOSCO — escolha do Marcos entre tres opcoes que eu mostrei (ago/2026).
   Cartao creme TRANSLUCIDO: o cenario da padaria aparece desfocado por tras, em
   vez de ser tapado por um quadrado branco chapado. E o acabamento de app que
   ele pediu.
   ⚠️ eu tinha avisado que o desfoque nao funcionaria no PC da escola. ESTAVA
   ERRADO: `backdrop-filter` existe no Chrome desde a 76 e a escola tem a 109
   (e o Firefox desde a 103). Corrigido antes de virar lenda.
   Mesmo assim ha queda: sem desfoque o cartao continua legivel, porque o creme
   translucido e a borda clara ja separam a figura do fundo. */
.opt.oaf{display:block;width:47%;max-width:190px;margin:0;padding:12px 8px 10px;
  text-align:center;min-height:0;
  background:rgba(255,248,232,.55);
  -webkit-backdrop-filter:blur(6px) saturate(1.05);backdrop-filter:blur(6px) saturate(1.05);
  border:2px solid rgba(255,255,255,.78);border-bottom-width:5px;border-radius:22px;
  -webkit-box-shadow:0 8px 18px rgba(40,25,10,.28);box-shadow:0 8px 18px rgba(40,25,10,.28)}
.opt.oaf .des img{-webkit-filter:drop-shadow(0 5px 7px rgba(40,25,10,.3));
  filter:drop-shadow(0 5px 7px rgba(40,25,10,.3))}
.opt.oaf .nom{color:#3a3020;text-shadow:0 1px 0 rgba(255,255,255,.6)}
.opt.oaf.ok{background:rgba(214,245,200,.75);border-color:#5bbf3a}
.opt.oaf.no{background:rgba(255,224,218,.75);border-color:#ff7a6b}
/* ⚠️⚠️ LICAO PAGA (ago/2026), e a que explica TODOS os defeitos visuais desta
   peca de uma vez: a opcao se chamava `.fig` — e `.fig` e o nome que o MOTOR usa
   para a figurinha do CRACHA (82x82, quadrada, fundo branco). Numa atividade
   montada as duas viviam no mesmo documento, e o cracha do Broto atropelava a
   resposta: 82px cravados, o quadrado branco que o Marcos estranhou, o nome
   expulso para fora e o alto-falante sumido.
   Nao era o meu CSS: era COLISAO DE NOME com o motor — a mesma familia do `ac`
   funcao x objeto que ja tinha custado a peca da memoria.
   Achado com `CSS.getMatchedStylesForNode` (CDP), listando TODAS as regras que
   casavam com o elemento. Adivinhar nao resolveu tres vezes; medir resolveu na
   primeira.
   ⚠️ REGRA: peca nao usa nome de classe curto e generico (`fig`, `cel`, `pc`).
   O integrador ja confere isso (`classes_que_vazam`) — e este caso mostra que o
   aviso dele precisa virar REPROVACAO quando a colisao muda tamanho.

   E, junto, a forma: UMA so (cobranca do Marcos: *"nao entendi os quadrados se
   tem o circulo... ficou feio"*). A figura SEM FUNDO em cima, o nome embaixo. (cobranca do Marcos, ago/2026: *"nao entendi os quadrados se
   tem o circulo... esse fundo branco e esses quadrados e circulos ficou feio"*).
   Ele estava certo: eu tinha um cartao branco arredondado E um circulo branco
   dentro dele. Duas formas competindo, e a figura espremida no meio.
   Agora e uma so: a figura SEM FUNDO em cima, o nome embaixo. */
.opt.oaf .des{position:relative;width:100%;height:104px;margin:0 auto}
.opt.oaf .des img{width:100%;height:100%;object-fit:contain;display:block}
.opt.oaf .linha{margin:8px 0 0;white-space:normal;

/* o ALTO-FALANTE da resposta: bem visivel e dentro do cartao. Estava com 0.62 de

/* ⚠️⚠️ LICAO PAGA (ago/2026), e o Marcos apontou DUAS vezes: "esse botao de som
   nao ficou certo". Eu tinha aumentado o botao de 30 para 34px para ele ficar
   mais visivel — e as PECAS DE DENTRO (o corpinho do alto-falante e as ondas)
   sao posicionadas em pixel ABSOLUTO pelo motor, para 30px. Com a caixa maior
   elas ficaram para fora: medido, o corpo terminava 6px ABAIXO do botao, e a
   onda sonora aparecia como um ")" solto ao lado do circulo.
   Regra: nao se muda o TAMANHO de um componente cujo miolo e posicionado em
   pixel absoluto por outro arquivo. Muda-se o que nao mexe na geometria — cor,
   opacidade, sombra. O tamanho volta a ser o do motor. */
/* ⚠️⚠️ LICAO PAGA (ago/2026) — o Marcos apontou este mesmo botao TRES vezes:
   *"esse botao de som nao ficou certo"*, depois *"esta horrivel"*. Cada rodada
   eu mexia em pixel e ele continuava errado. O que finalmente mostrou o
   problema nao foi numero nenhum: foi FOTOGRAFAR o cartao em zoom 3x.

   E as duas rodadas do meio eu gastei no LUGAR ERRADO — escrevendo regras para
   `.zap i`, `.zap b`, `.zap s`, que sao os elementos do MOTOR. O botao desta
   peca e outro: `<button class="zap"><i class="fone"></i></button>`. Eu deduzi
   a marcacao de outra peca em vez de abrir o HTML desta.

   AS DUAS REGRAS QUE FICAM:
   1. antes de escrever CSS para um componente, ABRIR o HTML DELE;
   2. acabamento se confere OLHANDO — foto em zoom, nao `getBoundingClientRect`. */
.opt.oaf .zap{position:relative;display:-webkit-inline-box;display:inline-flex;
  -webkit-box-align:center;align-items:center;-webkit-box-pack:center;justify-content:center;
  width:32px;height:32px;border-radius:50%;border:0;padding:0;margin-left:8px;
  vertical-align:middle;cursor:pointer;opacity:1;
  background:rgba(255,210,63,.95);box-shadow:0 2px 0 rgba(150,110,10,.4)}
/* ⚠️ LICAO PAGA, e a mais cara do dia (ago/2026). O Marcos, com razao: *"esse
   botao de som esta horrivel. A parte preta tem que estar no meio do circulo.
   Acho que nem precisaria dizer isso"*. Nao precisava mesmo.

   O desenho vinha de BORDAS num elemento de tamanho ZERO (corpo no `:after`,
   onda no `:before`, cone numa borda-triangulo). Isso da dois problemas de uma
   vez: (1) elemento de tamanho zero NAO se centra com flex — o navegador centra
   o PONTO, e a tinta sai toda para um lado; (2) a tinta e a soma de tres caixas
   posicionadas na mao, entao "centrar" vira aritmetica de coordenada que erra a
   cada ajuste. Foram QUATRO rodadas mexendo em pixel e o desenho continuava
   feio: um quadradao com um espeto, e a onda quase invisivel.

   O conserto que acaba com a familia inteira do defeito: UM SVG embutido como
   `background-image`. O glifo se centra sozinho pelo proprio `viewBox` (a
   tinta vai de x=4 a x~15 num quadro de 20, centro ~10 = o centro do quadro),
   o elemento passa a ter tamanho real (20x20) e o flex do botao o centra de
   verdade. Sem pseudo-elemento, sem coordenada na mao, e nitido em qualquer
   zoom por ser vetor. Data URI = continua 1 arquivo so, sem pedido de rede.

   E a licao de metodo, que ja tinha sido paga antes nesta mesma peca: antes de
   escrever CSS para um componente, ABRIR o HTML DELE — aqui a marcacao e
   `<button class="zap"><i class="fone"></i></button>`, nao os `.zap i/b/s` que
   o motor usa. E olhar a FOTO em zoom: fotografar o cartao em 3x mostrou o que
   numero nenhum me mostrou. */
.opt.oaf .zap .fone{position:static;width:20px;height:20px;margin:0;
  -webkit-background-size:20px 20px;background-size:20px 20px}
@media (prefers-reduced-motion:reduce){
  .oafaisca{display:none}
  .opt.oaf.certa,.oaprox{-webkit-animation:none;animation:none}
}

<body>
<div id="app"></div>
<div id="banner" class="banner"><div id="bmsg"></div><button id="bcta" class="btn" style="margin-top:12px">Continuar</button></div>
<script>
/* ====== MOTORZINHO DA PEÇA (os mesmos nomes das atividades) ====== */
var app=document.getElementById("app"), banner=document.getElementById("banner"),
    bmsg=document.getElementById("bmsg"), bcta=document.getElementById("bcta");
function el(t,c,h){var e=document.createElement(t);if(c)e.className=c;if(h!==undefined&&h!==null)e.innerHTML=h;return e;}
function limpa(){app.innerHTML="";}
function setProg(t,p){var pr=el("div","prog");var i=el("i");i.style.width=p+"%";pr.appendChild(i);t.appendChild(pr);}
/* ⚠️ A DICA TEM QUE CABER NA TELA (ago/2026). Ela era o ULTIMO filho do
   `.centro`, e em janela apertada (320x568 e 1024x420 — o monitor da escola)
   caia 25 a 96 px ABAIXO DA DOBRA: a crianca que errou precisava ROLAR para ler
   a ajuda, justo no momento em que esta perdida. Agora ela entra LOGO DEPOIS do
   enunciado, que e onde o olho ja esta. Defeito estrutural: valia para as 57
   pecas de uma vez. */
function mostraDica(txt){var d=document.getElementById("dicaP");
  if(!d){ d=el("div","dica"); d.id="dicaP";
    var b=app.getElementsByClassName("balao")[0];
    if(b&&b.parentNode) b.parentNode.insertBefore(d,b.nextSibling);
    else (app.querySelector(".centro")||app).appendChild(d);
  } d.innerHTML=txt;}
function mostraBanner(msg,cb){bmsg.innerHTML=msg;banner.className="banner show";festa();
  bcta.onclick=function(){banner.className="banner";if(cb)cb();};}
function baguncar(a){var i,j,x;for(i=a.length-1;i>0;i--){j=Math.floor(Math.random()*(i+1));x=a[i];a[i]=a[j];a[j]=x;}return a;}
/* som: os numeros vieram da pesquisa (PESQUISA-SOM-E-GAMEFEEL). "ding" e
   sintetizado — MP3 chega atrasado e mata a sensacao de causa-efeito. */
var AC=null;
function ac(){try{if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();
  if(AC.state==="suspended")AC.resume();}catch(e){}return AC;}
function nota(f,dur,vol,tipo,atraso){var c=ac();if(!c)return;
  var o=c.createOscillator(),g=c.createGain(),t=c.currentTime+(atraso||0);
  o.type=tipo||"triangle";o.frequency.value=f;
  g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol||.18,t+.014);
  g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(g);g.connect(c.destination);o.start(t);o.stop(t+dur+.02);}
function sCerto(){nota(523.25,.35,.18,"triangle",0);nota(659.25,.35,.16,"triangle",.055);nota(783.99,.35,.15,"triangle",.11);}
function sErro(){nota(300,.14,.12,"sine",0);nota(318,.14,.12,"sine",0);}
function sTap(){nota(880,.012,.10,"square",0);}
function festa(){sCerto();}
document.addEventListener("pointerdown",function(){ac();},false);
</script>
<script>
/* ====== A PEÇA COMEÇA AQUI ====== */

/* ---------------------------------------------------------------
   1) O BANCO DE FIGURAS. Cada uma tem NOME (o gemeo escrito, que faz a
      peca funcionar no mudo) e um desenho de CSS.
   --------------------------------------------------------------- */
/* ⚠️⚠️ LICAO PAGA (ago/2026), e das que so aparecem JOGANDO: este catalogo
   chamava-se `FIG`, e `FIG` esta na lista de nomes que o integrador considera
   CONFIGURACAO, nao conteudo. Resultado: em `pecas.json` esta peca aparecia com
   uma gaveta so (`RODADAS`), como se aceitasse qualquer palavra — e nao aceita:
   ela so conhece as oito figuras desenhadas em CSS aqui embaixo. Montei uma
   atividade de padaria com `opcoes:["pd_pao",...]` e a crianca travou na
   terceira tela com "Cannot read properties of undefined (reading 'letra')".
   Agora o catalogo TEM nome de conteudo e entra no conteudo.json. */
/* a figura de verdade vem do MOTOR; aqui na bancada ela nao existe e a peca
   mostra o nome escrito. Pegar por `window.imgEl` deixa o nome DECLARADO, e o
   portao "funcao que nao existe" consegue medir. */
var imgEl = window.imgEl || null;

var CATALOGO={
 sol:   {nome:"SOL",    voz:"sol"},
 casa:  {nome:"CASA",   voz:"casa"},
 bola:  {nome:"BOLA",   voz:"bola"},
 peixe: {nome:"PEIXE",  voz:"peixe"},
 arvore:{nome:"&#193;RVORE", voz:"árvore", letra:"A"},
 flor:  {nome:"FLOR",   voz:"flor"},
 chave: {nome:"CHAVE",  voz:"chave"},
 lua:   {nome:"LUA",    voz:"lua"},
 /* ⭐ os dois campos que abrem a peca para conteudo novo (ver `desenho`):
    `img` = arte de IA (o normal numa atividade de verdade) e
    `texto` = a propria LETRA em corpo grande (fases de alfabeto).
    Ficam no exemplo de proposito: e daqui que o montador aprende que a peca
    LE esses campos. */
 pao:   {nome:"P&#195;O", voz:"pão", img:"pd_pao", letra:"P"},
 be:    {nome:"B", voz:"bê", texto:"B", letra:"B"}
};

/* ---------------------------------------------------------------
   2) AS RODADAS. SEMPRE 3 DISTRATORES: com 2 a crianca elimina tudo antes
      do 3o erro (o degrau "revelar" nunca acontece) e com 5 o andaime
      nunca chega nela.
      A escada:  palavra inteira -> palavra inteira com duas figuras da
      mesma familia (arvore/flor) -> o SOM DO COMECO, que e simbolico.
   --------------------------------------------------------------- */
var RODADAS=[
 {selo:"OU&Ccedil;A E ACHE", alvo:"sol", opcoes:["sol","casa","bola","peixe"],
  rotulo:"A PALAVRA &Eacute;", escrito:"SOL", fala:"sol",
  enun:"Ou&#231;a a palavra e toque na <b>figura</b> dela.",
  hint:"Sem som no computador? A palavra est&#225; escrita a&#237; em cima.",
  msg:"Isso! O <b>SOL</b> &#233; este.",
  dicas:["Aperte <b>Ouvir</b> de novo e diga a palavra junto, bem devagar.",
         "Olhe a <b>letra do come&#231;o</b> de cada nome. A palavra come&#231;a com <b>S</b>.",
         "Esta &#233; a figura da palavra <b>SOL</b>: o sol tem raios em volta."]},

 {selo:"OU&Ccedil;A COM CUIDADO", alvo:"arvore", opcoes:["arvore","flor","casa","chave"],
  rotulo:"A PALAVRA &Eacute;", escrito:"&#193;RVORE", fala:"árvore",
  enun:"Agora tem <b>duas</b> figuras do mesmo jardim. Ou&#231;a at&#233; o fim.",
  hint:"&#193;rvore e flor s&#227;o as duas do jardim: o que muda &#233; a palavra.",
  msg:"Isso! <b>&#193;RVORE</b> tem tronco e copa.",
  dicas:["Ou&#231;a de novo at&#233; o <b>fim</b> da palavra: flor acaba r&#225;pido, &#225;rvore &#233; comprida.",
         "A letra do come&#231;o est&#225; em cada figura. A palavra come&#231;a com <b>A</b>.",
         "Esta &#233; a <b>&#193;RVORE</b>: come&#231;a com A e tem tr&#234;s peda&#231;os: &#225;r-vo-re."]},

 {selo:"O SOM DO COME&Ccedil;O", alvo:"flor", opcoes:["flor","peixe","lua","bola"],
  rotulo:"O SOM DO COME&Ccedil;O &Eacute;", escrito:"F", fala:"efe. fffff",
  enun:"Qual figura <b>come&#231;a</b> com este som?",
  hint:"Diga o nome de cada figura em voz alta e escute s&#243; o come&#231;o.",
  msg:"Isso! <b>FLOR</b> come&#231;a com F: fff-lor.",
  dicas:["Diga o nome de cada figura e pare no <b>primeiro pedacinho</b>: fff, ppp, lll, bbb.",
         "A letra do come&#231;o de cada nome apareceu no canto. Procure o <b>F</b>.",
         "<b>FLOR</b> come&#231;a com o som <b>fff</b>. F de flor, de fada, de faca."]}
];

var rodada=0, R=null, erros=0, travada=false, revelando=false;
var ger=0, progVisto=0, acertosDePrimeira=0;
var elAviso=null, elCont=null, progI=null, cartoes=[];

/* A VOZ. Aqui e `speechSynthesis` so para PROVAR o contrato — se o PC nao tiver
   voz, a peca continua inteira, porque tudo que a voz diz esta escrito na tela.
   NA ATIVIDADE DE VERDADE esta linha vira `falaDaTela("<id da fala>")`, e o
   alto-falante de cada resposta vira `op_<chave>.mp3` + `VOZOK`. */
function diz(txt){
  try{
    if(!window.speechSynthesis||!window.SpeechSynthesisUtterance) return;
    var u=new SpeechSynthesisUtterance(txt);
    u.lang="pt-BR"; u.rate=.9; u.pitch=1.05;
    window.speechSynthesis.cancel();
    window.speechSynthesis.speak(u);
  }catch(e){}
}
function sVolta(){ nota(392,.10,.11,"sine",0); nota(294,.12,.10,"sine",.08); }
function sPing(){ nota(880,.09,.12,"triangle",0); }

/* ---------------------------------------------------------------
   3) OS DESENHOS — CSS puro, nenhum arquivo externo
   --------------------------------------------------------------- */
function desenho(k){
  var d=el("div","des",""), i, e;
  var F=CATALOGO[k]||{};
  /* ⭐ TRES CAMINHOS, nesta ordem:
     · `img`   — arte de IA (o normal numa atividade de verdade);
     · `texto` — a propria LETRA em corpo grande (fases de alfabeto);
     · senao   — o desenho de CSS das oito figuras de exemplo desta peca. */
  if(F.img){
    if(imgEl){ d.appendChild(imgEl(F.img)); return d; }
    d.appendChild(el("div","destxt", F.nome||k)); return d;
  }
  if(F.texto){ d.appendChild(el("div","destxt", F.texto)); return d; }
  if(k==="sol"){
    for(i=0;i<8;i++){
      e=el("i","solr","");
      e.style.webkitTransform="rotate("+(i*45)+"deg)";
      e.style.transform="rotate("+(i*45)+"deg)";
      d.appendChild(e);
    }
    d.appendChild(el("i","solc",""));
  }else if(k==="casa"){
    d.appendChild(el("i","ctel","")); d.appendChild(el("i","cpar","")); d.appendChild(el("i","cpor",""));
  }else if(k==="bola"){
    e=el("i","bcir","");
    e.appendChild(el("i","bfai","")); e.appendChild(el("i","bfa2",""));
    e.appendChild(el("i","bcu1","")); e.appendChild(el("i","bcu2",""));
    d.appendChild(e);
  }else if(k==="peixe"){
    d.appendChild(el("i","prab","")); d.appendChild(el("i","pcor","")); d.appendChild(el("i","polh",""));
  }else if(k==="arvore"){
    d.appendChild(el("i","atro","")); d.appendChild(el("i","acop",""));
  }else if(k==="flor"){
    d.appendChild(el("i","fcau",""));
    for(i=0;i<5;i++){
      e=el("i","fpet","");
      e.style.webkitTransform="rotate("+(i*72)+"deg)";
      e.style.transform="rotate("+(i*72)+"deg)";
      d.appendChild(e);
    }
    d.appendChild(el("i","fmio",""));
  }else if(k==="chave"){
    d.appendChild(el("i","kcab","")); d.appendChild(el("i","khas",""));
    e=el("i","kden",""); e.style.left="40px"; d.appendChild(e);
    e=el("i","kden",""); e.style.left="50px"; d.appendChild(e);
  }else{
    d.appendChild(el("i","lua",""));
  }
  return d;
}
/* a letra do comeco, para o 2o degrau do andaime. Tira o acento (o &Aacute; da
   ARVORE) porque o que a crianca compara e a LETRA, nao o acento. */
function letraDe(k){ return CATALOGO[k].letra || CATALOGO[k].nome.charAt(0); }

/* ---------------------------------------------------------------
   4) A TELA
   --------------------------------------------------------------- */
function pecaOuvir(){
  limpa();
  R=RODADAS[rodada];
  erros=0; travada=false; revelando=false; cartoes=[]; ger++;
  var t=el("div","tela");
  setProg(t,progVisto);
  progI=t.querySelector(".prog i");
  var c=el("div","centro");
  c.appendChild(el("div","selo",R.selo));
  c.appendChild(el("div","balao",R.enun));

  /* A CAIXA DE SOM: botao de ouvir + a palavra ESCRITA (o gemeo visual) */
  var sc=el("div","somcard","");
  var bo=el("button","obt","");
  bo.appendChild(el("i","fone",""));
  bo.appendChild(document.createTextNode("Ouvir"));
  bo.onclick=function(){ tocaAlvo(); };
  sc.appendChild(bo);
  var pb=el("div","palvbox","");
  pb.appendChild(el("div","palvr",R.rotulo));
  pb.appendChild(el("div","palv",R.escrito));
  sc.appendChild(pb);
  c.appendChild(sc);

  /* AS FIGURAS, embaralhadas (na Fabrica de Estrelas a certa era sempre a 1a e
     a crianca aprendeu a POSICAO, nao o conteudo) */
  var box=el("div","opts",""), lista=baguncar(R.opcoes.slice(0)), i;
  for(i=0;i<lista.length;i++) box.appendChild(cartao(lista[i]));
  c.appendChild(box);

  elCont=el("div","cont","Figura <b>"+(rodada+1)+"</b> de <b>"+RODADAS.length+"</b>");
  c.appendChild(elCont);
  elAviso=el("div","aviso","");
  c.appendChild(elAviso);
  c.appendChild(el("div","hint",R.hint));
  t.appendChild(c);
  app.appendChild(t);
  /* na atividade de verdade: falaDaTela("<id>") + depoisDaFala para tocar a
     palavra logo depois do enunciado. */
  diz(R.enun.replace(/<[^>]+>/g,""));
  var g=ger;
  setTimeout(function(){ if(g===ger) tocaAlvo(); },1500);
}

function cartao(k){
  /* ⚠️ a classe sai em DUAS partes de proposito. O portao `_qa/dinamicas.py`
     reconhece a familia "escolher" pelo literal `el("div","opt"` — escrito
     `el("div","opt fig")` ele nao reconhece nada, e "0 dinamica reconhecida" e
     aprovacao VAZIA: o portao passa sem ter medido a armadilha desta mecanica
     (as opcoes embaralhadas). Esta peca E um escolher, entao ela se apresenta
     como um. */
  var o=el("div","opt","");
  o.className="opt oaf";
  o.appendChild(el("div","ini",letraDe(k)));
  /* ⭐ a MOLDURA: e ela que da o acabamento e impede a figura de vazar */
  o.appendChild(desenho(k));
  var lin=el("div","linha","");
  lin.appendChild(el("span","nom",CATALOGO[k].nome));
  var z=el("button","zap","");
  z.appendChild(el("i","fone",""));
  z.setAttribute("aria-label","Ouvir "+CATALOGO[k].nome);
  /* ⚠️ o alto-falante NAO escolhe: ele so fala. Sem parar o evento aqui, tocar
     no alto-falante valia como resposta — e a crianca que so queria conferir o
     nome levava um erro. */
  z.onclick=function(ev){
    var e=ev||window.event;
    if(e.stopPropagation) e.stopPropagation(); else e.cancelBubble=true;
    sPing(); diz(CATALOGO[k].voz);
  };
  lin.appendChild(z);
  o.appendChild(lin);
  o.appendChild(el("div","jat","j&#225; tentamos"));
  o.setAttribute("data-qa", k===R.alvo ? "1" : "0");
  o.onclick=function(){ escolhe(k,o); };
  cartoes.push({k:k,el:o,tentada:false});
  return o;
}
function achaCartao(k){ var i; for(i=0;i<cartoes.length;i++){ if(cartoes[i].k===k) return cartoes[i]; } return null; }

function tocaAlvo(){
  sPing();
  diz(R.fala);
}

/* ---------------------------------------------------------------
   5) A ESCOLHA
   --------------------------------------------------------------- */
function escolhe(k,o){
  if(travada||revelando) return;
  var c=achaCartao(k);
  if(c&&c.tentada){
    /* ⚠️ opcao ja tentada nao responde com SILENCIO nem se distingue so pela
       cor: som de retorno + a etiqueta em palavras que ja esta na tela. */
    sVolta();
    mostraDica("Nesta a gente <b>j&#225; tentou</b>. Escute de novo e escolha outra figura.");
    return;
  }
  if(k===R.alvo){ acertou(o); return; }
  errouUma(c,o);
}
function acertou(o){
  travada=true;                     /* ⚠️ trava NO INSTANTE do toque */
  if(erros===0) acertosDePrimeira++;
  /* ⚠️⚠️ LICAO PAGA (ago/2026), e o Marcos viu no celular: aqui estava
     `o.className="opt fig certa"` — uma ATRIBUICAO, que APAGA as outras classes.
     A classe `oaf` (o cartao de vidro fosco) ia embora junto, e o cartao certo
     perdia a moldura da casa bem no momento em que a crianca olha para ele.
     Classe de ESTADO se ACRESCENTA; nunca se troca o crachá inteiro. */
  if(o.className.indexOf("certa")<0) o.className=o.className+" certa ok";
  sCerto();
  /* ⭐ A COMEMORACAO, que o Marcos cobrou: *"nao tem a comemoracao quando acerta
     como no Broto"*. Antes era so um texto verde. Agora o cartao PULA, a festa
     toca e o restante da tela recua — a crianca sabe que acertou sem ler. */
  chuvinha(o);
  if(elAviso){ elAviso.innerHTML=R.msg; elAviso.className="aviso ver"; }
  diz(R.msg.replace(/<[^>]+>/g,""));
  /* ⭐ E O BOTAO PROXIMO, como no Broto: *"tem que ter o botao de proximo"*.
     Quem manda no ritmo e a crianca, nao um relogio de 1,6s — ela quer olhar a
     figura certa, ouvir de novo, e so entao seguir. */
  poeProximo();
}

/* faisquinhas em volta do cartao certo — CSS puro, sem imagem e sem biblioteca,
   e some sozinha. Respeita quem pediu menos animacao. */
function chuvinha(o){
  try{
    if(window.matchMedia&&window.matchMedia("(prefers-reduced-motion:reduce)").matches) return;
    var i,r=o.getBoundingClientRect();
    for(i=0;i<10;i++){
      var f=document.createElement("span");
      f.className="oafaisca";
      f.style.left=(r.left+r.width*(0.15+Math.random()*0.7))+"px";
      f.style.top=(r.top+r.height*(0.2+Math.random()*0.6))+"px";
      f.style.background=["#ffd23f","#7ed957","#ff9f45","#fff"][i%4];
      f.style.webkitAnimationDelay=(i*40)+"ms";
      f.style.animationDelay=(i*40)+"ms";
      document.body.appendChild(f);
      (function(el){ setTimeout(function(){ if(el.parentNode) el.parentNode.removeChild(el); },1100); })(f);
    }
  }catch(e){}
}

function poeProximo(){
  var alvo=document.getElementById("navOA");
  if(!alvo){
    alvo=el("div",""); alvo.id="navOA";
    /* ⚠️ o Proximo entra LOGO DEPOIS do "Isso! ..." — nao no fim da tela. No
       fim ele caia atras da barra fixa de baixo (visto na foto do celular), e
       botao que a crianca nao alcanca e botao que nao existe. Aqui ele nasce
       na altura em que o olho dela ja esta: no elogio do acerto. */
    if(elAviso&&elAviso.parentNode) elAviso.parentNode.insertBefore(alvo, elAviso.nextSibling);
    else (app.querySelector(".centro")||app).appendChild(alvo);
  }
  alvo.innerHTML="";
  var b=document.createElement("button");
  b.className="oaprox"; b.type="button"; b.innerHTML="Pr&#243;ximo &#8594;";
  /* ⚠️ LICAO PAGA (ago/2026): botao NOVO nasce com `data-qa`, no MESMO commit.
     Sem isto o auditor nao sabe que ele existe: os robos so tocam no que
     casa com a lista deles (`.opt`, `.btn`, `[data-qa]`...). O errador ficou
     preso nesta tela e reprovou a peca dizendo "nao chega na medalha" — e a
     peca estava certa; quem estava cego era o portao. */
  b.setAttribute("data-qa","prox");
  b.onclick=function(){ if(alvo.parentNode) alvo.innerHTML=""; segue(0); };
  alvo.appendChild(b);
  try{ b.focus(); }catch(e){}
}
function errouUma(c,o){
  if(c){ c.tentada=true; }
  o.className="opt fig usada";
  var j=o.getElementsByClassName("jat")[0];
  if(j) j.className="jat ver";
  o.setAttribute("data-qa","2");
  erros++;
  sErro();
  ajuda(erros);
}

/* ---------------------------------------------------------------
   6) O ANDAIME QUE CRESCE (1 metodo, 2 apoio concreto, 3 revela)
   --------------------------------------------------------------- */
function ajuda(n){
  var p=n%3;
  if(p===1){
    mostraDica(R.dicas[0]);
    diz(R.dicas[0].replace(/<[^>]+>/g,""));
  }else if(p===2){
    mostraDica(R.dicas[1]);
    diz(R.dicas[1].replace(/<[^>]+>/g,""));
    mostraIniciais();
  }else{
    revela();
  }
}
/* APOIO CONCRETO: a letra do comeco aparece em cada figura. Nao e a resposta —
   e a ferramenta com que se acha a resposta. */
function mostraIniciais(){
  var i,e;
  for(i=0;i<cartoes.length;i++){
    e=cartoes[i].el.getElementsByClassName("ini")[0];
    if(e) e.className="ini ver";
  }
}
/* ⚠️ O 3o DEGRAU: acende a certa PRIMEIRO e escreve a explicacao DEPOIS. Nas
   cinco pecas de ago/2026 o "revelar" chamava o "acertou", e o "acertou"
   apagava a barra de dica no mesmo quadro: a peca se consertava sozinha e a
   crianca nunca lia por que. Aqui a dica fica 2,2s de pe antes de a tela virar. */
function revela(){
  if(revelando) return;
  revelando=true; travada=true;
  var g=ger, c=achaCartao(R.alvo);
  if(c){ c.el.className="opt fig certa"; }
  mostraIniciais();
  sPing(); sCerto();
  mostraDica(R.dicas[2]);
  diz(R.dicas[2].replace(/<[^>]+>/g,""));
  if(elAviso){ elAviso.innerHTML=R.msg; elAviso.className="aviso ver"; }
  setTimeout(function(){
    if(g!==ger) return;
    revelando=false;
    segue(0);
  },2200);
}

/* ---------------------------------------------------------------
   7) O QUE VEM DEPOIS
   --------------------------------------------------------------- */
function segue(espera){
  var g=ger;
  travada=true;
  progVisto=Math.round((rodada+1)*100/RODADAS.length);
  if(progI) progI.style.width=progVisto+"%";
  setTimeout(function(){
    if(g!==ger) return;
    rodada++;
    if(rodada<RODADAS.length){ pecaOuvir(); return; }
    mostraBanner("<b>Voc&#234; achou as tr&#234;s pelo som!</b><br>Ouvir com cuidado &#233; o "+
                 "come&#231;o de ler.", fimOuvir);
  }, espera||600);
}

/* ---------------------------------------------------------------
   8) A MEDALHA. Parecer em palavras, nunca nota.
   --------------------------------------------------------------- */
function fimOuvir(){
  limpa();
  ger++; travada=true;
  var t=el("div","tela");
  setProg(t,100);
  var c=el("div","centro");
  c.appendChild(el("div","selo","PE&Ccedil;A FECHADA"));
  c.appendChild(el("div","medal",""));
  var parecer;
  if(acertosDePrimeira>=3) parecer="Voc&#234; achou as <b>3</b> de primeira, s&#243; escutando. "+
                                   "Seu ouvido est&#225; afiado!";
  else if(acertosDePrimeira===2) parecer="Voc&#234; achou <b>2</b> de primeira. Na outra, escutar de "+
                                          "novo resolveu &#8212; e isso tamb&#233;m &#233; saber ouvir.";
  else if(acertosDePrimeira===1) parecer="Voc&#234; achou <b>1</b> de primeira e foi at&#233; o fim nas "+
                                          "outras. Ouvir com cuidado se aprende ouvindo de novo.";
  else parecer="Voc&#234; foi at&#233; o fim das <b>3</b>, escutando de novo cada vez. &#201; "+
               "exatamente assim que o ouvido aprende.";
  c.appendChild(el("div","balao",parecer));
  var b=el("button","btn","Ouvir de novo tudo");
  b.onclick=function(){ rodada=0; progVisto=0; acertosDePrimeira=0; pecaOuvir(); };
  c.appendChild(b);
  c.appendChild(el("div","hint","Na atividade de verdade a voz &#233; MP3 gravado, e cada "+
                   "figura tem o alto-falante dela."));
  t.appendChild(c);
  app.appendChild(t);
  diz("Peça fechada!");
}

pecaOuvir();
</script>
