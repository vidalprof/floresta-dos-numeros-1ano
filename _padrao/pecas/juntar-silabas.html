<title>PEÇA — juntar sílabas</title>
<!-- ============================================================
     PEÇA: JUNTAR AS SÍLABAS — as partes DESLIZAM e viram uma palavra só.
     (copiada do _padrao/pecas/MOLDE.html; só o bloco "A PEÇA COMEÇA AQUI" muda)

     PARA QUEM É: 1º ano (e pré). A criança NÃO LÊ: alvo de dedo grande, uma
     linha de enunciado, figura em vez de palavra escrita, e tudo falado.

     POR QUE ELA EXISTE — e por que não é "montar a palavra com letras":
     juntar sílabas (BO + LO = BOLO) é o degrau que abre a leitura, e é outro
     gesto. A Ilha das Letras (1º ano, já no ar) monta a palavra LETRA POR
     LETRA; nenhuma das 74 peças da oficina juntava SÍLABAS.

     ⭐ O QUE A PESQUISA MANDOU (Reading Rockets, ago/2026 — ver
        `_pesquisa/REGRAS-INTERATIVIDADE.md`):
       · **som CONTÍNUO, não picado.** O estudo citado — *"Connected Phonation
         Is More Effective than Segmented Phonation for Teaching Beginning
         Readers to Decode Unfamiliar Words"* — mostra que "ssssuuunnn" ensina
         mais que "s‑u‑n". Aqui: cada sílaba é dita ao ser posta, mas ao fechar
         a palavra ela é dita **inteira e de uma vez**, nunca em duas batidas.
       · **a metáfora é o ESCORREGADOR:** *"have the sounds slide together to
         form a word"*. Por isso a peça não "encaixa": ela **DESLIZA** — a
         sílaba escolhida corre até a forma, e é essa corrida que ensina.
       · **começar pela unidade grande e descer** (frase → palavra → sílaba →
         fonema): no 1º ano a sílaba é o degrau certo, o fonema vem depois.
       · **figura em vez de palavra escrita** para os menores.

     AS ARMADILHAS QUE ESTA PEÇA FECHA:
       · a ordem importa e é a primeira coisa que se erra: a peça sempre
         embaralha as sílabas na bandeja, então nunca dá para acertar pela
         POSIÇÃO (é o mesmo defeito da Fábrica de Estrelas, onde a certa era
         sempre a primeira);
       · erro NÃO pune: a sílaba volta deslizando, com som de retorno (não de
         tropeço) — o gesto está em treino;
       · o andaime CRESCE: 1 erro → a dica; 2 erros → a sílaba certa PULSA;
         3 erros → ela acende e fica sendo a única que responde. Nunca trava;
       · `data-qa="1"` na sílaba que serve AGORA — é assim que o auditor-jogador
         atravessa (e é só para ele);
       · nada essencial só na cor: a sílaba certa PULSA e ganha a marca escrita.
     ES5 puro, um arquivo só, sem biblioteca (Chrome 109 / Firefox 106).
     ============================================================ -->
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:"Segoe UI",Arial,sans-serif;background:#2b2118;color:#f4efe6}
#app{max-width:520px;margin:0 auto;padding:10px 12px 28px}
.prog{height:9px;background:rgba(255,255,255,.16);border-radius:9px;overflow:hidden;margin:6px 0 12px}
.prog i{display:block;height:100%;background:#59c24b;width:0;-webkit-transition:width .5s;transition:width .5s}
.selo{display:inline-block;background:#3c6ee0;color:#fff;font-weight:700;font-size:13px;
      letter-spacing:.4px;padding:6px 14px;border-radius:20px;margin:0 auto 10px;display:block;
      width:-webkit-fit-content;width:fit-content}
.balao{position:relative;background:rgba(255,253,246,.96);color:#221a12;border-radius:20px;
       padding:13px 17px;font-size:17px;font-weight:600;text-align:center;line-height:1.35;
       box-shadow:0 5px 16px rgba(0,0,0,.28)}
.balao b{color:#1f6b12}
.balao + *{margin-top:13px}
.centro{text-align:center}
.opts{display:block}
.opt{display:block;background:#fffdf6;color:#221a12;border:0;border-radius:16px;padding:13px 16px;
     margin:9px auto;font-size:16px;font-weight:600;min-height:48px;max-width:430px;cursor:pointer;
     box-shadow:0 4px 0 #c9bda6}
.opt:active{-webkit-transform:translateY(3px);transform:translateY(3px);box-shadow:0 1px 0 #c9bda6}
.opt.ok{background:#d6f5c8;box-shadow:0 4px 0 #7cb464}

      font-size:15px;font-weight:600}
.tela{display:block}
/* ⚠️ o banner escondido nao pode contar como "resposta fora da tela": ele nao
   existe para a crianca ainda. `visibility` tira do alcance do dedo e do
   leitor de tela — so `bottom:-260px` deixava o botao clicavel no escuro. */
.banner{position:fixed;left:0;right:0;bottom:-260px;background:#1f6b12;color:#fff;text-align:center;
        padding:18px 16px 22px;border-radius:22px 22px 0 0;visibility:hidden;
        -webkit-transition:bottom .35s;transition:bottom .35s}
.banner.show{bottom:0;visibility:visible}
.btn{background:#ffd54a;color:#33280a;border:0;border-radius:16px;padding:13px 26px;font-size:17px;
     font-weight:800;min-height:48px;cursor:pointer;box-shadow:0 4px 0 #c9a52f}

/* ====== CSS DESTA PEÇA ====== */
/* a FORMA onde a palavra se monta: uma bandeja de padaria com os lugares */
.jsForma{display:-webkit-box;display:flex;-webkit-box-pack:center;justify-content:center;
  gap:8px;margin:14px auto 6px;max-width:430px;min-height:96px;-webkit-box-align:center;align-items:center}
.jsVaga{width:104px;height:88px;border-radius:18px;border:3px dashed rgba(255,255,255,.45);
  display:-webkit-box;display:flex;-webkit-box-align:center;align-items:center;
  -webkit-box-pack:center;justify-content:center;font-size:30px;font-weight:800;color:#f4efe6;
  background:rgba(255,255,255,.06)}
.jsVaga.cheia{border-style:solid;border-color:#e8b761;background:#f6d79a;color:#4a3608;
  -webkit-box-shadow:0 5px 0 #c99b45;box-shadow:0 5px 0 #c99b45}
.jsVaga.agora{border-color:#ffd54a}
/* a BANDEJA de sílabas: os pedaços de massa que a criança escolhe */
.jsMassa{display:-webkit-box;display:flex;-webkit-box-pack:center;justify-content:center;
  -webkit-flex-wrap:wrap;flex-wrap:wrap;gap:10px;margin:12px auto 0;max-width:430px}
.jsSil{min-width:104px;min-height:72px;border-radius:18px;background:#fffdf6;color:#221a12;
  font-size:28px;font-weight:800;cursor:pointer;border:0;padding:8px 14px;
  display:-webkit-box;display:flex;-webkit-box-align:center;align-items:center;
  -webkit-box-pack:center;justify-content:center;
  -webkit-box-shadow:0 5px 0 #c9bda6;box-shadow:0 5px 0 #c9bda6;
  -webkit-transition:-webkit-transform .38s cubic-bezier(.3,1.2,.5,1),opacity .3s;
  transition:transform .38s cubic-bezier(.3,1.2,.5,1),opacity .3s}
.jsSil:active{-webkit-transform:translateY(3px);transform:translateY(3px)}
.jsSil.usada{opacity:0;pointer-events:none}
/* ⭐ O DESLIZE: a pesquisa pede que as partes ESCORREGUEM uma até a outra.
   A sílaba escolhida corre da bandeja até a forma — e e essa corrida que
   ensina que duas coisas viram UMA. Sem ela isto seria só um encaixe. */
.jsSil.desliza{-webkit-transform:translate(var(--dx),var(--dy)) scale(.92);
  transform:translate(var(--dx),var(--dy)) scale(.92)}
.jsSil.pulsa{-webkit-animation:jsPul 1s infinite;animation:jsPul 1s infinite}
.jsSil.acesa{-webkit-box-shadow:0 0 0 4px #ffd54a,0 5px 0 #c9bda6;
  box-shadow:0 0 0 4px #ffd54a,0 5px 0 #c9bda6}
@-webkit-keyframes jsPul{0%,100%{-webkit-transform:scale(1)}50%{-webkit-transform:scale(1.09)}}
@keyframes jsPul{0%,100%{transform:scale(1)}50%{transform:scale(1.09)}}
/* a marca escrita: nada essencial só na cor (serve no mudo e para quem não
   distingue verde de vermelho) */
.jsMarca{display:inline-block;background:#1f6b12;color:#fff;font-size:12px;font-weight:800;
  border-radius:9px;padding:2px 8px;margin-left:7px;vertical-align:middle}
/* a figura da palavra: é ela que diz QUAL palavra montar (a criança não lê) */
.jsFig{width:150px;height:150px;margin:13px auto 0;border-radius:22px;background:rgba(255,248,232,.55);-webkit-backdrop-filter:blur(6px) saturate(1.05);backdrop-filter:blur(6px) saturate(1.05);border:2px solid rgba(255,255,255,.78);border-bottom-width:5px;-webkit-box-shadow:0 8px 18px rgba(40,25,10,.28);box-shadow:0 8px 18px rgba(40,25,10,.28);
  display:-webkit-box;display:flex;-webkit-box-align:center;align-items:center;
  -webkit-box-pack:center;justify-content:center;overflow:hidden}
.jsFig img{width:100%;height:100%;object-fit:contain}
/* ⚠️ LICAO PAGA (ago/2026): a palavra de reserva (quando a fase nao traz
   figura) era #6b5c46 sobre o fundo claro da caixa — 2,22:1, quando o
   minimo e 4,5. E o pior: e JUSTAMENTE o caso em que a palavra e a unica
   coisa na tela, porque a figura faltou. Escurecida ate passar. */
.jsFig .semfig{font-size:15px;color:#2f2718;padding:8px;text-align:center;font-weight:800;letter-spacing:.5px}
.jsPronta{font-size:34px;font-weight:800;color:#ffd54a;margin-top:8px;letter-spacing:2px}
.medal{width:104px;height:104px;margin:2px auto 12px;border-radius:50%;background:#f6c23a;
  border:6px solid #fff3c9;box-shadow:0 6px 16px rgba(0,0,0,.35);color:#4a3608;
  font-size:44px;line-height:92px;text-align:center;font-weight:800}
.medal:before{content:"\2605"}

<div id="app"></div>
<div id="banner" class="banner"><div id="bmsg"></div><button id="bcta" class="btn" style="margin-top:12px">Continuar</button></div>
<script>
/* ====== MOTORZINHO DA PEÇA (os mesmos nomes das atividades) ====== */
var app=document.getElementById("app"), banner=document.getElementById("banner"),
    bmsg=document.getElementById("bmsg"), bcta=document.getElementById("bcta");
function el(t,c,h){var e=document.createElement(t);if(c)e.className=c;if(h!==undefined&&h!==null)e.innerHTML=h;return e;}
function limpa(){app.innerHTML="";}
function setProg(t,p){var pr=el("div","prog");var i=el("i");i.style.width=p+"%";pr.appendChild(i);t.appendChild(pr);}
/* ⚠️ A DICA TEM QUE CABER NA TELA (ago/2026). Ela era o ULTIMO filho do
   `.centro`, e em janela apertada (320x568 e 1024x420 — o monitor da escola)
   caia 25 a 96 px ABAIXO DA DOBRA: a crianca que errou precisava ROLAR para ler
   a ajuda, justo no momento em que esta perdida. Agora ela entra LOGO DEPOIS do
   enunciado, que e onde o olho ja esta. Defeito estrutural: valia para as 57
   pecas de uma vez. */
function mostraDica(txt){var d=document.getElementById("dicaP");
  if(!d){ d=el("div","dica"); d.id="dicaP";
    var b=app.getElementsByClassName("balao")[0];
    if(b&&b.parentNode) b.parentNode.insertBefore(d,b.nextSibling);
    else (app.querySelector(".centro")||app).appendChild(d);
  } d.innerHTML=txt;}
function mostraBanner(msg,cb){bmsg.innerHTML=msg;banner.className="banner show";festa();
  bcta.onclick=function(){banner.className="banner";if(cb)cb();};}
function baguncar(a){var i,j,x;for(i=a.length-1;i>0;i--){j=Math.floor(Math.random()*(i+1));x=a[i];a[i]=a[j];a[j]=x;}return a;}
/* som: os numeros vieram da pesquisa (PESQUISA-SOM-E-GAMEFEEL). "ding" e
   sintetizado — MP3 chega atrasado e mata a sensacao de causa-efeito. */
var AC=null;
function ac(){try{if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();
  if(AC.state==="suspended")AC.resume();}catch(e){}return AC;}
function nota(f,dur,vol,tipo,atraso){var c=ac();if(!c)return;
  var o=c.createOscillator(),g=c.createGain(),t=c.currentTime+(atraso||0);
  o.type=tipo||"triangle";o.frequency.value=f;
  g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol||.18,t+.014);
  g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(g);g.connect(c.destination);o.start(t);o.stop(t+dur+.02);}
function sCerto(){nota(523.25,.35,.18,"triangle",0);nota(659.25,.35,.16,"triangle",.055);nota(783.99,.35,.15,"triangle",.11);}
function sErro(){nota(300,.14,.12,"sine",0);nota(318,.14,.12,"sine",0);}
function sTap(){nota(880,.012,.10,"square",0);}
function festa(){sCerto();}
document.addEventListener("pointerdown",function(){ac();},false);
</script>
<script>
/* ====== A PEÇA COMEÇA AQUI ====== */

/* O CONTEÚDO É SÓ EXEMPLO (padaria, 1º ano). Ao copiar a peça para uma
   atividade, troque APENAS este bloco de dados.
   · pal   — a palavra inteira (é ela que a voz diz de UMA VEZ no fim)
   · sil   — as sílabas NA ORDEM certa
   · fig   — o nome da figura (img/<fig>.png). A criança não lê: é a figura
             que diz qual palavra montar
   · iscas — sílabas erradas que entram na bandeja junto (2 bastam no 1º ano)
   · d     — os TRÊS degraus do andaime: dica -> apoio concreto -> revela   */
var SILABAS=[
 {pal:"BOLO", sil:["BO","LO"], fig:"pd_bolo", iscas:["MA","PE"],
  d:["Diga a palavra devagar: qual pedaço a boca fala PRIMEIRO?",
     "A palavra começa com o som <b>BO</b>. Ele está pulsando aí embaixo.",
     "É o <b>BO</b>. Ele está aceso: toque nele para seguir."]},
 {pal:"MALA", sil:["MA","LA"], fig:"pd_mala", iscas:["BO","TE"],
  d:["Fale a palavra bem devagar e escute o começo.",
     "O primeiro pedaço é <b>MA</b>, como em MÃE.",
     "É o <b>MA</b>. Ele está aceso: toque nele para seguir."]},
 {pal:"PATO", sil:["PA","TO"], fig:"pd_pato", iscas:["LO","SA"],
  d:["Ponha a mão no queixo e diga: PA-TO. Qual vem primeiro?",
     "O primeiro pedaço é <b>PA</b>, o mesmo de PAI.",
     "É o <b>PA</b>. Ele está aceso: toque nele para seguir."]},
 {pal:"SAPATO", sil:["SA","PA","TO"], fig:"pd_sapato", iscas:["MA","LO"],
  d:["Esta tem TRÊS pedaços. Diga devagar: SA-PA-TO.",
     "Comece pelo <b>SA</b>, que é o som que abre a palavra.",
     "É o <b>SA</b>. Ele está aceso: toque nele para seguir."]}
];

var ri=0;        /* rodada de agora */
var posto=0;     /* quantas sílabas já estão na forma */
var err=0;       /* erros DESTA rodada (o andaime cresce com ele) */
var ger=0;       /* geração da tela: mata setTimeout de rodada que já saiu */

/* ⚠️ A FIGURA vem do MOTOR (`imgEl`, que sabe onde mora a pasta `img/`). Aqui na
   bancada ela não existe, e a peça mostra a palavra escrita no lugar. Pegar por
   `window.imgEl` (e não `typeof imgEl`) é de propósito: assim o nome fica
   DECLARADO, o portão "função que não existe" consegue medir, e um dia que o
   motor trocar o nome dessa ferramenta a peça avisa em vez de sumir a figura. */
var figEl = window.imgEl || null;

/* ⚠️ A VOZ. Dentro de uma atividade montada quem fala é o motor (mp3 do Edge
   TTS, a voz de verdade). Sozinha, na bancada, a peça usa a voz do navegador só
   para não ficar muda. Nunca o contrário: voz de navegador não vai para a
   criança. */
function fala(txt, id){
  if(typeof window.falar==="function" && id){ window.falar(id); return; }
  try{
    if(!window.speechSynthesis||!window.SpeechSynthesisUtterance) return;
    var u=new SpeechSynthesisUtterance(txt);
    u.lang="pt-BR"; u.rate=.85; u.pitch=1.05;
    window.speechSynthesis.cancel(); window.speechSynthesis.speak(u);
  }catch(e){}
}
function sDesliza(){ nota(520,.09,.10,"triangle",0); nota(700,.10,.10,"triangle",.06); }
function sVolta(){ nota(392,.10,.10,"sine",0); nota(294,.12,.09,"sine",.07); }

function pecaJuntar(){
  var r=SILABAS[ri];
  if(!r){ fimDaPeca(); return; }
  err=0; posto=0; ger++;
  limpa();
  var t=el("div","tela");
  setProg(t, Math.round(ri*100/SILABAS.length));
  var c=el("div","centro");
  c.appendChild(el("div","selo","JUNTE OS PEDA&#199;OS"));
  c.appendChild(el("div","balao","Junte os peda&#231;os e forme a palavra da <b>figura</b>."));

  /* a FIGURA diz qual palavra é — a criança de 6 anos não lê */
  var fg=el("div","jsFig");
  if(figEl){ fg.appendChild(figEl(r.fig)); }
  else { fg.appendChild(el("div","semfig", r.pal)); }
  c.appendChild(fg);

  /* a FORMA: um lugar por sílaba */
  var forma=el("div","jsForma"), i;
  for(i=0;i<r.sil.length;i++){
    var v=el("div","jsVaga"+(i===0?" agora":""));
    v.id="jsv"+i;
    forma.appendChild(v);
  }
  c.appendChild(forma);

  /* a BANDEJA: as sílabas certas + as iscas, SEMPRE embaralhadas.
     ⚠️ embaralhar é a armadilha número um desta família: sem isso a criança
     aprende a POSIÇÃO e não o som. */
  var lista=[], z;
  for(z=0;z<r.sil.length;z++) lista.push({s:r.sil[z], ok:1});
  for(z=0;z<(r.iscas||[]).length;z++) lista.push({s:r.iscas[z], ok:0});
  baguncar(lista);
  var band=el("div","jsMassa");
  for(z=0;z<lista.length;z++) band.appendChild(fazSilaba(lista[z], r));
  c.appendChild(band);

  c.appendChild(el("div","hint","Toque no peda&#231;o certo. Ele escorrega at&#233; a forma."));
  t.appendChild(c); app.appendChild(t);
  marcaQA(r);
  fala("Junte os pedaços e forme a palavra da figura.", null);
}

function fazSilaba(item, r){
  var b=el("button","jsSil", item.s);
  b.type="button";
  b._sil=item.s;
  /* ⭐ AS TRÊS PORTAS (ordem do Marcos, ago/2026: *"nas atividades de clicar,
     quando for possível, pode ser de arrastar também"*). Aqui o arrastar não é
     só uma porta a mais: ARRASTAR **É** O DESLIZE que a pesquisa pede — a
     criança faz com a mão o que o conceito diz (duas partes que correm uma até
     a outra e viram uma só). Toque, clique e arrasto, os três.
     ⚠️ o guarda do MOUSE FANTASMA: no celular o navegador dispara eventos de
     mouse DEPOIS do toque, e sem este guarda eles desfaziam o gesto. Defeito já
     pego duas vezes na casa. */
  arrastavel(b, r);
  b.onclick=function(){
    if(b._ultimoToque && (new Date()).getTime()-b._ultimoToque<700) return;
    if(b.className.indexOf("usada")>=0) return;
    var esperada=r.sil[posto];
    if(item.s===esperada && b.className.indexOf("usada")<0){
      deslizaAte(b, document.getElementById("jsv"+posto), r);
    } else {
      /* ⚠️ ERRO NÃO PUNE: a peça devolve o pedaço com som de RETORNO, nunca de
         tropeço. O gesto está em treino, e no 1º ano errar a ordem é o normal. */
      err++; sVolta();
      b.className="jsSil";
      ajuda(err, r);
    }
  };
  return b;
}

/* o ARRASTO: mouse e dedo. Solta em cima da forma = a mesma coisa que tocar. */
function arrastavel(b, r){
  var mx=0,my=0,arr=false;
  function comeca(x,y,ev){
    if(b.className.indexOf("usada")>=0) return;
    arr=true; mx=x; my=y;
    b.style.zIndex="30"; b.style.position="relative";
    if(ev&&ev.type==="mousedown"&&ev.preventDefault) ev.preventDefault();
  }
  function move(x,y){
    if(!arr) return;
    b.style.webkitTransform="translate("+(x-mx)+"px,"+(y-my)+"px)";
    b.style.transform="translate("+(x-mx)+"px,"+(y-my)+"px)";
  }
  function solta(x,y){
    if(!arr) return;
    arr=false;
    b.style.webkitTransform=""; b.style.transform=""; b.style.zIndex="";
    var v=document.getElementById("jsv"+posto);
    if(v){
      var q=v.getBoundingClientRect();
      /* margem generosa: dedo de 6 anos nao acerta o pixel */
      if(x>q.left-30&&x<q.right+30&&y>q.top-30&&y<q.bottom+30){ b.onclick(); return; }
    }
    sVolta();
  }
  b.onmousedown=function(e){ comeca(e.clientX,e.clientY,e); };
  b.onmousemove=function(e){ move(e.clientX,e.clientY); };
  b.onmouseup  =function(e){ solta(e.clientX,e.clientY); };
  b.onmouseleave=function(e){ if(arr) solta(e.clientX,e.clientY); };
  /* ⚠️ NUNCA `preventDefault` no touchstart: mata o toque simples. */
  b.addEventListener("touchstart",function(e){
    var t=e.touches[0]; b._ultimoToque=(new Date()).getTime(); comeca(t.clientX,t.clientY,null);
  },false);
  b.addEventListener("touchmove",function(e){
    var t=e.touches[0]; move(t.clientX,t.clientY);
    if(arr&&e.preventDefault) e.preventDefault();
  },false);
  b.addEventListener("touchend",function(e){
    var t=(e.changedTouches&&e.changedTouches[0])||{clientX:0,clientY:0};
    b._ultimoToque=(new Date()).getTime();
    var q=document.getElementById("jsv"+posto);
    /* soltou longe da forma? entao foi TOQUE simples, e toque simples tambem vale */
    if(q){ var g=q.getBoundingClientRect();
      if(!(t.clientX>g.left-30&&t.clientX<g.right+30&&t.clientY>g.top-30&&t.clientY<g.bottom+30)){
        arr=false; b.style.webkitTransform=""; b.style.transform="";
        b.onclick(); return; } }
    solta(t.clientX,t.clientY);
  },false);
}

/* ⭐ O DESLIZE — o coração da peça (Reading Rockets: "have the sounds slide
   together to form a word"). A sílaba corre da bandeja até o lugar dela, e só
   depois de chegar é que ela vira parte da palavra. */
function deslizaAte(b, vaga, r){
  var meu=ger;
  var a=b.getBoundingClientRect(), v=vaga.getBoundingClientRect();
  b.style.setProperty("--dx",(v.left-a.left+(v.width-a.width)/2)+"px");
  b.style.setProperty("--dy",(v.top-a.top+(v.height-a.height)/2)+"px");
  b.className="jsSil desliza";
  sDesliza();
  fala(b._sil, null);
  setTimeout(function(){
    if(meu!==ger) return;
    b.className="jsSil usada";
    vaga.innerHTML=b._sil;
    vaga.className="jsVaga cheia";
    posto++;
    var prox=document.getElementById("jsv"+posto);
    if(prox) prox.className="jsVaga agora";
    marcaQA(r);
    if(posto>=r.sil.length) fechaPalavra(r);
  },380);
}

function fechaPalavra(r){
  var meu=ger;
  sCerto(); festa();
  var c=app.querySelector(".centro");
  var p=el("div","jsPronta", r.pal);
  c.appendChild(p);
  /* ⭐⭐ O SOM CONTÍNUO. A pesquisa é explícita: "Connected Phonation Is More
     Effective than Segmented Phonation". A palavra fecha dita de UMA VEZ —
     nunca "BO... LO". É aqui que a criança ouve que dois pedaços viraram um. */
  fala(r.pal.toLowerCase(), null);
  setTimeout(function(){
    if(meu!==ger) return;
    ri++;
    if(ri>=SILABAS.length) fimDaPeca(); else pecaJuntar();
  },1400);
}

/* o ANDAIME que cresce — e que nunca deixa a criança presa */
function ajuda(n, r){
  var d=r.d||[];
  if(n===1){ mostraDica(d[0]||"Diga a palavra devagar."); }
  else if(n===2){ mostraDica(d[1]||"Escute o come&#231;o da palavra.");
    pisca(r, false); }
  else if(n>=3){
    /* revela PRIMEIRO, escreve a dica DEPOIS — senão a fase se conserta
       sozinha e a criança não sabe por quê (lição paga em 5 de 6 peças) */
    pisca(r, true);
    setTimeout(function(){ mostraDica(d[2]||"Toque no peda&#231;o aceso."); },60);
  }
}
function pisca(r, acende){
  var bs=app.getElementsByClassName("jsSil"), i, alvo=r.sil[posto];
  for(i=0;i<bs.length;i++){
    if(bs[i].className.indexOf("usada")>=0) continue;
    if(bs[i]._sil===alvo){
      bs[i].className="jsSil "+(acende?"acesa pulsa":"pulsa");
      if(acende && bs[i].getElementsByClassName("jsMarca").length===0){
        var m=el("span","jsMarca","este"); bs[i].appendChild(m);
      }
    }
  }
}

/* `data-qa="1"` na sílaba que serve AGORA: é assim que o auditor-jogador
   atravessa a peça. Só para ele — a criança nunca vê isto. */
function marcaQA(r){
  var bs=app.getElementsByClassName("jsSil"), i, alvo=r.sil[posto];
  for(i=0;i<bs.length;i++)
    bs[i].setAttribute("data-qa",
      (bs[i].className.indexOf("usada")<0 && bs[i]._sil===alvo) ? "1" : "0");
}

function fimDaPeca(){
  limpa();
  var t=el("div","tela"); setProg(t,100);
  var c=el("div","centro");
  c.appendChild(el("div","medal",""));
  c.appendChild(el("div","balao","Voc&#234; juntou <b>"+SILABAS.length+" palavras</b>! Cada uma feita de peda&#231;os."));
  t.appendChild(c); app.appendChild(t);
  mostraBanner("<b>Padeiro de palavras!</b><br>Voc&#234; juntou os peda&#231;os.", pecaJuntar);
}

pecaJuntar();
</script>
