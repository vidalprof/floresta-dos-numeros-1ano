/* ⭐ A VITRINE QUE ENCHE — o progresso que a crianca de 6 anos LE.
   Pesquisa que sustenta: competencia visivel (Deci & Ryan) e o impulso de
   COLECAO. Barra de porcentagem a crianca de 1o ano nao le; vitrine enchendo
   ela le de longe, e quer completar. A cada fase vencida entra um doce atras
   do vidro; no fim a vitrine esta cheia, e aquilo e a foto do dia dela.
   O acabamento e o VIDRO FOSCO da cartela — nao e imitacao de vitrine, e a
   vitrine. (Dos doze acabamentos, este era o unico que nao servia para
   resposta justamente porque a leitura depende do fundo; como superficie, isso
   deixa de ser defeito e vira a qualidade dele.)

   e ruido, e a altura util no PC da escola e de ~640px. */
/* ⭐⭐ A BARRA DE PROGRESSO VIVA (redesenho ago/2026, pedido do Marcos:
   *"algo lindo mesmo, moderno, pode conter animacoes... algo vivo, dinamico"*).
   Saiu a "vitrine de miniaturas" (ele nao gostou da barra com figuras) e entrou
   uma barra estilo aplicativo de idioma: trilho de vidro fosco, PREENCHIMENTO
   com gradiente que FLUI sozinho (aurora), um BRILHO que corre por cima, um
   COMETA aceso na ponta que pulsa (o "voce esta aqui"), tiquinhos por fase e um
   selo "X / N" a direita. Tudo CSS puro, com queda para reduced-motion.

   controle (a barra nao se clica). */

  background:linear-gradient(100deg,transparent,rgba(255,255,255,.6),transparent);

/* ⚠️ LICAO PAGA (ago/2026), e o Marcos viu no fim do jogo da memoria: *"o
   botao continuar ao final ficou horrivel, muito grande"*. MEDIDO: 376px de
   largura numa tela de 412 — 91% da tela, de ponta a ponta, porque o
   `width:100%` mandava. Botao gigante nao e mais facil de acertar: ele vira
   uma FAIXA, some a hierarquia da tela e engole a comemoracao.
   Alvo de dedo continua garantido pela ALTURA (52px medidos, bem acima dos 40
   da regra da casa) e por uma largura minima confortavel. */

   vazio..."). No esqueleto ela e DADO: o montador escreve `ABERTURA` a partir do
   `conteudo.json`, e o motor so a apresenta. Sem esta funcao a capa chamava uma
   tela que nao existia mais — a crianca tocava em COMECAR e nada acontecia. */
var ABERTURA = {texto:"", voz:null};
function telaAbertura(){
  limpa(); var t=el("div","tela"); setProg(t,3);
  var c=el("div","centro");
  if(typeof brotoEl==="function") c.appendChild(brotoEl("feliz"));
  c.appendChild(el("div","balao", ABERTURA.texto||""));
  var b=el("button","btn amarelo","Vamos!");
  b.onclick=function(){ arma(); sTap(); abreFase(0); };
  c.appendChild(b);
  t.appendChild(c); app.appendChild(t);
  montaBarra(null,null);
  if(ABERTURA.voz) falar(ABERTURA.voz);
}

var MEC = {};                 /* nome da mecanica -> function(f, cen, fim) */
var FASES = [];               /* escrito pelo montador */
var IFASE = 0;

/* ⚠️ a barra tem que subir na ORDEM REAL de jogo — e ela e calculada da lista,
   nunca escrita a mao. Foi numero escrito a mao que fez a barra do 3o ano andar
   PARA TRAS em duas passagens. */
function progDaFase(i){ return Math.round(4 + 96 * (i / Math.max(1, FASES.length))); }

/* liga/desliga o pano de fundo suave (so quando a atividade pediu fundoSuave) */
function setBgSuave(on){ var b=document.getElementById("bg"); if(b) b.className = (on && ID.fundoSuave) ? "suave" : ""; }
function montaFase(i, aoFim){
  IFASE = i;
  setBgSuave(true);
  /* ⚠️ LICAO PAGA: quatro portoes da banca (contraste, leiaute, encaixe e
     imagem quebrada) abrem CADA tela chamando a funcao dela — inclusive sem
     argumento. `montaFase()` virava `FASES[undefined]`, e a linha seguinte
     estourava lendo `.selo` de `undefined`. Quatro portoes cegos de uma vez,
     e a atividade "passava" por nao ter sido medida. Fase que nao existe leva
     ao fim, nunca a uma tela morta. */
  if(!(i >= 0) || i >= FASES.length || !FASES[i]){ paraDeVigiar(); telaFim(); return; }
  /* a cada fase aberta, o marcador da retomada e carimbado de novo */
  _emJogo = true; salvaEstado();
  var f = FASES[i];
  limpa();
  /* o relogio do "esta parada?" zera a cada fase (ver `acordaParada`) */
  acordaParada();
  var t = el("div","tela");
  /* a vitrine SUBSTITUI a barra fina quando a atividade tem figuras para ela */
  if(VITRINE.length) poeVitrine(t, i); else setProg(t, progDaFase(i));
  var cen = el("div","centro");
  if(f.selo) cen.appendChild(el("div","selo", f.selo));
  if(f.enunciado) cen.appendChild(el("div","balao", f.enunciado));
  /* ⭐ o enunciado desta fase, para as pecas que dao `limpa()` e remontam a
     propria tela de abertura (relampago/caca/cruzadinha): sem isto o balao
     narrado do motor era apagado e a tela de abertura ficava MUDA (o gate
     `fala_o_escrito` pegou). A peca mostra `window.__faseEnun` na abertura,
     entao a voz gravada do enunciado casa com o que esta escrito. */
  try{ window.__faseEnun = f.enunciado || ""; }catch(_e){}
  /* ⭐ a narracao-ancora desta fase (o `vozIntro` gravado). Serve de ULTIMO
     recurso ao alto-falante do enunciado nas pecas que remontam a propria tela
     de abertura (relampago/caca/cruzadinha): la o texto do balao nao tem `op_`
     proprio (temVoz=null), entao o botao caia no vazio. Com isto ele toca o
     enunciado gravado da fase. */
  try{ window.__faseVozIntro = f.vozIntro || ""; }catch(_e){}
  t.appendChild(cen); app.appendChild(t);

  /* o andaime que cresce — o mesmo do mascote (ajudaJd), com a dica desta fase */
  var err = 0;
  window.ajuda = function(n, ops){
    ops = ops || {};
    if(n === 1){ if(f.dica) mostraDica(f.dica); else if(ops.dica) mostraDica(ops.dica); }
    else if(n === 2){ consolo(); if(ops.concreto) ops.concreto(); }
    else if(n >= 3){ if(ops.revelar) ops.revelar();
      /* ⚠️ LICAO PAGA: revela PRIMEIRO, escreve a dica DEPOIS — senao a fase se
         conserta sozinha e a crianca nao sabe por que (achado em 5 de 6 pecas). */
      if(ops.porque) setTimeout(function(){ mostraDica(ops.porque); }, 60); }
  };
  window.__regou = false;
  window.regFase = function(ok, tent){ window.__regou = true; if(f.conceito) reg(f.conceito, ok, tent); };

  montaBarra(f.dicaVoz || null, f.dica || null);
  /* ⭐⭐ A VOZ DIZ O QUE ESTA ESCRITO NA TELA — sempre.
     ⚠️ LICAO PAGA (ago/2026), e o Marcos pegou JOGANDO: *"os audios dos
     enunciados nao estao como esta escrito no enunciado"*. Na fase 1 a crianca
     LIA "Ouca a palavra e toque na figura dela" (o balao que a PECA escreve) e
     OUVIA "As etiquetas da padaria cairam!" (o enunciado da FASE, que o motor
     narrava). Duas frases diferentes ao mesmo tempo — para quem nao le, e pior
     que silencio.
     A causa era estrutural: o motor narrava `f.vozIntro` as cegas, sem olhar o
     que a peca tinha acabado de por na tela. E o esqueleto existe justamente
     para isso nao poder acontecer.
     Agora ele ESPERA a peca desenhar, LE o balao de verdade e fala a gravacao
     DAQUELE texto. So cai no `vozIntro` quando a peca nao escreveu balao
     nenhum — ai o enunciado da fase e mesmo o que esta na tela. */
  if(ID.narrar !== "manual"){
    setTimeout(function(){
      var cx = document.getElementsByClassName("pecabox")[0];
      var bs = cx ? cx.getElementsByClassName("balao") : null;
      var txt = (bs && bs.length) ? (bs[0].textContent || "") : "";
      txt = txt.replace(/\s+/g, " ").replace(/^ | $/g, "");
      /* ⚠️ NOTA (ago/2026): tentei por um alto-falante DENTRO do balao do
         enunciado (pedido do Marcos). O portao de leiaute (_qa/leiaute.js, regra
         "botao sobre texto") trata a regiao do balao como TEXTO e reprova o zap
         em QUALQUER posicao dentro dele — inline, no fim, absoluto no vao. Como o
         enunciado JA e narrado sozinho ao abrir a fase E ja tem o botao "Ouvir
         de novo" (o botao de som, em toda fase), o caminho confiavel e esse.
         Se um dia quisermos o icone COLADO na frase, o portao precisa aprender a
         diferenca entre "zap no vao reservado" e "zap sobre a letra" primeiro. */
      if(txt && typeof temVoz === "function"){
        var k = temVoz(txt);
        /* ⚠️ o olheiro do balao pode ter chegado ANTES de mim (ele dispara na
           mudanca do DOM, eu num prazo). Se ele ja falou este mesmo texto e o
           audio esta tocando, eu me calo — senao o audio REINICIA e a crianca
           ouve o comeco duas vezes. Foi o que o Marcos ouviu como "duas vozes". */
        if(k){
          if(window.__falouAgora === k && narr && !narr.paused && !narr.ended) return;
          /* ⚠️ o `op_` NAO e enfeite: o `temVoz` devolve so a CONTA do texto,
             e o arquivo gravado chama-se `op_<conta>.mp3` (mesma convencao das
             respostas tocaveis). Sem o prefixo, o motor pedia `audio/<conta>.mp3`,
             que nao existe — e a fase ficava MUDA mesmo com a voz gravada. */
          window.__falouAgora = k; falaDaTela("op_" + k); return;
        }
        /* sem gravacao para o que esta escrito: fica CALADO. Falar outra coisa
           foi exatamente o defeito. */
        return;
      }
      if(f.vozIntro) falar(f.vozIntro);
    }, 260);
  }

  var m = MEC[f.mec];
  if(!m){ /* mecanica que nao existe nao pode virar tela branca na mao da crianca */
    cen.appendChild(el("div","hint","(mecanica '"+f.mec+"' nao registrada)"));
    return; }
  /* ⚠️⚠️ LICAO PAGA (RIGHT NOW, ago/2026), o Marcos VIU: *"no relatorio final
     constou zero acertos, mesmo eu fazendo"*. As pecas fecham a fase mas NENHUMA
     chamava `regFase` — entao `MED.ev` ficava vazio e o boletim/relatorio
     mostrava 0 acertos SEMPRE. O registro tem que morar no ponto por onde TODA
     fase passa: aqui. Se a peca fechou a fase e nao registrou nada por conta
     propria, a conclusao vale como ACERTO (a crianca completou; as dicas usadas
     medem o esforco a parte). O flag `__regou` deixa a peca que registrar sozinha
     mandar, sem contar em dobro. */
  var _aoFimOrig = aoFim;
  var aoFimReg = function(){
    if(!window.__regou && f.conceito) reg(f.conceito, 1);
    if(_aoFimOrig) _aoFimOrig();
  };
  m(f, cen, aoFimReg);

}

function abreFase(i){
  montaFase(i, function(){ salvaEstado(); abreFase(i + 1); });
}
/* a MESMA fase, mas no percurso do "Treinar o que faltou": ao acabar ela volta
   para a fila do treino, nao para a fase seguinte da atividade */
function abreFaseTreino(i){ montaFase(i, function(){ salvaEstado(); proximoTreino(); }); }

/* ============================================================
   OS QUATRO MAPAS QUE ERAM DO BROTO — agora NASCEM da lista de fases.

   `DOM` (o quanto a crianca domina cada objetivo), `ROTCRI` (o nome do objetivo
   em linguagem de crianca, para o boletim), `TREINO` (qual fase refazer quando
   o objetivo ficou fraco) e `FASES_MESTRE` (o menu da senha 1275@).

   ⚠️ LICAO PAGA, e das caras: na primeira extracao os quatro FICARAM com o
   conteudo do mascote (luz_agua, sequencia, partes...) e o `TREINO` apontava para
   telas que ja tinham sido removidas. A atividade abria bonita, o `node --check`
   passava, o print ficava perfeito — e a crianca chegava ao BOLETIM DO FIM e a
   tela morria em `fracos()`. Foi o auditor-jogador que pegou, jogando ate o fim.
   ============================================================ */
var DOM = {}, ROTCRI = {}, TREINO = {}, FASES_MESTRE = [];

function preparaIdentidade(){
  var i, f, c;
  /* ⚠️ a ORDEM importa: primeiro o que a crianca ja tinha feito (a retomada de
     55 min), DEPOIS os objetivos que faltarem. Ao contrario, o `DOM={}` novo
     apagava o progresso salvo — a criança voltava e o boletim estava zerado. */
  carregaEstado();
  for(i = 0; i < FASES.length; i++){
    f = FASES[i];
    /* o menu do professor guarda o NOME de uma funcao global (e assim que o
       telaMestre do mascote o le) — entao cada fase ganha a sua */
    window["_f" + i] = (function(k){ return function(){ abreFase(k); }; })(i);
    FASES_MESTRE.push(["_f" + i, (i + 1) + ". " + semTag(f.selo || f.id)]);
    c = f.conceito;
    if(!c) continue;
    if(!DOM.hasOwnProperty(c)) DOM[c] = 0.3;      /* objetivo novo desta versao */
    if(!ROTCRI[c]) ROTCRI[c] = ROTULOS[c] || c;   /* nome em lingua de crianca */
    if(!TREINO[c]) TREINO[c] =
      (function(k){ return function(){ abreFaseTreino(k); }; })(i);
  }
  /* o fundo saiu do CSS (era um `url(img/...)` cravado no CSS, com o nome da atividade de origem) e virou dado:
     assim ele nao viaja calado para a proxima atividade */
  if(ID.fundo){ var bg = document.getElementById("bg");
    if(bg) bg.style.backgroundImage = "url(img/" + ID.fundo + ")"; }
  window["_ffim"] = function(){ telaFim(); };
  FASES_MESTRE.push(["_ffim", (FASES.length + 1) + ". FIM"]);
  precarrega();
}
var ROTULOS = {};   /* conceito -> nome de crianca (o montador escreve) */
function semTag(h){ return String(h || "").replace(/<[^>]+>/g, ""); }

/* o motor so comeca DEPOIS que a identidade e as fases existem — a linha
   original do mascote abria a capa antes disso (ver TROCAS) */
function inicia(){
  preparaIdentidade();
  if(location.search.indexOf("painel") >= 0){ telaPainel(); } else { telaCapa(); }
}

setTimeout(inicia, 0);

</script>
