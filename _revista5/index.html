  /* ⚠️⚠️ LICAO PAGA, e a mais silenciosa de todas: a peca da MEMORIA declara a
     PROPRIA `function fim()`. Como o corpo dela entra dentro do fechamento, esse
     `fim` SOMBREAVA o parametro da ponte — e o `mostraBanner` daqui, que devia
     levar a fase seguinte, chamava a peca de volta. Laco infinito, sem erro de
     JS nenhum: o jogador so ficava PRESO, com todos os pares ja fechados e a
     medalha da peca na tela. Por isso a continuacao mora AQUI FORA, com um nome
     que o integrador confere que nenhuma peca usa (ver `confere_contra_motor`).
     E ela so dispara UMA vez: peca que chama o banner duas vezes pularia fase. */
  var _seguir = function(){ if(_seguir.ja) return; _seguir.ja = 1; fim(); };
  /* recolhe o enunciado da fase assim que a peca puser o balao dela (ver CSS) */
  setTimeout(function(){
    var b = cen.getElementsByClassName("pecabox")[0];
    if(b && b.getElementsByClassName("balao").length)
      cen.className = cen.className + " tembalaopeca";
  }, 120);
  (function(){
    /* a peca acha que esta sozinha; estes ajudantes fazem o meio de campo */
    var app = cen;
    /* o `ac()` DESTA peca: destrava o som (o motor chama isso de `arma()`) e
       devolve o AudioContext do motor. Fica local, dentro do fechamento, para
       nao brigar com o `var ac` do motor — que e o objeto, nao a funcao. */
    function ac(){ if(typeof arma === "function") arma(); return window.ac; }
    function limpa(){ var g = cen.getElementsByClassName("pecabox")[0];
      if(g) g.innerHTML = ""; else { g = document.createElement("div");
      g.className = "pecabox"; cen.appendChild(g); } app = g; }
    /* ⚠️ LICAO PAGA: este ajudante era um VAZIO — "quem manda na barra e o
       motor". So que o caca-palavras faz `setProg(t,0)` e depois PEGA A BARRA
       DE VOLTA (`t.getElementsByTagName("i")[0]`) para mostrar quantas palavras
       ja achou. Com o vazio, ele pegava `undefined` e estourava no primeiro
       toque: 446 erros de JS numa partida. Regra: o ajudante da ponte tem que
       FAZER o que o de verdade faz — nao pode so nao atrapalhar.
       A barra da PECA e a de dentro da fase (5 palavras achadas de 8); a do
       MOTOR e a da atividade (fase 4 de 32). As duas informam coisas
       diferentes, entao as duas ficam — a de dentro, menorzinha (ver CSS). */
    function setProg(t, p){
      if(!t || !t.appendChild) return;
      var pr = document.createElement("div"); pr.className = "prog progpeca";
      var i = document.createElement("i"); i.style.width = (p || 0) + "%";
      pr.appendChild(i); t.appendChild(pr);
    }
    /* ⚠️⚠️ LICAO PAGA (ago/2026), pega pelo Marcos JOGANDO: *"esta passando de
       fase sem aquele botao azul que aparecia com a palavra proximo... tem que
       ser parecida com a atividade do Broto"*.

       Esta ponte comemorava e PULAVA para a fase seguinte sozinha, 420ms
       depois. A crianca terminava uma fase e era JOGADA na outra: sem a tela de
       parabens, sem o mascote dizendo o que ela conseguiu, sem o botao para ela
       decidir quando seguir. No Broto — que e o modelo — cada fase fecha com o
       banner e a crianca TOCA para continuar. Era o fecho de toda fase de toda
       atividade montada que estava faltando.

       Agora a ponte chama o banner DE VERDADE do motor (`window.mostraBanner`,
       que a funcao local aqui dentro sombreia) e entrega o `_seguir` como o
       botao. A peca continua so avisando que acabou; quem manda no caminho
       segue sendo o motor — mas com a comemoracao no meio. */
    function mostraBanner(msg, cb){
      if(typeof festa === "function") festa();
      /* ⚠️⚠️ LICAO PAGA (Teatro, ago/2026), o Marcos jogando: uma fase fechava
         com um "QUADRADO GRANDE desconfigurado" em vez do aviso fininho das
         outras. Causa: 7 pecas (pintar, pintar-canvas, memoria, sete-erros,
         achar-na-cena, camadas-mapa, tracar-caminho) mandam no aviso de fim
         `<div class="medal">★</div>`. No motor a `.medal` e a MEDALHA DE 190px
         do FIM da atividade (imagem do mascote), entao o motor inflava aquilo
         num quadradao verde vazio com uma estrelinha. O aviso de FASE nao leva
         medalha — o motor ja comemora com confete. Tiro a medalha do aviso de
         fase aqui (conserto central: pega as 7 de uma vez). */
      if(msg) msg = msg.replace(/<div[^>]*class=["']?[^"'>]*medal[^"'>]*["']?[^>]*>[\s\S]*?<\/div>/gi, "");
      if(typeof window.mostraBanner === "function"){
        window.mostraBanner(msg || "Muito bem!", _seguir); return;
      }
      setTimeout(_seguir, 420);
    }
    /* ⚠️⚠️ LICAO PAGA (ago/2026), e foi o Marcos quem ouviu: *"onde tenho que
       ouvir a palavra nao funciona; o enunciado funciona, os sons das opcoes
       funcionam"*. So o botao OUVIR A PALAVRA era mudo.
       A causa: a peca sozinha nao tem gravacao nenhuma, entao ela fala pela
       VOZ ROBO do navegador (`speechSynthesis`). No PC da escola essa voz
       simplesmente nao existe (nao ha voz pt-BR instalada) — e falha CALADA,
       sem erro nenhum. O enunciado e as opcoes funcionavam porque passam pelo
       motor, que toca MP3 gravado.
       Aqui a ponte reaponta o `diz` da peca para a voz da casa. A conta da
       chave ignora maiusculas (`chaveVoz` faz `toLowerCase`), entao a palavra
       "pao" acha a gravacao feita para "PAO" — a mesma que o alto-falante da
       opcao ja usa. So cai na voz do navegador se nao houver gravacao. */
    var diz = function(txt){
      try{
        /* ⚠️⚠️ LICAO PAGA (ago/2026), e foi o Marcos quem OUVIU: *"o da padaria
           agora e falado duas vezes juntos, soa estranho"*.
           Varias pecas ganharam, no mesmo dia, a boa ideia de NARRAR SOZINHAS ao
           abrir — porque na bancada, sem motor, a fase ficava muda. So que dentro
           da atividade quem narra o balao e o MOTOR, sempre narrou. As duas vozes
           partiam juntas e se atropelavam.
           A peca nao tem como saber se esta na bancada ou na atividade; quem sabe
           e a ponte. Entao e AQUI que se decide: se o texto pedido e o mesmo que o
           motor ja esta dizendo (ou acabou de dizer, na meia janela de abertura da
           fase), a peca cala — o motor ja cumpriu o pedido dela. Qualquer outra
           fala (a palavra, a silaba, a dica) passa normalmente. */
        var _limpa = function(s){ return String(s||"").replace(/<[^>]*>/g," ")
          .replace(/&[a-z]+;|&#\d+;/gi," ").replace(/\s+/g," ").trim().toLowerCase(); };
        var _agora = _limpa(txt);
        if(_agora && window.__dizMotor && window.__dizMotor === _agora) return;
        try{
          var _b = document.getElementsByClassName("balao")[0];
          if(_b && _limpa(_b.textContent) === _agora){
            window.__dizMotor = _agora;
            setTimeout(function(){ window.__dizMotor = null; }, 1200);
            return;
          }
        }catch(_e){}
        var k = (typeof temVoz === "function") ? temVoz(txt) : null;
        if(k && typeof tocaVoz === "function"){ tocaVoz(k); return; }
        if(!window.speechSynthesis || !window.SpeechSynthesisUtterance) return;
        var u = new SpeechSynthesisUtterance(txt);
        u.lang = "pt-BR"; u.rate = .9; u.pitch = 1.05;
        window.speechSynthesis.cancel(); window.speechSynthesis.speak(u);
      }catch(e){}
    };
    limpa();

/* ====== A PEÇA COMEÇA AQUI ====== */

/* O CONTEÚDO É SÓ EXEMPLO (partes da planta, 8 anos). Ao copiar a peça para
   uma atividade, troque APENAS este bloco de dados: pergunta, a certa, as
   erradas e as TRÊS dicas (dica -> apoio concreto -> revela).                */
/* ⚠️ TRÊS DISTRATORES, não dois. Com só 3 opções na tela a criança elimina as
   duas erradas e o 3º degrau do andaime (o de REVELAR) nunca acontece — o
   apoio concreto ficava sendo o último. Quatro opções é o mínimo para o
   andaime dica -> apoio -> revela existir de verdade.                      */
/* ⭐ CADA OPÇÃO PODE SER PALAVRA **OU** PALAVRA COM FIGURA (ago/2026):
     "A RAIZ"                                    <- como sempre foi
     {t:"A RAIZ", img:"pl_raiz", voz:"a raiz"}   <- com apoio visual
   · `t`   = a palavra que a criança lê (obrigatória);
   · `img` = o nome da arte de IA, sem a pasta e sem o `.png` (OPCIONAL);
   · `voz` = o que o alto-falante diz, quando é diferente da palavra escrita
             (OPCIONAL — sem ele, fala a própria palavra).
   Sem `img` nada muda: nenhuma atividade que já usa esta peça quebra.     */
var TITULO="ESCOLHA A CERTA";   /* ⚠️ padrao NEUTRO: quem nao preencher
   a gaveta recebe isto. Ja esteve "PARTES DA PLANTA" e chegou assim a
   criancas em 11 atividades — inclusive numa de DIVISAO, que fechava a fase
   dizendo que ela conhecia as partes da planta. O exemplo do quiz da planta
   continua logo abaixo, no vetor QZ, para ensinar o formato. */
var FECHO="Voc&#234; acertou todas as escolhas!";
/* ⭐ SÓ IMAGEM (escolha do Marcos, ago/2026): quando a opção é a FIGURA na
   moldura de vidro, dá para esconder a PALAVRA embaixo e deixar só o desenho +
   o alto-falante (a criança toca e ouve o nome). Opcional; por padrão a palavra
   fica. Ligar por `dadosExtra:{SOIMG:true}`. O alto-falante NUNCA sai (regra da
   casa: toda resposta tocável fala). */
var SOIMG=false; /*TECNICA*/
var QZ=[
 /* 1o item no FORMATO OBJETO {t,voz} de proposito: e o exemplo que ensina ao
    montador (pecas.json) que a opcao pode ser objeto, alem de string. Sem `img`
    aqui para a peca avulsa nao acusar "imagem quebrada" (nao ha pasta img/). */
 {img:"", p:"Qual parte da planta fica <b>embaixo da terra</b> e bebe a água?",
  c:{t:"A RAIZ",voz:"a raiz"},
  e:[{t:"A FLOR",voz:"a flor"},{t:"A FOLHA",voz:"a folha"},{t:"O CAULE",voz:"o caule"}],
  d:["Ela fica escondida, debaixo do chão.",
     "É a parte que segura a planta no lugar e puxa a água da terra.",
     "É a RAIZ. Ela está acesa aí embaixo: toque nela para seguir."]},
 {p:"Qual parte é <b>verde e chata</b> e faz o alimento com a luz do sol?",
  c:"A FOLHA", e:["A RAIZ","O CAULE","A FLOR"],
  d:["Ela fica no ar, virada para o sol.",
     "É verde, fina e cheia de linhas: o sol bate nela o dia inteiro.",
     "É a FOLHA. Ela está acesa aí embaixo: toque nela para seguir."]},
 {p:"Qual parte é o <b>caminho</b> que leva a água da raiz até as folhas?",
  c:"O CAULE", e:["A FLOR","A SEMENTE","A RAIZ"],
  d:["Pense num cano em pé, no meio da planta.",
     "É a parte comprida que segura as folhas lá em cima.",
     "É o CAULE. Ele está aceso aí embaixo: toque nele para seguir."]}
];

var qi=0;      /* rodada de agora */
var err=0;     /* erros DESTA rodada (o andaime cresce com ele) */
var ger=0;     /* geracao da tela: mata setTimeout de fase que ja saiu */
var _ultOkEsc=-1;  /* posicao da certa na rodada passada (anti-repeticao) */

/* ⚠️ A FIGURA vem do MOTOR (`imgEl`, que sabe onde mora a pasta `img/`). Aqui
   na bancada ela não existe, e a opção fica só com a palavra — que é o próprio
   contrato: `img` é OPCIONAL. Pegar por `window.imgEl` (e não `typeof imgEl`)
   deixa o nome DECLARADO, e o portão "função que não existe" consegue medir. */
var figEl = window.imgEl || null;

/* ⚠️⚠️ A VOZ É GRAVADA, SEMPRE. Dentro da atividade montada a ponte do
   integrador REAPONTA este `diz` para o mp3 da casa (Edge TTS) — ele é
   declaração de função, então o `var diz = function(...)` da ponte, que roda
   antes do corpo da peça, toma o lugar dele. Sozinha, na bancada, a peça fica
   calada de propósito: voz-robô do navegador nunca vai para a criança (foi por
   ela que o botão mais importante da `ouvir-achar` ficou mudo no PC da escola,
   e é o que o portão `_qa/vozrobo.py` mede). */
function diz(txt){
  if(!txt) return;
  if(typeof window.temVoz!=="function"||typeof window.tocaVoz!=="function") return;
  var k=window.temVoz(txt);
  if(k) window.tocaVoz(k);
}
function sPing(){ nota(880,.09,.12,"triangle",0); }

/* uma opção pode ser PALAVRA ou {t,img,voz} — aqui as duas viram a mesma
   coisa, para o resto da peça não precisar saber a diferença. */
function opcao(x){
  if(x&&typeof x==="object")
    return {t:x.t||"", img:x.img||null, voz:x.voz||x.t||""};
  return {t:String(x), img:null, voz:String(x)};
}

/* ⭐ O ALTO-FALANTE DA RESPOSTA.
   ⚠️ ele NÃO escolhe: só fala. Sem parar o evento aqui, tocar no alto-falante
   valia como resposta — e a criança que só queria conferir a palavra levava um
   erro. Defeito já pago em atividade de verdade. */
function fazZap(txt,rot){
  var z=el("button","zap","");
  z.type="button";
  z.setAttribute("aria-label","Ouvir "+(rot||txt));
  z.onclick=function(ev){
    var e=ev||window.event;
    if(e.stopPropagation) e.stopPropagation(); else e.cancelBubble=true;
    if(e.preventDefault) e.preventDefault();
    sPing(); diz(txt);
    z.className="zap tocando";
    setTimeout(function(){ z.className="zap"; },900);
    return false;
  };
  return z;
}

function pecaEscolher(){
  var f=QZ[qi];
  if(!f){ fimDaPeca(); return; }
  err=0; ger++;
  limpa();
  var t=el("div","tela");
  setProg(t, Math.round(qi*100/QZ.length));
  var c=el("div","centro");
  c.appendChild(el("div","selo",TITULO));
  /* ⭐ a FOTO vem ANTES do balão: primeiro a criança olha, depois lê o que se
     pergunta sobre o que ela olhou. Invertido, ela lê a pergunta e procura na
     foto só o que a pergunta já disse — e a observação deixa de acontecer. */
  if(f.img&&figEl){ var qf=el("div","qfig",""); qf.appendChild(figEl(f.img));
                    c.appendChild(qf); }
  c.appendChild(el("div","balao",f.p));
  /* ⭐ A ARMADILHA DA MECÂNICA: embaralhar SEMPRE. */
  var lista=[{op:opcao(f.c),ok:1}], i;
  for(i=0;i<f.e.length;i++) lista.push({op:opcao(f.e[i]),ok:0});
  baguncar(lista);
  /* ⭐ ANTI-REPETICAO (Marcos, ago/2026: "todas as respostas estao sendo a 1").
     baguncar() e aleatorio, entao a certa PODE cair no mesmo lugar varias rodadas
     seguidas — e ai a crianca decora a POSICAO, nao o conteudo. Com so 2 opcoes
     (mau/mal) isso acontece metade das vezes. Se a certa caiu onde caiu na rodada
     passada, troca de lugar: a resposta ANDA de rodada em rodada. */
  if(lista.length>1){
    var _ok=-1, _kk; for(_kk=0;_kk<lista.length;_kk++){ if(lista[_kk].ok){_ok=_kk;break;} }
    if(_ok===_ultOkEsc){
      var _alvo=(_ok+1)%lista.length, _tmp=lista[_ok]; lista[_ok]=lista[_alvo]; lista[_alvo]=_tmp; _ok=_alvo;
    }
    _ultOkEsc=_ok;
  }
  /* com figura a lista vira grade de duas colunas (ver a lição no CSS) */
  var temfig=false;
  for(i=0;i<lista.length;i++) if(lista[i].op.img&&figEl) temfig=true;
  var box=el("div","opts"+(temfig?" comfigs":"")+(SOIMG&&temfig?" soimg":""));
  for(i=0;i<lista.length;i++) box.appendChild(fazOpcao(lista[i]));
  c.appendChild(box);
  c.appendChild(el("div","hint","Pergunta "+(qi+1)+" de "+QZ.length+". Toque na resposta."));
  t.appendChild(c);
  app.appendChild(t);
}

function fazOpcao(it){
  var p=it.op, comfig=!!(p.img&&figEl);
  var o=el("div","opt"+(comfig?" comfig":""),"");
  /* ⭐ o motor monta a chave da voz a partir do TEXTO da resposta — e aqui
     dentro há figura, alto-falante e, depois do acerto, o carimbo "certo".
     DECLARAR o que a voz deve dizer é mais honesto do que fazer o motor
     adivinhar (foi assim que "PÃO" virou "PPÃOjá tentamos" na Padaria). */
  o.setAttribute("data-voz",p.voz);
  if(comfig){ var g=el("div","opfig",""); g.appendChild(figEl(p.img)); o.appendChild(g); }
  var ln=el("div","oplin","");
  ln.appendChild(el("span","optxt",p.t));
  ln.appendChild(fazZap(p.voz,p.t));
  o.appendChild(ln);
  /* data-qa="1" = "esta serve AGORA". Existe SÓ para o auditor-jogador
     conseguir terminar a fase; a criança não vê diferença nenhuma. */
  if(it.ok) o.setAttribute("data-qa","1");
  o.onclick=function(){ responde(o,it.ok); };
  return o;
}

/* ⚠️ trocar a roupa da opção SEM perder a `comfig`: quem manda na altura da
   opção com figura é ela, e um `className="opt ok"` cru derrubava a figura
   para o tamanho da opção sem desenho — a tela pulava no acerto. */
function veste(o,estado){
  var fig=(o.className.indexOf("comfig")>=0)?" comfig":"";
  o.className="opt"+fig+(estado?" "+estado:"");
}

/* ⭐ a comemoração curta do acerto: a opção sobe e cresce, e POUSA de volta.
   Duas transições, sem biblioteca e sem `@keyframes` (ver a lição no CSS). */
function festeja(o){
  var g=ger;
  setTimeout(function(){
    if(g!==ger) return;
    if(o.className.indexOf("ok")>=0&&o.className.indexOf("pousa")<0)
      o.className=o.className+" pousa";
  },230);
}

function responde(o,certa){
  if(o.className.indexOf("no")>=0) return;   /* opcao ja apagada: nao responde */
  var f=QZ[qi];
  sTap();                                    /* o toque RESPONDE na hora */
  if(certa){
    sCerto();
    veste(o,"ok");
    /* ⚠️ `appendChild`, NUNCA `innerHTML +=`: reescrever o innerHTML recria os
       filhos e o alto-falante perderia o `onclick` — ficaria um botão bonito e
       mudo justamente depois do acerto. */
    o.appendChild(el("span","marca","certo"));
    festeja(o);
    trancaTudo();
    var g=ger;
    var _avanca=function(){
      if(g!==ger) return;                    /* a fase ja mudou: nao mexe */
      qi++;
      if(qi<QZ.length) pecaEscolher();
      else mostraBanner(FECHO, fimDaPeca);
    };
    /* ⭐ CONFIRMA A RESPOSTA (Marcos: "diga na última quantas SÃO"): no acerto o
       motor confirma em voz a resposta escolhida (ex.: "sete laranjas").
       ⚠️ LIÇÃO PAGA (Marcos ouviu no celular, ago/2026): a confirmação começava
       450ms depois do acerto, mas a PRÓXIMA rodada entrava com 1300ms FIXOS. Se a
       confirmação fosse mais longa que isso, ela CONTINUAVA tocando por cima da
       pergunta seguinte — "fala a resposta da questão anterior quando está em
       outra". A `falar` do motor ENFILEIRA a narração da nova tela atrás da
       confirmação ainda tocando, então a criança via a pergunta 2 e ouvia a
       resposta 1. Cura: a rodada só vira DEPOIS que a confirmação TERMINA (callback
       do `falar`), com uma rede de segurança por tempo se a voz não vier (PC mudo
       / mp3 bloqueada). Sem confirmação, mantém o tempo normal. */
    var _av=null; try{ _av=o.getAttribute("data-voz"); }catch(e){}
    var _ak=(_av && typeof temVoz==="function") ? temVoz(_av) : null;
    if(_ak && typeof falar==="function"){
      var _gc=ger;
      setTimeout(function(){
        if(_gc!==ger) return;
        falar("op_"+_ak, function(){ setTimeout(_avanca, 350); });
      }, 450);
      setTimeout(_avanca, 900) /* rede-de-seguranca: so dispara se a voz nao chegar */;             /* rede: voz bloqueada/lenta nunca prende */
    }else{
      setTimeout(_avanca,700);
    }
    return;
  }
  /* ERRO: não pune. Som grave curto + a opção sai do alcance + o andaime CRESCE. */
  sErro();
  veste(o,"no");
  o.onclick=null;
  err++;
  /* rede de segurança: se as erradas acabaram, revela na hora — a criança
     não pode ficar olhando uma tela onde só resta uma opção sem ninguém
     dizer nada. Com 4 opções isso coincide com o 3º erro.                 */
  var acabou=(sobramErradas()===0);
  mostraDica(acabou ? f.d[f.d.length-1] : f.d[Math.min(err,f.d.length)-1]);
  if(err>=3||acabou) revela();
}

function sobramErradas(){
  var a=app.getElementsByClassName("opt"), i, n=0;
  for(i=0;i<a.length;i++)
    if(a[i].getAttribute("data-qa")!=="1"&&a[i].className.indexOf("no")<0) n++;
  return n;
}

/* 3º erro: revela a certa e DEIXA SEGUIR. É o degrau que garante que a peça
   nunca trava — sempre existe caminho para fechar. */
function revela(){
  var a=app.getElementsByClassName("opt"), i;
  for(i=0;i<a.length;i++){
    if(a[i].getAttribute("data-qa")==="1"){
      veste(a[i],"rev");
      /* ⚠️ `appendChild`, nunca `innerHTML +=` — ver a lição em `responde()`:
         reescrever o innerHTML deixaria o alto-falante mudo. */
      if(a[i].getElementsByClassName("marca").length===0)
        a[i].appendChild(el("span","marca","&#233; esta"));
    }
  }
}

function trancaTudo(){
  var a=app.getElementsByClassName("opt"), i;
  for(i=0;i<a.length;i++) a[i].onclick=null;
}

function fimDaPeca(){
  ger++;
  limpa();
  var t=el("div","tela");

   Quem lê ganha as duas coisas; quem não lê ganha pelo menos a voz. O `diz`
   é do motor da atividade (voz GRAVADA, Edge TTS) e não existe na peça
   solta — por isso a guarda. ⚠️ NUNCA a voz-robô do navegador direto: ela
   do navegador está desligada de propósito e o `_qa/vozrobo.py` reprova.  */
function semTag(t){
  var d=document.createElement("div");
  d.innerHTML=String(t===undefined||t===null?"":t).replace(/<br\s*\/?>/gi," ");
  return (d.textContent||d.innerText||"").replace(/\s+/g," ").replace(/^ | $/g,"");
}
function fala(txt){
  var t=semTag(txt);
  if(!t) return;
  if(typeof diz==="function") diz(t);
}
/* o andaime de TEXTO continua igual — o "ver destino" entra JUNTO com ele,
   nunca no lugar dele. */
function ajuda(txt){ mostraDica(txt); fala(txt); }

function pecaLigar(){
  FEITOS=[]; marcada=null; pegou=null; arrastando=false; ger++;
  destDe=null; destAlvo=null; destNivel=0;
  limpa();
  var t=el("div","tela");
  setProg(t,0);
  barraP=t.querySelector(".prog i");
  var c=el("div","centro");
  c.appendChild(el("div","selo","CADA PARTE, SEU TRABALHO"));
  c.appendChild(el("div","balao",ENUN));

  caixaL=el("div","ligbox");
  camadaL=el("div","linhas");
  caixaL.appendChild(camadaL);

  var esq=el("div","lcol lesq"), dir=el("div","lcol ldir"), i;
  var lista=[];
  for(i=0;i<LIG.length;i++) lista.push(LIG[i]);
  /* o lado direito vai EMBARALHADO: senao a criança liga pela posição
     (linha 1 com linha 1) e não pelo sentido. */
  var sort=[];
  for(i=0;i<LIG.length;i++) sort.push(LIG[i]);
  baguncar(sort);
  for(i=0;i<lista.length;i++) esq.appendChild(fazPonta(lista[i],"e",lista[i].t));
  for(i=0;i<sort.length;i++)  dir.appendChild(fazPonta(sort[i],"d",sort[i].s));
  caixaL.appendChild(esq);
  caixaL.appendChild(dir);
  c.appendChild(caixaL);

  c.appendChild(el("div","hint","Toque de um lado e depois do outro. Também dá para puxar com o dedo ou com o mouse."));
  t.appendChild(c);
  app.appendChild(t);
}

function fazPonta(dado,lado,texto){
  var l=el("div","lig","");
  /* ⭐ FIGURA opcional no lado ESQUERDO. Se a gaveta trouxer `img`, a ponta
     mostra a imagem (ex.: a cédula de 10 reais) e o alto-falante do motor fala
     o que a gaveta declara em `voz` (a imagem sozinha não tem texto para o
     alto-falante ler — sem `voz` ele ficaria mudo). Sem `img`, nada muda: as
     ligar de texto × texto seguem exatamente iguais (compatível). */
  if(lado==="e" && dado.img){
    var im=el("img","ligfig"); im.src="img/"+dado.img+".png"; im.alt="";
    l.appendChild(im);
    if(dado.voz) l.setAttribute("data-voz",dado.voz);
  }else{
    l.innerHTML=(texto===undefined||texto===null)?"":texto;
  }
  /* os DOIS lados publicam a MESMA chave: é assim que o auditor-jogador
     consegue fechar a fase. A criança não vê diferença nenhuma. */
  l.setAttribute("data-qa",dado.k);
  if(dado.g) l.setAttribute("data-g",dado.g);   /* grupo p/ muitos-para-um (ver casa()) */
  l._lado=lado;
  l._ver=!!dado.ver;   /* ⭐ modo facil pedido na gaveta (ver acima) */
  l.onclick=function(){
    if(cliqueDeArrasto()) return;            /* este clique e o rabo do arrasto */
    if(souDedo()) return;                    /* o CLIQUE FANTASMA do dedo: ja tratado no touchend */
    toca(l);
  };
  l.onmousedown=function(ev){
    if(souDedo()) return;                    /* mouse FANTASMA do celular: ignora */
    comeca(l,ev.clientX,ev.clientY);
  };
  l.addEventListener("touchstart",function(ev){
    ultimoToque=agora();
    var d=ev.touches[0];
    comeca(l,d.clientX,d.clientY);
  },false);
  return l;
}

/* ⚠️ NUNCA `preventDefault` no touchstart acima — mata o toque no celular.
   Ele mora no touchmove, mais abaixo, e só enquanto há ponta na mão.       */
/* ⚠️ LIÇÃO: aqui NÃO se marca a ponta. Marcar no mousedown fazia o `click`
   que vem logo depois cair em "já estava marcada" e DESMARCAR — com o mouse
   a criança clicava e nada acontecia. A marca é do clique (que serve ao
   mouse, ao dedo e ao toque simples); o arrasto marca só quando anda mesmo. */
function comeca(l,x,y){
  if(temClasse(l,"feita")) return;
  pegou=l; x0=x; y0=y; arrastando=false;
}

function move(x,y){
  if(!pegou||!caixaL) return;
  if(!arrastando){
    if(Math.abs(x-x0)+Math.abs(y-y0)<10) return;
    arrastando=true;
    marca(pegou);
  }
  var b=caixaL.getBoundingClientRect();
  if(linhaViva&&linhaViva.parentNode) linhaViva.parentNode.removeChild(linhaViva);
  var p=ponto(pegou);
  linhaViva=traca(p.x,p.y,x-b.left,y-b.top,"viva");
}

/* ⚠️ DEFEITO PAGO NESTA PEÇA (medido com dedo de verdade, ago/2026): o celular
   dispara mousedown/mouseup e um CLIQUE fantasma logo depois do toque. Como
   tocar duas vezes na mesma ponta DESMARCA (e tem que desmarcar mesmo), o
   clique fantasma apagava a escolha que a criança acabara de fazer — ela
   tocava e nada ficava marcado. Cura: quem veio do DEDO resolve tudo aqui no
   `touchend` (`doDedo`), e o clique que vier atrás é engolido pelo souDedo().
   O mouse de verdade continua entrando pelo `click`, como sempre.          */
function solta(x,y,doDedo){
  if(!pegou) return;
  var l=pegou; pegou=null;
  if(linhaViva&&linhaViva.parentNode) linhaViva.parentNode.removeChild(linhaViva);
  linhaViva=null;
  if(!arrastando){ if(doDedo) toca(l); return; }   /* foi so um toque do dedo */
  arrastando=false; fimArrasto=agora();
  var alvo=document.elementFromPoint(x,y);
  while(alvo&&alvo.nodeType===1&&!temClasse(alvo,"lig")) alvo=alvo.parentNode;
  if(alvo&&temClasse(alvo,"lig")&&alvo!==l) juntar(l,alvo);
}

document.onmousemove=function(ev){ if(souDedo()) return; move(ev.clientX,ev.clientY); };
document.onmouseup=function(ev){ if(souDedo()) return; solta(ev.clientX,ev.clientY,false); };
document.addEventListener("touchmove",function(ev){
  ultimoToque=agora();
  if(!pegou) return;
  var d=ev.touches[0];
  move(d.clientX,d.clientY);
  if(arrastando) ev.preventDefault();        /* so aqui, e so com ponta na mao */
},{passive:false});
document.addEventListener("touchend",function(ev){
  ultimoToque=agora();
  var d=ev.changedTouches[0];
  solta(d.clientX,d.clientY,true);
},false);

/* ---- o TOQUE SIMPLES: escolhe de um lado, escolhe do outro ---- */
function toca(l){
  if(temClasse(l,"feita")) return;
  if(!marcada){ sTap(); marca(l); aoEscolher(l); return; }
  if(marcada===l){ sTap(); desmarca(); return; }
  if(marcada._lado===l._lado){ sTap(); marca(l); aoEscolher(l); return; }   /* mesmo lado: troca */
  juntar(marcada,l);
}
/* ⭐ escolheu uma ponta: no modo facil (`ver:1`) o destino aparece na hora,
   sem precisar errar. Fora dele, escolher OUTRA ponta apaga o destino que
   tinha nascido do erro — pista velha aponta para lugar nenhum.           */
function aoEscolher(l){
  if(l&&l._ver){ mostraDestino(l,1); return; }
  if(destDe&&destDe!==l) apagaDestino();
}

function marca(l){
  desmarca();
  l.className="lig sel";
  marcada=l;
}

/* ⚠️ LICAO DESTA MUDANCA: `desmarca()` reescrevia a classe de TODAS as pontas,
   entao qualquer marca de "ver destino" era apagada no toque seguinte — e o
   andaime sumia justo depois de aparecer. Agora a repintura passa pelo
   `classeLig`, que e o unico lugar que sabe quem esta se mostrando.        */
function classeLig(l,base){
  if(destAlvo&&l===destAlvo) return base+(destNivel>=2?" destf":" dest");
  return base;
}

function desmarca(){
  var a=app.getElementsByClassName("lig"), i;
  for(i=0;i<a.length;i++) if(!temClasse(a[i],"feita")) a[i].className=classeLig(a[i],"lig");
  marcada=null;
}

/* ⭐ VER DESTINO: a ponta certa do OUTRO lado passa a se mostrar, e uma LINHA
   TRACEJADA sai da ponta escolhida ate ela — o caminho inteiro, nao so o
   ponto de chegada. Nivel 1 (2o erro) pulsa devagar; nivel 2 (3o erro) acende
   de vez, e a peça continua deixando a crianca fechar o par com a mao.    */
function mostraDestino(l,nivel){
  if(!l||temClasse(l,"feita")) return;
  var a=app.getElementsByClassName("lig"), i, alvo=null;
  for(i=0;i<a.length;i++){
    if(temClasse(a[i],"feita")||a[i]===l) continue;
    if(casa(l,a[i])){ alvo=a[i]; break; }   /* aponta para um destino AINDA válido (par exato OU grupo) */
  }
  if(!alvo) return;
  destDe=l; destAlvo=alvo; destNivel=nivel;
  for(i=0;i<a.length;i++) if(!temClasse(a[i],"feita")&&a[i]!==marcada)
    a[i].className=classeLig(a[i],"lig");
  redesenha();
}
function apagaDestino(){
  var velho=destAlvo;
  destDe=null; destAlvo=null; destNivel=0;
  if(velho&&!temClasse(velho,"feita")&&velho!==marcada) velho.className="lig";
  redesenha();   /* a linha fantasma some junto */
}

/* ⭐ MUITOS-PARA-UM (Marcos, ago/2026: *"tanto o quadrado quanto a pirâmide
   ficam firmes, então ao clicar com qualquer um em qualquer que diga que fica
   firme do outro lado seria interessante funcionar"*). Duas pontas casam quando
   têm a MESMA chave `k` (o par exato de sempre) OU quando compartilham um GRUPO
   (`data-g`): assim o cubo liga a QUALQUER destino "fica firme", e a pirâmide ao
   outro — sem precisar acertar o gênero da frase. Compatível: gaveta sem `g`
   segue casando só por `k`. Os alvos se consomem (`feita`), então N sólidos do
   grupo preenchem os N destinos do grupo em qualquer ordem. */
function casa(a,b){
  if(a._lado===b._lado) return false;
  var ka=a.getAttribute("data-qa"), kb=b.getAttribute("data-qa");
  if(ka!==null&&ka===kb) return true;
  var ga=a.getAttribute("data-g"), gb=b.getAttribute("data-g");
  return !!(ga&&gb&&ga===gb);
}
function juntar(a,b){
  if(!a||!b||a===b) return;
  if(temClasse(a,"feita")||temClasse(b,"feita")) return;
  if(a._lado===b._lado) return;
  if(casa(a,b)){
    sCerto();
    a.className="lig feita"; b.className="lig feita";
    marcada=null;
    if(destDe===a||destDe===b||destAlvo===a||destAlvo===b){
      destDe=null; destAlvo=null; destNivel=0;
    }
    FEITOS.push([a,b]);
    redesenha();
    if(barraP) barraP.style.width=Math.round(FEITOS.length*100/LIG.length)+"%";
    if(FEITOS.length>=LIG.length){
      var ge=ger;
      setTimeout(function(){
        if(ge!==ger) return;
        mostraBanner(FECHO, fimDaPeca);
      },520);
    }
    return;
  }
  /* ERRO: não pune. Som grave curto, as pontas voltam e o andaime CRESCE. */
  sErro();
  a._err=(a._err||0)+1;
  /* o andaime de TEXTO (escrito + dito) continua sendo o mesmo de sempre... */
  ajuda(DICAS[Math.min(a._err,DICAS.length)-1]);
  var guardar=a;
  desmarca();
  /* ...e o VER DESTINO entra JUNTO com ele, nunca no lugar dele: no 2º erro
     da mesma ponta o outro lado se mostra discreto (tracejado que pulsa +
     linha fantasma), no 3º ele acende de vez.                             */
  if(guardar._err===2) mostraDestino(guardar,1);
  if(guardar._err>=3) revela(guardar);
}

/* 3º erro: acende a ponta certa do outro lado e DEIXA seguir — é o que
   garante que a peça nunca trava. A dica diz isso em palavras também.    */
function revela(l){
  mostraDestino(l,2);
  if(!destAlvo) return;
  marca(l);          /* a ponta fica escolhida: basta tocar na acesa */
}

/* ---- as linhas ---- */
function ponto(l){
  var r=l.getBoundingClientRect(), b=caixaL.getBoundingClientRect();
  var x=(l._lado==="e") ? (r.right-b.left) : (r.left-b.left);
  return {x:x, y:r.top+r.height/2-b.top};
}

function traca(x1,y1,x2,y2,extra){
  var dx=x2-x1, dy=y2-y1, comp=Math.sqrt(dx*dx+dy*dy);
  var ang=Math.atan2(dy,dx)*180/Math.PI;
  var ln=el("div","linha");
  /* ⚠️ o `extra` era IGNORADO — a funcao escrevia "linha viva" na marra, e por
     isso todo pedido de linha diferente (a fantasma do ver destino) saia com
     a cara da linha do arrasto. Agora ela usa o que lhe pedem.            */
  if(extra) ln.className="linha "+extra;
  ln.style.left=x1+"px"; ln.style.top=y1+"px"; ln.style.width=comp+"px";
  ln.style.webkitTransform="rotate("+ang+"deg)";
  ln.style.transform="rotate("+ang+"deg)";
  camadaL.appendChild(ln);
  return ln;
}

function redesenha(){
  if(!camadaL) return;
  camadaL.innerHTML="";
  linhaViva=null;
  var i,p1,p2;
  for(i=0;i<FEITOS.length;i++){
    p1=ponto(FEITOS[i][0]); p2=ponto(FEITOS[i][1]);
    traca(p1.x,p1.y,p2.x,p2.y,"");
  }
  /* ⭐ a LINHA FANTASMA do ver destino: entra por ultimo, por cima das feitas */
  if(destDe&&destAlvo&&!temClasse(destDe,"feita")&&!temClasse(destAlvo,"feita")){
    p1=ponto(destDe); p2=ponto(destAlvo);
    traca(p1.x,p1.y,p2.x,p2.y,(destNivel>=2)?"fanf":"fan");
  }
}
/* a tela do PC vira ao contrario e as linhas ficariam tortas: redesenha */
/* ⚠️ `window.onresize=` APAGAVA o ouvinte de qualquer outra peca (a teia fazia o
   mesmo) e continuava vivo depois da fase acabar, redesenhando num DOM que ja
   saiu da tela. Ouvinte proprio, e so enquanto a camada estiver no documento. */
window.addEventListener("resize",function(){ if(camadaL&&document.body.contains(camadaL)) redesenha(); },false);

function fimDaPeca(){
  ger++;
  caixaL=null; camadaL=null; linhaViva=null; marcada=null; pegou=null;
  destDe=null; destAlvo=null; destNivel=0;
  limpa();
  var t=el("div","tela");
  setProg(t,100);
  var c=el("div","centro");
  c.appendChild(el("div","selo","PEÇA FECHADA"));
  c.appendChild(el("div","medal",""));
  c.appendChild(el("div","balao","Você fechou os "+LIG.length+" pares."));
  var b=el("button","btn","Jogar de novo");
  b.onclick=function(){ pecaLigar(); };
  c.appendChild(b);
  c.appendChild(el("div","hint","Esta é a peça LIGAR: mouse, dedo e toque simples, os três."));
  t.appendChild(c);
  app.appendChild(t);
}
    if(f && f.dados) LIG = f.dados;
    if(f && f.dadosExtra){ var _d = f.dadosExtra;
      if(_d.DICAS !== undefined) DICAS = _d.DICAS;
      if(_d.FEITOS !== undefined) FEITOS = _d.FEITOS;
      if(_d.ENUN !== undefined) ENUN = _d.ENUN;
      if(_d.FECHO !== undefined) FECHO = _d.FECHO;
    }
    try{ fimDaPeca = _seguir; }catch(_e){}
    pecaLigar();
  })();
};

/* ==== PECA: linha-do-tempo ==== */
MEC["linha-do-tempo"] = function(f, cen, fim){
  cen.className = cen.className + " mec-linha-do-tempo";
  /* ⚠️⚠️ LICAO PAGA, e a mais silenciosa de todas: a peca da MEMORIA declara a
     PROPRIA `function fim()`. Como o corpo dela entra dentro do fechamento, esse
     `fim` SOMBREAVA o parametro da ponte — e o `mostraBanner` daqui, que devia
     levar a fase seguinte, chamava a peca de volta. Laco infinito, sem erro de
     JS nenhum: o jogador so ficava PRESO, com todos os pares ja fechados e a
     medalha da peca na tela. Por isso a continuacao mora AQUI FORA, com um nome
     que o integrador confere que nenhuma peca usa (ver `confere_contra_motor`).
     E ela so dispara UMA vez: peca que chama o banner duas vezes pularia fase. */
  var _seguir = function(){ if(_seguir.ja) return; _seguir.ja = 1; fim(); };
  /* recolhe o enunciado da fase assim que a peca puser o balao dela (ver CSS) */
  setTimeout(function(){
    var b = cen.getElementsByClassName("pecabox")[0];
    if(b && b.getElementsByClassName("balao").length)
      cen.className = cen.className + " tembalaopeca";
  }, 120);
  (function(){
    /* a peca acha que esta sozinha; estes ajudantes fazem o meio de campo */
    var app = cen;
    /* o `ac()` DESTA peca: destrava o som (o motor chama isso de `arma()`) e
       devolve o AudioContext do motor. Fica local, dentro do fechamento, para
       nao brigar com o `var ac` do motor — que e o objeto, nao a funcao. */
    function ac(){ if(typeof arma === "function") arma(); return window.ac; }
    function limpa(){ var g = cen.getElementsByClassName("pecabox")[0];
      if(g) g.innerHTML = ""; else { g = document.createElement("div");
      g.className = "pecabox"; cen.appendChild(g); } app = g; }
    /* ⚠️ LICAO PAGA: este ajudante era um VAZIO — "quem manda na barra e o
       motor". So que o caca-palavras faz `setProg(t,0)` e depois PEGA A BARRA
       DE VOLTA (`t.getElementsByTagName("i")[0]`) para mostrar quantas palavras
       ja achou. Com o vazio, ele pegava `undefined` e estourava no primeiro
       toque: 446 erros de JS numa partida. Regra: o ajudante da ponte tem que
       FAZER o que o de verdade faz — nao pode so nao atrapalhar.
       A barra da PECA e a de dentro da fase (5 palavras achadas de 8); a do
       MOTOR e a da atividade (fase 4 de 32). As duas informam coisas
       diferentes, entao as duas ficam — a de dentro, menorzinha (ver CSS). */
    function setProg(t, p){
      if(!t || !t.appendChild) return;
      var pr = document.createElement("div"); pr.className = "prog progpeca";
      var i = document.createElement("i"); i.style.width = (p || 0) + "%";
      pr.appendChild(i); t.appendChild(pr);
    }
    /* ⚠️⚠️ LICAO PAGA (ago/2026), pega pelo Marcos JOGANDO: *"esta passando de
       fase sem aquele botao azul que aparecia com a palavra proximo... tem que
       ser parecida com a atividade do Broto"*.

       Esta ponte comemorava e PULAVA para a fase seguinte sozinha, 420ms
       depois. A crianca terminava uma fase e era JOGADA na outra: sem a tela de
       parabens, sem o mascote dizendo o que ela conseguiu, sem o botao para ela
       decidir quando seguir. No Broto — que e o modelo — cada fase fecha com o
       banner e a crianca TOCA para continuar. Era o fecho de toda fase de toda
       atividade montada que estava faltando.

       Agora a ponte chama o banner DE VERDADE do motor (`window.mostraBanner`,
       que a funcao local aqui dentro sombreia) e entrega o `_seguir` como o
       botao. A peca continua so avisando que acabou; quem manda no caminho
       segue sendo o motor — mas com a comemoracao no meio. */
    function mostraBanner(msg, cb){
      if(typeof festa === "function") festa();
      /* ⚠️⚠️ LICAO PAGA (Teatro, ago/2026), o Marcos jogando: uma fase fechava
         com um "QUADRADO GRANDE desconfigurado" em vez do aviso fininho das
         outras. Causa: 7 pecas (pintar, pintar-canvas, memoria, sete-erros,
         achar-na-cena, camadas-mapa, tracar-caminho) mandam no aviso de fim
         `<div class="medal">★</div>`. No motor a `.medal` e a MEDALHA DE 190px
         do FIM da atividade (imagem do mascote), entao o motor inflava aquilo
         num quadradao verde vazio com uma estrelinha. O aviso de FASE nao leva
         medalha — o motor ja comemora com confete. Tiro a medalha do aviso de
         fase aqui (conserto central: pega as 7 de uma vez). */
      if(msg) msg = msg.replace(/<div[^>]*class=["']?[^"'>]*medal[^"'>]*["']?[^>]*>[\s\S]*?<\/div>/gi, "");
      if(typeof window.mostraBanner === "function"){
        window.mostraBanner(msg || "Muito bem!", _seguir); return;
      }
      setTimeout(_seguir, 420);
    }
    /* ⚠️⚠️ LICAO PAGA (ago/2026), e foi o Marcos quem ouviu: *"onde tenho que
       ouvir a palavra nao funciona; o enunciado funciona, os sons das opcoes
       funcionam"*. So o botao OUVIR A PALAVRA era mudo.
       A causa: a peca sozinha nao tem gravacao nenhuma, entao ela fala pela
       VOZ ROBO do navegador (`speechSynthesis`). No PC da escola essa voz
       simplesmente nao existe (nao ha voz pt-BR instalada) — e falha CALADA,
       sem erro nenhum. O enunciado e as opcoes funcionavam porque passam pelo
       motor, que toca MP3 gravado.
       Aqui a ponte reaponta o `diz` da peca para a voz da casa. A conta da
       chave ignora maiusculas (`chaveVoz` faz `toLowerCase`), entao a palavra
       "pao" acha a gravacao feita para "PAO" — a mesma que o alto-falante da
       opcao ja usa. So cai na voz do navegador se nao houver gravacao. */

/* O CONTEÚDO É SÓ EXEMPLO (a vida de uma planta, 8 anos). Ao copiar a peça
   para uma atividade, troque APENAS este bloco: cada fato tem um NOME e um
   MOMENTO (`t`). Dois fatos com o MESMO `t` acontecem AO MESMO TEMPO — é o
   caso que transforma a fila numa linha do tempo de verdade.
   ⚠️ A ordem tem que ser conferida por quem sabe do assunto: portão nenhum
   pega "a chuva veio antes da semente". */
var FATOS=[
 {t:1,n:"A semente &#233; plantada"},
 {t:2,n:"A chuva molha a terra"},
 {t:3,n:"A folhinha aparece em cima"},
 {t:3,n:"A raiz cresce embaixo"},
 {t:4,n:"A planta fica alta"},
 {t:5,n:"A flor abre"}
];

var ORDEM=[];              /* os momentos, na ordem das vagas: [1,2,3,3,4,5] */
var vagaAtual=0, errosSeg=0, telaAtual=null, barraP=null;
var pecas=[], camas=[];
/* ⚠️ o guarda do MOUSE FANTASMA: o celular dispara mousedown/click DEPOIS do
   toque. Sem esta marca de tempo a ficha era acionada duas vezes (o toque
   colocava e o fantasma tentava colocar de novo). */
var ultimoToque=0, pego=null, somb=null, px0=0, py0=0, moveu=false;

function montaOrdem(){
  var a=FATOS.slice(0), i;
  a.sort(function(x,y){return x.t-y.t;});
  ORDEM=[];
  for(i=0;i<a.length;i++) ORDEM.push(a[i].t);
}
function quantosNoMomento(t){
  var i,n=0;
  for(i=0;i<ORDEM.length;i++) if(ORDEM[i]===t) n++;
  return n;
}

function telaLinhaDoTempo(){
  limpa(); document.onkeydown=null; soltaSombra();
  montaOrdem();
  vagaAtual=0; errosSeg=0; pecas=[]; camas=[];

    mo=el("div","mom",txt);

/* ⚠️ o `touchstart` recebe uma funcao COM NOME de proposito: assim nenhum
   `preventDefault` fica perto dele. preventDefault no touchstart mata o
   toque no celular (armadilha registrada no _padrao/DINAMICAS.md). */
function ligaFicha(b){
  b.onclick=cliqueFicha;
  b.onmousedown=mouseIni;
  b.addEventListener("touchstart",toqueIni,false);
  b.addEventListener("touchmove",toqueMeio,false);
  b.addEventListener("touchend",toqueFim,false);
}
function cliqueFicha(){
  if(Date.now()-ultimoToque<700) return;   /* clique FANTASMA depois do toque */
  tocaFicha(this);
}
function mouseIni(ev){
  if(Date.now()-ultimoToque<700) return;
  pegaEm(this,ev.clientX,ev.clientY);
}
function toqueIni(ev){
  ultimoToque=Date.now();
  var to=ev.touches[0]; if(!to) return;
  pegaEm(this,to.clientX,to.clientY);
}
function toqueMeio(ev){
  if(!pego) return;
  var to=ev.touches[0]; if(!to) return;
  moveEm(to.clientX,to.clientY);
  if(moveu) ev.preventDefault();   /* so no MEIO do arrasto, nunca no comeco */
}
function toqueFim(ev){
  ultimoToque=Date.now();
  var to=ev.changedTouches[0], arrastou=moveu, alvo=this;
  if(to) soltaEm(to.clientX,to.clientY); else soltaSombra();
  if(!arrastou) tocaFicha(alvo);   /* toque simples: vale como clique */
}
function moveMouse(ev){ if(pego) moveEm(ev.clientX,ev.clientY); }
function soltaMouse(ev){ if(pego) soltaEm(ev.clientX,ev.clientY); }
document.onmousemove=moveMouse;
document.onmouseup=soltaMouse;

/* ---------- o arrasto de verdade (mouse e dedo usam o mesmo caminho) ---- */
function pegaEm(b,x,y){
  if(!b||b.className.indexOf("usada")>=0) return;
  pego=b; px0=x; py0=y; moveu=false;
  sTap();
  b.className="pc sel";
  somb=el("div","somb",b.nome);
  somb.style.left=(x-66)+"px"; somb.style.top=(y-29)+"px";
  somb.style.display="none";
  document.body.appendChild(somb);
}
function moveEm(x,y){
  if(!pego||!somb) return;
  if(!moveu&&(Math.abs(x-px0)>8||Math.abs(y-py0)>8)){ moveu=true; somb.style.display="block"; }
  if(moveu){ somb.style.left=(x-66)+"px"; somb.style.top=(y-29)+"px"; }
}
function soltaEm(x,y){
  var b=pego, arrastou=moveu;
  soltaSombra();
  if(!b) return;
  if(b.className.indexOf("usada")<0) b.className="pc";
  if(!arrastou) return;            /* nao arrastou: quem resolve e o clique */
  if(naFaixa(x,y)) tocaFicha(b);
}
function soltaSombra(){
  if(somb&&somb.parentNode) somb.parentNode.removeChild(somb);
  somb=null; pego=null; moveu=false;
}
function naFaixa(x,y){
  var e=document.elementFromPoint(x,y), n=0;
  while(e&&n<6){
    var cl=" "+String(e.className||"")+" ";
    if(cl.indexOf(" cam ")>=0||cl.indexOf(" faixa ")>=0||cl.indexOf(" trilho ")>=0||
       cl.indexOf(" vagabox ")>=0) return true;
    e=e.parentNode; n++;
  }
  return false;
}

/* serve na vaga da vez quem tem o MESMO momento dela — e por isso que dois
   fatos "ao mesmo tempo" cabem nas duas vagas irmas, em qualquer ordem. */
function tocaFicha(b){
  if(!b||b.className.indexOf("usada")>=0) return;
  if(vagaAtual>=ORDEM.length) return;
  if(b.momento===ORDEM[vagaAtual]) poeNaFaixa(b); else erraFicha(b);
}
function poeNaFaixa(b){
  var cm=camas[vagaAtual];
  cm.className="cam ok"; cm.innerHTML=b.nome;
  b.className="pc usada";
  sCerto();
  vagaAtual++; errosSeg=0;
  apagaDica();
  if(barraP) barraP.style.width=Math.round(vagaAtual*100/ORDEM.length)+"%";
  marcaQualServe();
  rolaAteAVaga();
  if(vagaAtual>=ORDEM.length) fechaFase();
}
function erraFicha(b){
  sErro(); errosSeg++;

  ajuda(errosSeg);
}
/* ⚠️ o temporizador continua correndo depois do limpa(): sem o guarda
   `!telaAtual.parentNode` ele mexeria numa tela que ja saiu. */
function destreme(b){
  setTimeout(function(){
    if(!telaAtual||!telaAtual.parentNode) return;
    if(b.className.indexOf("usada")<0) b.className="pc";
  },340);
}
function ajuda(n){
  if(n===1){
    mostraDica("Pergunte: o que precisa acontecer <b>antes</b> de todo o resto?");
  }else if(n===2){
    mostraDica("O que vem <b>logo depois</b> do que j&#225; est&#225; na faixa est&#225; piscando.");
    acendeCerta();
  }else{
    mostraDica("Era este! Eu coloco e voc&#234; segue de onde parou.");
    seguraDica(4000);   /* poe a peca APAGA a dica: segura para dar tempo de ler */
    revela();
  }
}
function acendeCerta(){
  var i,b;
  for(i=0;i<pecas.length;i++){
    b=pecas[i];
    if(b.className.indexOf("usada")>=0) continue;
    b.className=(b.momento===ORDEM[vagaAtual])?"pc ldt_pisca":"pc";
  }
}
function revela(){
  var i,b;
  for(i=0;i<pecas.length;i++){
    b=pecas[i];
    if(b.className.indexOf("usada")<0&&b.momento===ORDEM[vagaAtual]){ poeNaFaixa(b); return; }

/* ⚠️ LICAO PAGA, MEDIDA NA BANCADA (ago/2026) — A EXPLICACAO QUE SUMIA NO

   passa pelo caminho do acerto, que chama `apagaDica()` — entao a frase

   Agora a revelacao SEGURA a dica por 4 segundos: tempo de ler, e depois ela

var dicaPresaAte = 0;
function seguraDica(ms){ dicaPresaAte = (new Date()).getTime() + (ms||4000); }
function apagaDica(){
  var d=document.getElementById("dicaP");
  if(!d||!d.parentNode) return;
  var falta = dicaPresaAte - (new Date()).getTime();
  if(falta > 0){ setTimeout(apagaDica, falta + 30); return; }
  d.parentNode.removeChild(d);
}
/* a faixa anda sozinha ate a vaga da vez: sem isso a crianca preenche as tres
   primeiras e acha que acabou, porque as outras estao fora do campo de visao. */
function rolaAteAVaga(){
  var fx=document.getElementById("faixaP");
  if(!fx||vagaAtual>=camas.length) return;
  var vb=camas[vagaAtual].parentNode, alvo;
  if(!vb) return;
  alvo=vb.offsetLeft-Math.round(fx.clientWidth/2)+Math.round(vb.offsetWidth/2);
  if(alvo<0) alvo=0;
  fx.scrollLeft=alvo;
}
/* data-qa: a ficha que serve AGORA e a vaga da vez ficam com "1". E so para o
   auditor-jogador (_qa/jogador.js) conseguir terminar a peca sozinho. */

function sPista(){ nota(392,.07,.12,"triangle",0); nota(523.25,.10,.11,"triangle",.07); }

function telaQuem(){

/* as estrelas DESTA rodada: 3 se fechar na 1a pista, 2 na 2a, 1 da 3a em

function valeAgora(){
  var v=4-pistasAbertas;
  return v<1?1:v;
}
function pintaEstrelas(){
  if(!estrelasEl) return;
  var i, s, v=valeAgora();

}

function poePista(i){
  var it=MISTERIOS[mist], p=el("div","pista nova","");

     texto aparece (regra 7 do CONTRATO — voz por rodada). O gancho vai aqui:

         falaDaTela(MISTERIOS[mist].vozes[i]);

     Na peca, que roda sozinha e sem arquivo de audio, fica so o som curto. */
  sPista();
}

function pedePista(){
  if(travadoQ) return;
  var it=MISTERIOS[mist];
  if(pistasAbertas>=it.pistas.length){
    mostraDica("Acabaram as pistas. A resposta est&#225; com a moldura acesa.");
    acendeCerta();
    return;
  }
  poePista(pistasAbertas);
  pistasAbertas++;
  pintaEstrelas();
  atualizaConta();
}

function responde(nome,bot){
  if(travadoQ) return;
  var it=MISTERIOS[mist];
  if(nome===it.resp){
    travadoQ=true;
    bot.className="opt ok";
    bot.removeAttribute("data-qa");
    sCerto();
    ganhas+=valeAgora();
    atualizaConta();
    if(barraQ) barraQ.style.width=Math.round((mist+1)*100/MISTERIOS.length)+"%";
    fechaMisterio();
    return;
  }
  /* ERRO: a opcao SAI DE CENA (apagada + escrito "nao combina") e chega a
     PISTA seguinte. Nunca X, nunca a palavra "errou": o caminho do erro e o
     caminho da informacao nova.                                            */
  sErro();
  bot.className="opt fora";
  bot.appendChild(el("span","fmarca","n&#227;o combina com a pista"));
  if(pistasAbertas<it.pistas.length){
    poePista(pistasAbertas);
    pistasAbertas++;
    pintaEstrelas();
    atualizaConta();
  }else{
    /* acabaram as pistas: a peca NAO trava — acende a resposta e deixa seguir */
    mostraDica("Olhe as pistas de novo: a resposta est&#225; com a moldura acesa.");
    acendeCerta();
  }
}

function acendeCerta(){
  var a=app.getElementsByClassName("opt"), i, it=MISTERIOS[mist];

    if(a[i].getAttribute("data-qa")==="1") a[i].className="opt mostra";
}

/* ⚠️ o temporizador continua correndo depois que a tela sai: o guarda `gerQ`

function fechaMisterio(){
