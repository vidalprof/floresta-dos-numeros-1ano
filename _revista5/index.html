/* ⭐ A VITRINE QUE ENCHE — o progresso que a crianca de 6 anos LE.
   Pesquisa que sustenta: competencia visivel (Deci & Ryan) e o impulso de
   COLECAO. Barra de porcentagem a crianca de 1o ano nao le; vitrine enchendo
   ela le de longe, e quer completar. A cada fase vencida entra um doce atras
   do vidro; no fim a vitrine esta cheia, e aquilo e a foto do dia dela.
   O acabamento e o VIDRO FOSCO da cartela — nao e imitacao de vitrine, e a
   vitrine. (Dos doze acabamentos, este era o unico que nao servia para
   resposta justamente porque a leitura depende do fundo; como superficie, isso
   deixa de ser defeito e vira a qualidade dele.)
   ⚠️ ela SUBSTITUI a barra fina: dois indicadores de progresso na mesma tela
   e ruido, e a altura util no PC da escola e de ~640px. */
/* ⭐⭐ A BARRA DE PROGRESSO VIVA (redesenho ago/2026, pedido do Marcos:
   *"algo lindo mesmo, moderno, pode conter animacoes... algo vivo, dinamico"*).
   Saiu a "vitrine de miniaturas" (ele nao gostou da barra com figuras) e entrou
   uma barra estilo aplicativo de idioma: trilho de vidro fosco, PREENCHIMENTO
   com gradiente que FLUI sozinho (aurora), um BRILHO que corre por cima, um
   COMETA aceso na ponta que pulsa (o "voce esta aqui"), tiquinhos por fase e um
   selo "X / N" a direita. Tudo CSS puro, com queda para reduced-motion.

   controle (a barra nao se clica). */
.vitrine{position:absolute;top:calc(10px + env(safe-area-inset-top));left:14px;right:14px;

  background:linear-gradient(90deg,#34d399,#22c55e,#a3e635,#34d399);

  box-shadow:0 0 10px rgba(52,211,153,.60),0 0 20px rgba(163,230,53,.30);

  background:-webkit-linear-gradient(left,transparent,rgba(255,255,255,.8),transparent);

   que corre por cima de tempos em tempos. O recorte transparente do avatar
   deixa o vidro aparecer atras (quando a arte vem sem fundo). */
.fig{position:relative;overflow:hidden;width:82px;height:82px;border-radius:22px;cursor:pointer;padding:6px;
  background:-webkit-gradient(linear,left top,left bottom,from(rgba(255,255,255,.34)),to(rgba(255,255,255,.12)));
  background:linear-gradient(150deg,rgba(255,255,255,.34),rgba(255,255,255,.12));
  -webkit-backdrop-filter:blur(5px);backdrop-filter:blur(5px);
  border:2px solid rgba(255,255,255,.6);
  -webkit-box-shadow:0 6px 14px rgba(30,50,20,.22),inset 0 1px 0 rgba(255,255,255,.75);box-shadow:0 6px 14px rgba(30,50,20,.22),inset 0 1px 0 rgba(255,255,255,.75)}
.fig:after{content:"";position:absolute;top:0;left:-70%;width:48%;height:100%;pointer-events:none;
  background:-webkit-gradient(linear,left top,right top,from(transparent),color-stop(.5,rgba(255,255,255,.6)),to(transparent));
  background:linear-gradient(100deg,transparent,rgba(255,255,255,.6),transparent);
  -webkit-transform:skewX(-18deg);transform:skewX(-18deg);
  -webkit-animation:figbrilho 3.4s ease-in-out infinite;animation:figbrilho 3.4s ease-in-out infinite}
@-webkit-keyframes figbrilho{0%,58%{left:-70%}100%{left:130%}}
@keyframes figbrilho{0%,58%{left:-70%}100%{left:130%}}
.fig img{position:relative;z-index:1;width:100%;height:100%;object-fit:contain;border-radius:16px}

@media(prefers-reduced-motion:reduce){ .fig:after{-webkit-animation:none;animation:none;display:none} }

@-webkit-keyframes med{from{-webkit-transform:scale(.2) rotate(-25deg);opacity:0}to{-webkit-transform:scale(1) rotate(0);opacity:1}}
@keyframes med{from{transform:scale(.2) rotate(-25deg);opacity:0}to{transform:scale(1) rotate(0);opacity:1}}
/* banner
   ⚠️ LIÇÃO PAGA (Lojinha, ago/2026 — Marcos: "o botão não aparece em alguns"):
   o banner de fim de fase se escondia com `transform:translateY(115%)` e só
   voltava ao FIM da transição. No PC antigo da escola (fixed+transform) a
   transição às vezes NÃO fechava e o banner — com o botão Continuar — ficava
   ABAIXO DA DOBRA: a criança ficava presa. Agora esconde por opacity+visibility
   (que não tira o elemento do lugar) e desliza só 16px — no pior caso fica 16px
   mais baixo, mas SEMPRE inteiro na tela; nunca 115% fora dela. */
.banner{position:fixed;left:0;right:0;bottom:0;z-index:20;padding:18px 18px calc(20px + env(safe-area-inset-bottom));max-width:520px;margin:0 auto;
  opacity:0;visibility:hidden;pointer-events:none;
  -webkit-transform:translateY(16px);transform:translateY(16px);
  -webkit-transition:opacity .28s ease,-webkit-transform .28s ease;transition:opacity .28s ease,transform .28s ease;
  border-top-left-radius:26px;border-top-right-radius:26px}
.banner.show{opacity:1;visibility:visible;pointer-events:auto;-webkit-transform:none;transform:none}.banner.bom{background:#dcffbe}
.banner .msg{font-size:18px;font-weight:700;color:#3f7d04;margin-bottom:12px;text-align:center}
/* ⚠️ LICAO PAGA (ago/2026), e o Marcos viu no fim do jogo da memoria: *"o
   botao continuar ao final ficou horrivel, muito grande"*. MEDIDO: 376px de
   largura numa tela de 412 — 91% da tela, de ponta a ponta, porque o
   `width:100%` mandava. Botao gigante nao e mais facil de acertar: ele vira
   uma FAIXA, some a hierarquia da tela e engole a comemoracao.
   Alvo de dedo continua garantido pela ALTURA (52px medidos, bem acima dos 40
   da regra da casa) e por uma largura minima confortavel. */
.banner .cta2{width:auto;min-width:190px;max-width:300px;display:block;margin:0 auto;
  border:0;cursor:pointer;font-family:inherit;font-weight:700;font-size:18px;color:#fff;padding:15px 30px;border-radius:18px;background:var(--verde);-webkit-box-shadow:0 4px 0 var(--verde-d);box-shadow:0 4px 0 var(--verde-d);text-transform:uppercase}
#conf{position:fixed;inset:0;width:100%;height:100%;z-index:15;pointer-events:none}/* ⚠️ o `width/height:100%` NAO e redundante com o `inset:0`: <canvas> e elemento SUBSTITUIDO, e para esses o `width:auto` resolve para o tamanho INTRINSECO (300x150), nao para a caixa do pai. Sem estas duas medidas o canvas do confete ficava em 300x150 e TODA particula nascia fora dele — a festa existia no codigo e nunca aparecia na tela. */
/* ⭐ GAME-FEEL: TEXTO FLUTUANTE no acerto (pesquisa ago/2026,
   `_pesquisa/COMO-FAZER-MELHORIAS-2026-08.md`: "Boa!/+1 perto do toque, sem tapar
   o alvo, ~1-2s e some"). Nasce no ponto do ultimo toque (`_flutua`), sobe e
   apaga. z-index acima de tudo, `pointer-events:none` (nunca rouba o toque).
   Desligado por `prefers-reduced-motion` (a criacao dele e pulada no JS). */
.flut{position:fixed;z-index:60;pointer-events:none;-webkit-transform:translate(-50%,0);
  transform:translate(-50%,0);color:#ffe07a;font-weight:800;font-size:22px;
  text-shadow:0 2px 6px rgba(0,0,0,.55),0 0 2px rgba(0,0,0,.6);white-space:nowrap;
  -webkit-animation:flutua 1.05s ease-out forwards;animation:flutua 1.05s ease-out forwards}
@-webkit-keyframes flutua{0%{opacity:0;-webkit-transform:translate(-50%,0) scale(.7)}
  18%{opacity:1;-webkit-transform:translate(-50%,-10px) scale(1.08)}
  100%{opacity:0;-webkit-transform:translate(-50%,-52px) scale(1)}}
@keyframes flutua{0%{opacity:0;transform:translate(-50%,0) scale(.7)}
  18%{opacity:1;transform:translate(-50%,-10px) scale(1.08)}
  100%{opacity:0;transform:translate(-50%,-52px) scale(1)}}

/* alto-falante discreto: le a resposta para quem ainda nao le.
   ⚠️ LICAO PAGA (ago/2026) — o Marcos apontou este botao TRES vezes ate dizer
   *"esse botao de som esta horrivel. A parte preta tem que estar no meio do
   circulo"*. O desenho vinha de TRES filhos absolutos (`i` corpo, `b` cone,
   `s` onda) com left/top em pixel, repetidos em CADA quebra de tela: 6 blocos
   de aritmetica na mao para um icone de 18px. Bastava um deles sair de lugar
   (ou uma peca redefinir a caixa do `.zap`) para o boneco desmontar — circulo
   de um lado, corpinho do outro, a onda solta como um ")".
   Agora e UM SVG embutido no proprio botao: centra-se sozinho pelo `viewBox`,
   nao tem coordenada para errar e fica nitido em qualquer zoom. Nas telas
   pequenas so muda o `background-size`. Data URI = continua 1 arquivo so.
   ⚠️ A cor mora DENTRO do SVG, entao `background-color` e `background-image`
   ficam SEPARADOS aqui — usar o atalho `background:` em qualquer regra abaixo
   (hover, tocando, variante branca) apagaria o desenho. */
.zap{position:relative;-webkit-flex:none;flex:none;width:30px;height:30px;border-radius:50%;background-color:rgba(58,48,32,.09);border:0;cursor:pointer;padding:0;margin-left:8px;vertical-align:middle;display:inline-block;opacity:.55;-webkit-transition:opacity .2s;transition:opacity .2s;
  background-image:url("data:image/svg+xml;charset=utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 20 20'%3E%3Cpath fill='%233a3020' d='M4 7.6h3.1L11 3.9v12.2L7.1 12.4H4z'/%3E%3Cpath fill='none' stroke='%233a3020' stroke-width='1.7' stroke-linecap='round' d='M13.3 7.1a4.2 4.2 0 0 1 0 5.8'/%3E%3C/svg%3E");
  background-repeat:no-repeat;background-position:center center;-webkit-background-size:18px 18px;background-size:18px 18px}
.zap:hover,.zap:active{opacity:1;background-color:rgba(58,48,32,.2)}
/* ⚠️ LICAO PAGA (ago/2026): o glifo do alto-falante e um SVG FILHO em varias
   pecas, com tamanho em pixel proprio. Quando o botao encolhe no celular
   (media query da peca), o desenho NAO encolhe junto e sai 6 a 9px para fora
   do proprio botao — feio e, pior, o alvo do dedo deixa de coincidir com o
   que se ve. Regra no MOTOR, nao na peca: vale para as 79 de uma vez. */
.zap.zap.zap{display:-webkit-inline-box;display:-webkit-inline-flex;display:inline-flex;
  -webkit-box-pack:center;-webkit-justify-content:center;justify-content:center;
  -webkit-box-align:center;-webkit-align-items:center;align-items:center}
.zap>*{max-width:100%;max-height:100%}
/* o desenho em PROPORCAO do botao, nunca em pixel fixo: botao redondo tem
   menos espaco util que a caixa dele, e icone de 24px num botao de 30 encosta
   na borda do circulo. 58% cabe em qualquer tamanho, do 30px ao 64px. */
/* ⚠️ o `.fone.fone` nao e enfeite: o CSS das PECAS entra DEPOIS do motor no
   arquivo montado, entao com peso igual quem manda e a peca — e a peca fixa
   24px. Repetir a classe sobe o peso e devolve a palavra final ao motor,
   que e quem sabe o tamanho do botao. */
.zap .fone.fone.fone,.zap>i.fone.fone,.zap>span.fone.fone{width:58%;height:58%;margin:0;padding:0;
  -webkit-background-size:contain;background-size:contain;
  background-repeat:no-repeat;background-position:center center}
.zap svg{width:100%;height:100%;display:block}
.zap i,.zap b,.zap s{display:none}
.zap.tocando{opacity:1;background-color:rgba(255,212,59,.5);-webkit-animation:zpul .8s ease-in-out infinite;animation:zpul .8s ease-in-out infinite}
/* ⭐ ALTO-FALANTE NA PERGUNTA (pedido do Marcos, ago/2026: "precisa acrescentar
   um botao de som na atividade do 2 ano onde sao as perguntas, para ajudar quem
   nao sabe ler"). No 2o ano MUITA crianca ainda nao le: a narracao toca sozinha
   uma vez, mas se ela se distrai, perdeu. O botao "Ouvir de novo" existe la
   embaixo, na barra — longe do texto e com NOME ESCRITO, que e justamente o que
   ela nao le. O lugar do botao e GRUDADO no enunciado, e ele e um desenho de
   alto-falante, nao uma palavra.                                            */
/* ⚠️ O BOTAO NAO PODE TAPAR A PERGUNTA. A primeira versao pousava no canto de
   cima do balao e cobria a ultima palavra ("Toque na RAI[z]", "Que parte da
   planta e esta[?]"). Um botao de acessibilidade que esconde justamente o texto
   que a crianca precisa e o contrario do que ele existe para fazer. Agora o
   balao ABRE ESPACO para ele (classe `comzap`) e o botao mora dentro desse
   espaco, no meio da altura.                                               */
.balao.comzap{padding-right:56px}
/* ⚠️ ALVO DE DEDO (set/2026, medido pela cobaia em 1024x420): o alto-falante do
   enunciado tinha 38px — abaixo do piso de 40px da casa. 40 e o minimo, nao o
   ideal; o resto do desenho (o `comzap` reserva 56px) nao muda. */
.zapb{position:absolute;right:9px;top:50%;margin-top:-20px;width:40px;height:40px;border-radius:50%;
  background-color:#ffd43b;border:3px solid #fffdf6;cursor:pointer;padding:0;
  background-image:url("data:image/svg+xml;charset=utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 20 20'%3E%3Cpath fill='%234a3a10' d='M4 7.6h3.1L11 3.9v12.2L7.1 12.4H4z'/%3E%3Cpath fill='none' stroke='%234a3a10' stroke-width='1.7' stroke-linecap='round' d='M13.3 7.1a4.2 4.2 0 0 1 0 5.8'/%3E%3C/svg%3E");
  background-repeat:no-repeat;background-position:center center;
  -webkit-background-size:22px 22px;background-size:22px 22px;
  -webkit-box-shadow:0 3px 9px rgba(60,45,15,.35);box-shadow:0 3px 9px rgba(60,45,15,.35)}
/* mesmo glifo do `.zap` — dois desenhos diferentes de alto-falante na MESMA
   tela e amadorismo, e era o que estava acontecendo (o do balao tinha duas
   ondas, o das respostas uma so). */
.zapb i,.zapb b,.zapb s{display:none}
.zapb.tocando{background-color:#7bd44a;-webkit-animation:zpul .8s ease-in-out infinite;animation:zpul .8s ease-in-out infinite}
@-webkit-keyframes zpul{0%,100%{-webkit-transform:scale(1)}50%{-webkit-transform:scale(1.14)}}
@keyframes zpul{0%,100%{transform:scale(1)}50%{transform:scale(1.14)}}
/* fundo escuro (relampago, peca usada, ligacao certa) -> desenho branco */
.bin .zap,.pc.usada .zap,.lig.ok .zap{background-color:rgba(255,255,255,.22);
  background-image:url("data:image/svg+xml;charset=utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 20 20'%3E%3Cpath fill='%23ffffff' d='M4 7.6h3.1L11 3.9v12.2L7.1 12.4H4z'/%3E%3Cpath fill='none' stroke='%23ffffff' stroke-width='1.7' stroke-linecap='round' d='M13.3 7.1a4.2 4.2 0 0 1 0 5.8'/%3E%3C/svg%3E")}
.opt .zap,.pc .zap,.bin .zap{margin-left:6px}
.lig .zap{margin:3px 0 0 5px}
/* em tela baixa encolhe o CIRCULO e o desenho junto — uma linha, nao tres

@media (max-height:720px){ .zap{width:26px;height:26px;margin-left:5px;

/* ⭐ AS FIGURAS TÊM VIDA (ordem do Marcos, ago/2026: *"imagens devem ser lindas,
   sem fundo e animadas se possível"*). Duas animações, e só duas:
   · a figura ENTRA (aparece crescendo um tiquinho) — dá a sensação de que a
     tela respondeu, que é o que prende a criança pequena;
   · a figura da rodada FLUTUA devagar — sinal de "é aqui que você olha".
   ⚠️ nada de piscar, girar ou saltar: numa tela com 8 figuras isso vira
   poluição e atrapalha quem tem dificuldade de atenção.
   ⚠️ quem pediu menos movimento no sistema operacional recebe menos movimento
   (`prefers-reduced-motion`) — é acessibilidade, não enfeite.
   ⚠️ o "sem fundo" NÃO se resolve aqui: vem do RECORTE (a cartela é gerada em
   fundo preto e o `_padrao/cartela.py cortar` transforma em alfa de verdade). */
@-webkit-keyframes figentra{0%{opacity:0;-webkit-transform:scale(.86)}100%{opacity:1;-webkit-transform:scale(1)}}
@keyframes figentra{0%{opacity:0;transform:scale(.86)}100%{opacity:1;transform:scale(1)}}
@-webkit-keyframes figflutua{0%,100%{-webkit-transform:translateY(0)}50%{-webkit-transform:translateY(-5px)}}
@keyframes figflutua{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
.pecabox img{-webkit-animation:figentra .3s ease-out both;animation:figentra .3s ease-out both}
.jsFig img,.bsFig img,.oaFig img,.figrod img{
  -webkit-animation:figflutua 3.6s ease-in-out infinite;animation:figflutua 3.6s ease-in-out infinite}
@media (prefers-reduced-motion: reduce){
  .tela{-webkit-animation:fade .3s;animation:fade .3s}
  .pecabox img,.jsFig img,.bsFig img,.oaFig img,.figrod img{
    -webkit-animation:none !important;animation:none !important}
  /* o mascote para de bobear/pensar/festejar, mas a INCLINACAO do "estou
     esperando voce" fica — ela e informacao, nao enfeite. */
  .broto,.broto.festejando{-webkit-animation:none !important;animation:none !important}
  .broto.pensando{-webkit-animation:none !important;animation:none !important;
    -webkit-transform:rotate(-7deg);transform:rotate(-7deg)}
}

/* ============================================================
   ⭐⭐ O JEITO DO BROTO — o molde visual da casa, para as 76 pecas.

   Ordem do Marcos (ago/2026), depois de abrir a Padaria: *"quero atividade
   bonita tipo app como o broto, o visual tem que ser mais caprichado"* e
   *"a atividade tem que ser nos moldes do que a gente vinha fazendo por
   ultimo, com o molde do broto"*.

   ⚠️ O QUE EU TINHA ERRADO: extrai do Broto a MOLDURA (capa, cracha, barra,
   banner, boletim) e deixei as FASES com o visual de cada peca, que nasceu na
   bancada — cartao branco chapado, borda fina, tudo encostado a esquerda. Por
   fora era o Broto; por dentro, nao. Todos os defeitos visuais que ele apontou
   numa noite (nome fora do quadro, letra pela metade, quadrado desalinhado,
   silaba sem cor) sao ESTE unico problema.

   Os valores abaixo NAO foram inventados: sao os do proprio `_jardim/index.html`
   — a mesma paleta, o mesmo raio, a mesma sombra, e a assinatura da casa, que e
   a BORDA DE BAIXO MAIS GROSSA (5px). E ela que da o ar de app, de peca que da
   para apertar.

   Especificidade: as regras da peca entram como `.mec-<nome> .opt` (0,2,0).
   Estas usam tres classes (0,3,0) de proposito — precisam ganhar, e sem
   `!important`, que seria pior de depurar.
   ============================================================ */
/* ⚠️⚠️ LICAO PAGA (ago/2026) — ERA ESTA REGRA que punha o QUADRADO BRANCO
   atras das figuras. Ela unifica o cartao de TODAS as pecas (e por isso usa
   tres classes, para ganhar das regras da peca) — e por isso mesmo o creme
   OPACO dela chegava tambem no cartao que segura uma figura RECORTADA. O
   portao 5b acusou em duas atividades, em quatro tamanhos de tela cada.
   Eu tinha "consertado" nas pecas, uma a uma, e nao adiantou: a regra da peca
   e (0,2,0) e esta e (0,3,0) — quem manda e aqui.
   `.88` continua sendo um cartao creme (a tinta escura passa folgada) e deixa
   a figura assentar na cena em vez de flutuar num retangulo branco. */
.centro .pecabox .opt,.centro .pecabox .pc,.centro .pecabox .ficha,.centro .pecabox .cx{
  background:rgba(255,253,246,.88);border:2px solid #e6dcc6;border-bottom-width:5px;
  border-radius:18px;color:#3a3020;font-weight:600;
  -webkit-box-shadow:0 5px 12px rgba(30,50,20,.16);box-shadow:0 5px 12px rgba(30,50,20,.16)}
.centro .pecabox .opt.ok,.centro .pecabox .pc.ok{border-color:#5bbf3a;background:#eafce0}
.centro .pecabox .opt.no{border-color:#ff7a6b;background:#fff0ee}
.centro .pecabox .balao{background:rgba(255,253,246,.95);border:0;border-radius:22px;
  padding:13px 18px;font-size:17px;font-weight:600;line-height:1.35;
  -webkit-box-shadow:0 6px 18px rgba(30,50,20,.22);box-shadow:0 6px 18px rgba(30,50,20,.22)}
.centro .pecabox .selo{background:#7d3fe0;color:#fff;font-size:13px;font-weight:700;
  padding:5px 12px;border-radius:999px}
/* ⚠️ `background-color`, NUNCA o atalho `background:` — o desenho do
   alto-falante e um SVG que mora no `background-image` do `.zap` (motor). O
   atalho zera o `background-image` junto, e o botao fica um circulo VAZIO.
   Foi exatamente o que aconteceu no dia em que o SVG entrou: no cartao da
   `ouvir-achar` o desenho aparecia, e nas fases de `completar` — que passam
   por esta ponte — o circulo saia em branco. */
.centro .pecabox .zap{width:30px;height:30px;border-radius:50%;
  background-color:rgba(58,48,32,.09);border:0;opacity:.62;padding:0}
/* ⚠️ .55 DE PRATO NAO SEGURA LETRA BRANCA (medido, ago/2026): sobre o ceu
   claro da atividade a mistura dava 3,7:1 — abaixo dos 4,5 — em 14 fases.
   Prato translucido nao e cor: e uma MEDIA com o que estiver atras, e o que
   esta atras muda de tela para tela. Opacidade suficiente para o pior caso
   (fundo branco) e a unica que vale nos dois temas. */
.centro .pecabox .hint{color:#fffdf6;background:rgba(58,48,32,.86);border-radius:999px;
  padding:6px 14px;display:inline-block;font-size:14px}

/* ⭐ O ALTO-FALANTE NAO PODE ESCAPAR DO CARTAO (medido, ago/2026)
   Achado pelo `_qa/vaza.js` — o portao que o Marcos fez nascer quando viu *"o
   dizer da figura fica fora do quadrado branco, ficou feio"*. Ele estava
   pronto ha semanas e NUNCA rodava sozinho: nao estava na banca. Ligado,
   achou na primeira corrida.
   O caso: pecas como a `arrastar-lugar` desenham um cartao de tamanho FIXO
   (74x70px). O motor poe dentro dele o alto-falante da resposta (30px + 8px
   de margem), porque `.pc` esta na lista das respostas tocaveis — e o botao
   sobrava 18px para fora, em TODOS os tamanhos de tela.
   O conserto certo nao e encolher o alto-falante (ele e alvo de dedo de
   crianca e ja esta no minimo): e o cartao CRESCER para caber o que puseram
   dentro dele. Largura e altura viram minimo, e o conteudo manda. */
.centro .pecabox .pc:has(> .zap){width:auto;height:auto;
  min-width:74px;min-height:70px;padding-right:6px}
/* queda para o Chrome 109 da escola, que nao tem `:has()`: ali o cartao ganha
   a folga sempre — dois pixels a mais num cartao sem alto-falante nao fazem
   mal a ninguem, e botao pela metade faz. */
@supports not (selector(:has(*))){
  .centro .pecabox .mec-arrastar-lugar .pc{width:auto;height:auto;
    min-width:74px;min-height:70px}
}

/* ⭐⭐ TEXTO SOLTO SOBRE O FUNDO TEM QUE TER PLACA (medido, ago/2026)
   Pedido do Marcos: *"sempre verificar se nao ha um contraste nas cores, para
   que nao aconteca de a crianca nao conseguir enxergar"*.

   O defeito e de PARENTESCO, nao de descuido: na bancada a peca roda sobre um
   fundo LISO e escuro (#2b2118), e ali o creme e o amarelo dela passam
   folgado. Dentro da atividade o mesmo texto cai sobre a FOTO — a madeira da
   padaria, o ceu do observatorio — e a razao despenca. Medido na Padaria
   depois que o portao do contraste passou a enxergar as fases: 45 textos
   abaixo do minimo, o pior a 1,95:1 ("A PALAVRA E / PAO" em cima da estante).
   Nenhum deles aparecia antes, porque o portao so media as telas de nome.

   A regra da casa: rotulo, contador e frase que ficam DIRETO sobre o fundo
   ganham uma placa escura translucida — o cartao ja tem a dele. A lista cresce
   quando o portao achar um caso novo (agora ele acha).                        */
.centro .pecabox .cont,.centro .pecabox .palv,.centro .pecabox .palvr,
.centro .pecabox .bsVazio,.centro .pecabox .csDiz,.centro .pecabox .csConta,
.centro .pecabox .csEsc,.centro .pecabox .frase,.centro .pecabox .m2_placar{
  display:inline-block;background:rgba(38,28,20,.78);color:#fdf7ec;
  border-radius:14px;padding:5px 14px;opacity:1}
/* a vaga de arrastar tambem: a placa escura faz o numero aparecer E marca melhor
   o lugar onde a peca entra. */
.centro .pecabox .cam{background:rgba(38,28,20,.62);color:#fdf7ec}
/* ⚠️ O BOTAO CLARO DA PECA (o "Recomecar" do pintar) — 1,24:1 medido, creme
   sobre creme — tinha a cor da letra AQUI, numa regra solta que valia para toda
   atividade (tivesse ela o botao ou nao) e reprovava no portao de cor em todas.
   Quem muda o FUNDO muda a LETRA junto, NO MESMO LUGAR: a cor foi para a regra
   `.bclaro` da propria peca `pintar-desenho` (set/2026). */

/* ⭐ O MEDALHAO: no Broto a figura da rodada e GRANDE, redonda e centrada — a
   arte e a estrela da tela, nao um selinho no canto do cartao. */
.centro .pecabox .medalhao{width:168px;height:168px;margin:12px auto 4px;border-radius:50%;
  background:rgba(255,253,246,.97);border:4px solid rgba(255,255,255,.75);padding:14px;
  display:-webkit-box;display:flex;-webkit-box-align:center;align-items:center;
  -webkit-box-pack:center;justify-content:center;
  -webkit-box-shadow:0 8px 22px rgba(30,50,20,.24);box-shadow:0 8px 22px rgba(30,50,20,.24)}
.centro .pecabox .medalhao img{width:100%;height:100%;object-fit:contain;display:block}
@media (max-height:620px){ .centro .pecabox .medalhao{width:124px;height:124px;padding:10px} }

/* ==== O QUE A PONTE PRECISA (vale para todas as mecanicas) ==== */
/* a barra de DENTRO da fase (quantas palavras achou, que rodada e esta) — a de
   cima, do motor, e a da atividade inteira. Duas informacoes diferentes, entao
   as duas ficam; esta e menorzinha para nao competir com a de cima.          */
.progpeca{height:6px;margin:2px 0 10px;opacity:.85}
/* ⚠️ o SELO da peca e o mesmo rotulo que o motor ja poe em cima, vindo do
   conteudo.json: duas plaquinhas iguais, uma embaixo da outra, so ocupam a tela
   da crianca. O BALAO da peca FICA — nele mora a pergunta da rodada, que muda
   dentro da fase e nao esta no enunciado.                                    */
.pecabox .selo{display:none}
/* ⚠️ LICAO PAGA, medida: com o enunciado da FASE em cima e o balao da PECA
   logo abaixo, o tabuleiro do jogo da memoria comecava tao baixo que 4 das 8
   cartas caiam fora da tela de 640px do monitor da escola. Da para rolar, mas
   memoria e um jogo de VER o tabuleiro: metade escondida acaba com a mecanica.
   E o dobro de enunciado tambem e defeito por si so — a regra da casa e uma
   ideia por tela, enunciado curto (carga cognitiva).
   Entao: quando a peca escreve o balao DELA (a pergunta da rodada), o
   enunciado da fase recolhe. Ele ja foi FALADO na abertura da fase, e o botao
   "Ouvir de novo" continua repetindo — nao se perde nada, ganha-se a tela. */
.centro.tembalaopeca > .balao{display:none}
/* ⚠️⚠️ A COLISAO DE CSS QUE DESMONTAVA O TABULEIRO. Toda peca constroi a tela
   dela com `el("div","tela")` e `el("div","centro")` — os mesmos nomes do
   motor, o que ate aqui era uma vantagem (por isso nenhuma peca precisou ser
   reescrita). So que no motor `.tela` e uma CAMADA ABSOLUTA DE TELA CHEIA
   (`position:absolute;inset:0`) em coluna. Dentro da fase, a tela da peca
   virava uma camada solta por cima de tudo, sem largura propria — e o
   tabuleiro do jogo da memoria, que devia ficar em 3 colunas, empilhava as 8
   cartas numa coluna so, 950px de altura: quatro delas fora da tela do
   monitor da escola. Medido: as 8 cartas no MESMO x.
   Aqui a tela da peca volta a ser o que ela e por dentro da fase: um bloco
   comum. O CSS proprio da peca (com `.mec-<nome>` na frente) manda no resto. */
.pecabox{width:100%}
.pecabox > .tela{position:static;inset:auto;display:block;padding:0;
  -webkit-animation:none;animation:none;height:auto;overflow:visible}
.pecabox > .tela > .centro{width:100%}

  /* ⭐⭐ A VOZ DIZ O QUE ESTA ESCRITO NA TELA — sempre.

  __balaoNarrado = "";

    cen.appendChild(el("div","hint","(mecanica '"+f.mec+"' nao registrada)"));
    return; }
  /* ⚠️⚠️ LICAO PAGA (RIGHT NOW, ago/2026), o Marcos VIU: *"no relatorio final
     constou zero acertos, mesmo eu fazendo"*. As pecas fecham a fase mas NENHUMA
     chamava `regFase` — entao `MED.ev` ficava vazio e o boletim/relatorio

  var _aoFimOrig = aoFim;

  };
  m(f, cen, aoFimReg);

}

var DOM = {}, ROTCRI = {}, TREINO = {}, FASES_MESTRE = [];

function preparaIdentidade(){
  var i, f, c;
  /* ⚠️ a ORDEM importa: primeiro o que a crianca ja tinha feito (a retomada de
     55 min), DEPOIS os objetivos que faltarem. Ao contrario, o `DOM={}` novo
     apagava o progresso salvo — a criança voltava e o boletim estava zerado. */
  carregaEstado();

    f = FASES[i];
    /* o menu do professor guarda o NOME de uma funcao global (e assim que o
       telaMestre do mascote o le) — entao cada fase ganha a sua */
    window["_f" + i] = (function(k){ return function(){ abreFase(k); }; })(i);
    FASES_MESTRE.push(["_f" + i, (i + 1) + ". " + semTag(f.selo || f.id)]);
    c = f.conceito;
    if(!c) continue;
    if(!DOM.hasOwnProperty(c)) DOM[c] = 0.3;      /* objetivo novo desta versao */
    if(!ROTCRI[c]) ROTCRI[c] = ROTULOS[c] || c;   /* nome em lingua de crianca */
    if(!TREINO[c]) TREINO[c] =
      (function(k){ return function(){ abreFaseTreino(k); }; })(i);
  }
  /* o fundo saiu do CSS (era um `url(img/...)` cravado no CSS, com o nome da atividade de origem) e virou dado:
     assim ele nao viaja calado para a proxima atividade */
  if(ID.fundo){ var bg = document.getElementById("bg");
    if(bg) bg.style.backgroundImage = "url(img/" + ID.fundo + ")"; }

/* ⭐⭐ UMA VOZ SO. ⚠️ LICAO PAGA (ago/2026), pega pelo Marcos jogando: *"nas
   atividades tem duas vozes falando ao mesmo tempo"*.

   15 das 76 pecas usam a voz do NAVEGADOR (`speechSynthesis`) para nao ficarem
   mudas quando sao testadas SOZINHAS na bancada — o que e certo la. Mas dentro
   de uma atividade montada quem fala e o MOTOR, com o mp3 do Edge TTS: as duas
   vozes saem juntas, uma por cima da outra. So duas pecas tinham o guarda.

   Aqui a voz do navegador e DESLIGADA de uma vez, para as 76: numa atividade
   montada existe o mp3, e voz de navegador nunca vai para a crianca (regra da
   casa). O que a peca queria dizer continua sendo dito — pelo olheiro do balao,
   com a voz de verdade. */
/* ⚠️⚠️ LICAO PAGA (ago/2026), e o Marcos pegou NO CELULAR, nao no PC:
   *"tem voz do navegador junto com a voz do Antonio e as vezes os dois falam ao
   mesmo tempo"*. No meu teste de mesa a medicao dava ZERO chamadas — e dava
   mesmo. A primeira versao deste guarda fazia
       window.speechSynthesis.speak = vazio;
   que e uma atribuicao de propriedade PROPRIA num objeto do navegador. No
   Chrome de mesa ela cria a sombra e funciona; no celular (e no Safari) o
   objeto costuma recusar a propriedade nova **em silencio** — sem erro, sem
   excecao — e o `speak` original continua ali, falando por cima do mp3 do
   Antonio.
   Por isso agora sao TRES camadas, e basta uma pegar:
     1. trocar o `window.speechSynthesis` inteiro por um objeto inerte;
     2. neutralizar o `speak` no PROTOTIPO (pega quem guardou a referencia);
     3. deixar o `SpeechSynthesisUtterance` sem texto — sem fala para enfileirar.
   A licao geral: guarda que depende de UMA atribuicao funcionar nao e guarda.
   E teste de mesa nao prova celular — o navegador de la e outro bicho. */
(function(){
  var vazio = function(){};
  var inerte = {
    speak: vazio, cancel: vazio, pause: vazio, resume: vazio,
    getVoices: function(){ return []; },
    speaking: false, pending: false, paused: false
  };
  /* 1) o objeto inteiro */
  try{ if(window.speechSynthesis) window.speechSynthesis.cancel(); }catch(e){}
  try{ Object.defineProperty(window, "speechSynthesis", {
         configurable: true, get: function(){ return inerte; } }); }catch(e){}
  /* 2) o prototipo — pega quem guardou a referencia antes de mim */
  try{ if(window.SpeechSynthesis && window.SpeechSynthesis.prototype){
         window.SpeechSynthesis.prototype.speak = vazio;
         window.SpeechSynthesis.prototype.cancel = vazio; } }catch(e){}
  /* 3) a propria fala nasce vazia */
  try{ if(window.SpeechSynthesisUtterance){
         var U = window.SpeechSynthesisUtterance;
         window.SpeechSynthesisUtterance = function(){ var u = new U(""); u.text = ""; return u; };
         window.SpeechSynthesisUtterance.prototype = U.prototype; } }catch(e){}
  /* 4) ultima linha: se ainda assim algo falar, cala na hora */
  try{ setInterval(function(){
         try{ if(inerte.speaking) inerte.cancel(); }catch(e){}
       }, 1500); }catch(e){}
})();

/* ==== A VOZ DA RODADA ====
   ⭐ O pilar SONORO, medido pela banca: *"16 fase(s) MUDA(S), sem nenhuma
   narracao"* e *"16 perguntas que mudam na tela sem mudar a voz — quem nao le
   aperta o alto-falante e ouve outra coisa"*.

   Por que acontecia: o motor narra o ENUNCIADO DA FASE (o do conteudo.json).
   Mas a peca troca a pergunta DENTRO da fase, a cada rodada, e essa troca o
   motor nao via. A crianca de 2o ano ouvia a instrucao da 1a rodada e, da 2a
   em diante, ficava sem instrucao nenhuma. E o botao "Ouvir de novo" repetia a
   fala da fase, nao a pergunta que estava na tela — pior que silencio.

   O conserto nao e por mecanica (seriam 74): e um olheiro no balao. Toda vez
   que o texto do balao de dentro da fase muda, se existir voz gravada para
   AQUELE texto (a conta e o sha do proprio texto, a mesma do alto-falante das
   respostas), ele fala. Como o `falas.json` sai do proprio `dados`, a voz e o
   texto nao tem COMO divergir.                                              */
(function(){
  var ultimo = "";
  function olha(){
    var box = document.getElementsByClassName("pecabox")[0];
    if(!box) { ultimo = ""; return; }
    var bs = box.getElementsByClassName("balao");
    if(!bs.length) return;
    var b = bs[0], txt = (b.textContent || "").replace(/\s+/g, " ").replace(/^ | $/g, "");
    if(!txt || txt === ultimo) return;
    ultimo = txt;
    /* ⭐ a voz de CADA RODADA e so para quem nao le (ate o 2o ano). Do 3o em
       diante a instrucao da fase ja foi narrada uma vez e o resto e por botao —
       repetir a cada rodada e o que o Marcos disse que os maiores nao gostam. */
    if(typeof ID === "object" && ID.narrar !== "tudo") return;
    if(typeof temVoz !== "function") return;
    var k = temVoz(txt);
    /* sem voz gravada nao inventa nada: ficar calado e melhor que falar
       outra coisa (foi esse o defeito que o Marcos cobrou tres vezes). */
    /* ⚠️ SEM ECO: o motor ja le o balao ao abrir a fase e fala. Se o olheiro
       falar o MESMO texto, o audio reinicia e a crianca ouve o comeco duas
       vezes — foi o que o Marcos ouviu. O olheiro so entra quando a pergunta
       MUDA dentro da fase, que e para isso que ele existe. */
    if(k && k === window.__falouAgora) return;
    window.__falouAgora = k;
    /* o arquivo gravado e `op_<conta>.mp3` — ver o mesmo conserto no motor */
    if(k && typeof falaDaTela === "function") falaDaTela("op_" + k);
  }
  if(window.MutationObserver){
    var alvo = document.getElementById("app");
    if(alvo) new MutationObserver(function(){ setTimeout(olha, 70); })
      .observe(alvo, {childList:true, subtree:true, characterData:true});
  }
})();

/* ⭐⭐ A COMEMORACAO DO ACERTO — PARA AS 76 MECANICAS DE UMA VEZ.

   Cobranca do Marcos (ago/2026), testando no celular: *"nao tem a comemoracao
   quando acerta como no Broto"*. Eu tinha consertado na peca que ele testou —
   e ele respondeu "com certeza" quando ofereci levar para as outras.

   ⚠️ POR QUE AQUI E NAO EM CADA PECA: sao 76 pecas, cada uma com o seu jeito de

   O que a crianca ve: o alvo PULA e sobem faisquinhas coloridas em volta. Sem

(function(){

  /* ⚠️ cada mecanica chama o acerto pelo SEU nome. Medido nas 11 da Padaria:
     `ok`/`certa` (escolher, ordenar), `cheia` (vaga preenchida em juntar-silabas
     e pintar), `par` (memoria). Sem esta lista a festa so aparecia em 5 das 11 —
     e eu quase reportei "vale para todas".

/* ==== FERRAMENTAS QUE AS PECAS USAM E O MOTOR NAO TINHA ====
   ⚠️ LICAO PAGA (achada pelo auditor-jogador, na 3a fase): o integrador so
   trazia o SEGUNDO <script> da peca (a mecanica). O PRIMEIRO — o motorzinho do
   MOLDE — ficava para tras, e com ele o `nota()` que faz o som. A peca escolher
   passou, a completar passou, e a MEMORIA morreu no primeiro som de carta
   virando. O motor tem `tom()`, mas as pecas foram afinadas com estes numeros
   (PESQUISA-SOM-E-GAMEFEEL), entao o `nota` vem junto.

   ⚠️⚠️ E A SEGUNDA METADE DA MESMA LICAO: o `ac` da peca e uma FUNCAO (destrava
   o som), e o `ac` do motor e o OBJETO AudioContext — o mesmo que alimenta o
   lip-sync do mascote. Declarar a funcao aqui NAO deu erro nenhum: o `var ac=`
   do motor simplesmente sobrescreveu, e a memoria voltou a morrer, agora com
   'ac is not a function'. Nome igual e TIPO diferente e a colisao que nao
   aparece. Solucao: `nota` usa o AudioContext do motor direto, e cada peca
   ganha o SEU `ac()` local dentro do fechamento (ver PONTE) — que destrava com
   `arma()`, o nome que o motor usa para isso, e devolve o contexto.

   Todo o resto do motorzinho (el, limpa, setProg, mostraDica, mostraBanner,
   baguncar, sCerto, sErro, sTap, festa) o motor ja tem com o MESMO nome E o
   mesmo tipo — e por isso a peca nunca precisou ser reescrita. */
function nota(f, dur, vol, tipo, atraso){
  if(typeof arma === "function") arma();
  var c = window.ac; if(!c || !c.createOscillator) return;
  try{
    var o = c.createOscillator(), g = c.createGain(), t = c.currentTime + (atraso||0);
    o.type = tipo || "triangle"; o.frequency.value = f;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol || 0.18, t + 0.014);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(c.destination); o.start(t); o.stop(t + dur + 0.02);
  }catch(e){}
}
/* ⭐ CONFETE — o Marcos pediu a memoria "fantastica, com confetes" (ago/2026).

function confete(n){

      var s=document.createElement("style"); s.id="kf-confete";
      s.textContent="@-webkit-keyframes mcai{to{-webkit-transform:translateY(112vh) rotate(680deg);transform:translateY(112vh) rotate(680deg);opacity:.2}}@keyframes mcai{to{-webkit-transform:translateY(112vh) rotate(680deg);transform:translateY(112vh) rotate(680deg);opacity:.2}}";
      document.head.appendChild(s);
    }
    var cores=["#ff5252","#ffd54a","#59c24b","#3c9bff","#c58bf0","#ff9f43","#26d0b0"];
    var box=document.createElement("div");
    box.style.cssText="position:fixed;left:0;top:0;right:0;bottom:0;pointer-events:none;z-index:9999;overflow:hidden";
    var i,N=n||36;
    for(i=0;i<N;i++){
      var p=document.createElement("i"),c=cores[i%cores.length];
      var L=Math.random()*100, dur=1.1+Math.random()*1.2, del=Math.random()*.25, sz=6+Math.random()*8;
      p.style.cssText="position:absolute;top:-16px;left:"+L+"%;width:"+sz+"px;height:"+(sz*0.6)+
        "px;background:"+c+";border-radius:2px;opacity:.96;"+
        "-webkit-animation:mcai "+dur+"s "+del+"s ease-in forwards;animation:mcai "+dur+"s "+del+"s ease-in forwards";
      box.appendChild(p);
    }
    document.body.appendChild(box);
    setTimeout(function(){ if(box.parentNode) box.parentNode.removeChild(box); }, 2700);
  }catch(e){}
}

       funcionam"*. So o botao OUVIR A PALAVRA era mudo.
       A causa: a peca sozinha nao tem gravacao nenhuma, entao ela fala pela
       VOZ ROBO do navegador (`speechSynthesis`). No PC da escola essa voz
       simplesmente nao existe (nao ha voz pt-BR instalada) — e falha CALADA,
       sem erro nenhum. O enunciado e as opcoes funcionavam porque passam pelo
       motor, que toca MP3 gravado.
       Aqui a ponte reaponta o `diz` da peca para a voz da casa. A conta da
       chave ignora maiusculas (`chaveVoz` faz `toLowerCase`), entao a palavra
       "pao" acha a gravacao feita para "PAO" — a mesma que o alto-falante da
       opcao ja usa. So cai na voz do navegador se nao houver gravacao. */
    var diz = function(txt){
      try{
        /* ⚠️⚠️ LICAO PAGA (ago/2026), e foi o Marcos quem OUVIU: *"o da padaria
           agora e falado duas vezes juntos, soa estranho"*.
           Varias pecas ganharam, no mesmo dia, a boa ideia de NARRAR SOZINHAS ao
           abrir — porque na bancada, sem motor, a fase ficava muda. So que dentro
           da atividade quem narra o balao e o MOTOR, sempre narrou. As duas vozes
           partiam juntas e se atropelavam.
           A peca nao tem como saber se esta na bancada ou na atividade; quem sabe
           e a ponte. Entao e AQUI que se decide: se o texto pedido e o mesmo que o
           motor ja esta dizendo (ou acabou de dizer, na meia janela de abertura da
           fase), a peca cala — o motor ja cumpriu o pedido dela. Qualquer outra
           fala (a palavra, a silaba, a dica) passa normalmente. */
        var _limpa = function(s){ return String(s||"").replace(/<[^>]*>/g," ")
          .replace(/&[a-z]+;|&#\d+;/gi," ").replace(/\s+/g," ").trim().toLowerCase(); };
        var _agora = _limpa(txt);
        if(_agora && window.__dizMotor && window.__dizMotor === _agora) return;
        try{
          var _b = document.getElementsByClassName("balao")[0];
          if(_b && _limpa(_b.textContent) === _agora){
            window.__dizMotor = _agora;
            setTimeout(function(){ window.__dizMotor = null; }, 1200);
            return;
          }
        }catch(_e){}
        var k = (typeof temVoz === "function") ? temVoz(txt) : null;
        if(k && typeof tocaVoz === "function"){ tocaVoz(k); return; }
        if(!window.speechSynthesis || !window.SpeechSynthesisUtterance) return;
        var u = new SpeechSynthesisUtterance(txt);
        u.lang = "pt-BR"; u.rate = .9; u.pitch = 1.05;
        window.speechSynthesis.cancel(); window.speechSynthesis.speak(u);
      }catch(e){}
    };
    limpa();

/* ====== A PEÇA COMEÇA AQUI ====== */

/* O CONTEÚDO É SÓ EXEMPLO (partes da planta, 8 anos). Ao copiar a peça para
   uma atividade, troque APENAS este bloco: as gavetas, as fichas e as três
   dicas (dica -> apoio concreto -> revela). Duas ou três gavetas; mais que
   isso a criança não segura na cabeça de uma vez.                          */
/* `img` da GAVETA e OPCIONAL (vai vazio no exemplo de proposito, para o
   montador aprender que o campo existe): com figura, a gaveta mostra o desenho
   EM CIMA do nome — quem ainda nao le reconhece a gaveta pelo desenho. Sem
   figura, fica so o nome, e nenhuma atividade antiga quebra. */
/* `rot` (opcional): com `img` E `rot:true` a gaveta mostra a figura fraca ATRAS
   e o NOME escrito na frente (classificar em grupos, onde o nome e o conteudo).
   `voz` (opcional): o que o alto-falante da gaveta fala (default = o nome). */
var GAVETAS=[
  {k:"raiz",  n:"A RAIZ<br>(embaixo da terra)", img:"", voz:"raiz",  rot:false},
  {k:"folha", n:"A FOLHA<br>(no ar, verde)",    img:"", voz:"folha", rot:false}
];
/* `img` e OPCIONAL e vai VAZIO no exemplo de proposito: e assim que o montador
   aprende que o campo existe (ele confere os campos da fase contra este bloco).
   Com figura, a ficha mostra o desenho em cima da palavra — no 1o ano tem quem
   ainda nao le. Sem figura, continua so a palavra, e nenhuma atividade antiga
   quebra. */
var FICHAS=[
  {t:"BEBE A ÁGUA",     alvo:"raiz",  img:""},
  {t:"SEGURA A PLANTA", alvo:"raiz",  img:""},
  {t:"PEGA O SOL",      alvo:"folha", img:""},
  {t:"FAZ O ALIMENTO",  alvo:"folha", img:""}
];
/* ⚠️⚠️ RESTO DE CLONE CRAVADO NA PECA (ago/2026) — o pior tipo, porque nao da
   erro nenhum e viaja para TODA atividade que usar esta mecanica.
   O balao desta peca dizia, em texto fixo: *"Cada ficha conta uma TAREFA DA
   PLANTA. Guarde a ficha na parte que faz essa tarefa."* — enunciado do Jardim
   do Broto, de onde a peca foi clonada. Na Padaria das Letras a crianca lia
   sobre planta enquanto separava BOLACHA e MAMAO. Eu so vi porque fotografei a
   tela; nenhum portao pega texto que esta certo em portugues.
   A REGRA: enunciado e CONTEUDO, entao mora na gaveta — nunca no corpo da
   peca. O texto abaixo e so o exemplo, e e neutro de proposito. */
var ENUN="Cada ficha vai numa gaveta. Toque na ficha e depois na gaveta certa.";
var DICAS=[
  "Pense onde essa coisa acontece: debaixo do chão ou no ar?",
  "A RAIZ fica na terra: ela puxa a água e segura a planta. A FOLHA fica no ar: ela recebe o sol e faz o alimento.",
  "Olhe a gaveta que está com a borda amarela: é ali que esta ficha mora."
];

var feitos=0;          /* fichas ja guardadas */
var fila=[], vez=0;    /* a esteira: a ordem das fichas e em qual estamos */
var passo=null;        /* o rodape "doce 2 de 6 - ja guardados: ..." */
var marcada=null;      /* a ficha escolhida pelo toque simples */
var barraP=null;       /* a barrinha de progresso, para andar sem refazer a tela */
var ger=0;             /* geracao da tela: mata setTimeout de fase que ja saiu */

/* ⭐ O GUARDA DO MOUSE FANTASMA. O celular dispara mousedown/mousemove/mouseup
   FALSOS logo depois do toque; sem este carimbo eles desmarcavam a ficha que a
   criança tinha acabado de escolher. Defeito pego DUAS vezes pelo Marcos.  */
var ultimoToque=0;
var pegou=null, fantasma=null, x0=0, y0=0, arrastando=false, fimArrasto=0;

function agora(){ return (new Date()).getTime(); }
function souDedo(){ return agora()-ultimoToque<800; }
function cliqueDeArrasto(){ return agora()-fimArrasto<350; }

/* ⭐⭐ A VOZ (pilar SONORA). Quem toca a voz DE VERDADE e a ponte do integrador
   (`_padrao/ESQUELETO/integrar.py`), que injeta um `var diz = function(txt)`
   ligado nas gravacoes da casa (Edge TTS) ANTES do corpo da peca. Aqui a peca
   so PEDE — e pede protegida por `typeof`, porque na bancada, sozinha, nao ha
   gravacao nenhuma e nada pode estourar.
   ⚠️ NUNCA chamar `speechSynthesis` daqui: a voz-robo do navegador briga com a
   voz da casa (dois falando junto, defeito que o Marcos ja ouviu) e o portao
   `_qa/vozrobo.py` reprova. Tudo o que a voz diz esta TAMBEM escrito na tela,
   entao PC sem caixa de som continua jogando a peca inteira. */
function semTag(t){
  var d=document.createElement("div");
  d.innerHTML=String(t===undefined||t===null?"":t).replace(/<br\s*\/?>/gi," ");
  return (d.textContent||d.innerText||"").replace(/\s+/g," ").replace(/^ | $/g,"");
}
function fala(txt){
  var t=semTag(txt);
  if(!t) return;
  if(typeof diz==="function") diz(t);
}
/* a FIGURA. `img` chega como o NOME do arquivo ("raiz" -> img/raiz.png), que e
   a convencao da casa; um endereco pronto (com "/" ou "data:") tambem serve. */
function figura(nome,cls){
  var s=String(nome), im=el("img",cls);
  im.src=(s.indexOf("/")>=0||s.indexOf("data:")===0)?s:("img/"+s+".png");
  im.alt="";
  return im;
}

function pecaClassificar(){
  feitos=0; marcada=null; pegou=null; arrastando=false; ger++;
  limpa();
  var t=el("div","tela");
  setProg(t,0);
  barraP=t.querySelector(".prog i");
  var c=el("div","centro");
  c.appendChild(el("div","selo","ONDE CADA UMA MORA?"));
  c.appendChild(el("div","balao",ENUN));

  /* ⭐ A ESTEIRA — UMA FICHA POR VEZ (decisao do Marcos, ago/2026: *"pode ficar
     mais bonita, intuitiva, moderna e profissional"*, e ele deixou a escolha
     comigo). Antes a crianca encarava SEIS coisas de uma vez: quatro fichas,
     duas gavetas e o enunciado. Agora vem UMA ficha, grande, e so ha duas
     escolhas — uma ideia por tela (carga cognitiva, Sweller). Ela erra menos
     por confusao e mais por CONTEUDO, que e o erro que ensina.
     ⚠️ o gesto de ARRASTAR nao se perde: a ficha unica continua arrastavel, e
     o toque-toque continua valendo. Trocar a mecanica para "escolher" teria
     estreitado o leque que o `_qa/padrao.py` mede. */
  fila=[]; vez=0;
  var i;
  for(i=0;i<FICHAS.length;i++) fila.push(FICHAS[i]);
  baguncar(fila);
  var band=el("div","bandeja"); band.id="esteira";
  c.appendChild(band);

  var gs=el("div","gavs");
  for(i=0;i<GAVETAS.length;i++) gs.appendChild(fazGaveta(GAVETAS[i]));
  c.appendChild(gs);

  passo=el("div","passo","");
  c.appendChild(passo);
  /* ⚠️ POUCO TEXTO para os pequenos (regra do Marcos, ago/2026: "eles nao leem
     ainda, nao adianta muito texto explicativo"). No modo so-imagem a dica fica
     curtinha; quem carrega a instrucao e a NARRACAO e o alto-falante, nao a
     frase. Nas turmas que ja leem, a dica completa (as duas portas de entrada). */
  var _soImg=true, _hi; for(_hi=0;_hi<FICHAS.length;_hi++){ if(FICHAS[_hi].pal||FICHAS[_hi].sen){ _soImg=false; break; } }
  c.appendChild(el("div","hint", _soImg
    ? "Toque na ficha e leve at&#233; a gaveta."
    : "Toque na ficha e depois na gaveta. Tamb&#233;m d&#225; para arrastar com o dedo ou com o mouse. No alto-falante amarelo d&#225; para ouvir a palavra de novo."));
  t.appendChild(c);
  app.appendChild(t);
  poeAVez();
}

/* poe na esteira a ficha da vez. Fase acabada = esteira vazia. */
function poeAVez(){
  var e=document.getElementById("esteira");
  if(!e) return;
  e.innerHTML="";
  if(vez<fila.length){
    var f=fila[vez];
    /* ⭐ o alto-falante fica DENTRO da carta da vez (imagem + valor + som, na
       horizontal). ⚠️ tem que ser FILHO do `.pc`: se ficar como irmao, o motor
       (poeVozes/poeZap) nao o enxerga e ADICIONA um segundo — dois alto-falantes
       na mesma ficha (defeito medido na Lojinha, ago/2026). Dentro do `.pc` o
       motor reaproveita este e so troca a fiacao. */
    var fichaEl=fazFicha(f);
    fichaEl.appendChild(fazZap(f));
    e.appendChild(fichaEl);
    /* e a ficha JA CHEGA falando o proprio nome — e o que substitui a leitura
       para quem ainda nao le (a figura mostra, a voz diz, a palavra fica). */
    fala(f.t);
  }
  if(passo){
    var ja=[], i;
    for(i=0;i<vez;i++) ja.push(fila[i].t);
    /* ⚠️ RESTO DE CLONE que morava aqui (ago/2026): o rodape dizia "doce 2 de
       6" — palavra da Doceria, de onde este contador veio. Numa fase de plantas
       a crianca lia "doce 1 de 4". Contador e da PECA, entao a palavra dele tem
       que ser neutra. */
    passo.innerHTML = (vez<fila.length ? ("ficha "+(vez+1)+" de "+fila.length) : "todas guardadas")
      + (ja.length ? (" &middot; j&aacute; guardadas: "+ja.join(", ")) : "");
  }
}

/* o alto-falante da ficha da vez. E BOTAO de verdade (54px, bem acima dos 44
   minimos) e nao responde como resposta: so fala. */
function fazZap(f){
  var z=el("button","zap","");
  z.setAttribute("type","button");
  z.setAttribute("aria-label","Ouvir a palavra");
  z.appendChild(el("i","fone",""));
  z.onclick=function(ev){
    var e2=ev||window.event;
    if(e2&&e2.stopPropagation) e2.stopPropagation(); else if(e2) e2.cancelBubble=true;
    sTap(); fala(f.t);
  };
  return z;
}

function fazFicha(f){
  /* ⭐ a FIGURA junto da palavra: no 1o ano tem quem ainda nao le, e a ficha
     so com texto ("BOLACHA") virava adivinhacao. Se a fase nao trouxer figura,
     a ficha continua so com a palavra — nenhuma atividade antiga quebra. */
  var p=el("div","pc","");
  if(f.img){
    var mo=el("div","pcmold","");
    mo.appendChild(figura(f.img,"pcfig"));
    p.appendChild(mo);
  }
  p.appendChild(el("b","pctxt",f.t));
  /* ficha e gaveta publicam a MESMA chave: e assim que o auditor-jogador
     consegue terminar a fase (e so ele olha para isto). */
  p.setAttribute("data-qa",f.alvo);
  p.onclick=function(){
    if(cliqueDeArrasto()) return;          /* este clique e o rabo do arrasto */
    if(p.className.indexOf("usada")>=0) return;
    seleciona(p);                          /* o som de pegar sai la dentro */
  };
  p.onmousedown=function(ev){
    if(souDedo()) return;                  /* mouse FANTASMA do celular: ignora */
    comeca(p,ev.clientX,ev.clientY);
  };
  p.addEventListener("touchstart",function(ev){
    ultimoToque=agora();
    var d=ev.touches[0];
    comeca(p,d.clientX,d.clientY);
  },false);
  return p;
}

/* ⚠️ NUNCA `preventDefault` no touchstart acima — mata o toque no celular.
   Ele mora no touchmove, la embaixo, e so enquanto ha ficha na mao.        */
function comeca(p,x,y){
  if(p.className.indexOf("usada")>=0) return;
  pegou=p; x0=x; y0=y; arrastando=false;
  seleciona(p);
}

function move(x,y){
  if(!pegou) return;
  if(!arrastando){
    if(Math.abs(x-x0)+Math.abs(y-y0)<10) return;
    arrastando=true;
    fantasma=el("div","fant",pegou.innerHTML);
    document.body.appendChild(fantasma);
  }
  fantasma.style.left=(x-52)+"px";
  fantasma.style.top=(y-24)+"px";
}

function solta(x,y){
  if(!pegou) return;
  var p=pegou; pegou=null;
  if(fantasma&&fantasma.parentNode){ fantasma.parentNode.removeChild(fantasma); }
  fantasma=null;
  if(!arrastando) return;                  /* foi so um toque: a selecao ja valeu */
  arrastando=false; fimArrasto=agora();
  var alvo=document.elementFromPoint(x,y);
  while(alvo&&alvo.nodeType===1&&String(alvo.className).indexOf("cam")<0) alvo=alvo.parentNode;
  if(alvo&&alvo.nodeType===1&&String(alvo.className).indexOf("cam")>=0) guarda(p,alvo);
}

document.onmousemove=function(ev){ if(souDedo()) return; move(ev.clientX,ev.clientY); };
document.onmouseup=function(ev){ if(souDedo()) return; solta(ev.clientX,ev.clientY); };
document.addEventListener("touchmove",function(ev){
  ultimoToque=agora();
  if(!pegou) return;
  var d=ev.touches[0];
  move(d.clientX,d.clientY);
  if(arrastando) ev.preventDefault();      /* so aqui, e so com ficha na mao */
},{passive:false});
document.addEventListener("touchend",function(ev){
  ultimoToque=agora();
  var d=ev.changedTouches[0];
  solta(d.clientX,d.clientY);
},false);

function seleciona(p){
  var a=app.getElementsByClassName("pc"), i;
  for(i=0;i<a.length;i++)
    if(a[i].className.indexOf("usada")<0) a[i].className="pc";
  p.className="pc sel";
  /* ⭐ o SOM DO GESTO: a ficha saiu do lugar. Curto e baixo — a crianca fica
     uma aula inteira aqui, e som que dura vira barulho. Vale para os TRES
     caminhos (mouse, dedo e toque simples), porque todos passam por aqui. */
  if(typeof sPega==="function") sPega(); else sTap();
  marcada=p;
}

function fazGaveta(g){
  var d=el("div","cam");
  if(g.img && g.rot) d.className="cam temrot";   /* figura fraca + NOME em faixa embaixo */
  d.setAttribute("data-qa",g.k);
  /* ⭐ SEM TEXTO na gaveta (pedido do Marcos, 1o ano nao le): a identidade da
     gaveta e a FIGURA do dinheiro — grande, CENTRALIZADA e levemente
     transparente (~20%) — moeda numa, cedula na outra. A crianca reconhece
     pelo desenho e, se precisar, toca no alto-falante e OUVE o nome. */
  /* ⚠️⚠️ LICAO PAGA (Marcos, sólidos, ago/2026: *"as imagens quase
     desaparecendo... precisa ficar mais claro para o estudante o que tem que
     fazer"*). Toda gaveta com figura recebia SO a marca d'agua a 12% e, com
     `rot:false`, NEM o nome — a gaveta ficava um fantasma sem rótulo. Isso serve
     ao dinheiro (moeda/nota, 1o ano, ficha tambem é imagem), mas NAO ao caso em
     que a GAVETA é o conceito que a crianca esta aprendendo (o sólido). Agora:
       · `rot:true`  -> figura NITIDA no topo + NOME em faixa (modo "aprender a
                        categoria": a identidade da gaveta tem que estar clara);
       · `rot:false` + img -> marca d'agua fraca (legado dinheiro), inalterado;
       · sem img -> só o nome. */
  if(g.img && g.rot){
    d.appendChild(figura(g.img,"gfig"));            /* figura nitida, 66px */
  }else if(g.img){
    var w=el("div","gwater"); w.appendChild(figura(g.img,"")); d.appendChild(w);
  }
  /* ⚠️ LICAO PAGA (Teatro das Palavras, 5o ano, ago/2026): a gaveta SO mostrava
     a figura (regra do 1o ano, que nao le). Numa atividade de texto — separar
     PRONOME PESSOAL x DEMONSTRATIVO — as gavetas nao tem figura (img:"") e
     ficavam DUAS CAIXAS PRETAS VAZIAS: a crianca nao sabia qual era qual. Quando
     nao ha figura, a gaveta mostra o NOME escrito. Gaveta com figura (Lojinha)
     nao muda: continua so a figura + alto-falante.
     ⚠️⚠️ LICAO PAGA (Museu, 3o ano, ago/2026): CLASSIFICAR EM GRUPOS. A gaveta
     "MAMIFERO/AVE/REPTIL" e o proprio conteudo que a crianca esta aprendendo — o
     NOME tem que estar VISIVEL, nao adianta so a marca d'agua a 12% (um cachorro
     apagado nao diz "mamifero" para quem esta descobrindo o que e mamifero). Com
     `rot:true` a gaveta mostra a figura fraca ATRAS e o rotulo escrito NA FRENTE.
     Sem `rot` (Lojinha 1o ano) continua so a figura, exatamente como antes. */
  if(!g.img || g.rot){ d.appendChild(el("div","gnome", g.n)); }
  /* alto-falante: toca e OUVE o nome da gaveta ("moeda"/"nota"). No canto, sem
     texto por perto (nao ha o que sobrepor). Para o clique (senao viraria
     "guardar a ficha aqui"). */
  var vz=el("button","gzap"); vz.setAttribute("aria-label","Ouvir");
  vz.appendChild(el("span","fone"));
  vz.setAttribute("data-voz", g.voz || semTag(g.n));
  vz.onclick=function(ev){ if(ev){ if(ev.stopPropagation)ev.stopPropagation(); }
    sTap(); fala(g.voz || semTag(g.n)); };
  d.appendChild(vz);
  d.onclick=function(){
    if(cliqueDeArrasto()) return;
    if(!marcada){
      /* ⭐ tocou na gaveta sem ficha na mao: em vez de nao acontecer nada, a
         gaveta DIZ o proprio nome. A crianca que ainda nao le descobre o que
         esta escrito ali sem precisar acertar nada. */
      sTap(); fala(g.n);
      mostraDica("Primeiro toque na ficha lá de cima. Depois toque na gaveta.");
      return;
    }
    guarda(marcada,d);
  };
  return d;
}

function guarda(p,g){
  if(!p||!g) return;
  if(p.className.indexOf("usada")>=0) return;
  if(g.getAttribute("data-qa")===p.getAttribute("data-qa")){
    if(typeof sPoe==="function") sPoe();   /* o peso caindo na bandeja */
    sCerto();
    /* ⭐ a ficha CAI na gaveta com um pulinho curto (0,34s) e a gaveta responde
       com uma batidinha: o encaixe se VE, nao so se ouve. */
    p.className="pc usada clcai";
    p.onclick=null; p.onmousedown=null;
    g.appendChild(p);
    g.className="cam luz";
    marcada=null;
    feitos++;
    vez++;
    var geP=ger;
    setTimeout(function(){ if(geP===ger) poeAVez(); },300);
    if(barraP) barraP.style.width=Math.round(feitos*100/FICHAS.length)+"%";
    var gg=g, ge=ger;
    setTimeout(function(){ if(ge!==ger) return; if(gg.className.indexOf("luz")>=0) gg.className="cam"; },500);
    if(feitos>=FICHAS.length){
      setTimeout(function(){
        if(ge!==ger) return;
        mostraBanner("Você guardou todas as tarefas no lugar certo!", fimDaPeca);
      },520);
    }
    return;
  }
  /* ERRO: não pune. Som grave curto, a ficha volta para a mão e o andaime CRESCE. */
  sErro();
  p._err=(p._err||0)+1;
  var dtx=DICAS[Math.min(p._err,DICAS.length)-1];
  mostraDica(dtx);
  /* ⭐ a AJUDA TAMBEM E FALADA: quem errou e justamente quem pode nao conseguir
     ler a dica. Escrita para quem le, dita para quem ainda nao le. */
  fala(dtx);
  if(p._err>=3) revela(p);
}

/* 3º erro: acende a gaveta certa e DEIXA seguir — é o que garante que a peça
   nunca trava. A informação também vai escrita na dica (nada só na cor).   */

MEC["completar"] = function(f, cen, fim){

  /* ⚠️⚠️ LICAO PAGA, e a mais silenciosa de todas: a peca da MEMORIA declara a

     `fim` SOMBREAVA o parametro da ponte — e o `mostraBanner` daqui, que devia
     levar a fase seguinte, chamava a peca de volta. Laco infinito, sem erro de
     JS nenhum: o jogador so ficava PRESO, com todos os pares ja fechados e a
     medalha da peca na tela. Por isso a continuacao mora AQUI FORA, com um nome
     que o integrador confere que nenhuma peca usa (ver `confere_contra_motor`).
     E ela so dispara UMA vez: peca que chama o banner duas vezes pularia fase. */
  var _seguir = function(){ if(_seguir.ja) return; _seguir.ja = 1; fim(); };
  /* recolhe o enunciado da fase assim que a peca puser o balao dela (ver CSS) */
  setTimeout(function(){
    var b = cen.getElementsByClassName("pecabox")[0];
    if(b && b.getElementsByClassName("balao").length)
      cen.className = cen.className + " tembalaopeca";
  }, 120);
  (function(){
    /* a peca acha que esta sozinha; estes ajudantes fazem o meio de campo */
    var app = cen;
    /* o `ac()` DESTA peca: destrava o som (o motor chama isso de `arma()`) e
       devolve o AudioContext do motor. Fica local, dentro do fechamento, para
       nao brigar com o `var ac` do motor — que e o objeto, nao a funcao. */
    function ac(){ if(typeof arma === "function") arma(); return window.ac; }
    function limpa(){ var g = cen.getElementsByClassName("pecabox")[0];
      if(g) g.innerHTML = ""; else { g = document.createElement("div");
      g.className = "pecabox"; cen.appendChild(g); } app = g; }
    /* ⚠️ LICAO PAGA: este ajudante era um VAZIO — "quem manda na barra e o
       motor". So que o caca-palavras faz `setProg(t,0)` e depois PEGA A BARRA
       DE VOLTA (`t.getElementsByTagName("i")[0]`) para mostrar quantas palavras
       ja achou. Com o vazio, ele pegava `undefined` e estourava no primeiro
       toque: 446 erros de JS numa partida. Regra: o ajudante da ponte tem que
       FAZER o que o de verdade faz — nao pode so nao atrapalhar.
       A barra da PECA e a de dentro da fase (5 palavras achadas de 8); a do
       MOTOR e a da atividade (fase 4 de 32). As duas informam coisas
       diferentes, entao as duas ficam — a de dentro, menorzinha (ver CSS). */
    function setProg(t, p){
      if(!t || !t.appendChild) return;

      var i = document.createElement("i"); i.style.width = (p || 0) + "%";
      pr.appendChild(i); t.appendChild(pr);

    /* ⚠️⚠️ LICAO PAGA (ago/2026), pega pelo Marcos JOGANDO: *"esta passando de
       fase sem aquele botao azul que aparecia com a palavra proximo... tem que
       ser parecida com a atividade do Broto"*.

       Esta ponte comemorava e PULAVA para a fase seguinte sozinha, 420ms
       depois. A crianca terminava uma fase e era JOGADA na outra: sem a tela de
       parabens, sem o mascote dizendo o que ela conseguiu, sem o botao para ela

       banner e a crianca TOCA para continuar. Era o fecho de toda fase de toda
       atividade montada que estava faltando.

       Agora a ponte chama o banner DE VERDADE do motor (`window.mostraBanner`,
       que a funcao local aqui dentro sombreia) e entrega o `_seguir` como o
       botao. A peca continua so avisando que acabou; quem manda no caminho

    function mostraBanner(msg, cb){
      if(typeof festa === "function") festa();
      /* ⚠️⚠️ LICAO PAGA (Teatro, ago/2026), o Marcos jogando: uma fase fechava

      if(msg) msg = msg.replace(/<div[^>]*class=["']?[^"'>]*medal[^"'>]*["']?[^>]*>[\s\S]*?<\/div>/gi, "");
      if(typeof window.mostraBanner === "function"){

    /* ⚠️⚠️ LICAO PAGA (ago/2026), e foi o Marcos quem ouviu: *"onde tenho que
       ouvir a palavra nao funciona; o enunciado funciona, os sons das opcoes
       funcionam"*. So o botao OUVIR A PALAVRA era mudo.
       A causa: a peca sozinha nao tem gravacao nenhuma, entao ela fala pela

       chave ignora maiusculas (`chaveVoz` faz `toLowerCase`), entao a palavra

    var diz = function(txt){

        /* ⚠️⚠️ LICAO PAGA (ago/2026), e foi o Marcos quem OUVIU: *"o da padaria

           A peca nao tem como saber se esta na bancada ou na atividade; quem sabe

           motor ja esta dizendo (ou acabou de dizer, na meia janela de abertura da
           fase), a peca cala — o motor ja cumpriu o pedido dela. Qualquer outra
           fala (a palavra, a silaba, a dica) passa normalmente. */
        var _limpa = function(s){ return String(s||"").replace(/<[^>]*>/g," ")
          .replace(/&[a-z]+;|&#\d+;/gi," ").replace(/\s+/g," ").trim().toLowerCase(); };
        var _agora = _limpa(txt);
        if(_agora && window.__dizMotor && window.__dizMotor === _agora) return;
        try{
          var _b = document.getElementsByClassName("balao")[0];
          if(_b && _limpa(_b.textContent) === _agora){
            window.__dizMotor = _agora;
            setTimeout(function(){ window.__dizMotor = null; }, 1200);
            return;
          }
        }catch(_e){}
        var k = (typeof temVoz === "function") ? temVoz(txt) : null;
        if(k && typeof tocaVoz === "function"){ tocaVoz(k); return; }
        if(!window.speechSynthesis || !window.SpeechSynthesisUtterance) return;
        var u = new SpeechSynthesisUtterance(txt);
        u.lang = "pt-BR"; u.rate = .9; u.pitch = 1.05;
        window.speechSynthesis.cancel(); window.speechSynthesis.speak(u);
      }catch(e){}
    };
    limpa();

/* ====== A PEÇA COMEÇA AQUI ====== */
/* COMPLETAR A LACUNA — a frase quase pronta e o pedaco que falta.
   Conteudo curto e neutro (8 anos). Trocar `FRASES` adapta a peca:
   ante = o que vem antes da lacuna · dep = o que vem depois ·
   cer = o pedaco certo · out = os distratores (plausiveis, nunca bobos) ·
   dic = a dica do 1o erro. */
/* ⭐ CADA PEDAÇO PODE SER PALAVRA **OU** PALAVRA COM FIGURA (ago/2026):
     "mel"                                   <- como sempre foi
     {t:"mel", img:"pd_mel", voz:"mel"}      <- com apoio visual
   · `t`   = o pedaço que entra na lacuna (obrigatório);
   · `img` = o nome da arte de IA, sem a pasta e sem o `.png` (OPCIONAL);
   · `voz` = o que o alto-falante diz, quando é diferente do escrito (OPCIONAL).
   Sem `img` nada muda: nenhuma atividade que já usa esta peça quebra.      */
var ENUN="Toque no peda&#231;o que <b>falta</b> na frase.";
var DEPOIS="Leia a frase inteira antes de escolher.";
var FECHO="Voc&#234; fechou todas as frases!";
var FRASES=[
  /* ⭐ a opcao pode ser STRING ("areia") ou OBJETO {t,voz}: `t` = o que a crianca
     VE (ex.: o digito "3"), `voz` = o que o alto-falante DIZ ("três"). Declarado
     no exemplo p/ o montador saber que a peca LE `t`/`voz`. */
  {img:"", ante:"O peixe vive na ",dep:".",cer:{t:"&#225;gua",voz:"água"},out:["areia","nuvem"],
   dic:"Pense no lugar onde o peixe <b>nada</b>."},
  {ante:"A abelha faz o ",dep:".",cer:"mel",out:["leite","p&#227;o"],
   dic:"&#201; docinho e fica guardado na colmeia."},
  {ante:"A chuva cai da ",dep:".",cer:"nuvem",out:["pedra","janela"],
   dic:"Olhe para o <b>c&#233;u</b> antes de come&#231;ar a chover."}
];
var rodada=0, errosSeg=0, respondida=false, telaAtual=null, barraP=null;
var _ultOkComp=-1;  /* posicao do pedaco certo na rodada passada (anti-repeticao) */
var lacuna=null, botoes=[];

/* ⚠️ A FIGURA vem do MOTOR (`imgEl`, que sabe onde mora a pasta `img/`). Aqui
   na bancada ela não existe, e o pedaço fica só com a palavra — que é o próprio
   contrato: `img` é OPCIONAL. Pegar por `window.imgEl` (e não `typeof imgEl`)
   deixa o nome DECLARADO, e o portão "função que não existe" consegue medir. */
var figEl = window.imgEl || null;

/* ⚠️⚠️ A VOZ É GRAVADA, SEMPRE. Dentro da atividade montada a ponte do
   integrador REAPONTA este `diz` para o mp3 da casa (Edge TTS). Sozinha, na
   bancada, a peça fica calada de propósito: voz-robô do navegador nunca vai
   para a criança (portão `_qa/vozrobo.py`). */
function diz(txt){
  if(!txt) return;
  if(typeof window.temVoz!=="function"||typeof window.tocaVoz!=="function") return;
  var k=window.temVoz(txt);
  if(k) window.tocaVoz(k);
}
function sPing(){ nota(880,.09,.12,"triangle",0); }

/* um pedaço pode ser PALAVRA ou {t,img,voz} — aqui os dois viram a mesma
   coisa, para o resto da peça não precisar saber a diferença. */
function pedacoDe(x){
  if(x&&typeof x==="object")
    return {t:x.t||"", img:x.img||null, voz:x.voz||x.t||""};
  return {t:String(x), img:null, voz:String(x)};
}
/* ⚠️ o tamanho do pedaço se mede no que a CRIANÇA vê, não no que está escrito
   no arquivo: "&#225;gua" tem 9 caracteres e 4 letras. Era por isso que uma
   fase de letras acentuadas nunca virava ladrilho — caía na tarja comprida. */
function tamanho(s){
  return String(s).replace(/&#\d+;/g,"x").replace(/&[a-z]+;/g,"x")
                  .replace(/<[^>]*>/g,"").length;
}

/* ⭐ O ALTO-FALANTE DE CADA PEDAÇO.
   ⚠️ ele NÃO escolhe: só fala. Sem parar o evento aqui, tocar no alto-falante
   valia como resposta — e a criança que só queria conferir a palavra levava um
   erro. Defeito já pago em atividade de verdade. */
function fazZap(txt,rot){
  var z=el("button","zap","");
  z.type="button";
  z.setAttribute("aria-label","Ouvir "+(rot||txt));
  z.onclick=function(ev){
    var e=ev||window.event;
    if(e.stopPropagation) e.stopPropagation(); else e.cancelBubble=true;
    if(e.preventDefault) e.preventDefault();
    sPing(); diz(txt);
    z.className="zap tocando";
    setTimeout(function(){ z.className="zap"; },900);
    return false;
  };
  return z;
}

/* ⚠️ trocar a roupa do pedaço SEM perder a `comfig`: quem manda na altura do
   pedaço com figura é ela, e um `className="opt ok"` cru derrubava a figura
   para o tamanho do pedaço sem desenho — a tela pulava no acerto. */
function veste(b,estado){
  var fig=(b.className.indexOf("comfig")>=0)?" comfig":"";
  b.className="opt"+fig+(estado?" "+estado:"");
  /* ⭐ selo verde "certo" no botao certo (modelo da fase 1): marca ESCRITA, nao
     so cor. So no acerto, e uma vez. */
  if(estado==="ok" && b.getElementsByClassName("marca").length===0)
    b.appendChild(el("span","marca","certo"));
}

/* ⭐ a comemoração curta do acerto: o pedaço sobe e cresce, e POUSA de volta.
   Duas transições, sem biblioteca e sem `@keyframes` (ver a lição no CSS). */
function festeja(b){
  setTimeout(function(){
    if(!telaAtual||!telaAtual.parentNode) return;
    if(b.className.indexOf("ok")>=0&&b.className.indexOf("pousa")<0)
      b.className=b.className+" pousa";
  },230);
}

function telaCompletar(){
  limpa(); document.onkeydown=null;
  errosSeg=0; respondida=false; botoes=[];
  var f=FRASES[rodada];
  var t=el("div","tela"); telaAtual=t;
  setProg(t,Math.round(rodada*100/FRASES.length));
  barraP=t.querySelector(".prog i");
  var c=el("div","centro");
  c.appendChild(el("div","selo","FRASE "+(rodada+1)+" DE "+FRASES.length));
  if(f&&f.img&&figEl){ var _qf=el("div","qfig",""); _qf.appendChild(figEl(f.img));
                       c.appendChild(_qf); }
  c.appendChild(el("div","balao",ENUN));
  var fr=el("div","frase",f.ante+'<span class="lac">_____</span>'+f.dep);
  c.appendChild(fr);
  lacuna=fr.querySelector(".lac");
  /* ⭐ NARRA O PROBLEMA depois do enunciado (Marcos, ago/2026: "na fase quanto
     falta deveria ter o áudio onde conta o problema, depois do enunciado"). Usa a
     voz GRAVADA da casa (a conta já está no falas.json); o `falar` do motor
     enfileira depois do enunciado. Se não houver gravação, fica calado — nunca
     voz-robô. Guardado por `typeof` para a bancada solta não estourar. */
  try{
    if(typeof temVoz==="function" && typeof falar==="function"){
      var _tir=function(s){ return String(s||"").replace(/<[^>]*>/g," ").replace(/\s+/g," ").replace(/^ | $/g,""); };
      var _fa=_tir(f.ante), _fad=_tir(f.ante+" "+f.dep);
      var _fk=temVoz(_fa)||temVoz(_fad);
      var _tela=t;
      if(_fk) setTimeout(function(){ if(_tela&&_tela.parentNode) falar("op_"+_fk); }, 520);
    }
  }catch(_e){}
  /* ⚠️ o embaralhado tem que acontecer com os pedaços JÁ normalizados: senão a
     comparação com a certa mudaria de forma (texto x objeto) no meio do
     caminho. É a armadilha da mecânica: na Fábrica de Estrelas a certa era
     sempre a 1ª e a criança aprendeu a POSIÇÃO, não o conteúdo. */
  var certo=pedacoDe(f.cer), lista=[certo], i, b, p;
  for(i=0;i<f.out.length;i++) lista.push(pedacoDe(f.out[i]));
  baguncar(lista);
  /* ⭐ ANTI-REPETICAO (Marcos, ago/2026: "todas as respostas estao sendo a 1").
     Com so 2 opcoes (mau/mal) o acaso deixa a certa no mesmo lugar metade das
     rodadas, e a crianca decora a POSICAO. Se caiu onde caiu na rodada passada,
     troca de lugar: a resposta certa ANDA de rodada em rodada. */
  if(lista.length>1){
    var _ok=-1,_kk; for(_kk=0;_kk<lista.length;_kk++){ if(lista[_kk]===certo){_ok=_kk;break;} }
    if(_ok===_ultOkComp){ var _al=(_ok+1)%lista.length,_tp=lista[_ok]; lista[_ok]=lista[_al]; lista[_al]=_tp; _ok=_al; }
    _ultOkComp=_ok;
  }
  /* pedaco curto (letra, silaba) -> ladrilhos lado a lado em vez de tarjas
     empilhadas. Ver a licao no CSS de `.opts.curtas`. */
  var curtas=true, soLetra=true, temfig=false;
  for(i=0;i<lista.length;i++){
    if(tamanho(lista[i].t)>4) curtas=false;
    if(tamanho(lista[i].t)>1) soLetra=false;
    if(lista[i].img&&figEl) temfig=true;
  }
  /* figura manda mais que ladrilho: o quadrado de 96px existe para a LETRA
     sozinha; com desenho, o pedaço vira cartão de duas colunas. */
  if(temfig){ curtas=false; soLetra=false; }
  /* ⭐ `letra` ou `silaba`: e o TEMA da atividade que pinta cada um (lousa para
     a letra, biscoito para o pedaco). A peca so DIZ o que aquilo e — ela nao
     escolhe cor nenhuma, senao a mecanica ficaria presa a uma atividade. */
  var cx=el("div","opts"+(curtas?(soLetra?" curtas letra":" curtas silaba"):"")
                        +(temfig?" comfigs":""));
  for(i=0;i<lista.length;i++){
    p=lista[i];
    b=el("div","opt"+(p.img&&figEl?" comfig":""),"");
    /* ⭐ o motor monta a chave da voz a partir do TEXTO da resposta — e aqui
       dentro há figura, alto-falante e, depois do acerto, o carimbo. DECLARAR
       o que a voz deve dizer é mais honesto do que fazer o motor adivinhar. */
    b.setAttribute("data-voz",p.voz);
    if(p.img&&figEl){ var g=el("div","opfig",""); g.appendChild(figEl(p.img)); b.appendChild(g); }
    var ln=el("div","oplin","");
    ln.appendChild(el("span","optxt",p.t));
    ln.appendChild(fazZap(p.voz,p.t));
    b.appendChild(ln);
    b.pedaco=p.t;
    b.certa=(p===certo);
    /* data-qa: a resposta que serve AGORA. E so para o auditor-jogador
       (_qa/jogador.js) conseguir fechar a rodada; a crianca nao ve nada. */
    b.setAttribute("data-qa",b.certa?"1":"0");
    b.onclick=escolheu;
    cx.appendChild(b); botoes.push(b);
  }
  c.appendChild(cx);
  c.appendChild(el("div","hint",DEPOIS));
  t.appendChild(c); app.appendChild(t);
}

function escolheu(){
  if(respondida) return;
  sTap();
  if(this.certa) acertou(this); else errou(this);
}
/* ⚠️ o temporizador da rodada continua correndo depois que a tela sai: sem o
   guarda `!telaAtual.parentNode` ele montaria a rodada por cima da tela
   seguinte. Armadilha registrada no _padrao/DINAMICAS.md. */
function acertou(b){
  respondida=true;
  veste(b,"ok");
  festeja(b);
  lacuna.className="lac cheia";
  lacuna.innerHTML=b.pedaco;
  sCerto(); apagaDica();
  if(barraP) barraP.style.width=Math.round((rodada+1)*100/FRASES.length)+"%";
  setTimeout(function(){
    if(!telaAtual||!telaAtual.parentNode) return;
    proxima();
  },600);
}
function errou(b){
  sErro(); errosSeg++;
  veste(b,"no treme");
  destreme(b);
  ajuda(errosSeg);
}
/* ⚠️ o tremor e feito com DUAS classes e transicao, nao com `@keyframes` — os
   keyframes da peca se perdem quando o integrador prefixa o CSS dela (medido
   no `pecas.css`), e o erro deixava de responder DENTRO da atividade, que e
   justamente onde a crianca esta. Esquerda -> direita -> parado. */
function destreme(b){
  setTimeout(function(){
    if(!telaAtual||!telaAtual.parentNode) return;
    if(b.className.indexOf("ok")<0&&b.className.indexOf("fora")<0) veste(b,"no treme2");
  },110);
  setTimeout(function(){
    if(!telaAtual||!telaAtual.parentNode) return;
    if(b.className.indexOf("ok")<0&&b.className.indexOf("fora")<0) veste(b,"no");
  },240);
}
/* o andaime CRESCE: dica -> tirar uma do caminho -> revelar e seguir.
   Nunca X, nunca "errou", nunca fica travado. */
function ajuda(n){
  if(n===1){
    mostraDica(FRASES[rodada].dic);
  }else if(n===2){
    mostraDica("Risquei uma que <b>n&#227;o serve</b>. Ficou mais f&#225;cil escolher.");
    riscaUmaErrada();
  }else{
    mostraDica("Era esta! Leia a frase inteira comigo.");
    revela();
  }
}
function riscaUmaErrada(){
