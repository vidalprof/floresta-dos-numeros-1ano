h1{font-size:31px;font-weight:700;color:#fff;text-shadow:0 2px 0 var(--tinta-d),0 4px 10px rgba(0,0,0,.3);margin:6px 0 2px;text-align:center}
.sub{font-size:15px;color:#fff;font-weight:600;margin-bottom:10px;text-shadow:0 1px 4px rgba(0,0,0,.4)}
/* mascote em camadas (lip-sync) */
.cacau{position:relative;width:186px;height:186px;-webkit-filter:drop-shadow(0 8px 10px rgba(0,0,0,.25));filter:drop-shadow(0 8px 10px rgba(0,0,0,.25));-webkit-animation:bob 2.8s ease-in-out infinite;animation:bob 2.8s ease-in-out infinite}
.cacau.gg{width:252px;height:252px}.cacau.pq{width:136px;height:136px}
.cacau .lay{position:absolute;left:0;top:0;width:100%;height:100%;object-fit:contain}
.cacau .fala,.cacau .pisca{opacity:0}
@-webkit-keyframes bob{0%,100%{-webkit-transform:translateY(0) rotate(-1.5deg)}50%{-webkit-transform:translateY(-8px) rotate(1.5deg)}}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-1.5deg)}50%{transform:translateY(-8px) rotate(1.5deg)}}
.btn{border:0;cursor:pointer;font-family:inherit;font-weight:700;font-size:19px;color:#fff;padding:15px 30px;border-radius:999px;
  background:-webkit-linear-gradient(top,#4f8bf0,var(--tinta));background:linear-gradient(#4f8bf0,var(--tinta));
  -webkit-box-shadow:0 6px 0 var(--tinta-d),0 12px 18px rgba(0,0,0,.28);box-shadow:0 6px 0 var(--tinta-d),0 12px 18px rgba(0,0,0,.28);
  -webkit-animation:beat 1.7s ease-in-out infinite;animation:beat 1.7s ease-in-out infinite}
.btn:active{-webkit-transform:translateY(4px) scale(.98);transform:translateY(4px) scale(.98);-webkit-box-shadow:0 2px 0 var(--tinta-d);box-shadow:0 2px 0 var(--tinta-d)}
.btn.dourado{background:-webkit-linear-gradient(top,#ffe06b,var(--dourado));background:linear-gradient(#ffe06b,var(--dourado));color:#6a4b00;-webkit-box-shadow:0 6px 0 var(--dourado-d),0 12px 18px rgba(0,0,0,.28);box-shadow:0 6px 0 var(--dourado-d),0 12px 18px rgba(0,0,0,.28);-webkit-animation:none;animation:none}
@-webkit-keyframes beat{0%,100%{-webkit-transform:scale(1)}50%{-webkit-transform:scale(1.04)}}@keyframes beat{0%,100%{transform:scale(1)}50%{transform:scale(1.04)}}
.prog{position:absolute;top:calc(11px + env(safe-area-inset-top));left:14px;right:14px;height:13px;background:rgba(255,255,255,.6);border-radius:999px;overflow:hidden;z-index:3;-webkit-box-shadow:inset 0 1px 3px rgba(0,0,0,.18);box-shadow:inset 0 1px 3px rgba(0,0,0,.18)}
.prog>i{position:absolute;left:0;top:0;bottom:0;background:-webkit-linear-gradient(top,#6fa0f5,var(--tinta));background:linear-gradient(#6fa0f5,var(--tinta));border-radius:999px;-webkit-transition:width .5s cubic-bezier(.2,.8,.3,1);transition:width .5s cubic-bezier(.2,.8,.3,1)}
.barra{position:fixed;left:0;right:0;bottom:calc(10px + env(safe-area-inset-bottom));z-index:12;display:-webkit-box;display:flex;-webkit-box-pack:center;justify-content:center;gap:10px;pointer-events:none}
.barra>*{pointer-events:auto}
.mini{border:0;cursor:pointer;font-family:inherit;font-weight:700;font-size:15px;padding:11px 18px;border-radius:999px;background:rgba(255,253,244,.96);color:var(--texto);-webkit-box-shadow:0 4px 12px rgba(0,0,0,.28);box-shadow:0 4px 12px rgba(0,0,0,.28)}

.mini.tocando{-webkit-animation:beat .9s ease-in-out infinite;animation:beat .9s ease-in-out infinite}
.selo{display:inline-block;background:var(--roxo);color:#fff;font-size:12.5px;font-weight:700;padding:5px 12px;border-radius:999px;margin-bottom:8px;letter-spacing:.3px}

/* FOTO da noticia */
.foto{width:250px;height:190px;background:var(--papel);border-radius:14px;padding:8px;-webkit-box-shadow:0 8px 20px rgba(50,40,20,.3);box-shadow:0 8px 20px rgba(50,40,20,.3);border:1px solid var(--linha)}

.foto.viva img{-webkit-filter:none;filter:none;-webkit-transform:scale(1.04);transform:scale(1.04)}
.foto.viva{-webkit-animation:tremeu .55s;animation:tremeu .55s}
@-webkit-keyframes tremeu{0%,100%{-webkit-transform:rotate(0)}25%{-webkit-transform:rotate(-1.6deg)}75%{-webkit-transform:rotate(1.6deg)}}
@keyframes tremeu{0%,100%{transform:rotate(0)}25%{transform:rotate(-1.6deg)}75%{transform:rotate(1.6deg)}}

.frase{display:-webkit-box;display:-webkit-flex;display:flex;-webkit-flex-wrap:wrap;flex-wrap:wrap;-webkit-box-pack:center;justify-content:center;gap:6px;margin-top:12px;max-width:430px}

.pal.ok{border-color:var(--ok);background:#eafce0;color:var(--ok)}
.pal.no{border-color:var(--erro);background:#ffece9;-webkit-animation:shk .4s;animation:shk .4s}

@-webkit-keyframes shk{0%,100%{-webkit-transform:translateX(0)}25%{-webkit-transform:translateX(-5px)}50%{-webkit-transform:translateX(5px)}75%{-webkit-transform:translateX(-3px)}}
@keyframes shk{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}50%{transform:translateX(5px)}75%{transform:translateX(-3px)}}

/* ---------- 12) ⭐ VOCÊ É O CHEFE: a criança ELABORA o pedido ---------- */
function dCria(){
  var rodada=0;
  function passo(){
    limpa();var t=el("div","tela");setProg(t,93+rodada);
    var nb=3,nd=4,doce=DOCES[rodada%DOCES.length],fechado=false;
    var c=el("div","centro");
    c.appendChild(el("div","selo","VOC&#202; &#201; O CHEFE"));
    c.appendChild(el("div","balao","Monte um pedido para mim: escolha <b>quantas bandejas</b> e <b>quantos docinhos</b> em cada."));
    var g1=el("div","giro"),g2=el("div","giro");
    var v1=el("div","gval","3"),v2=el("div","gval","4");
    function mm(g,v,mais){ var b=el("div","gbt",mais?"+":"&#8211;");
      b.onclick=function(){ arma(); sTap();
        if(fechado) return;
        if(g===1){ nb=Math.max(2,Math.min(6,nb+(mais?1:-1))); v1.innerHTML=nb; }
        else { nd=Math.max(2,Math.min(9,nd+(mais?1:-1))); v2.innerHTML=nd; }
        desenha(); };
      return b; }
    g1.appendChild(mm(1,v1,false));g1.appendChild(v1);g1.appendChild(mm(1,v1,true));
    g1.appendChild(el("div","glab","bandejas"));
    g2.appendChild(mm(2,v2,false));g2.appendChild(v2);g2.appendChild(mm(2,v2,true));
    g2.appendChild(el("div","glab","em cada uma"));
    c.appendChild(g1);c.appendChild(g2);
    var ban=el("div","bancada");c.appendChild(ban);
    var conta=el("div","conta","");c.appendChild(conta);
    function desenha(){ ban.innerHTML=""; var i;
      for(i=0;i<nb;i++) ban.appendChild(bandejaEl(doce,nd,false));
      conta.innerHTML=nb+" &#215; "+nd+" = ?"; }
    desenha();
    var b=el("button","btn","Fechar o pedido");b.style.marginTop="12px";
    b.onclick=function(){ arma(); sTap();
      if(fechado) return; fechado=true;
      b.parentNode.removeChild(b);
      var res=nb*nd,soma="",i;
      for(i=0;i<nb;i++) soma+=(i?" + ":"")+nd;
      conta.innerHTML=nb+" &#215; "+nd+" = ?";
      var bal2=el("div","balao","Agora resolva o <b>seu</b> pedido. Quanto d&#225;?");c.appendChild(bal2);
      var num=el("div","num"),op=baguncar([res,res+nd,Math.max(1,res-nd),nb+nd]),k,vist={},lim=[];
      for(k=0;k<op.length;k++){ if(!vist[op[k]]){ vist[op[k]]=1; lim.push(op[k]); } }
      var errC=0;
      for(k=0;k<lim.length;k++){(function(v){
        var bt=el("div","tecl",""+v);
        bt.onclick=function(){ arma();
          if(bt.className.indexOf("ok")>=0) return;
          if(v===res){ bt.className="tecl ok"; sCerto();
            conta.innerHTML=nb+" &#215; "+nd+" = <b>"+res+"</b>";
            conta.appendChild(el("small","",soma+" &#8212; o pedido que voc&#234; criou"));
            reg("criar",errC===0,errC+1);
            MED.pedidos.push(nb+" x "+nd+" = "+res); salva();
            var ce=centroTela(conta); faisca(ce[0],ce[1],"#ffb45e",18);
            setTimeout(function(){ rodada++;
              if(rodada>=2){ depoisDaFala("dc_cria_revela",10000,function(){
                mostraBanner("Voc&#234; n&#227;o s&#243; resolveu: voc&#234; <b>criou</b> o problema!",dRelampago); }); }
              else passo();
            },2000);
          } else { errC++; bt.className="tecl no"; sErro();
            setTimeout(function(){ if(bt.className==="tecl no") bt.className="tecl"; },440);
            if(errC===2) consolo(); }
        };
        num.appendChild(bt);
      })(lim[k]);}
      c.appendChild(num);
    };
    c.appendChild(b);
    c.appendChild(el("div","hint","Use o mais e o menos para escolher os n&#250;meros."));
    t.appendChild(c);app.appendChild(t);
    montaBarra("dc_cria_dica","Escolha os dois n&#250;meros e veja a conta aparecer.");
    if(rodada===0) falar("dc_cria_intro");
  }
  passo();
}

/* ---------- 13) ENCOMENDA RELÂMPAGO (tempo) ---------- */
var RELD=[["2 &#215; 4",8],["3 &#215; 3",9],["5 &#215; 2",10],["4 &#215; 5",20],["2 &#215; 7",14],
          ["3 &#215; 5",15],["4 &#215; 4",16],["5 &#215; 5",25],["2 &#215; 8",16],["3 &#215; 6",18],

function dRelampago(){
  limpa();var t=el("div","tela");setProg(t,97);
  var LIM=60000,ini=(new Date()).getTime(),acabou=false,pts=0,fila=baguncar(RELD.slice(0)),fi=0;
  var c=el("div","centro");

  var tb=el("div","tbar");var tbi=el("i");tb.appendChild(tbi);c.appendChild(tb);
  var card=el("div","relcard","");c.appendChild(card);
  var num=el("div","num"),bts=[],k;
  for(k=0;k<4;k++){(function(){
    var bt=el("div","tecl","");
    bt.onclick=function(){ resp(bt._v,bt); };
    num.appendChild(bt); bts.push(bt);
  })();}
  c.appendChild(num);
  c.appendChild(el("div","hint","Vale tudo o que voc&#234; treinou hoje."));
  t.appendChild(c);app.appendChild(t);
  function mostra(){
    var it=fila[fi%fila.length];
    card.innerHTML=it[0];
    card.style.webkitAnimation="none";card.style.animation="none";void card.offsetWidth;
    card.style.webkitAnimation="";card.style.animation="";
    var r=it[1],op=baguncar([r,r+2,Math.max(2,r-2),r+4]),i,vist={},lim=[];
    for(i=0;i<op.length;i++){ if(!vist[op[i]]){ vist[op[i]]=1; lim.push(op[i]); } }
    while(lim.length<4) lim.push(r+lim.length+5);
    for(i=0;i<bts.length;i++){ bts[i]._v=lim[i]; bts[i].innerHTML=lim[i]; bts[i].className="tecl"; }
  }
  function resp(v,bt){ if(acabou) return; arma();
    var it=fila[fi%fila.length],ok=(v===it[1]);
    if(ok){ pts++; sCerto(); bt.className="tecl ok";
      var ce=centroTela(card); faisca(ce[0],ce[1],"#6bd23f",10); }
    else { sErro(); bt.className="tecl no"; }
    reg("vezes",ok,1); pl.innerHTML="Acertos: "+pts;
    fi++; if(fi%fila.length===0) baguncar(fila);
    setTimeout(function(){ if(acabou)return; mostra(); },320);
  }
  mostra();
  var tmr=setInterval(function(){
    if(!t.parentNode){ clearInterval(tmr); acabou=true; return; }
    var f=1-((new Date()).getTime()-ini)/LIM;
    if(f<=0){ f=0; clearInterval(tmr); acabou=true; tbi.style.width="0%";

        mostraBanner("Voc&#234; fez <b>"+pts+"</b> acerto"+(pts===1?"":"s")+" no rel&#226;mpago!",dEnsinar); });
      return; }
    tbi.style.width=(f*100)+"%";
  },200);
  montaBarra(null,null);
  falar("dc_rel_intro");
}
