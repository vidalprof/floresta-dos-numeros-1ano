function embaralharOpcoes(){
  var qi;for(qi=0;qi<QUESTOES.length;qi++){
    var q=QUESTOES[qi], ordem=[],k;
    for(k=0;k<q.opcoes.length;k++){ordem.push(k);}
    for(k=ordem.length-1;k>0;k--){var j=Math.floor(Math.random()*(k+1));var tmp=ordem[k];ordem[k]=ordem[j];ordem[j]=tmp;}
    var novas=[],nova=0;
    for(k=0;k<ordem.length;k++){novas.push(q.opcoes[ordem[k]]);if(ordem[k]===q.correta){nova=k;}}
    q.opcoes=novas;q.correta=nova;
  }
}

function _chaveVoz(t){var s=(""+t).replace(/\s+/g," ").replace(/^\s+|\s+$/g,"");var h=5381,i;for(i=0;i<s.length;i++){h=((h*33)+s.charCodeAt(i))>>>0;}return h===0?"v0":("v"+h.toString(36));}
function pararFala(){if(_falaAudio){try{_falaAudio.pause();_falaAudio.src="";}catch(e){}_falaAudio=null;}}
var _actx=null;
function somToque(){
  if(VOZ_MUDA){return;}
  try{
    if(!_actx){var AC=window.AudioContext||window.webkitAudioContext;if(!AC){return;}_actx=new AC();}
    if(_actx.state==="suspended"&&_actx.resume){_actx.resume();}
    var t=_actx.currentTime,o=_actx.createOscillator(),g=_actx.createGain();
    o.type="triangle";o.frequency.setValueAtTime(520,t);o.frequency.exponentialRampToValueAtTime(760,t+0.10);
    g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(0.16,t+0.012);g.gain.exponentialRampToValueAtTime(0.0001,t+0.16);
    o.connect(g);g.connect(_actx.destination);o.start(t);o.stop(t+0.18);
  }catch(e){}
}

  _ultimaFala=texto;

function ativarRevista(){
  var app=$("app"), secs=document.getElementsByClassName("sec");
  /* barra de progresso do portal + revelar ao rolar + carimbar parada (sem IntersectionObserver p/ compatibilidade) */
  var doc=document.documentElement;
  function checa(){
    var vh=window.innerHeight||doc.clientHeight, i;
    var top=window.pageYOffset||doc.scrollTop||0;
    var max=(doc.scrollHeight||document.body.scrollHeight)-vh; setBarra(max>0?(top/max):0);
    for(i=0;i<secs.length;i++){var rt=secs[i].getBoundingClientRect().top; /* relativo à viewport */
      if(rt < vh-70 && secs[i].className.indexOf("vis")<0){secs[i].className+=" vis";}
      if(rt < vh-150){ marcarParada(i); }
    }
  }
  window.onscroll=checa; checa();
}
function marcarParada(i){
  if(_visit[i])return; _visit[i]=1;
  var p=$("par"+i); if(p){p.className="parada visitado";}
  var secs=document.getElementsByClassName("sec"); if(secs[i]&&secs[i].className.indexOf("visitado")<0){secs[i].className+=" visitado";}
  var n=0,k; for(k in _visit){if(_visit.hasOwnProperty(k)){n++;}}
  var ps=$("passe"); if(ps){ps.innerHTML=(n>=SECOES.length?"Expedição completa! "+n+" carimbos &#11088;":"Carimbos: "+n+" de "+SECOES.length);}
}
function irPara(i){var secs=document.getElementsByClassName("sec"),s=secs[i];if(s){if(s.className.indexOf("vis")<0){s.className+=" vis";}window.scrollTo(0,Math.max(0,s.getBoundingClientRect().top+(window.pageYOffset||0)-8));marcarParada(i);}somToque();}
function setBarra(f){var b=$("topbar");if(b){f=Math.max(0,Math.min(1,f));b.style.width=(f*100)+"%";}}

/* ====== QUIZ ====== */
function irQuiz(){atual=0;somToque();window.onscroll=null;setBarra(0);telaPergunta();}
function crachaHTML(){
  var av=avatarAluno?'<img src="img/'+avatarAluno+'" alt="" onerror="this.style.display=\'none\'">':'';
  return '<div class="cracha"><div class="cav">'+av+'</div>'+
    '<span class="cnm">'+esc(nomeAluno||"")+'</span></div>';
}
function passaporte(){
  var h='<div id="passa">',i;
  for(i=0;i<QUESTOES.length;i++){
    var st=(i<atual?"feito":(i===atual?"agora":""));
    h+='<span class="selo '+st+'">'+(i<atual?"&#10003;":(i+1))+'</span>';
  }
  return h+'</div>';
}
function telaPergunta(){
  var q=QUESTOES[atual],h='';
  h+='<div id="trilha">&#127959;️ Pergunta '+(atual+1)+' de '+QUESTOES.length+'</div>';
  h+=passaporte();
  h+='<div class="card qcard">';
  h+=crachaHTML();
  h+='<img class="guia" src="'+GUIA+'" alt="Juca, o bugio" onerror="this.style.display=\'none\'">';
  h+='<span class="disc '+q.sec+'">'+(SECNOME[q.sec]||"")+'</span>';
  if(q.img){h+='<img class="qfig" src="img/'+q.img+'" alt="" onerror="this.style.display=\'none\'">';}
  h+='<p class="pergunta">'+esc(q.pergunta)+'</p>';
  h+='<button id="btnOuvir" onclick="repetirUltima()">&#128266; Ouvir a pergunta</button>';
  h+='<div class="opcoes">';
  var letras=["A","B","C","D"],i;
  for(i=0;i<q.opcoes.length;i++){
    h+='<div class="opc c'+i+' opt" role="button" tabindex="0"'+(i===q.correta?' data-qa="1"':'')+' onclick="responder('+i+')">'+
       '<span class="let">'+letras[i]+'</span>'+
       '<span class="otx">'+esc(q.opcoes[i])+'</span>'+
       '<button class="ospk" title="Ouvir esta resposta" onclick="event.stopPropagation();ouvirOpc('+i+')">&#128266;</button>'+
       '</div>';
  }
  h+='</div></div>';
  $("app").innerHTML=h;window.scrollTo(0,0);
  falar(falaPergunta(q,atual+1));
}
function responder(idx){
  somToque();respostas[atual]=idx;pararFala();atual++;
  if(atual>=QUESTOES.length){telaFinal();}
  else{
    falar(FRASES_NEXT[atual%FRASES_NEXT.length]);setTimeout(telaPergunta,60);
  }
}
function calcularAcertos(){var a=0,i;for(i=0;i<QUESTOES.length;i++){if(respostas[i]===QUESTOES[i].correta){a++;}}return a;}
function medalhaHTML(){
  return '<div class="medalha medal"><span class="fita e"></span><span class="fita d"></span>'+
    '<div class="disco"><span class="estrela"></span>'+
    (avatarAluno?'<img class="mav" src="img/'+avatarAluno+'" alt="" onerror="this.style.display=\'none\'">':'')+
    '</div></div>';
}
function telaFinal(){
  var ac=calcularAcertos();confete();
  var h='';
  h+='<div class="card">';
  h+='<h1>Viagem concluída!</h1>';
  h+=medalhaHTML();
  h+='<h2>'+esc(nomeAluno)+', você terminou a viagem no tempo pelo Vale!</h2>';
  h+='<p class="grande">O Juca adorou descobrir a história do Vale com você. Parabéns, explorador do tempo!</p>';
  h+='<p id="statusenvio"></p></div>';
  $("app").innerHTML=h;window.scrollTo(0,0);setBarra(1);
  falar(TXT_FINAL);
  enviarResultado(ac);
}

/* ====== ENVIO (Firebase), SEM mostrar nota ao aluno ====== */
function enviarResultado(ac){
  if(enviado){return;}enviado=true;
  var letras="",i;for(i=0;i<QUESTOES.length;i++){letras+=(respostas[i]<0?"-":(respostas[i]===QUESTOES[i].correta?"C":"E"));}
  var quando=new Date().toLocaleString("pt-BR");
  var nota10=QUESTOES.length?Math.round(ac/QUESTOES.length*100)/10:0;
  var reg={nome:nomeAluno,turma:turmaAluno,nota:nota10,acertos:ac+"/"+QUESTOES.length,respostas:letras,data:quando};
  try{
    var chave=(nomeAluno+"_"+turmaAluno+"_"+Date.now()).replace(/[^A-Za-z0-9_]/g,"_");
    var x=new XMLHttpRequest();
    x.open("PUT",FIREBASE_DB+"/provas/"+SLUG+"/"+chave+".json",true);
    x.setRequestHeader("Content-Type","application/json");
    x.send(JSON.stringify(reg));
  }catch(e){}
}

/* ====== confete leve ====== */
function confete(){try{
  var c=document.createElement("canvas");c.style.position="fixed";c.style.left=0;c.style.top=0;c.style.pointerEvents="none";c.style.zIndex=9998;
  c.width=window.innerWidth;c.height=window.innerHeight;document.body.appendChild(c);
  var x=c.getContext("2d"),ps=[],i,cores=["#ef6d3a","#2f9e57","#0e7c86","#8a63d2","#f6bf31"];
  for(i=0;i<90;i++){ps.push({x:Math.random()*c.width,y:-20-Math.random()*c.height,r:6+Math.random()*6,vy:2+Math.random()*3,co:cores[i%cores.length],vx:-1.5+Math.random()*3});}
  var t=0,tot=150;function loop(){x.clearRect(0,0,c.width,c.height);var k;for(k=0;k<ps.length;k++){var p=ps[k];p.y+=p.vy;p.x+=p.vx;x.fillStyle=p.co;x.fillRect(p.x,p.y,p.r,p.r);}t++;if(t<tot){requestAnimationFrame(loop);}else{if(c.parentNode){c.parentNode.removeChild(c);}}}loop();
}catch(e){}}

document.addEventListener("click",function(){
  if(_histTocada){return;}
  if(!document.getElementById("cNome")){return;}
  _histTocada=true;falar(HISTORIA,true);

boot();
