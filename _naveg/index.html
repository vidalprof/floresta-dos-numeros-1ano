*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0}

#bg:after{content:"";position:absolute;inset:0;background:-webkit-linear-gradient(top,rgba(255,255,255,.10),rgba(0,0,0,0) 40%,rgba(40,30,10,.18));background:linear-gradient(rgba(255,255,255,.10),rgba(0,0,0,0) 40%,rgba(40,30,10,.18))}

/* ⚠️ position:relative NAO e enfeite: o alto-falante do enunciado (.zapb) e
   absoluto e se ancora no primeiro pai POSICIONADO. Sem isto ele saia do balao
   e ia parar em cima da figura da fase — o portao de leiaute pegou em 6 fases. */
.balao{position:relative;max-width:440px;background:rgba(255,253,244,.96);border-radius:20px;padding:12px 16px;font-size:16.5px;font-weight:600;text-align:center;line-height:1.35;

/* ===== JOGO DA MEMORIA — GRANDE, COM ARTE E COM EFEITO =====
   Duas ordens do Marcos (ago/2026), no mesmo dia:
   1) *"quando fizer jogo da memória faça cartas maiores"* — a carta e o alvo
      mais dificil da atividade: a crianca precisa VER a figura, LER a palavra e
      ainda LEMBRAR onde ela estava. Carta pequena mata as tres coisas.
   2) *"os jogos da memória tem que ter bastante efeitos e sons, devem ficar
      lindos, tamanho maior, claro adequando a tela, chamar atenção do
      estudante"* — dai a VIRADA de verdade (a carta gira em 3D), o brilho

.mcartas{display:-webkit-box;display:-webkit-flex;display:flex;-webkit-flex-wrap:wrap;flex-wrap:wrap;
  gap:11px;-webkit-box-pack:center;justify-content:center;margin-top:12px;max-width:440px;width:100%;

/* ⭐ COMPLETE A HISTORIA, MAIS BONITA (pedido do Marcos, ago/2026: *"fazer mais
   profissional, tem as imagens com fundo branco aparecendo, tem que ser algo
   mais animado e bonito, mais lindo"*).

   O "fundo branco" nao era da imagem — os PNGs sao transparentes. Era a
   MOLDURA de papel do motor: um cartao branco enorme em volta de uma mandioca
   pequena. Agora a peca recortada FLUTUA sobre um halo de luz (sem cartao) e a
   cena larga e que fica emoldurada. E o premio deixou de ser a palavra "Isso
   mesmo!": a lacuna da frase se PREENCHE na frente da crianca.            */
.objcena{position:relative;width:100%;max-width:230px;margin:10px auto 0;text-align:center}
.objcena:before{content:"";position:absolute;left:50%;top:52%;width:88%;padding-bottom:88%;
  margin:-44% 0 0 -44%;border-radius:50%;background:rgba(255,247,224,.30);
  background:-webkit-radial-gradient(center,circle,rgba(255,247,224,.55),rgba(255,247,224,0) 70%);
  background:radial-gradient(circle,rgba(255,247,224,.55),rgba(255,247,224,0) 70%)}

   ultima letra caia e a fase seguia — a crianca nao ganhava nada por ter
   fechado a palavra. Agora as letras acendem UMA A UMA com som subindo, a
   palavra inteira da um pulo e a faixa com ela sobe na tela.             */
.cruzfesta .clin.ok,.cruzfesta .slot.cheio{-webkit-animation:letracende .5s backwards;animation:letracende .5s backwards}

/* ================= FASES NOVAS (ago/2026) ================= */
/* MARCA-TEXTO: paragrafo de verdade, palavra a palavra, para PINTAR */
.paragrafo{max-width:430px;margin-top:12px;background:rgba(255,253,244,.96);border:2px solid var(--linha);
  border-radius:18px;padding:14px 12px;line-height:2.05;text-align:center;

  border-bottom-width:3px;-webkit-box-shadow:none;box-shadow:none}

/* ⚠️ as duas tintas sao as DESTA atividade (tupi / africana). O motor veio
   com `sub`/`adj`, que sao substantivo e adjetivo da atividade de gramatica —
   resto de clone que nao dava erro nenhum e ficaria ali para sempre.        */
/* ⭐ MARCA-TEXTO DE VERDADE (pedido do Marcos, ago/2026: *"a fase 'a lingua
   guarda' pode ser um design mais bonito, moderno, sonoro, com comemoracao,
   algo bem profissional"*). Era uma caixinha que trocava de cor. Agora:
   a folha e uma PAGINA (papel com margem e linha-guia), a palavra pintada
   recebe um TRAÇO DE CANETA que corre da esquerda para a direita (como um
   marca-texto de verdade), fica em relevo e da um pulinho; no fim as palavras
   achadas pulsam juntas e o carimbo da origem desce na pagina.
   ⚠️ Tudo com queda para PC velho: quem nao entende `linear-gradient` recebe a
   cor chapada da linha de cima, que ja era o visual antigo.               */
.pal.pint.tupi{background:#cdf0bd;border-color:#3f9a26;color:#22540f}
.pal.pint.afr{background:#ffe9a3;border-color:#e0a800;color:#5a4200}
.paragrafo{position:relative;background:rgba(255,253,244,.97);
  background:-webkit-linear-gradient(top,rgba(255,254,250,.99),rgba(252,246,229,.97));
  background:linear-gradient(rgba(255,254,250,.99),rgba(252,246,229,.97));
  border-color:#d9c9a4;text-align:left;padding:16px 14px 14px 20px}
/* a margem vermelha do caderno */
.paragrafo:before{content:"";position:absolute;left:11px;top:10px;bottom:10px;width:2px;
  background:rgba(200,120,110,.45);border-radius:2px}
.paragrafo .pal{position:relative;overflow:hidden;background:transparent;border:0;
  border-radius:8px;padding:5px 7px;margin:2px 1px;font-size:17px;color:var(--texto);
  -webkit-box-shadow:none;box-shadow:none;
  -webkit-transition:-webkit-transform .18s;transition:transform .18s}
.paragrafo .pal:active{-webkit-transform:scale(.94);transform:scale(.94)}
/* o traco da caneta: corre por baixo da palavra da esquerda para a direita */
.paragrafo .pal.pint{color:#22540f;font-weight:800;
  -webkit-animation:palpulo .45s;animation:palpulo .45s}
.paragrafo .pal.pint:before{content:"";position:absolute;left:0;top:8%;bottom:8%;width:100%;
  border-radius:7px;z-index:-1;
  -webkit-transform-origin:left center;transform-origin:left center;
  -webkit-animation:tracocorre .38s ease-out;animation:tracocorre .38s ease-out}
.paragrafo .pal.pint.tupi:before{background:#a8e884;
  background:-webkit-linear-gradient(left,#8ce05a,#cdf0bd);background:linear-gradient(90deg,#8ce05a,#cdf0bd)}
.paragrafo .pal.pint.afr:before{background:#ffd970;
  background:-webkit-linear-gradient(left,#ffc93c,#ffe9a3);background:linear-gradient(90deg,#ffc93c,#ffe9a3)}
.paragrafo .pal.pint.afr{color:#5a4200}
@-webkit-keyframes tracocorre{0%{-webkit-transform:scaleX(0)}100%{-webkit-transform:scaleX(1)}}
@keyframes tracocorre{0%{transform:scaleX(0)}100%{transform:scaleX(1)}}
@-webkit-keyframes palpulo{0%{-webkit-transform:scale(1)}45%{-webkit-transform:scale(1.16) rotate(-2deg)}100%{-webkit-transform:scale(1)}}
@keyframes palpulo{0%{transform:scale(1)}45%{transform:scale(1.16) rotate(-2deg)}100%{transform:scale(1)}}
/* a comemoracao: as palavras achadas pulsam juntas */
.paragrafo.festa .pal.pint{-webkit-animation:palfesta .7s 2;animation:palfesta .7s 2}
@-webkit-keyframes palfesta{0%,100%{-webkit-transform:scale(1)}50%{-webkit-transform:scale(1.13)}}
@keyframes palfesta{0%,100%{transform:scale(1)}50%{transform:scale(1.13)}}
/* o carimbo da origem, que desce na pagina no fim da rodada */
.carimbo{position:absolute;left:50%;top:50%;z-index:5;padding:8px 20px;border-radius:10px;

@-webkit-keyframes carimba{0%{-webkit-transform:translate(-50%,-50%) rotate(-9deg) scale(2.4);opacity:0}

@keyframes carimba{0%{transform:translate(-50%,-50%) rotate(-9deg) scale(2.4);opacity:0}
  70%{transform:translate(-50%,-50%) rotate(-9deg) scale(.92);opacity:1}

.marcabarra{width:100%;max-width:430px;height:10px;border-radius:99px;margin:8px auto 0;

/* ================= TELAS DA MÁQUINA DO TEMPO =================
   Tudo com cor sólida antes de cada gradiente (PC velho vê a cor) e animação
   só por transform/opacity, que não repinta a tela. */
/* --- cena grande, em moldura de foto --- */
.cena{width:100%;max-width:420px;margin-top:10px;border-radius:16px;overflow:hidden;
  background:#fffdf6;border:3px solid #fffdf6;
  -webkit-box-shadow:0 8px 22px rgba(30,25,10,.4);box-shadow:0 8px 22px rgba(30,25,10,.4)}
.cena img{width:100%;display:block}
.cena .cenacap{font-size:12.5px;font-weight:700;color:#6b6252;padding:5px 8px;text-align:center}
/* --- SIMULADOR: janela do tempo --- */
.janela{width:100%;max-width:420px;margin-top:10px;border-radius:16px;overflow:hidden;
  background:#2b2416;border:4px solid #fffdf6;position:relative;
  -webkit-box-shadow:0 10px 26px rgba(20,15,5,.5);box-shadow:0 10px 26px rgba(20,15,5,.5)}
.janela .cenaimg{width:100%;display:block;-webkit-animation:apfoto .45s;animation:apfoto .45s}
/* ⚠️ a figura do mapa dentro da janela: SEM esta regra ela vinha no tamanho
   natural (860px de altura) e a fase do roteiro ficava com 1900px — a crianca
   nao via o mapa e as setas ao mesmo tempo.                                  */
.janela .jimg{width:100%;height:auto;display:block;-webkit-animation:apfoto .45s;animation:apfoto .45s}
/* o mascote voando por cima da cena: posicao ABSOLUTA (a .silh do
   motor e outra coisa — barras de esqueleto — e empurrava a tela para 1900px) */
.janela .voando{position:absolute;width:52px;height:52px;margin:-26px 0 0 -26px;z-index:4;
  -webkit-transition:left .55s ease,top .55s ease;transition:left .55s ease,top .55s ease}
.janela .voando img{width:100%;height:100%;-o-object-fit:contain;object-fit:contain;display:block;
  -webkit-filter:drop-shadow(0 3px 5px rgba(0,0,0,.35));filter:drop-shadow(0 3px 5px rgba(0,0,0,.35))}
.janela{position:relative}
/* --- ROSA DOS VENTOS (orientar) --- */
.bussola{position:relative;width:250px;height:250px;margin:14px auto 6px}
.bussola .busimg{width:100%;height:100%;-o-object-fit:contain;object-fit:contain;display:block}
.vento{position:absolute;width:52px;height:52px;line-height:48px;text-align:center;font-size:21px;
  font-weight:800;color:#fff;border-radius:50%;cursor:pointer;
  background:-webkit-linear-gradient(top,#6d9bec,#2f6bd8);background:linear-gradient(#6d9bec,#2f6bd8);
  border:2px solid #1d4ea8;-webkit-box-shadow:0 4px 10px rgba(30,25,10,.4);box-shadow:0 4px 10px rgba(30,25,10,.4)}

.vento.baixo{left:50%;bottom:-6px;margin-left:-26px}
.vento.esq{left:-6px;top:50%;margin-top:-26px}
.vento.dir{right:-6px;top:50%;margin-top:-26px}
.vento.ok{background:-webkit-linear-gradient(top,#8ce05a,#3f9a26);background:linear-gradient(#8ce05a,#3f9a26);border-color:#2c6b13}
.vento.no{background:-webkit-linear-gradient(top,#f09090,#c9403a);background:linear-gradient(#f09090,#c9403a);border-color:#8f2420;-webkit-animation:shk .4s;animation:shk .4s}
/* --- MAPA QUADRICULADO (coordenada) --- */
.quadric{position:relative;width:100%;max-width:400px;margin-top:10px;border-radius:14px;overflow:hidden;
  border:4px solid #fffdf6;-webkit-box-shadow:0 8px 20px rgba(30,25,10,.4);box-shadow:0 8px 20px rgba(30,25,10,.4)}

/* ⭐ O V DE VERIFICACAO (pedido do Marcos, ago/2026: *"essas mesmas questoes e
   consertos, V de verificacao etc, devem ser aplicadas na de historia do 5
   ano"*, e depois *"na fase quem ja estava aqui aplique a regra do V de
   verificacao para ficar legal"*). O circulo dourado dizia "e aqui"; o V diz
   "voce ACERTOU" — o sinal que a crianca ja conhece do caderno.            */
.vok{position:absolute;width:60px;height:60px;margin:-30px 0 0 -30px;border-radius:50%;
  pointer-events:none;z-index:6;background:#3f9a26;
  background:-webkit-radial-gradient(35% 28%,circle,#8ce05a,#3f9a26 72%);
  background:radial-gradient(circle at 35% 28%,#8ce05a,#3f9a26 72%);
  -webkit-box-shadow:0 0 0 5px rgba(255,255,255,.9),0 8px 18px rgba(20,40,10,.5);
  box-shadow:0 0 0 5px rgba(255,255,255,.9),0 8px 18px rgba(20,40,10,.5);
  -webkit-animation:vokpop .5s;animation:vokpop .5s}
.vok i{position:absolute;left:20px;top:11px;width:14px;height:26px;display:block;
  border:5px solid #fff;border-top:0;border-left:0;border-radius:2px;
  -webkit-transform:rotate(42deg);transform:rotate(42deg)}
.vok b{position:absolute;left:-14px;top:-14px;right:-14px;bottom:-14px;display:block;
  border:3px solid rgba(140,224,90,.9);border-radius:50%;

var FORCAP=[{p:"ABACAXI", im:"nv_abacaxi", d:"Fruta de casca dura e espinhos. O nome &#233; tupi: <b>&#225;-ka-ti</b>, fruta que cheira."},

var TXPAL=("Hoje|de|manh&#227;|eu|comi|pipoca|e|um|peda&#231;o|de|abacaxi|.|Na|hora|do|almo&#231;o|"+

/* ---------- 12) CAÇA-PALAVRAS (uma cor por palavra, com festa) ----------
   Molde consertado na cartografia (ago/2026): a grade tem que ter as MESMAS
   colunas da grade lógica, a célula conquistada TRAVA, e cada palavra tem a
   sua cor — no chip e na grade.                                             */
var CACAM=["VELA","ROTA","TROCA","POVO","MAR"];
function mCaca(){
  limpa();var t=el("div","tela");setProg(t,68);
  var N=9,g=[],i,j;
  for(i=0;i<N;i++){ g[i]=[]; for(j=0;j<N;j++) g[i][j]=""; }
  var achadas={},posicoes={},onde={},cor={};
  var LET="ABCDEFGHIJLMNOPRSTUV";
  function cabe(p,li,co,dl,dc){ var k;
    for(k=0;k<p.length;k++){ var y=li+dl*k,x=co+dc*k;
      if(y<0||y>=N||x<0||x>=N) return false;
      if(g[y][x]&&g[y][x]!==p.charAt(k)) return false; }
    return true; }
  for(i=0;i<CACAM.length;i++){
    var p=CACAM[i],posto=false,tent=0;
    cor[p]="p"+(i+1);
    while(!posto&&tent<300){ tent++;
      /* ⭐ AGORA TEM DIAGONAL (pedido do Marcos, ago/2026: *"na dica dizer que
         tem palavras na diagonal"*). Quatro direcoes: deitada, em pe, e as duas
         diagonais para baixo. Diagonal e o que faz a crianca VARRER a grade
         inteira em vez de ler so linha e coluna.                          */
      var dirs=[[0,1],[1,0],[1,1],[1,-1]];
      var d=dirs[Math.floor(Math.random()*dirs.length)], dl=d[0], dc=d[1];
      var hor=(dl===0);
      var li=Math.floor(Math.random()*N), co=Math.floor(Math.random()*N);
      if(cabe(p,li,co,dl,dc)){ var cel=[],k;

   monta um percurso CURTO so com as fases dos objetivos fracos e volta para a

}
function treinarFracos(){

}
