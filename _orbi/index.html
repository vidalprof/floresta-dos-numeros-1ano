:root{--verde:#5bbf3a;--verde-d:#3f9a26;--sol:#ffd43b;--sol-d:#eab000;--terra:#a6703c;
  --coral:#ff7a6b;--rosa:#ff8ac2;--roxo:#7d3fe0;--texto:#3a3020;--card:#fffdf6;--linha:#e6dcc6}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0}
html,body{height:100%;overflow:hidden}
body{font-family:"Fredoka",ui-rounded,"Segoe UI",system-ui,Arial,sans-serif;color:var(--texto);background:#bfe9ff;-webkit-user-select:none;user-select:none}
#bg{position:fixed;inset:0;z-index:0;background:#0e1230 center/cover no-repeat;background-image:url(img/sr_fundo.jpg)}
#ceu{position:fixed;inset:0;width:100%;height:100%;display:block;z-index:1;pointer-events:none}
#app{position:fixed;inset:0;z-index:2}
.tela{position:absolute;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch;display:-webkit-box;display:flex;-webkit-box-orient:vertical;-webkit-flex-direction:column;flex-direction:column;-webkit-box-align:center;align-items:center;padding:calc(40px + env(safe-area-inset-top)) 16px calc(86px + env(safe-area-inset-bottom));-webkit-animation:fade .45s;animation:fade .45s}
@-webkit-keyframes fade{from{opacity:0}to{opacity:1}}@keyframes fade{from{opacity:0}to{opacity:1}}
.balao{max-width:430px;background:rgba(255,253,246,.95);border:0;border-radius:22px;padding:13px 18px;font-size:17px;font-weight:600;text-align:center;line-height:1.35;
  -webkit-box-shadow:0 6px 18px rgba(30,50,20,.22);box-shadow:0 6px 18px rgba(30,50,20,.22)}
.balao b{color:#2c7318}
.centro{-webkit-box-flex:1;-webkit-flex:1;flex:1;display:-webkit-box;display:flex;-webkit-box-orient:vertical;-webkit-flex-direction:column;flex-direction:column;-webkit-box-pack:center;justify-content:center;-webkit-box-align:center;align-items:center;width:100%}
h1{font-size:34px;font-weight:700;color:#fff;margin:6px 0 2px;text-align:center;
  background:rgba(40,52,20,.78);padding:6px 18px;border-radius:20px;
  text-shadow:0 2px 0 #1e5410,0 4px 10px rgba(0,0,0,.45)}

/* ================= TEMA ESPACO (sobrescreve o tema verde do molde) ================= */
:root{--dourado:#ffd43b;--noite:#0e1230;--indigo:#6a58ff;--indigo-d:#2a1c82}

#bg{background-color:#0e1230;background-image:url(img/sr_fundo.jpg)}

.hint{background:rgba(14,18,48,.9)}
.selo{background:#3a2aa8}
.btn{background:-webkit-linear-gradient(top,#7a6bff,#3a2aa8);background:linear-gradient(#7a6bff,#3a2aa8);
  -webkit-box-shadow:0 6px 0 var(--indigo-d),0 12px 18px rgba(0,0,0,.35);box-shadow:0 6px 0 var(--indigo-d),0 12px 18px rgba(0,0,0,.35)}
.prog>i{background:-webkit-linear-gradient(top,#a99bff,#6a58ff);background:linear-gradient(#a99bff,#6a58ff)}
.banner{background:#eef0ff}
.banner .msg{color:#25297e}
.banner .cta2{background:#4a3ad0;-webkit-box-shadow:0 4px 0 var(--indigo-d);box-shadow:0 4px 0 var(--indigo-d)}
.cracha .cfoto{background:#e9ebff;border-color:#5b4ae0}
.cracha .csel{color:#3a2aa8 !important}
.mcarta{background:-webkit-linear-gradient(top,#8a7bff,#4a3ad0);background:linear-gradient(#8a7bff,#4a3ad0);border-color:#2a1c82}
.tbar>i{background:-webkit-linear-gradient(left,#ef5a4a,var(--dourado));background:linear-gradient(90deg,#ef5a4a,var(--dourado))}
/* ================= FASE: APAGUE O SOL ================= */
/* .centro nao estica os filhos: sem width:100% a fileira de cartas assumia a
   max-width de 470px e VAZAVA para fora da tela num telefone de 412px. */
.cartas{width:100%}
.carta img{-webkit-transition:-webkit-filter .55s ease;transition:filter .55s ease}
.carta.apagado img{-webkit-filter:brightness(.16) saturate(.35);filter:brightness(.16) saturate(.35)}
/* ================= FASE: ESTRELA / PLANETA / SATELITE ================= */
.bins.tres{-webkit-flex-wrap:wrap;flex-wrap:wrap;gap:8px;max-width:340px;-webkit-box-pack:center;justify-content:center}
.bins.tres .bin{width:102px;padding:11px 5px;font-size:14px;line-height:1.15}
.bin small{display:block;font-size:10.5px;font-weight:600;margin-top:3px;opacity:.94;line-height:1.15}
.bin.estrela2{background:-webkit-linear-gradient(top,#b06a00,#5a3400);background:linear-gradient(#b06a00,#5a3400)}
.bin.planeta2{background:-webkit-linear-gradient(top,#2a8fc4,#14556f);background:linear-gradient(#2a8fc4,#14556f)}
.bin.satelite2{background:-webkit-linear-gradient(top,#7d78a8,#3f3b66);background:linear-gradient(#7d78a8,#3f3b66)}
/* ================= FASE: GIRE A TERRA ================= */
.giro{position:relative;width:298px;height:206px;margin-top:8px}
.giroSol{position:absolute;left:0;top:50%;width:70px;height:70px;margin-top:-35px;object-fit:contain;
  -webkit-filter:drop-shadow(0 0 16px rgba(255,200,60,.75));filter:drop-shadow(0 0 16px rgba(255,200,60,.75))}
.giroBola{position:absolute;right:4px;top:50%;width:190px;height:190px;margin-top:-95px}
.giroBola .pl{position:absolute;left:0;top:0;width:100%;height:100%;object-fit:contain;border-radius:50%}
.giroSombra{position:absolute;left:0;top:0;width:100%;height:100%;border-radius:50%;pointer-events:none;
  background:-webkit-linear-gradient(left,rgba(3,5,20,0) 44%,rgba(3,5,20,.8) 56%);
  background:linear-gradient(90deg,rgba(3,5,20,0) 44%,rgba(3,5,20,.8) 56%)}
.giroCasa{position:absolute;width:44px;height:44px;margin:-22px 0 0 -22px;object-fit:contain;z-index:3;
  -webkit-transition:left .5s ease,top .5s ease;transition:left .5s ease,top .5s ease;
  -webkit-filter:drop-shadow(0 2px 5px rgba(0,0,0,.6));filter:drop-shadow(0 2px 5px rgba(0,0,0,.6))}
.rot{margin-top:12px;font-size:18px;font-weight:800;padding:9px 20px;border-radius:999px;color:#fff;text-align:center}
.rot.dia{background:-webkit-linear-gradient(top,#ffdf85,#e09600);background:linear-gradient(#ffdf85,#e09600);color:#503300}
.rot.noite{background:-webkit-linear-gradient(top,#3f4590,#181c46);background:linear-gradient(#3f4590,#181c46)}
/* ================= FASE: ORBITA (Lua / fases) ================= */
.orb{position:relative;width:272px;height:272px;margin-top:6px;border-radius:50%;
  border:2px dashed rgba(255,255,255,.34)}
.orb.peq{width:232px;height:232px}

.orb.peq .cen{width:76px;height:76px;margin:-38px 0 0 -38px}
.orb .mv{position:absolute;width:50px;height:50px;margin:-25px 0 0 -25px;object-fit:contain;z-index:3;
  -webkit-transition:left .45s ease,top .45s ease;transition:left .45s ease,top .45s ease;
  -webkit-filter:drop-shadow(0 2px 5px rgba(0,0,0,.5));filter:drop-shadow(0 2px 5px rgba(0,0,0,.5))}
.orb .pt{position:absolute;width:22px;height:22px;margin:-11px 0 0 -11px;border-radius:50%;
  background:rgba(255,255,255,.3);cursor:pointer}
.orb .pt.alvo{background:var(--dourado);-webkit-animation:zp 1.1s ease-in-out infinite;animation:zp 1.1s ease-in-out infinite}
.orb .pt.luapos{width:52px;height:52px;margin:-26px 0 0 -26px;background:rgba(255,255,255,.12);
  border:2px solid rgba(255,255,255,.5)}
.orb .pt.luapos img{width:100%;height:100%;object-fit:contain}
.orb .pt.luapos.visto{border-color:#8be05a;background:rgba(139,224,90,.28)}
.cenafase{display:-webkit-box;display:-webkit-flex;display:flex;-webkit-box-align:center;align-items:center;gap:10px}
.solfase{width:54px;height:54px;-webkit-flex:none;flex:none;object-fit:contain;
  -webkit-filter:drop-shadow(0 0 14px rgba(255,200,60,.85));filter:drop-shadow(0 0 14px rgba(255,200,60,.85))}
/* ================= FASE: PLANETAS ================= */
.grid8{display:-webkit-box;display:-webkit-flex;display:flex;-webkit-flex-wrap:wrap;flex-wrap:wrap;gap:8px;
  -webkit-box-pack:center;justify-content:center;max-width:352px;margin-top:10px}
.plb{width:78px;background:rgba(255,253,246,.95);border:2px solid var(--linha);border-bottom-width:5px;

  -webkit-box-shadow:0 5px 12px rgba(0,0,0,.3);box-shadow:0 5px 12px rgba(0,0,0,.3)}
.plb:active{-webkit-transform:translateY(2px);transform:translateY(2px)}
.plb img{width:56px;height:56px;object-fit:contain}
.plb .lab{font-size:11px;font-weight:700;margin-top:1px;color:var(--texto);line-height:1.1}

.plb.ok{border-color:#256113;background:-webkit-linear-gradient(top,#8be05a,#3f9a26);background:linear-gradient(#8be05a,#3f9a26)}
.plb.ok .lab{color:#12300a}
.plb.no{border-color:var(--coral);background:#ffece9;-webkit-animation:shk .4s;animation:shk .4s}

.fs{position:relative;-webkit-animation:pop .35s;animation:pop .35s}

/* ============ CACA-PALAVRAS DO CEU ============ */
/* a config fica FORA da funcao de proposito: o auditor de contraste/leiaute
   chama cada tela sem argumento, e sem isso o caca-palavras quebrava a banca. */
var CACACEU={lista:["SOL","LUA","TERRA","ESTRELA"],N:7,prog:66,conc:"luz_propria",
  txt:"Ache as <b>4 palavras</b> escondidas no c&#233;u do quadro.",
  intro:"sr_caca_intro",dica:"sr_caca_dica",dicaTxt:"As palavras est&#227;o deitadas ou em p&#233;.",
  revela:"sr_caca_revela",msg:"<b>Sol</b>, <b>Lua</b>, <b>Terra</b> e <b>estrela</b>: achou todas!",
  prox:null};
function telaCacaCeu(){ CACACEU.prox=telaPlanetasFicha; telaCacaBase(CACACEU); }
function telaCacaBase(cfg){
  cfg=cfg||CACACEU;
  var LISTA=cfg.lista;
  limpa();var t=el("div","tela");setProg(t,cfg.prog);
  t.appendChild(el("div","balao",cfg.txt));
  var N=cfg.N,gr=[],i,j,k;
  for(i=0;i<N;i++){gr[i]=[];for(j=0;j<N;j++)gr[i][j]="";}
  var pos={},achadas={},total=0;
  function poe(p){
    var tent=0;
    while(tent<400){
      tent++;
      var h=Math.random()<0.5?1:0;
      var r=Math.floor(Math.random()*N),c=Math.floor(Math.random()*N);
      if(h){ if(c+p.length>N) continue; } else { if(r+p.length>N) continue; }
      var ok=true,rr,cc;
      for(k=0;k<p.length;k++){ rr=h?r:r+k; cc=h?c+k:c; if(gr[rr][cc]&&gr[rr][cc]!==p.charAt(k)){ok=false;break;} }
      if(!ok) continue;
      for(k=0;k<p.length;k++){ rr=h?r:r+k; cc=h?c+k:c; gr[rr][cc]=p.charAt(k); }
      pos[p]={r:r,c:c,h:h,n:p.length};
      return true;
    }
    return false;
  }
  for(i=0;i<LISTA.length;i++){ if(poe(LISTA[i])) total++; }
  var AL="ABCDEFGHIJLMNOPRSTUV";
  for(i=0;i<N;i++)for(j=0;j<N;j++) if(!gr[i][j]) gr[i][j]=AL.charAt(Math.floor(Math.random()*AL.length));
  var cen=el("div","centro");
  var grade=el("div","grade"),cels=[],sel=null,trava=false;
  /* onde cada palavra ficou — SO para o auditor jogador conseguir resolver o
     caca-palavras (clicando ao acaso ele nunca acha). Nao aparece para ninguem. */
  grade.setAttribute("data-qa",JSON.stringify(pos));
  for(i=0;i<N;i++){ cels[i]=[];
    for(j=0;j<N;j++){ (function(r,c){
      var cl=el("div","cel",gr[r][c]);
      cl.style.width=(100/N)+"%";
      cl.onclick=function(){ arma(); clica(r,c,cl); };
      grade.appendChild(cl); cels[r][c]=cl;
    })(i,j); } }
  var lista=el("div","lista"),chips={};
  for(i=0;i<LISTA.length;i++){ var ch=el("div","pchip",LISTA[i]); chips[LISTA[i]]=ch; lista.appendChild(ch); }
  function caminho(r1,c1,r2,c2){
    var out=[],d,x;
    if(r1===r2){ d=c2>c1?1:-1; for(x=c1;;x+=d){ out.push([r1,x]); if(x===c2)break; } return out; }
    if(c1===c2){ d=r2>r1?1:-1; for(x=r1;;x+=d){ out.push([x,c1]); if(x===r2)break; } return out; }
    return null;
  }
  function clica(r,c,cl){
    if(trava) return;
    if(!sel){ sel={r:r,c:c,el:cl,ant:cl.className}; cl.className="cel sel"; sTap(); return; }
    if(sel.r===r&&sel.c===c){ sel.el.className=sel.ant; sel=null; return; }
    var ant=sel; sel=null;
    var achou=null,cam=caminho(ant.r,ant.c,r,c);
    if(cam){
      var pal="",bak="",x;
      for(x=0;x<cam.length;x++) pal+=gr[cam[x][0]][cam[x][1]];
      for(x=cam.length-1;x>=0;x--) bak+=gr[cam[x][0]][cam[x][1]];
      for(x=0;x<LISTA.length;x++){ if(achadas[LISTA[x]]) continue;
        if(pal===LISTA[x]||bak===LISTA[x]){ achou=LISTA[x]; break; } }
    }
    if(achou){
      achadas[achou]=1;
      for(k=0;k<cam.length;k++) cels[cam[k][0]][cam[k][1]].className="cel ok";
      chips[achou].className="pchip feito";
      sCerto(); reg(cfg.conc,true,1);
      var ce=centroTela(cels[cam[0][0]][cam[0][1]]); faisca(ce[0],ce[1],"#ffd43b",14);
      var n=0,z; for(z in achadas){ if(achadas.hasOwnProperty(z)) n++; }
      if(n>=total){ trava=true;
        setTimeout(function(){ depoisDaFala(cfg.revela,9000,function(){
          mostraBanner(cfg.msg,cfg.prox); }); },450); }
    } else {
      var v2=cl.className;
      ant.el.className="cel no"; cl.className="cel no"; sErro(); reg(cfg.conc,false,2);
      setTimeout(function(){
        if(ant.el.className==="cel no") ant.el.className=ant.ant;
        if(cl.className==="cel no") cl.className=v2;
      },600);
    }
  }
  cen.appendChild(grade);cen.appendChild(lista);
  cen.appendChild(el("div","hint","Toque na primeira e depois na &#250;ltima letra."));
  t.appendChild(cen);app.appendChild(t);
  montaBarra(cfg.dica,cfg.dicaTxt);
  falar(cfg.intro);
}

function segredoRelatorio(elm){

    tmr=setTimeout(function(){ tmr=null; telaPainel(); },2000); }
  function para(){ if(tmr){ clearTimeout(tmr); tmr=null; } }
  elm.addEventListener("mousedown",comeca);
  elm.addEventListener("touchstart",comeca);
  elm.addEventListener("mouseup",para);
  elm.addEventListener("mouseleave",para);
  elm.addEventListener("touchend",para);
  elm.addEventListener("touchcancel",para);
}

  if(tot>0){ var v=0,pa=Math.max(28,Math.round(1400/Math.max(1,acc)));

}
