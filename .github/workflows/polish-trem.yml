name: Polish Trem (vidro + pisca)

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout (Trem)"
        uses: actions/checkout@v4
        with:
          ref: claude/vc-nao-funcionando-0pya0w
          fetch-depth: 1
          sparse-checkout: |
            _trem
          sparse-checkout-cone-mode: true

      - name: "Anexa moldura de vidro ao tema.css + confere sha256"
        run: |
          echo "" | base64 -d > /tmp/pg.py
          python3 /tmp/pg.py
          H=$(sha256sum _trem/tema.css | cut -d' ' -f1); echo "sha=$H"
          test "$H" = "1847a0ddf7ea3a06ab1f7b89200cfb3346bce92294385e2892bc4216c3f1eade" && echo "TEMA SHA OK" || (echo "TEMA SHA DIFERE"; exit 1)

      - name: "Instala PIL numpy scipy"
        run: python3 -m pip install --quiet Pillow numpy scipy

      - name: "Gera pose pisca do Coru (+ montagem)"
        run: |
          echo "" | base64 -d > /tmp/pisca.py
          python3 /tmp/pisca.py

      - name: "Commit"
        run: |
          git config user.name "Polish CI"
          git config user.email "polish@users.noreply.github.com"
          git add -A _trem/tema.css _trem/img/tr_coru_pisca.png _trem/_pisca_check.png
          if git diff --cached --quiet; then echo "nada mudou"; else
            git commit -m "[polish] Trem: moldura de vidro nas figuras + pose pisca do Coru"
            git push origin HEAD:claude/vc-nao-funcionando-0pya0w
          fi
