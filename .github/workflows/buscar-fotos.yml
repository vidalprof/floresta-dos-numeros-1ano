name: Buscar fotos historicas (acervo publico)

# Baixa IMAGENS de paginas de acervo (Brasiliana Fotografica, arquivos publicos)
# e guarda um relatorio com legenda/credito de cada uma.
#
# POR QUE UM WORKFLOW: a rede do chat e travada (403 no CONNECT), entao eu nao
# consigo baixar nada de la. Aqui no Actions a internet e liberada — e o mesmo
# caminho que uso para gerar imagem e audio.
#
# ⚠️ SO PARA ACERVO EM DOMINIO PUBLICO OU COM AUTORIZACAO. O relatorio guarda a
# pagina de origem de cada arquivo para o CREDITO aparecer na tela: mesmo em
# dominio publico, o direito moral do autor continua — ele tem que ser citado.

on:
  workflow_dispatch:
    inputs:
      paginas:
        description: "URLs das paginas de acervo, separadas por virgula (deixe vazio se usar 'commons')"
        required: false
        default: ""
        type: string
      commons:
        description: "Busca no Wikimedia Commons (ex: Blumenau history). Traz LICENCA e AUTOR de cada foto."
        required: false
        default: ""
        type: string
      destino:
        description: "Pasta onde salvar (default _novo/fotos)"
        required: false
        default: "_novo/fotos"
        type: string
      minkb:
        description: "Ignorar imagens menores que isto (KB) - tira icone e logo"
        required: false
        default: "25"
        type: string
      max:
        description: "Maximo de imagens a baixar"
        required: false
        default: "40"
        type: string

jobs:
  buscar:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # ⚠️ o repositorio ja tem muita imagem e audio: um checkout completo levava
      # minutos so para comecar. Aqui a ferramenta so precisa da pasta de destino,
      # entao baixa SO a ultima versao, sem historico.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Baixar as imagens e montar o relatorio
        env:
          PAGINAS: ${{ inputs.paginas }}
          COMMONS: ${{ inputs.commons }}
          DEST: ${{ inputs.destino }}
          MINKB: ${{ inputs.minkb }}
          MAXN: ${{ inputs.max }}
        run: |
          python3 - <<'PY'
          import os, re, json, urllib.request, urllib.parse, hashlib

          paginas = [p.strip() for p in os.environ["PAGINAS"].split(",") if p.strip()]
          dest    = os.environ.get("DEST") or "_novo/fotos"
          minkb   = int(os.environ.get("MINKB") or "25")
          maxn    = int(os.environ.get("MAXN") or "40")
          os.makedirs(dest, exist_ok=True)

          UA = ("Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) "
                "Chrome/124.0 Safari/537.36")

          def pega(url, timeout=45):
              req = urllib.request.Request(url, headers={
                  "User-Agent": UA,
                  "Accept": "text/html,image/*,*/*",
                  "Accept-Language": "pt-BR,pt;q=0.9",
              })
              return urllib.request.urlopen(req, timeout=timeout).read()

          relatorio, baixadas, vistos = [], 0, set()

          for pag in paginas:
              print("=== pagina:", pag)
              try:
                  html = pega(pag).decode("utf-8", "replace")
              except Exception as e:
                  print("   !! nao abriu:", e)
                  continue

              titulo = ""
              mt = re.search(r"<title>(.*?)</title>", html, re.S | re.I)
              if mt:
                  titulo = re.sub(r"\s+", " ", mt.group(1)).strip()
              print("   titulo:", titulo[:110])

              # imagens: <img src>, srcset e links diretos para jpg
              alvos = []
              for m in re.finditer(r'<img[^>]+>', html, re.I):
                  tag = m.group(0)
                  src = re.search(r'src=["\']([^"\']+)["\']', tag, re.I)
                  if not src:
                      continue
                  leg = ""
                  for at in ("alt", "title"):
                      ma = re.search(at + r'=["\']([^"\']*)["\']', tag, re.I)
                      if ma and len(ma.group(1)) > len(leg):
                          leg = ma.group(1)
                  alvos.append((src.group(1), leg))
              for m in re.finditer(r'href=["\']([^"\']+\.(?:jpg|jpeg|png))["\']', html, re.I):
                  alvos.append((m.group(1), ""))

              for rel, leg in alvos:
                  if baixadas >= maxn:
                      break
                  url = urllib.parse.urljoin(pag, rel)
                  if url in vistos:
                      continue
                  vistos.add(url)
                  if re.search(r"logo|icon|avatar|banner|sprite|favicon|placeholder", url, re.I):
                      continue
                  try:
                      dados = pega(url)
                  except Exception as e:
                      print("   x", url[:90], e)
                      continue
                  if len(dados) < minkb * 1024:
                      continue
                  ext = ".jpg" if b"\xff\xd8" == dados[:2] else (".png" if dados[1:4] == b"PNG" else "")
                  if not ext:
                      continue
                  nome = "f%02d_%s%s" % (baixadas + 1, hashlib.md5(url.encode()).hexdigest()[:6], ext)
                  open(os.path.join(dest, nome), "wb").write(dados)
                  baixadas += 1
                  relatorio.append({
                      "arquivo": nome, "url": url, "pagina": pag,
                      "pagina_titulo": titulo, "legenda": re.sub(r"\s+", " ", leg).strip(),
                      "kb": round(len(dados) / 1024)
                  })
                  print("   OK %-28s %5d KB  %s" % (nome, len(dados) // 1024, leg[:60]))

          # ---- Wikimedia Commons: API propria, com licenca e autor declarados.
          # E a fonte CERTA para reuso: cada arquivo diz em que licenca esta e
          # quem e o autor, entao o credito na tela sai correto.
          busca = os.environ.get("COMMONS", "").strip()
          if busca:
              api = "https://commons.wikimedia.org/w/api.php"
              q = urllib.parse.urlencode({
                  "action": "query", "format": "json", "generator": "search",
                  "gsrsearch": busca, "gsrnamespace": "6", "gsrlimit": "50",
                  "prop": "imageinfo", "iiprop": "url|extmetadata|size",
                  "iiurlwidth": "1400",
              })
              try:
                  d = json.loads(pega(api + "?" + q).decode("utf-8", "replace"))
              except Exception as e:
                  print("!! commons nao respondeu:", e)
                  d = {}
              paginas_api = list((d.get("query", {}).get("pages", {}) or {}).values())
              print("=== commons: %d resultado(s) para %r" % (len(paginas_api), busca))
              for pg in paginas_api:
                  if baixadas >= maxn:
                      break
                  ii = (pg.get("imageinfo") or [{}])[0]
                  url = ii.get("thumburl") or ii.get("url")
                  if not url:
                      continue
                  meta = ii.get("extmetadata") or {}
                  def mv(k):
                      v = (meta.get(k) or {}).get("value", "")
                      return re.sub(r"<[^>]+>", " ", str(v)).strip()
                  lic = mv("LicenseShortName") or mv("License")
                  autor = mv("Artist")
                  data = mv("DateTimeOriginal") or mv("DateTime")
                  titulo_f = pg.get("title", "")
                  try:
                      dados = pega(url)
                  except Exception as e:
                      print("   x", titulo_f[:70], e)
                      continue
                  if len(dados) < minkb * 1024:
                      continue
                  ext = ".jpg" if dados[:2] == b"\xff\xd8" else (".png" if dados[1:4] == b"PNG" else "")
                  if not ext:
                      continue
                  nome = "c%02d_%s%s" % (baixadas + 1, hashlib.md5(url.encode()).hexdigest()[:6], ext)
                  open(os.path.join(dest, nome), "wb").write(dados)
                  baixadas += 1
                  relatorio.append({
                      "arquivo": nome, "url": url, "commons": titulo_f,
                      "autor": autor, "data": data, "licenca": lic,
                      "descricao": mv("ImageDescription")[:300], "kb": round(len(dados) / 1024),
                      "pagina": "https://commons.wikimedia.org/wiki/" + urllib.parse.quote(titulo_f.replace(" ", "_")),
                  })
                  print("   OK %-26s %5d KB  [%s] %s" % (nome, len(dados)//1024, lic[:18], titulo_f[:52]))

          json.dump(relatorio, open(os.path.join(dest, "fotos.json"), "w", encoding="utf-8"),
                    ensure_ascii=False, indent=1)
          print("\n>>> %d imagem(ns) baixada(s) em %s" % (baixadas, dest))
          PY

      - name: Commitar
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add "${{ inputs.destino }}" || true
          git commit -m "fotos: baixa acervo publico -> ${{ inputs.destino }}" || { echo "nada a commitar"; exit 0; }
          for k in 1 2 3 4; do
            git pull --rebase origin "${GITHUB_REF_NAME}" || true
            git push origin "HEAD:${GITHUB_REF_NAME}" && break || sleep $((k*3))
          done
