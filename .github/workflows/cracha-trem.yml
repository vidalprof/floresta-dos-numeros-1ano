name: Cracha Trem (despeckle dos avatares)

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  cracha:
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout (Trem)"
        uses: actions/checkout@v4
        with:
          ref: claude/vc-nao-funcionando-0pya0w
          fetch-depth: 1
          sparse-checkout: |
            _trem
          sparse-checkout-cone-mode: true

      - name: "Instala PIL numpy scipy"
        run: python3 -m pip install --quiet Pillow numpy scipy

      - name: "Recorta crachas com despeckle"
        run: |
          echo "" | base64 -d > /tmp/cracha.py
          python3 /tmp/cracha.py

      - name: "Commit"
        run: |
          git config user.name "Cracha CI"
          git config user.email "cracha@users.noreply.github.com"
          git add -A _trem/img/tr_cr1.png _trem/img/tr_cr2.png _trem/img/tr_cr3.png _trem/img/tr_cr4.png _trem/img/tr_cr5.png _trem/img/tr_cr6.png _trem/_cracha_check.png
          if git diff --cached --quiet; then echo "nada mudou"; else
            git commit -m "[cracha] Trem: avatares sem respingos (despeckle, mantem so a crianca)"
            git push origin HEAD:claude/vc-nao-funcionando-0pya0w
          fi
