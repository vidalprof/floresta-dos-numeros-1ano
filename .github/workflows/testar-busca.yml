name: Testar a busca da Oficina de Video (com internet de verdade)

# ⚠️⚠️ POR QUE ESTE WORKFLOW EXISTE. O Marcos disse "esse buscar nao faz nada",
# e eu NAO CONSIGO conferir daqui: no chat a rede e travada, entao a cobaia
# testa a busca com um `fetch` de MENTIRA. Isso prova a leitura e a importacao,
# e nao prova NADA sobre a rede — que e justamente onde a falha pode estar.
#
# ⭐ A internet mora no GitHub. Aqui o runner abre o SITE PUBLICADO num
# navegador de verdade, digita, clica em Buscar e conta o que aconteceu:
# o que a API respondeu, o que apareceu na tela, e cada erro de console.
# E deixa o relatorio em `_status/busca-oficina.json`, que eu leio com um
# `git fetch` por 300 bytes — em vez de `actions_list`, que come a conversa.
#
# ⚠️ O QUE ELE AINDA NAO PROVA: que a rede DA ESCOLA deixa passar. O runner do
# GitHub tem internet aberta; o laboratorio tem filtro. Se aqui passar e la
# nao, a resposta e "a rede da escola bloqueia" — e quem libera e quem cuida
# dela. Dizer isso e parte do teste.

on:
  workflow_dispatch:
    inputs:
      url:
        description: "Endereco do editor publicado"
        required: false
        default: "https://vidalprof.github.io/a-oficina-de-video/"
        type: string
      termo:
        description: "O que buscar"
        required: false
        default: "floresta"
        type: string

jobs:
  testar:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar o navegador
        run: |
          npm i -D playwright@1.47.0
          npx playwright install --with-deps chromium

      - name: Abrir o site e usar a busca
        env:
          URL: ${{ inputs.url }}
          TERMO: ${{ inputs.termo }}
        run: |
          cat > /tmp/teste.js <<'JS'
          const { chromium } = require('playwright');
          (async () => {
            const url = process.env.URL, termo = process.env.TERMO;
            const b = await chromium.launch();
            const pg = await b.newPage({ viewport: { width: 1366, height: 768 } });
            const erros = [], rede = [];
            pg.on('pageerror', e => erros.push('pageerror: ' + (e.message || e)));
            pg.on('console', m => { if (m.type() === 'error') erros.push('console: ' + m.text()); });
            pg.on('response', r => {
              if (r.url().indexOf('wikimedia') >= 0)
                rede.push(r.status() + ' ' + r.url().slice(0, 120));
            });
            pg.on('requestfailed', r => {
              if (r.url().indexOf('wikimedia') >= 0)
                rede.push('FALHOU ' + (r.failure() && r.failure().errorText) + ' ' + r.url().slice(0, 120));
            });

            const saida = { url: url, termo: termo, quando: new Date().toISOString() };
            try {
              await pg.goto(url + '?v=' + Date.now(), { waitUntil: 'load', timeout: 60000 });
              await pg.waitForTimeout(1200);
              saida.abriu = true;
              // fecha a tela de boas-vindas
              if (await pg.locator('#mdOk').count()) await pg.click('#mdOk');
              await pg.waitForTimeout(300);

              // o botao Buscar existe na barra?
              saida.temBotao = (await pg.locator('[data-qa="f-buscar"]').count()) > 0;
              if (!saida.temBotao) throw new Error('a barra nao tem o botao Buscar (versao velha no ar?)');
              await pg.click('[data-qa="f-buscar"]');
              await pg.waitForTimeout(400);
              saida.abriuGaveta = (await pg.locator('#qBusca').count()) > 0;
              if (!saida.abriuGaveta) throw new Error('a gaveta da busca nao abriu');

              await pg.fill('#qBusca', termo);
              await pg.click('[data-qa="buscar"]');
              await pg.waitForTimeout(14000);

              saida.achados = await pg.evaluate(() =>
                (typeof achados !== 'undefined' && achados) ? achados.length : -1);
              saida.tela = (await pg.locator('#resBusca').innerText()).slice(0, 300);
              saida.miniaturas = await pg.locator('#grAchados .achado').count();

              // e trazer uma para a fita?
              if (saida.miniaturas > 0) {
                const antes = await pg.evaluate(() => PROJ.clipes.length);
                await pg.click('#grAchados [data-i="0"]');
                await pg.waitForTimeout(6000);
                saida.entrou = await pg.evaluate(a => PROJ.clipes.length > a, antes);
                saida.credito = await pg.evaluate(() => (PROJ.creditos || [])[0] || null);
                saida.palcoLimpo = await pg.evaluate(() => {
                  try { ctx.getImageData(0, 0, 1, 1); return true; } catch (e) { return false; }
                });
              }
            } catch (e) {
              saida.erro = String(e.message || e);
            }
            saida.rede = rede.slice(0, 8);
            saida.erros = erros.slice(0, 8);
            saida.veredito = saida.miniaturas > 0
              ? (saida.entrou ? 'FUNCIONA' : 'ACHOU MAS NAO TROUXE')
              : 'NAO ACHOU NADA';
            require('fs').writeFileSync('_status/busca-oficina.json',
              JSON.stringify(saida, null, 1));
            console.log(JSON.stringify(saida, null, 1));
            await b.close();
          })().catch(e => {
            require('fs').writeFileSync('_status/busca-oficina.json',
              JSON.stringify({ veredito: 'NAO MEDI', erro: String(e && e.message) }, null, 1));
            console.log('NAO MEDI:', e && e.message);
          });
          JS
          mkdir -p _status
          node /tmp/teste.js
          {
            echo "## Teste da busca"
            echo '```json'
            cat _status/busca-oficina.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Guardar o relatorio
        if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add _status/busca-oficina.json || true
          git diff --cached --quiet && exit 0
          git commit -m "busca: relatorio do teste com internet"
          for i in 1 2 3 4; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && \
            git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep $((i * 3))
          done
          exit 1
