name: Ver rodando (joga nas atividades de referencia da internet e fotografa)

# 👀 VER A DINAMICA FUNCIONANDO — de verdade, num Chromium, nao em texto.
#
# Pedido do Marcos (set/2026): *"pesquise e veja essas atividades rodando em
# atividades na internet funcionando para deixar elas lapidadas da melhor forma
# possivel"*. O `pesquisar.yml` le TEXTO; este ABRE a atividade de referencia
# (H5P, PhET, Math Learning Center, Toy Theater, Wordwall, LearningApps, sites
# brasileiros), CLICA e ARRASTA nela, tira fotos (PC 1024x600 e celular 412x820)
# e mede o que ela faz por baixo: eventos que os alvos escutam, touch-action,
# tamanho de alvo, fonte minima, som (media/WebAudio), quantas mutacoes de DOM o
# feedback dispara no 1o segundo. Tudo vai para `_pesquisa/rodando/<lote>/`
# (RODANDO.md + .jpg + .json) e e commitado — dai eu leio e comparo com as nossas.
#
# ⚠️ Materia-prima, nao regra. Quem decide o que vira regra da casa sou eu;
#    quem aprova e o Marcos.

on:
  # ⚠️ Workflow NOVO numa branch que nao e a `main` nao aceita `workflow_dispatch`
  #    pela API (404 ate existir na main). O gatilho por PUSH funciona em qualquer
  #    branch: eu escrevo o pedido em `_pesquisa/rodando/PEDIDO.json` (lote, alvos,
  #    buscas, max), commito, e ele roda. Os inputs abaixo continuam valendo quando
  #    o dispatch existir.
  push:
    paths:
      - "_pesquisa/rodando/PEDIDO.json"
  workflow_dispatch:
    inputs:
      lote:
        description: "Nome da pasta de saida em _pesquisa/rodando/ (vazio = referencias-<data>)"
        required: false
        default: ""
        type: string
      alvos:
        description: "Linhas nome=url (vazio = a lista padrao de referencias)"
        required: false
        default: ""
        type: string
      buscas:
        description: "Linhas nome=busca (DuckDuckGo; abre os 2 primeiros resultados de cada)"
        required: false
        default: ""
        type: string
      max:
        description: "Maximo de alvos (padrao 45)"
        required: false
        default: "45"
        type: string

jobs:
  ver:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Instalar Playwright + Chromium
        run: |
          npm init -y >/dev/null 2>&1 || true
          npm install --no-audit --no-fund playwright@1.47.2
          npx playwright install --with-deps chromium

      - name: Montar a lista de alvos (padrao + buscas)
        id: alvos
        env:
          ALVOS: ${{ inputs.alvos }}
          BUSCAS: ${{ inputs.buscas }}
          MAX: ${{ inputs.max }}
          LOTE: ${{ inputs.lote }}
        run: |
          # sem inputs (gatilho por push): le o pedido em _pesquisa/rodando/PEDIDO.json
          if [ -z "$ALVOS$BUSCAS$LOTE" ] && [ -f _pesquisa/rodando/PEDIDO.json ]; then
            eval "$(python3 - <<'PY'
          import json, shlex
          p = json.load(open('_pesquisa/rodando/PEDIDO.json', encoding='utf-8'))
          for k in ('lote', 'alvos', 'buscas', 'max'):
              v = p.get(k, '')
              if isinstance(v, list): v = '\n'.join(v)
              print('export %s=%s' % (k.upper(), shlex.quote(str(v))))
          PY
          )"
            echo "pedido lido de _pesquisa/rodando/PEDIDO.json (lote=$LOTE)"
          fi
          LOTE_NOME="${LOTE:-referencias-$(date -u +%Y-%m-%d)}"
          LOTE_NOME="$(echo "$LOTE_NOME" | tr -c 'a-zA-Z0-9-\n' '-' | tr 'A-Z' 'a-z')"
          echo "lote=$LOTE_NOME" >> "$GITHUB_OUTPUT"
          node - <<'JS'
          const fs = require('fs');
          const MAX = Math.max(1, Math.min(80, parseInt(process.env.MAX || '45', 10) || 45));
          /* a lista padrao: as casas que fazem o nosso leque ha anos, uma pagina por mecanica */
          const PADRAO = `
          h5p-arrastar-soltar=https://h5p.org/drag-and-drop
          h5p-memoria=https://h5p.org/memory-game
          h5p-caca-palavras=https://h5p.org/find-the-words
          h5p-cruzadinha=https://h5p.org/crossword
          h5p-arrastar-palavras=https://h5p.org/drag-the-words
          h5p-lacunas=https://h5p.org/fill-in-the-blanks
          h5p-sequencia-imagens=https://h5p.org/image-sequencing
          h5p-ordenar-paragrafos=https://h5p.org/sort-the-paragraphs
          h5p-pares-imagem=https://h5p.org/image-pairing
          h5p-marcar-palavras=https://h5p.org/mark-the-words
          h5p-pontos-na-imagem=https://h5p.org/image-hotspots
          h5p-achar-na-imagem=https://h5p.org/find-the-hotspot
          h5p-ditado=https://h5p.org/dictation
          h5p-quiz=https://h5p.org/single-choice-set
          h5p-verdadeiro-falso=https://h5p.org/true-false
          h5p-linha-do-tempo=https://h5p.org/timeline
          h5p-flashcards=https://h5p.org/flashcards
          phet-balanca=https://phet.colorado.edu/sims/html/balancing-act/latest/balancing-act_all.html
          phet-fazer-dez=https://phet.colorado.edu/sims/html/make-a-ten/latest/make-a-ten_all.html
          phet-reta-numerica=https://phet.colorado.edu/sims/html/number-line-integers/latest/number-line-integers_all.html
          phet-fracoes=https://phet.colorado.edu/sims/html/fraction-matcher/latest/fraction-matcher_all.html
          phet-arranjo=https://phet.colorado.edu/sims/html/area-model-multiplication/latest/area-model-multiplication_all.html
          mlc-reta-numerica=https://apps.mathlearningcenter.org/number-line/
          mlc-base-dez=https://apps.mathlearningcenter.org/number-pieces/
          mlc-relogio=https://apps.mathlearningcenter.org/math-clock/
          mlc-pecas-padrao=https://apps.mathlearningcenter.org/pattern-shapes/
          mlc-geoboard=https://apps.mathlearningcenter.org/geoboard/
          toytheater-relogio=https://toytheater.com/clock/
          toytheater-tangram=https://toytheater.com/tangram/
          toytheater-base-dez=https://toytheater.com/base-ten-blocks/
          learningapps-inicio=https://learningapps.org/
          wordwall-inicio=https://wordwall.net/pt
          escolagames-jogos=https://www.escolagames.com.br/jogos/
          pbskids-jogos=https://pbskids.org/games/
          jclic-demo=https://clic.xtec.cat/repo/index.html?prj=demo
          `;
          const linhas = (process.env.ALVOS && process.env.ALVOS.trim()) ? process.env.ALVOS : PADRAO;
          const alvos = [];
          for (const l of linhas.split(/\n|,(?=\s*[a-z0-9\-]+=)/)) {
            const m = l.trim().match(/^([a-zA-Z0-9\-]+)=(https?:\/\/\S+)$/);
            if (m) alvos.push({nome: m[1], url: m[2]});
          }
          /* buscas: DuckDuckGo HTML, sem chave; abre os 2 primeiros de cada */
          /* ⚠️⚠️ (set/2026) DOIS lotes seguidos com TODAS as buscas vazias, em silencio.
             Busca que nao acha tem que DIZER por que. Agora: tenta tres portas do
             DuckDuckGo (POST html, GET html, lite), guarda o status e um pedaco da
             resposta de cada tentativa em BUSCAS.md (commitado junto), e o resumo
             do job grita quantas buscas voltaram vazias. */
          const UA = 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36';
          const DIAG = [];
          function extrai(t) {
            const out = [];
            const pega = h => { const u = h.match(/uddg=([^&]+)/); if (u) h = decodeURIComponent(u[1]);
              if (/^https?:\/\//.test(h) && !/duckduckgo\.com/.test(h) && !out.includes(h)) out.push(h); };
            for (const tag of t.matchAll(/<a\b[^>]*class="[^"]*result__a[^"]*"[^>]*>/g)) { const hm = tag[0].match(/href="([^"]+)"/); if (hm) pega(hm[1]); }
            if (!out.length) for (const m of t.matchAll(/<a\b[^>]*rel="nofollow"[^>]*href="([^"]+)"/g)) pega(m[1]);
            if (!out.length) for (const m of t.matchAll(/href="(\/\/duckduckgo\.com\/l\/\?uddg=[^"]+)"/g)) pega(m[1]);
            return out.slice(0, 2);
          }
          async function procura(q) {
            const portas = [
              ['POST html', () => fetch('https://html.duckduckgo.com/html/', {method: 'POST', headers: {'Content-Type': 'application/x-www-form-urlencoded', 'User-Agent': UA, 'Accept': 'text/html'}, body: 'q=' + encodeURIComponent(q) + '&kl=br-pt'})],
              ['GET html',  () => fetch('https://html.duckduckgo.com/html/?q=' + encodeURIComponent(q), {headers: {'User-Agent': UA, 'Accept': 'text/html'}})],
              ['GET lite',  () => fetch('https://lite.duckduckgo.com/lite/?q=' + encodeURIComponent(q), {headers: {'User-Agent': UA, 'Accept': 'text/html'}})],
            ];
            for (const [nome, vai] of portas) {
              try {
                const r = await vai(); const t = await r.text(); const out = extrai(t);
                DIAG.push({q, porta: nome, status: r.status, tam: t.length, achou: out.length, trecho: out.length ? '' : t.replace(/\s+/g, ' ').slice(0, 240)});
                if (out.length) return out;
              } catch (e) { DIAG.push({q, porta: nome, status: 'erro', tam: 0, achou: 0, trecho: String(e.message).slice(0, 160)}); }
              await new Promise(r => setTimeout(r, 1500));
            }
            return [];
          }
          (async () => {
            const bs = (process.env.BUSCAS || '').split('\n').map(s => s.trim()).filter(Boolean);
            for (const b of bs) {
              const m = b.match(/^([a-zA-Z0-9\-]+)=(.+)$/); if (!m) continue;
              const urls = await procura(m[2]);
              urls.forEach((u, i) => alvos.push({nome: m[1] + (i ? '-' + (i + 1) : ''), url: u}));
              console.log('busca "' + m[2] + '" -> ' + urls.join(' | '));
            }
            const fim = alvos.slice(0, MAX);
            fs.writeFileSync('/tmp/alvos.json', JSON.stringify(fim));
            fs.writeFileSync('/tmp/buscas_diag.json', JSON.stringify({buscas: bs.length, achadas: DIAG.filter(d => d.achou).length, diag: DIAG}, null, 1));
            const vazias = bs.filter(b => !DIAG.some(d => d.q === b.replace(/^[^=]+=/, '') && d.achou)).length;
            if (bs.length && vazias) console.log('::warning::' + vazias + ' de ' + bs.length + ' busca(s) voltaram VAZIAS — ver BUSCAS.md no lote');
            console.log(fim.length + ' alvo(s):'); fim.forEach(a => console.log('  ' + a.nome + '  ' + a.url));
          })();
          JS

      - name: Jogar e fotografar
        env:
          LOTE: ${{ steps.alvos.outputs.lote }}
        run: |
          export ALVOS_JSON="$(cat /tmp/alvos.json)"
          export DEST="_pesquisa/rodando/$LOTE"
          export NODE_PATH="$(pwd)/node_modules"
          node _padrao/ver_rodando.js 2>&1 | tee /tmp/ver_rodando.log
          # o diagnostico das buscas vai junto com o lote (busca vazia tem que ter motivo escrito)
          if [ -f /tmp/buscas_diag.json ]; then node - <<'JS'
          const fs = require('fs'); const d = JSON.parse(fs.readFileSync('/tmp/buscas_diag.json', 'utf8'));
          const L = ['# 🔎 BUSCAS deste lote — ' + d.buscas + ' pedida(s), ' + d.achadas + ' tentativa(s) com resultado', '',
                     '| busca | porta | status | tamanho | achou | trecho da resposta (quando vazia) |', '|---|---|--:|--:|--:|---|'];
          for (const x of d.diag) L.push('| ' + x.q + ' | ' + x.porta + ' | ' + x.status + ' | ' + x.tam + ' | ' + x.achou + ' | ' + (x.trecho || '').replace(/\|/g, '/') + ' |');
          fs.writeFileSync(process.env.DEST + '/BUSCAS.md', L.join('\n') + '\n');
          JS
          fi
          echo "## 👀 Ver rodando — $LOTE" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"; grep -E "^==|frames=|erro" /tmp/ver_rodando.log | head -120 >> "$GITHUB_STEP_SUMMARY"; echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Guardar no repo
        env:
          LOTE: ${{ steps.alvos.outputs.lote }}
        run: |
          rm -rf node_modules package.json package-lock.json
          git config user.name "Pesquisador"
          git config user.email "pesquisador@users.noreply.github.com"
          git add -A "_pesquisa/rodando/$LOTE" || true
          if git diff --cached --quiet; then echo "nada novo";
          else
            git commit -m "ver rodando: $LOTE ($(ls _pesquisa/rodando/$LOTE/*.jpg 2>/dev/null | wc -l) fotos)"
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
