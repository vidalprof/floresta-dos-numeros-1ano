name: Gerar lote GRATIS (Pollinations + recorte no proprio Actions)

# 💰 O CAMINHO SEM CONTA DE LUZ.
#
# Cobranca do Marcos (ago/2026): *"tem alguma alternativa ao Gemini? Pois estou
# gastando bastante com as imagens nas atividades"*.
#
# A conta que ele sentiu, medida: o Gemini custa R$0,20 por chamada (registrado
# no MANUAL-MESTRE) e cada atividade tem de 35 a 54 figuras — R$7 a R$11 por
# atividade, quando o lote inteiro passa por la (e o `finalizar.yml` mandava
# tudo para la).
#
# So que o Gemini nao estava sendo pago pela IMAGEM: o Pollinations desenha de
# graca. Estava sendo pago pelo RECORTE — o fundo transparente que a peca
# precisa para entrar na cena da atividade. E recorte nao precisa de modelo
# pago: `rembg` roda dentro do proprio Actions, de graca, e faz o mesmo servico.
#
# Entao este workflow e o caminho barato inteiro, numa corrida so:
#   1. desenha no Pollinations (gratis, sem chave nenhuma);
#   2. tira o fundo com o rembg (gratis, dentro do runner);
#   3. apara a sobra em volta (bbox), que e o que faz a peca "assentar" na tela;
#   4. commita.
#
# ⚠️ O QUE ELE NAO FAZ, e por isso o Gemini continua existindo: **editar uma
#    imagem base**. As tres camadas do mascote (parada / falando / piscando)
#    TEM que ser edicao da mesma pose, senao o boneco treme (ver o
#    `_qa/mascote.py`). Isso continua no `gerar-imagens.yml` com `modelo=gemini`
#    e `base=...` — sao 2 ou 3 chamadas por atividade, nao 25.
#
# Uso:  arquivo = JSON com [{"nome":..., "prompt":..., "grupo":...}]
#       dest    = _novo (producao) ou _prova_recorte (teste)
#       nomes   = opcional, so estes (separados por virgula)

on:
  workflow_dispatch:
    inputs:
      arquivo:
        description: "JSON do lote (ex: _gerar_imagens.json)"
        required: false
        default: "_gerar_imagens.json"
        type: string
      dest:
        description: "Pasta de saida (_novo ou _prova_recorte)"
        required: false
        default: "_novo"
        type: string
      nomes:
        description: "So estes nomes, separados por virgula (vazio = todos)"
        required: false
        default: ""
        type: string
      w:
        description: "largura"
        required: false
        default: "1024"
        type: string
      h:
        description: "altura"
        required: false
        default: "1024"
        type: string

jobs:
  lote:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # so o que interessa: o repositorio tem ~1 GB de imagem e audio.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*.json
            /_novo/
            /_prova_recorte/

      - name: Ferramentas do recorte
        run: |
          python3 -m pip install --quiet --upgrade pip
          # rembg faz o recorte; onnxruntime e o motor dele; pillow apara a sobra
          python3 -m pip install --quiet "rembg[cpu]" onnxruntime pillow

      - name: Desenhar e recortar
        env:
          ARQUIVO: ${{ inputs.arquivo }}
          DEST: ${{ inputs.dest }}
          NOMES: ${{ inputs.nomes }}
          W: ${{ inputs.w }}
          H: ${{ inputs.h }}
        run: |
          python3 - <<'PY'
          import io, json, os, re, time, urllib.parse, urllib.request
          from PIL import Image

          arq = os.environ.get("ARQUIVO", "_gerar_imagens.json").strip()
          dest = re.sub(r"[^A-Za-z0-9_/-]", "", os.environ.get("DEST", "_novo").strip() or "_novo")
          filtro = [n.strip() for n in os.environ.get("NOMES", "").split(",") if n.strip()]
          W = os.environ.get("W", "1024"); H = os.environ.get("H", "1024")
          os.makedirs(dest, exist_ok=True)

          if not os.path.exists(arq):
              raise SystemExit("::error::nao achei o arquivo do lote: %s" % arq)
          lote = json.load(io.open(arq, encoding="utf-8"))
          if isinstance(lote, dict):
              lote = lote.get("pecas") or lote.get("gerar") or []
          if filtro:
              lote = [x for x in lote if x.get("nome") in filtro]
          if not lote:
              raise SystemExit("::error::lote vazio (o filtro `nomes` bate com alguma coisa?)")

          def desenha(prompt):
              u"""Pollinations. Ele e gratis e as vezes solu&ccedil;a — por isso insiste, e
              troca de motor quando um cai (a li&ccedil;&atilde;o da cartografia)."""
              motores = ["flux", "turbo", "flux-realism", ""]
              base = "https://image.pollinations.ai/prompt/%s?width=%s&height=%s&nologo=true" % (
                  urllib.parse.quote(prompt), W, H)
              ultimo = None
              for tent, espera in enumerate([8, 20, 45, 0]):
                  mot = motores[min(tent, len(motores) - 1)]
                  url = base + ("&model=" + mot if mot else "")
                  try:
                      req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0"})
                      dados = urllib.request.urlopen(req, timeout=180).read()
                      if dados and len(dados) > 4000:
                          return dados
                      ultimo = "resposta vazia (%d bytes)" % len(dados or b"")
                  except Exception as e:
                      ultimo = str(e)[:150]
                  print("  pollinations [%s] tentativa %d: %s" % (mot or "padrao", tent + 1, ultimo))
                  if espera:
                      time.sleep(espera)
              raise RuntimeError("Pollinations nao devolveu imagem: %s" % ultimo)

          # a CENA (fundo, cenario) fica com o fundo dela; a PECA e que precisa
          # de recorte. O campo `grupo` do lote ja diz qual e qual.
          def e_cena(it):
              g = (it.get("grupo") or "").lower()
              n = (it.get("nome") or "").lower()
              return ("cena" in g or "fundo" in g or "cenario" in g
                      or n.endswith("_fundo") or "fundo" in n)

          from rembg import remove, new_session
          sessao = new_session("u2net")

          feitos, falhas = [], []
          for it in lote:
              nome = re.sub(r"[^A-Za-z0-9_-]", "_", (it.get("nome") or "").strip())
              prompt = (it.get("prompt") or "").strip()
              if not nome or not prompt:
                  falhas.append("%s: sem nome ou sem prompt" % (nome or "?")); continue
              print("== %s" % nome)
              try:
                  bruto = desenha(prompt)
                  if e_cena(it):
                      img = Image.open(io.BytesIO(bruto)).convert("RGB")
                      saida = os.path.join(dest, nome + ".png")
                      img.save(saida, optimize=True)
                      print("   cena (sem recorte) -> %s" % saida)
                  else:
                      cortado = remove(bruto, session=sessao)
                      img = Image.open(io.BytesIO(cortado)).convert("RGBA")
                      bb = img.getbbox()
                      # ⚠️ recorte que apagou TUDO nao e recorte: e peca perdida.
                      #    Melhor gritar do que commitar um PNG vazio (a licao do
                      #    quadradinho vazio que o Marcos pegou no jogo da memoria).
                      if not bb or (bb[2] - bb[0]) < 40 or (bb[3] - bb[1]) < 40:
                          falhas.append("%s: o recorte comeu a figura inteira" % nome); continue
                      img = img.crop(bb)
                      saida = os.path.join(dest, nome + ".png")
                      img.save(saida, optimize=True)
                      print("   recortado -> %s (%dx%d)" % (saida, img.size[0], img.size[1]))
                  feitos.append(nome)
              except Exception as e:
                  falhas.append("%s: %s" % (nome, str(e)[:140]))

          print("\n%d feita(s), %d falha(s)" % (len(feitos), len(falhas)))
          for f in falhas:
              print("::warning::%s" % f)
          resumo = os.environ.get("GITHUB_STEP_SUMMARY")
          if resumo:
              with io.open(resumo, "a", encoding="utf-8") as s:
                  s.write(u"### Lote GRATIS (Pollinations + rembg)\n\n")
                  s.write(u"- feitas: %d -> `%s`\n" % (len(feitos), dest))
                  s.write(u"- falhas: %d\n" % len(falhas))
                  for f in falhas:
                      s.write(u"  - %s\n" % f)
                  s.write(u"\n**custo: R$ 0,00** (nenhuma chamada paga)\n")
          if not feitos:
              raise SystemExit("::error::nenhuma imagem saiu")
          PY

      - name: Commitar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A "${{ inputs.dest }}"
          git diff --cached --quiet && { echo "nada mudou"; exit 0; }
          git commit -m "imagens: lote GRATIS (pollinations + recorte no runner)"
          for i in 1 2 3 4; do git push && break || sleep $((2**i)); done
