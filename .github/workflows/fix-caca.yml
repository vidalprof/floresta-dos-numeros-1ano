name: Fix caca (caca-palavras facil 1o ano)

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (branch de trabalho: Trem + motor)
        uses: actions/checkout@v4
        with:
          ref: claude/vc-nao-funcionando-0pya0w
          fetch-depth: 1
          sparse-checkout: |
            _trem
            _padrao/ESQUELETO
          sparse-checkout-cone-mode: true

      - name: Aplica o patch (caca FACIL)
        run: |
          echo "" | base64 -d > /tmp/p.py
          cat /tmp/p.py
          python3 /tmp/p.py
          python3 -c "import ast; ast.parse(open('_trem/build_conteudo.py').read()); print('bc ast OK')"
          node --check _padrao/ESQUELETO/pecas.js && echo "pecas.js OK"

      - name: Commit
        run: |
          git config user.name "Patch CI"
          git config user.email "patch@users.noreply.github.com"
          git add -A _trem _padrao/ESQUELETO
          if git diff --cached --quiet; then echo "nada mudou"; else
            git commit -m "[patch] Trem: caca-palavras FACIL (so deitada e em pe, 1o ano)"
            git push origin HEAD:claude/vc-nao-funcionando-0pya0w
          fi
