name: Patch Trem (aplica patch base64 no _trem)

on:
  workflow_dispatch:
    inputs:
      patch_b64:
        description: "patch python (base64) que edita arquivos em _trem/"
        required: true

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (branch de trabalho, so o Trem)
        uses: actions/checkout@v4
        with:
          ref: claude/vc-nao-funcionando-0pya0w
          fetch-depth: 1
          sparse-checkout: |
            _trem
          sparse-checkout-cone-mode: true

      - name: Aplica o patch
        run: |
          printf '%s' "${{ inputs.patch_b64 }}" | base64 -d > /tmp/p.py
          echo "---- patch ----"; cat /tmp/p.py; echo "---------------"
          python3 /tmp/p.py
          python3 -c "import ast; ast.parse(open('_trem/build_conteudo.py').read()); print('build_conteudo ast OK')"

      - name: Commit na branch de trabalho
        run: |
          git config user.name "Patch CI"
          git config user.email "patch@users.noreply.github.com"
          git add -A _trem
          if git diff --cached --quiet; then
            echo "nada mudou"
          else
            git commit -m "[patch] Trem: edicao pontual (via patch-trem)"
            git push origin HEAD:claude/vc-nao-funcionando-0pya0w
          fi
