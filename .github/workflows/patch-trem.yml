name: Patch Trem (aplica patch base64 no _trem e no motor)

on:
  workflow_dispatch:
    inputs:
      patch_b64:
        description: "patch python (base64) que edita _trem/ e/ou _padrao/ESQUELETO/"
        required: true

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (branch de trabalho: Trem + motor)
        uses: actions/checkout@v4
        with:
          ref: claude/vc-nao-funcionando-0pya0w
          fetch-depth: 1
          sparse-checkout: |
            _trem
            _padrao/ESQUELETO
          sparse-checkout-cone-mode: true

      - name: Aplica o patch
        run: |
          printf '%s' "${{ inputs.patch_b64 }}" | base64 -d > /tmp/p.py
          echo "---- patch ----"; cat /tmp/p.py; echo "---------------"
          python3 /tmp/p.py
          python3 -c "import ast; ast.parse(open('_trem/build_conteudo.py').read()); print('build_conteudo ast OK')"
          if command -v node >/dev/null 2>&1; then node --check _padrao/ESQUELETO/pecas.js && echo "pecas.js JS OK"; fi

      - name: Commit na branch de trabalho
        run: |
          git config user.name "Patch CI"
          git config user.email "patch@users.noreply.github.com"
          git add -A _trem _padrao/ESQUELETO
          if git diff --cached --quiet; then
            echo "nada mudou"
          else
            git commit -m "[patch] Trem/motor: edicao pontual (via patch-trem)"
            git push origin HEAD:claude/vc-nao-funcionando-0pya0w
          fi
