name: Recut Trem (recorta figuras das fotos)

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  recut:
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout (Trem, com as fotos)"
        uses: actions/checkout@v4
        with:
          ref: claude/vc-nao-funcionando-0pya0w
          fetch-depth: 1
          sparse-checkout: |
            _trem
          sparse-checkout-cone-mode: true

      - name: "Instala PIL numpy scipy"
        run: python3 -m pip install --quiet Pillow numpy scipy

      - name: "Recorta"
        run: |
          echo "" | base64 -d > /tmp/cutter.py
          python3 /tmp/cutter.py

      - name: "Commit figuras recortadas"
        run: |
          git config user.name "Recut CI"
          git config user.email "recut@users.noreply.github.com"
          git add -A _trem/img _trem/_montagem.png
          if git diff --cached --quiet; then echo "nada mudou"; else
            git commit -m "[recut v2] Trem: figuras sem fundo (dilatacao junta partes finas)"
            git push origin HEAD:claude/vc-nao-funcionando-0pya0w
          fi
