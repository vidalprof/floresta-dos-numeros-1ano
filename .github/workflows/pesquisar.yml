name: Pesquisar na internet (busca + leitura -> texto no repo)

# 🔎 A PESQUISA DE VERDADE — a internet mora AQUI, nao no chat.
#
# Lembrete do Marcos (ago/2026): *"veja, mas você pode usar o GitHub para
# pesquisar, lembra? nós fazemos tudo de lá"*. Ele estava certo e eu tinha
# esquecido: daqui do chat a rede e travada (testei — o servico de voz da
# Microsoft, Pollinations e OpenAI todos dao 403), mas o servidor do GitHub
# Actions tem internet aberta. E assim que a gente gera imagem e voz; serve
# igualmente para LER a internet.
#
# O que este workflow faz:
#   1. BUSCA (DuckDuckGo, sem chave nenhuma) o termo que eu passar e pega os
#      primeiros resultados;
#   2. ABRE cada pagina e converte para TEXTO limpo (sem menu, sem propaganda);
#   3. salva tudo em `_pesquisa/web/<assunto>.md`, com a fonte de cada trecho, e
#      commita — dai eu leio aqui e destilo em REGRA de montagem.
#
# Tambem aceita `urls` direto, quando eu ja sei onde quero ler.
#
# ⚠️ O que ele NAO faz: julgar. Ele traz o texto; quem decide o que vira regra da
#    casa sou eu, e quem aprova e o Marcos. Pesquisa que nao vira regra na hora de
#    montar nao muda atividade nenhuma.

on:
  # 🔁 A FÁBRICA PESQUISA SOZINHA (ordem do Marcos, ago/2026: *"a fábrica de
  #    mecânicas pode pesquisar sempre para adicionar coisas novas"*).
  #    Toda segunda-feira de madrugada ela busca UM tema da roda abaixo e deixa o
  #    texto em `_pesquisa/web/`. Quando eu abrir a sessão, o material novo já
  #    está lá — não depende de eu lembrar de pesquisar.
  #    Custa zero: repositório público tem Actions ilimitado.
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:
    inputs:
      assunto:
        description: "Nome do arquivo de saida (vazio = tema da roda da semana)"
        required: false
        default: ""
        type: string
      busca:
        description: "O que buscar (ex: 'concept map drag arrow educational game HTML')"
        required: false
        default: ""
        type: string
      urls:
        description: "URLs especificas separadas por virgula (opcional)"
        required: false
        default: ""
        type: string
      quantas:
        description: "Quantas paginas ler da busca (padrao 6)"
        required: false
        default: "6"
        type: string

jobs:
  pesquisar:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # ⚠️ Quando roda sozinho (agendado) nao ha `assunto`: a roda escolhe um,
      #    girando pela semana do ano — assim ela cobre todos os temas ao longo
      #    do tempo em vez de trazer sempre a mesma coisa.
      - name: Escolher o tema da semana (quando roda sozinho)
        id: tema
        env:
          ASSUNTO: ${{ inputs.assunto }}
          BUSCA: ${{ inputs.busca }}
        run: |
          if [ -n "$ASSUNTO" ]; then
            echo "assunto=$ASSUNTO" >> "$GITHUB_OUTPUT"
            echo "busca=$BUSCA"     >> "$GITHUB_OUTPUT"
            exit 0
          fi
          SEM=$(date -u +%V)
          case $(( 10#$SEM % 6 )) in
            0) A="mecanicas-novas";        B="new interactive learning mechanics classroom HTML5 evidence 2026";;
            1) A="matematica-mecanicas";   B="interactive math manipulatives primary school number sense evidence";;
            2) A="lingua-mecanicas";       B="interactive literacy activities morphology vocabulary primary evidence";;
            3) A="ciencias-simulacoes";    B="interactive science simulation primary school inquiry evidence PhET";;
            4) A="acessibilidade-crianca"; B="accessibility children touch targets colour blindness screen reader learning app";;
            5) A="motivacao-engajamento";  B="what makes children want to keep learning game based learning motivation evidence";;
          esac
          echo "assunto=$A-semana-$SEM" >> "$GITHUB_OUTPUT"
          echo "busca=$B"               >> "$GITHUB_OUTPUT"
          echo "tema da semana $SEM: $A"

      - name: Instalar leitor de paginas
        # ⚠️ (set/2026) pypdf: a campanha "aprenda tudo sobre os jogos" mostrou que as
        #    fontes boas (Hirsh-Pasek, Plass, Shute, PhET) sao PDF — e o leitor
        #    devolvia "HTTP 200" e jogava fora. Agora PDF vira texto (ate 30 paginas).
        run: pip3 install --quiet requests beautifulsoup4 lxml pypdf

      - name: Buscar e ler
        env:
          ASSUNTO: ${{ steps.tema.outputs.assunto }}
          BUSCA: ${{ steps.tema.outputs.busca }}
          URLS: ${{ inputs.urls }}
          QUANTAS: ${{ inputs.quantas }}
        run: |
          python3 - <<'PY'
          import os, re, time, json, urllib.parse
          import requests
          from bs4 import BeautifulSoup

          UA = {"User-Agent": "Mozilla/5.0 (compatible; pesquisa-escola/1.0)"}
          assunto = re.sub(r"[^a-z0-9-]+", "-", os.environ["ASSUNTO"].lower()).strip("-") or "pesquisa"
          busca   = os.environ.get("BUSCA", "").strip()
          urls    = [u.strip() for u in os.environ.get("URLS", "").split(",") if u.strip()]
          quantas = max(1, min(15, int(os.environ.get("QUANTAS") or 6)))

          def procura(termo, n):
              """DuckDuckGo HTML — sem chave, sem cadastro, sem custo."""
              try:
                  r = requests.post("https://html.duckduckgo.com/html/",
                                    data={"q": termo}, headers=UA, timeout=25)
                  s = BeautifulSoup(r.text, "lxml")
                  achados = []
                  for a in s.select("a.result__a"):
                      href = a.get("href", "")
                      m = re.search(r"uddg=([^&]+)", href)
                      if m:
                          href = urllib.parse.unquote(m.group(1))
                      if href.startswith("http") and href not in achados:
                          achados.append(href)
                      if len(achados) >= n:
                          break
                  return achados
              except Exception as e:
                  print("busca falhou: %s" % e); return []

          def le_pdf(r, url):
              """PDF -> texto (ate 30 paginas). Sem isto o leitor dizia 'HTTP 200' e descartava."""
              try:
                  import io as _io
                  from pypdf import PdfReader
                  rd = PdfReader(_io.BytesIO(r.content))
                  paginas = []
                  for pg in rd.pages[:30]:
                      try:
                          paginas.append(pg.extract_text() or "")
                      except Exception:
                          pass
                  txt = "\n".join(paginas)
                  linhas = [l.strip() for l in txt.split("\n")]
                  linhas = [l for l in linhas if len(l) > 40]
                  corpo = "\n\n".join(linhas[:400])
                  if len(corpo) < 400:
                      return None, None, "PDF sem texto legivel"
                  titulo = (rd.metadata.title if rd.metadata and rd.metadata.title else url.rsplit("/", 1)[-1]) or url
                  return (u"%s (PDF, %d pag.)" % (titulo, len(rd.pages)))[:120], corpo, None
              except Exception as e:
                  return None, None, "PDF: %s" % str(e)[:60]

          def le(url):
              try:
                  r = requests.get(url, headers=UA, timeout=45)
                  ct = r.headers.get("content-type", "")
                  if r.status_code == 200 and ("pdf" in ct or url.lower().endswith(".pdf")):
                      return le_pdf(r, url)
                  if r.status_code != 200 or "html" not in ct:
                      return None, None, "HTTP %s" % r.status_code
                  s = BeautifulSoup(r.text, "lxml")
                  for tag in s(["script", "style", "nav", "footer", "header", "aside", "form", "noscript"]):
                      tag.decompose()
                  titulo = (s.title.string if s.title else url) or url
                  txt = s.get_text("\n")
                  linhas = [l.strip() for l in txt.split("\n")]
                  linhas = [l for l in linhas if len(l) > 40]      # fora menu e migalha
                  corpo = "\n\n".join(linhas[:220])
                  # ⚠️ LICAO PAGA (ago/2026): a pesquisa do EdiLim voltou com CINCO
                  #    paginas do Scribd/SlideShare dizendo "Client Challenge — a
                  #    required part of this site couldn't load". O arquivo foi
                  #    salvo, tinha titulo, tinha 1,8 KB e PARECIA resultado. Eu
                  #    guardei e nunca percebi que estava vazio. Pagina bloqueada
                  #    NAO e resultado: e barreira anti-robo, e tem que ser dita.
                  baixo = corpo.lower()
                  muros = ["client challenge", "couldn't load", "enable javascript",
                           "are you a robot", "verify you are human", "access denied",
                           "cloudflare", "captcha", "upgrade to pro to"]
                  if len(corpo) < 400 or any(m in baixo for m in muros):
                      return None, None, "bloqueada ou vazia"
                  return titulo.strip()[:120], corpo, None
              except Exception as e:
                  print("  nao consegui ler %s: %s" % (url, e))
                  return None, None, str(e)[:60]

          if busca and len(urls) < quantas:
              urls += [u for u in procura(busca, quantas - len(urls)) if u not in urls]
          print("%d endereco(s) para ler" % len(urls))

          partes = ["# 🔎 Pesquisa: %s" % os.environ["ASSUNTO"], ""]
          if busca:
              partes += ["> Busca: `%s`" % busca, ""]
          partes += ["> Trazido pelo `pesquisar.yml` (a internet do GitHub). **Isto e MATERIA-PRIMA,",
                     "> nao regra.** So vira regra da casa depois de eu destilar em `_pesquisa/` e o",
                     "> Marcos aprovar. Texto de terceiro: ler com juizo.", "", "---", ""]
          lidas, barradas = 0, []
          for u in urls:
              t, c, porque = le(u)
              if not c:
                  barradas.append((u, porque or "?"))
                  continue
              lidas += 1
              partes += ["## %s" % t, "", "`%s`" % u, "", c, "", "---", ""]
              time.sleep(1.2)
          print("li %d pagina(s); %d barrada(s)" % (lidas, len(barradas)))
          if barradas:
              partes += ["## ⚠️ Paginas que NAO deram texto", ""]
              for u, porque in barradas:
                  partes += ["- `%s` — %s" % (u, porque)]
              partes += [""]
          # ⭐ PESQUISA QUE NAO TROUXE NADA TEM QUE GRITAR. Antes ela salvava um
          #    arquivo com so os cabecalhos, e eu lia como se fosse resultado.
          if lidas == 0:
              partes.insert(1, "")
              partes.insert(1, "> ## ❌ ESTA PESQUISA NAO TROUXE NADA. Todas as paginas "
                               "foram barradas ou vieram vazias. **Nao use este arquivo "
                               "como fonte** — refaca a busca com outros termos, ou com "
                               "`urls=` apontando para paginas abertas (evite scribd, "
                               "slideshare e sites com muro anti-robo).")
              print("::warning::a pesquisa nao trouxe NENHUM texto")

          os.makedirs("_pesquisa/web", exist_ok=True)
          cam = "_pesquisa/web/%s.md" % assunto
          open(cam, "w", encoding="utf-8").write("\n".join(partes))
          print("salvo em %s (%d KB)" % (cam, os.path.getsize(cam) // 1024))
          PY

      - name: Guardar no repo
        run: |
          git config user.name "Pesquisador"
          git config user.email "pesquisador@users.noreply.github.com"
          git add -A _pesquisa/web || true
          if git diff --cached --quiet; then echo "nada novo";
          else
            git commit -m "pesquisa: ${{ steps.tema.outputs.assunto }}"
            # (set/2026) 20 pesquisas ao mesmo tempo = pushes em corrida ("cannot lock
            # ref"); duas se perderam em silencio. Ate 6 tentativas, rebaseando.
            for t in 1 2 3 4 5 6; do
              git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
              if git push origin "HEAD:${GITHUB_REF_NAME}"; then echo "push ok (tentativa $t)"; break; fi
              echo "push rejeitado (tentativa $t)"; sleep $((t*7))
              [ "$t" = "6" ] && { echo "::error::nao consegui guardar a pesquisa"; exit 1; }
            done
          fi
