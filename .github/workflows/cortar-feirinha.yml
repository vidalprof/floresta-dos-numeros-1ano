name: "Cortar Feirinha (recorta a arte do Marcos)"
on:
  workflow_dispatch: {}
jobs:
  cortar:
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout da branch de trabalho"
        uses: actions/checkout@v4
        with:
          ref: claude/vc-nao-funcionando-0pya0w
          token: ${{ secrets.PAGES_TOKEN }}
          fetch-depth: 0
      - name: "Pegar a arte subida na main"
        run: |
          set -e
          git fetch origin main
          mkdir -p /tmp/subiu
          for f in IMG_3181.jpeg IMG_3183.jpeg IMG_3184.jpeg IMG_3185.jpeg IMG_3186.jpeg IMG_3187.jpeg IMG_3188.jpeg; do
            git show origin/main:$f > /tmp/subiu/$f
            echo "peguei $f ($(wc -c < /tmp/subiu/$f) bytes)"
          done
      - name: "Python e libs de imagem"
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: "Instalar rembg"
        run: pip install --quiet rembg pillow numpy scipy onnxruntime pooch
      - name: "Escrever o cortador (gate sha256)"
        run: |
          set -e
          echo "" | base64 -d > /tmp/cortar_feirinha.py
          GOT=$(sha256sum /tmp/cortar_feirinha.py | cut -c1-16)
          echo "sha: $GOT (esperado 1eea62e02c0d5bd9)"
          test "$GOT" = "1eea62e02c0d5bd9"
      - name: "Recortar a arte"
        run: python3 /tmp/cortar_feirinha.py
      - name: "Commitar as imagens na branch"
        run: |
          set -e
          git config user.name "Claude"
          git config user.email "marcosandersonlana@gmail.com"
          git add _feirinha/img
          git commit -m "Feirinha: recorta a arte do Marcos (coruja feliz/pisca/fala, 6 crachas, banana/limao, medalha, fundo) para _feirinha/img" || echo "nada a commitar"
          git push origin HEAD:claude/vc-nao-funcionando-0pya0w
