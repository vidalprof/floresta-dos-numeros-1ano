name: Montar Trem (build no CI)

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  montar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (esparso — so o Trem e o motor)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            _trem
            _padrao/ESQUELETO
          sparse-checkout-cone-mode: true

      - name: Conserto central das vozes de letra (montar.py)
        run: |
          echo "" | base64 -d > /tmp/patch_montar.py
          python3 /tmp/patch_montar.py

      - name: Montar
        run: |
          python3 _trem/build_conteudo.py
          python3 _padrao/ESQUELETO/montar.py _trem || true
          echo "---- index gerado ----"
          ls -la _trem/index.html
          echo "---- amostra falas ----"
          python3 - <<'PY'
          import json
          f=json.load(open("_trem/falas.json"))
          for it in f:
              t=it["texto"]
              if t in ("Í","Ú","jacaré") or "de igreja" in t or "de elefante" in t:
                  print(it["id"], "=", repr(t))
          PY

      - name: Commit do rebuild
        run: |
          git config user.name "Montador CI"
          git config user.email "montador@users.noreply.github.com"
          git add _padrao/ESQUELETO/montar.py _trem/build_conteudo.py _trem/index.html _trem/conteudo.json _trem/falas.json _trem/arte.json
          if git diff --cached --quiet; then
            echo "nada mudou"
          else
            git commit -m "[montar] Trem: vozes das letras (fonetico) + jacare; conserto central em montar.py; rebuild no CI"
            git push
          fi
