name: Pegar fonte (Fredoka woff2)
# ⚠️⚠️ POR QUE ELE TAMBEM ACORDA POR PUSH (15/set/2026). O GitHub so aceita
#    acionamento MANUAL (workflow_dispatch) de workflow que exista na branch
#    PADRAO. Este arquivo nunca foi para a `main` — vive so na branch de
#    trabalho —, entao pedir para roda-lo devolvia **404 Not Found**: ele
#    existia no repositorio e NAO EXISTIA para quem o chamava.
#    O gatilho `push` nao tem essa limitacao (roda da branch em que o push
#    aconteceu). A marca vai no assunto do commit: `[pegar-fonte]`.
#    Achado ao procurar o portao que ouve o mp3, e valia para OITO workflows.
on:
  push:
    branches: ['**']
  workflow_dispatch:
jobs:
  fonte:
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'push' || contains(github.event.head_commit.message, '[pegar-fonte]') }}
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Baixar Fredoka (OFL, woff2)
        run: |
          set -e
          mkdir -p _estrelas/fonts
          base="https://cdn.jsdelivr.net/npm/@fontsource/fredoka@5/files"
          for w in 400 500 600 700; do
            echo "baixando peso $w"
            curl -fsSL "$base/fredoka-latin-$w-normal.woff2" -o "_estrelas/fonts/fredoka-$w.woff2"
          done
          ls -la _estrelas/fonts
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add _estrelas/fonts
          git commit -m "fonte: Fredoka (woff2) embutida para o app" || { echo "nada a commitar"; exit 0; }
          git push
