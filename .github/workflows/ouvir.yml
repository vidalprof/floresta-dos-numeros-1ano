name: O ouvido (escuta os mp3 e confere se a voz diz o que esta escrito)

# ⭐ PEDIDO DO MARCOS (17/set/2026): *"o banco de audio e para comparar se a fala
#    esta certa, e isso que quero"* · *"precisamos muito para as silabas"* ·
#    *"deve dar para comparar em atividades online ou banco de audios"*.
#    E, antes de tudo, a lembranca que eu precisava: ***"vc pode usar o GitHub
#    lembra?"*** — o chat NAO tem internet, o Actions TEM. Eu disse "nao consigo
#    ouvir" quando a resposta certa era acionar um workflow. Esta e ele.
#
# O QUE ELE MEDE, e sao duas coisas diferentes com dois aparelhos diferentes:
#
#  1. AS FALAS INTEIRAS (`_qa/ouvir.py`) — reconhecedor de FRASE (Whisper), que
#     e bom com contexto. Compara o que ouviu com o `<pasta>/falas.json`.
#
#  2. OS RECORTES DE SILABA (`_qa/ouvir_silaba.py`) — reconhecedor por
#     CARACTERE (wav2vec2 CTC treinado em portugues), que decide quadro a
#     quadro e nao precisa de contexto. **E este que o Marcos mais quer**,
#     porque foi na silaba que o defeito chegou a sala: *"ao inves de falar Sa
#     ele fala s a em sapo"*. Ele pega corte torto (`as` em vez de `sa`) e
#     soletracao (`esse a`), que nenhum portao via.
#     Vai junto a medida das IRMAS: a mesma silaba vinda de duas palavras
#     diferentes tem de soar parecida (MFCC + DTW), e essa nao depende de
#     modelo nenhum.
#
# ⚠️ PRIMEIRO SE MEDE, DEPOIS SE COBRA. O input `medir=sim` (padrao na estreia)
#    ouve tudo, escreve a distribuicao e NAO reprova. O corte que reprova sai
#    DESSA medida — nunca de um numero que eu escolhi. Trocou o modelo, remede.
#
# ⚠️ Ele NAO grava voz e NAO publica nada. So escuta o que ja esta no
#    repositorio e commita o relatorio em `_qa/_ouvido/`.

on:
  workflow_dispatch:
    inputs:
      alvos:
        description: "Pastas separadas por virgula (ex: _sil2,_troca2,_nasal2)"
        required: true
        type: string
      medir:
        description: "sim = so mede e mostra a distribuicao, nao reprova"
        required: false
        default: "sim"
        type: string
      so_silabas:
        description: "sim = pula as falas inteiras e ouve so os recortes de silaba"
        required: false
        default: "nao"
        type: string
      modelo_frase:
        description: "modelo do Whisper (tiny/base/small/medium)"
        required: false
        default: "small"
        type: string
      limite_frase:
        description: "erro acima disto reprova uma FALA (0 a 1)"
        required: false
        default: "0.35"
        type: string
      limite_silaba:
        description: "erro acima disto reprova um RECORTE (0 a 1)"
        required: false
        default: "0.5"
        type: string
      so:
        description: "ouvir so os N primeiros de cada pasta (0 = todos)"
        required: false
        default: "0"
        type: string
      ref:
        description: "Branch com os arquivos (vazio = branch padrao)"
        required: false
        default: ""
        type: string

jobs:
  ouvir:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: ffmpeg (para ler os mp3)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      # o cache poupa ~1,5 GB de download a cada rodada
      - name: Cache dos modelos
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/huggingface
            ~/.cache/torch
          key: ouvido-${{ inputs.modelo_frase }}-v1

      - name: Instalar o reconhecedor
        run: |
          python -m pip install --quiet --upgrade pip
          # ⚠️ LICAO PAGA NA ESTREIA (17/set/2026): o `--index-url` vale para a
          #    LINHA INTEIRA, nao so para o pacote ao lado dele. Juntar o torch
          #    com o faster-whisper numa linha so fez o pip procurar OS DOIS no
          #    indice do PyTorch, e o faster-whisper nao mora la:
          #      ERROR: Could not find a version that satisfies the requirement
          #      faster-whisper (from versions: none)
          #    Uma linha por indice, sempre.
          python -m pip install --quiet "torch==2.*" \
            --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --quiet transformers librosa soundfile
          # o reconhecedor de FRASE so e baixado quando ha frase para ouvir —
          # numa rodada so de silaba ele seria 200 MB de download a toa.
          if [ "${{ inputs.so_silabas }}" != "sim" ]; then
            python -m pip install --quiet faster-whisper
          fi
          mkdir -p _qa/_ouvido

      - name: Ouvir
        id: ouvir
        run: |
          set -o pipefail
          MEDIR=""
          [ "${{ inputs.medir }}" = "sim" ] && MEDIR="--medir"
          SO=""
          [ "${{ inputs.so }}" != "0" ] && SO="--so ${{ inputs.so }}"
          CODIGO=0
          IFS=',' read -ra PASTAS <<< "${{ inputs.alvos }}"
          for P in "${PASTAS[@]}"; do
            P="$(echo "$P" | xargs)"
            [ -d "$P" ] || { echo "::warning::pasta $P nao existe"; continue; }

            if [ "${{ inputs.so_silabas }}" != "sim" ]; then
              echo "::group::$P — as falas inteiras"
              python3 _qa/ouvir.py "$P" --modelo "${{ inputs.modelo_frase }}" \
                --limite "${{ inputs.limite_frase }}" $MEDIR $SO || CODIGO=1
              echo "::endgroup::"
            fi

            echo "::group::$P — os recortes de silaba"
            python3 _qa/ouvir_silaba.py "$P" \
              --limite "${{ inputs.limite_silaba }}" $MEDIR $SO || CODIGO=1
            echo "::endgroup::"
          done
          echo "codigo=$CODIGO" >> "$GITHUB_OUTPUT"

      - name: Resumo para quem so le o final
        if: always()
        run: |
          {
            echo "## O ouvido — $(date -u +%Y-%m-%d\ %H:%MZ)"
            echo ""
            echo "Modelo de frase: \`${{ inputs.modelo_frase }}\` · modo: \`${{ inputs.medir }}\`"
            echo ""
            for F in _qa/_ouvido/*.md; do
              [ -f "$F" ] || continue
              echo "### $(basename "$F" .md)"
              head -40 "$F"
              echo ""
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Commitar o relatorio
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A _qa/_ouvido || true
          if git diff --cached --quiet; then
            echo "nada novo no relatorio"
          else
            # ⚠️ sem a marca [entregar ...]: este commit NAO pode acordar o
            #    entregar.yml, senao uma escuta vira uma publicacao.
            git commit -m "ouvido: relatorio da escuta dos mp3"
            for i in 1 2 3 4; do
              git push && break || sleep $((2 ** i))
            done
          fi

      - name: Reprovar se houve mp3 dizendo outra coisa
        if: ${{ inputs.medir != 'sim' }}
        run: |
          [ "${{ steps.ouvir.outputs.codigo }}" = "0" ] || {
            echo "::error::ha mp3 que nao diz o que esta escrito — ver _qa/_ouvido/"
            exit 1
          }
