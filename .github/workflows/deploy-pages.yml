name: Diagnostico e deploy do Pages

# Verifica o estado REAL do GitHub Pages de um repositorio de destino, forca um
# novo build a partir da main e — o que mudou em 24/set/2026 — DEIXA UM CARIMBO
# legivel neste repositorio, em `_status/pages-<destino>.json`.
#
# ⚠️⚠️ POR QUE O CARIMBO. Este workflow imprimia tudo no log e mais nada. Do
# chat a rede e travada (curl responde 000), entao a unica forma de eu saber se
# o site subiu era chamar `actions_list` — que devolve 55 mil caracteres e come
# a conversa — ou pedir ao Marcos que abrisse o link. Um `git fetch` e 200 bytes
# resolvem, e e a MESMA licao ja paga no `entregar.yml`:
#   *evidencia que o robo nao consegue ler barato e evidencia que ele nao le.*
#
# ⚠️ E o carimbo nasce "rodando" ANTES de qualquer coisa e e reescrito no fim,
# inclusive quando a corrida morre no meio — senao um carimbo velho seria lido
# como recado desta corrida (erro que ja custou caro: anunciei trinta entregas
# que nao tinham acontecido).

on:
  workflow_dispatch:
    inputs:
      repo_name:
        description: "Repositorio de destino (ex: a-oficina-de-video)"
        required: true
        type: string
      marca:
        description: "Texto que TEM que aparecer no index.html servido (opcional)"
        required: false
        default: ""
        type: string
      sha_esperado:
        description: "sha1 (12 primeiros) do index.html que deveria estar no ar (opcional)"
        required: false
        default: ""
        type: string
      testar_busca:
        description: "Abrir o site num navegador de verdade e USAR a busca (sim/nao)"
        required: false
        default: "nao"
        type: string

jobs:
  pages:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Carimbo "rodando" (antes de qualquer coisa)
        env:
          DEST: ${{ inputs.repo_name }}
        run: |
          mkdir -p _status
          printf '{"destino":"%s","estado":"rodando","quando":"%s","corrida":"%s"}\n' \
            "$DEST" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            > "_status/pages-$DEST.json"

      - name: Diagnosticar, forcar deploy e perguntar ao proprio site
        env:
          GH_TOKEN: ${{ secrets.PAGES_TOKEN }}
          OWNER: vidalprof
          DEST: ${{ inputs.repo_name }}
          MARCA: ${{ inputs.marca }}
          SHA_ESP: ${{ inputs.sha_esperado }}
        run: |
          set +e
          echo "=== ULTIMO COMMIT NA MAIN DO DESTINO ==="
          COMMIT=$(gh api "repos/$OWNER/$DEST/commits/main" --jq '.sha[0:7]' 2>/dev/null)
          echo "  $COMMIT"

          echo "=== CONFIG DO PAGES ==="
          gh api "repos/$OWNER/$DEST/pages" \
            --jq '"build_type=" + (.build_type // "?") + "  source=" + ((.source.branch // "?") + ":" + (.source.path // "?")) + "  status=" + (.status // "?") + "  url=" + (.html_url // "?")' 2>&1 | head -3

          echo "=== GARANTINDO DEPLOY A PARTIR DA MAIN (build_type=legacy) ==="
          gh api -X PUT "repos/$OWNER/$DEST/pages" \
            -f "build_type=legacy" -f "source[branch]=main" -f "source[path]=/" 2>&1 | head -c 300
          echo ""

          echo "=== FORCANDO NOVO BUILD ==="
          gh api -X POST "repos/$OWNER/$DEST/pages/builds" \
            --jq '"build disparado: status=" + (.status // "?")' 2>&1 | head -3

          # ⚠️ O build do Pages e assincrono: perguntar o status no segundo
          # seguinte devolve "building" e nao diz nada. Esperamos ate 4 minutos.
          ESTADO="?"; ERRO="nenhum"
          for i in $(seq 1 24); do
            sleep 10
            ESTADO=$(gh api "repos/$OWNER/$DEST/pages/builds/latest" --jq '.status // "?"' 2>/dev/null)
            ERRO=$(gh api "repos/$OWNER/$DEST/pages/builds/latest" --jq '(.error.message) // "nenhum"' 2>/dev/null)
            echo "  tentativa $i: status=$ESTADO  erro=$ERRO"
            [ "$ESTADO" = "built" ] && break
            [ "$ESTADO" = "errored" ] && break
          done

          # ⚠️ O STATUS DO BUILD NAO BASTA (licao de ago/2026): ja aconteceu de
          # ele dizer "built" e o site servir a versao velha. Quem responde de
          # verdade e o proprio site.
          echo "=== O SITE NO AR RESPONDE? ==="
          URL="https://$OWNER.github.io/$DEST"
          CODE=000; NOAR=0; TEM_MARCA=0; SHA_NOAR=""
          for i in $(seq 1 18); do
            CODE=$(curl -s -o /tmp/no_ar.html -w "%{http_code}" -L "$URL/index.html?v=$RANDOM")
            echo "  tentativa $i: http $CODE"
            [ "$CODE" = "200" ] && break
            sleep 10
          done
          if [ "$CODE" = "200" ]; then
            NOAR=1
            SHA_NOAR=$(sha1sum /tmp/no_ar.html | cut -c1-12)
            echo "  sha do que esta no ar: $SHA_NOAR"
            if [ -n "$MARCA" ]; then
              if grep -q -- "$MARCA" /tmp/no_ar.html; then TEM_MARCA=1; fi
              echo "  marca \"$MARCA\": $TEM_MARCA"
            fi
            if [ -n "$SHA_ESP" ] && [ "$SHA_NOAR" != "$SHA_ESP" ]; then
              echo "  ⚠️ o sha no ar ($SHA_NOAR) NAO bate com o esperado ($SHA_ESP)"
              NOAR=0
            fi
          fi

          printf '{"destino":"%s","estado":"%s","quando":"%s","build":"%s","erro":"%s","http":"%s","noar":%s,"index":"%s","marca":%s,"commit":"%s","url":"%s","corrida":"%s"}\n' \
            "$DEST" "$([ "$NOAR" = "1" ] && echo pronto || echo falhou)" \
            "$(date -u +%Y-%m-%dT%H:%M:%SZ)" "$ESTADO" "$ERRO" "$CODE" "$NOAR" \
            "$SHA_NOAR" "$TEM_MARCA" "$COMMIT" "$URL/" \
            "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            > "_status/pages-$DEST.json"
          cat "_status/pages-$DEST.json"

      # ⚠️⚠️ POR QUE ESTE PASSO MORA AQUI, e nao num workflow proprio: o GitHub
      # so aceita acionar um workflow que ja exista na branch PADRAO, e criar um
      # arquivo novo la exigiria sair da branch de trabalho. Este workflow ja e o
      # portao do "o site no ar funciona?" — perguntar "e a busca funciona?" e a
      # mesma familia.
      #
      # ⚠️ E ELE EXISTE PORQUE EU NAO CONSIGO MEDIR ISSO DE OUTRO JEITO: do chat
      # a rede e travada (o proxy nega `commons.wikimedia.org` com 403), entao a
      # cobaia testa a busca com um `fetch` de MENTIRA. Isso prova a leitura e a
      # importacao, e nao prova NADA sobre a rede — que e onde a falha pode
      # estar. Aqui o runner abre o site publicado num navegador de verdade.
      - name: Usar a busca num navegador de verdade
        if: ${{ inputs.testar_busca == 'sim' }}
        env:
          URL: https://vidalprof.github.io/${{ inputs.repo_name }}/
        run: |
          npm i -D playwright@1.47.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
          cat > /tmp/teste.js <<'JS'
          const { chromium } = require('playwright');
          (async () => {
            const url = process.env.URL;
            const b = await chromium.launch();
            const pg = await b.newPage({ viewport: { width: 1366, height: 768 } });
            const erros = [], rede = [];
            pg.on('pageerror', e => erros.push('pageerror: ' + (e.message || e)));
            pg.on('console', m => { if (m.type() === 'error') erros.push('console: ' + m.text()); });
            pg.on('response', r => { if (r.url().indexOf('wikimedia') >= 0)
              rede.push(r.status() + ' ' + r.url().slice(0, 110)); });
            pg.on('requestfailed', r => { if (r.url().indexOf('wikimedia') >= 0)
              rede.push('FALHOU ' + (r.failure() && r.failure().errorText) + ' ' +
                        r.url().slice(0, 110)); });
            const o = { url: url, quando: new Date().toISOString() };
            try {
              await pg.goto(url + '?v=' + Date.now(), { waitUntil: 'load', timeout: 60000 });
              await pg.waitForTimeout(1500);
              o.versao = await pg.evaluate(() =>
                (typeof VERSAO !== 'undefined') ? VERSAO : 'sem carimbo');
              if (await pg.locator('#mdOk').count()) await pg.click('#mdOk');
              await pg.waitForTimeout(300);
              o.temBotao = (await pg.locator('[data-qa="f-buscar"]').count()) > 0;
              if (!o.temBotao) throw new Error('a barra nao tem o botao Buscar');
              await pg.click('[data-qa="f-buscar"]');
              await pg.waitForTimeout(500);
              // ⚠️ o ALUNO nao tem campo de texto (o professor pediu isso): quem
              // busca e o assunto pronto. O teste clica num deles, como a turma fara.
              o.assuntos = await pg.locator('#assuntos [data-t]').count();
              o.campoLivreDoAluno = (await pg.locator('#qBusca').count()) > 0;
              if (!o.assuntos) throw new Error('nao apareceram os assuntos prontos');
              await pg.click('#assuntos [data-t="floresta"]');
              await pg.waitForTimeout(15000);
              o.achados = await pg.evaluate(() =>
                (typeof achados !== 'undefined' && achados) ? achados.length : -1);
              o.tela = (await pg.locator('#resBusca').innerText()).slice(0, 220);
              o.miniaturas = await pg.locator('#grAchados .achado').count();
              if (o.miniaturas > 0) {
                const antes = await pg.evaluate(() => PROJ.clipes.length);
                await pg.click('#grAchados [data-i="0"]');
                await pg.waitForTimeout(8000);
                o.entrou = await pg.evaluate(a => PROJ.clipes.length > a, antes);
                o.credito = await pg.evaluate(() => (PROJ.creditos || [])[0] || null);
                o.palcoLimpo = await pg.evaluate(() => {
                  try { ctx.getImageData(0, 0, 1, 1); return true; } catch (e) { return false; } });
              }
            } catch (e) { o.erro = String(e.message || e); }
            o.rede = rede.slice(0, 6);
            o.erros = erros.slice(0, 6);
            o.veredito = (o.miniaturas > 0)
              ? (o.entrou ? 'A BUSCA FUNCIONA' : 'ACHOU MAS NAO TROUXE')
              : 'NAO ACHOU NADA';
            require('fs').writeFileSync('_status/busca-oficina.json', JSON.stringify(o, null, 1));
            console.log(JSON.stringify(o, null, 1));
            await b.close();
          })().catch(e => {
            require('fs').writeFileSync('_status/busca-oficina.json',
              JSON.stringify({ veredito: 'NAO MEDI', erro: String(e && e.message) }, null, 1));
          });
          JS
          mkdir -p _status
          node /tmp/teste.js || true
          {
            echo "## Teste da busca"
            echo '```json'
            cat _status/busca-oficina.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: O carimbo nao pode mentir (a corrida morreu no meio)
        if: failure()
        env:
          DEST: ${{ inputs.repo_name }}
        run: |
          mkdir -p _status
          printf '{"destino":"%s","estado":"falhou","quando":"%s","motivo":"a corrida parou antes do fim","corrida":"%s"}\n' \
            "$DEST" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            > "_status/pages-$DEST.json"

      - name: Guardar o carimbo
        if: always()
        env:
          DEST: ${{ inputs.repo_name }}
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add "_status/pages-$DEST.json" _status/busca-oficina.json 2>/dev/null || \
            git add "_status/pages-$DEST.json"
          git diff --cached --quiet && exit 0
          git commit -m "pages: carimbo de $DEST"
          # ⚠️ outra corrida pode ter commitado no meio: rebase e tenta de novo.
          for i in 1 2 3 4; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep $((i * 3))
          done
          exit 1
