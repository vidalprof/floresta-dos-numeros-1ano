name: Listar arquivos da raiz de outro repo

# Lista o conteudo da raiz de um repositorio de destino (usando PAGES_TOKEN)
# para diagnosticar 404 do Pages (ex.: falta index.html na raiz, ou os
# arquivos subiram dentro de uma subpasta).

# ⚠️⚠️ POR QUE ELE TAMBEM ACORDA POR PUSH (15/set/2026). O GitHub so aceita
#    acionamento MANUAL (workflow_dispatch) de workflow que exista na branch
#    PADRAO. Este arquivo nunca foi para a `main` — vive so na branch de
#    trabalho —, entao pedir para roda-lo devolvia **404 Not Found**: ele
#    existia no repositorio e NAO EXISTIA para quem o chamava.
#    O gatilho `push` nao tem essa limitacao (roda da branch em que o push
#    aconteceu). A marca vai no assunto do commit: `[listar]`.
#    Achado ao procurar o portao que ouve o mp3, e valia para OITO workflows.
on:
  push:
    branches: ['**']
  workflow_dispatch:
    inputs:
      repo_name:
        description: "Repositorio de destino (ex: silabastonicas4-)"
        required: true
        type: string

jobs:
  listar:
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'push' || contains(github.event.head_commit.message, '[listar]') }}
    steps:
      - name: Listar raiz e procurar index.html
        env:
          GH_TOKEN: ${{ secrets.PAGES_TOKEN }}
          OWNER: vidalprof
          DEST: ${{ inputs.repo_name }}
        run: |
          set -uo pipefail
          echo "=== BRANCH PADRAO ==="
          DEF=$(gh api "repos/$OWNER/$DEST" --jq '.default_branch' 2>&1) || true
          echo "default_branch=$DEF"
          echo ""
          echo "=== ARQUIVOS NA RAIZ (branch: $DEF) ==="
          gh api "repos/$OWNER/$DEST/contents/" \
            --jq '.[] | .type + "  " + .name' 2>&1 | head -60 || true
          echo ""
          echo "=== TEM index.html NA RAIZ? ==="
          gh api "repos/$OWNER/$DEST/contents/index.html" --jq '"SIM (" + (.size|tostring) + " bytes)"' 2>&1 | head -1 || true
          echo ""
          echo "=== CONFIG DO PAGES ==="
          gh api "repos/$OWNER/$DEST/pages" \
            --jq '"source=" + ((.source.branch // "?") + ":" + (.source.path // "?")) + "  status=" + (.status // "?")' 2>&1 | head -1 || true
          echo "=== FIM ==="
