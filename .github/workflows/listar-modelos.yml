name: Listar modelos de IA disponiveis (diagnostico)

# ⚠️ POR QUE ESTE WORKFLOW EXISTE (14/set/2026).
#
# ⚠️ E ELE NASCEU DE UM ERRO MEU, que fica registrado porque foi a REGRA ZERO me
#    pegando em flagrante.
#
#    O registro da casa dizia, desde 12/ago: "O GEMINI ESTA SEM COTA — HTTP 429".
#    Fui remedir em 14/set, li o FIM do log e anunciei: "nao e cota, e nome de
#    modelo" — porque as duas ultimas linhas mostravam dois 404. Estava ERRADO.
#    Lendo o log INTEIRO:
#
#      gemini-2.5-flash-image                    -> HTTP 429 (4 tentativas)
#                                                   "You exceeded your current quota"
#      gemini-2.5-flash-image-preview            -> HTTP 404 (nome aposentado)
#      gemini-2.0-flash-preview-image-generation -> HTTP 404 (nome aposentado)
#
#    O modelo que EXISTE responde 429. Os 404 sao so os nomes velhos no fim da
#    lista. **E cota mesmo, e o registro de 12/ago continua valendo em 14/set.**
#    Ler o rabo do log e o primo do conferir em miniatura: os dois dao uma
#    resposta com cara de conclusao.
#
# Mesmo assim este workflow fica, e serve para duas coisas: limpar os nomes
# aposentados da lista do `gerar-imagens.yml` (que hoje gasta tentativa a toa) e
# responder, sem chute, quais modelos a chave enxerga quando algo der 404.
# `ListModels` e consulta, nao gasta cota.
#
# Nao gasta cota: `ListModels` e consulta, nao geracao.

on:
  workflow_dispatch:

jobs:
  listar:
    runs-on: ubuntu-latest
    steps:
      - name: Perguntar ao Gemini quais modelos existem hoje
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request, urllib.error
          k = os.environ.get("GEMINI_API_KEY", "")
          if not k:
              print("::error::GEMINI_API_KEY vazio — nao da para perguntar.")
              raise SystemExit(1)
          url = "https://generativelanguage.googleapis.com/v1beta/models?key=%s&pageSize=200" % k
          try:
              d = json.loads(urllib.request.urlopen(url, timeout=40).read().decode())
          except urllib.error.HTTPError as e:
              print("::error::HTTP %s: %s" % (e.code, e.read().decode("utf-8", "ignore")[:400]))
              raise SystemExit(1)
          ms = d.get("models", [])
          print("== %d modelo(s) visiveis com esta chave ==" % len(ms))
          img = []
          for m in ms:
              nome = m.get("name", "").replace("models/", "")
              met = ",".join(m.get("supportedGenerationMethods", []))
              # os que desenham trazem "image" no nome ou na descricao
              alvo = ("image" in nome.lower()) or ("image" in (m.get("description") or "").lower())
              if alvo:
                  img.append((nome, met))
              print("   %-46s %s" % (nome, met))
          print()
          print("== OS QUE PARECEM DESENHAR ==")
          if not img:
              print("   NENHUM. Com esta chave nao ha modelo de imagem — ai sim o caminho")
              print("   e outro gerador (OPENAI_API_KEY) ou liberar o de imagem no projeto.")
          for nome, met in img:
              print("   %-46s %s" % (nome, met))
          PY
