name: Coru Trem (recorta feliz + pisca novos)

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  coru:
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout (Trem)"
        uses: actions/checkout@v4
        with:
          ref: claude/vc-nao-funcionando-0pya0w
          fetch-depth: 1
          sparse-checkout: |
            _trem
          sparse-checkout-cone-mode: true

      - name: "Instala PIL numpy scipy"
        run: python3 -m pip install --quiet Pillow numpy scipy

      - name: "Recorta o Coru novo"
        run: |
          echo "" | base64 -d > /tmp/coru.py
          python3 /tmp/coru.py

      - name: "Commit"
        run: |
          git config user.name "Coru CI"
          git config user.email "coru@users.noreply.github.com"
          git add -A _trem/img/tr_coru_feliz.png _trem/img/tr_coru_fala.png _trem/img/tr_coru_pisca.png _trem/_coru_check.png
          if git diff --cached --quiet; then echo "nada mudou"; else
            git commit -m "[coru] Trem: mascote novo (feliz + pisca) das fotos IMG_3180/3179"
            git push origin HEAD:claude/vc-nao-funcionando-0pya0w
          fi
