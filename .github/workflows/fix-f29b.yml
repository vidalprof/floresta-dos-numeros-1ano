name: Fix f29b (reinsere pintar Coru no build_conteudo)

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (branch de trabalho, so o Trem)
        uses: actions/checkout@v4
        with:
          ref: claude/vc-nao-funcionando-0pya0w
          fetch-depth: 1
          sparse-checkout: |
            _trem
          sparse-checkout-cone-mode: true

      - name: Reinsere f29b se faltar (idempotente)
        run: |
          echo "" | base64 -d > /tmp/patch_f29b.py
          python3 /tmp/patch_f29b.py
          python3 -c "import ast; ast.parse(open('_trem/build_conteudo.py').read()); print('build_conteudo ast OK')"
          grep -c 'id="f29b"' _trem/build_conteudo.py

      - name: Commit na branch de trabalho
        run: |
          git config user.name "Fix CI"
          git config user.email "fix@users.noreply.github.com"
          git add _trem/build_conteudo.py
          if git diff --cached --quiet; then
            echo "nada mudou (f29b ja estava)"
          else
            git commit -m "[fix] Trem: reinsere f29b (pintar Coru) perdida em reenvio manual"
            git push origin HEAD:claude/vc-nao-funcionando-0pya0w
          fi
