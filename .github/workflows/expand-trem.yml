name: Expand Trem (+5 fases variadas)

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  expand:
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout (Trem)"
        uses: actions/checkout@v4
        with:
          ref: claude/vc-nao-funcionando-0pya0w
          fetch-depth: 1
          sparse-checkout: |
            _trem
          sparse-checkout-cone-mode: true

      - name: "Aplica expansao + confere sha256"
        run: |
          echo "" | base64 -d > /tmp/p.py
          python3 /tmp/p.py
          python3 -c "import ast; ast.parse(open('_trem/build_conteudo.py').read()); print('ast OK')"
          H=$(sha256sum _trem/build_conteudo.py | cut -d' ' -f1)
          echo "sha=$H"
          test "$H" = "b1dacf1af0c3c057a2bdad436fd3d85d36c8c77a95525f325d7abcc35643db3d" && echo "SHA CONFERE (arquivo exato testado)" || (echo "SHA DIFERENTE — abortando commit"; exit 1)

      - name: "Commit"
        run: |
          git config user.name "Expand CI"
          git config user.email "expand@users.noreply.github.com"
          git add -A _trem/build_conteudo.py
          if git diff --cached --quiet; then echo "nada mudou"; else
            git commit -m "[expand] Trem: +5 fases variadas (M/V/L, gato/vaca, pato/vaca, M/N/R/Z, gato/sapo) + bater-silabas enunciado"
            git push origin HEAD:claude/vc-nao-funcionando-0pya0w
          fi
