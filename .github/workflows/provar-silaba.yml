name: Prova da silaba (alinhamento forcado)

# 🔬 PROVA DE BANCADA — não publica nada, não mexe em atividade nenhuma.
#
# ⚠️ POR QUE ELA EXISTE (set/2026): o Marcos ouviu o app dizer "vê-á" no lugar
#    de "va". A causa medida: a voz lê o pedaço ISOLADO ("bo, la, ca") e, quando
#    o pedaço não é palavra do português, ela SOLETRA. Cortar essa sequência não
#    conserta — o erro já está dentro do áudio.
#
#    O caminho certo, que a pesquisa apontou (`_pesquisa/web/silaba-*.md`):
#    sintetizar a PALAVRA INTEIRA — que a voz pronuncia bem, porque é palavra de
#    verdade — e cortar nas fronteiras de sílaba achadas por ALINHAMENTO FORÇADO.
#
#    Antes de reescrever o `_padrao/silabas_voz.py` em cima de suposição, esta
#    prova responde três perguntas com FATO:
#      1. o `ctc-forced-aligner` instala num runner comum?
#      2. qual é EXATAMENTE o formato de saída dele?
#      3. as fronteiras que ele acha batem com as sílabas de CA-VA-LO?
#
#    Tudo o que ela descobre fica em `_pesquisa/prova-silaba.txt`, commitado —
#    porque o que o log da execução engole, o repo guarda (lição de hoje).

# ⚠️ DISPARA POR PUSH, e não por `workflow_dispatch`: o GitHub só aceita
#    despachar workflow que já existe na branch PADRÃO, e este nasceu numa
#    branch de trabalho. Tocar no arquivo-marca abaixo faz a prova rodar.
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/provar-silaba.yml'
      - '_pesquisa/PROVAR-SILABA'

jobs:
  provar:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Instalar
        run: |
          pip3 install --quiet edge-tts imageio-ffmpeg 2>&1 | tail -2 || true
          echo "--- ctc-forced-aligner (pode demorar: leva o torch junto) ---"
          pip3 install --quiet "git+https://github.com/MahmoudAshraf97/ctc-forced-aligner.git" 2>&1 | tail -3 || true
          # ⚠️ PROVA 2 ENSINOU: o alinhador chama o `ffmpeg` PELO NOME, no PATH do
          #    sistema — e este runner não tem. O ffmpeg do `imageio-ffmpeg` (que
          #    a casa já usa em tudo) resolve, basta dar o nome a ele.
          FF=$(python3 -c "import imageio_ffmpeg;print(imageio_ffmpeg.get_ffmpeg_exe())")
          sudo ln -sf "$FF" /usr/local/bin/ffmpeg
          ffmpeg -version | head -1

      - name: Sintetizar a palavra INTEIRA e alinhar
        run: |
          mkdir -p _pesquisa
          python3 - <<'PY' 2>&1 | tee _pesquisa/prova-silaba.txt
          # -*- coding: utf-8 -*-
          import asyncio, io, os, subprocess

          # ⚠️ A 1ª prova ensinou duas coisas: o alinhador INSTALA no runner, e a
          #    opcao chama-se `--split_size char` (eu tinha chutado outro nome).
          #    Agora vou pela API em Python, que devolve os tempos direto.
          PALAVRAS = [("cavalo", ["CA","VA","LO"]), ("gato", ["GA","TO"]),
                      ("foguete", ["FO","GUE","TE"]), ("uva", ["U","VA"]),
                      ("panela", ["PA","NE","LA"]), ("borboleta", ["BOR","BO","LE","TA"])]
          VOZ = "pt-BR-AntonioNeural"
          import imageio_ffmpeg
          ff = imageio_ffmpeg.get_ffmpeg_exe()

          async def grava(texto, saida):
              import edge_tts
              com = edge_tts.Communicate(texto, VOZ, rate="-25%")
              d = io.BytesIO()
              async for p in com.stream():
                  if p["type"] == "audio":
                      d.write(p["data"])
              open(saida, "wb").write(d.getvalue())

          async def tudo():
              for w, _ in PALAVRAS:
                  await grava(w + ".", "/tmp/%s.mp3" % w)
                  subprocess.call([ff, "-y", "-loglevel", "error", "-i", "/tmp/%s.mp3" % w,
                                   "-ar", "16000", "-ac", "1", "/tmp/%s.wav" % w])
          asyncio.run(tudo())
          print("audio da PALAVRA INTEIRA gravado para", len(PALAVRAS), "palavras")

          print("=" * 62)
          import torch
          from ctc_forced_aligner import (load_audio, load_alignment_model,
                                          generate_emissions, preprocess_text,
                                          get_alignments, get_spans, postprocess_results)
          modelo, tok = load_alignment_model("cpu", dtype=torch.float32)
          print("modelo carregado")
          for w, sil in PALAVRAS:
              print("-" * 62)
              print("PALAVRA:", w, "| silabas:", sil)
              try:
                  onda = load_audio("/tmp/%s.wav" % w, modelo.dtype, modelo.device)
                  em, stride = generate_emissions(modelo, onda, batch_size=1)
                  tks, txts = preprocess_text(w, romanize=True, language="por",
                                              split_size="char")
                  seg, sc, branco = get_alignments(em, tks, tok)
                  vaos = get_spans(tks, seg, branco)
                  res = postprocess_results(txts, vaos, stride, sc)
                  print("  tipo devolvido:", type(res).__name__, "| itens:", len(res))
                  for r in res:
                      print("   ", r)
              except Exception as e:
                  import traceback
                  print("  ERRO:", e)
                  traceback.print_exc()
          print("=" * 62)
          print("FIM DA PROVA")
          PY

      - name: Guardar a prova no repo
        if: ${{ always() }}
        run: |
          git config user.name "Provador"
          git config user.email "provador@users.noreply.github.com"
          git add -A _pesquisa/prova-silaba.txt
          if git diff --cached --quiet; then
            echo "nada a guardar"
          else
            git commit -m "prova: o que o alinhador forcado devolve"
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
