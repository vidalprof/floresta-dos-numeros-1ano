<!-- ============================================================
     A OFICINA DO MATERIAL DOURADO — DIVISÃO (5º ano)
     LIVRO DE FOLHAS INTERATIVAS, 10 folhas. Pedido do Marcos (8/set/2026):
     *"uma atividade de matemática para o quinto ano, divisão com material
     dourado... umas 10 folhas de atividades relacionadas com esse tema"*, no
     formato que ele batizou: *"tipo folhas interativas em um livro"*.

     AUTORIA (regra dele, no mesmo dia): *"pode recriar tudo para ser autoria,
     mas tem que usar imagem gerada pelo ChatGPT — no caso eu gero — ou utilizar
     o banco de imagem"*. Aqui não foi preciso nem um nem outro: o material
     dourado é DESENHADO EM SVG pela própria casa (as funções vieram da peça
     `_padrao/pecas/divisao-dourado.html`, da Oficina da Divisão que ele já
     aprovou). Cubinho, barra, placa e cubão saem do código — nada é copiado de
     folha nenhuma da internet.

     O QUE AS 40 FOLHAS REAIS DA INTERNET ENSINARAM (só o repertório, nunca a
     imagem): valor das peças; "qual é o número"; representar com C-D-U; pintar
     conforme o numeral; repartir em grupos; a TROCA da placa/barra que sobra
     (o "abaixa" da conta armada); resto; conta armada; problemas; prova real.

     COMO A FOLHA MUDA: cada folha sorteia os itens de um POOL fixo (`ITENS`) e
     nunca repete o mesmo resultado em itens vizinhos. Todas as frases possíveis
     estão enumeradas no `gerar_falas.py` — não existe frase sem mp3.
     ES5 puro (Chrome 109 / Firefox 106), um arquivo, sem biblioteca.
     ============================================================ -->

/* ---------- o material dourado, desenhado em SVG (casa: peça divisao-dourado) ---------- */
/* Um SÓ desenhista para as quatro peças: o PRISMA em projeção oblíqua (a mesma
   que as folhas impressas usam — frente reta, profundidade jogada para trás e
   para cima). `w × a × p` são medidos em CUBINHOS, e é isso que faz a família
   ficar irmã: a barra é 1×10×1, a placa 10×10×1 e o cubão 10×10×10, sempre com
   o MESMO cubinho de lado `u`. As riscas de cada face são o que a criança conta:
   sem elas a peça vira um retângulo amarelo e a folha não ensina nada.
   Abaixo de ~2,2 px por cubinho a risca vira sujeira — aí só o contorno fica. */
var OURO = {frente: "#eab93f", topo: "#f7dd97", lado: "#c08a1a", risca: "#9c6f14", traco: "#7d570d"};
function prisma(w, a, p, u){
  u = u || 6; var K = 0.45, W = w * u, A = a * u, D = p * u * K;
  var LW = W + D, LA = A + D, fino = u < 2.2, r = Math.max(.5, Math.min(1, u / 7)), s = "";
  s += '<svg class="blk" width="' + LW.toFixed(1) + '" height="' + LA.toFixed(1) + '" viewBox="0 0 ' + LW.toFixed(1) + ' ' + LA.toFixed(1) + '" aria-hidden="true">';
  s += '<polygon points="0,' + D + ' ' + D + ',0 ' + (D + W) + ',0 ' + W + ',' + D + '" fill="' + OURO.topo + '"/>';
  s += '<polygon points="' + W + ',' + D + ' ' + (W + D) + ',0 ' + (W + D) + ',' + A + ' ' + W + ',' + (A + D) + '" fill="' + OURO.lado + '"/>';
  s += '<rect x="0" y="' + D + '" width="' + W + '" height="' + A + '" fill="' + OURO.frente + '"/>';
  if(!fino){
    var g = '<g stroke="' + OURO.risca + '" stroke-width="' + (r * .8).toFixed(2) + '" fill="none">', i, o;
    for(i = 1; i < w; i++) g += '<path d="M' + (i * u) + ',' + D + 'V' + (D + A) + '"/>';          /* frente ↕ */
    for(i = 1; i < a; i++) g += '<path d="M0,' + (D + i * u) + 'H' + W + '"/>';                     /* frente ↔ */
    for(i = 1; i < w; i++) g += '<path d="M' + (i * u) + ',' + D + 'l' + D + ',' + (-D) + '"/>';    /* topo ↗ */
    for(i = 1; i < a; i++) g += '<path d="M' + W + ',' + (D + i * u) + 'l' + D + ',' + (-D) + '"/>';/* lado ↗ */
    for(i = 1; i < p; i++){ o = i * u * K;
      g += '<path d="M' + o + ',' + (D - o) + 'H' + (W + o) + '"/>';                                 /* topo ↔ */
      g += '<path d="M' + (W + o) + ',' + (D - o) + 'V' + (D - o + A) + '"/>';                       /* lado ↕ */
    }
    s += g + '</g>';
  }
  s += '<g stroke="' + OURO.traco + '" stroke-width="' + r.toFixed(2) + '" fill="none" stroke-linejoin="round">' +
       '<path d="M0,' + D + 'L' + D + ',0H' + (D + W) + 'V' + A + 'L' + W + ',' + (A + D) + 'H0Z"/>' +
       '<path d="M0,' + D + 'H' + W + 'V' + (A + D) + 'M' + W + ',' + D + 'L' + (W + D) + ',0"/></g>';
  return s + '</svg>';
}
/* px = o TAMANHO TOTAL da peça na tela; cada uma acha o seu cubinho a partir dele */
function svgUnidade(px){ return prisma(1, 1, 1, (px || 14) / 1.45); }
function svgDezena(px){ return prisma(1, 10, 1, (px || 62) / 10.45); }
function svgCentena(px){ return prisma(10, 10, 1, (px || 62) / 10.45); }
function svgMilhar(px){ return prisma(10, 10, 10, (px || 74) / 14.5); }
function bloco(kind, px){ return kind === 0 ? svgMilhar(px) : kind === 1 ? svgCentena(px) : kind === 2 ? svgDezena(px) : svgUnidade(px); }
function grupoBlocos(kind, n, px, cap){
  cap = cap || 12; var out = '<span class="gr">', m = Math.min(n, cap), i;
  for(i = 0; i < m; i++) out += bloco(kind, px);

  return out + '</span>';
}
function material(c, d, u, px){
  /* placa e barra saem do MESMO cubinho; o cubinho solto sai desse cubinho também
     (px/10.45 é o lado, ×1.45 com a profundidade) — é o que deixa a família irmã */
  px = px || 62; var s = '<div class="mat">', cub = Math.max(9, px * 0.1387);
  if(c) s += grupoBlocos(1, c, px);

  return s + '</div>';

function rnd(n){ return Math.floor(Math.random() * n); }
function pega(pool, qtd, chaveRes){
  /* tira `qtd` itens do pool, embaralhados, sem dois resultados iguais em seguida */
  var p = pool.slice(), out = [], ult = null;
  while(out.length < qtd && p.length){
    var i = rnd(p.length), it = p[i];
    var r = chaveRes ? chaveRes(it) : null;
    if(out.length && r !== null && r === ult && p.length > 1){
      var j = (i + 1) % p.length; i = j; it = p[i]; r = chaveRes(it);
    }
    p.splice(i, 1); out.push(it); ult = r;
  }
  return out;
}

/* ---------- RASCUNHO: o espaço para fazer a conta ----------
   ⭐ PEDIDO DO MARCOS (8/set/2026): *"tem como adicionar nessas fases quadrados
   para eles poderem calcular, ou um espaço para eles desenharem a conta para
   ajudar?"*. É o que a folha de papel sempre teve e a tela não tinha: o canto
   onde a criança arma a conta antes de escrever a resposta. Sem ele, a conta de
   três algarismos vira cálculo de cabeça — que não é o que a folha pede.

   Como é feito: papel QUADRICULADO de verdade (o quadradinho é a coluna da
   ordem — unidade embaixo de unidade) desenhado no fundo, e por cima um canvas
   transparente onde ela escreve com o dedo ou com a setinha. Guarda os TRAÇOS
   (pontos de 0 a 1000, não a imagem), então volta igual em qualquer tamanho de
   tela e cabe no `localStorage` da retomada de 55 minutos. */
function aoAbrir(d, fn){ if(!d._aoAbrir) d._aoAbrir = []; d._aoAbrir.push(fn); }
function rascunho(d, pi){
  var cx = el("div", "rasc");
  cx.appendChild(el("div", "rtit", '<span>✏️ Rascunho — faça a conta aqui</span>'));
  var papel = el("div", "papel");
  var cv = document.createElement("canvas"); cv.className = "rcv";
  cv.setAttribute("aria-label", "Espaço quadriculado para armar a conta com o dedo ou com a setinha");
  papel.appendChild(cv); cx.appendChild(papel);
  var bar = el("div", "rbar");
  var bLapis = el("button", "rb on", "✏️ lápis"), bBorr = el("button", "rb", "🧽 borracha"),
      bLimpa = el("button", "rb", "🗑️ limpar");
  bar.appendChild(bLapis); bar.appendChild(bBorr); bar.appendChild(bLimpa); cx.appendChild(bar);
  d.appendChild(cx);

  var ctx = cv.getContext("2d"), tracos = ST.rasc[pi] || [], atual = null, apagando = false;
  function tam(){
    var r = papel.getBoundingClientRect();
    if(!r.width) return false;
    cv.width = Math.round(r.width); cv.height = Math.round(r.height);
    return true;
  }
  function pinta(){
    ctx.clearRect(0, 0, cv.width, cv.height);
    ctx.lineCap = "round"; ctx.lineJoin = "round";
    for(var i = 0; i < tracos.length; i++){
      var t = tracos[i]; if(t.length < 2) continue;
      ctx.beginPath(); ctx.strokeStyle = "#1d4ed8"; ctx.lineWidth = 3;
      ctx.moveTo(t[0] / 1000 * cv.width, t[1] / 1000 * cv.height);
      for(var j = 2; j < t.length; j += 2) ctx.lineTo(t[j] / 1000 * cv.width, t[j + 1] / 1000 * cv.height);
      ctx.stroke();
    }
  }
  function refaz(){ if(tam()) pinta(); }
  aoAbrir(d, refaz);
  window.addEventListener("resize", function(){ if(d.className.indexOf("viva") > -1) refaz(); });
  function ponto(ev){
    var r = cv.getBoundingClientRect();
    return [Math.round((ev.clientX - r.left) / r.width * 1000), Math.round((ev.clientY - r.top) / r.height * 1000)];
  }
  function longe(p, t){                       /* a borracha come o traço que ela encosta */
    for(var j = 0; j < t.length; j += 2){
      var dx = (t[j] - p[0]) / 1000 * cv.width, dy = (t[j + 1] - p[1]) / 1000 * cv.height;
      if(dx * dx + dy * dy < 400) return false;
    }
    return true;
  }
  cv.addEventListener("pointerdown", function(ev){
    ev.preventDefault();
    try{ cv.setPointerCapture(ev.pointerId); }catch(x){}
    var p = ponto(ev);
    if(apagando){ tracos = tracos.filter(function(t){ return longe(p, t); }); guarda(); pinta(); return; }
    atual = [p[0], p[1]]; tracos.push(atual);
  });
  cv.addEventListener("pointermove", function(ev){
    if(apagando && ev.buttons){ var q = ponto(ev); tracos = tracos.filter(function(t){ return longe(q, t); }); pinta(); return; }
    if(!atual) return;
    var p = ponto(ev); atual.push(p[0], p[1]); pinta();
  });
  function solta(){ if(atual || apagando){ atual = null; guarda(); } }
  cv.addEventListener("pointerup", solta);
  cv.addEventListener("pointercancel", solta);
  cv.addEventListener("pointerleave", solta);
  function guarda(){ ST.rasc[pi] = tracos; salvar(); }
  bLapis.onclick = function(){ apagando = false; bLapis.className = "rb on"; bBorr.className = "rb"; sPasso(); };
  bBorr.onclick = function(){ apagando = true; bBorr.className = "rb on"; bLapis.className = "rb"; sPasso(); };
  bLimpa.onclick = function(){ tracos = []; guarda(); pinta(); sPasso(); falar("rascLimpo"); };
}

/* ---------- folha pronta / navegação ---------- */
function idsDaPagina(pi){
  var ids = [], i, F = ST.folha;
  if(pi === 1) for(i = 0; i < 4; i++) ids.push("l1_" + ["u", "d", "c", "m"][i]);
  if(pi === 2) for(i = 0; i < F.p2.length; i++) ids.push("r2_" + i);
  if(pi === 3) for(i = 0; i < F.p3.length; i++) ids.push("r3_" + i);
  if(pi === 4) for(i = 0; i < F.p4.length; i++) ids.push("r4_" + i);
  if(pi === 5) for(i = 0; i < F.p5.length; i++){ ids.push("r5_" + i + "a"); ids.push("r5_" + i + "b"); ids.push("r5_" + i + "c"); }
  if(pi === 6) for(i = 0; i < F.p6.length; i++){ ids.push("r6_" + i + "q"); ids.push("r6_" + i + "r"); }
  if(pi === 7) for(i = 0; i < F.p7.length; i++){ ids.push("r7_" + i + "q"); ids.push("r7_" + i + "r"); }
  if(pi === 8) for(i = 0; i < F.p8.length; i++) ids.push("l8_k" + i);
  if(pi === 9) for(i = 0; i < F.p9.length; i++) ids.push("r9_" + i);
  if(pi === 10) for(i = 0; i < F.p10.length; i++){ ids.push("r10_" + i + "a"); ids.push("r10_" + i + "b"); }
  return ids;
}
function pendentes(pi){
  var ids = idsDaPagina(pi), n = 0;
  for(var i = 0; i < ids.length; i++){
    var id = ids[i];
    if(id.charAt(0) === "l"){ if(!ST.lig[id]) n++; }
    else if(!(CAIXAS[id] && ST.resp[id] === CAIXAS[id].certo)) n++;
  }
  return n;
}
function confereFolha(pi){
  if(pendentes(pi) > 0 || ST.prontas[pi]) return;
  ST.prontas[pi] = 1; salvar();
  PAGEL[pi].className += " pronta"; sFesta(); confete(22);
  if(pi < PAGEL.length - 1){ falar("folhaPronta"); setTimeout(function(){ if(ST.pag === pi) vaiPara(pi + 1); }, 2400); }
  else { setTimeout(fim, 1400); }
  atualizaNav();
}
function espelhaNome(t){ var n = document.getElementById("nomef"); if(n){ n.textContent = t || "escreva o seu nome ali embaixo"; n.className = t ? "nomef" : "nomef vazio"; } var i = document.getElementById("nomeIn"); if(i && i.value !== t) i.value = t; }
function vaiPara(pi){
  calar(); if(ATIVA){ ATIVA.el.className = ATIVA.el.className.indexOf("certa") > -1 ? "resp certa" : "resp"; if(ATIVA.el.className === "resp") ATIVA.el.innerHTML = '<i class="zi"></i>'; ATIVA = null; }
  document.getElementById("teclado").className = "";
  document.getElementById("barraCapa").className = pi === 0 ? "aberta" : "";
  if(pi === 0) espelhaNome(ST.nome || "");
  document.getElementById("fim").style.display = "none"; document.getElementById("retomar").style.display = "none";
  document.getElementById("nav").style.display = pi === 0 ? "none" : "flex";
  for(var i = 0; i < PAGEL.length; i++) PAGEL[i].className = PAGEL[i].className.replace(" viva", "");
  ST.pag = pi; salvar();
  var d = PAGEL[pi]; d.className += " viva";
  if(pi > 0) window.scrollTo(0, 0);
  if(d._aoAbrir) for(var z = 0; z < d._aoAbrir.length; z++) (function(fn){ setTimeout(fn, 60); })(d._aoAbrir[z]);
  atualizaNav();
  falarDepois(pi === 0 ? "capa" : "p" + pi + "enun", 280);
}
function atualizaNav(){
  var pi = ST.pag, total = PAGEL.length;
  document.getElementById("pg").textContent = pi === 0 ? "Capa" : "Folha " + pi + " de " + (total - 1);
  var feitas = 0; for(var k in ST.prontas) feitas++;
  document.getElementById("progI").style.width = (feitas / (total - 1) * 100) + "%";
  document.getElementById("bAnt").disabled = pi === 0;
  var prox = document.getElementById("bProx");
  prox.style.visibility = pi === 0 ? "hidden" : "visible";
  var pend = pi > 0 ? pendentes(pi) : 0;
  prox.textContent = pi === total - 1 ? (pend ? "Faltam " + pend : "Ver o resultado ★") : (pend ? "Faltam " + pend + " ▶" : "Próxima ▶");
  prox.className = pend ? "bt cinza" : "bt verde";
  document.getElementById("navTxt").textContent = pi === 0 ? "" : NOMES[pi - 1];
}
document.getElementById("bAnt").onclick = function(){ sPasso(); if(ST.pag > 0) vaiPara(ST.pag - 1); };
document.getElementById("bProx").onclick = function(){
  sPasso(); var pi = ST.pag, pend = pendentes(pi);
  if(pend){ falar("faltam"); var r = PAGEL[pi].querySelector(".resp:not(.certa), .ponta:not(.feita)"); if(r){ r.className += " treme"; setTimeout(function(){ r.className = r.className.replace(" treme", ""); }, 500); try{ r.scrollIntoView({behavior: "smooth", block: "center"}); }catch(e){} } return; }
  if(pi < PAGEL.length - 1) vaiPara(pi + 1); else fim();
};
document.getElementById("bOuvir").onclick = function(){ sPasso(); var b = this; if(document.getElementById("fim").style.display === "block"){ falar("fim", b); return; } falar(ST.pag === 0 ? "capa" : "p" + ST.pag + "enun", b); };
document.getElementById("bVoz").onclick = function(){ vozLigada = !vozLigada; var b = document.getElementById("bVoz"); if(vozLigada){ b.className = "zap"; falar("vozOn"); } else { calar(); b.className = "zap off"; } };
/* ⭐ CHAVE MESTRA (pedido do Marcos, 8/set/2026): *"seria legal ter a chave
   mestra, sendo colocada no campo nome eu posso ver todas as atividades, senha
   1275@"*. Digitar 1275@ no campo do nome abre o menu do professor, que pula
   para qualquer folha. Não é segurança (está no código-fonte) — é atalho para
   ele conferir a atividade inteira sem resolver tudo. O nome digitado é
   descartado ali, para a senha não virar o nome da criança na folha. */
var CHAVE_MESTRA = "1275@";
function abreMenuProf(){
  var cx = document.getElementById("mpFolhas");
  if(!cx.childNodes.length){
    var mk = function(rot, alvo){
      var b = el("button", null, rot);
      b.onclick = function(){ fechaMenuProf(); vaiPara(alvo); };
      cx.appendChild(b);
    };
    mk("Capa", 0);
    for(var k = 1; k <= 10; k++) mk(k + ". " + NOMES[k - 1], k);
  }
  calar();
  document.getElementById("menuProf").className = "aberto";
}
function fechaMenuProf(){ document.getElementById("menuProf").className = ""; }
document.getElementById("mpFechar").onclick = fechaMenuProf;
document.getElementById("menuProf").onclick = function(ev){ if(ev.target === this) fechaMenuProf(); };
document.getElementById("nomeIn").oninput = function(){
  if(this.value.indexOf(CHAVE_MESTRA) > -1){ this.value = ST.nome || ""; abreMenuProf(); return; }
  ST.nome = this.value.slice(0, 24); espelhaNome(ST.nome); salvar();
};
document.getElementById("nomeIn").onkeydown = function(ev){ if(ev.key === "Enter"){ ev.preventDefault(); this.blur(); if(ST.nome) falar("nomeOk"); } };
document.getElementById("bComecar").onclick = function(){ ac(); sPasso(); if(!ST.inicio) ST.inicio = Date.now(); vaiPara(1); };

function confete(n){ var cs = ["#f5b400", "#1f6b12", "#1565c0", "#c62828", "#6a1b9a"]; for(var i = 0; i < n; i++){ var c = el("div", "confete"); c.style.left = (Math.random() * 100) + "vw"; c.style.background = cs[i % cs.length]; c.style.animationDelay = (Math.random() * .5) + "s"; document.body.appendChild(c); setTimeout((function(x){ return function(){ if(x.parentNode) x.parentNode.removeChild(x); }; })(c), 2600); } }

/* ---------- fim ---------- */
var _segura = null;
function fim(){
  calar(); for(var i = 0; i < PAGEL.length; i++) PAGEL[i].className = PAGEL[i].className.replace(" viva", "");
  document.getElementById("teclado").className = ""; document.getElementById("barraCapa").className = ""; document.getElementById("nav").style.display = "none";
  var f = document.getElementById("fim"); f.style.display = "block"; window.scrollTo(0, 0);
  sFesta(); confete(60); falar("fim");
  var tot = 0, prim = 0, k; for(k in ST.tent){ tot++; if(ST.tent[k].erros === 0) prim++; }
  var est = document.getElementById("estrelas"); est.innerHTML = "";
  var n = prim >= tot * .85 ? 3 : (prim >= tot * .6 ? 2 : 1);
  for(i = 0; i < 3; i++){ var s = el("div", "estrela", '<svg viewBox="0 0 24 24" width="48" height="48"><path d="M12 2l3 6.6 7 .8-5.2 4.8 1.5 7L12 17.6 5.7 21.2l1.5-7L2 9.4l7-.8z" fill="' + (i < n ? "#f5b400" : "#e6dcc4") + '" stroke="#b98400" stroke-width="1"/></svg>'); est.appendChild(s); setTimeout((function(x){ return function(){ x.className = "estrela acesa"; }; })(s), 300 + i * 320); }
  var bar = document.getElementById("barras"); bar.innerHTML = "";
  for(var pi = 1; pi <= 10; pi++){ (function(pi){ var ids = idsDaPagina(pi), t = ids.length, p = 0; for(var j = 0; j < ids.length; j++){ var tt = ST.tent[ids[j]]; if(tt && tt.erros === 0 && tt.ok) p++; } var b = el("div", "barra", "<span>" + NOMES[pi - 1] + "</span><div class='tr'><i></i></div><b>" + p + "/" + t + "</b>"); bar.appendChild(b); setTimeout(function(){ b.querySelector("i").style.width = (t ? p / t * 100 : 0) + "%"; }, 400); })(pi); }
  document.getElementById("fimTxt").textContent = (ST.nome ? ST.nome + ", você" : "Você") + " acertou de primeira " + prim + " de " + tot + " itens.";
  document.getElementById("relatorio").style.display = "none";
}
(function(){
  var m = document.getElementById("medalha");
  function comeca(ev){ ev.preventDefault(); m.className = "medalha segurando"; _segura = setTimeout(function(){ m.className = "medalha"; relatorio(); }, 2000); }
  function solta(){ m.className = "medalha"; if(_segura){ clearTimeout(_segura); _segura = null; } }
  m.addEventListener("pointerdown", comeca); m.addEventListener("pointerup", solta); m.addEventListener("pointerleave", solta); m.addEventListener("pointercancel", solta);
})();
function relatorio(){
  var r = document.getElementById("relatorio"), h = "<b>Relatório do professor</b> — " + (ST.nome || "(sem nome)") + " · " + Math.round(((Date.now() - (ST.inicio || Date.now())) / 60000)) + " min<table><tr><th>Folha</th><th>De primeira</th><th>Precisou de dica</th></tr>";
  var tot = 0, prim = 0, fracas = [];
  for(var pi = 1; pi <= 10; pi++){
    var ids = idsDaPagina(pi), t = ids.length, p = 0, ruins = 0;
    for(var j = 0; j < ids.length; j++){ var tt = ST.tent[ids[j]]; if(tt && tt.erros === 0) p++; if(tt && tt.erros >= 2) ruins++; }
    tot += t; prim += p; if(ruins) fracas.push(NOMES[pi - 1]);
    h += "<tr><td>" + pi + ". " + NOMES[pi - 1] + "</td><td>" + p + "/" + t + "</td><td>" + ruins + "</td></tr>";
  }
  var parecer = prim >= tot * .85 ? "Dominou a divisão com material dourado, inclusive a troca e o resto." :
                (prim >= tot * .6 ? "Está construindo: acerta, mas ainda hesita na troca da barra e no resto." :
                 "Precisa retomar com o material concreto antes da conta armada.");
  h += "</table><p><b>Parecer:</b> " + parecer + (fracas.length ? "<br><b>Folhas para retomar:</b> " + fracas.join("; ") : "") + "</p><p style='color:#6b4a1a'>As contas deste caderno são sorteadas: cada aluno pode receber um caderno diferente.</p>";
  r.innerHTML = h; r.style.display = "block"; falar("fimRel");
}
document.getElementById("bRever").onclick = function(){ sPasso(); vaiPara(1); };
document.getElementById("bRecomecar").onclick = function(){ sPasso(); try{ localStorage.removeItem(CHAVE_LS); }catch(e){} ST = {pag: 0, nome: ST.nome, folha: novaFolha(), resp: {}, lig: {}, tent: {}, prontas: {}, rasc: {}, inicio: 0}; monta(); vaiPara(0); falarDepois("novoCaderno", 400); };

/* ---------- retomar (55 min) ---------- */
(function(){
  var salvo = carregar();
  ST.folha = (salvo && salvo.folha) ? salvo.folha : novaFolha();
  monta();
  if(salvo && salvo.pag > 0 && !(salvo.prontas && salvo.prontas[10])){
    document.getElementById("retomar").style.display = "block";
    document.getElementById("retTxt").textContent = (salvo.nome ? salvo.nome + ", você" : "Você") + " estava na folha " + salvo.pag + ". Quer continuar de onde parou?";
    document.getElementById("bRetSim").onclick = function(){ ST = salvo; monta(); vaiPara(salvo.pag); };
    document.getElementById("bRetNao").onclick = function(){ try{ localStorage.removeItem(CHAVE_LS); }catch(e){} ST.folha = novaFolha(); monta(); vaiPara(0); };
    PAGEL[0].className += " viva"; document.getElementById("nav").style.display = "none"; atualizaNav(); falarDepois("retomar", 400);
  } else { vaiPara(0); }
  var destrava = function(){ ac(); document.removeEventListener("pointerdown", destrava); document.removeEventListener("keydown", destrava); };
  document.addEventListener("pointerdown", destrava); document.addEventListener("keydown", destrava);
})();
</script>
