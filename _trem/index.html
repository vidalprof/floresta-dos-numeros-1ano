/* ⚠️ o `touchstart` recebe uma funcao COM NOME de proposito: assim nenhum
   `preventDefault` fica perto dele. preventDefault no touchstart mata o toque
   no celular (armadilha registrada no _padrao/DINAMICAS.md).                */
function ligaPeca(p){
  p.onclick=cliquePeca;
  p.onmousedown=mouseIni;
  p.addEventListener("touchstart",toqueIni,false);
  p.addEventListener("touchmove",toqueMeio,false);
  p.addEventListener("touchend",toqueFim,false);
}
function cliquePeca(){
  if(Date.now()-ultimoToque<700) return;    /* clique FANTASMA depois do toque */
  escolhe(this);
}
function mouseIni(ev){
  if(Date.now()-ultimoToque<700) return;
  pegaEm(this,ev.clientX,ev.clientY);
}
function toqueIni(ev){
  ultimoToque=Date.now();
  var to=ev.touches[0]; if(!to) return;
  pegaEm(this,to.clientX,to.clientY);
}
function toqueMeio(ev){
  if(!pego) return;
  var to=ev.touches[0]; if(!to) return;
  moveEm(to.clientX,to.clientY);
  if(moveu) ev.preventDefault();   /* so no MEIO do arrasto, nunca no comeco */
}
function toqueFim(ev){
  ultimoToque=Date.now();
  var to=ev.changedTouches[0], arrastou=moveu, alvo=this;
  if(to) soltaEm(to.clientX,to.clientY); else soltaSombra();
  if(!arrastou) escolhe(alvo);     /* toque simples: vale como escolher */
}
function moveMouse(ev){ if(pego) moveEm(ev.clientX,ev.clientY); }
function soltaMouse(ev){ if(pego) soltaEm(ev.clientX,ev.clientY); }
document.onmousemove=moveMouse;
document.onmouseup=soltaMouse;

/* ---------- o arrasto de verdade (mouse e dedo usam o mesmo caminho) ------ */
function pegaEm(p,x,y){
  if(!p||p.className.indexOf("usada")>=0) return;
  pego=p; px0=x; py0=y; moveu=false;
  sPega();
  somb=el("div","somb");
  recorta(somb,p.li,p.co,PW,PH);           /* a sombra ja vem no tamanho da VAGA */
  somb.style.left=(x-PW/2)+"px"; somb.style.top=(y-PH/2)+"px";
  somb.style.display="none";
  document.body.appendChild(somb);
}
function moveEm(x,y){
  if(!pego||!somb) return;
  if(!moveu&&(Math.abs(x-px0)>7||Math.abs(y-py0)>7)){
    moveu=true; somb.style.display="block";
    pego.className="qcpc sel";
  }
  if(!moveu) return;
  somb.style.left=(x-PW/2)+"px"; somb.style.top=(y-PH/2)+"px";
  acendeMira(vagaSob(x,y));
}
function soltaEm(x,y){
  var p=pego, arrastou=moveu, v=arrastou?vagaSob(x,y):null;
  soltaSombra();
  if(!p) return;
  if(p.className.indexOf("usada")<0) p.className="qcpc";
  if(!arrastou) return;            /* nao arrastou: quem resolve e o toque */
  if(v) tentaPor(p,v);
}
function soltaSombra(){
  if(somb&&somb.parentNode) somb.parentNode.removeChild(somb);
  somb=null; pego=null; moveu=false;
  acendeMira(null);
}
/* qual vaga esta debaixo do dedo? (a sombra tem pointer-events:none, entao
   elementFromPoint enxerga a vaga por baixo dela) */
function vagaSob(x,y){
  var e=document.elementFromPoint(x,y), n=0;
  while(e&&n<5){
    if((" "+String(e.className||"")+" ").indexOf(" qcvaga ")>=0) return e;
    e=e.parentNode; n++;
  }
  return null;
}
function acendeMira(v){
  if(vagaMira===v) return;
  if(vagaMira&&vagaMira.className.indexOf("cheia")<0) vagaMira.className="qcvaga";
  vagaMira=(v&&v.className.indexOf("cheia")<0)?v:null;
  if(vagaMira){ vagaMira.className="qcvaga mira"; sTap(); }
}

/* ---------- a regra da fase ---------- */
function escolhe(p){
  if(!p||p.className.indexOf("usada")>=0) return;
  var i;
  for(i=0;i<pecas.length;i++)
    if(pecas[i].className.indexOf("usada")<0) pecas[i].className="qcpc";
  escolhida=p; p.className="qcpc sel";
  sPega();
}
function cliqueVaga(){
  if(this.className.indexOf("cheia")>=0){ sTap(); return; }
  if(!escolhida){
    dica("Primeiro toque num <b>peda&#231;o</b> l&#225; embaixo. Depois toque na vaga.");
    sTap(); return;
  }
  tentaPor(escolhida,this);
}
function tentaPor(p,v){
  if(!p||!v) return;
  if(p.className.indexOf("usada")>=0||v.className.indexOf("cheia")>=0) return;
  if(p.li===v.li&&p.co===v.co) encaixa(p,v); else recusa(p,v);
}
function encaixa(p,v){
  recorta(v,v.li,v.co,PW,PH);
  v.className="qcvaga cheia";
  p.className="qcpc usada";
  p.style.backgroundImage="none";
  escolhida=null; errosSeg=0;
  apagaDica();
  sEncaixa();
  postas++;
  atualiza();
  if(postas>=vagas.length) fechaFase();
}
function recusa(p,v){
  sErro(); errosSeg++;
  v.className="qcvaga treme";
  destreme(v);
  ajuda(errosSeg);
}
/* ⚠️ o temporizador continua correndo depois do limpa(): sem o guarda
   `!telaAtual.parentNode` ele mexeria numa tela que ja saiu. */
function destreme(v){
  setTimeout(function(){
    if(!telaAtual||!telaAtual.parentNode) return;
    if(v.className.indexOf("cheia")<0) v.className="qcvaga";
  },330);
}
function atualiza(){
  if(elPlacar) elPlacar.innerHTML="Peda&#231;os no lugar: <b>"+postas+"</b> de <b>"+vagas.length+"</b>";
  if(barraP) barraP.style.width=Math.round(postas*100/vagas.length)+"%";
}
/* O ANDAIME QUE CRESCE — a peca nunca trava.
   ⭐ AGORA ELE TEM UM DEGRAU VISUAL (EdiLIM): no 2º erro o desenho apagado
   surge atrás das vagas, no 3º ele fica mais forte. Quem não lê é ajudado
   igual — e a dica escrita/falada diz o que aconteceu, para a ajuda nunca
   ficar só na imagem. */
function ajuda(n){
  if(n===1){
    dica("Olhe as <b>bordas</b>: a linha do peda&#231;o precisa continuar na figura.");
  }else if(n===2){
    poeFundo(1);
    dica("O <b>desenho apagadinho</b> apareceu atr&#225;s das vagas. A vaga deste peda&#231;o est&#225; <b>piscando</b>.");
    acendeCerta();
  }else{
    poeFundo(2);
    dica("Deixei o desenho <b>mais forte</b>. Era esta! Eu coloco esta e voc&#234; segue.");
    acendeCerta();
    esperaERevela();
  }
}
/* ⚠️ DEFEITO PAGO NA BANCADA (ago/2026): no 3º degrau a dica sumia no MESMO
   instante em que aparecia — `revela()` chama `encaixa()`, que chama
   `apagaDica()`. O pedaço pulava sozinho para a vaga e a criança não lia
   explicação nenhuma. Agora o revelar ESPERA a dica ser lida (e a vaga fica
   piscando durante a espera). O guarda da peça existe porque ela pode
   encaixar sozinha nesse meio-tempo. */
function esperaERevela(){
  var p=escolhida||primeiraSolta();
  setTimeout(function(){
    if(!telaAtual||!telaAtual.parentNode) return;
    if(!p||p.className.indexOf("usada")>=0) return;
    revela(p);
  },1000);
}
function acendeCerta(){
  var p=escolhida||primeiraSolta(), i;
  for(i=0;i<vagas.length;i++)
    if(vagas[i].className.indexOf("cheia")<0) vagas[i].className="qcvaga";
  if(!p) return;
  for(i=0;i<vagas.length;i++)
    if(vagas[i].li===p.li&&vagas[i].co===p.co&&vagas[i].className.indexOf("cheia")<0)
      vagas[i].className="qcvaga qc_pisca";
}
function revela(peca){
  var p=peca||escolhida||primeiraSolta(), i;
  if(!p||p.className.indexOf("usada")>=0) return;
  for(i=0;i<vagas.length;i++)
    if(vagas[i].li===p.li&&vagas[i].co===p.co){
      if(vagas[i].className.indexOf("cheia")>=0) return;
      encaixa(p,vagas[i]); return;
    }
}
function primeiraSolta(){
  var i;
  for(i=0;i<pecas.length;i++) if(pecas[i].className.indexOf("usada")<0) return pecas[i];
  return null;
}
function apagaDica(){
  var d=document.getElementById("dicaP");
  if(d&&d.parentNode) d.parentNode.removeChild(d);
}
function fechaFase(){
  sFecha();
  setTimeout(function(){
    if(!telaAtual||!telaAtual.parentNode) return;
    mostraBanner("Figura montada! Voc&#234; achou o lugar de cada peda&#231;o.",telaFim);
  },520);
}

function telaFim(){

  var b=el("button","btn","Jogar de novo");
  b.onclick=telaQuebra;
  c.appendChild(b);
  t.appendChild(c); app.appendChild(t);

MEC["quem-sou-eu"] = function(f, cen, fim){
  cen.className = cen.className + " mec-quem-sou-eu";
  /* ⚠️⚠️ LICAO PAGA, e a mais silenciosa de todas: a peca da MEMORIA declara a
     PROPRIA `function fim()`. Como o corpo dela entra dentro do fechamento, esse
     `fim` SOMBREAVA o parametro da ponte — e o `mostraBanner` daqui, que devia
     levar a fase seguinte, chamava a peca de volta. Laco infinito, sem erro de
     JS nenhum: o jogador so ficava PRESO, com todos os pares ja fechados e a
     medalha da peca na tela. Por isso a continuacao mora AQUI FORA, com um nome
     que o integrador confere que nenhuma peca usa (ver `confere_contra_motor`).
     E ela so dispara UMA vez: peca que chama o banner duas vezes pularia fase. */
  var _seguir = function(){ if(_seguir.ja) return; _seguir.ja = 1; fim(); };
  /* recolhe o enunciado da fase assim que a peca puser o balao dela (ver CSS) */
  setTimeout(function(){
    var b = cen.getElementsByClassName("pecabox")[0];
    if(b && b.getElementsByClassName("balao").length)
      cen.className = cen.className + " tembalaopeca";
  }, 120);
  (function(){
    /* a peca acha que esta sozinha; estes ajudantes fazem o meio de campo */
    var app = cen;
    /* o `ac()` DESTA peca: destrava o som (o motor chama isso de `arma()`) e
       devolve o AudioContext do motor. Fica local, dentro do fechamento, para
       nao brigar com o `var ac` do motor — que e o objeto, nao a funcao. */
    function ac(){ if(typeof arma === "function") arma(); return window.ac; }
    function limpa(){ var g = cen.getElementsByClassName("pecabox")[0];
      if(g) g.innerHTML = ""; else { g = document.createElement("div");
      g.className = "pecabox"; cen.appendChild(g); } app = g; }
    /* ⚠️ LICAO PAGA: este ajudante era um VAZIO — "quem manda na barra e o
       motor". So que o caca-palavras faz `setProg(t,0)` e depois PEGA A BARRA
       DE VOLTA (`t.getElementsByTagName("i")[0]`) para mostrar quantas palavras
       ja achou. Com o vazio, ele pegava `undefined` e estourava no primeiro
       toque: 446 erros de JS numa partida. Regra: o ajudante da ponte tem que
       FAZER o que o de verdade faz — nao pode so nao atrapalhar.
       A barra da PECA e a de dentro da fase (5 palavras achadas de 8); a do
       MOTOR e a da atividade (fase 4 de 32). As duas informam coisas
       diferentes, entao as duas ficam — a de dentro, menorzinha (ver CSS). */
    function setProg(t, p){
      if(!t || !t.appendChild) return;
      var pr = document.createElement("div"); pr.className = "prog progpeca";
      var i = document.createElement("i"); i.style.width = (p || 0) + "%";
      pr.appendChild(i); t.appendChild(pr);
    }
    /* ⚠️⚠️ LICAO PAGA (ago/2026), pega pelo Marcos JOGANDO: *"esta passando de
       fase sem aquele botao azul que aparecia com a palavra proximo... tem que
       ser parecida com a atividade do Broto"*.

       Esta ponte comemorava e PULAVA para a fase seguinte sozinha, 420ms
       depois. A crianca terminava uma fase e era JOGADA na outra: sem a tela de
       parabens, sem o mascote dizendo o que ela conseguiu, sem o botao para ela
       decidir quando seguir. No Broto — que e o modelo — cada fase fecha com o
       banner e a crianca TOCA para continuar. Era o fecho de toda fase de toda
       atividade montada que estava faltando.

       Agora a ponte chama o banner DE VERDADE do motor (`window.mostraBanner`,
       que a funcao local aqui dentro sombreia) e entrega o `_seguir` como o
       botao. A peca continua so avisando que acabou; quem manda no caminho
       segue sendo o motor — mas com a comemoracao no meio. */
    function mostraBanner(msg, cb){
      if(typeof festa === "function") festa();
      /* ⚠️⚠️ LICAO PAGA (Teatro, ago/2026), o Marcos jogando: uma fase fechava
         com um "QUADRADO GRANDE desconfigurado" em vez do aviso fininho das
         outras. Causa: 7 pecas (pintar, pintar-canvas, memoria, sete-erros,
         achar-na-cena, camadas-mapa, tracar-caminho) mandam no aviso de fim
         `<div class="medal">★</div>`. No motor a `.medal` e a MEDALHA DE 190px
         do FIM da atividade (imagem do mascote), entao o motor inflava aquilo
         num quadradao verde vazio com uma estrelinha. O aviso de FASE nao leva
         medalha — o motor ja comemora com confete. Tiro a medalha do aviso de
         fase aqui (conserto central: pega as 7 de uma vez). */
      if(msg) msg = msg.replace(/<div[^>]*class=["']?[^"'>]*medal[^"'>]*["']?[^>]*>[\s\S]*?<\/div>/gi, "");
      if(typeof window.mostraBanner === "function"){

       Aqui a ponte reaponta o `diz` da peca para a voz da casa. A conta da

    var diz = function(txt){

           A peca nao tem como saber se esta na bancada ou na atividade; quem sabe

   O CONTEÚDO É SÓ EXEMPLO (8 a 10 anos). Ao levar a peça para uma atividade,

 {resp:"POLVO",
