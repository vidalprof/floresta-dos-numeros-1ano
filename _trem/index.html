  /* ⭐⭐ O SOM CONTÍNUO. A pesquisa é explícita: "Connected Phonation Is More
     Effective than Segmented Phonation". A palavra fecha dita de UMA VEZ —
     nunca "BO... LO". É aqui que a criança ouve que dois pedaços viraram um. */
  voz(r.pal);

/* o ANDAIME que cresce — e que nunca deixa a criança presa */
function ajuda(n, r){
  var d=r.d||[], txt;
  if(n===1){ txt=d[0]||"Diga a palavra devagar."; mostraDica(txt); dizDica(txt); }
  else if(n===2){ txt=d[1]||"Escute o come&#231;o da palavra.";
    mostraDica(txt); dizDica(txt);
    pisca(r, false); }
  else if(n>=3){
    /* revela PRIMEIRO, escreve a dica DEPOIS — senão a fase se conserta
       sozinha e a criança não sabe por quê (lição paga em 5 de 6 peças) */
    pisca(r, true);
    txt=d[2]||"Toque no peda&#231;o aceso.";
    setTimeout(function(){ mostraDica(txt); },60);
    dizDica(txt);
  }
}
/* ⚠️ A DICA FALADA ESPERA (regra da casa, pilar SONORA): a criança acabou de
   ouvir a sílaba que pegou. Falar a dica no mesmo instante CORTA aquela voz —
   e é justamente a voz que ela pediu ao tocar. Meio segundo depois, a sílaba já
   terminou e a ajuda entra limpa. O guarda de geração mata o temporizador de
   uma rodada que já saiu da tela. */

  var meu=ger;

}

/* ==== PECA: letras-escondidas ==== */
MEC["letras-escondidas"] = function(f, cen, fim){
  cen.className = cen.className + " mec-letras-escondidas";
  /* ⚠️⚠️ LICAO PAGA, e a mais silenciosa de todas: a peca da MEMORIA declara a
     PROPRIA `function fim()`. Como o corpo dela entra dentro do fechamento, esse
     `fim` SOMBREAVA o parametro da ponte — e o `mostraBanner` daqui, que devia
     levar a fase seguinte, chamava a peca de volta. Laco infinito, sem erro de
     JS nenhum: o jogador so ficava PRESO, com todos os pares ja fechados e a
     medalha da peca na tela. Por isso a continuacao mora AQUI FORA, com um nome
     que o integrador confere que nenhuma peca usa (ver `confere_contra_motor`).
     E ela so dispara UMA vez: peca que chama o banner duas vezes pularia fase. */
  var _seguir = function(){ if(_seguir.ja) return; _seguir.ja = 1; fim(); };
  /* recolhe o enunciado da fase assim que a peca puser o balao dela (ver CSS) */
  setTimeout(function(){
    var b = cen.getElementsByClassName("pecabox")[0];
    if(b && b.getElementsByClassName("balao").length)
      cen.className = cen.className + " tembalaopeca";
  }, 120);
  (function(){
    /* a peca acha que esta sozinha; estes ajudantes fazem o meio de campo */
    var app = cen;
    /* o `ac()` DESTA peca: destrava o som (o motor chama isso de `arma()`) e
       devolve o AudioContext do motor. Fica local, dentro do fechamento, para
       nao brigar com o `var ac` do motor — que e o objeto, nao a funcao. */
    function ac(){ if(typeof arma === "function") arma(); return window.ac; }
    function limpa(){ var g = cen.getElementsByClassName("pecabox")[0];
      if(g) g.innerHTML = ""; else { g = document.createElement("div");
      g.className = "pecabox"; cen.appendChild(g); } app = g; }
    /* ⚠️ LICAO PAGA: este ajudante era um VAZIO — "quem manda na barra e o
       motor". So que o caca-palavras faz `setProg(t,0)` e depois PEGA A BARRA
       DE VOLTA (`t.getElementsByTagName("i")[0]`) para mostrar quantas palavras
       ja achou. Com o vazio, ele pegava `undefined` e estourava no primeiro
       toque: 446 erros de JS numa partida. Regra: o ajudante da ponte tem que
       FAZER o que o de verdade faz — nao pode so nao atrapalhar.
       A barra da PECA e a de dentro da fase (5 palavras achadas de 8); a do
       MOTOR e a da atividade (fase 4 de 32). As duas informam coisas
       diferentes, entao as duas ficam — a de dentro, menorzinha (ver CSS). */
    function setProg(t, p){
      if(!t || !t.appendChild) return;
      var pr = document.createElement("div"); pr.className = "prog progpeca";
      var i = document.createElement("i"); i.style.width = (p || 0) + "%";
      pr.appendChild(i); t.appendChild(pr);
    }
    /* ⚠️⚠️ LICAO PAGA (ago/2026), pega pelo Marcos JOGANDO: *"esta passando de
       fase sem aquele botao azul que aparecia com a palavra proximo... tem que
       ser parecida com a atividade do Broto"*.

       Esta ponte comemorava e PULAVA para a fase seguinte sozinha, 420ms
       depois. A crianca terminava uma fase e era JOGADA na outra: sem a tela de
       parabens, sem o mascote dizendo o que ela conseguiu, sem o botao para ela
       decidir quando seguir. No Broto — que e o modelo — cada fase fecha com o
       banner e a crianca TOCA para continuar. Era o fecho de toda fase de toda
       atividade montada que estava faltando.

       Agora a ponte chama o banner DE VERDADE do motor (`window.mostraBanner`,
       que a funcao local aqui dentro sombreia) e entrega o `_seguir` como o
       botao. A peca continua so avisando que acabou; quem manda no caminho
       segue sendo o motor — mas com a comemoracao no meio. */
    function mostraBanner(msg, cb){
      if(typeof festa === "function") festa();
      /* ⚠️⚠️ LICAO PAGA (Teatro, ago/2026), o Marcos jogando: uma fase fechava
         com um "QUADRADO GRANDE desconfigurado" em vez do aviso fininho das
         outras. Causa: 7 pecas (pintar, pintar-canvas, memoria, sete-erros,
         achar-na-cena, camadas-mapa, tracar-caminho) mandam no aviso de fim
         `<div class="medal">★</div>`. No motor a `.medal` e a MEDALHA DE 190px
         do FIM da atividade (imagem do mascote), entao o motor inflava aquilo
         num quadradao verde vazio com uma estrelinha. O aviso de FASE nao leva
         medalha — o motor ja comemora com confete. Tiro a medalha do aviso de
         fase aqui (conserto central: pega as 7 de uma vez). */
      if(msg) msg = msg.replace(/<div[^>]*class=["']?[^"'>]*medal[^"'>]*["']?[^>]*>[\s\S]*?<\/div>/gi, "");
      if(typeof window.mostraBanner === "function"){
        window.mostraBanner(msg || "Muito bem!", _seguir); return;
      }
      setTimeout(_seguir, 420);
    }
    /* ⚠️⚠️ LICAO PAGA (ago/2026), e foi o Marcos quem ouviu: *"onde tenho que
       ouvir a palavra nao funciona; o enunciado funciona, os sons das opcoes
       funcionam"*. So o botao OUVIR A PALAVRA era mudo.
       A causa: a peca sozinha nao tem gravacao nenhuma, entao ela fala pela
       VOZ ROBO do navegador (`speechSynthesis`). No PC da escola essa voz
       simplesmente nao existe (nao ha voz pt-BR instalada) — e falha CALADA,
       sem erro nenhum. O enunciado e as opcoes funcionavam porque passam pelo
       motor, que toca MP3 gravado.
       Aqui a ponte reaponta o `diz` da peca para a voz da casa. A conta da
       chave ignora maiusculas (`chaveVoz` faz `toLowerCase`), entao a palavra
       "pao" acha a gravacao feita para "PAO" — a mesma que o alto-falante da
       opcao ja usa. So cai na voz do navegador se nao houver gravacao. */
    var diz = function(txt){
      try{
        /* ⚠️⚠️ LICAO PAGA (ago/2026), e foi o Marcos quem OUVIU: *"o da padaria
           agora e falado duas vezes juntos, soa estranho"*.
           Varias pecas ganharam, no mesmo dia, a boa ideia de NARRAR SOZINHAS ao
           abrir — porque na bancada, sem motor, a fase ficava muda. So que dentro
           da atividade quem narra o balao e o MOTOR, sempre narrou. As duas vozes
           partiam juntas e se atropelavam.
           A peca nao tem como saber se esta na bancada ou na atividade; quem sabe
           e a ponte. Entao e AQUI que se decide: se o texto pedido e o mesmo que o
           motor ja esta dizendo (ou acabou de dizer, na meia janela de abertura da
           fase), a peca cala — o motor ja cumpriu o pedido dela. Qualquer outra
           fala (a palavra, a silaba, a dica) passa normalmente. */
        var _limpa = function(s){ return String(s||"").replace(/<[^>]*>/g," ")
          .replace(/&[a-z]+;|&#\d+;/gi," ").replace(/\s+/g," ").trim().toLowerCase(); };
        var _agora = _limpa(txt);
        if(_agora && window.__dizMotor && window.__dizMotor === _agora) return;
        try{
          var _b = document.getElementsByClassName("balao")[0];
          if(_b && _limpa(_b.textContent) === _agora){
            window.__dizMotor = _agora;
            setTimeout(function(){ window.__dizMotor = null; }, 1200);
            return;
          }
        }catch(_e){}
        var k = (typeof temVoz === "function") ? temVoz(txt) : null;
        if(k && typeof tocaVoz === "function"){ tocaVoz(k); return; }
        if(!window.speechSynthesis || !window.SpeechSynthesisUtterance) return;
        var u = new SpeechSynthesisUtterance(txt);
        u.lang = "pt-BR"; u.rate = .9; u.pitch = 1.05;
        window.speechSynthesis.cancel(); window.speechSynthesis.speak(u);
      }catch(e){}
    };
    limpa();

/* ====== A PEÇA COMEÇA AQUI ====== */

             elas não servem para nada, e o 2º degrau do andaime tira de cena
             todas MENOS A PRIMEIRA. Por isso escreva em primeiro lugar a que a

             ela a peça continua inteira: a palavra já está quase escrita;
   · voz   — o que o alto-falante diz, quando é diferente do escrito (OPCIONAL);
   · d     — os TRÊS degraus do andaime: dica que faz pensar -> tirar as que não
             servem -> acender a certa e deixar seguir.                        */
var PALAVRAS=[
 {pal:"CAMPO", esc:"CA_PO", extra:["N","L"], img:"le_campo", voz:"campo",

     "Deixei só duas na bandeja. Escute de novo: <b>cam-po</b>. Qual delas está aí?",
     "É o <b>M</b>: antes de P e de B vem M. Ele está aceso — toque nele para seguir."]},
 {pal:"BOMBA", esc:"BO_BA", extra:["N","T"], img:"le_bomba", voz:"bomba",
  d:["Ouça a palavra de novo e repare no que vem antes do <b>B</b>.",
     "Ficaram duas. Antes de B a letra é a mesma que você usou antes do P.",
     "É o <b>M</b>, porque vem antes do B. Ele está aceso — toque nele para seguir."]},
 {pal:"TAMBÉM", esc:"TA_BÉM", extra:["N","R"], img:"le_tambem", voz:"também",
  d:["Esta palavra tem M no fim. E antes do <b>B</b>, o que será que vai?",
     "Ficaram duas. Olhe a letra que vem DEPOIS do buraco: é ela que manda.",
     "É o <b>M</b>: quem manda é o B que vem depois. Ele está aceso — toque nele."]},
 {pal:"PONTE", esc:"PO_TE", extra:["M","C"], img:"le_ponte", voz:"ponte",
  d:["Cuidado: aqui depois do buraco vem <b>T</b>, e não P nem B. Qual letra vai?",
     "Ficaram duas. A regra do M vale só antes de P e de B — antes de T é a outra.",
     "É o <b>N</b>: antes de T, e de quase todas as outras, vai N. Ele está aceso."]},
 {pal:"BOMBOM", esc:"BO_BO_", extra:["N","P"], img:"le_bombom", voz:"bombom",
  d:["Esta tem DOIS buracos. Comece pelo primeiro: o que vem antes do B?",
     "Ficaram duas. Repare que os dois buracos vêm antes da mesma letra.",
     "É o <b>M</b> nos dois lugares: antes de B vai M. Ele está aceso — toque nele."]}
];

/* ⭐ O TEXTO DA PEÇA TAMBÉM É CONTEÚDO (regra da casa, paga na `ordenar`).
   O enunciado estava CRAVADO no corpo de várias peças — e numa atividade
   montada o balão da peça é a única instrução que a criança vê. Enunciado no
   corpo = enunciado errado no dia em que a mecânica servir outra palavra. */
var LETXT={selo:"A LETRA QUE FALTA",
           balao:"Ache a <b>letra certa</b> que falta na palavra.",
           hint:"Toque na letra, arraste, ou digite no teclado.",
           ouvir:"a palavra",
           fecho:"Você fechou todas as palavras!"};

var ri=0;        /* palavra da vez */
var posto=0;     /* qual buraco está sendo pedido agora */
var err=0;       /* erros DESTA palavra (o andaime cresce com ele) */
var ger=0;       /* geração da tela: mata setTimeout (e teclado) de rodada que já saiu */
var cels=[];     /* as casinhas da palavra da vez */
var furos=[];    /* só os buracos, na ordem */
var fichas=[];   /* os ladrilhos da bandeja */
var telaAtual=null, barraP=null;

/* ⚠️ A FIGURA vem do MOTOR (`imgEl`, que sabe onde mora a pasta `img/`). Aqui na
   bancada ela não existe, e a peça segue inteira — que é o próprio contrato:
   `img` é OPCIONAL. Pegar por `window.imgEl` (e não `typeof imgEl`) é de
   propósito: assim o nome fica DECLARADO, o portão "função que não existe"
   consegue medir, e no dia em que o motor trocar o nome dessa ferramenta a peça
   avisa em vez de sumir com a figura. */
var figEl = window.imgEl || null;

/* ⚠️⚠️ A VOZ É GRAVADA, SEMPRE. Quem fala é o motor: a ponte do integrador
   (`_padrao/ESQUELETO/integrar.py`) injeta um `diz(txt)` que toca o MP3 do Edge
   TTS — a voz da casa. Aqui NUNCA se chama `speechSynthesis`: a voz do
   navegador não existe no PC da escola e falha CALADA (foi assim que o botão
   mais importante de uma fase ficou mudo, e quem ouviu foi o Marcos). O portão
   `_qa/vozrobo.py` mede isso.
   Sozinha na bancada a peça fica sem voz — e isso é de propósito: tudo o que a
   voz diz também está escrito na tela, então ela continua inteira no mudo. */
var _vozTxt="", _vozQuando=0;
function voz(txt){
  if(!txt) return;
  var t=String(txt).replace(/<[^>]+>/g,""), agora=(new Date()).getTime();
  /* SEM ECO: a mesma letra é dita ao ser pega e a palavra volta a ser dita ao
     fechar. Tocar o mesmo mp3 de novo o REINICIA, e a criança ouve picado. */
  if(t===_vozTxt && agora-_vozQuando<900) return;
  _vozTxt=t; _vozQuando=agora;
  if(typeof diz==="function") diz(t);
}
/* ⚠️ A DICA FALADA ESPERA meio segundo: a criança acabou de ouvir a letra que
   pegou, e falar por cima corta justamente a voz que ela pediu. */
function dizDica(txt){
  var meu=ger;
  setTimeout(function(){ if(meu!==ger) return; voz(txt); },520);
}
function sEncaixe(){ nota(660,.06,.11,"square",0); nota(990,.12,.12,"triangle",.05); }
function sVolta(){ nota(392,.10,.10,"sine",0); nota(294,.12,.09,"sine",.07); }

/* ⭐ AS CASINHAS DA PALAVRA — e a regra de ouro desta peça:
   a letra que falta SAI DA PALAVRA, na posição do `_` do molde. Nunca se
   escreve a resposta à parte; resposta escrita à parte é resposta que um dia
   mente, porque o conteúdo muda e ela fica onde estava. */
function celulasDe(r){
  var esc=String(r.esc||r.pal||""), pal=String(r.pal||""), out=[], i, c;
  for(i=0;i<esc.length;i++){
    c=esc.charAt(i);
    if(c==="_") out.push({buraco:true, letra:(pal.charAt(i)||"?").toUpperCase()});
    else out.push({buraco:false, letra:c});
  }
  return out;
}

function pecaLetras(){
  var r=PALAVRAS[ri];
  if(!r){ fimDaPeca(); return; }
  err=0; posto=0; ger++;
  limpa(); document.onkeydown=null;
  var t=el("div","tela"); telaAtual=t;
  setProg(t, Math.round(ri*100/PALAVRAS.length));
  barraP=t.querySelector(".prog i");
  var c=el("div","centro");
  c.appendChild(el("div","selo", LETXT.selo||"A LETRA QUE FALTA"));
  c.appendChild(el("div","balao", LETXT.balao||"Leve a <b>letra certa</b> at&#233; o buraco."));

  /* o cartão: figura (quando houver) + a palavra com o buraco */
  var cart=el("div","leCartao");
  if(figEl && r.img){ var g=el("div","leFig"); g.appendChild(figEl(r.img)); cart.appendChild(g); }
  cels=celulasDe(r); furos=[];
  var linha=el("div","lePal"), i, cel;
  for(i=0;i<cels.length;i++){
    if(cels[i].buraco){
      cel=el("div","leBuraco"+(furos.length===0?" agora":""),"");
      cel.id="leb"+furos.length;
      cels[i].no=cel; furos.push(cels[i]);
    }else{
      cel=el("div","leCel", cels[i].letra);
    }
    linha.appendChild(cel);
  }
  cart.appendChild(linha);
  c.appendChild(cart);

  c.appendChild(ouvido(r));

  /* a BANDEJA: uma letra por buraco + as letras a mais, SEMPRE embaralhadas.
     ⚠️ embaralhar é a armadilha número um desta família: sem isso a criança
     aprende a POSIÇÃO e não a letra. */
  var lista=[], z;
  for(z=0;z<furos.length;z++) lista.push({L:furos[z].letra, ok:1, ord:-1});
  /* `ord` guarda a ordem em que o autor escreveu as letras a mais: é ela que
     decide qual delas FICA DE PÉ no 2º degrau do andaime (ver `tiraAsQue...`) */
  for(z=0;z<(r.extra||[]).length;z++)
    lista.push({L:String(r.extra[z]).toUpperCase(), ok:0, ord:z});
  baguncar(lista);
  var band=el("div","leBandeja"); fichas=[];
  for(z=0;z<lista.length;z++) band.appendChild(fazLetra(lista[z]));
  c.appendChild(band);

  c.appendChild(el("div","hint", LETXT.hint||"Toque na letra, arraste, ou digite no teclado."));
  t.appendChild(c); app.appendChild(t);
  marcaQA();
  ligaTeclado();
  voz(LETXT.balao||"");
}

/* ⭐ O ALTO-FALANTE DA PALAVRA. No 1º ano é ele que diz QUAL palavra é; no 5º é
   ele que faz a criança ouvir o som nasal antes do P e do B — que é o conteúdo
   da regra. Ele NÃO gasta tentativa e não escolhe nada.
   ⚠️ `data-voz` DECLARA o que a voz diz: o motor usa esse atributo em vez de
   adivinhar pelo texto do botão (senão tentaria gravar "a palavra"). */
function ouvido(r){
  var box=el("div","leOuvir");
  var z=el("button","zap","");
  z.type="button";
  z.appendChild(el("i","fone",""));
  z.setAttribute("aria-label","Ouvir a palavra");
  z.setAttribute("data-voz", r.voz||r.pal);
  z.onclick=function(ev){
    var e=ev||window.event;
    if(e.stopPropagation) e.stopPropagation(); else e.cancelBubble=true;
    sTap(); voz(r.voz||r.pal);
    z.className="zap tocando";
    setTimeout(function(){ z.className="zap"; },900);
    return false;
  };
  box.appendChild(z);
  box.appendChild(el("span","leOuvirTxt", LETXT.ouvir||"a palavra"));
  return box;
}

/* ⚠️⚠️ LIÇÃO PAGA NA PRÓPRIA BANCADA (ago/2026), e o portão não pegaria nunca:
   o estado do ladrilho morava na STRING `className`, e cada quem escrevia a sua
   por cima. O tremor do erro (`destreme`, 110ms e 240ms depois) reescrevia
   `className="leLetra"` — e nesses 240ms o 2º degrau do andaime já tinha
   escondido as letras que não servem. Resultado: a criança errava, a peça dizia
   "tirei as letras que não servem", e um quarto de segundo depois elas VOLTAVAM
   para a bandeja. A tela contradizia a própria ajuda, e nenhum portão vê isso —
   o app funciona inteiro assim.
   Agora o estado é FLAG (`_usada`, `_some`, `_acesa`) e a roupa se escreve num
   lugar só. Quem quiser um estado passageiro (o tremor) o pede como `extra`. */
function veste(b, extra){
  var c="leLetra";
  if(b._usada) c+=" usada";
  if(b._some)  c+=" some";
  if(b._acesa) c+=" acesa";
  if(extra)    c+=" "+extra;
  b.className=c;
}
function fora(b){ return b._usada||b._some; }

function fazLetra(item){
  var b=el("button","leLetra", item.L);
  b.type="button";
  b._L=item.L; b._ok=item.ok; b._ord=item.ord;
  arrastavel(b);
  b.onclick=function(){
    /* ⚠️ o guarda do MOUSE FANTASMA: no celular o navegador dispara eventos de
       mouse DEPOIS do toque, e sem isto eles refazem o gesto que já aconteceu.
       Defeito já pego DUAS vezes na casa. */
    if(b._ultimoToque && (new Date()).getTime()-b._ultimoToque<700) return;
    escolheu(b);
  };
  fichas.push(b);
  return b;
}

/* ⭐ PEGOU A LETRA: som na hora e a LETRA DITA. A criança escolhe pelo som, não
   pelo desenho — e é ouvindo "M" na mão dela que a letra vira som. */
function pegou(b){
  if(!b || fora(b)) return;
  sTap(); voz(b._L);
}

function buracoDaVez(){ return furos[posto]||null; }

function escolheu(b){
  if(!b || fora(b)) return;
  if(!telaAtual || !telaAtual.parentNode) return;
  var alvo=buracoDaVez();
  if(!alvo) return;
  if(b._L===alvo.letra) encaixa(b, alvo);
  else errou(b);
}

/* ⭐ A CORRIDA E O ENCAIXE — o coração da peça. A letra sai da bandeja, corre
   até o buraco e só depois de chegar é que ela vira parte da palavra. */
function encaixa(b, alvo){
  var meu=ger, vaga=alvo.no;
  var a=b.getBoundingClientRect(), v=vaga.getBoundingClientRect();
  b.style.webkitTransform="translate("+(v.left-a.left+(v.width-a.width)/2)+"px,"
    +(v.top-a.top+(v.height-a.height)/2)+"px) scale(.9)";
  b.style.transform=b.style.webkitTransform;
  veste(b,"voa");
  sEncaixe(); voz(b._L);
  setTimeout(function(){
    if(meu!==ger) return;
    b._usada=1; veste(b);
    vaga.innerHTML=alvo.letra;
    vaga.className="leBuraco cheia";
    /* o pop do assentamento: cresce e POUSA de volta (transição, não keyframes) */
    setTimeout(function(){ if(meu!==ger) return; vaga.className="leBuraco cheia pousa"; },40);
    posto++;
    var prox=document.getElementById("leb"+posto);
    if(prox) prox.className="leBuraco agora";
    marcaQA();
    if(posto>=furos.length) fechaPalavra();
  },320);
}

function errou(b){
  err++; sErro(); sVolta();
  if(b){
    veste(b,"treme");
    destreme(b);
  }
  ajuda(err);
}
/* o tremor em DUAS classes e transição: esquerda -> direita -> parado. Sem
   `@keyframes`, que se perdem quando o integrador prefixa o CSS da peça.
   ⚠️ e ele repõe a roupa pelo `veste`, nunca por uma string escrita aqui: foi
   assim que ele apagava o 2º degrau do andaime (ver a lição em `veste`). */
function destreme(b){
  var meu=ger;
  setTimeout(function(){ if(meu!==ger) return; if(!fora(b)) veste(b,"treme2"); },110);
  setTimeout(function(){ if(meu!==ger) return; if(!fora(b)) veste(b); },240);
}

function fechaPalavra(){
  var meu=ger, r=PALAVRAS[ri];
  sCerto(); festa();
  var c=app.querySelector(".centro");
  if(c) c.appendChild(el("div","lePronta", r.pal));
  apagaDica();
  if(barraP) barraP.style.width=Math.round((ri+1)*100/PALAVRAS.length)+"%";
  /* a palavra fecha dita POR INTEIRO: é ouvindo a palavra pronta que a criança
     confere que a letra que ela pôs é a que faltava. */
  voz(r.voz||r.pal);
  setTimeout(function(){
    if(meu!==ger) return;
    if(!telaAtual||!telaAtual.parentNode) return;
    ri++;
    if(ri<PALAVRAS.length){ pecaLetras(); return; }
    document.onkeydown=null;
    mostraBanner(LETXT.fecho||"Voc&#234; fechou todas as palavras!", fimDaPeca);
  },1500);
}

/* ⭐ O ANDAIME QUE CRESCE — e que nunca deixa a criança presa.
   1º erro: a dica que faz PENSAR (o som, a letra que vem depois do buraco);
   2º erro: as letras que NÃO SERVEM somem da bandeja (apoio concreto: é o "ver
            destino" do EdiLIM virado em ajuda automática — serve para quem
            ainda não lê, porque não depende de ler nada);
   3º erro: a letra certa ACENDE, ganha a marca escrita, e a criança segue.
            Aqui a casa é explícita (RECEITA §1): o 3º degrau revela e deixa
            passar — a criança travada perde a aula inteira, e isso pesa mais. */
function ajuda(n){
  var d=(PALAVRAS[ri]&&PALAVRAS[ri].d)||[], txt;
  if(n===1){
    txt=d[0]||"Diga a palavra devagar e escute o que falta.";
    mostraDica(txt); dizDica(txt);
  }else if(n===2){
    txt=d[1]||"Tirei as letras que n&#227;o servem.";
    mostraDica(txt); dizDica(txt);
    tiraAsQueNaoServem();
  }else{
    /* revela PRIMEIRO, escreve a dica DEPOIS — senão a fase se conserta
       sozinha e a criança não sabe por quê (lição paga em 5 de 6 peças) */
    acendeACerta();
    txt=d[2]||"&#201; esta! Ela est&#225; acesa: toque nela para seguir.";
    setTimeout(function(){ mostraDica(txt); },60);
    dizDica(txt);
  }
}
/* ⭐ O 2º DEGRAU — e a lição que ele custou, medida na própria bancada.
   A primeira versão tirava TODAS as letras a mais de uma vez. Ficava só a
   certa: bonito de ver, e errado por dois motivos. Primeiro, a criança que
   errou duas vezes recebia a RESPOSTA em vez de ajuda — o degrau 2 virava o
   degrau 3 e o andaime encolhia de três para dois. Segundo, e é o que os
   portões da casa já sabem: com nenhuma opção errada de pé, o 3º degrau nunca
   acontece — vira CÓDIGO MORTO (é a mesma regra que o `_qa/dinamicas.py` cobra
   da mecânica `escolher`, palavra por palavra).
   O que ele faz agora: some com as que não ajudam e **deixa de pé UMA** — a
   PRIMEIRA `extra` escrita na gaveta. Em M antes de P e B isso estreita a
   escolha justamente para o par que a criança confunde de verdade (M e N), que
   é onde a regra mora. Se só houver uma letra a mais, ela some também: aí não
   há par nenhum a comparar, e prender a criança seria pior. */
function tiraAsQueNaoServem(){
  var i, b, vivas=[];
  for(i=0;i<fichas.length;i++){
    b=fichas[i];
    if(!b._ok && !fora(b)) vivas.push(b);
  }
  /* a que FICA é a primeira da gaveta (ordem de `extra`), não a primeira da
     bandeja — a bandeja está embaralhada de propósito */
  vivas.sort(function(x,y){ return x._ord-y._ord; });
  for(i=(vivas.length>1?1:0); i<vivas.length; i++){ vivas[i]._some=1; veste(vivas[i]); }
  marcaQA();
}
function acendeACerta(){
  var alvo=buracoDaVez(), i, b;
  if(!alvo) return;
  for(i=0;i<fichas.length;i++){
    b=fichas[i];
    if(fora(b)) continue;
    if(b._L===alvo.letra && !b._acesa){
      b._acesa=1;
      veste(b);
      b.appendChild(el("span","leMarca","esta"));
      return;
    }
  }
}
function apagaDica(){
  var d=document.getElementById("dicaP");
  if(d&&d.parentNode) d.parentNode.removeChild(d);
}

/* `data-qa="1"` na letra que serve AGORA: é assim que o auditor-jogador
   atravessa a peça. Só para ele — a criança nunca vê isto. */
function marcaQA(){
  var alvo=buracoDaVez(), i, b, serve;
  for(i=0;i<fichas.length;i++){
    b=fichas[i];
    serve = alvo && b._L===alvo.letra && !fora(b);
    b.setAttribute("data-qa", serve?"1":"0");
  }
}

/* ⭐⭐ A SEGUNDA PORTA DE ENTRADA — O TECLADO DE VERDADE (regra do CLAUDE.md:
   *"seria interessante se o aluno além de teclar no teclado virtual funcionasse
   se ele tocasse no teclado de verdade, as duas opções"*). No PC da escola tem
   teclado, e aqui digitar é o gesto NATURAL: o que falta é uma letra.
   ⚠️ o guarda de geração: o `onkeydown` de uma rodada que já saiu da tela se
   reinstalava POR CIMA da seguinte — defeito pago no "monte a palavra". */
function ligaTeclado(){
  var meu=ger;
  document.onkeydown=function(ev){
    if(meu!==ger) return;
    if(!telaAtual||!telaAtual.parentNode) return;
    var e=ev||window.event;
    if(e.ctrlKey||e.altKey||e.metaKey) return;
    var k=e.key;
    if(!k && e.keyCode) k=String.fromCharCode(e.keyCode);
    if(!k || k.length!==1) return;
    k=k.toUpperCase();
    if(!/[A-ZÀ-Ü]/.test(k)) return;
    if(e.preventDefault) e.preventDefault();
    var alvo=buracoDaVez(), i, b, achou=null;
    if(!alvo) return;
    for(i=0;i<fichas.length;i++){
      b=fichas[i];
      if(fora(b)) continue;
      if(b._L===k){ achou=b; break; }
    }
    /* letra que nem está na bandeja: também é uma tentativa — a ajuda cresce
       do mesmo jeito, e a criança não fica batendo no teclado sem resposta. */
    if(!achou){ errou(null); return; }
    pegou(achou);
    escolheu(achou);
  };
}

/* ⭐ A TERCEIRA PORTA: o ARRASTO (mouse e dedo). Soltar em cima do buraco vale o
   mesmo que tocar. Aqui o arrasto não é enfeite — levar a letra até dentro do
   buraco é a própria ideia de "esta letra mora nesta palavra".
   ⚠️ NUNCA `preventDefault` no `touchstart`: mata o toque simples. */
function arrastavel(b){
  var mx=0,my=0,arr=false,mv=null,up=null;
  /* ⚠️⚠️ LIÇÃO PAGA NA BANCADA (ago/2026): o arrasto com MOUSE não chegava nunca.
     Os `onmousemove`/`onmouseup` moravam no PRÓPRIO ladrilho — e o mouse sai de
     cima dele no primeiro centímetro: disparava `onmouseleave`, o gesto era
     cancelado e a letra voltava. Com o dedo funcionava (o toque continua indo
     para o elemento onde começou), então o defeito era invisível no celular e
     total no PC da escola, que é justamente onde há mouse.
     Enquanto o gesto dura, quem escuta é o DOCUMENTO. */
  function ligaDoc(){
    desligaDoc();
    mv=function(e){ if(!b.parentNode){ desligaDoc(); return; } move(e.clientX,e.clientY); };
    up=function(e){ desligaDoc(); solta(e.clientX,e.clientY); };
    document.addEventListener("mousemove",mv,false);
    document.addEventListener("mouseup",up,false);
  }
  function desligaDoc(){
    if(mv) document.removeEventListener("mousemove",mv,false);
    if(up) document.removeEventListener("mouseup",up,false);
    mv=null; up=null;
  }
  function comeca(x,y,ev){
    if(fora(b)) return;
    pegou(b);
    arr=true; mx=x; my=y;
    b.style.zIndex="30"; b.style.position="relative";
    if(ev&&ev.type==="mousedown"&&ev.preventDefault) ev.preventDefault();
  }
  function move(x,y){
    if(!arr) return;
    b.style.webkitTransform="translate("+(x-mx)+"px,"+(y-my)+"px)";
    b.style.transform=b.style.webkitTransform;
  }
  function limpaEstilo(){
    b.style.webkitTransform=""; b.style.transform=""; b.style.zIndex="";
  }
  function noBuraco(x,y){
    var v=document.getElementById("leb"+posto);
    if(!v) return false;
    var q=v.getBoundingClientRect();
    /* margem generosa: dedo de criança não acerta o pixel */
    return x>q.left-32&&x<q.right+32&&y>q.top-32&&y<q.bottom+32;
  }
  function solta(x,y){
    if(!arr) return;
    arr=false; limpaEstilo();
    /* soltou em cima do buraco = a mesma coisa que tocar na letra. Soltou fora,
       o clique do próprio botão resolve (é o toque simples) — e aí aqui só toca

/* ⭐ VER DESTINO: a ponta certa do OUTRO lado passa a se mostrar, e uma LINHA
   TRACEJADA sai da ponta escolhida ate ela — o caminho inteiro, nao so o
   ponto de chegada. Nivel 1 (2o erro) pulsa devagar; nivel 2 (3o erro) acende
   de vez, e a peça continua deixando a crianca fechar o par com a mao.    */
function mostraDestino(l,nivel){
  if(!l||temClasse(l,"feita")) return;
  var a=app.getElementsByClassName("lig"), i, alvo=null;
  for(i=0;i<a.length;i++){
    if(temClasse(a[i],"feita")||a[i]===l) continue;
    if(casa(l,a[i])){ alvo=a[i]; break; }   /* aponta para um destino AINDA válido (par exato OU grupo) */
  }
  if(!alvo) return;
  destDe=l; destAlvo=alvo; destNivel=nivel;
  for(i=0;i<a.length;i++) if(!temClasse(a[i],"feita")&&a[i]!==marcada)
    a[i].className=classeLig(a[i],"lig");
  redesenha();
}

/* ⭐ MUITOS-PARA-UM (Marcos, ago/2026: *"tanto o quadrado quanto a pirâmide
   ficam firmes, então ao clicar com qualquer um em qualquer que diga que fica
   firme do outro lado seria interessante funcionar"*). Duas pontas casam quando
   têm a MESMA chave `k` (o par exato de sempre) OU quando compartilham um GRUPO
   (`data-g`): assim o cubo liga a QUALQUER destino "fica firme", e a pirâmide ao
   outro — sem precisar acertar o gênero da frase. Compatível: gaveta sem `g`
   segue casando só por `k`. Os alvos se consomem (`feita`), então N sólidos do
   grupo preenchem os N destinos do grupo em qualquer ordem. */
function casa(a,b){
  if(a._lado===b._lado) return false;
  var ka=a.getAttribute("data-qa"), kb=b.getAttribute("data-qa");
  if(ka!==null&&ka===kb) return true;
  var ga=a.getAttribute("data-g"), gb=b.getAttribute("data-g");
  return !!(ga&&gb&&ga===gb);
}
function juntar(a,b){
  if(!a||!b||a===b) return;
  if(temClasse(a,"feita")||temClasse(b,"feita")) return;
  if(a._lado===b._lado) return;
  if(casa(a,b)){
    sCerto();
    a.className="lig feita"; b.className="lig feita";
    marcada=null;
    if(destDe===a||destDe===b||destAlvo===a||destAlvo===b){
      destDe=null; destAlvo=null; destNivel=0;
    }
    FEITOS.push([a,b]);
    redesenha();
    if(barraP) barraP.style.width=Math.round(FEITOS.length*100/LIG.length)+"%";
    if(FEITOS.length>=LIG.length){
      var ge=ger;
      setTimeout(function(){
        if(ge!==ger) return;
        mostraBanner(FECHO, fimDaPeca);
      },520);
    }
    return;
  }
  /* ERRO: não pune. Som grave curto, as pontas voltam e o andaime CRESCE. */
  sErro();
  a._err=(a._err||0)+1;
  /* o andaime de TEXTO (escrito + dito) continua sendo o mesmo de sempre... */
  ajuda(DICAS[Math.min(a._err,DICAS.length)-1]);
  var guardar=a;
  desmarca();
  /* ...e o VER DESTINO entra JUNTO com ele, nunca no lugar dele: no 2º erro
     da mesma ponta o outro lado se mostra discreto (tracejado que pulsa +
     linha fantasma), no 3º ele acende de vez.                             */
  if(guardar._err===2) mostraDestino(guardar,1);
  if(guardar._err>=3) revela(guardar);
}

/* 3º erro: acende a ponta certa do outro lado e DEIXA seguir — é o que
   garante que a peça nunca trava. A dica diz isso em palavras também.    */
function revela(l){
  mostraDestino(l,2);
  if(!destAlvo) return;
  marca(l);          /* a ponta fica escolhida: basta tocar na acesa */
}

function ponto(l){
  var r=l.getBoundingClientRect(), b=caixaL.getBoundingClientRect();
  var x=(l._lado==="e") ? (r.right-b.left) : (r.left-b.left);
  return {x:x, y:r.top+r.height/2-b.top};
}

function traca(x1,y1,x2,y2,extra){
  var dx=x2-x1, dy=y2-y1, comp=Math.sqrt(dx*dx+dy*dy);
  var ang=Math.atan2(dy,dx)*180/Math.PI;
  var ln=el("div","linha");
  /* ⚠️ o `extra` era IGNORADO — a funcao escrevia "linha viva" na marra, e por
     isso todo pedido de linha diferente (a fantasma do ver destino) saia com
     a cara da linha do arrasto. Agora ela usa o que lhe pedem.            */
  if(extra) ln.className="linha "+extra;
  ln.style.left=x1+"px"; ln.style.top=y1+"px"; ln.style.width=comp+"px";
  ln.style.webkitTransform="rotate("+ang+"deg)";
  ln.style.transform="rotate("+ang+"deg)";
  camadaL.appendChild(ln);
  return ln;
}

function redesenha(){
  if(!camadaL) return;
  camadaL.innerHTML="";
  linhaViva=null;
  var i,p1,p2;
  for(i=0;i<FEITOS.length;i++){
    p1=ponto(FEITOS[i][0]); p2=ponto(FEITOS[i][1]);
    traca(p1.x,p1.y,p2.x,p2.y,"");
  }
  /* ⭐ a LINHA FANTASMA do ver destino: entra por ultimo, por cima das feitas */
  if(destDe&&destAlvo&&!temClasse(destDe,"feita")&&!temClasse(destAlvo,"feita")){
    p1=ponto(destDe); p2=ponto(destAlvo);
    traca(p1.x,p1.y,p2.x,p2.y,(destNivel>=2)?"fanf":"fan");
  }
}

function imgSvg(nome){ return "url(\"data:image/svg+xml;charset=utf-8,"+encodeURIComponent(ARTE[nome])+"\")"; }
var VERSO = imgSvg("verso");   /* o verso e IMAGEM, nunca cor lisa */

/* ---- O CONTEUDO: troque APENAS este bloco ----
   Par CONCEITUAL (palavra <-> significado), agora com FIGURA dos dois lados.
   ⭐ A REGRA DE OURO DO CONTEUDO: `fig` e `figsen` tem que ser desenhos
   DIFERENTES um do outro (a abelha e o pote de mel), nunca o mesmo desenho nas
   duas cartas. Figura igual dos dois lados transforma o jogo em "ache as duas
   iguais" e o sentido some — que e exatamente o que esta peca existe para
   evitar. Diferentes, a crianca que ainda nao le PENSA para casar.
   Numa atividade de verdade acrescente `img` e `imgsen` com o nome da ARTE DE
   IA (`{img:"pl_abelha", imgsen:"pl_mel"}`) — a peca prefere a arte gerada e so
   cai no desenho embutido se ela nao existir.
   E `voz`/`vozsen` so quando a voz precisar dizer algo diferente do que esta
   escrito (o texto da carta e o padrao).                                    */
var PARES=[
 {k:"abelha", pal:"ABELHA",  fig:"abelha",  sen:"faz o mel",          figsen:"mel"},
 {k:"semen",  pal:"SEMENTE", fig:"semente", sen:"m2_vira uma planta",    figsen:"broto"},
 {k:"chuva",  pal:"CHUVA",   fig:"chuva",   sen:"molha a terra",      figsen:"poca"},
 {k:"ninho",  pal:"NINHO",   fig:"ninho",   sen:"casa do passarinho", figsen:"passaro"}
];

/* ⭐ O DEGRAU DO ANDAIME, em tentativas sem par. Era 6; para o 1o ano e 4 —
   a justificativa esta no cabecalho do arquivo (8 cartas, memoria de trabalho
   de ~3 itens: em 6 a ajuda so chegava depois da crianca ja ter se perdido). */
var PASSO_AJUDA=4;
/* quanto tempo as duas cartas erradas FICAM de cara para cima antes de voltar.
   Era 900ms — pouco para quem tem 6 anos e ainda esta aprendendo a olhar duas
   figuras e guardar as duas. 1400ms e o tempo de olhar uma e depois a outra. */
var TEMPO_VOLTA=1400;
/* a ESPIADA de abertura: o tabuleiro nasce aberto e vira sozinho. */
var TEMPO_ESPIADA=2600;

var cartas, virada, travado, feitos, tentativas, progI, elPlacar, elPares, elHint, ger=0;

function sVira(){ nota(300,.05,.13,"square",0); nota(520,.06,.10,"square",.045); }
function sPar(){ nota(659.25,.16,.16,"triangle",0); nota(880,.22,.15,"triangle",.09); }
function sPing(){ nota(880,.09,.12,"triangle",0); }

/* ⭐⭐ A VOZ DA CARTA. Numa atividade montada, a PONTE do integrador reaponta
   este `diz` para a VOZ GRAVADA da casa (Edge TTS, `temVoz`/`tocaVoz`) — e a
   voz-robo do navegador esta desligada de proposito em tres camadas, porque o
   Marcos ja ouviu as duas falando juntas. Aqui, na peca avulsa, ela e o unico
   recurso que existe para se ouvir alguma coisa; e por isso que ela fica em
   ULTIMO lugar, depois de tentar a gravada.                                 */
function diz(txt){
  try{
    var k=(typeof temVoz==="function") ? temVoz(txt) : null;
    if(k && typeof tocaVoz==="function"){ tocaVoz(k); return; }
    if(!window.speechSynthesis||!window.SpeechSynthesisUtterance) return;
    var u=new SpeechSynthesisUtterance(txt);
    u.lang="pt-BR"; u.rate=.85; u.pitch=1.05;
    window.speechSynthesis.cancel();
    window.speechSynthesis.speak(u);
  }catch(e){}
}

function pecaMemoria(){
  limpa();
  ger++;
  virada=null; travado=true; feitos=0; tentativas=0;
  var t=el("div","tela");
  setProg(t,0);
  progI=t.querySelector(".prog i");
  var c=el("div","centro");
  c.appendChild(el("div","selo","MEM&Oacute;RIA DOS PARES"));
  /* ⚠️ o balao NAO muda durante a fase: o olheiro do integrador narra o balao
     toda vez que ele muda, e trocar o texto para avisar da espiada faria a voz
     falar duas coisas seguidas. O aviso da espiada vai no `.hint`.          */
  /* balão conforme o modo: par de imagens (1º ano) x palavra×significado */
  var soImg=true, temSom=false, _pi;
  for(_pi=0;_pi<PARES.length;_pi++){ if(PARES[_pi].pal||PARES[_pi].sen){ soImg=false; } if(PARES[_pi].som) temSom=true; }
  c.appendChild(el("div","balao", temSom
    ? "Ache a <b>figura</b> e o <b>som</b> que combinam."
    : (soImg
    ? "Ache as <b>figuras iguais</b>."
    : "Ache a <b>palavra</b> e o <b>desenho que combina</b>.")));

  /* monta as 8 cartas: metade palavra, metade significado.
     Cada uma leva a SUA figura — as duas do par sao desenhos diferentes. */
  cartas=[];
  var i;
  for(i=0;i<PARES.length;i++){
    cartas.push({k:PARES[i].k,tipo:"pal",txt:PARES[i].pal,
                 fig:PARES[i].fig,img:PARES[i].img,voz:PARES[i].voz||PARES[i].pal});
    /* ⭐ MEMORIA DE SONS (set/2026, EdiLIM "memoria de sonidos"; ALFABETIZACAO §6
       item 4): com `som:true` a segunda carta do par NAO tem texto nem figura — e
       um alto-falante grande; virar toca a voz (`vozsen` ou a propria palavra) e a
       crianca casa o que OUVE com o que VE. Sem `som`, tudo como sempre foi. */
    if(PARES[i].som){
      cartas.push({k:PARES[i].k,tipo:"som",txt:"",fig:"",img:"",
                   voz:PARES[i].vozsen||PARES[i].voz||PARES[i].pal});
    } else {
      cartas.push({k:PARES[i].k,tipo:"sen",txt:PARES[i].sen,
                   fig:PARES[i].figsen,img:PARES[i].imgsen,voz:PARES[i].vozsen||PARES[i].sen});
    }
  }
  baguncar(cartas);

  var mesa=el("div","m2_mcartas");
  /* QUEDA: sem 3D no navegador, a carta troca de face em vez de girar */
  if(!temTresD()) mesa.className="m2_mcartas sem3d";
  for(i=0;i<cartas.length;i++){ mesa.appendChild(fazCarta(cartas[i])); }
  c.appendChild(mesa);

  elPlacar=el("div","m2_placar","");
  c.appendChild(elPlacar);
  elPares=el("div","pares","");
  c.appendChild(elPares);
  elHint=el("div","hint","Olhe bem! As cartas v&atilde;o virar.");
  c.appendChild(elHint);
  t.appendChild(c);
  app.appendChild(t);
  atualiza();
  espiada();
}

function temTresD(){
  var s=document.body.style;
  return ("transformStyle" in s)||("webkitTransformStyle" in s)||("MozTransformStyle" in s);
}

/* ⭐ A ESPIADA. As cartas NASCEM com a classe `vira` (ver `fazCarta`), ou seja,
   a primeira pintura ja sai de cara para cima — sem animacao no meio, que e o
   que deixava o auditor de contraste fotografar uma carta girando. Depois de
   TEMPO_ESPIADA elas viram, e AI a animacao acontece na frente da crianca.
   Enquanto isso `travado` esta ligado: toque nenhum conta.                  */
function espiada(){
  var g=ger;
  setTimeout(function(){
    if(g!==ger) return;                       /* a fase ja foi trocada */
    var i;
    for(i=0;i<cartas.length;i++){
      if(cartas[i].el.className.indexOf("par")<0) cartas[i].el.className="mcarta";
    }
    travado=false;
    if(elHint) elHint.innerHTML="Toque em duas cartas. Se n&atilde;o formar par, elas voltam.";
  },TEMPO_ESPIADA);
}

/* a figura da carta: arte de IA quando a atividade a tem, senao o desenho
   embutido da peca. Nunca fica vazia — e ela o apoio de quem nao le. */
function figuraDe(o){
  var d=el("div","mfig","");
  if(o.img && typeof imgEl==="function"){ d.className="mfig mfoto"; d.appendChild(imgEl(o.img)); return d; }
  if(o.fig && ARTE[o.fig]) d.style.backgroundImage=imgSvg(o.fig);
  return d;
}

function fazCarta(o){
  /* nasce VIRADA por causa da espiada; `espiada()` a devolve para baixo.
     ⭐ tpal = carta com FOTO+palavra; tsen = carta-LEGENDA (so a frase). O tipo
     vira classe para a legenda ganhar cara de legenda de jornal (ver CSS) em
     vez de parecer "imagem faltando" (o Marcos pegou, ago/2026). */
  var d=el("div","mcarta m2_vira "+(o.tipo==="pal"?"tpal":(o.tipo==="som"?"tsom":"tsen")));
  d.setAttribute("data-qa",o.k);          /* para o auditor conferir os pares */
  /* ⭐ QUEM SABE O QUE A VOZ DEVE DIZER E A PECA (mesma licao do `ouvir-achar`):
     o motor montaria a chave a partir do texto visivel, e aqui dentro ha a
     etiqueta ("PALAVRA") junto — a conta sairia errada e a voz, muda.      */
  d.setAttribute("data-voz",o.voz);
  var f=el("div","mflip");
  var v=el("div","mface mverso");
  v.style.backgroundImage=VERSO;
  var fr=el("div","mface mfrente");
  var cnt=el("div","mcnt","");
  /* ⭐ NOME × IMAGEM (pedido do Marcos, ago/2026, Cidade dos Sólidos): o par
     pode ser a PALAVRA numa carta e a IMAGEM na outra. Entao a figura so entra
     quando a carta REALMENTE tem figura (img de IA ou desenho embutido); a
     carta so-palavra fica LIMPA, sem caixa de figura vazia (era "imagem
     faltando"). As memorias palavra×significado seguem iguais (tem os dois). */
  var temFig=(o.img && typeof imgEl==="function")||(o.fig && ARTE[o.fig]);
  if(o.tipo==="som"){
    /* a carta-SOM: um alto-falante grande no lugar de texto e figura — a
       resposta dela e o que a crianca OUVE ao virar */
    var sg=el("div","msomg",""); sg.appendChild(el("i","fone msomf",""));
    sg.appendChild(el("div","msomt","OU&#199;A"));
    cnt.appendChild(sg);
  }
  else if(temFig) cnt.appendChild(figuraDe(o));
  if(o.txt){
    var et=(o.tipo==="pal")?"PALAVRA":"QUER DIZER";
    var tx=el("div",(o.tipo==="pal")?"mtxt":"mtxt msent",
              '<i class="meti">'+et+'</i>'+o.txt);
    if(!temFig) tx.className+=" mso";   /* palavra sozinha: centra na carta */
    cnt.appendChild(tx);
  }else if(temFig){
    d.className+=" mfoto";   /* carta só-imagem: o CSS dá mais espaço à figura */
  }
  fr.appendChild(cnt);
  /* O ALTO-FALANTE: so aparece com a carta virada (CSS), e NAO joga. */
  var z=el("button","zap","");
  z.appendChild(el("i","fone",""));
  /* ⚠️ LICAO PAGA (ago/2026): sem `data-voz` o motor descobre o que falar
     LENDO a tela — e a carta tem o rotulo ("PALAVRA") coladinho no valor
     ("MALA"). O alto-falante pedia a gravacao de "PALAVRAMALA", que nunca
     existiu. A peca sabe o que quer dizer: ela tem que DECLARAR. */
  z.setAttribute("data-voz", o.voz);
  z.setAttribute("aria-label","Ouvir "+(o.txt||o.voz||""));
  z.onclick=(function(carta){ return function(ev){
    var e=ev||window.event;
    if(e.stopPropagation) e.stopPropagation(); else e.cancelBubble=true;
    sPing(); diz(carta.voz);
  }; })(o);
  fr.appendChild(z);
  f.appendChild(v); f.appendChild(fr);
  d.appendChild(f);
  o.el=d;
  d.onclick=(function(carta){ return function(){ tocar(carta); }; })(o);
  return d;
}

function atualiza(){
  var i,p;
  elPlacar.innerHTML="Pares: <b>"+feitos+"</b> de <b>"+PARES.length+"</b>";
  elPares.innerHTML="";
  for(i=0;i<PARES.length;i++){
    p=el("span","ppt");
    if(i<feitos) p.className="ppt m2_on";
    elPares.appendChild(p);
  }
  if(progI) progI.style.width=Math.round(feitos*100/PARES.length)+"%";
}

function tocar(o){
  if(travado) return;
  /* carta ja fechada: nao joga mais, mas CONTINUA FALANDO — quem nao le usa as
     cartas ja ganhas para conferir o que aprendeu. */
  if(o.el.className.indexOf("par")>=0){ sTap(); diz(o.voz); return; }
  if(virada===o) return;
  /* ⚠️ LICAO PAGA (ago/2026): aqui era `if(...vira...) return;` — carta virada
     nao se toca. So que se sobrar UMA carta de cara para cima que a peca nao
     esta mais seguindo em `virada` (qualquer descompasso entre o desenho e a
     memoria do jogo), ela vira uma carta MORTA: nunca mais aceita toque, e a
     fase nao fecha NUNCA. A crianca fica com dois quadradinhos na tela sem
     conseguir juntar o ultimo par. Foi assim que o auditor-jogador ficou preso
     com 3 de 4 pares fechados.
     Agora a carta orfa e ADOTADA: se esta virada e ninguem a segura, ela passa
     a ser a carta da vez. Nao ha estado do qual a crianca nao consiga sair.  */
  if(o.el.className.indexOf("m2_vira")>=0){
    if(!virada){ virada=o; }
    return;
  }
  o.el.className="mcarta m2_vira";
  sVira();
  diz(o.voz);                 /* ⭐ tocar a carta FALA o que esta escrito nela */
  if(!virada){ virada=o; return; }
  tentativas++;
  if(virada.k===o.k){ fechaPar(virada,o); virada=null; return; }
  /* nao formou par: as duas voltam. Erro NUNCA pune — so devolve. */
  travado=true;
  var a=virada; virada=null;
  var g=ger;
  setTimeout((function(x,y){ return function(){
    if(g!==ger) return;                       /* a fase ja foi trocada */
    if(x.el.className.indexOf("par")<0) x.el.className="mcarta";
    if(y.el.className.indexOf("par")<0) y.el.className="mcarta";
    travado=false;
    ajuda(tentativas);
  }; })(a,o),TEMPO_VOLTA);
}

function fechaPar(a,b){
  a.el.className="mcarta m2_vira par";
  b.el.className="mcarta m2_vira par";
  a.el.appendChild(el("div","vpar","&#10003;"));
  b.el.appendChild(el("div","vpar","&#10003;"));
  a.el.removeAttribute("data-qa");
  b.el.removeAttribute("data-qa");
  sPar();
  confete(20);        /* ⭐ estouro pequeno a cada par (a festa grande fica no fim) */
  /* o par acendeu, ganhou o certo e o confete: a tela RESPONDEU — marca para a
     prova de sala (senao o pulsar do ultimo par contava como 1,7 s de espera
     vazia ate o banner, set/2026). */
  if(typeof __qa==="function") __qa("tela");
  feitos++;
  atualiza();
  if(feitos===PARES.length) setTimeout(fim,800);
}

/* ⭐⭐ O ANDAIME QUE CRESCE — e que NAO DEPENDE DE LER.
   A cada PASSO_AJUDA tentativas sem par ele ajuda mais:
     1a vez — a peca FALA a palavra de um par que ainda falta (so ouvido);
     2a vez — ela ABRE uma carta e a deixa escolhida: so falta achar o par dela;
     3a vez — abre o par inteiro.
   ⚠️ o texto da dica existe para o professor e para quem ja le; o que faz o
   degrau funcionar para o 1o ano e a VOZ e a CARTA ABERTA, nunca a frase. */
function ajuda(n){
  if(n%PASSO_AJUDA!==0) return;
  var vez=n/PASSO_AJUDA, alvo=proximoPar();
  if(!alvo) return;
  /* ⚠️ LICAO PAGA (Lojinha, ago/2026): no modo SO-IMAGEM (1o ano) a carta nao
     tem `pal`/`sen` — as dicas montavam "Abri uma para voce: undefined". A
     carta tem `voz` ("1 real"): use-a como rotulo falado; e sem `pal` a frase
     nao cita rotulo nenhum. */
  var soI = !(alvo.pal || alvo.sen);
  var rot = alvo.pal || alvo.voz || "";
  var rot2 = alvo.sen || alvo.vozsen || rot;
  if(vez===1){
    if(soI){ mostraDica("Ou&ccedil;a: <b>"+rot+"</b>. Ache a <b>figura igual</b>."); }
    else   { mostraDica("Ou&ccedil;a: <b>"+rot+"</b>. Ache o desenho que combina."); }
    diz(rot);
  }else if(vez===2){
    if(soI){ mostraDica("Abri uma para voc&ecirc;. Ache a <b>figura igual</b>."); }
    else   { mostraDica("Abri uma para voc&ecirc;: <b>"+rot+"</b>. Ache o par dela."); }
    abreUma(alvo.k);
  }else{
    if(soI){ mostraDica("Vou abrir este <b>par de figuras iguais</b>."); }
    else   { mostraDica("Vou abrir este par: <b>"+rot+"</b> &mdash; "+rot2+"."); }
    abrePar(alvo.k);
  }
}
function proximoPar(){
  var i,j;
  for(i=0;i<PARES.length;i++){
    for(j=0;j<cartas.length;j++){
      if(cartas[j].k===PARES[i].k && cartas[j].el.className.indexOf("par")<0) return PARES[i];
    }
  }
  return null;
}
/* 2o degrau: abre UMA carta do par e a deixa como a carta da vez. A crianca sai
   de "dois desconhecidos" para "um alvo so" — que e o que a memoria dela
   aguenta. Reusa o estado normal do jogo (`virada`), entao nao ha caminho
   novo por onde a peca possa travar. */
function abreUma(k){
  var i,a=null;
  for(i=0;i<cartas.length;i++){
    if(cartas[i].k===k && cartas[i].el.className.indexOf("par")<0){ a=cartas[i]; break; }
  }
  if(!a) return;
  if(virada && virada!==a && virada.el.className.indexOf("par")<0) virada.el.className="mcarta";
  a.el.className="mcarta m2_vira";
  virada=a;
  sVira(); diz(a.voz);
}
function abrePar(k){
  var i,a=null,b=null;
  for(i=0;i<cartas.length;i++){ if(cartas[i].k===k){ if(!a) a=cartas[i]; else b=cartas[i]; } }
  if(!a||!b) return;
  if(virada){ if(virada.el.className.indexOf("par")<0) virada.el.className="mcarta"; virada=null; }
  fechaPar(a,b);
}

function fim(){
  mostraBanner('<div class="medal">&#9733;</div><b>Mem&oacute;ria de elefante!</b><br>Voc&ecirc; fechou os '
               +PARES.length+' pares.', pecaMemoria);
}
    if(f && f.dados) PARES = f.dados;
    try{ fimDaPeca = _seguir; }catch(_e){}
    pecaMemoria();
  })();
};

/* ==== PECA: ordenar ==== */
MEC["ordenar"] = function(f, cen, fim){
  cen.className = cen.className + " mec-ordenar";
  /* ⚠️⚠️ LICAO PAGA, e a mais silenciosa de todas: a peca da MEMORIA declara a
     PROPRIA `function fim()`. Como o corpo dela entra dentro do fechamento, esse
     `fim` SOMBREAVA o parametro da ponte — e o `mostraBanner` daqui, que devia
     levar a fase seguinte, chamava a peca de volta. Laco infinito, sem erro de
     JS nenhum: o jogador so ficava PRESO, com todos os pares ja fechados e a
     medalha da peca na tela. Por isso a continuacao mora AQUI FORA, com um nome
     que o integrador confere que nenhuma peca usa (ver `confere_contra_motor`).
     E ela so dispara UMA vez: peca que chama o banner duas vezes pularia fase. */
  var _seguir = function(){ if(_seguir.ja) return; _seguir.ja = 1; fim(); };
  /* recolhe o enunciado da fase assim que a peca puser o balao dela (ver CSS) */
  setTimeout(function(){
    var b = cen.getElementsByClassName("pecabox")[0];
    if(b && b.getElementsByClassName("balao").length)
      cen.className = cen.className + " tembalaopeca";
  }, 120);
  (function(){
    /* a peca acha que esta sozinha; estes ajudantes fazem o meio de campo */
    var app = cen;
    /* o `ac()` DESTA peca: destrava o som (o motor chama isso de `arma()`) e
       devolve o AudioContext do motor. Fica local, dentro do fechamento, para
       nao brigar com o `var ac` do motor — que e o objeto, nao a funcao. */
    function ac(){ if(typeof arma === "function") arma(); return window.ac; }
    function limpa(){ var g = cen.getElementsByClassName("pecabox")[0];
      if(g) g.innerHTML = ""; else { g = document.createElement("div");
      g.className = "pecabox"; cen.appendChild(g); } app = g; }
    /* ⚠️ LICAO PAGA: este ajudante era um VAZIO — "quem manda na barra e o
       motor". So que o caca-palavras faz `setProg(t,0)` e depois PEGA A BARRA
       DE VOLTA (`t.getElementsByTagName("i")[0]`) para mostrar quantas palavras
       ja achou. Com o vazio, ele pegava `undefined` e estourava no primeiro
       toque: 446 erros de JS numa partida. Regra: o ajudante da ponte tem que
       FAZER o que o de verdade faz — nao pode so nao atrapalhar.
       A barra da PECA e a de dentro da fase (5 palavras achadas de 8); a do
       MOTOR e a da atividade (fase 4 de 32). As duas informam coisas
       diferentes, entao as duas ficam — a de dentro, menorzinha (ver CSS). */
    function setProg(t, p){
      if(!t || !t.appendChild) return;
      var pr = document.createElement("div"); pr.className = "prog progpeca";
      var i = document.createElement("i"); i.style.width = (p || 0) + "%";
      pr.appendChild(i); t.appendChild(pr);
    }
    /* ⚠️⚠️ LICAO PAGA (ago/2026), pega pelo Marcos JOGANDO: *"esta passando de
       fase sem aquele botao azul que aparecia com a palavra proximo... tem que
       ser parecida com a atividade do Broto"*.

       Esta ponte comemorava e PULAVA para a fase seguinte sozinha, 420ms
       depois. A crianca terminava uma fase e era JOGADA na outra: sem a tela de
       parabens, sem o mascote dizendo o que ela conseguiu, sem o botao para ela
       decidir quando seguir. No Broto — que e o modelo — cada fase fecha com o
       banner e a crianca TOCA para continuar. Era o fecho de toda fase de toda
       atividade montada que estava faltando.

       Agora a ponte chama o banner DE VERDADE do motor (`window.mostraBanner`,
       que a funcao local aqui dentro sombreia) e entrega o `_seguir` como o
       botao. A peca continua so avisando que acabou; quem manda no caminho
       segue sendo o motor — mas com a comemoracao no meio. */
    function mostraBanner(msg, cb){
      if(typeof festa === "function") festa();
      /* ⚠️⚠️ LICAO PAGA (Teatro, ago/2026), o Marcos jogando: uma fase fechava
         com um "QUADRADO GRANDE desconfigurado" em vez do aviso fininho das
         outras. Causa: 7 pecas (pintar, pintar-canvas, memoria, sete-erros,
         achar-na-cena, camadas-mapa, tracar-caminho) mandam no aviso de fim
         `<div class="medal">★</div>`. No motor a `.medal` e a MEDALHA DE 190px
         do FIM da atividade (imagem do mascote), entao o motor inflava aquilo
         num quadradao verde vazio com uma estrelinha. O aviso de FASE nao leva
         medalha — o motor ja comemora com confete. Tiro a medalha do aviso de
         fase aqui (conserto central: pega as 7 de uma vez). */
      if(msg) msg = msg.replace(/<div[^>]*class=["']?[^"'>]*medal[^"'>]*["']?[^>]*>[\s\S]*?<\/div>/gi, "");
      if(typeof window.mostraBanner === "function"){
        window.mostraBanner(msg || "Muito bem!", _seguir); return;
      }
      setTimeout(_seguir, 420);
    }
    /* ⚠️⚠️ LICAO PAGA (ago/2026), e foi o Marcos quem ouviu: *"onde tenho que
       ouvir a palavra nao funciona; o enunciado funciona, os sons das opcoes
       funcionam"*. So o botao OUVIR A PALAVRA era mudo.
       A causa: a peca sozinha nao tem gravacao nenhuma, entao ela fala pela
       VOZ ROBO do navegador (`speechSynthesis`). No PC da escola essa voz
       simplesmente nao existe (nao ha voz pt-BR instalada) — e falha CALADA,
       sem erro nenhum. O enunciado e as opcoes funcionavam porque passam pelo
       motor, que toca MP3 gravado.
       Aqui a ponte reaponta o `diz` da peca para a voz da casa. A conta da
       chave ignora maiusculas (`chaveVoz` faz `toLowerCase`), entao a palavra
       "pao" acha a gravacao feita para "PAO" — a mesma que o alto-falante da
       opcao ja usa. So cai na voz do navegador se nao houver gravacao. */
    var diz = function(txt){
      try{
        /* ⚠️⚠️ LICAO PAGA (ago/2026), e foi o Marcos quem OUVIU: *"o da padaria
           agora e falado duas vezes juntos, soa estranho"*.
           Varias pecas ganharam, no mesmo dia, a boa ideia de NARRAR SOZINHAS ao
           abrir — porque na bancada, sem motor, a fase ficava muda. So que dentro
           da atividade quem narra o balao e o MOTOR, sempre narrou. As duas vozes
           partiam juntas e se atropelavam.
           A peca nao tem como saber se esta na bancada ou na atividade; quem sabe
           e a ponte. Entao e AQUI que se decide: se o texto pedido e o mesmo que o
           motor ja esta dizendo (ou acabou de dizer, na meia janela de abertura da
           fase), a peca cala — o motor ja cumpriu o pedido dela. Qualquer outra
           fala (a palavra, a silaba, a dica) passa normalmente. */
        var _limpa = function(s){ return String(s||"").replace(/<[^>]*>/g," ")
          .replace(/&[a-z]+;|&#\d+;/gi," ").replace(/\s+/g," ").trim().toLowerCase(); };
        var _agora = _limpa(txt);
        if(_agora && window.__dizMotor && window.__dizMotor === _agora) return;
        try{
          var _b = document.getElementsByClassName("balao")[0];
          if(_b && _limpa(_b.textContent) === _agora){
            window.__dizMotor = _agora;
            setTimeout(function(){ window.__dizMotor = null; }, 1200);
            return;
          }
        }catch(_e){}
        var k = (typeof temVoz === "function") ? temVoz(txt) : null;
        if(k && typeof tocaVoz === "function"){ tocaVoz(k); return; }
        if(!window.speechSynthesis || !window.SpeechSynthesisUtterance) return;
        var u = new SpeechSynthesisUtterance(txt);
        u.lang = "pt-BR"; u.rate = .9; u.pitch = 1.05;
        window.speechSynthesis.cancel(); window.speechSynthesis.speak(u);
      }catch(e){}
    };
    limpa();

/* ====== A PEÇA COMEÇA AQUI ====== */
/* ORDENAR — a crianca poe 5 fichas em ordem, do MENOR para o MAIOR.
   Conteudo neutro de proposito: numero e o mesmo em qualquer disciplina.
   Trocar `ORDEM` (e o texto do balao) ja adapta a peca a outro conteudo,
   desde que a lista continue tendo UMA ordem certa e so uma. */
/* ⭐⭐ CADA FICHA PODE SER SÓ O VALOR **OU** UMA FIGURA (ago/2026, ordem do
   Marcos: *"as dinâmicas interativas têm que ser mais VISUAIS e SONORAS para os
   pequenos"*). Os dois formatos valem, e é de propósito:

     var ORDEM=[2,5,9,14,21];                    <- como sempre foi
     var ORDEM=[{v:1, img:"xx_formiga", nome:"FORMIGA"},
                {v:2, img:"xx_gato",    nome:"GATO"}];   <- com desenho e voz
     (o `xx_` do exemplo e de proposito: citar o nome de arte de OUTRA
      atividade, mesmo dentro de um comentario, faz o portao de resto-de-clone
      acusar prefixo alheio — e ele esta certo, porque comentario viaja junto)

   · v    — o valor que manda na ORDEM (é por ele que a peça confere)
   · img  — o nome da figura (img/<img>.png). A criança do 1º ano não lê:
            ordenar bichos do menor para o maior só faz sentido VENDO o bicho
   · nome — o que está escrito embaixo e o que o alto-falante DIZ

   ⚠️ O formato antigo continua valendo palavra por palavra — as fases que já
   existem (`[2,5,9,14,21]`, `["A","B","C","D","E"]`) não mudam em nada. É por
   isso que o exemplo aqui embaixo continua sendo o dos números: peça que muda
   de formato quebra a atividade que já está no ar. */
var ORDEM=[2,5,9,14,21];
/* ⭐ O TEXTO DA PECA E CONTEUDO, NAO MOLDE (licao paga ago/2026).
   Esta peca compara por POSICAO NA LISTA (`b.num===ORDEM[vagaAtual]`), entao
   ela ja servia para letras — `ORDEM=["A","B","C"]` funciona. So que o balao
   dizia, fixo, "da menor para a maior": a crianca do 1o ano ia ler isso na fase
   do ALFABETO. Numa atividade montada o enunciado da fase fica escondido quando
   a peca poe o balao dela, entao seria essa a unica instrucao na tela — e
   estaria errada. Agora o texto vem na gaveta e acompanha o conteudo. */
/* ⚠️ E AS DICAS TAMBÉM SÃO CONTEÚDO — a mesma lição, pega de novo (ago/2026).
   O balão já tinha saído do corpo, mas os TRÊS degraus do andaime continuavam
   cravados dizendo *"procure a MENOR de todas"*. Na fase do ALFABETO
   (`ORDEM=["A","B","C","D","E"]`, que existe e está no ar) a criança erra, pede
   ajuda, e a ajuda fala de tamanho — sobre letras. Agora elas moram aqui, e
   quem troca o conteúdo troca a ajuda junto.
   ⚠️ Escrito com acento de verdade, não com `&#225;`: este texto é FALADO, e a
   gravação é feita a partir do próprio texto. Entidade HTML na fala vira uma
   chave que não existe — e o botão fica mudo. */
var ORDTXT={selo:"EM ORDEM",
            balao:"Ponha as fichas <b>da menor para a maior</b>.",
            hint:"Toque na ficha ou arraste até a fila.",
            d:["Olhe as fichas soltas e procure a <b>menor</b> de todas.",
               "A menor que sobrou está <b>piscando</b>. Toque nela.",
               "Era esta! Vamos juntos: eu coloco e você segue."],
            fim:"Fila pronta! Da menor para a maior."};
var vagaAtual=0, errosSeg=0, telaAtual=null, barraP=null;
var pecas=[], camas=[];
/* a FIGURA vem do MOTOR (`imgEl`, que sabe onde mora a pasta `img/`). Na
   bancada ela não existe e a peça escreve o nome no lugar — nunca um
   quadradinho vazio, que é pior que figura nenhuma. Pegar por `window.imgEl`
   (e não por `typeof`) deixa o nome DECLARADO: se um dia o motor trocar essa
   ferramenta de nome, o portão "função que não existe" avisa em vez de a
   figura sumir calada. */
var figEl = window.imgEl || null;

/* ---------- ler a ficha, venha ela como valor ou como objeto ---------- */
function ehObj(it){ return it!==null && typeof it==="object"; }
function valDe(it){ return ehObj(it) ? it.v : it; }
function imgDe(it){ return ehObj(it) ? (it.img||it.fig||"") : ""; }
function nomeDe(it){ return ehObj(it) ? (it.nome||"") : ""; }
/* o que a voz diz desta ficha: o nome, se a fase deu um. Número solto não vira
   voz — não há gravação para "14", e botão mudo é pior que botão nenhum. */
function vozDe(it){ return nomeDe(it); }

/* ⚠️⚠️ A VOZ É GRAVADA, SEMPRE. Quem fala é o motor: a ponte do integrador
   injeta um `diz(txt)` que toca o MP3 do Edge TTS. Aqui NUNCA se chama
   `speechSynthesis` — no PC da escola essa voz não existe e falha CALADA (o
   portão `_qa/vozrobo.py` mede isso). Sozinha na bancada a peça fica sem voz,
   e continua inteira: tudo o que a voz diz também está escrito e desenhado. */
var _vozTxt="", _vozQuando=0;
function voz(txt){
  if(!txt) return;
  var t=String(txt).replace(/<[^>]+>/g,""), agora=(new Date()).getTime();
  /* sem eco: a mesma ficha é dita ao ser PEGA e ao ser POSTA, e tocar o mesmo
     mp3 de novo o reinicia — a criança ouve a palavra picada. */
  if(t===_vozTxt && agora-_vozQuando<1000) return;
  _vozTxt=t; _vozQuando=agora;
  if(typeof diz==="function") diz(t);
}
/* a dica falada espera meio segundo: a criança acabou de ouvir o nome da ficha
   que pegou, e falar por cima corta justamente a voz que ela pediu. */
function dizDica(txt){
  var t=telaAtual;
  setTimeout(function(){ if(!t||!t.parentNode) return; voz(txt); },520);
}

/* ---------- o corpo da ficha: figura + nome + valor ---------- */
function corpoFicha(it, dentro){
  var im=imgDe(it), nm=nomeDe(it);
  if(im){
    var f=el("div","ofig");
    /* ⚠️ FIGURA QUE NÃO EXISTE NÃO VAI PARA A TELA (regra da casa): quadradinho
       vazio é pior que figura nenhuma. Na bancada, onde o motor não está, o
       lugar da figura mostra o VALOR — e nunca o nome, que já está escrito
       logo abaixo (o mesmo texto duas vezes na mesma ficha é sujeira). */
    if(figEl){ f.appendChild(figEl(im)); }
    else { f.appendChild(el("div","semfig", ""+valDe(it))); }
    dentro.appendChild(f);
    if(nm) dentro.appendChild(el("span","onom", nm));
    return;
  }
  /* ⚠️ LICAO PAGA (Teatro das Palavras, ago/2026): sem figura, a ficha e de
     TEXTO — uma CENA da historia ("Tico subiu ao palco."). Mostra o NOME, nunca
     o valor cru: com so "1/2/3" a crianca ordena os numeros sem LER as cenas, e
     o balao ja pede "coloque as cenas na ordem". So cai no valor quando nao ha
     nem figura nem nome (ordenar numerico puro, do menor para o maior). */
  if(nm){ dentro.className+=" txt"; dentro.appendChild(el("span","onom otexto", nm)); }
  else { dentro.appendChild(el("span","oval", ""+valDe(it))); }
}
/* ⚠️ o guarda do MOUSE FANTASMA: o celular dispara mousedown/click DEPOIS do
   toque. Sem esta marca de tempo a peca era acionada duas vezes (o toque
   colocava e o fantasma tentava colocar de novo). */
var ultimoToque=0, pego=null, somb=null, px0=0, py0=0, moveu=false;

function telaOrdenar(){
  limpa(); document.onkeydown=null; soltaSombra();
  vagaAtual=0; errosSeg=0; pecas=[]; camas=[];
  var t=el("div","tela"); telaAtual=t; setProg(t,0);
  barraP=t.querySelector(".prog i");
  var c=el("div","centro");
  c.appendChild(el("div","selo",ORDTXT.selo||"EM ORDEM"));
  c.appendChild(el("div","balao",ORDTXT.balao||"Ponha as fichas <b>da menor para a maior</b>."));
  var f=el("div","fila"), i, cm, b, n;
  for(i=0;i<ORDEM.length;i++){
    cm=el("div","cam","");
    cm.appendChild(el("span","vez",(i+1)+"&#186;"));
    f.appendChild(cm); camas.push(cm);
  }
  c.appendChild(f);
  var bc=el("div","banco");
  var sorteadas=baguncar(ORDEM.slice(0));
  for(i=0;i<sorteadas.length;i++){
    n=sorteadas[i];
    b=el("div","pc","");
    b.item=n;
    b.num=valDe(n);
    corpoFicha(n, b);
    poeFalante(b, n);
    ligaFicha(b);
    bc.appendChild(b); pecas.push(b);
  }
  c.appendChild(bc);
  c.appendChild(el("div","hint",ORDTXT.hint||"Toque na ficha ou arraste at&#233; a fila."));
  t.appendChild(c); app.appendChild(t);
  marcaQualServe();
  voz(ORDTXT.balao||"");
}

/* ⭐ O ALTO-FALANTE DA FICHA. Ele NÃO escolhe: só fala — sem isto, tocar no
   alto-falante para conferir o nome valia como resposta e a criança levava um
   erro por ter querido ouvir. E `data-voz` DECLARA o texto: assim o motor não
   precisa adivinhar pelo que está escrito dentro do cartão. */
function poeFalante(b, it){
  var t=vozDe(it);
  if(!t) return;
  var z=el("button","zap","");
  z.type="button";
  z.appendChild(el("i","fone",""));
  z.setAttribute("aria-label","Ouvir "+t);
  z.setAttribute("data-voz", t);
  /* ⚠️ O TOQUE NO ALTO-FALANTE NÃO PODE SUBIR até a ficha — se subir, ele vale
     como RESPOSTA e a criança que só queria conferir o nome leva um erro.
     Segurar só o `click` não basta: o `mousedown` e o `touchend` da ficha
     resolvem sozinhos (é o arrasto), e são eles que precisam ser barrados. */
  z.onmousedown=paraAqui;
  z.addEventListener("touchstart",paraAqui,false);
  z.addEventListener("touchend",function(ev){
    paraAqui(ev); ultimoToque=Date.now(); falaFicha(t);
  },false);
  z.onclick=function(ev){ paraAqui(ev); falaFicha(t); return false; };
  b.appendChild(z);
}
function paraAqui(ev){
  var e=ev||window.event;
  if(e.stopPropagation) e.stopPropagation(); else e.cancelBubble=true;
}
/* o `voz()` já engole a repetição do mesmo texto em menos de 1s, então o clique
   FANTASMA que vem depois do toque não faz a palavra tocar duas vezes. */
function falaFicha(t){ sTap(); voz(t); }

/* ---------- as TRES portas de entrada da mesma ficha ---------- */
/* ⚠️ o `touchstart` recebe uma funcao COM NOME de proposito: assim nenhum
   `preventDefault` fica perto dele. preventDefault no touchstart mata o
   toque no celular (armadilha registrada no _padrao/DINAMICAS.md). */
function ligaFicha(b){
  b.onclick=cliqueFicha;
  b.onmousedown=mouseIni;
  b.addEventListener("touchstart",toqueIni,false);
  b.addEventListener("touchmove",toqueMeio,false);
  b.addEventListener("touchend",toqueFim,false);
}
function cliqueFicha(){
  if(Date.now()-ultimoToque<700) return;   /* clique FANTASMA depois do toque */
  tocaFicha(this);
}
function mouseIni(ev){
  if(Date.now()-ultimoToque<700) return;
  pegaEm(this,ev.clientX,ev.clientY);
}
function toqueIni(ev){
  ultimoToque=Date.now();
  var to=ev.touches[0]; if(!to) return;
  pegaEm(this,to.clientX,to.clientY);
}
function toqueMeio(ev){
  if(!pego) return;
  var to=ev.touches[0]; if(!to) return;
  moveEm(to.clientX,to.clientY);
  if(moveu) ev.preventDefault();   /* so no MEIO do arrasto, nunca no comeco */
}
function toqueFim(ev){
  ultimoToque=Date.now();
  var to=ev.changedTouches[0], arrastou=moveu, alvo=this;
  if(to) soltaEm(to.clientX,to.clientY); else soltaSombra();
  if(!arrastou) tocaFicha(alvo);   /* toque simples: vale como clique */
}
function moveMouse(ev){ if(pego) moveEm(ev.clientX,ev.clientY); }
function soltaMouse(ev){ if(pego) soltaEm(ev.clientX,ev.clientY); }
document.onmousemove=moveMouse;
document.onmouseup=soltaMouse;

/* ---------- o arrasto de verdade (mouse e dedo usam o mesmo caminho) ---- */
function pegaEm(b,x,y){
  if(!b||b.className.indexOf("usada")>=0) return;
  pego=b; px0=x; py0=y; moveu=false;
  /* ⭐ PEGOU A FICHA: som na hora E O NOME DITO. No 1º ano é assim que a
     criança sabe o que tem na mão — ela escolhe pela figura e confirma pela
     voz. Sem nome (fase de números/letras) fica só o som do toque. */
  sTap(); voz(vozDe(b.item));
  b.className="pc sel";
  somb=el("div","somb","");
  corpoFicha(b.item, somb);
  somb.style.left=(x-26)+"px"; somb.style.top=(y-26)+"px";
  somb.style.display="none";
  document.body.appendChild(somb);
}
function moveEm(x,y){
  if(!pego||!somb) return;
  if(!moveu&&(Math.abs(x-px0)>8||Math.abs(y-py0)>8)){ moveu=true; somb.style.display="block"; }
  if(moveu){ somb.style.left=(x-26)+"px"; somb.style.top=(y-26)+"px"; }
}
function soltaEm(x,y){
  var b=pego, arrastou=moveu;
  soltaSombra();
  if(!b) return;
  if(b.className.indexOf("usada")<0) b.className="pc";
  if(!arrastou) return;            /* nao arrastou: quem resolve e o clique */
  if(naFila(x,y)) tocaFicha(b);
}
function soltaSombra(){
  if(somb&&somb.parentNode) somb.parentNode.removeChild(somb);
  somb=null; pego=null; moveu=false;
}
function naFila(x,y){
  var e=document.elementFromPoint(x,y), n=0;
  while(e&&n<6){
    var cl=" "+String(e.className||"")+" ";
    if(cl.indexOf(" cam ")>=0||cl.indexOf(" fila ")>=0) return true;
    e=e.parentNode; n++;
  }
  return false;
}

/* ---------- a regra da fase ---------- */
function tocaFicha(b){
  if(!b||b.className.indexOf("usada")>=0) return;
  if(vagaAtual>=ORDEM.length) return;
  if(b.num===valDe(ORDEM[vagaAtual])) poeNaFila(b); else erraFicha(b);
}
function poeNaFila(b){
  var cm=camas[vagaAtual];
  cm.className="cam ok"; cm.innerHTML="";
  corpoFicha(b.item, cm);
  b.className="pc usada";
  sCerto();
  /* a ficha assentou: o nome dela é dito de novo, agora no lugar certo — é o
     fecho sonoro do gesto (e quem não lê ouve a fila se formando). */
  voz(vozDe(b.item));
  vagaAtual++; errosSeg=0;

function baldePintar(sx,sy){ if(!_ctx)return; if(sx<0||sy<0||sx>=CW||sy>=CH)return;
  /* ⭐ rede: se a máscara ainda não foi capturada (a imagem do desenho pode
     carregar depois do 1º toque, ou o onload não veio), captura AGORA — como
     este é o 1º balde, o canvas ainda é o desenho original, então a máscara sai
     certa. Sem isto o 1º toque cairia na reserva "escuro=linha" e a repintura de
     cor viva (que soma < 360) falhava — foi o defeito do Ateliê. */
  if(!_mask) capturaMascara();
  var nc=hexRgb(_cor),W=CW,H=CH;
  var img,d;
  try{ img=_ctx.getImageData(0,0,W,H); d=img.data; }catch(e){ return; }
  var startI=sy*W+sx, si=startI*4, tr=d[si], tg=d[si+1], tb=d[si+2];
  /* barreira: a máscara do contorno; sem máscara (falha ao ler), volta ao
     antigo "escuro = linha" para nunca ficar sem comportamento. */
  function ehLinha(idx,r,g,b){ return _mask ? (_mask[idx]===1) : ((r+g+b)<360); }
  if(ehLinha(startI,tr,tg,tb)) return;                /* tocou no traço */
  if(tr===nc[0]&&tg===nc[1]&&tb===nc[2]) return;      /* ja esta dessa cor */
  /* ⚠️ VISITADOS (`seen`): sem isto, pintar com uma cor PARECIDA com a que ja
     esta na regiao (diferenca < 60) fazia os pixels se re-empurrarem para sempre
     — a pilha crescia ate bilhoes e estourava RangeError "Invalid array length"
     (o "algo deu errado" que travava o jogo). Array simples, nao Uint8Array (o
     integrador so libera os globais do motor). Cada pixel entra na pilha 1 vez. */
  var seen=[], pintou=false, stack=[startI];
  while(stack.length){ var idx=stack.pop();
    if(seen[idx]) continue; seen[idx]=1;
    var i=idx*4; var r=d[i],g=d[i+1],b=d[i+2];
    if(ehLinha(idx,r,g,b)) continue;                   /* barreira: contorno */
    if(Math.abs(r-tr)>60||Math.abs(g-tg)>60||Math.abs(b-tb)>60) continue;
    d[i]=nc[0];d[i+1]=nc[1];d[i+2]=nc[2];d[i+3]=255;pintou=true;
    var x=idx%W, y=(idx-x)/W;
    if(x+1<W&&!seen[idx+1])stack.push(idx+1); if(x-1>=0&&!seen[idx-1])stack.push(idx-1);
    if(y+1<H&&!seen[idx+W])stack.push(idx+W); if(y-1>=0&&!seen[idx-W])stack.push(idx-W);
  }
  if(pintou){ _ctx.putImageData(img,0,0); nota(600+Math.min(di,8)*40,.09,.12,"triangle",0); }
}

  capturaMascara(); }
  fala("Limpei o desenho! Pode pintar de novo."); }

     `fim` SOMBREAVA o parametro da ponte — e o `mostraBanner` daqui, que devia
     levar a fase seguinte, chamava a peca de volta. Laco infinito, sem erro de
     JS nenhum: o jogador so ficava PRESO, com todos os pares ja fechados e a
     medalha da peca na tela. Por isso a continuacao mora AQUI FORA, com um nome
     que o integrador confere que nenhuma peca usa (ver `confere_contra_motor`).
     E ela so dispara UMA vez: peca que chama o banner duas vezes pularia fase. */
  var _seguir = function(){ if(_seguir.ja) return; _seguir.ja = 1; fim(); };

  }, 120);
  (function(){

    /* o `ac()` DESTA peca: destrava o som (o motor chama isso de `arma()`) e
       devolve o AudioContext do motor. Fica local, dentro do fechamento, para
       nao brigar com o `var ac` do motor — que e o objeto, nao a funcao. */
    function ac(){ if(typeof arma === "function") arma(); return window.ac; }
    function limpa(){ var g = cen.getElementsByClassName("pecabox")[0];
      if(g) g.innerHTML = ""; else { g = document.createElement("div");
      g.className = "pecabox"; cen.appendChild(g); } app = g; }
    /* ⚠️ LICAO PAGA: este ajudante era um VAZIO — "quem manda na barra e o
       motor". So que o caca-palavras faz `setProg(t,0)` e depois PEGA A BARRA
       DE VOLTA (`t.getElementsByTagName("i")[0]`) para mostrar quantas palavras

    function setProg(t, p){
      if(!t || !t.appendChild) return;

      var i = document.createElement("i"); i.style.width = (p || 0) + "%";
      pr.appendChild(i); t.appendChild(pr);

    /* ⚠️⚠️ LICAO PAGA (ago/2026), pega pelo Marcos JOGANDO: *"esta passando de
       fase sem aquele botao azul que aparecia com a palavra proximo... tem que
       ser parecida com a atividade do Broto"*.

       Esta ponte comemorava e PULAVA para a fase seguinte sozinha, 420ms
       depois. A crianca terminava uma fase e era JOGADA na outra: sem a tela de
       parabens, sem o mascote dizendo o que ela conseguiu, sem o botao para ela

       banner e a crianca TOCA para continuar. Era o fecho de toda fase de toda

       Agora a ponte chama o banner DE VERDADE do motor (`window.mostraBanner`,
       que a funcao local aqui dentro sombreia) e entrega o `_seguir` como o
       botao. A peca continua so avisando que acabou; quem manda no caminho

    function mostraBanner(msg, cb){
      if(typeof festa === "function") festa();
      /* ⚠️⚠️ LICAO PAGA (Teatro, ago/2026), o Marcos jogando: uma fase fechava
         com um "QUADRADO GRANDE desconfigurado" em vez do aviso fininho das
         outras. Causa: 7 pecas (pintar, pintar-canvas, memoria, sete-erros,
         achar-na-cena, camadas-mapa, tracar-caminho) mandam no aviso de fim
         `<div class="medal">★</div>`. No motor a `.medal` e a MEDALHA DE 190px
         do FIM da atividade (imagem do mascote), entao o motor inflava aquilo
         num quadradao verde vazio com uma estrelinha. O aviso de FASE nao leva
         medalha — o motor ja comemora com confete. Tiro a medalha do aviso de
         fase aqui (conserto central: pega as 7 de uma vez). */
      if(msg) msg = msg.replace(/<div[^>]*class=["']?[^"'>]*medal[^"'>]*["']?[^>]*>[\s\S]*?<\/div>/gi, "");
      if(typeof window.mostraBanner === "function"){
        window.mostraBanner(msg || "Muito bem!", _seguir); return;
      }
      setTimeout(_seguir, 420);
    }
    /* ⚠️⚠️ LICAO PAGA (ago/2026), e foi o Marcos quem ouviu: *"onde tenho que
       ouvir a palavra nao funciona; o enunciado funciona, os sons das opcoes
       funcionam"*. So o botao OUVIR A PALAVRA era mudo.
       A causa: a peca sozinha nao tem gravacao nenhuma, entao ela fala pela
       VOZ ROBO do navegador (`speechSynthesis`). No PC da escola essa voz
       simplesmente nao existe (nao ha voz pt-BR instalada) — e falha CALADA,
       sem erro nenhum. O enunciado e as opcoes funcionavam porque passam pelo
       motor, que toca MP3 gravado.
       Aqui a ponte reaponta o `diz` da peca para a voz da casa. A conta da
       chave ignora maiusculas (`chaveVoz` faz `toLowerCase`), entao a palavra
       "pao" acha a gravacao feita para "PAO" — a mesma que o alto-falante da
       opcao ja usa. So cai na voz do navegador se nao houver gravacao. */
    var diz = function(txt){
      try{
        /* ⚠️⚠️ LICAO PAGA (ago/2026), e foi o Marcos quem OUVIU: *"o da padaria
           agora e falado duas vezes juntos, soa estranho"*.
           Varias pecas ganharam, no mesmo dia, a boa ideia de NARRAR SOZINHAS ao
           abrir — porque na bancada, sem motor, a fase ficava muda. So que dentro
           da atividade quem narra o balao e o MOTOR, sempre narrou. As duas vozes
           partiam juntas e se atropelavam.
           A peca nao tem como saber se esta na bancada ou na atividade; quem sabe
           e a ponte. Entao e AQUI que se decide: se o texto pedido e o mesmo que o
           motor ja esta dizendo (ou acabou de dizer, na meia janela de abertura da
           fase), a peca cala — o motor ja cumpriu o pedido dela. Qualquer outra
           fala (a palavra, a silaba, a dica) passa normalmente. */
        var _limpa = function(s){ return String(s||"").replace(/<[^>]*>/g," ")
          .replace(/&[a-z]+;|&#\d+;/gi," ").replace(/\s+/g," ").trim().toLowerCase(); };
        var _agora = _limpa(txt);
        if(_agora && window.__dizMotor && window.__dizMotor === _agora) return;
        try{
          var _b = document.getElementsByClassName("balao")[0];
          if(_b && _limpa(_b.textContent) === _agora){
            window.__dizMotor = _agora;
            setTimeout(function(){ window.__dizMotor = null; }, 1200);
            return;
          }
        }catch(_e){}
        var k = (typeof temVoz === "function") ? temVoz(txt) : null;
        if(k && typeof tocaVoz === "function"){ tocaVoz(k); return; }
        if(!window.speechSynthesis || !window.SpeechSynthesisUtterance) return;
        var u = new SpeechSynthesisUtterance(txt);
        u.lang = "pt-BR"; u.rate = .9; u.pitch = 1.05;
        window.speechSynthesis.cancel(); window.speechSynthesis.speak(u);
      }catch(e){}
    };
    limpa();

/* ---- CORTAR A FIGURA: e AQUI que a proporcao se decide ----

   a ALTURA sai da LARGURA pela mesma conta — nunca 1:1, nunca chutada.       */

  e.style.backgroundSize=(larg*COLS)+"px "+(alt*LINS)+"px";
