<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Opcoes de botao — A Padaria das Letras</title>
<!-- CARTELA DE ESCOLHA: seis acabamentos para o botao de letra/silaba, todos
     sobre o fundo real da padaria e no tamanho real (88x88). Arquivo de
     APRESENTACAO, apagado depois que o Marcos escolher. -->
<style>
*{box-sizing:border-box}
body{margin:0;font-family:"Segoe UI",Arial,sans-serif;
  background:#2b2118 url("img/pd_fundo.jpg") center/cover fixed}
.folha{max-width:412px;margin:0 auto;padding:14px 10px 24px}
.tit{background:rgba(58,48,32,.82);color:#ffe9a8;font-weight:800;font-size:15px;
  border-radius:999px;padding:7px 14px;text-align:center;margin:0 auto 14px;max-width:300px}
.grupo{background:rgba(255,253,246,.30);border-radius:20px;padding:9px 8px 12px;margin-bottom:14px}
.nome{color:#fffdf6;font-size:13px;font-weight:800;letter-spacing:.6px;text-align:center;
  text-shadow:0 1px 3px rgba(0,0,0,.55);margin-bottom:8px}
.linha{display:flex;flex-wrap:wrap;justify-content:center}
/* o botao, igual em tamanho nas seis: o que muda e so o acabamento */
.b{display:flex;flex-direction:column;align-items:center;justify-content:center;
  width:88px;height:88px;margin:0 6px;border-radius:22px;
  font-size:36px;font-weight:800;line-height:1;letter-spacing:1px;cursor:pointer;border:0}
.fone{width:27px;height:27px;margin-top:5px;border-radius:50%;
  background-repeat:no-repeat;background-position:center center;background-size:17px 17px}

/* A — FICHA DE MASSA (a que esta no ar agora) */
.a{background-image:linear-gradient(#fffaf0,#ffeac6);color:#4a3a10;
  border:2px solid #eed9ab;border-bottom:6px solid #d7ab63;
  box-shadow:0 5px 12px rgba(90,60,10,.16)}
.a .fone{background-color:#f6e0ae;
  background-image:url("data:image/svg+xml;charset=utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 20 20'%3E%3Cpath fill='%234a3a10' d='M4 7.6h3.1L11 3.9v12.2L7.1 12.4H4z'/%3E%3Cpath fill='none' stroke='%234a3a10' stroke-width='1.7' stroke-linecap='round' d='M13.3 7.1a4.2 4.2 0 0 1 0 5.8'/%3E%3C/svg%3E")}

/* B — PLAQUINHA DE MADEIRA (a madeira do balcao) */
.b2{background-image:linear-gradient(#a9723f,#8a5a2e);color:#fff3dc;
  border:2px solid #c68f56;border-bottom:6px solid #5f3c1c;
  box-shadow:0 5px 12px rgba(40,22,5,.34);text-shadow:0 2px 0 rgba(60,32,10,.55)}
.b2 .fone{background-color:rgba(255,243,220,.24);
  background-image:url("data:image/svg+xml;charset=utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 20 20'%3E%3Cpath fill='%23fff3dc' d='M4 7.6h3.1L11 3.9v12.2L7.1 12.4H4z'/%3E%3Cpath fill='none' stroke='%23fff3dc' stroke-width='1.7' stroke-linecap='round' d='M13.3 7.1a4.2 4.2 0 0 1 0 5.8'/%3E%3C/svg%3E")}

/* C — BISCOITO (dourado, com granulado) */
.c{background-image:radial-gradient(circle at 26% 24%,#f6cf8c 0 3px,rgba(0,0,0,0) 3px),
   radial-gradient(circle at 74% 34%,#f0c179 0 2.5px,rgba(0,0,0,0) 2.5px),
   radial-gradient(circle at 38% 76%,#f0c179 0 2.5px,rgba(0,0,0,0) 2.5px),
   linear-gradient(#e8b976,#d69a4f);
  color:#4a2f0d;border:0;border-bottom:6px solid #a9702f;border-radius:26px;
  box-shadow:0 5px 12px rgba(80,45,10,.30);text-shadow:0 1px 0 rgba(255,240,200,.45)}
.c .fone{background-color:rgba(74,47,13,.16);
  background-image:url("data:image/svg+xml;charset=utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 20 20'%3E%3Cpath fill='%234a2f0d' d='M4 7.6h3.1L11 3.9v12.2L7.1 12.4H4z'/%3E%3Cpath fill='none' stroke='%234a2f0d' stroke-width='1.7' stroke-linecap='round' d='M13.3 7.1a4.2 4.2 0 0 1 0 5.8'/%3E%3C/svg%3E")}

/* D — ETIQUETA DE PAPEL KRAFT (com o furinho da etiqueta) */
.d{position:relative;background-image:linear-gradient(#efdcbb,#e2caa1);color:#4a3a10;
  border:2px solid #cbae7f;border-bottom:6px solid #a98a5c;border-radius:16px;
  box-shadow:0 5px 12px rgba(80,55,15,.22);padding-top:16px}
.d:before{content:"";position:absolute;top:6px;left:50%;margin-left:-5px;width:10px;height:10px;
  border-radius:50%;background:#8f6f45;box-shadow:inset 0 1px 2px rgba(0,0,0,.5)}
.d .fone{background-color:rgba(74,58,16,.13);
  background-image:url("data:image/svg+xml;charset=utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 20 20'%3E%3Cpath fill='%234a3a10' d='M4 7.6h3.1L11 3.9v12.2L7.1 12.4H4z'/%3E%3Cpath fill='none' stroke='%234a3a10' stroke-width='1.7' stroke-linecap='round' d='M13.3 7.1a4.2 4.2 0 0 1 0 5.8'/%3E%3C/svg%3E")}

/* E — AZULEJO ESMALTADO (a parede da padaria) */
.e{background-image:linear-gradient(#fffdf6,#f3ead6);color:#3a3020;
  border:3px solid #fffdf6;border-radius:14px;
  box-shadow:0 0 0 2px #d9c8a4,0 6px 14px rgba(60,45,15,.26);
  text-shadow:0 1px 0 #fff}
.e .fone{background-color:#ecdcb8;
  background-image:url("data:image/svg+xml;charset=utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 20 20'%3E%3Cpath fill='%233a3020' d='M4 7.6h3.1L11 3.9v12.2L7.1 12.4H4z'/%3E%3Cpath fill='none' stroke='%233a3020' stroke-width='1.7' stroke-linecap='round' d='M13.3 7.1a4.2 4.2 0 0 1 0 5.8'/%3E%3C/svg%3E")}

/* F — VIDRO DA VITRINE (fosco, deixa a padaria aparecer atras) */
.f{background:rgba(255,253,246,.42);color:#33280a;
  -webkit-backdrop-filter:blur(7px);backdrop-filter:blur(7px);
  border:2px solid rgba(255,255,255,.75);border-bottom:6px solid rgba(215,171,99,.85);
  border-radius:24px;box-shadow:0 6px 16px rgba(60,45,15,.28);text-shadow:0 1px 2px rgba(255,255,255,.8)}
.f .fone{background-color:rgba(255,255,255,.55);
  background-image:url("data:image/svg+xml;charset=utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 20 20'%3E%3Cpath fill='%2333280a' d='M4 7.6h3.1L11 3.9v12.2L7.1 12.4H4z'/%3E%3Cpath fill='none' stroke='%2333280a' stroke-width='1.7' stroke-linecap='round' d='M13.3 7.1a4.2 4.2 0 0 1 0 5.8'/%3E%3C/svg%3E")}
</style></head>
<body>
<div class="folha">
  <div class="tit">SEIS ACABAMENTOS — tamanho real, fundo real</div>

  <div class="grupo"><div class="nome">A · FICHA DE MASSA (a de agora)</div>
    <div class="linha">
      <div class="b a">P<i class="fone"></i></div>
      <div class="b a">B<i class="fone"></i></div>
      <div class="b a">M<i class="fone"></i></div>
    </div></div>

  <div class="grupo"><div class="nome">B · PLAQUINHA DE MADEIRA</div>
    <div class="linha">
      <div class="b b2">P<i class="fone"></i></div>
      <div class="b b2">B<i class="fone"></i></div>
      <div class="b b2">M<i class="fone"></i></div>
    </div></div>

  <div class="grupo"><div class="nome">C · BISCOITO ASSADO</div>
    <div class="linha">
      <div class="b c">P<i class="fone"></i></div>
      <div class="b c">B<i class="fone"></i></div>
      <div class="b c">M<i class="fone"></i></div>
    </div></div>

  <div class="grupo"><div class="nome">D · ETIQUETA DE PAPEL KRAFT</div>
    <div class="linha">
      <div class="b d">P<i class="fone"></i></div>
      <div class="b d">B<i class="fone"></i></div>
      <div class="b d">M<i class="fone"></i></div>
    </div></div>

  <div class="grupo"><div class="nome">E · AZULEJO DA PAREDE</div>
    <div class="linha">
      <div class="b e">P<i class="fone"></i></div>
      <div class="b e">B<i class="fone"></i></div>
      <div class="b e">M<i class="fone"></i></div>
    </div></div>

  <div class="grupo"><div class="nome">F · VIDRO DA VITRINE (fosco)</div>
    <div class="linha">
      <div class="b f">P<i class="fone"></i></div>
      <div class="b f">B<i class="fone"></i></div>
      <div class="b f">M<i class="fone"></i></div>
    </div></div>
</div>
</body></html>
