:root{--verde:#5bbf3a;--verde-d:#3f9a26;--sol:#ffd43b;--sol-d:#eab000;--terra:#a6703c;
  --coral:#ff7a6b;--rosa:#ff8ac2;--roxo:#7d3fe0;--texto:#3a3020;--card:#fffdf6;--linha:#e6dcc6}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0}
html,body{height:100%;overflow:hidden}
body{font-family:"Fredoka",ui-rounded,"Segoe UI",system-ui,Arial,sans-serif;color:var(--texto);background:#bfe9ff;-webkit-user-select:none;user-select:none}
#bg{position:fixed;inset:0;z-index:0;background:#cdeeff center/cover no-repeat;background-image:none}
#ceu{position:fixed;inset:0;width:100%;height:100%;display:block;z-index:1;pointer-events:none}
#app{position:fixed;inset:0;z-index:2}
.tela{position:absolute;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch;display:-webkit-box;display:flex;-webkit-box-orient:vertical;-webkit-flex-direction:column;flex-direction:column;-webkit-box-align:center;align-items:center;padding:calc(40px + env(safe-area-inset-top)) 16px calc(104px + env(safe-area-inset-bottom));-webkit-animation:fade .45s;animation:fade .45s}
@-webkit-keyframes fade{from{opacity:0}to{opacity:1}}@keyframes fade{from{opacity:0}to{opacity:1}}
.balao{position:relative;max-width:430px;background:rgba(255,253,246,.95);border:0;border-radius:22px;padding:13px 18px;font-size:17px;font-weight:600;text-align:center;line-height:1.35;
  -webkit-box-shadow:0 6px 18px rgba(30,50,20,.22);box-shadow:0 6px 18px rgba(30,50,20,.22)}
.balao b{color:#2c7318}
/* ⭐ REGRA DO MOTOR — O ENUNCIADO NUNCA ENCOSTA NO QUE VEM DEPOIS.
   O Marcos cobrou isto DUAS vezes noutras atividades (*"as opcoes de resposta
   estao encostando no enunciado"* e, depois, *"esse encosto no enunciado eu ja
   tinha comentado antes"*). Aqui o portao de leiaute achou o mesmo defeito em
   10 telas x 6 tamanhos: folga ZERO. O balao tem sombra, e o vizinho colado por
   baixo entra nela e parece grudado. Regra de motor, nao conserto de fase — e a
   unica forma de o defeito nao voltar na proxima tela que alguem montar.     */
.balao + *{margin-top:13px}

/* ⭐ ALTO-FALANTE NA PERGUNTA (pedido do Marcos, ago/2026: "precisa acrescentar
   um botao de som na atividade do 2 ano onde sao as perguntas, para ajudar quem
   nao sabe ler"). No 2o ano MUITA crianca ainda nao le: a narracao toca sozinha
   uma vez, mas se ela se distrai, perdeu. O botao "Ouvir de novo" existe la
   embaixo, na barra — longe do texto e com NOME ESCRITO, que e justamente o que
   ela nao le. O lugar do botao e GRUDADO no enunciado, e ele e um desenho de
   alto-falante, nao uma palavra.                                            */
/* ⚠️ O BOTAO NAO PODE TAPAR A PERGUNTA. A primeira versao pousava no canto de
   cima do balao e cobria a ultima palavra ("Toque na RAI[z]", "Que parte da
   planta e esta[?]"). Um botao de acessibilidade que esconde justamente o texto
   que a crianca precisa e o contrario do que ele existe para fazer. Agora o
   balao ABRE ESPACO para ele (classe `comzap`) e o botao mora dentro desse
   espaco, no meio da altura.                                               */
.balao.comzap{padding-right:56px}
.zapb{position:absolute;right:9px;top:50%;margin-top:-19px;width:38px;height:38px;border-radius:50%;
  background:#ffd43b;border:3px solid #fffdf6;cursor:pointer;padding:0;
  -webkit-box-shadow:0 3px 9px rgba(60,45,15,.35);box-shadow:0 3px 9px rgba(60,45,15,.35)}
.zapb i{position:absolute;left:11px;top:13px;width:5px;height:11px;background:#4a3a10;border-radius:1px}
.zapb b{position:absolute;left:14px;top:9px;width:0;height:0;border-top:9px solid transparent;
  border-bottom:9px solid transparent;border-right:9px solid #4a3a10}
.zapb s{position:absolute;left:25px;top:12px;width:6px;height:13px;border:2px solid #4a3a10;
  border-left:0;border-top-right-radius:9px;border-bottom-right-radius:9px;text-decoration:none}
.zapb.tocando{background:#7bd44a;-webkit-animation:zpul .8s ease-in-out infinite;animation:zpul .8s ease-in-out infinite}
@-webkit-keyframes zpul{0%,100%{-webkit-transform:scale(1)}50%{-webkit-transform:scale(1.14)}}

/* ⭐ AS FIGURAS TÊM VIDA (ordem do Marcos, ago/2026: *"imagens devem ser lindas,
   sem fundo e animadas se possível"*). Duas animações, e só duas:
   · a figura ENTRA (aparece crescendo um tiquinho) — dá a sensação de que a
     tela respondeu, que é o que prende a criança pequena;
   · a figura da rodada FLUTUA devagar — sinal de "é aqui que você olha".
   ⚠️ nada de piscar, girar ou saltar: numa tela com 8 figuras isso vira
   poluição e atrapalha quem tem dificuldade de atenção.
   ⚠️ quem pediu menos movimento no sistema operacional recebe menos movimento
   (`prefers-reduced-motion`) — é acessibilidade, não enfeite.
   ⚠️ o "sem fundo" NÃO se resolve aqui: vem do RECORTE (a cartela é gerada em
   fundo preto e o `_padrao/cartela.py cortar` transforma em alfa de verdade). */
@-webkit-keyframes figentra{0%{opacity:0;-webkit-transform:scale(.86)}100%{opacity:1;-webkit-transform:scale(1)}}
@keyframes figentra{0%{opacity:0;transform:scale(.86)}100%{opacity:1;transform:scale(1)}}
@-webkit-keyframes figflutua{0%,100%{-webkit-transform:translateY(0)}50%{-webkit-transform:translateY(-5px)}}
@keyframes figflutua{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
.pecabox img{-webkit-animation:figentra .3s ease-out both;animation:figentra .3s ease-out both}
.jsFig img,.bsFig img,.oaFig img,.figrod img{
  -webkit-animation:figflutua 3.6s ease-in-out infinite;animation:figflutua 3.6s ease-in-out infinite}
@media (prefers-reduced-motion: reduce){
  .pecabox img,.jsFig img,.bsFig img,.oaFig img,.figrod img{
    -webkit-animation:none !important;animation:none !important}
}

   ⚠️ O QUE EU TINHA ERRADO: extrai do Broto a MOLDURA (capa, cracha, barra,
   banner, boletim) e deixei as FASES com o visual de cada peca, que nasceu na
   bancada — cartao branco chapado, borda fina, tudo encostado a esquerda. Por
   fora era o Broto; por dentro, nao. Todos os defeitos visuais que ele apontou
   numa noite (nome fora do quadro, letra pela metade, quadrado desalinhado,
   silaba sem cor) sao ESTE unico problema.

   Os valores abaixo NAO foram inventados: sao os do proprio `_jardim/index.html`
   — a mesma paleta, o mesmo raio, a mesma sombra, e a assinatura da casa, que e
   a BORDA DE BAIXO MAIS GROSSA (5px). E ela que da o ar de app, de peca que da
   para apertar.

   Especificidade: as regras da peca entram como `.mec-<nome> .opt` (0,2,0).
   Estas usam tres classes (0,3,0) de proposito — precisam ganhar, e sem
   `!important`, que seria pior de depurar.
   ============================================================ */
.centro .pecabox .opt,.centro .pecabox .pc,.centro .pecabox .ficha,.centro .pecabox .cx{
  background:rgba(255,253,246,.96);border:2px solid #e6dcc6;border-bottom-width:5px;
  border-radius:18px;color:#3a3020;font-weight:600;
  -webkit-box-shadow:0 5px 12px rgba(30,50,20,.16);box-shadow:0 5px 12px rgba(30,50,20,.16)}
.centro .pecabox .opt.ok,.centro .pecabox .pc.ok{border-color:#5bbf3a;background:#eafce0}
.centro .pecabox .opt.no{border-color:#ff7a6b;background:#fff0ee}

  padding:13px 18px;font-size:17px;font-weight:600;line-height:1.35;
  -webkit-box-shadow:0 6px 18px rgba(30,50,20,.22);box-shadow:0 6px 18px rgba(30,50,20,.22)}
.centro .pecabox .selo{background:#7d3fe0;color:#fff;font-size:13px;font-weight:700;
  padding:5px 12px;border-radius:999px}
.centro .pecabox .zap{width:30px;height:30px;border-radius:50%;background:rgba(58,48,32,.09);
  border:0;opacity:.62;padding:0}

  padding:6px 14px;display:inline-block;font-size:14px}

/* ⭐ O MEDALHAO: no Broto a figura da rodada e GRANDE, redonda e centrada — a
   arte e a estrela da tela, nao um selinho no canto do cartao. */
.centro .pecabox .medalhao{width:168px;height:168px;margin:12px auto 4px;border-radius:50%;
  background:rgba(255,253,246,.97);border:4px solid rgba(255,255,255,.75);padding:14px;
  display:-webkit-box;display:flex;-webkit-box-align:center;align-items:center;
  -webkit-box-pack:center;justify-content:center;
  -webkit-box-shadow:0 8px 22px rgba(30,50,20,.24);box-shadow:0 8px 22px rgba(30,50,20,.24)}

@media (max-height:620px){ .centro .pecabox .medalhao{width:124px;height:124px;padding:10px} }

/* ==== O QUE A PONTE PRECISA (vale para todas as mecanicas) ==== */
/* a barra de DENTRO da fase (quantas palavras achou, que rodada e esta) — a de
   cima, do motor, e a da atividade inteira. Duas informacoes diferentes, entao
   as duas ficam; esta e menorzinha para nao competir com a de cima.          */
.progpeca{height:6px;margin:2px 0 10px;opacity:.85}
/* ⚠️ o SELO da peca e o mesmo rotulo que o motor ja poe em cima, vindo do
   conteudo.json: duas plaquinhas iguais, uma embaixo da outra, so ocupam a tela
   da crianca. O BALAO da peca FICA — nele mora a pergunta da rodada, que muda
   dentro da fase e nao esta no enunciado.                                    */
.pecabox .selo{display:none}
/* ⚠️ LICAO PAGA, medida: com o enunciado da FASE em cima e o balao da PECA
   logo abaixo, o tabuleiro do jogo da memoria comecava tao baixo que 4 das 8
   cartas caiam fora da tela de 640px do monitor da escola. Da para rolar, mas
   memoria e um jogo de VER o tabuleiro: metade escondida acaba com a mecanica.
   E o dobro de enunciado tambem e defeito por si so — a regra da casa e uma
   ideia por tela, enunciado curto (carga cognitiva).
   Entao: quando a peca escreve o balao DELA (a pergunta da rodada), o
   enunciado da fase recolhe. Ele ja foi FALADO na abertura da fase, e o botao
   "Ouvir de novo" continua repetindo — nao se perde nada, ganha-se a tela. */
.centro.tembalaopeca > .balao{display:none}
/* ⚠️⚠️ A COLISAO DE CSS QUE DESMONTAVA O TABULEIRO. Toda peca constroi a tela
   dela com `el("div","tela")` e `el("div","centro")` — os mesmos nomes do
   motor, o que ate aqui era uma vantagem (por isso nenhuma peca precisou ser
   reescrita). So que no motor `.tela` e uma CAMADA ABSOLUTA DE TELA CHEIA
   (`position:absolute;inset:0`) em coluna. Dentro da fase, a tela da peca
   virava uma camada solta por cima de tudo, sem largura propria — e o
   tabuleiro do jogo da memoria, que devia ficar em 3 colunas, empilhava as 8
   cartas numa coluna so, 950px de altura: quatro delas fora da tela do
   monitor da escola. Medido: as 8 cartas no MESMO x.
   Aqui a tela da peca volta a ser o que ela e por dentro da fase: um bloco
   comum. O CSS proprio da peca (com `.mec-<nome>` na frente) manda no resto. */
.pecabox{width:100%}
.pecabox > .tela{position:static;inset:auto;display:block;padding:0;
  -webkit-animation:none;animation:none;height:auto;overflow:visible}
.pecabox > .tela > .centro{width:100%}

/* ⚠️ a ABERTURA era conteudo do Broto ("Oi! Eu sou o Broto, o meu jardim esta

var MEC = {};                 /* nome da mecanica -> function(f, cen, fim) */
var FASES = [];               /* escrito pelo montador */
var IFASE = 0;

/* ⚠️ a barra tem que subir na ORDEM REAL de jogo — e ela e calculada da lista,
   nunca escrita a mao. Foi numero escrito a mao que fez a barra do 3o ano andar
   PARA TRAS em duas passagens. */
function progDaFase(i){ return Math.round(4 + 96 * (i / Math.max(1, FASES.length))); }

function montaFase(i, aoFim){
  IFASE = i;
  /* ⚠️ LICAO PAGA: quatro portoes da banca (contraste, leiaute, encaixe e
     imagem quebrada) abrem CADA tela chamando a funcao dela — inclusive sem
     argumento. `montaFase()` virava `FASES[undefined]`, e a linha seguinte
     estourava lendo `.selo` de `undefined`. Quatro portoes cegos de uma vez,
     e a atividade "passava" por nao ter sido medida. Fase que nao existe leva
     ao fim, nunca a uma tela morta. */
  if(!(i >= 0) || i >= FASES.length || !FASES[i]){ telaFim(); return; }
  var f = FASES[i];
  limpa();
  var t = el("div","tela"); setProg(t, progDaFase(i));
  var cen = el("div","centro");
  if(f.selo) cen.appendChild(el("div","selo", f.selo));
  if(f.enunciado) cen.appendChild(el("div","balao", f.enunciado));
  t.appendChild(cen); app.appendChild(t);

  /* o andaime que cresce — o mesmo do Broto (ajudaJd), com a dica desta fase */
  var err = 0;
  window.ajuda = function(n, ops){
    ops = ops || {};
    if(n === 1){ if(f.dica) mostraDica(f.dica); else if(ops.dica) mostraDica(ops.dica); }
    else if(n === 2){ consolo(); if(ops.concreto) ops.concreto(); }
    else if(n >= 3){ if(ops.revelar) ops.revelar();
      /* ⚠️ LICAO PAGA: revela PRIMEIRO, escreve a dica DEPOIS — senao a fase se
         conserta sozinha e a crianca nao sabe por que (achado em 5 de 6 pecas). */
      if(ops.porque) setTimeout(function(){ mostraDica(ops.porque); }, 60); }
  };
  window.regFase = function(ok, tent){ if(f.conceito) reg(f.conceito, ok, tent); };

  montaBarra(f.dicaVoz || null, f.dica || null);
  /* ⭐⭐ A VOZ DIZ O QUE ESTA ESCRITO NA TELA — sempre.
     ⚠️ LICAO PAGA (ago/2026), e o Marcos pegou JOGANDO: *"os audios dos
     enunciados nao estao como esta escrito no enunciado"*. Na fase 1 a crianca
     LIA "Ouca a palavra e toque na figura dela" (o balao que a PECA escreve) e
     OUVIA "As etiquetas da padaria cairam!" (o enunciado da FASE, que o motor
     narrava). Duas frases diferentes ao mesmo tempo — para quem nao le, e pior
     que silencio.
     A causa era estrutural: o motor narrava `f.vozIntro` as cegas, sem olhar o
     que a peca tinha acabado de por na tela. E o esqueleto existe justamente
     para isso nao poder acontecer.

     DAQUELE texto. So cai no `vozIntro` quando a peca nao escreveu balao
     nenhum — ai o enunciado da fase e mesmo o que esta na tela. */
  if(ID.narrar !== "manual"){
    setTimeout(function(){
      var cx = document.getElementsByClassName("pecabox")[0];
      var bs = cx ? cx.getElementsByClassName("balao") : null;
      var txt = (bs && bs.length) ? (bs[0].textContent || "") : "";
      txt = txt.replace(/\s+/g, " ").replace(/^ | $/g, "");
      if(txt && typeof temVoz === "function"){
        var k = temVoz(txt);
        if(k){ falaDaTela(k); return; }
        /* sem gravacao para o que esta escrito: fica CALADO. Falar outra coisa
           foi exatamente o defeito. */
        return;
      }
      if(f.vozIntro) falar(f.vozIntro);
    }, 260);
  }

  var m = MEC[f.mec];
  if(!m){ /* mecanica que nao existe nao pode virar tela branca na mao da crianca */
    cen.appendChild(el("div","hint","(mecanica '"+f.mec+"' nao registrada)"));
    return; }
  m(f, cen, aoFim);
}

/* ============================================================

/* ==== A VOZ DA RODADA ====
   ⭐ O pilar SONORO, medido pela banca: *"16 fase(s) MUDA(S), sem nenhuma
   narracao"* e *"16 perguntas que mudam na tela sem mudar a voz — quem nao le
   aperta o alto-falante e ouve outra coisa"*.

   Por que acontecia: o motor narra o ENUNCIADO DA FASE (o do conteudo.json).
   Mas a peca troca a pergunta DENTRO da fase, a cada rodada, e essa troca o
   motor nao via. A crianca de 2o ano ouvia a instrucao da 1a rodada e, da 2a
   em diante, ficava sem instrucao nenhuma. E o botao "Ouvir de novo" repetia a

   O conserto nao e por mecanica (seriam 74): e um olheiro no balao. Toda vez
   que o texto do balao de dentro da fase muda, se existir voz gravada para

   respostas), ele fala. Como o `falas.json` sai do proprio `dados`, a voz e o
   texto nao tem COMO divergir.                                              */
(function(){
  var ultimo = "";
  function olha(){
    var box = document.getElementsByClassName("pecabox")[0];
    if(!box) { ultimo = ""; return; }
    var bs = box.getElementsByClassName("balao");

    var b = bs[0], txt = (b.textContent || "").replace(/\s+/g, " ").replace(/^ | $/g, "");
    if(!txt || txt === ultimo) return;
    ultimo = txt;
    /* ⭐ a voz de CADA RODADA e so para quem nao le (ate o 2o ano). Do 3o em
       diante a instrucao da fase ja foi narrada uma vez e o resto e por botao —

/* ==== FERRAMENTAS QUE AS PECAS USAM E O MOTOR NAO TINHA ====
   ⚠️ LICAO PAGA (achada pelo auditor-jogador, na 3a fase): o integrador so
   trazia o SEGUNDO <script> da peca (a mecanica). O PRIMEIRO — o motorzinho do
   MOLDE — ficava para tras, e com ele o `nota()` que faz o som. A peca escolher
   passou, a completar passou, e a MEMORIA morreu no primeiro som de carta
   virando. O motor tem `tom()`, mas as pecas foram afinadas com estes numeros
   (PESQUISA-SOM-E-GAMEFEEL), entao o `nota` vem junto.

   ⚠️⚠️ E A SEGUNDA METADE DA MESMA LICAO: o `ac` da peca e uma FUNCAO (destrava
   o som), e o `ac` do motor e o OBJETO AudioContext — o mesmo que alimenta o
   lip-sync do mascote. Declarar a funcao aqui NAO deu erro nenhum: o `var ac=`
   do motor simplesmente sobrescreveu, e a memoria voltou a morrer, agora com
   'ac is not a function'. Nome igual e TIPO diferente e a colisao que nao
   aparece. Solucao: `nota` usa o AudioContext do motor direto, e cada peca
   ganha o SEU `ac()` local dentro do fechamento (ver PONTE) — que destrava com
   `arma()`, o nome que o motor usa para isso, e devolve o contexto.

   Todo o resto do motorzinho (el, limpa, setProg, mostraDica, mostraBanner,
   baguncar, sCerto, sErro, sTap, festa) o motor ja tem com o MESMO nome E o
   mesmo tipo — e por isso a peca nunca precisou ser reescrita. */
function nota(f, dur, vol, tipo, atraso){
  if(typeof arma === "function") arma();
  var c = window.ac; if(!c || !c.createOscillator) return;
  try{
    var o = c.createOscillator(), g = c.createGain(), t = c.currentTime + (atraso||0);
    o.type = tipo || "triangle"; o.frequency.value = f;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol || 0.18, t + 0.014);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(c.destination); o.start(t); o.stop(t + dur + 0.02);
  }catch(e){}
}

/* ==== PECA: bater-silabas ==== */
MEC["bater-silabas"] = function(f, cen, fim){
  cen.className = cen.className + " mec-bater-silabas";

     PROPRIA `function fim()`. Como o corpo dela entra dentro do fechamento, esse
     `fim` SOMBREAVA o parametro da ponte — e o `mostraBanner` daqui, que devia
     levar a fase seguinte, chamava a peca de volta. Laco infinito, sem erro de
     JS nenhum: o jogador so ficava PRESO, com todos os pares ja fechados e a
     medalha da peca na tela. Por isso a continuacao mora AQUI FORA, com um nome
     que o integrador confere que nenhuma peca usa (ver `confere_contra_motor`).
     E ela so dispara UMA vez: peca que chama o banner duas vezes pularia fase. */
  var _seguir = function(){ if(_seguir.ja) return; _seguir.ja = 1; fim(); };
  /* recolhe o enunciado da fase assim que a peca puser o balao dela (ver CSS) */
  setTimeout(function(){
    var b = cen.getElementsByClassName("pecabox")[0];
    if(b && b.getElementsByClassName("balao").length)
      cen.className = cen.className + " tembalaopeca";
  }, 120);
  (function(){
    /* a peca acha que esta sozinha; estes ajudantes fazem o meio de campo */
    var app = cen;
    /* o `ac()` DESTA peca: destrava o som (o motor chama isso de `arma()`) e
       devolve o AudioContext do motor. Fica local, dentro do fechamento, para
       nao brigar com o `var ac` do motor — que e o objeto, nao a funcao. */
    function ac(){ if(typeof arma === "function") arma(); return window.ac; }
    function limpa(){ var g = cen.getElementsByClassName("pecabox")[0];
      if(g) g.innerHTML = ""; else { g = document.createElement("div");
      g.className = "pecabox"; cen.appendChild(g); } app = g; }
    /* ⚠️ LICAO PAGA: este ajudante era um VAZIO — "quem manda na barra e o
       motor". So que o caca-palavras faz `setProg(t,0)` e depois PEGA A BARRA
       DE VOLTA (`t.getElementsByTagName("i")[0]`) para mostrar quantas palavras
       ja achou. Com o vazio, ele pegava `undefined` e estourava no primeiro
       toque: 446 erros de JS numa partida. Regra: o ajudante da ponte tem que
       FAZER o que o de verdade faz — nao pode so nao atrapalhar.
       A barra da PECA e a de dentro da fase (5 palavras achadas de 8); a do
       MOTOR e a da atividade (fase 4 de 32). As duas informam coisas

    function setProg(t, p){

/* O CONTEÚDO É SÓ EXEMPLO (padaria, 1º ano). Ao copiar a peça para uma

   · pal — a palavra inteira (a voz diz ela por último, junta)
   · sil — as sílabas NA ORDEM: é o número delas que a criança tem que bater

var BATIDAS=[

var bat=0;       /* quantas batidas a criança já deu */
var err=0;       /* erros DESTA rodada (o andaime cresce com ele) */

/* ⚠️ A FIGURA vem do MOTOR (`imgEl`, que sabe onde mora a pasta `img/`). Aqui na
   bancada ela não existe, e a peça mostra a palavra escrita no lugar. Pegar por
   `window.imgEl` (e não `typeof imgEl`) é de propósito: assim o nome fica
   DECLARADO e o portão "função que não existe" consegue medir. */
var figEl = window.imgEl || null;

/* ⚠️ A VOZ. Dentro de uma atividade montada quem fala é o MOTOR, com o mp3 do
   Edge TTS. Se não houver gravação para aquele texto, a peça fica CALADA — voz
   de navegador nunca vai para a criança. Sozinha, na bancada, aí sim ela usa a
   voz do navegador, só para não se testar no mudo. */
function fala(txt){
  if(typeof window.temVoz==="function"){
    var k=window.temVoz(txt);
    if(k && typeof window.falaDaTela==="function") window.falaDaTela(k);
    return;
  }
  try{
    if(!window.speechSynthesis||!window.SpeechSynthesisUtterance) return;
    var u=new SpeechSynthesisUtterance(txt);
    u.lang="pt-BR"; u.rate=.85; u.pitch=1.05;
    window.speechSynthesis.cancel(); window.speechSynthesis.speak(u);
  }catch(e){}
}

function sBatida(){ nota(196,.10,.20,"sine",0); nota(660,.02,.09,"square",0); }
function sVolta(){ nota(392,.10,.10,"sine",0); nota(294,.12,.09,"sine",.07); }

function pecaBater(){
  var r=BATIDAS[ri];
  if(!r){ fimDaPeca(); return; }
  err=0; bat=0; ger++;
  limpa();
  var t=el("div","tela");
  setProg(t, Math.round(ri*100/BATIDAS.length));
  var c=el("div","centro");

  c.appendChild(el("div","balao","Diga a palavra da <b>figura</b> e bata uma vez para cada peda&#231;o."));

  var fg=el("div","bsFig");
  if(figEl){ fg.appendChild(figEl(r.fig)); }
  else { fg.appendChild(el("div","semfig", r.pal)); }
  c.appendChild(fg);

  /* a linha nasce VAZIA — quem faz as marcas é o dedo da criança */
  var bx=el("div","bsBatidas");
  bx.id="bsBx";
  bx.appendChild(el("span","bsVazio","suas batidas aparecem aqui"));
  c.appendChild(bx);

  var bt=el("button","bsBater","BATER");
  bt.type="button"; bt.id="bsBt";

  c.appendChild(bt);

  lp.onclick=function(){ zera(r); };

  pr.onclick=function(){ confere(r); };

  c.appendChild(el("div","bsTeclado",
    "Tamb&#233;m d&#225; para bater com a <b>barra de espa&#231;o</b> e responder com <b>Enter</b>."));

  t.appendChild(c); app.appendChild(t);
  marcaQA(r);
  fala("Diga a palavra da figura e bata uma vez para cada pedaço.");
}

function bate(r){
  var bx=document.getElementById("bsBx"), bt=document.getElementById("bsBt");
  if(!bx) return;
  if(bat===0) bx.innerHTML="";
  bat++;
  bx.appendChild(el("div","bsBatida",""));
  if(bt){ bt.className="bsBater bate";
    setTimeout(function(){ if(bt) bt.className="bsBater"; },200); }
  sBatida();
  marcaQA(r);
}

function zera(r){
  var bx=document.getElementById("bsBx");
  bat=0;
  if(bx){ bx.innerHTML=""; bx.appendChild(el("span","bsVazio","suas batidas aparecem aqui")); }
  sTap();
  marcaQA(r);
}

function confere(r){
  if(bat===r.sil.length){ acerta(r); return; }
  /* ⚠️ ERRO NÃO PUNE: som de RETORNO, as batidas se apagam e o andaime cresce.
     Contar errado no 1º ano é o normal — é justamente o que está em treino. */
  err++; sVolta();
  zera(r);
  ajuda(err, r);
}

function acerta(r){
  var meu=ger;
  sCerto(); festa();
  var c=app.querySelector(".centro");
  /* ⭐ AQUI A FALA É PICADA, de propósito: esta peça treina SEPARAR. Cada
     pedaço acende e é dito sozinho, no ritmo da batida — e só no fim a palavra
     volta inteira, para a criança ouvir que os pedaços eram dela o tempo todo. */
  var cx=el("div","bsSilabas"), i;
  for(i=0;i<r.sil.length;i++){
    var s=el("div","bsSil", r.sil[i]);
    s.id="bss"+i;
    cx.appendChild(s);
  }
  c.appendChild(cx);
  ritmo(r, 0, meu, function(){
    if(meu!==ger) return;
    fala(r.pal.toLowerCase());
    setTimeout(function(){
      if(meu!==ger) return;
      ri++;
      if(ri>=BATIDAS.length) fimDaPeca(); else pecaBater();
    },1200);
  });
}

/* toca o ritmo da palavra: um golpe por sílaba, com a sílaba acesa junto */
function ritmo(r, i, meu, aoFim){
  if(meu!==ger) return;
  if(i>=r.sil.length){ if(aoFim) aoFim(); return; }
  var s=document.getElementById("bss"+i);
  if(s) s.className="bsSil toca";
  sBatida();
  fala(r.sil[i]);
  setTimeout(function(){
    if(meu!==ger) return;
    if(s) s.className="bsSil";
    ritmo(r, i+1, meu, aoFim);
  },520);
}

/* o ANDAIME que cresce — e que nunca deixa a criança presa */
function ajuda(n, r){
  var d=r.d||[];
  if(n===1){ mostraDica(d[0]||"Diga a palavra devagar e bata em cada peda&#231;o."); }
  else if(n===2){
    mostraDica(d[1]||"Escute o ritmo da palavra.");
    ecoDoRitmo(r);            /* apoio pelo OUVIDO: ainda não escreve nada */
  }
  else if(n>=3){
    /* revela PRIMEIRO, escreve a dica DEPOIS — senão a fase se conserta
       sozinha e a criança não sabe por quê (lição paga em 5 de 6 peças) */
    revela(r);
    setTimeout(function(){ mostraDica(d[2]||"As batidas j&#225; est&#227;o a&#237;: toque em Pronto."); },60);
  }
}

/* 2º degrau: a peça BATE junto, em voz alta, sem escrever a resposta */
function ecoDoRitmo(r){
  var meu=ger, i;
  for(i=0;i<r.sil.length;i++){
    (function(k){
      setTimeout(function(){
        if(meu!==ger) return;
        sBatida();
        var bt=document.getElementById("bsBt");
        if(bt){ bt.className="bsBater bate";
          setTimeout(function(){ if(bt) bt.className="bsBater"; },180); }
      }, 260+k*520);
    })(i);
  }
}

/* 3º degrau: revela os pedaços E já põe as batidas — a criança só confirma */
function revela(r){
  var bx=document.getElementById("bsBx"), c=app.querySelector(".centro"), i;
  if(!bx||!c) return;
  bx.innerHTML="";
  for(i=0;i<r.sil.length;i++) bx.appendChild(el("div","bsBatida eco",""));
  bat=r.sil.length;
  if(!document.getElementById("bsRev")){
    var cx=el("div","bsSilabas"); cx.id="bsRev";
    for(i=0;i<r.sil.length;i++) cx.appendChild(el("div","bsSil", r.sil[i]));
    var m=el("span","bsMarca","estes"); cx.appendChild(m);
    c.insertBefore(cx, bx);
  }
  marcaQA(r);
}

/* ⭐ AS DUAS PORTAS (regra do Marcos, ago/2026): no PC da escola tem teclado de
   verdade, e a criança vai usar. Espaço = bater; Enter = Pronto; Backspace =
   apagar. O toque continua sendo o caminho principal — isto é um caminho A
   MAIS, nunca o único. */
document.onkeydown=function(e){
  var r=BATIDAS[ri];
  if(!r||!document.getElementById("bsBt")) return;
  var k=e.keyCode||e.which;
  if(k===32){ bate(r); if(e.preventDefault) e.preventDefault(); }
  else if(k===13){ confere(r); if(e.preventDefault) e.preventDefault(); }
  else if(k===8){ zera(r); if(e.preventDefault) e.preventDefault(); }
};

/* `data-qa` diz ao auditor-jogador o que serve AGORA: bater enquanto faltam
   batidas, Pronto quando a conta fecha. Só para ele — a criança nunca vê. */
function marcaQA(r){
  var bt=document.getElementById("bsBt"), pr=document.getElementById("bsPr");
  var falta = bat < r.sil.length;
  if(bt) bt.setAttribute("data-qa", falta ? "1" : "0");
  if(pr) pr.setAttribute("data-qa", falta ? "0" : "1");
}

MEC["classificar"] = function(f, cen, fim){
  cen.className = cen.className + " mec-classificar";
  /* ⚠️⚠️ LICAO PAGA, e a mais silenciosa de todas: a peca da MEMORIA declara a

     `fim` SOMBREAVA o parametro da ponte — e o `mostraBanner` daqui, que devia
     levar a fase seguinte, chamava a peca de volta. Laco infinito, sem erro de
     JS nenhum: o jogador so ficava PRESO, com todos os pares ja fechados e a
     medalha da peca na tela. Por isso a continuacao mora AQUI FORA, com um nome
     que o integrador confere que nenhuma peca usa (ver `confere_contra_motor`).
     E ela so dispara UMA vez: peca que chama o banner duas vezes pularia fase. */
  var _seguir = function(){ if(_seguir.ja) return; _seguir.ja = 1; fim(); };

       devolve o AudioContext do motor. Fica local, dentro do fechamento, para
       nao brigar com o `var ac` do motor — que e o objeto, nao a funcao. */
    function ac(){ if(typeof arma === "function") arma(); return window.ac; }
    function limpa(){ var g = cen.getElementsByClassName("pecabox")[0];
      if(g) g.innerHTML = ""; else { g = document.createElement("div");
      g.className = "pecabox"; cen.appendChild(g); } app = g; }
    /* ⚠️ LICAO PAGA: este ajudante era um VAZIO — "quem manda na barra e o

       DE VOLTA (`t.getElementsByTagName("i")[0]`) para mostrar quantas palavras
       ja achou. Com o vazio, ele pegava `undefined` e estourava no primeiro
       toque: 446 erros de JS numa partida. Regra: o ajudante da ponte tem que
       FAZER o que o de verdade faz — nao pode so nao atrapalhar.
       A barra da PECA e a de dentro da fase (5 palavras achadas de 8); a do
       MOTOR e a da atividade (fase 4 de 32). As duas informam coisas
       diferentes, entao as duas ficam — a de dentro, menorzinha (ver CSS). */
    function setProg(t, p){
      if(!t || !t.appendChild) return;
      var pr = document.createElement("div"); pr.className = "prog progpeca";
      var i = document.createElement("i"); i.style.width = (p || 0) + "%";
      pr.appendChild(i); t.appendChild(pr);

    /* ⚠️⚠️ LICAO PAGA (ago/2026), pega pelo Marcos JOGANDO: *"esta passando de
       fase sem aquele botao azul que aparecia com a palavra proximo... tem que
       ser parecida com a atividade do Broto"*.

       Esta ponte comemorava e PULAVA para a fase seguinte sozinha, 420ms
       depois. A crianca terminava uma fase e era JOGADA na outra: sem a tela de
       parabens, sem o mascote dizendo o que ela conseguiu, sem o botao para ela
       decidir quando seguir. No Broto — que e o modelo — cada fase fecha com o
       banner e a crianca TOCA para continuar. Era o fecho de toda fase de toda
       atividade montada que estava faltando.

       Agora a ponte chama o banner DE VERDADE do motor (`window.mostraBanner`,
       que a funcao local aqui dentro sombreia) e entrega o `_seguir` como o
       botao. A peca continua so avisando que acabou; quem manda no caminho
       segue sendo o motor — mas com a comemoracao no meio. */
    function mostraBanner(msg, cb){
      if(typeof festa === "function") festa();
      if(typeof window.mostraBanner === "function"){
        window.mostraBanner(msg || "Muito bem!", _seguir); return;
      }
      setTimeout(_seguir, 420);

/* ====== A PEÇA COMEÇA AQUI ====== */

/* O CONTEÚDO É SÓ EXEMPLO (partes da planta, 8 anos). Ao copiar a peça para
   uma atividade, troque APENAS este bloco: as gavetas, as fichas e as três
   dicas (dica -> apoio concreto -> revela). Duas ou três gavetas; mais que
   isso a criança não segura na cabeça de uma vez.                          */
var GAVETAS=[
  {k:"raiz",  n:"A RAIZ<br>(embaixo da terra)"},
  {k:"folha", n:"A FOLHA<br>(no ar, verde)"}
];
var FICHAS=[
  {t:"BEBE A ÁGUA",     alvo:"raiz"},
  {t:"SEGURA A PLANTA", alvo:"raiz"},
  {t:"PEGA O SOL",      alvo:"folha"},
  {t:"FAZ O ALIMENTO",  alvo:"folha"}
];
var DICAS=[
  "Pense onde essa coisa acontece: debaixo do chão ou no ar?",
  "A RAIZ fica na terra: ela puxa a água e segura a planta. A FOLHA fica no ar: ela recebe o sol e faz o alimento.",
  "Olhe a gaveta que está com a borda amarela: é ali que esta ficha mora."
];

var feitos=0;          /* fichas ja guardadas */
var marcada=null;      /* a ficha escolhida pelo toque simples */
var barraP=null;       /* a barrinha de progresso, para andar sem refazer a tela */
var ger=0;             /* geracao da tela: mata setTimeout de fase que ja saiu */

/* ⭐ O GUARDA DO MOUSE FANTASMA. O celular dispara mousedown/mousemove/mouseup
   FALSOS logo depois do toque; sem este carimbo eles desmarcavam a ficha que a
   criança tinha acabado de escolher. Defeito pego DUAS vezes pelo Marcos.  */
var ultimoToque=0;
var pegou=null, fantasma=null, x0=0, y0=0, arrastando=false, fimArrasto=0;

function agora(){ return (new Date()).getTime(); }
function souDedo(){ return agora()-ultimoToque<800; }
function cliqueDeArrasto(){ return agora()-fimArrasto<350; }

function pecaClassificar(){
  feitos=0; marcada=null; pegou=null; arrastando=false; ger++;
  limpa();
  var t=el("div","tela");
  setProg(t,0);
  barraP=t.querySelector(".prog i");
  var c=el("div","centro");
  c.appendChild(el("div","selo","ONDE CADA UMA MORA?"));
  c.appendChild(el("div","balao","Cada ficha conta uma <b>tarefa</b> da planta. Guarde a ficha na parte que faz essa tarefa."));

  var band=el("div","bandeja"), i;
  var ordem=[];
  for(i=0;i<FICHAS.length;i++) ordem.push(FICHAS[i]);
  baguncar(ordem);
  for(i=0;i<ordem.length;i++) band.appendChild(fazFicha(ordem[i]));
  c.appendChild(band);

  var gs=el("div","gavs");
  for(i=0;i<GAVETAS.length;i++) gs.appendChild(fazGaveta(GAVETAS[i]));
  c.appendChild(gs);

  c.appendChild(el("div","hint","Toque na ficha e depois na gaveta. Também dá para arrastar com o dedo ou com o mouse."));
  t.appendChild(c);

}

function fazFicha(f){
  var p=el("div","pc",f.t);
  /* ficha e gaveta publicam a MESMA chave: e assim que o auditor-jogador
     consegue terminar a fase (e so ele olha para isto). */
  p.setAttribute("data-qa",f.alvo);
  p.onclick=function(){
    if(cliqueDeArrasto()) return;          /* este clique e o rabo do arrasto */
    if(p.className.indexOf("usada")>=0) return;
    sTap(); seleciona(p);
  };
  p.onmousedown=function(ev){
    if(souDedo()) return;                  /* mouse FANTASMA do celular: ignora */
    comeca(p,ev.clientX,ev.clientY);
  };
  p.addEventListener("touchstart",function(ev){
    ultimoToque=agora();
    var d=ev.touches[0];
    comeca(p,d.clientX,d.clientY);
  },false);
  return p;
}

/* ⚠️ NUNCA `preventDefault` no touchstart acima — mata o toque no celular.
   Ele mora no touchmove, la embaixo, e so enquanto ha ficha na mao.        */
function comeca(p,x,y){
  if(p.className.indexOf("usada")>=0) return;
  pegou=p; x0=x; y0=y; arrastando=false;
  seleciona(p);
}

function move(x,y){
  if(!pegou) return;
  if(!arrastando){
    if(Math.abs(x-x0)+Math.abs(y-y0)<10) return;
    arrastando=true;
    fantasma=el("div","fant",pegou.innerHTML);
    document.body.appendChild(fantasma);
  }
  fantasma.style.left=(x-52)+"px";
  fantasma.style.top=(y-24)+"px";
}

function solta(x,y){
  if(!pegou) return;
  var p=pegou; pegou=null;
  if(fantasma&&fantasma.parentNode){ fantasma.parentNode.removeChild(fantasma); }
  fantasma=null;
  if(!arrastando) return;                  /* foi so um toque: a selecao ja valeu */
  arrastando=false; fimArrasto=agora();
  var alvo=document.elementFromPoint(x,y);
  while(alvo&&alvo.nodeType===1&&String(alvo.className).indexOf("cam")<0) alvo=alvo.parentNode;

MEC["juntar-silabas"] = function(f, cen, fim){
  cen.className = cen.className + " mec-juntar-silabas";
  /* ⚠️⚠️ LICAO PAGA, e a mais silenciosa de todas: a peca da MEMORIA declara a
     PROPRIA `function fim()`. Como o corpo dela entra dentro do fechamento, esse
     `fim` SOMBREAVA o parametro da ponte — e o `mostraBanner` daqui, que devia
     levar a fase seguinte, chamava a peca de volta. Laco infinito, sem erro de
     JS nenhum: o jogador so ficava PRESO, com todos os pares ja fechados e a
     medalha da peca na tela. Por isso a continuacao mora AQUI FORA, com um nome
     que o integrador confere que nenhuma peca usa (ver `confere_contra_motor`).
     E ela so dispara UMA vez: peca que chama o banner duas vezes pularia fase. */
  var _seguir = function(){ if(_seguir.ja) return; _seguir.ja = 1; fim(); };
  /* recolhe o enunciado da fase assim que a peca puser o balao dela (ver CSS) */
  setTimeout(function(){
    var b = cen.getElementsByClassName("pecabox")[0];
    if(b && b.getElementsByClassName("balao").length)
      cen.className = cen.className + " tembalaopeca";
  }, 120);
  (function(){
    /* a peca acha que esta sozinha; estes ajudantes fazem o meio de campo */
    var app = cen;
    /* o `ac()` DESTA peca: destrava o som (o motor chama isso de `arma()`) e
       devolve o AudioContext do motor. Fica local, dentro do fechamento, para
       nao brigar com o `var ac` do motor — que e o objeto, nao a funcao. */
    function ac(){ if(typeof arma === "function") arma(); return window.ac; }
    function limpa(){ var g = cen.getElementsByClassName("pecabox")[0];
      if(g) g.innerHTML = ""; else { g = document.createElement("div");
      g.className = "pecabox"; cen.appendChild(g); } app = g; }
    /* ⚠️ LICAO PAGA: este ajudante era um VAZIO — "quem manda na barra e o
       motor". So que o caca-palavras faz `setProg(t,0)` e depois PEGA A BARRA
       DE VOLTA (`t.getElementsByTagName("i")[0]`) para mostrar quantas palavras
       ja achou. Com o vazio, ele pegava `undefined` e estourava no primeiro
       toque: 446 erros de JS numa partida. Regra: o ajudante da ponte tem que
       FAZER o que o de verdade faz — nao pode so nao atrapalhar.
       A barra da PECA e a de dentro da fase (5 palavras achadas de 8); a do
       MOTOR e a da atividade (fase 4 de 32). As duas informam coisas
       diferentes, entao as duas ficam — a de dentro, menorzinha (ver CSS). */
    function setProg(t, p){
      if(!t || !t.appendChild) return;
      var pr = document.createElement("div"); pr.className = "prog progpeca";
      var i = document.createElement("i"); i.style.width = (p || 0) + "%";
      pr.appendChild(i); t.appendChild(pr);
    }
    /* ⚠️⚠️ LICAO PAGA (ago/2026), pega pelo Marcos JOGANDO: *"esta passando de
       fase sem aquele botao azul que aparecia com a palavra proximo... tem que
       ser parecida com a atividade do Broto"*.

       Esta ponte comemorava e PULAVA para a fase seguinte sozinha, 420ms
       depois. A crianca terminava uma fase e era JOGADA na outra: sem a tela de
       parabens, sem o mascote dizendo o que ela conseguiu, sem o botao para ela
       decidir quando seguir. No Broto — que e o modelo — cada fase fecha com o
       banner e a crianca TOCA para continuar. Era o fecho de toda fase de toda
       atividade montada que estava faltando.

       segue sendo o motor — mas com a comemoracao no meio. */
    function mostraBanner(msg, cb){
      if(typeof festa === "function") festa();
      if(typeof window.mostraBanner === "function"){
        window.mostraBanner(msg || "Muito bem!", _seguir); return;
      }
      setTimeout(_seguir, 420);
    }
    limpa();

/* ====== A PEÇA COMEÇA AQUI ====== */

/* O CONTEÚDO É SÓ EXEMPLO (padaria, 1º ano). Ao copiar a peça para uma
   atividade, troque APENAS este bloco de dados.
   · pal   — a palavra inteira (é ela que a voz diz de UMA VEZ no fim)
   · sil   — as sílabas NA ORDEM certa
   · fig   — o nome da figura (img/<fig>.png). A criança não lê: é a figura
             que diz qual palavra montar
   · iscas — sílabas erradas que entram na bandeja junto (2 bastam no 1º ano)
   · d     — os TRÊS degraus do andaime: dica -> apoio concreto -> revela   */
var SILABAS=[
 {pal:"BOLO", sil:["BO","LO"], fig:"pd_bolo", iscas:["MA","PE"],
  d:["Diga a palavra devagar: qual pedaço a boca fala PRIMEIRO?",
     "A palavra começa com o som <b>BO</b>. Ele está pulsando aí embaixo.",
     "É o <b>BO</b>. Ele está aceso: toque nele para seguir."]},
 {pal:"MALA", sil:["MA","LA"], fig:"pd_mala", iscas:["BO","TE"],
  d:["Fale a palavra bem devagar e escute o começo.",
     "O primeiro pedaço é <b>MA</b>, como em MÃE.",
     "É o <b>MA</b>. Ele está aceso: toque nele para seguir."]},
 {pal:"PATO", sil:["PA","TO"], fig:"pd_pato", iscas:["LO","SA"],
  d:["Ponha a mão no queixo e diga: PA-TO. Qual vem primeiro?",
     "O primeiro pedaço é <b>PA</b>, o mesmo de PAI.",
     "É o <b>PA</b>. Ele está aceso: toque nele para seguir."]},
 {pal:"SAPATO", sil:["SA","PA","TO"], fig:"pd_sapato", iscas:["MA","LO"],
  d:["Esta tem TRÊS pedaços. Diga devagar: SA-PA-TO.",
     "Comece pelo <b>SA</b>, que é o som que abre a palavra.",
     "É o <b>SA</b>. Ele está aceso: toque nele para seguir."]}
];

var ri=0;        /* rodada de agora */
var posto=0;     /* quantas sílabas já estão na forma */
var err=0;       /* erros DESTA rodada (o andaime cresce com ele) */
var ger=0;       /* geração da tela: mata setTimeout de rodada que já saiu */

/* ⚠️ A FIGURA vem do MOTOR (`imgEl`, que sabe onde mora a pasta `img/`). Aqui na
   bancada ela não existe, e a peça mostra a palavra escrita no lugar. Pegar por
   `window.imgEl` (e não `typeof imgEl`) é de propósito: assim o nome fica
   DECLARADO, o portão "função que não existe" consegue medir, e um dia que o
   motor trocar o nome dessa ferramenta a peça avisa em vez de sumir a figura. */
var figEl = window.imgEl || null;

/* ⚠️ A VOZ. Dentro de uma atividade montada quem fala é o motor (mp3 do Edge
   TTS, a voz de verdade). Sozinha, na bancada, a peça usa a voz do navegador só
   para não ficar muda. Nunca o contrário: voz de navegador não vai para a
   criança. */
function fala(txt, id){
  if(typeof window.falar==="function" && id){ window.falar(id); return; }
  try{
    if(!window.speechSynthesis||!window.SpeechSynthesisUtterance) return;
    var u=new SpeechSynthesisUtterance(txt);
    u.lang="pt-BR"; u.rate=.85; u.pitch=1.05;
    window.speechSynthesis.cancel(); window.speechSynthesis.speak(u);
  }catch(e){}
}
function sDesliza(){ nota(520,.09,.10,"triangle",0); nota(700,.10,.10,"triangle",.06); }
function sVolta(){ nota(392,.10,.10,"sine",0); nota(294,.12,.09,"sine",.07); }

function pecaJuntar(){
  var r=SILABAS[ri];
  if(!r){ fimDaPeca(); return; }
  err=0; posto=0; ger++;
  limpa();
  var t=el("div","tela");
  setProg(t, Math.round(ri*100/SILABAS.length));
  var c=el("div","centro");
  c.appendChild(el("div","selo","JUNTE OS PEDA&#199;OS"));
  c.appendChild(el("div","balao","Junte os peda&#231;os e forme a palavra da <b>figura</b>."));

  /* a FIGURA diz qual palavra é — a criança de 6 anos não lê */
  var fg=el("div","jsFig");
  if(figEl){ fg.appendChild(figEl(r.fig)); }
  else { fg.appendChild(el("div","semfig", r.pal)); }
  c.appendChild(fg);

  /* a FORMA: um lugar por sílaba */
  var forma=el("div","jsForma"), i;
  for(i=0;i<r.sil.length;i++){
    var v=el("div","jsVaga"+(i===0?" agora":""));
    v.id="jsv"+i;
    forma.appendChild(v);
  }
  c.appendChild(forma);

  /* a BANDEJA: as sílabas certas + as iscas, SEMPRE embaralhadas.
     ⚠️ embaralhar é a armadilha número um desta família: sem isso a criança
     aprende a POSIÇÃO e não o som. */
  var lista=[], z;
  for(z=0;z<r.sil.length;z++) lista.push({s:r.sil[z], ok:1});
  for(z=0;z<(r.iscas||[]).length;z++) lista.push({s:r.iscas[z], ok:0});
  baguncar(lista);
  var band=el("div","jsMassa");
  for(z=0;z<lista.length;z++) band.appendChild(fazSilaba(lista[z], r));
  c.appendChild(band);

  c.appendChild(el("div","hint","Toque no peda&#231;o certo. Ele escorrega at&#233; a forma."));
  t.appendChild(c); app.appendChild(t);
  marcaQA(r);
  fala("Junte os pedaços e forme a palavra da figura.", null);
}

function fazSilaba(item, r){
  var b=el("button","jsSil", item.s);
  b.type="button";
  b._sil=item.s;
  /* ⭐ AS TRÊS PORTAS (ordem do Marcos, ago/2026: *"nas atividades de clicar,
     quando for possível, pode ser de arrastar também"*). Aqui o arrastar não é
     só uma porta a mais: ARRASTAR **É** O DESLIZE que a pesquisa pede — a
     criança faz com a mão o que o conceito diz (duas partes que correm uma até
     a outra e viram uma só). Toque, clique e arrasto, os três.
     ⚠️ o guarda do MOUSE FANTASMA: no celular o navegador dispara eventos de
     mouse DEPOIS do toque, e sem este guarda eles desfaziam o gesto. Defeito já
     pego duas vezes na casa. */
  arrastavel(b, r);
  b.onclick=function(){
    if(b._ultimoToque && (new Date()).getTime()-b._ultimoToque<700) return;
    if(b.className.indexOf("usada")>=0) return;
    var esperada=r.sil[posto];
    if(item.s===esperada && b.className.indexOf("usada")<0){
      deslizaAte(b, document.getElementById("jsv"+posto), r);
    } else {
      /* ⚠️ ERRO NÃO PUNE: a peça devolve o pedaço com som de RETORNO, nunca de
         tropeço. O gesto está em treino, e no 1º ano errar a ordem é o normal. */
      err++; sVolta();
      b.className="jsSil";
      ajuda(err, r);
    }
  };
  return b;
}

/* o ARRASTO: mouse e dedo. Solta em cima da forma = a mesma coisa que tocar. */
function arrastavel(b, r){
  var mx=0,my=0,arr=false;
  function comeca(x,y,ev){
    if(b.className.indexOf("usada")>=0) return;
    arr=true; mx=x; my=y;
    b.style.zIndex="30"; b.style.position="relative";
    if(ev&&ev.type==="mousedown"&&ev.preventDefault) ev.preventDefault();
  }
  function move(x,y){
    if(!arr) return;
    b.style.webkitTransform="translate("+(x-mx)+"px,"+(y-my)+"px)";
    b.style.transform="translate("+(x-mx)+"px,"+(y-my)+"px)";
  }
  function solta(x,y){
    if(!arr) return;
    arr=false;
    b.style.webkitTransform=""; b.style.transform=""; b.style.zIndex="";
    var v=document.getElementById("jsv"+posto);
    if(v){
      var q=v.getBoundingClientRect();
      /* margem generosa: dedo de 6 anos nao acerta o pixel */
      if(x>q.left-30&&x<q.right+30&&y>q.top-30&&y<q.bottom+30){ b.onclick(); return; }
    }
    sVolta();
  }
  b.onmousedown=function(e){ comeca(e.clientX,e.clientY,e); };
  b.onmousemove=function(e){ move(e.clientX,e.clientY); };
  b.onmouseup  =function(e){ solta(e.clientX,e.clientY); };
  b.onmouseleave=function(e){ if(arr) solta(e.clientX,e.clientY); };
  /* ⚠️ NUNCA `preventDefault` no touchstart: mata o toque simples. */
  b.addEventListener("touchstart",function(e){
    var t=e.touches[0]; b._ultimoToque=(new Date()).getTime(); comeca(t.clientX,t.clientY,null);
  },false);
  b.addEventListener("touchmove",function(e){
    var t=e.touches[0]; move(t.clientX,t.clientY);
    if(arr&&e.preventDefault) e.preventDefault();
  },false);
  b.addEventListener("touchend",function(e){
    var t=(e.changedTouches&&e.changedTouches[0])||{clientX:0,clientY:0};
    b._ultimoToque=(new Date()).getTime();
    var q=document.getElementById("jsv"+posto);
    /* soltou longe da forma? entao foi TOQUE simples, e toque simples tambem vale */
    if(q){ var g=q.getBoundingClientRect();
      if(!(t.clientX>g.left-30&&t.clientX<g.right+30&&t.clientY>g.top-30&&t.clientY<g.bottom+30)){
        arr=false; b.style.webkitTransform=""; b.style.transform="";
        b.onclick(); return; } }
    solta(t.clientX,t.clientY);
  },false);
}

/* ⭐ O DESLIZE — o coração da peça (Reading Rockets: "have the sounds slide
   together to form a word"). A sílaba corre da bandeja até o lugar dela, e só
   depois de chegar é que ela vira parte da palavra. */
function deslizaAte(b, vaga, r){
  var meu=ger;
  var a=b.getBoundingClientRect(), v=vaga.getBoundingClientRect();
  b.style.setProperty("--dx",(v.left-a.left+(v.width-a.width)/2)+"px");
  b.style.setProperty("--dy",(v.top-a.top+(v.height-a.height)/2)+"px");
  b.className="jsSil desliza";
  sDesliza();
  fala(b._sil, null);
  setTimeout(function(){
    if(meu!==ger) return;
    b.className="jsSil usada";
    vaga.innerHTML=b._sil;
    vaga.className="jsVaga cheia";
    posto++;
    var prox=document.getElementById("jsv"+posto);
    if(prox) prox.className="jsVaga agora";
    marcaQA(r);
    if(posto>=r.sil.length) fechaPalavra(r);
  },380);
}

function fechaPalavra(r){
  var meu=ger;
  sCerto(); festa();
  var c=app.querySelector(".centro");
  var p=el("div","jsPronta", r.pal);
  c.appendChild(p);
  /* ⭐⭐ O SOM CONTÍNUO. A pesquisa é explícita: "Connected Phonation Is More
     Effective than Segmented Phonation". A palavra fecha dita de UMA VEZ —
     nunca "BO... LO". É aqui que a criança ouve que dois pedaços viraram um. */
  fala(r.pal.toLowerCase(), null);
  setTimeout(function(){
    if(meu!==ger) return;
    ri++;
    if(ri>=SILABAS.length) fimDaPeca(); else pecaJuntar();
  },1400);
}

/* o ANDAIME que cresce — e que nunca deixa a criança presa */
function ajuda(n, r){
  var d=r.d||[];
  if(n===1){ mostraDica(d[0]||"Diga a palavra devagar."); }
  else if(n===2){ mostraDica(d[1]||"Escute o come&#231;o da palavra.");
    pisca(r, false); }
  else if(n>=3){
    /* revela PRIMEIRO, escreve a dica DEPOIS — senão a fase se conserta
       sozinha e a criança não sabe por quê (lição paga em 5 de 6 peças) */
    pisca(r, true);
    setTimeout(function(){ mostraDica(d[2]||"Toque no peda&#231;o aceso."); },60);
  }
}
function pisca(r, acende){
  var bs=app.getElementsByClassName("jsSil"), i, alvo=r.sil[posto];
  for(i=0;i<bs.length;i++){
    if(bs[i].className.indexOf("usada")>=0) continue;
    if(bs[i]._sil===alvo){
      bs[i].className="jsSil "+(acende?"acesa pulsa":"pulsa");
      if(acende && bs[i].getElementsByClassName("jsMarca").length===0){
        var m=el("span","jsMarca","este"); bs[i].appendChild(m);
      }
    }
  }
}

/* `data-qa="1"` na sílaba que serve AGORA: é assim que o auditor-jogador
   atravessa a peça. Só para ele — a criança nunca vê isto. */
function marcaQA(r){
  var bs=app.getElementsByClassName("jsSil"), i, alvo=r.sil[posto];
  for(i=0;i<bs.length;i++)
    bs[i].setAttribute("data-qa",
      (bs[i].className.indexOf("usada")<0 && bs[i]._sil===alvo) ? "1" : "0");
}

function fimDaPeca(){
  limpa();
  var t=el("div","tela"); setProg(t,100);
  var c=el("div","centro");
  c.appendChild(el("div","medal",""));
  c.appendChild(el("div","balao","Voc&#234; juntou <b>"+SILABAS.length+" palavras</b>! Cada uma feita de peda&#231;os."));
  t.appendChild(c); app.appendChild(t);
  mostraBanner("<b>Padeiro de palavras!</b><br>Voc&#234; juntou os peda&#231;os.", pecaJuntar);
}
    if(f && f.dados) SILABAS = f.dados;
    pecaJuntar();
  })();
};

       botao. A peca continua so avisando que acabou; quem manda no caminho
       segue sendo o motor — mas com a comemoracao no meio. */
    function mostraBanner(msg, cb){
      if(typeof festa === "function") festa();
      if(typeof window.mostraBanner === "function"){
        window.mostraBanner(msg || "Muito bem!", _seguir); return;

/* AS FIGURAS. `pts` sao os pontinhos em PORCENTAGEM da folha (nunca em px:
   assim a folha encolhe junto com a tela e o desenho continua inteiro).
   `d` e o contorno que ACENDE no fim, e `extra` sao os detalhes que aparecem
   junto com ela (o olho, a porta) — nada disso e tocavel.
   ⚠️ A ESCADA: a 1a figura tem 5 pontos (a criança conta até 5 sem apoio); a
   2a tem 8 e os números ficam espalhados de verdade, sem seguir o relógio —
   é aí que ela precisa PROCURAR o símbolo, não só continuar o movimento.
   ⚠️ E OS PONTOS NÃO PODEM SE ENCOSTAR: o vizinho mais próximo tem que estar
   a mais de 27% da folha, senão dois alvos de 56px se sobrepõem e a criança
   mira num e toca no outro. */
var FIGURAS=[
 {selo:"A CASINHA ESCONDIDA", nome:"uma CASINHA", voz:"uma casinha",

        '<circle cx="55" cy="76" r="1.8" fill="#ffd54a"/>'},
 {selo:"O BICHO DO MAR", nome:"um PEIXE", voz:"um peixe",
  pts:[[14,32],[34,50],[14,68],[44,84],[74,74],[90,50],[74,26],[44,16]],
  d:"M14 32 L34 50 L14 68 L44 84 L74 74 L90 50 L74 26 L44 16 Z",
  cor:"#7ec8e3",
  extra:'<circle cx="74" cy="44" r="4.6" fill="#fffdf6" stroke="#2b2118" stroke-width="1.2"/>'+
        '<circle cx="75" cy="45" r="2.2" fill="#2b2118"/>'+
        '<path d="M44 50 Q56 44 68 50" fill="none" stroke="#2b2118" stroke-width="1.2" stroke-linecap="round"/>'}
];
/* O ANDAIME. O 3o degrau LIGA o traco pela crianca e so DEPOIS escreve a
   explicacao — na ordem contraria a dica nasce e morre no mesmo quadro. */
var DICAS=[
 "Procure o n&#250;mero <b>{n}</b>. Ele &#233; o pr&#243;ximo da fila.",
 "O n&#250;mero <b>{n}</b> est&#225; <b>pulsando</b>. Toque nele.",
 "Eu liguei este tracinho para voc&#234;. O pr&#243;ximo &#233; o que <b>pulsa</b>."
];
/* ⭐ A SEQUENCIA NAO PRECISA SER DE NUMEROS (ago/2026, atividade do 1o ano).
   A peca nasceu para contar (1,2,3...), mas o que ela ENSINA e "achar o que vem
   DEPOIS numa bagunca" — e isso serve igual para o ALFABETO, que e a primeira
   coisa que a professora do 1o ano pediu. O rotulo do ponto era o numero cru
   (`i+1`) e a voz saia de NUM[]: as duas coisas presas a contagem.
   Agora a gaveta ROTULOS manda. Vazia, e a contagem de sempre; preenchida com
   ["A","B","C"...], os pontos viram letras e a voz diz o NOME da letra.
   ⚠️ o `data-qa` e a conferencia continuam sendo por POSICAO — trocar o rotulo
   nao mexe em quem esta certo, so no que a crianca ve e ouve. */
var ROTULOS=[];
function rotuloDe(n){ return ROTULOS.length ? (ROTULOS[n-1]||(""+n)) : (""+n); }
var NUM=["zero","um","dois","três","quatro","cinco","seis","sete","oito","nove","dez",
         "onze","doze","treze","catorze","quinze"];

var fi=0;              /* figura de agora */
var proximo=1;         /* o numero que a peca espera AGORA */
var ptEls=[];          /* os pontinhos, na ordem 1..N */
var fioEl=null, figEl=null, revelaEl=null, telaAtual=null, barraP=null;
var FEITAS=[];         /* as figuras que ja acenderam, para a galeria do fim */
var errosSeg=0;
var ger=0;             /* geracao: mata o setTimeout de uma tela que ja saiu */
var travada=false;     /* ⚠️ trava NO INSTANTE em que o ultimo ponto liga */

function viva(){ return telaAtual&&telaAtual.parentNode; }
function figura(){ return FIGURAS[fi]||FIGURAS[0]; }
function nomeNum(n){ return ROTULOS.length ? ("letra "+rotuloDe(n)) : (NUM[n]||(""+n)); }

/* A VOZ. Se o PC nao tiver voz a peca continua inteira: todo numero que ela
   fala tambem esta escrito dentro do pontinho. */
function diz(txt){

    var u=new SpeechSynthesisUtterance(txt);

function sLiga(i,total){ nota(392+ (i*(392/Math.max(total,1))), .10, .13, "triangle", 0); }
function sNaoLiga(){ nota(330,.09,.09,"sine",0); }

/* ---------------------------------------------------------------
   A FOLHA. A MESMA funcao monta a folha grande e a miniatura da
   galeria — o que a crianca ve no fim e o que ela mesma ligou.
   --------------------------------------------------------------- */
function montaFolha(fg,ligados,classe,vivo){
  var q=el("div",classe), i, pts="", p;
  var lin=el("div","linhas");
  for(i=0;i<ligados;i++) pts+=fg.pts[i][0]+","+fg.pts[i][1]+" ";
  if(ligados>=fg.pts.length) pts+=fg.pts[0][0]+","+fg.pts[0][1];
  lin.innerHTML='<svg viewBox="0 0 100 100">'+
                '<path class="figc" d="'+fg.d+'"></path>'+
                '<polyline class="fio" points="'+pts+'"></polyline>'+
                '</svg>';
  var fg2=lin.getElementsByTagName("path")[0];
  if(ligados>=fg.pts.length){
    fg2.style.fill=fg.cor; fg2.style.stroke="#2b2118"; fg2.style.strokeWidth="1.6";
    fg2.setAttribute("class","figc viva");
    lin.getElementsByTagName("svg")[0].innerHTML+=fg.extra;
  }
  q.appendChild(lin);
  if(vivo){
    figEl=fg2; fioEl=lin.getElementsByTagName("polyline")[0];
    /* a camada do "tocou fora": responde com um toquinho e nao acontece mais
       nada. Fica ABAIXO dos pontinhos, entao nunca rouba o toque deles. */
    var fr=el("div","fora","");
    fr.onclick=tocouFora;
    q.appendChild(fr);
    ptEls=[];
    for(i=0;i<fg.pts.length;i++){
      p=el("div","pt",rotuloDe(i+1));
      p.style.left=fg.pts[i][0]+"%";
      p.style.top=fg.pts[i][1]+"%";
      p.setAttribute("aria-label","Ponto "+(i+1));
      p._n=i+1;
      p.onclick=tocouPonto;
      q.appendChild(p);
      ptEls.push(p);
    }
  }
  return q;
}

/* ---------------------------------------------------------------
   A TELA DA FIGURA. Uma folha e nada mais: nem botao, nem placar.
   O que empurra a crianca e a curiosidade de ver o que aparece.
   --------------------------------------------------------------- */
function telaPontos(){
  if(fi>=FIGURAS.length){ fimDaPeca(); return; }
  ger++; travada=false; proximo=1; errosSeg=0;
  limpa();
  var fg=FIGURAS[fi];
  var t=el("div","tela"); telaAtual=t;
  setProg(t, Math.round(fi*100/FIGURAS.length));
  barraP=t.getElementsByTagName("i")[0];
  var c=el("div","centro");
  c.appendChild(el("div","selo",fg.selo));
  c.appendChild(el("div","balao","Ligue os pontinhos: <b>1, 2, 3</b>... e veja o que aparece!"));
  c.appendChild(montaFolha(fg,0,"folha",1));
  revelaEl=el("div","revela","");
  c.appendChild(revelaEl);
  c.appendChild(el("div","hint","Toque no <b>1</b>. Depois no <b>2</b>. "+
                   "Figura "+(fi+1)+" de "+FIGURAS.length+"."));
  t.appendChild(c); app.appendChild(t);
  marcaProximo();
  diz("Ligue os pontinhos. Comece no um!");
}

/* ---------------------------------------------------------------
   O TOQUE. Só liga se for o PRÓXIMO da ordem; qualquer outro toque
   não pune — mas faz o andaime crescer, porque quem toca no ponto
   errado é justamente quem ainda não achou o número.
   --------------------------------------------------------------- */
function tocouPonto(){
  var p=this;
  if(travada||!p||!viva()) return;
  if(p._n===proximo){ liga(p); return; }
  /* já ligado, ou ainda não é a vez: NÃO LIGA, e não acontece mais nada de
     ruim. Uma etiqueta em palavras (a barra de dica) explica o que falta —
     nunca um retângulo colorido e um silêncio, que faz a criança achar que
     o app travou. */
  sNaoLiga();
  p.className=(p._n<proximo)?"pt feito treme":"pt treme";
  destreme(p);
  ajuda(errosSeg+1);
}
/* tocar fora dos pontinhos: responde ao dedo (a crianca precisa saber que a
   tela ouviu) e nao acontece mais nada. Sem dica, sem andaime, sem som de
   tropeco — tocar fora nao e tentativa, e exploracao. */
function tocouFora(){
  if(travada||!viva()) return;
  sToque();
}
function liga(p){
  var fg=figura();
  proximo++;
  errosSeg=0;
  p.className="pt feito";
  sLiga(proximo-1,fg.pts.length);
  desenhaFio();
  apagaDica();
  if(barraP) barraP.style.width=
    Math.round((fi+(proximo-1)/fg.pts.length)*100/FIGURAS.length)+"%";
  if(proximo>fg.pts.length){ fecha(); return; }
  marcaProximo();
  diz(nomeNum(proximo));
}
/* ⚠️ todo ajudante que mexe no DOM comeca conferindo se o DOM existe: uma
   funcao dessas, chamada antes do elemento nascer, ja derrubou quatro
   portoes de uma vez com TypeError. */
function desenhaFio(){
  if(!fioEl) return;
  var fg=figura(), i, s="";
  for(i=0;i<proximo-1&&i<fg.pts.length;i++) s+=fg.pts[i][0]+","+fg.pts[i][1]+" ";
  if(proximo>fg.pts.length) s+=fg.pts[0][0]+","+fg.pts[0][1];
  fioEl.setAttribute("points",s);
}
/* `data-qa` = o pontinho da vez, so para o auditor-jogador. Para a crianca o
   atributo nao existe (nao muda um pixel na tela). O PULSAR, esse sim, so
   comeca no 2o degrau do andaime. */
function marcaProximo(){
  var i, p;
  if(!ptEls.length) return;
  for(i=0;i<ptEls.length;i++){
    p=ptEls[i];
    if(!p) continue;
    if(p._n===proximo){
      p.setAttribute("data-qa","1");
      p.className=(errosSeg>=2)?"pt prox":"pt";
    }else{
      p.removeAttribute("data-qa");
      if(p._n<proximo) p.className="pt feito";
      else p.className="pt";
    }
  }
}
function destreme(p){
  var g=ger;
  setTimeout(function(){
    if(g!==ger||!viva()||!p) return;
    if(p._n<proximo) p.className="pt feito";
    else if(p._n===proximo) p.className=(errosSeg>=2)?"pt prox":"pt";
    else p.className="pt";
  },340);
}

/* ---------------------------------------------------------------
   O ANDAIME QUE CRESCE. Sempre com o NÚMERO da vez dentro da frase
   (o nome do que está na tela sai de uma função, nunca escrito à
   mão em cada dica — é assim que não sobra vocabulário de outra
   rodada).
   --------------------------------------------------------------- */
function ajuda(n){
  errosSeg=Math.min(n,DICAS.length);
  if(errosSeg<3){
    marcaProximo();
    mostraDica(DICAS[errosSeg-1].replace("{n}",""+proximo));
    if(errosSeg===2) diz(ROTULOS.length ? ("Procure a " + nomeNum(proximo) + ".") : ("Procure o número " + nomeNum(proximo) + "."));
    return;
  }
  /* ⚠️ 3o DEGRAU: primeiro LIGA o tracinho, DEPOIS escreve a dica. Ao
     contrario, a explicacao e apagada no mesmo quadro em que nasce (defeito
     que apareceu em cinco pecas do mesmo lote). */
  var alvo=ptEls[proximo-1];
  if(alvo) liga(alvo);
  if(!travada){
    errosSeg=3;
    marcaProximo();
    mostraDica(DICAS[2]);
  }
}
function apagaDica(){
  var d=document.getElementById("dicaP");
  if(d&&d.parentNode) d.parentNode.removeChild(d);
}

/* ---------------------------------------------------------------
   A FIGURA ACENDE INTEIRA. O nome dela vem AGORA, e não antes: o
   conceito por último é a lei da casa.
   --------------------------------------------------------------- */
function fecha(){
  travada=true;                        /* ⚠️ trava NO INSTANTE, nao no fim */
  var fg=figura(), g=ger, i;
  for(i=0;i<ptEls.length;i++) if(ptEls[i]) ptEls[i].removeAttribute("data-qa");
  if(figEl){
    figEl.style.fill=fg.cor;
    figEl.style.stroke="#2b2118";
    figEl.style.strokeWidth="1.6";
    figEl.setAttribute("class","figc viva");
    var sv=figEl.parentNode;
    if(sv) sv.innerHTML+=fg.extra;
  }
  if(revelaEl) revelaEl.innerHTML="&#201; "+fg.nome+"!";
  FEITAS.push(fi);
  sCerto();
  diz("É " + fg.voz + "!");
  setTimeout(function(){
    if(g!==ger||!viva()) return;
    fi++;
    var msg="<b>A figura apareceu!</b><br>Voc&#234; ligou tudo na ordem certa.";
    if(fi<FIGURAS.length) mostraBanner(msg,telaPontos);
    else mostraBanner(msg,fimDaPeca);
  },1500);
}

/* ---------------------------------------------------------------
   A MEDALHA. Parecer em palavras, nunca nota.

function fimDaPeca(){
  ger++; travada=false;
  limpa();
  var t=el("div","tela"); telaAtual=t;

  t.appendChild(c); app.appendChild(t);

}
    if(f && f.dados) FIGURAS = f.dados;
    if(f && f.dadosExtra){ var _d = f.dadosExtra;
      if(_d.DICAS !== undefined) DICAS = _d.DICAS;

/* ==== PECA: memoria ==== */
MEC["memoria"] = function(f, cen, fim){
  cen.className = cen.className + " mec-memoria";
  /* ⚠️⚠️ LICAO PAGA, e a mais silenciosa de todas: a peca da MEMORIA declara a
     PROPRIA `function fim()`. Como o corpo dela entra dentro do fechamento, esse
     `fim` SOMBREAVA o parametro da ponte — e o `mostraBanner` daqui, que devia
     levar a fase seguinte, chamava a peca de volta. Laco infinito, sem erro de
     JS nenhum: o jogador so ficava PRESO, com todos os pares ja fechados e a
     medalha da peca na tela. Por isso a continuacao mora AQUI FORA, com um nome
     que o integrador confere que nenhuma peca usa (ver `confere_contra_motor`).
     E ela so dispara UMA vez: peca que chama o banner duas vezes pularia fase. */
  var _seguir = function(){ if(_seguir.ja) return; _seguir.ja = 1; fim(); };
  /* recolhe o enunciado da fase assim que a peca puser o balao dela (ver CSS) */
  setTimeout(function(){
    var b = cen.getElementsByClassName("pecabox")[0];
    if(b && b.getElementsByClassName("balao").length)
      cen.className = cen.className + " tembalaopeca";
  }, 120);
  (function(){
    /* a peca acha que esta sozinha; estes ajudantes fazem o meio de campo */
    var app = cen;
    /* o `ac()` DESTA peca: destrava o som (o motor chama isso de `arma()`) e
       devolve o AudioContext do motor. Fica local, dentro do fechamento, para
       nao brigar com o `var ac` do motor — que e o objeto, nao a funcao. */
    function ac(){ if(typeof arma === "function") arma(); return window.ac; }
    function limpa(){ var g = cen.getElementsByClassName("pecabox")[0];
      if(g) g.innerHTML = ""; else { g = document.createElement("div");
      g.className = "pecabox"; cen.appendChild(g); } app = g; }
    /* ⚠️ LICAO PAGA: este ajudante era um VAZIO — "quem manda na barra e o
       motor". So que o caca-palavras faz `setProg(t,0)` e depois PEGA A BARRA
       DE VOLTA (`t.getElementsByTagName("i")[0]`) para mostrar quantas palavras
       ja achou. Com o vazio, ele pegava `undefined` e estourava no primeiro
       toque: 446 erros de JS numa partida. Regra: o ajudante da ponte tem que
       FAZER o que o de verdade faz — nao pode so nao atrapalhar.
       A barra da PECA e a de dentro da fase (5 palavras achadas de 8); a do
       MOTOR e a da atividade (fase 4 de 32). As duas informam coisas
       diferentes, entao as duas ficam — a de dentro, menorzinha (ver CSS). */
    function setProg(t, p){
      if(!t || !t.appendChild) return;
      var pr = document.createElement("div"); pr.className = "prog progpeca";
      var i = document.createElement("i"); i.style.width = (p || 0) + "%";
      pr.appendChild(i); t.appendChild(pr);
    }
    /* ⚠️⚠️ LICAO PAGA (ago/2026), pega pelo Marcos JOGANDO: *"esta passando de
       fase sem aquele botao azul que aparecia com a palavra proximo... tem que
       ser parecida com a atividade do Broto"*.

       Esta ponte comemorava e PULAVA para a fase seguinte sozinha, 420ms
       depois. A crianca terminava uma fase e era JOGADA na outra: sem a tela de
       parabens, sem o mascote dizendo o que ela conseguiu, sem o botao para ela
       decidir quando seguir. No Broto — que e o modelo — cada fase fecha com o
       banner e a crianca TOCA para continuar. Era o fecho de toda fase de toda
       atividade montada que estava faltando.

       Agora a ponte chama o banner DE VERDADE do motor (`window.mostraBanner`,
       que a funcao local aqui dentro sombreia) e entrega o `_seguir` como o
       botao. A peca continua so avisando que acabou; quem manda no caminho
       segue sendo o motor — mas com a comemoracao no meio. */
    function mostraBanner(msg, cb){
      if(typeof festa === "function") festa();
      if(typeof window.mostraBanner === "function"){
        window.mostraBanner(msg || "Muito bem!", _seguir); return;
      }
      setTimeout(_seguir, 420);
    }
    limpa();

function pecaMemoria(){

function tocar(o){
  if(travado) return;
  if(o.el.className.indexOf("par")>=0){ sTap(); return; }     /* ja fechada */
  if(virada===o) return;
  /* ⚠️ LICAO PAGA (ago/2026): aqui era `if(...vira...) return;` — carta virada
     nao se toca. So que se sobrar UMA carta de cara para cima que a peca nao
     esta mais seguindo em `virada` (qualquer descompasso entre o desenho e a
     memoria do jogo), ela vira uma carta MORTA: nunca mais aceita toque, e a
     fase nao fecha NUNCA. A crianca fica com dois quadradinhos na tela sem
     conseguir juntar o ultimo par. Foi assim que o auditor-jogador ficou preso
     com 3 de 4 pares fechados.
     Agora a carta orfa e ADOTADA: se esta virada e ninguem a segura, ela passa
     a ser a carta da vez. Nao ha estado do qual a crianca nao consiga sair.  */
  if(o.el.className.indexOf("vira")>=0){
    if(!virada){ virada=o; }
    return;
  }
  o.el.className="mcarta vira";
  sVira();
  if(!virada){ virada=o; return; }
  tentativas++;
  if(virada.k===o.k){ fechaPar(virada,o); virada=null; return; }
  /* nao formou par: as duas voltam. Erro NUNCA pune — so devolve. */
  travado=true;
  var a=virada; virada=null;
  setTimeout((function(x,y){ return function(){
    if(x.el.className.indexOf("par")<0) x.el.className="mcarta";
    if(y.el.className.indexOf("par")<0) y.el.className="mcarta";
    travado=false;
    ajuda(tentativas);
  }; })(a,o),900);
}

function fechaPar(a,b){
  a.el.className="mcarta vira par";
  b.el.className="mcarta vira par";
  a.el.appendChild(el("div","vpar","✓"));
  b.el.appendChild(el("div","vpar","✓"));
  a.el.removeAttribute("data-qa");
  b.el.removeAttribute("data-qa");

  feitos++;
  atualiza();

function proximoPar(){
  var i,j;
  for(i=0;i<PARES.length;i++){

      if(cartas[j].k===PARES[i].k && cartas[j].el.className.indexOf("par")<0) return PARES[i];

/* ---------- as TRES portas de entrada da mesma ficha ---------- */
/* ⚠️ o `touchstart` recebe uma funcao COM NOME de proposito: assim nenhum
   `preventDefault` fica perto dele. preventDefault no touchstart mata o
   toque no celular (armadilha registrada no _padrao/DINAMICAS.md). */
function ligaFicha(b){
  b.onclick=cliqueFicha;
  b.onmousedown=mouseIni;
  b.addEventListener("touchstart",toqueIni,false);
  b.addEventListener("touchmove",toqueMeio,false);
  b.addEventListener("touchend",toqueFim,false);
}
function cliqueFicha(){
  if(Date.now()-ultimoToque<700) return;   /* clique FANTASMA depois do toque */
  tocaFicha(this);
}
function mouseIni(ev){
  if(Date.now()-ultimoToque<700) return;
  pegaEm(this,ev.clientX,ev.clientY);
}
function toqueIni(ev){
  ultimoToque=Date.now();
  var to=ev.touches[0]; if(!to) return;
  pegaEm(this,to.clientX,to.clientY);
}
function toqueMeio(ev){
  if(!pego) return;
  var to=ev.touches[0]; if(!to) return;
  moveEm(to.clientX,to.clientY);
  if(moveu) ev.preventDefault();   /* so no MEIO do arrasto, nunca no comeco */
}
function toqueFim(ev){
  ultimoToque=Date.now();
  var to=ev.changedTouches[0], arrastou=moveu, alvo=this;
  if(to) soltaEm(to.clientX,to.clientY); else soltaSombra();
  if(!arrastou) tocaFicha(alvo);   /* toque simples: vale como clique */
}
function moveMouse(ev){ if(pego) moveEm(ev.clientX,ev.clientY); }
function soltaMouse(ev){ if(pego) soltaEm(ev.clientX,ev.clientY); }
document.onmousemove=moveMouse;
document.onmouseup=soltaMouse;

/* ---------- o arrasto de verdade (mouse e dedo usam o mesmo caminho) ---- */
function pegaEm(b,x,y){
  if(!b||b.className.indexOf("usada")>=0) return;
  pego=b; px0=x; py0=y; moveu=false;
  sTap();
  b.className="pc sel";
  somb=el("div","somb",""+b.num);
  somb.style.left=(x-26)+"px"; somb.style.top=(y-26)+"px";
  somb.style.display="none";
  document.body.appendChild(somb);
}
function moveEm(x,y){
  if(!pego||!somb) return;
  if(!moveu&&(Math.abs(x-px0)>8||Math.abs(y-py0)>8)){ moveu=true; somb.style.display="block"; }
  if(moveu){ somb.style.left=(x-26)+"px"; somb.style.top=(y-26)+"px"; }
}
function soltaEm(x,y){
  var b=pego, arrastou=moveu;
  soltaSombra();
  if(!b) return;
  if(b.className.indexOf("usada")<0) b.className="pc";
  if(!arrastou) return;            /* nao arrastou: quem resolve e o clique */
  if(naFila(x,y)) tocaFicha(b);
}
function soltaSombra(){
  if(somb&&somb.parentNode) somb.parentNode.removeChild(somb);
  somb=null; pego=null; moveu=false;
}
function naFila(x,y){
  var e=document.elementFromPoint(x,y), n=0;
  while(e&&n<6){
    var cl=" "+String(e.className||"")+" ";
    if(cl.indexOf(" cam ")>=0||cl.indexOf(" fila ")>=0) return true;
    e=e.parentNode; n++;
  }
  return false;
}

    function mostraBanner(msg, cb){
      if(typeof festa === "function") festa();

var imgEl = window.imgEl || null;

 {selo:"O SOM DO COME&Ccedil;O", alvo:"flor", opcoes:["flor","peixe","lua","bola"],

var rodada=0, R=null, erros=0, travada=false, revelando=false;

/* A VOZ. Aqui e `speechSynthesis` so para PROVAR o contrato — se o PC nao tiver
   voz, a peca continua inteira, porque tudo que a voz diz esta escrito na tela.
   NA ATIVIDADE DE VERDADE esta linha vira `falaDaTela("<id da fala>")`, e o
   alto-falante de cada resposta vira `op_<chave>.mp3` + `VOZOK`. */
function diz(txt){
  try{
    if(!window.speechSynthesis||!window.SpeechSynthesisUtterance) return;
    var u=new SpeechSynthesisUtterance(txt);
    u.lang="pt-BR"; u.rate=.9; u.pitch=1.05;
    window.speechSynthesis.cancel();
    window.speechSynthesis.speak(u);
  }catch(e){}
}
function sVolta(){ nota(392,.10,.11,"sine",0); nota(294,.12,.10,"sine",.08); }

/* ---------------------------------------------------------------
   3) OS DESENHOS — CSS puro, nenhum arquivo externo
   --------------------------------------------------------------- */
function desenho(k){
  var d=el("div","des",""), i, e;
  var F=CATALOGO[k]||{};
  /* ⭐ TRES CAMINHOS, nesta ordem:
     · `img`   — arte de IA (o normal numa atividade de verdade);
     · `texto` — a propria LETRA em corpo grande (fases de alfabeto);
     · senao   — o desenho de CSS das oito figuras de exemplo desta peca. */
  if(F.img){
    if(imgEl){ d.appendChild(imgEl(F.img)); return d; }
    d.appendChild(el("div","destxt", F.nome||k)); return d;
  }
  if(F.texto){ d.appendChild(el("div","destxt", F.texto)); return d; }
  if(k==="sol"){
    for(i=0;i<8;i++){
      e=el("i","solr","");
      e.style.webkitTransform="rotate("+(i*45)+"deg)";
      e.style.transform="rotate("+(i*45)+"deg)";
      d.appendChild(e);
    }
    d.appendChild(el("i","solc",""));
  }else if(k==="casa"){
    d.appendChild(el("i","ctel","")); d.appendChild(el("i","cpar","")); d.appendChild(el("i","cpor",""));
  }else if(k==="bola"){
    e=el("i","bcir","");
    e.appendChild(el("i","bfai","")); e.appendChild(el("i","bfa2",""));
    e.appendChild(el("i","bcu1","")); e.appendChild(el("i","bcu2",""));
    d.appendChild(e);
  }else if(k==="peixe"){
    d.appendChild(el("i","prab","")); d.appendChild(el("i","pcor","")); d.appendChild(el("i","polh",""));
  }else if(k==="arvore"){
    d.appendChild(el("i","atro","")); d.appendChild(el("i","acop",""));
  }else if(k==="flor"){
    d.appendChild(el("i","fcau",""));
    for(i=0;i<5;i++){
      e=el("i","fpet","");
      e.style.webkitTransform="rotate("+(i*72)+"deg)";
      e.style.transform="rotate("+(i*72)+"deg)";
      d.appendChild(e);
    }
    d.appendChild(el("i","fmio",""));
  }else if(k==="chave"){
    d.appendChild(el("i","kcab","")); d.appendChild(el("i","khas",""));
    e=el("i","kden",""); e.style.left="40px"; d.appendChild(e);
    e=el("i","kden",""); e.style.left="50px"; d.appendChild(e);
  }else{
    d.appendChild(el("i","lua",""));

  return d;

  pb.appendChild(el("div","palv",R.escrito));
  sc.appendChild(pb);
  c.appendChild(sc);

  /* AS FIGURAS, embaralhadas (na Fabrica de Estrelas a certa era sempre a 1a e

  for(i=0;i<lista.length;i++) box.appendChild(cartao(lista[i]));

     palavra logo depois do enunciado. */
  diz(R.enun.replace(/<[^>]+>/g,""));

}

function cartao(k){
  /* ⚠️ a classe sai em DUAS partes de proposito. O portao `_qa/dinamicas.py`
     reconhece a familia "escolher" pelo literal `el("div","opt"` — escrito
     `el("div","opt fig")` ele nao reconhece nada, e "0 dinamica reconhecida" e
     aprovacao VAZIA: o portao passa sem ter medido a armadilha desta mecanica
     (as opcoes embaralhadas). Esta peca E um escolher, entao ela se apresenta
     como um. */
  var o=el("div","opt","");
  o.className="opt fig";
  o.appendChild(el("div","ini",letraDe(k)));
  /* ⭐ a MOLDURA: e ela que da o acabamento e impede a figura de vazar */
  var mo=el("div","moldura medalhao","");
  mo.appendChild(desenho(k));
  o.appendChild(mo);
  var lin=el("div","linha","");
  lin.appendChild(el("span","nom",CATALOGO[k].nome));
  var z=el("button","zap","");
  z.appendChild(el("i","fone",""));
  z.setAttribute("aria-label","Ouvir "+CATALOGO[k].nome);
  /* ⚠️ o alto-falante NAO escolhe: ele so fala. Sem parar o evento aqui, tocar
     no alto-falante valia como resposta — e a crianca que so queria conferir o
     nome levava um erro. */
  z.onclick=function(ev){
    var e=ev||window.event;
    if(e.stopPropagation) e.stopPropagation(); else e.cancelBubble=true;
    sPing(); diz(CATALOGO[k].voz);
  };
  lin.appendChild(z);
  o.appendChild(lin);
  o.appendChild(el("div","jat","j&#225; tentamos"));
  o.setAttribute("data-qa", k===R.alvo ? "1" : "0");
  o.onclick=function(){ escolhe(k,o); };
  cartoes.push({k:k,el:o,tentada:false});
  return o;
}
function achaCartao(k){ var i; for(i=0;i<cartoes.length;i++){ if(cartoes[i].k===k) return cartoes[i]; } return null; }

function tocaAlvo(){
  sPing();
  diz(R.fala);
}

/* ---------------------------------------------------------------
   5) A ESCOLHA
   --------------------------------------------------------------- */
function escolhe(k,o){
  if(travada||revelando) return;
  var c=achaCartao(k);
  if(c&&c.tentada){
    /* ⚠️ opcao ja tentada nao responde com SILENCIO nem se distingue so pela
       cor: som de retorno + a etiqueta em palavras que ja esta na tela. */
    sVolta();
    mostraDica("Nesta a gente <b>j&#225; tentou</b>. Escute de novo e escolha outra figura.");
    return;
  }
  if(k===R.alvo){ acertou(o); return; }
  errouUma(c,o);
}
function acertou(o){
  travada=true;                     /* ⚠️ trava NO INSTANTE do toque */
  if(erros===0) acertosDePrimeira++;
  o.className="opt fig certa";
  sCerto();
  if(elAviso){ elAviso.innerHTML=R.msg; elAviso.className="aviso ver"; }
  diz(R.msg.replace(/<[^>]+>/g,""));
  segue(1600);
}
function errouUma(c,o){
  if(c){ c.tentada=true; }
  o.className="opt fig usada";
  var j=o.getElementsByClassName("jat")[0];
  if(j) j.className="jat ver";
  o.setAttribute("data-qa","2");
  erros++;
  sErro();
  ajuda(erros);
}

/* ---------------------------------------------------------------
   6) O ANDAIME QUE CRESCE (1 metodo, 2 apoio concreto, 3 revela)
   --------------------------------------------------------------- */
function ajuda(n){
  var p=n%3;
  if(p===1){
    mostraDica(R.dicas[0]);
    diz(R.dicas[0].replace(/<[^>]+>/g,""));
  }else if(p===2){
    mostraDica(R.dicas[1]);
    diz(R.dicas[1].replace(/<[^>]+>/g,""));
    mostraIniciais();
  }else{
    revela();
  }
}
/* APOIO CONCRETO: a letra do comeco aparece em cada figura. Nao e a resposta —
   e a ferramenta com que se acha a resposta. */
function mostraIniciais(){
  var i,e;
  for(i=0;i<cartoes.length;i++){
    e=cartoes[i].el.getElementsByClassName("ini")[0];
    if(e) e.className="ini ver";
  }
}
/* ⚠️ O 3o DEGRAU: acende a certa PRIMEIRO e escreve a explicacao DEPOIS. Nas
   cinco pecas de ago/2026 o "revelar" chamava o "acertou", e o "acertou"
   apagava a barra de dica no mesmo quadro: a peca se consertava sozinha e a
   crianca nunca lia por que. Aqui a dica fica 2,2s de pe antes de a tela virar. */
function revela(){
  if(revelando) return;
  revelando=true; travada=true;
  var g=ger, c=achaCartao(R.alvo);
  if(c){ c.el.className="opt fig certa"; }
  mostraIniciais();
  sPing(); sCerto();
  mostraDica(R.dicas[2]);
  diz(R.dicas[2].replace(/<[^>]+>/g,""));
  if(elAviso){ elAviso.innerHTML=R.msg; elAviso.className="aviso ver"; }
  setTimeout(function(){
    if(g!==ger) return;
    revelando=false;
    segue(0);
  },2200);
}

/* ---------------------------------------------------------------
   7) O QUE VEM DEPOIS
   --------------------------------------------------------------- */
function segue(espera){
  var g=ger;
  travada=true;
  progVisto=Math.round((rodada+1)*100/RODADAS.length);
  if(progI) progI.style.width=progVisto+"%";
  setTimeout(function(){
    if(g!==ger) return;
    rodada++;
    if(rodada<RODADAS.length){ pecaOuvir(); return; }
    mostraBanner("<b>Voc&#234; achou as tr&#234;s pelo som!</b><br>Ouvir com cuidado &#233; o "+
                 "come&#231;o de ler.", fimOuvir);
  }, espera||600);
}

/* ---------------------------------------------------------------
   8) A MEDALHA. Parecer em palavras, nunca nota.
   --------------------------------------------------------------- */
function fimOuvir(){

  c.appendChild(b);
  c.appendChild(el("div","hint","Na atividade de verdade a voz &#233; MP3 gravado, e cada "+
                   "figura tem o alto-falante dela."));
  t.appendChild(c);
  app.appendChild(t);
  diz("Peça fechada!");
}
    if(f && f.dados) RODADAS = f.dados;
    if(f && f.dadosExtra){ var _d = f.dadosExtra;
      if(_d.CATALOGO !== undefined) CATALOGO = _d.CATALOGO;
    }
