/* a figura da palavra: `img` é o nome da casa, `fig` é o antigo — os dois valem */
function figDe(r){ return r.img || r.fig || ""; }
function sDesliza(){ nota(520,.09,.10,"triangle",0); nota(700,.10,.10,"triangle",.06); }
function sVolta(){ nota(392,.10,.10,"sine",0); nota(294,.12,.09,"sine",.07); }

/* ⭐ OS DOIS ALTO-FALANTES da palavra que está sendo montada.

function ouvidos(r){

function fazSilaba(item, r){
  var b=el("button","jsSil", item.s);
  b.type="button";
  b._sil=item.s;
  /* ⭐ AS TRÊS PORTAS (ordem do Marcos, ago/2026: *"nas atividades de clicar,
     quando for possível, pode ser de arrastar também"*). Aqui o arrastar não é
     só uma porta a mais: ARRASTAR **É** O DESLIZE que a pesquisa pede — a
     criança faz com a mão o que o conceito diz (duas partes que correm uma até
     a outra e viram uma só). Toque, clique e arrasto, os três.
     ⚠️ o guarda do MOUSE FANTASMA: no celular o navegador dispara eventos de
     mouse DEPOIS do toque, e sem este guarda eles desfaziam o gesto. Defeito já
     pego duas vezes na casa. */
  arrastavel(b, r);
  b.onclick=function(){
    if(b._ultimoToque && (new Date()).getTime()-b._ultimoToque<700) return;
    if(b.className.indexOf("usada")>=0) return;
    var esperada=r.sil[posto];
    if(item.s===esperada && b.className.indexOf("usada")<0){
      deslizaAte(b, document.getElementById("jsv"+posto), r);
    } else {
      /* ⚠️ ERRO NÃO PUNE: a peça devolve o pedaço com som GRAVE E CURTO, de
         retorno, nunca de tropeço. O gesto está em treino, e no 1º ano errar a
         ordem é o normal. */
      err++; sErro(); sVolta();
      b.className="jsSil";
      ajuda(err, r);
    }
  };
  return b;
}

/* ⭐ PEGOU O PEDAÇO: som na hora e a SÍLABA DITA. É o coração da fase — a
   criança de 6 anos escolhe pelo SOM, não pela letra, e é ouvindo "BO" na mão
   dela que a sílaba deixa de ser desenho e vira som. Vale para o dedo e para o
   mouse; o clique seco do auditor não passa por aqui, e não precisa. */
function pegou(b){
  if(!b || b.className.indexOf("usada")>=0) return;
  sTap(); voz(b._sil);
}

/* o ARRASTO: mouse e dedo. Solta em cima da forma = a mesma coisa que tocar. */
function arrastavel(b, r){
  var mx=0,my=0,arr=false;
  function comeca(x,y,ev){
    if(b.className.indexOf("usada")>=0) return;
    pegou(b);
    arr=true; mx=x; my=y;
    b.style.zIndex="30"; b.style.position="relative";
    if(ev&&ev.type==="mousedown"&&ev.preventDefault) ev.preventDefault();
  }
  function move(x,y){
    if(!arr) return;
    b.style.webkitTransform="translate("+(x-mx)+"px,"+(y-my)+"px)";
    b.style.transform="translate("+(x-mx)+"px,"+(y-my)+"px)";
  }
  function solta(x,y){
    if(!arr) return;
    arr=false;
    b.style.webkitTransform=""; b.style.transform=""; b.style.zIndex="";
    var v=document.getElementById("jsv"+posto);
    if(v){
      var q=v.getBoundingClientRect();
      /* margem generosa: dedo de 6 anos nao acerta o pixel */
      if(x>q.left-30&&x<q.right+30&&y>q.top-30&&y<q.bottom+30){ b.onclick(); return; }
    }
    sVolta();
  }
  b.onmousedown=function(e){ comeca(e.clientX,e.clientY,e); };
  b.onmousemove=function(e){ move(e.clientX,e.clientY); };
  b.onmouseup  =function(e){ solta(e.clientX,e.clientY); };
  b.onmouseleave=function(e){ if(arr) solta(e.clientX,e.clientY); };
  /* ⚠️ NUNCA `preventDefault` no touchstart: mata o toque simples. */
  b.addEventListener("touchstart",function(e){
    var t=e.touches[0]; b._ultimoToque=(new Date()).getTime(); comeca(t.clientX,t.clientY,null);
  },false);
  b.addEventListener("touchmove",function(e){
    var t=e.touches[0]; move(t.clientX,t.clientY);
    if(arr&&e.preventDefault) e.preventDefault();
  },false);
  b.addEventListener("touchend",function(e){
    var t=(e.changedTouches&&e.changedTouches[0])||{clientX:0,clientY:0};
    b._ultimoToque=(new Date()).getTime();
    var q=document.getElementById("jsv"+posto);
    /* soltou longe da forma? entao foi TOQUE simples, e toque simples tambem vale */
    if(q){ var g=q.getBoundingClientRect();
      if(!(t.clientX>g.left-30&&t.clientX<g.right+30&&t.clientY>g.top-30&&t.clientY<g.bottom+30)){
        arr=false; b.style.webkitTransform=""; b.style.transform="";
        b.onclick(); return; } }
    solta(t.clientX,t.clientY);
  },false);
}

/* ⭐ O DESLIZE — o coração da peça (Reading Rockets: "have the sounds slide
   together to form a word"). A sílaba corre da bandeja até o lugar dela, e só
   depois de chegar é que ela vira parte da palavra. */
function deslizaAte(b, vaga, r){

   que fecha a figura) tinham acabado de nascer com `stroke-dashoffset` cheio,
   esperando o quadro seguinte para correr: o `setTimeout` acordava e mexia nos
   elementos ANTIGOS, ja jogados fora. Resultado: a casinha revelava sem o chao
   e sem a parede da esquerda — e nenhum portao viu, porque JS nao deu erro, a
   figura apareceu e o print ficou "quase certo".
   Agora o enfeite entra num `<g>` NOVO: ninguem e destruido. */
function acendeFigura(q,pth,fg){
  if(!q||!pth) return;
  pth.style.fill=fg.cor; pth.style.stroke="#2b2118"; pth.style.strokeWidth="1.6";
  pth.setAttribute("class","figc viva");
  var sv=pth.parentNode;
  if(sv&&fg.extra){
    var gex=document.createElementNS(nsvg,"g");
    gex.setAttribute("class","fextra");
    gex.innerHTML=fg.extra;
    sv.appendChild(gex);
  }
  if(q.className.indexOf("pronta")<0) q.className=q.className+" pronta";
}
/* enfeite puro da revelacao: some sozinho em 1,6s */
function brilho(q){
  if(!q) return;
  var b=el("div","lpbri"), g0=ger;
  q.appendChild(b);
  setTimeout(function(){ if(g0===ger&&b.parentNode) b.parentNode.removeChild(b); },1200);
}
function faiscas(q,n){
  if(!q) return;
  var i, f, guarda=[], g0=ger;
  for(i=0;i<n;i++){
    f=el("span","lpfai");
    f.style.left=(18+Math.random()*64)+"%";
    f.style.top=(14+Math.random()*68)+"%";
    f.style.webkitAnimationDelay=(Math.random()*.45)+"s";
    f.style.animationDelay=(Math.random()*.45)+"s";
    q.appendChild(f); guarda.push(f);
  }
  setTimeout(function(){
    var k;
    if(g0!==ger) return;
    for(k=0;k<guarda.length;k++) if(guarda[k].parentNode) guarda[k].parentNode.removeChild(guarda[k]);
  },1600);
}

/* ---------------------------------------------------------------
   A FOLHA. A MESMA funcao monta a folha grande e a miniatura da
   galeria — o que a crianca ve no fim e o que ela mesma ligou.
   --------------------------------------------------------------- */
function montaFolha(fg,ligados,classe,vivo){
  var q=el("div",classe), i, p;
  var lin=el("div","linhas");
  /* ⚠️ `preserveAspectRatio="none"` NAO e enfeite: os pontinhos sao
     posicionados em % da FOLHA e o desenho vive no viewBox. Se um dia a folha
     nascer mais larga que alta (uma coluna estreita dentro de uma atividade
     montada), o desenho ficaria centralizado com tarja e os tracos passariam
     LONGE dos pontinhos. Esticado, os dois usam sempre a mesma caixa. */
  lin.innerHTML='<svg viewBox="0 0 100 100" preserveAspectRatio="none">'+
                '<path class="figc" d="'+fg.d+'"></path>'+
                '<g class="fios"></g>'+
                '<line class="guia" x1="0" y1="0" x2="0" y2="0"></line>'+
                '</svg>';
  var pth=lin.getElementsByTagName("path")[0];
  var gf=lin.getElementsByTagName("g")[0];
  var gui=lin.getElementsByTagName("line")[0];
  q.appendChild(el("div","lpluz"));   /* a luz vai ATRAS das linhas */
  q.appendChild(lin);
  for(i=1;i<ligados&&i<fg.pts.length;i++) traco(gf,fg,i-1,i,0);
  if(ligados>=fg.pts.length){
    traco(gf,fg,fg.pts.length-1,0,0);
    acendeFigura(q,pth,fg);
  }
  if(vivo){
    figEl=pth; fiosEl=gf; guiaEl=gui; folhaEl=q;
    /* a camada do "tocou fora": responde com um toquinho e nao acontece mais
       nada. Fica ABAIXO dos pontinhos, entao nunca rouba o toque deles. */
    var fr=el("div","fora","");
    fr.onclick=tocouFora;
    q.appendChild(fr);
    ptEls=[];
    for(i=0;i<fg.pts.length;i++){
      p=el("div","pt");
      p.style.left=fg.pts[i][0]+"%";
      p.style.top=fg.pts[i][1]+"%";
      p.setAttribute("aria-label","Ponto "+(i+1));
      p.appendChild(el("i","peco"));
      p.appendChild(el("i","paro"));
      p.appendChild(el("b","pnum",rotuloDe(i+1)));
      p._n=i+1;
      p.onclick=tocouPonto;         /* porta 1: clicar / tocar */
      p.onmousedown=apertouPonto;   /* porta 2: apertar e arrastar */
      p.onmouseover=passouPonto;    /* porta 3: passar o mouse por cima */
      q.appendChild(p);
      ptEls.push(p);
    }
    /* porta 4 (celular): arrastar o dedo pela folha */
    q.onmousemove=moveuMouse;
    q.onmouseleave=saiuMouse;
    q.ontouchstart=comecouToque;
    q.ontouchmove=arrastouDedo;
    q.ontouchend=soltouDedo;
  }
  return q;
}

/* ---------------------------------------------------------------
   A TELA DA FIGURA. Uma folha e nada mais: nem botao, nem placar.
   O que empurra a crianca e a curiosidade de ver o que aparece.
   --------------------------------------------------------------- */
function telaPontos(){
  if(fi>=FIGURAS.length){ fimDaPeca(); return; }
  ger++; travada=false; proximo=1; errosSeg=0; ignoraClique=null;
  limpa();
  var fg=FIGURAS[fi];
  var t=el("div","tela"); telaAtual=t;
  setProg(t, Math.round(fi*100/FIGURAS.length));
  barraP=t.getElementsByTagName("i")[0];
  var c=el("div","centro");
  c.appendChild(el("div","selo",fg.selo));
  c.appendChild(el("div","balao","Ligue os pontinhos na ordem: <b>1, 2, 3</b>... e veja o que aparece!"));
  var f=montaFolha(fg,0,"folha",1);
  contaEl=el("div","lpconta","0 de "+fg.pts.length);
  f.appendChild(contaEl);
  c.appendChild(f);
  revelaEl=el("div","revela","");
  c.appendChild(revelaEl);
  c.appendChild(el("div","hint","Toque no <b>1</b> — depois v&#225; passando o dedo (ou o mouse) "+
                   "pelos outros. Figura "+(fi+1)+" de "+FIGURAS.length+"."));
  t.appendChild(c); app.appendChild(t);
  marcaProximo();
  diz("Ligue os pontinhos. Comece no um!");
}

/* ---------------------------------------------------------------
   AS PORTAS DE ENTRADA. Só liga se for o PRÓXIMO da ordem; tocar
   num ponto que ainda não é a vez não pune — mas faz o andaime
   crescer, porque quem faz isso é justamente quem ainda não achou
   o número.
   --------------------------------------------------------------- */
function podeLigar(p){ return !travada && !!viva() && !!p && p._n===proximo; }
/* ⚠️ o celular dispara mousedown/mouseover/click FANTASMA depois do dedo: sem
   esta marca de tempo o mesmo gesto era contado duas vezes. */
function ehFantasma(){ return (new Date()).getTime()-ultimoToque<800; }

function tocouPonto(){
  var p=this;
  if(travada||!p||!viva()) return;
  /* o clique que vem logo depois do `mousedown` que JA ligou este ponto */
  if(p===ignoraClique){ ignoraClique=null; return; }
  if(p._n===proximo){ liga(p); return; }
  /* ponto JA LIGADO: e onde o dedo solta quando termina de varrer. Nao e erro
     nenhum — responde ao dedo e mais nada. */
  if(p._n<proximo){ sToque(); return; }
  /* ainda nao e a vez: NAO LIGA, e nao acontece mais nada de ruim. Uma
     etiqueta em palavras (a barra de dica) explica o que falta — nunca um
     retangulo colorido e um silencio, que faz a crianca achar que travou. */
  sNaoLiga();
  p.className="pt treme";
  destreme(p);
  ajuda(errosSeg+1);
}
/* PORTA 2: apertar ja liga (no PC o traco nasce no instante do clique) e
   comeca o arrasto a partir deste ponto. */
function apertouPonto(){
  if(ehFantasma()||!podeLigar(this)) return;
  ignoraClique=this;
  liga(this);
}
/* PORTA 3: passar o mouse por cima. SO depois que a crianca comecou (ou com o
   botao apertado) — senao o desenho se faria sozinho quando o rato cruzasse a
   folha por acaso, e a descoberta seria roubada dela. */
function passouPonto(){
  if(ehFantasma()||!podeLigar(this)) return;
  if(proximo>1||apertado) liga(this);
}
/* PORTA 4: o dedo arrastando pela folha. ⚠️ NUNCA `preventDefault` no
   `touchstart` (mata o toque); so no MEIO do arrasto, quando ja se sabe que e
   arrasto e nao toque. */
function comecouToque(){ ultimoToque=(new Date()).getTime(); }
function arrastouDedo(ev){
  ultimoToque=(new Date()).getTime();
  if(travada||!viva()) return;
  var t=ev.touches&&ev.touches[0];
  if(!t) return;
  moveGuia(t.clientX,t.clientY);
  var p=pontoEm(t.clientX,t.clientY);
  if(p&&podeLigar(p)){ liga(p); if(ev.preventDefault) ev.preventDefault(); return; }
  if(proximo>1&&ev.preventDefault) ev.preventDefault();
}
function soltouDedo(){ ultimoToque=(new Date()).getTime(); escondeGuia(); }
function pontoEm(x,y){
  var e=document.elementFromPoint(x,y);
  while(e&&e!==document.body){
    if(e._n) return e;
    e=e.parentNode;
  }
  return null;
}
/* tocar fora dos pontinhos: responde ao dedo (a crianca precisa saber que a
   tela ouviu) e nao acontece mais nada. Sem dica, sem andaime, sem som de
   tropeco — tocar fora nao e tentativa, e exploracao. */
function tocouFora(){
  if(travada||!viva()) return;
  sToque();
}

/* ---------------------------------------------------------------
   A LINHA-GUIA ELÁSTICA: sai do último ponto ligado e segue o
   dedo/rato enquanto a criança procura o próximo.
   --------------------------------------------------------------- */
function moveuMouse(ev){
  if(ehFantasma()) return;
  moveGuia(ev.clientX,ev.clientY);
}
function saiuMouse(){ escondeGuia(); }
function moveGuia(cx,cy){
  var fg=figura();
  if(travada||!guiaEl||!folhaEl||proximo<2||proximo>fg.pts.length){ escondeGuia(); return; }
  var r=folhaEl.getBoundingClientRect();
  if(!r.width||!r.height) return;
  var a=fg.pts[proximo-2];
  guiaEl.setAttribute("x1",a[0]);
  guiaEl.setAttribute("y1",a[1]);
  guiaEl.setAttribute("x2",((cx-r.left)*100/r.width).toFixed(1));
  guiaEl.setAttribute("y2",((cy-r.top)*100/r.height).toFixed(1));
  guiaEl.setAttribute("class","guia viva");
}
function escondeGuia(){ if(guiaEl) guiaEl.setAttribute("class","guia"); }

/* ---------------------------------------------------------------
   LIGAR: o traço cresce, o contador anda, a barra sobe.
   --------------------------------------------------------------- */
function liga(p){
  var fg=figura(), n=p._n;
  proximo=n+1;
  errosSeg=0;
  p.className="pt feito";
  if(n>1) traco(fiosEl,fg,n-2,n-1,1);
  if(n>=fg.pts.length) traco(fiosEl,fg,fg.pts.length-1,0,1);
  sLiga(n,fg.pts.length);
  apagaDica();
  escondeGuia();
  if(barraP) barraP.style.width=
    Math.round((fi+n/fg.pts.length)*100/FIGURAS.length)+"%";
  if(proximo>fg.pts.length){ atualizaConta(); fecha(); return; }
  marcaProximo();
  diz(nomeNum(proximo));
}
/* ⚠️ todo ajudante que mexe no DOM comeca conferindo se o DOM existe: uma
   funcao dessas, chamada antes do elemento nascer, ja derrubou quatro
   portoes de uma vez com TypeError. */
function atualizaConta(){
  if(!contaEl) return;
  var fg=figura();
  contaEl.innerHTML=Math.min(proximo-1,fg.pts.length)+" de "+fg.pts.length;
}
/* `data-qa` = o pontinho da vez, so para o auditor-jogador. Para a crianca o
   atributo nao existe (nao muda um pixel na tela). O PULSAR forte, esse sim,
   so comeca no 2o degrau do andaime — o anel inteiro ja marca a vez antes. */
function marcaProximo(){
  var i, p;
  if(!ptEls.length) return;
  for(i=0;i<ptEls.length;i++){
    p=ptEls[i];
    if(!p) continue;
    if(p._n===proximo){
      p.setAttribute("data-qa","1");
      p.className=(errosSeg>=2)?"pt vez prox":"pt vez";
    }else{
      p.removeAttribute("data-qa");
      p.className=(p._n<proximo)?"pt feito":"pt";
    }
  }
  atualizaConta();
}
function destreme(p){
  var g=ger;
  setTimeout(function(){
    if(g!==ger||!viva()||!p) return;
    if(p._n<proximo) p.className="pt feito";
    else if(p._n===proximo) p.className=(errosSeg>=2)?"pt vez prox":"pt vez";
    else p.className="pt";
  },340);
}

/* ---------------------------------------------------------------
   O ANDAIME QUE CRESCE. Sempre com o NÚMERO da vez dentro da frase
   (o nome do que está na tela sai de uma função, nunca escrito à
   mão em cada dica — é assim que não sobra vocabulário de outra
   rodada).
   --------------------------------------------------------------- */
function ajuda(n){
  errosSeg=Math.min(n,DICAS.length);
  if(errosSeg<3){
    marcaProximo();
    mostraDica(DICAS[errosSeg-1].replace("{n}",""+proximo));
    if(errosSeg===2) diz(ROTULOS.length ? ("Procure a " + nomeNum(proximo) + ".") : ("Procure o número " + nomeNum(proximo) + "."));
    return;
  }
  /* ⚠️ 3o DEGRAU: primeiro LIGA o tracinho, DEPOIS escreve a dica. Ao
     contrario, a explicacao e apagada no mesmo quadro em que nasce (defeito
     que apareceu em cinco pecas do mesmo lote). */
  var alvo=ptEls[proximo-1];
  if(alvo) liga(alvo);
  if(!travada){
    errosSeg=3;
    marcaProximo();
    mostraDica(DICAS[2]);
  }
}
function apagaDica(){
  var d=document.getElementById("dicaP");
  if(d&&d.parentNode) d.parentNode.removeChild(d);
}

/* ---------------------------------------------------------------
   A FIGURA ACENDE INTEIRA. A luz sobe atrás dela, o brilho corre,
   as faíscas estouram — e o nome vem AGORA, não antes: o conceito
   por último é a lei da casa.
   --------------------------------------------------------------- */
function fecha(){
  travada=true;                        /* ⚠️ trava NO INSTANTE, nao no fim */
  var fg=figura(), g=ger, i;
  for(i=0;i<ptEls.length;i++) if(ptEls[i]) ptEls[i].removeAttribute("data-qa");
  escondeGuia();
  FEITAS.push(fi);
  /* ⚠️ a REVELACAO espera o ultimo traco CHEGAR (o traco leva .3s para correr).
     Acender a figura no mesmo quadro em que o traco nasce come justamente o
     gesto que a crianca acabou de fazer — e era assim que os dois ultimos
     tracos da figura nunca eram vistos. */
  setTimeout(function(){
    if(g!==ger||!viva()) return;
    if(folhaEl&&figEl){
      acendeFigura(folhaEl,figEl,fg);
      brilho(folhaEl);
      faiscas(folhaEl,9);
    }
    if(revelaEl) revelaEl.innerHTML='<span class="lpfita">&#201; '+fg.nome+'!</span>';
    sRevela();
    diz("É " + fg.voz + "!");
  },380);
  setTimeout(function(){
    if(g!==ger||!viva()) return;
    fi++;
    var msg="<b>A figura apareceu!</b><br>Voc&#234; ligou tudo na ordem certa.";
    if(fi<FIGURAS.length) mostraBanner(msg,telaPontos);
    else mostraBanner(msg,fimDaPeca);
  },800);
}

/* ---------------------------------------------------------------
   A MEDALHA. Parecer em palavras, nunca nota.
   --------------------------------------------------------------- */
function fimDaPeca(){
  ger++; travada=false;
  limpa();
  var t=el("div","tela"); telaAtual=t;
  setProg(t,100);
  var c=el("div","centro"), i;
  c.appendChild(el("div","selo","PE&#199;A FECHADA"));
  c.appendChild(el("div","medal",""));
  c.appendChild(el("div","balao","Voc&#234; achou <b>"+(FEITAS.length||FIGURAS.length)+
                   "</b> figura(s) seguindo os n&#250;meros na ordem."));
  var gal=el("div","galeria");
  for(i=0;i<FIGURAS.length;i++) gal.appendChild(montaFolha(FIGURAS[i],FIGURAS[i].pts.length,"lp_mini",0));
  c.appendChild(gal);
  var b=el("button","btn","Jogar de novo");
  b.style.marginTop="10px";
  b.onclick=function(){ fi=0; FEITAS=[]; telaPontos(); };
  c.appendChild(b);
  c.appendChild(el("div","hint","Esta &#233; a pe&#231;a LIGAR OS PONTINHOS: a ordem dos n&#250;meros vira desenho."));
  t.appendChild(c); app.appendChild(t);
  diz("Peça fechada!");
}
    if(f && f.dados) FIGURAS = f.dados;
    if(f && f.dadosExtra){ var _d = f.dadosExtra;
      if(_d.DICAS !== undefined) DICAS = _d.DICAS;
      if(_d.ROTULOS !== undefined) ROTULOS = _d.ROTULOS;
      if(_d.NUM !== undefined) NUM = _d.NUM;
      if(_d.FEITAS !== undefined) FEITAS = _d.FEITAS;
    }
    try{ fimDaPeca = _seguir; }catch(_e){}
    telaPontos();
  })();
};

/* ==== PECA: memoria ==== */
MEC["memoria"] = function(f, cen, fim){
  cen.className = cen.className + " mec-memoria";
  /* ⚠️⚠️ LICAO PAGA, e a mais silenciosa de todas: a peca da MEMORIA declara a
     PROPRIA `function fim()`. Como o corpo dela entra dentro do fechamento, esse
     `fim` SOMBREAVA o parametro da ponte — e o `mostraBanner` daqui, que devia
     levar a fase seguinte, chamava a peca de volta. Laco infinito, sem erro de
     JS nenhum: o jogador so ficava PRESO, com todos os pares ja fechados e a
     medalha da peca na tela. Por isso a continuacao mora AQUI FORA, com um nome
     que o integrador confere que nenhuma peca usa (ver `confere_contra_motor`).
     E ela so dispara UMA vez: peca que chama o banner duas vezes pularia fase. */
  var _seguir = function(){ if(_seguir.ja) return; _seguir.ja = 1; fim(); };
  /* recolhe o enunciado da fase assim que a peca puser o balao dela (ver CSS) */
  setTimeout(function(){
    var b = cen.getElementsByClassName("pecabox")[0];
    if(b && b.getElementsByClassName("balao").length)
      cen.className = cen.className + " tembalaopeca";
  }, 120);
  (function(){
    /* a peca acha que esta sozinha; estes ajudantes fazem o meio de campo */
    var app = cen;
    /* o `ac()` DESTA peca: destrava o som (o motor chama isso de `arma()`) e
       devolve o AudioContext do motor. Fica local, dentro do fechamento, para
       nao brigar com o `var ac` do motor — que e o objeto, nao a funcao. */
    function ac(){ if(typeof arma === "function") arma(); return window.ac; }
    function limpa(){ var g = cen.getElementsByClassName("pecabox")[0];
      if(g) g.innerHTML = ""; else { g = document.createElement("div");
      g.className = "pecabox"; cen.appendChild(g); } app = g; }
    /* ⚠️ LICAO PAGA: este ajudante era um VAZIO — "quem manda na barra e o
       motor". So que o caca-palavras faz `setProg(t,0)` e depois PEGA A BARRA
       DE VOLTA (`t.getElementsByTagName("i")[0]`) para mostrar quantas palavras
       ja achou. Com o vazio, ele pegava `undefined` e estourava no primeiro
       toque: 446 erros de JS numa partida. Regra: o ajudante da ponte tem que
       FAZER o que o de verdade faz — nao pode so nao atrapalhar.
       A barra da PECA e a de dentro da fase (5 palavras achadas de 8); a do
       MOTOR e a da atividade (fase 4 de 32). As duas informam coisas
       diferentes, entao as duas ficam — a de dentro, menorzinha (ver CSS). */
    function setProg(t, p){
      if(!t || !t.appendChild) return;
      var pr = document.createElement("div"); pr.className = "prog progpeca";
      var i = document.createElement("i"); i.style.width = (p || 0) + "%";
      pr.appendChild(i); t.appendChild(pr);
    }
    /* ⚠️⚠️ LICAO PAGA (ago/2026), pega pelo Marcos JOGANDO: *"esta passando de
       fase sem aquele botao azul que aparecia com a palavra proximo... tem que
       ser parecida com a atividade do Broto"*.

       Esta ponte comemorava e PULAVA para a fase seguinte sozinha, 420ms
       depois. A crianca terminava uma fase e era JOGADA na outra: sem a tela de
       parabens, sem o mascote dizendo o que ela conseguiu, sem o botao para ela
       decidir quando seguir. No Broto — que e o modelo — cada fase fecha com o
       banner e a crianca TOCA para continuar. Era o fecho de toda fase de toda
       atividade montada que estava faltando.

       Agora a ponte chama o banner DE VERDADE do motor (`window.mostraBanner`,
       que a funcao local aqui dentro sombreia) e entrega o `_seguir` como o
       botao. A peca continua so avisando que acabou; quem manda no caminho
       segue sendo o motor — mas com a comemoracao no meio. */
    function mostraBanner(msg, cb){
      if(typeof festa === "function") festa();
      /* ⚠️⚠️ LICAO PAGA (Teatro, ago/2026), o Marcos jogando: uma fase fechava
         com um "QUADRADO GRANDE desconfigurado" em vez do aviso fininho das
         outras. Causa: 7 pecas (pintar, pintar-canvas, memoria, sete-erros,
         achar-na-cena, camadas-mapa, tracar-caminho) mandam no aviso de fim
         `<div class="medal">★</div>`. No motor a `.medal` e a MEDALHA DE 190px
         do FIM da atividade (imagem do mascote), entao o motor inflava aquilo
         num quadradao verde vazio com uma estrelinha. O aviso de FASE nao leva
         medalha — o motor ja comemora com confete. Tiro a medalha do aviso de
         fase aqui (conserto central: pega as 7 de uma vez). */
      if(msg) msg = msg.replace(/<div[^>]*class=["']?[^"'>]*medal[^"'>]*["']?[^>]*>[\s\S]*?<\/div>/gi, "");
      if(typeof window.mostraBanner === "function"){
        window.mostraBanner(msg || "Muito bem!", _seguir); return;
      }
      setTimeout(_seguir, 420);
    }
    /* ⚠️⚠️ LICAO PAGA (ago/2026), e foi o Marcos quem ouviu: *"onde tenho que
       ouvir a palavra nao funciona; o enunciado funciona, os sons das opcoes
       funcionam"*. So o botao OUVIR A PALAVRA era mudo.
       A causa: a peca sozinha nao tem gravacao nenhuma, entao ela fala pela
       VOZ ROBO do navegador (`speechSynthesis`). No PC da escola essa voz
       simplesmente nao existe (nao ha voz pt-BR instalada) — e falha CALADA,
       sem erro nenhum. O enunciado e as opcoes funcionavam porque passam pelo
       motor, que toca MP3 gravado.
       Aqui a ponte reaponta o `diz` da peca para a voz da casa. A conta da
       chave ignora maiusculas (`chaveVoz` faz `toLowerCase`), entao a palavra
       "pao" acha a gravacao feita para "PAO" — a mesma que o alto-falante da
       opcao ja usa. So cai na voz do navegador se nao houver gravacao. */
    var diz = function(txt){
      try{
        /* ⚠️⚠️ LICAO PAGA (ago/2026), e foi o Marcos quem OUVIU: *"o da padaria
           agora e falado duas vezes juntos, soa estranho"*.
           Varias pecas ganharam, no mesmo dia, a boa ideia de NARRAR SOZINHAS ao
           abrir — porque na bancada, sem motor, a fase ficava muda. So que dentro
           da atividade quem narra o balao e o MOTOR, sempre narrou. As duas vozes
           partiam juntas e se atropelavam.
           A peca nao tem como saber se esta na bancada ou na atividade; quem sabe
           e a ponte. Entao e AQUI que se decide: se o texto pedido e o mesmo que o
           motor ja esta dizendo (ou acabou de dizer, na meia janela de abertura da
           fase), a peca cala — o motor ja cumpriu o pedido dela. Qualquer outra
           fala (a palavra, a silaba, a dica) passa normalmente. */
        var _limpa = function(s){ return String(s||"").replace(/<[^>]*>/g," ")
          .replace(/&[a-z]+;|&#\d+;/gi," ").replace(/\s+/g," ").trim().toLowerCase(); };

        var k = (typeof temVoz === "function") ? temVoz(txt) : null;
        if(k && typeof tocaVoz === "function"){ tocaVoz(k); return; }
        if(!window.speechSynthesis || !window.SpeechSynthesisUtterance) return;

        u.lang = "pt-BR"; u.rate = .9; u.pitch = 1.05;
        window.speechSynthesis.cancel(); window.speechSynthesis.speak(u);
      }catch(e){}
    };

function diz(txt){

function pecaMemoria(){

  var c=el("div","centro");
  c.appendChild(el("div","selo","MEM&Oacute;RIA DOS PARES"));
  /* ⚠️ o balao NAO muda durante a fase: o olheiro do integrador narra o balao
     toda vez que ele muda, e trocar o texto para avisar da espiada faria a voz
     falar duas coisas seguidas. O aviso da espiada vai no `.hint`.          */
  /* balão conforme o modo: par de imagens (1º ano) x palavra×significado */
  var soImg=true, _pi;
  for(_pi=0;_pi<PARES.length;_pi++){ if(PARES[_pi].pal||PARES[_pi].sen){ soImg=false; break; } }
  c.appendChild(el("div","balao", soImg
    ? "Ache as <b>figuras iguais</b>."
    : "Ache a <b>palavra</b> e o <b>desenho que combina</b>."));

  /* monta as 8 cartas: metade palavra, metade significado.
     Cada uma leva a SUA figura — as duas do par sao desenhos diferentes. */
  cartas=[];
  var i;
  for(i=0;i<PARES.length;i++){
    cartas.push({k:PARES[i].k,tipo:"pal",txt:PARES[i].pal,
                 fig:PARES[i].fig,img:PARES[i].img,voz:PARES[i].voz||PARES[i].pal});
    cartas.push({k:PARES[i].k,tipo:"sen",txt:PARES[i].sen,
                 fig:PARES[i].figsen,img:PARES[i].imgsen,voz:PARES[i].vozsen||PARES[i].sen});
  }
  baguncar(cartas);

  var mesa=el("div","m2_mcartas");
  /* QUEDA: sem 3D no navegador, a carta troca de face em vez de girar */
  if(!temTresD()) mesa.className="m2_mcartas sem3d";
  for(i=0;i<cartas.length;i++){ mesa.appendChild(fazCarta(cartas[i])); }

function temTresD(){
  var s=document.body.style;
  return ("transformStyle" in s)||("webkitTransformStyle" in s)||("MozTransformStyle" in s);
}

/* ⭐ A ESPIADA. As cartas NASCEM com a classe `vira` (ver `fazCarta`), ou seja,
   a primeira pintura ja sai de cara para cima — sem animacao no meio, que e o
   que deixava o auditor de contraste fotografar uma carta girando. Depois de
   TEMPO_ESPIADA elas viram, e AI a animacao acontece na frente da crianca.
   Enquanto isso `travado` esta ligado: toque nenhum conta.                  */
function espiada(){
  var g=ger;
  setTimeout(function(){
    if(g!==ger) return;                       /* a fase ja foi trocada */
    var i;
    for(i=0;i<cartas.length;i++){
      if(cartas[i].el.className.indexOf("par")<0) cartas[i].el.className="mcarta";
    }
    travado=false;
    if(elHint) elHint.innerHTML="Toque em duas cartas. Se n&atilde;o formar par, elas voltam.";
  },TEMPO_ESPIADA);
}

/* a figura da carta: arte de IA quando a atividade a tem, senao o desenho
   embutido da peca. Nunca fica vazia — e ela o apoio de quem nao le. */
function figuraDe(o){
  var d=el("div","mfig","");
  if(o.img && typeof imgEl==="function"){ d.className="mfig mfoto"; d.appendChild(imgEl(o.img)); return d; }
  if(o.fig && ARTE[o.fig]) d.style.backgroundImage=imgSvg(o.fig);
  return d;
}

function fazCarta(o){
  /* nasce VIRADA por causa da espiada; `espiada()` a devolve para baixo.
     ⭐ tpal = carta com FOTO+palavra; tsen = carta-LEGENDA (so a frase). O tipo
     vira classe para a legenda ganhar cara de legenda de jornal (ver CSS) em
     vez de parecer "imagem faltando" (o Marcos pegou, ago/2026). */
  var d=el("div","mcarta m2_vira "+(o.tipo==="pal"?"tpal":"tsen"));
  d.setAttribute("data-qa",o.k);          /* para o auditor conferir os pares */
  /* ⭐ QUEM SABE O QUE A VOZ DEVE DIZER E A PECA (mesma licao do `ouvir-achar`):
     o motor montaria a chave a partir do texto visivel, e aqui dentro ha a
     etiqueta ("PALAVRA") junto — a conta sairia errada e a voz, muda.      */
  d.setAttribute("data-voz",o.voz);
  var f=el("div","mflip");
  var v=el("div","mface mverso");
  v.style.backgroundImage=VERSO;
  var fr=el("div","mface mfrente");
  var cnt=el("div","mcnt","");
  /* ⭐ NOME × IMAGEM (pedido do Marcos, ago/2026, Cidade dos Sólidos): o par
     pode ser a PALAVRA numa carta e a IMAGEM na outra. Entao a figura so entra
     quando a carta REALMENTE tem figura (img de IA ou desenho embutido); a
     carta so-palavra fica LIMPA, sem caixa de figura vazia (era "imagem
     faltando"). As memorias palavra×significado seguem iguais (tem os dois). */
  var temFig=(o.img && typeof imgEl==="function")||(o.fig && ARTE[o.fig]);
  if(temFig) cnt.appendChild(figuraDe(o));
  if(o.txt){
    var et=(o.tipo==="pal")?"PALAVRA":"QUER DIZER";
    var tx=el("div",(o.tipo==="pal")?"mtxt":"mtxt msent",
              '<i class="meti">'+et+'</i>'+o.txt);
    if(!temFig) tx.className+=" mso";   /* palavra sozinha: centra na carta */
    cnt.appendChild(tx);
  }else if(temFig){
    d.className+=" mfoto";   /* carta só-imagem: o CSS dá mais espaço à figura */
  }
  fr.appendChild(cnt);
  /* O ALTO-FALANTE: so aparece com a carta virada (CSS), e NAO joga. */
  var z=el("button","zap","");
  z.appendChild(el("i","fone",""));
  /* ⚠️ LICAO PAGA (ago/2026): sem `data-voz` o motor descobre o que falar
     LENDO a tela — e a carta tem o rotulo ("PALAVRA") coladinho no valor
     ("MALA"). O alto-falante pedia a gravacao de "PALAVRAMALA", que nunca
     existiu. A peca sabe o que quer dizer: ela tem que DECLARAR. */
  z.setAttribute("data-voz", o.voz);
  z.setAttribute("aria-label","Ouvir "+o.txt);
  z.onclick=(function(carta){ return function(ev){
    var e=ev||window.event;
    if(e.stopPropagation) e.stopPropagation(); else e.cancelBubble=true;
    sPing(); diz(carta.voz);
  }; })(o);
  fr.appendChild(z);
  f.appendChild(v); f.appendChild(fr);
  d.appendChild(f);
  o.el=d;
  d.onclick=(function(carta){ return function(){ tocar(carta); }; })(o);
  return d;
}

function atualiza(){
  var i,p;
  elPlacar.innerHTML="Pares: <b>"+feitos+"</b> de <b>"+PARES.length+"</b>";
  elPares.innerHTML="";
  for(i=0;i<PARES.length;i++){
    p=el("span","ppt");
    if(i<feitos) p.className="ppt m2_on";
    elPares.appendChild(p);
  }
  if(progI) progI.style.width=Math.round(feitos*100/PARES.length)+"%";
}

function tocar(o){
  if(travado) return;
  /* carta ja fechada: nao joga mais, mas CONTINUA FALANDO — quem nao le usa as
     cartas ja ganhas para conferir o que aprendeu. */
  if(o.el.className.indexOf("par")>=0){ sTap(); diz(o.voz); return; }
  if(virada===o) return;
  /* ⚠️ LICAO PAGA (ago/2026): aqui era `if(...vira...) return;` — carta virada
     nao se toca. So que se sobrar UMA carta de cara para cima que a peca nao
     esta mais seguindo em `virada` (qualquer descompasso entre o desenho e a
     memoria do jogo), ela vira uma carta MORTA: nunca mais aceita toque, e a
     fase nao fecha NUNCA. A crianca fica com dois quadradinhos na tela sem
     conseguir juntar o ultimo par. Foi assim que o auditor-jogador ficou preso
     com 3 de 4 pares fechados.
     Agora a carta orfa e ADOTADA: se esta virada e ninguem a segura, ela passa
     a ser a carta da vez. Nao ha estado do qual a crianca nao consiga sair.  */
  if(o.el.className.indexOf("m2_vira")>=0){
    if(!virada){ virada=o; }
    return;
  }
  o.el.className="mcarta m2_vira";
  sVira();
  diz(o.voz);                 /* ⭐ tocar a carta FALA o que esta escrito nela */
  if(!virada){ virada=o; return; }
  tentativas++;
  if(virada.k===o.k){ fechaPar(virada,o); virada=null; return; }
  /* nao formou par: as duas voltam. Erro NUNCA pune — so devolve. */
  travado=true;
  var a=virada; virada=null;
  var g=ger;
  setTimeout((function(x,y){ return function(){
    if(g!==ger) return;                       /* a fase ja foi trocada */
    if(x.el.className.indexOf("par")<0) x.el.className="mcarta";
    if(y.el.className.indexOf("par")<0) y.el.className="mcarta";
    travado=false;
    ajuda(tentativas);
  }; })(a,o),TEMPO_VOLTA);
}

function fechaPar(a,b){
  a.el.className="mcarta m2_vira par";
  b.el.className="mcarta m2_vira par";
  a.el.appendChild(el("div","vpar","&#10003;"));
  b.el.appendChild(el("div","vpar","&#10003;"));
  a.el.removeAttribute("data-qa");
  b.el.removeAttribute("data-qa");
  sPar();
  confete(20);        /* ⭐ estouro pequeno a cada par (a festa grande fica no fim) */
  feitos++;
  atualiza();
  if(feitos===PARES.length) setTimeout(fim,800);
}

/* ⭐⭐ O ANDAIME QUE CRESCE — e que NAO DEPENDE DE LER.
   A cada PASSO_AJUDA tentativas sem par ele ajuda mais:
     1a vez — a peca FALA a palavra de um par que ainda falta (so ouvido);
     2a vez — ela ABRE uma carta e a deixa escolhida: so falta achar o par dela;
     3a vez — abre o par inteiro.
   ⚠️ o texto da dica existe para o professor e para quem ja le; o que faz o
   degrau funcionar para o 1o ano e a VOZ e a CARTA ABERTA, nunca a frase. */
function ajuda(n){
  if(n%PASSO_AJUDA!==0) return;
  var vez=n/PASSO_AJUDA, alvo=proximoPar();
  if(!alvo) return;
  /* ⚠️ LICAO PAGA (Lojinha, ago/2026): no modo SO-IMAGEM (1o ano) a carta nao
     tem `pal`/`sen` — as dicas montavam "Abri uma para voce: undefined". A
     carta tem `voz` ("1 real"): use-a como rotulo falado; e sem `pal` a frase
     nao cita rotulo nenhum. */
  var soI = !(alvo.pal || alvo.sen);
  var rot = alvo.pal || alvo.voz || "";
  var rot2 = alvo.sen || alvo.vozsen || rot;
  if(vez===1){
    if(soI){ mostraDica("Ou&ccedil;a: <b>"+rot+"</b>. Ache a <b>figura igual</b>."); }
    else   { mostraDica("Ou&ccedil;a: <b>"+rot+"</b>. Ache o desenho que combina."); }
    diz(rot);
  }else if(vez===2){
    if(soI){ mostraDica("Abri uma para voc&ecirc;. Ache a <b>figura igual</b>."); }
    else   { mostraDica("Abri uma para voc&ecirc;: <b>"+rot+"</b>. Ache o par dela."); }
    abreUma(alvo.k);
  }else{
    if(soI){ mostraDica("Vou abrir este <b>par de figuras iguais</b>."); }
    else   { mostraDica("Vou abrir este par: <b>"+rot+"</b> &mdash; "+rot2+"."); }
    abrePar(alvo.k);
  }
}
function proximoPar(){
  var i,j;
  for(i=0;i<PARES.length;i++){
    for(j=0;j<cartas.length;j++){
      if(cartas[j].k===PARES[i].k && cartas[j].el.className.indexOf("par")<0) return PARES[i];
    }
  }
  return null;
}
/* 2o degrau: abre UMA carta do par e a deixa como a carta da vez. A crianca sai
   de "dois desconhecidos" para "um alvo so" — que e o que a memoria dela
   aguenta. Reusa o estado normal do jogo (`virada`), entao nao ha caminho
   novo por onde a peca possa travar. */
function abreUma(k){
  var i,a=null;
  for(i=0;i<cartas.length;i++){
    if(cartas[i].k===k && cartas[i].el.className.indexOf("par")<0){ a=cartas[i]; break; }
  }
  if(!a) return;
  if(virada && virada!==a && virada.el.className.indexOf("par")<0) virada.el.className="mcarta";
  a.el.className="mcarta m2_vira";
  virada=a;
  sVira(); diz(a.voz);
}
function abrePar(k){
  var i,a=null,b=null;
  for(i=0;i<cartas.length;i++){ if(cartas[i].k===k){ if(!a) a=cartas[i]; else b=cartas[i]; } }
  if(!a||!b) return;
  if(virada){ if(virada.el.className.indexOf("par")<0) virada.el.className="mcarta"; virada=null; }
  fechaPar(a,b);
}

MEC["ordenar"] = function(f, cen, fim){
  cen.className = cen.className + " mec-ordenar";
  /* ⚠️⚠️ LICAO PAGA, e a mais silenciosa de todas: a peca da MEMORIA declara a
     PROPRIA `function fim()`. Como o corpo dela entra dentro do fechamento, esse
     `fim` SOMBREAVA o parametro da ponte — e o `mostraBanner` daqui, que devia
     levar a fase seguinte, chamava a peca de volta. Laco infinito, sem erro de
     JS nenhum: o jogador so ficava PRESO, com todos os pares ja fechados e a
     medalha da peca na tela. Por isso a continuacao mora AQUI FORA, com um nome
     que o integrador confere que nenhuma peca usa (ver `confere_contra_motor`).
     E ela so dispara UMA vez: peca que chama o banner duas vezes pularia fase. */
  var _seguir = function(){ if(_seguir.ja) return; _seguir.ja = 1; fim(); };
  /* recolhe o enunciado da fase assim que a peca puser o balao dela (ver CSS) */
  setTimeout(function(){
    var b = cen.getElementsByClassName("pecabox")[0];
    if(b && b.getElementsByClassName("balao").length)
      cen.className = cen.className + " tembalaopeca";
  }, 120);
  (function(){
    /* a peca acha que esta sozinha; estes ajudantes fazem o meio de campo */
    var app = cen;
    /* o `ac()` DESTA peca: destrava o som (o motor chama isso de `arma()`) e
       devolve o AudioContext do motor. Fica local, dentro do fechamento, para
       nao brigar com o `var ac` do motor — que e o objeto, nao a funcao. */
    function ac(){ if(typeof arma === "function") arma(); return window.ac; }
    function limpa(){ var g = cen.getElementsByClassName("pecabox")[0];
      if(g) g.innerHTML = ""; else { g = document.createElement("div");
      g.className = "pecabox"; cen.appendChild(g); } app = g; }
    /* ⚠️ LICAO PAGA: este ajudante era um VAZIO — "quem manda na barra e o
       motor". So que o caca-palavras faz `setProg(t,0)` e depois PEGA A BARRA
       DE VOLTA (`t.getElementsByTagName("i")[0]`) para mostrar quantas palavras
       ja achou. Com o vazio, ele pegava `undefined` e estourava no primeiro
       toque: 446 erros de JS numa partida. Regra: o ajudante da ponte tem que
       FAZER o que o de verdade faz — nao pode so nao atrapalhar.
       A barra da PECA e a de dentro da fase (5 palavras achadas de 8); a do
       MOTOR e a da atividade (fase 4 de 32). As duas informam coisas
       diferentes, entao as duas ficam — a de dentro, menorzinha (ver CSS). */
    function setProg(t, p){
      if(!t || !t.appendChild) return;
      var pr = document.createElement("div"); pr.className = "prog progpeca";
      var i = document.createElement("i"); i.style.width = (p || 0) + "%";
      pr.appendChild(i); t.appendChild(pr);
    }
    /* ⚠️⚠️ LICAO PAGA (ago/2026), pega pelo Marcos JOGANDO: *"esta passando de
       fase sem aquele botao azul que aparecia com a palavra proximo... tem que
       ser parecida com a atividade do Broto"*.

       Esta ponte comemorava e PULAVA para a fase seguinte sozinha, 420ms
       depois. A crianca terminava uma fase e era JOGADA na outra: sem a tela de
       parabens, sem o mascote dizendo o que ela conseguiu, sem o botao para ela
       decidir quando seguir. No Broto — que e o modelo — cada fase fecha com o
       banner e a crianca TOCA para continuar. Era o fecho de toda fase de toda
       atividade montada que estava faltando.

       Agora a ponte chama o banner DE VERDADE do motor (`window.mostraBanner`,
       que a funcao local aqui dentro sombreia) e entrega o `_seguir` como o
       botao. A peca continua so avisando que acabou; quem manda no caminho
       segue sendo o motor — mas com a comemoracao no meio. */
    function mostraBanner(msg, cb){
      if(typeof festa === "function") festa();
      /* ⚠️⚠️ LICAO PAGA (Teatro, ago/2026), o Marcos jogando: uma fase fechava
         com um "QUADRADO GRANDE desconfigurado" em vez do aviso fininho das
         outras. Causa: 7 pecas (pintar, pintar-canvas, memoria, sete-erros,
         achar-na-cena, camadas-mapa, tracar-caminho) mandam no aviso de fim
         `<div class="medal">★</div>`. No motor a `.medal` e a MEDALHA DE 190px
         do FIM da atividade (imagem do mascote), entao o motor inflava aquilo
         num quadradao verde vazio com uma estrelinha. O aviso de FASE nao leva
         medalha — o motor ja comemora com confete. Tiro a medalha do aviso de
         fase aqui (conserto central: pega as 7 de uma vez). */
      if(msg) msg = msg.replace(/<div[^>]*class=["']?[^"'>]*medal[^"'>]*["']?[^>]*>[\s\S]*?<\/div>/gi, "");
      if(typeof window.mostraBanner === "function"){
        window.mostraBanner(msg || "Muito bem!", _seguir); return;
      }
      setTimeout(_seguir, 420);
    }
    /* ⚠️⚠️ LICAO PAGA (ago/2026), e foi o Marcos quem ouviu: *"onde tenho que
       ouvir a palavra nao funciona; o enunciado funciona, os sons das opcoes
       funcionam"*. So o botao OUVIR A PALAVRA era mudo.
       A causa: a peca sozinha nao tem gravacao nenhuma, entao ela fala pela
       VOZ ROBO do navegador (`speechSynthesis`). No PC da escola essa voz
       simplesmente nao existe (nao ha voz pt-BR instalada) — e falha CALADA,
       sem erro nenhum. O enunciado e as opcoes funcionavam porque passam pelo
       motor, que toca MP3 gravado.
       Aqui a ponte reaponta o `diz` da peca para a voz da casa. A conta da
       chave ignora maiusculas (`chaveVoz` faz `toLowerCase`), entao a palavra
       "pao" acha a gravacao feita para "PAO" — a mesma que o alto-falante da
       opcao ja usa. So cai na voz do navegador se nao houver gravacao. */
    var diz = function(txt){
      try{
        /* ⚠️⚠️ LICAO PAGA (ago/2026), e foi o Marcos quem OUVIU: *"o da padaria
           agora e falado duas vezes juntos, soa estranho"*.
           Varias pecas ganharam, no mesmo dia, a boa ideia de NARRAR SOZINHAS ao
           abrir — porque na bancada, sem motor, a fase ficava muda. So que dentro
           da atividade quem narra o balao e o MOTOR, sempre narrou. As duas vozes
           partiam juntas e se atropelavam.
           A peca nao tem como saber se esta na bancada ou na atividade; quem sabe
           e a ponte. Entao e AQUI que se decide: se o texto pedido e o mesmo que o
           motor ja esta dizendo (ou acabou de dizer, na meia janela de abertura da
           fase), a peca cala — o motor ja cumpriu o pedido dela. Qualquer outra
           fala (a palavra, a silaba, a dica) passa normalmente. */
        var _limpa = function(s){ return String(s||"").replace(/<[^>]*>/g," ")
          .replace(/&[a-z]+;|&#\d+;/gi," ").replace(/\s+/g," ").trim().toLowerCase(); };
        var _agora = _limpa(txt);
        if(_agora && window.__dizMotor && window.__dizMotor === _agora) return;
        try{
          var _b = document.getElementsByClassName("balao")[0];
          if(_b && _limpa(_b.textContent) === _agora){
            window.__dizMotor = _agora;
            setTimeout(function(){ window.__dizMotor = null; }, 1200);
            return;
          }
        }catch(_e){}
        var k = (typeof temVoz === "function") ? temVoz(txt) : null;
        if(k && typeof tocaVoz === "function"){ tocaVoz(k); return; }
        if(!window.speechSynthesis || !window.SpeechSynthesisUtterance) return;
        var u = new SpeechSynthesisUtterance(txt);
        u.lang = "pt-BR"; u.rate = .9; u.pitch = 1.05;
        window.speechSynthesis.cancel(); window.speechSynthesis.speak(u);
      }catch(e){}
    };
    limpa();

/* ====== A PEÇA COMEÇA AQUI ====== */
/* ORDENAR — a crianca poe 5 fichas em ordem, do MENOR para o MAIOR.
   Conteudo neutro de proposito: numero e o mesmo em qualquer disciplina.
   Trocar `ORDEM` (e o texto do balao) ja adapta a peca a outro conteudo,
   desde que a lista continue tendo UMA ordem certa e so uma. */
/* ⭐⭐ CADA FICHA PODE SER SÓ O VALOR **OU** UMA FIGURA (ago/2026, ordem do
   Marcos: *"as dinâmicas interativas têm que ser mais VISUAIS e SONORAS para os
   pequenos"*). Os dois formatos valem, e é de propósito:

     var ORDEM=[2,5,9,14,21];                    <- como sempre foi
     var ORDEM=[{v:1, img:"xx_formiga", nome:"FORMIGA"},
                {v:2, img:"xx_gato",    nome:"GATO"}];   <- com desenho e voz
     (o `xx_` do exemplo e de proposito: citar o nome de arte de OUTRA
      atividade, mesmo dentro de um comentario, faz o portao de resto-de-clone
      acusar prefixo alheio — e ele esta certo, porque comentario viaja junto)

   · v    — o valor que manda na ORDEM (é por ele que a peça confere)
   · img  — o nome da figura (img/<img>.png). A criança do 1º ano não lê:
            ordenar bichos do menor para o maior só faz sentido VENDO o bicho
   · nome — o que está escrito embaixo e o que o alto-falante DIZ

   ⚠️ O formato antigo continua valendo palavra por palavra — as fases que já
   existem (`[2,5,9,14,21]`, `["A","B","C","D","E"]`) não mudam em nada. É por
   isso que o exemplo aqui embaixo continua sendo o dos números: peça que muda
   de formato quebra a atividade que já está no ar. */
var ORDEM=[2,5,9,14,21];
/* ⭐ O TEXTO DA PECA E CONTEUDO, NAO MOLDE (licao paga ago/2026).
   Esta peca compara por POSICAO NA LISTA (`b.num===ORDEM[vagaAtual]`), entao
   ela ja servia para letras — `ORDEM=["A","B","C"]` funciona. So que o balao
   dizia, fixo, "da menor para a maior": a crianca do 1o ano ia ler isso na fase
   do ALFABETO. Numa atividade montada o enunciado da fase fica escondido quando
   a peca poe o balao dela, entao seria essa a unica instrucao na tela — e
   estaria errada. Agora o texto vem na gaveta e acompanha o conteudo. */
/* ⚠️ E AS DICAS TAMBÉM SÃO CONTEÚDO — a mesma lição, pega de novo (ago/2026).
   O balão já tinha saído do corpo, mas os TRÊS degraus do andaime continuavam
   cravados dizendo *"procure a MENOR de todas"*. Na fase do ALFABETO
   (`ORDEM=["A","B","C","D","E"]`, que existe e está no ar) a criança erra, pede
   ajuda, e a ajuda fala de tamanho — sobre letras. Agora elas moram aqui, e
   quem troca o conteúdo troca a ajuda junto.
   ⚠️ Escrito com acento de verdade, não com `&#225;`: este texto é FALADO, e a
   gravação é feita a partir do próprio texto. Entidade HTML na fala vira uma
   chave que não existe — e o botão fica mudo. */
var ORDTXT={selo:"EM ORDEM",
            balao:"Ponha as fichas <b>da menor para a maior</b>.",
            hint:"Toque na ficha ou arraste até a fila.",
            d:["Olhe as fichas soltas e procure a <b>menor</b> de todas.",
               "A menor que sobrou está <b>piscando</b>. Toque nela.",
               "Era esta! Vamos juntos: eu coloco e você segue."],
            fim:"Fila pronta! Da menor para a maior."};
var vagaAtual=0, errosSeg=0, telaAtual=null, barraP=null;
var pecas=[], camas=[];
/* a FIGURA vem do MOTOR (`imgEl`, que sabe onde mora a pasta `img/`). Na
   bancada ela não existe e a peça escreve o nome no lugar — nunca um
   quadradinho vazio, que é pior que figura nenhuma. Pegar por `window.imgEl`
   (e não por `typeof`) deixa o nome DECLARADO: se um dia o motor trocar essa
   ferramenta de nome, o portão "função que não existe" avisa em vez de a
   figura sumir calada. */
var figEl = window.imgEl || null;

/* ---------- ler a ficha, venha ela como valor ou como objeto ---------- */
function ehObj(it){ return it!==null && typeof it==="object"; }
function valDe(it){ return ehObj(it) ? it.v : it; }
function imgDe(it){ return ehObj(it) ? (it.img||it.fig||"") : ""; }
function nomeDe(it){ return ehObj(it) ? (it.nome||"") : ""; }
/* o que a voz diz desta ficha: o nome, se a fase deu um. Número solto não vira
   voz — não há gravação para "14", e botão mudo é pior que botão nenhum. */
function vozDe(it){ return nomeDe(it); }

/* ⚠️⚠️ A VOZ É GRAVADA, SEMPRE. Quem fala é o motor: a ponte do integrador
   injeta um `diz(txt)` que toca o MP3 do Edge TTS. Aqui NUNCA se chama
   `speechSynthesis` — no PC da escola essa voz não existe e falha CALADA (o
   portão `_qa/vozrobo.py` mede isso). Sozinha na bancada a peça fica sem voz,
   e continua inteira: tudo o que a voz diz também está escrito e desenhado. */
var _vozTxt="", _vozQuando=0;
function voz(txt){
  if(!txt) return;
  var t=String(txt).replace(/<[^>]+>/g,""), agora=(new Date()).getTime();
  /* sem eco: a mesma ficha é dita ao ser PEGA e ao ser POSTA, e tocar o mesmo
     mp3 de novo o reinicia — a criança ouve a palavra picada. */
  if(t===_vozTxt && agora-_vozQuando<1000) return;
  _vozTxt=t; _vozQuando=agora;
  if(typeof diz==="function") diz(t);
}
/* a dica falada espera meio segundo: a criança acabou de ouvir o nome da ficha
   que pegou, e falar por cima corta justamente a voz que ela pediu. */
function dizDica(txt){
  var t=telaAtual;
  setTimeout(function(){ if(!t||!t.parentNode) return; voz(txt); },520);
}

/* ---------- o corpo da ficha: figura + nome + valor ---------- */
function corpoFicha(it, dentro){
  var im=imgDe(it), nm=nomeDe(it);
  if(im){
    var f=el("div","ofig");
    /* ⚠️ FIGURA QUE NÃO EXISTE NÃO VAI PARA A TELA (regra da casa): quadradinho
       vazio é pior que figura nenhuma. Na bancada, onde o motor não está, o
       lugar da figura mostra o VALOR — e nunca o nome, que já está escrito
       logo abaixo (o mesmo texto duas vezes na mesma ficha é sujeira). */
    if(figEl){ f.appendChild(figEl(im)); }
    else { f.appendChild(el("div","semfig", ""+valDe(it))); }
    dentro.appendChild(f);
    if(nm) dentro.appendChild(el("span","onom", nm));
    return;
  }
  /* ⚠️ LICAO PAGA (Teatro das Palavras, ago/2026): sem figura, a ficha e de
     TEXTO — uma CENA da historia ("Tico subiu ao palco."). Mostra o NOME, nunca
     o valor cru: com so "1/2/3" a crianca ordena os numeros sem LER as cenas, e
     o balao ja pede "coloque as cenas na ordem". So cai no valor quando nao ha
     nem figura nem nome (ordenar numerico puro, do menor para o maior). */
  if(nm){ dentro.className+=" txt"; dentro.appendChild(el("span","onom otexto", nm)); }
  else { dentro.appendChild(el("span","oval", ""+valDe(it))); }
}
/* ⚠️ o guarda do MOUSE FANTASMA: o celular dispara mousedown/click DEPOIS do
   toque. Sem esta marca de tempo a peca era acionada duas vezes (o toque
   colocava e o fantasma tentava colocar de novo). */
var ultimoToque=0, pego=null, somb=null, px0=0, py0=0, moveu=false;

function telaOrdenar(){
  limpa(); document.onkeydown=null; soltaSombra();
  vagaAtual=0; errosSeg=0; pecas=[]; camas=[];
  var t=el("div","tela"); telaAtual=t; setProg(t,0);
  barraP=t.querySelector(".prog i");

/* ⭐ O ALTO-FALANTE DA FICHA. Ele NÃO escolhe: só fala — sem isto, tocar no
   alto-falante para conferir o nome valia como resposta e a criança levava um
   erro por ter querido ouvir. E `data-voz` DECLARA o texto: assim o motor não
   precisa adivinhar pelo que está escrito dentro do cartão. */
function poeFalante(b, it){
  var t=vozDe(it);
  if(!t) return;
  var z=el("button","zap","");
  z.type="button";
  z.appendChild(el("i","fone",""));
  z.setAttribute("aria-label","Ouvir "+t);
  z.setAttribute("data-voz", t);

     como RESPOSTA e a criança que só queria conferir o nome leva um erro.
     Segurar só o `click` não basta: o `mousedown` e o `touchend` da ficha
     resolvem sozinhos (é o arrasto), e são eles que precisam ser barrados. */
  z.onmousedown=paraAqui;
  z.addEventListener("touchstart",paraAqui,false);
  z.addEventListener("touchend",function(ev){
    paraAqui(ev); ultimoToque=Date.now(); falaFicha(t);

 {selo:"OU&Ccedil;A COM CUIDADO", alvo:"arvore", opcoes:["arvore","flor","casa","chave"],

var rodada=0, R=null, erros=0, travada=false, revelando=false;
var ger=0, progVisto=0, acertosDePrimeira=0;
var elAviso=null, elCont=null, progI=null, cartoes=[];

/* ⚠️⚠️ A VOZ — E ELA E SEMPRE GRAVADA.
   Esta funcao NAO fala: ela entrega o texto ao `diz(...)` que a ponte do
   integrador injeta antes do corpo da peca, e que toca o MP3 da casa (Edge
   TTS). Nao ha voz-robo do navegador aqui, e nao pode haver: a ponte desliga a voz
   do navegador em tres camadas, e foi assim que o botao OUVIR desta peca ficou
   MUDO na mao do Marcos, no meio de tudo o mais funcionando. O portao
   `_qa/vozrobo.py` mede isso agora.
   A guarda `typeof diz==="function"` e obrigatoria: na bancada a peca roda
   sozinha, sem ponte e sem gravacao, e chamar direto estouraria na 1a tela.
   As etiquetas saem do texto porque a chave da voz e feita do TEXTO VISIVEL —
   "<b>SOL</b>" e "SOL" tem que dar na mesma gravacao. */
/* ⚠️⚠️ DEFEITO PEGO NA BANCADA, simulando a ponte (ago/2026), e ele teria
   chegado MUDO na crianca: o texto da peca vem com ENTIDADE de HTML
   ("Ou&#231;a a palavra", "at&#233;", "Voc&#234;"). Tirar so as etiquetas com
   uma expressao deixava a entidade crua, e a CHAVE DA GRAVACAO e feita do
   TEXTO: "Ou&#231;a..." nunca bate com o mp3 gravado para "Ouca...". Resultado
   seria o de sempre — botao que nao fala, sem erro nenhum no console.
   O jeito honesto de virar entidade em letra e deixar o NAVEGADOR ler: um
   elemento solto, `innerHTML` de um lado e `textContent` do outro. De quebra
   ele tira as etiquetas sozinho, sem expressao para errar. */
function textoDe(html){
  var d=document.createElement("div");
  d.innerHTML=String(html);
  var t=d.textContent||d.innerText||"";
  return t.replace(/\s+/g," ").replace(/^ | $/g,"");
}
function fala(txt){
  if(!txt) return;
  var t=textoDe(txt);
  if(!t) return;
  if(typeof diz==="function") diz(t);
}
/* ⭐ A SEGUNDA VOZ ESPERA A PRIMEIRA. O enunciado e a palavra tocam na mesma
   tela, um atras do outro; com relogio fixo a palavra entrava POR CIMA do
   enunciado e a crianca perdia os dois (e o mesmo defeito que o portao
   `vozintro.py` pegou em 27 fases da atividade grande). Aqui a peca olha o
   tocador do motor e so segue quando ele cala. Na bancada nao ha tocador
   nenhum: cai no relogio, e nada e cortado porque nada esta tocando. */
function falaEmSeguida(txt,espera){
  var g=ger, gasto=0;
  /* ⚠️ LICAO PAGA (ago/2026, ingles 9o ano): esta voz atrasada espera o motor
     calar e tenta por ATE 9s. Se a crianca (ou o auditor) troca de FASE nesse
     meio, o `ger` da PECA nao muda — quem trocou foi o MOTOR — e a fala
     disparava numa fase seguinte, junto com o elogio dela (a banca voz-dupla
     pegou "She is cooking." caindo na fase 13, que nem tem essa frase). Guardo
     tambem a FASE do motor: mudou de fase, a voz da fase anterior morre. */
  var _if=(typeof IFASE!=="undefined")?IFASE:null;
  function som(){ try{ return document.getElementById("vz")||document.getElementById("narr"); }catch(e){ return null; } }
  function tenta(){
    if(g!==ger) return;
    if(_if!==null && typeof IFASE!=="undefined" && IFASE!==_if) return;
    var s=som();
    if(s&&!s.paused&&!s.ended&&gasto<9000){ gasto+=240; setTimeout(tenta,240); return; }
    fala(txt);
  }
  setTimeout(tenta,espera||900);
}
function sVolta(){ nota(392,.10,.11,"sine",0); nota(294,.12,.10,"sine",.08); }
function sPing(){ nota(880,.09,.12,"triangle",0); }

/* ---------------------------------------------------------------
   3) OS DESENHOS — CSS puro, nenhum arquivo externo
   --------------------------------------------------------------- */
/* as OITO figuras que ESTA peca sabe desenhar em CSS. Fora desta lista ela nao
   inventa desenho nenhum — ver o fim de `desenho()`.
   ⚠️ o nome e `ARTE` de proposito: o integrador tem uma lista de nomes que sao
   ARTE ou CONFIGURACAO e que NAO viram gaveta de conteudo no `pecas.json`.
   Batizada `TEMDESENHO`, esta lista aparecia para o montador como se fosse
   conteudo da fase — e nao e: e o que a peca sabe pintar. (O caso inverso ja
   custou caro aqui: o CATALOGO chamava-se `FIG` e sumiu do conteudo, que e
   justamente onde ele PRECISA estar.) */
var ARTE={sol:1,casa:1,bola:1,peixe:1,arvore:1,flor:1,chave:1,lua:1};

function desenho(k){
  var d=el("div","des",""), i, e;
  var F=CATALOGO[k]||{};
  /* ⭐ TRES CAMINHOS, nesta ordem:
     · `img`   — arte de IA (o normal numa atividade de verdade);
     · `texto` — a propria LETRA em corpo grande (fases de alfabeto);
     · senao   — o desenho de CSS das oito figuras de exemplo desta peca.
     ⚠️ E UM QUARTO, QUE FALTAVA E DAVA DEFEITO MUDO: chave que nao e nenhuma
     das tres. O `else` do fim desenhava a LUA — entao uma fase nova com
     `opcoes:["pao","bolo","leite"]` e sem `img` mostrava TRES LUAS iguais, sem
     erro nenhum no console. Agora a peca devolve `null` e o cartao fica so com
     a PALAVRA, em corpo grande (`.oafso`), que e o gemeo escrito de sempre.
     Nenhuma atividade antiga muda: as oito figuras continuam desenhadas. */
  if(F.img){
    if(imgEl){ d.appendChild(imgEl(F.img)); return d; }
    /* na bancada nao existe a pasta `img/`: apontar para um arquivo que nao
       existe poe um QUADRADINHO VAZIO na tela — pior que figura nenhuma, e o
       portao `_qa/imagens.js` reprova com razao. Sem a arte, vale a palavra. */
    return null;
  }
  if(F.texto){ d.appendChild(el("div","destxt", F.texto)); return d; }
  if(!ARTE[k]) return null;
  /* ⚠️ as pecinhas abaixo tem left/top em PIXEL, medidos para 58x58. Elas vao
     TODAS dentro do `.descss`, que tem exatamente esse tamanho — e e o CSS que
     amplia a caixa inteira por escala, sem desmontar o desenho. */
  var caixa=d;              /* o `.des`, que e o lugar no cartao */
  d=el("div","descss","");  /* e a caixa de 58x58 onde os pixels fazem sentido */
  caixa.appendChild(d);
  if(k==="sol"){
    for(i=0;i<8;i++){
      e=el("i","solr","");
      e.style.webkitTransform="rotate("+(i*45)+"deg)";
      e.style.transform="rotate("+(i*45)+"deg)";
      d.appendChild(e);
    }
    d.appendChild(el("i","solc",""));
  }else if(k==="casa"){
    d.appendChild(el("i","ctel","")); d.appendChild(el("i","cpar","")); d.appendChild(el("i","cpor",""));
  }else if(k==="bola"){
    e=el("i","bcir","");
    e.appendChild(el("i","bfai","")); e.appendChild(el("i","bfa2",""));
    e.appendChild(el("i","bcu1","")); e.appendChild(el("i","bcu2",""));
    d.appendChild(e);
  }else if(k==="peixe"){
    d.appendChild(el("i","prab","")); d.appendChild(el("i","pcor","")); d.appendChild(el("i","polh",""));
  }else if(k==="arvore"){
    d.appendChild(el("i","atro","")); d.appendChild(el("i","acop",""));
  }else if(k==="flor"){
    d.appendChild(el("i","fcau",""));
    for(i=0;i<5;i++){
      e=el("i","fpet","");
      e.style.webkitTransform="rotate("+(i*72)+"deg)";
      e.style.transform="rotate("+(i*72)+"deg)";
      d.appendChild(e);
    }
    d.appendChild(el("i","fmio",""));
  }else if(k==="chave"){
    d.appendChild(el("i","kcab","")); d.appendChild(el("i","khas",""));
    e=el("i","kden",""); e.style.left="40px"; d.appendChild(e);
    e=el("i","kden",""); e.style.left="50px"; d.appendChild(e);
  }else{
    d.appendChild(el("i","lua",""));
  }
  return caixa;             /* devolve o `.des`, com o desenho montado dentro */
}
/* a letra do comeco, para o 2o degrau do andaime. Tira o acento (o &Aacute; da
   ARVORE) porque o que a crianca compara e a LETRA, nao o acento. */
/* ⚠️ le por `||{}`: chave desconhecida nao pode ESTOURAR na mao da crianca.
   Ja aconteceu — "Cannot read properties of undefined (reading 'letra')" na
   terceira tela de uma padaria montada. A peca nunca trava. */
function letraDe(k){ var F=CATALOGO[k]||{}; return F.letra || String(F.nome||k).charAt(0); }
function fichaDe(k){ var F=CATALOGO[k]||{}; return {nome:F.nome||String(k).toUpperCase(), voz:F.voz||k}; }

/* ---------------------------------------------------------------
   4) A TELA
   --------------------------------------------------------------- */
function pecaOuvir(){
  limpa();
  R=RODADAS[rodada];
  erros=0; travada=false; revelando=false; cartoes=[]; ger++;
  var t=el("div","tela");
  setProg(t,progVisto);
  progI=t.querySelector(".prog i");
  var c=el("div","centro");
  c.appendChild(el("div","selo",R.selo));
  c.appendChild(el("div","balao",R.enun));

  /* ⭐ A CAIXA DE SOM: o botao GRANDE de ouvir em cima, a palavra ESCRITA
     embaixo (o gemeo visual, que faz a peca funcionar no PC sem caixa de som).
     O botao vem PRIMEIRO de proposito: e por ele que a fase comeca. */
  var sc=el("div","somcard","");
  var bo=el("button","obt","");
  bo.type="button";
  bo.appendChild(el("i","fone",""));
  bo.appendChild(document.createTextNode(TEXTOS.ouvir));
  bo.setAttribute("aria-label",TEXTOS.ouvirLeitor);
  bo.onclick=function(){ tocaAlvo(); };
  sc.appendChild(bo);
  var pb=el("div","palvbox","");
  pb.appendChild(el("div","palvr",R.rotulo));
  if(ESCONDER){
    /* ⭐ AUDICAO DE VERDADE: a frase nasce OCULTA (so o alto-falante e "..."). A
       crianca acha pela orelha. O "Ver a frase" e apoio para quem esta sem som —
       acao deliberada, nao o padrao — entao a acessibilidade continua de pe. */
    var mask=el("div","palv oculto","&#128266; &#8230;");
    pb.appendChild(mask);
    var rev=el("button","vfrase","Ver a frase");
    rev.type="button";
    rev.onclick=function(ev){ var e=ev||window.event; if(e&&e.stopPropagation)e.stopPropagation();
      mask.className="palv"; mask.innerHTML=R.escrito; rev.style.display="none"; };
    pb.appendChild(rev);
  } else {
    pb.appendChild(el("div","palv",R.escrito));
  }
  sc.appendChild(pb);
  c.appendChild(sc);

  /* AS FIGURAS, embaralhadas (na Fabrica de Estrelas a certa era sempre a 1a e
     a crianca aprendeu a POSICAO, nao o conteudo) */
  var box=el("div","opts",""), lista=baguncar(R.opcoes.slice(0)), i;
  for(i=0;i<lista.length;i++) box.appendChild(cartao(lista[i]));
  c.appendChild(box);

  elCont=el("div","cont","Figura <b>"+(rodada+1)+"</b> de <b>"+RODADAS.length+"</b>");
  c.appendChild(elCont);
  elAviso=el("div","aviso","");
  c.appendChild(elAviso);
  c.appendChild(el("div","hint",R.hint+" "+TEXTOS.ouvirDica));
  t.appendChild(c);
  app.appendChild(t);
  /* ⭐⭐ A FASE FALA SOZINHA AO ABRIR. No 1o ano a crianca nao sabe que existe
     um botao para apertar: se a tela nasce calada, ela olha e espera. Primeiro
     o enunciado; assim que ele cala, a PALAVRA — e o botao acende junto, para
     ela aprender de onde veio o som e poder repetir sozinha. */
  fala(R.enun);
  falaEmSeguida(R.fala,1100);
  var g=ger;
  setTimeout(function(){ if(g===ger) acendeOuvir(); },1100);
}
/* o botao pisca junto com a palavra: e assim que a crianca liga o som ao lugar
   onde ele se repete. Some sozinho — nao e estado, e um aceno. */
function acendeOuvir(){
  var b=app.getElementsByClassName("obt")[0];
  if(!b) return;
  var g=ger;
  b.className="obt tocando";
  setTimeout(function(){ if(g!==ger) return;
    var x=app.getElementsByClassName("obt")[0]; if(x) x.className="obt"; },900);
}

function cartao(k){
  /* ⚠️ a classe sai em DUAS partes de proposito. O portao `_qa/dinamicas.py`
     reconhece a familia "escolher" pelo literal `el("div","opt"` — escrito
     com a classe composta ja no `el` (opt mais outra) ele nao reconhece nada, e
     "0 dinamica reconhecida" e
     aprovacao VAZIA: o portao passa sem ter medido a armadilha desta mecanica
     (as opcoes embaralhadas). Esta peca E um escolher, entao ela se apresenta
     como um. */
  var o=el("div","opt","");
  o.className="opt oaf";
  /* ⭐ QUEM SABE O QUE A VOZ DEVE DIZER E A PECA. O motor monta a chave do
     alto-falante a partir do TEXTO da resposta — e aqui dentro ha a letra
     inicial (andaime) e a moldura, entao o texto lido saia "PPAO" em vez de
     "PAO" e a voz nao era encontrada. Declarar e mais honesto do que fazer o
     motor adivinhar. (Defeito que o Marcos ouviu: "os botoes de som nao estao
     funcionando... somente o som do enunciado".) */
  var F=fichaDe(k);
  o.setAttribute("data-voz", F.nome);
  o.appendChild(el("div","ini",letraDe(k)));
  /* ⭐ a FIGURA. Quando a fase nao tem figura para esta chave, `desenho()`
     devolve `null` e o cartao passa a ser SO A PALAVRA, em corpo grande — em
     vez de mostrar um desenho emprestado que nao e daquela palavra. */
  var dz=desenho(k);
  if(dz) o.appendChild(dz);
  else o.className=o.className+" oafso";
  var lin=el("div","linha","");
  lin.appendChild(el("span","nom",F.nome));
  var z=el("button","zap","");
  z.type="button";
  z.appendChild(el("i","fone",""));
  z.setAttribute("aria-label","Ouvir "+F.nome);
  /* ⚠️ o alto-falante NAO escolhe: ele so fala. Sem parar o evento aqui, tocar
     no alto-falante valia como resposta — e a crianca que so queria conferir o
     nome levava um erro. */
  z.onclick=function(ev){
    var e=ev||window.event;
    if(e.stopPropagation) e.stopPropagation(); else e.cancelBubble=true;
    /* ⚠️ a voz da RESPOSTA sai do NOME que esta escrito no cartao, nao de um
       apelido: a chave da gravacao (`op_<chave>.mp3`) e feita do texto visivel,
       e foi por um apelido diferente que os alto-falantes ficaram mudos na
       Padaria. `voz` continua servindo a fase que precise de outra pronuncia. */
    sPing(); fala(F.voz||F.nome);
  };
  lin.appendChild(z);
  o.appendChild(lin);
  o.appendChild(el("div","jat","j&#225; tentamos"));
  o.setAttribute("data-qa", k===R.alvo ? "1" : "0");
  o.onclick=function(){ escolhe(k,o); };
  cartoes.push({k:k,el:o,tentada:false});
  return o;
}
function achaCartao(k){ var i; for(i=0;i<cartoes.length;i++){ if(cartoes[i].k===k) return cartoes[i]; } return null; }

/* ⭐ REPETIR E DIREITO DA CRIANCA: este botao pode ser apertado quantas vezes
   ela quiser, sem custo, sem contar como tentativa e sem tirar o andaime. Quem
   ainda nao segura a palavra na cabeca precisa ouvir tres, quatro vezes — e e
   escutando de novo que ela aprende a escutar. */
function tocaAlvo(){
  sPing();
  fala(R.fala);
  acendeOuvir();
}

/* ---------------------------------------------------------------
   5) A ESCOLHA
   --------------------------------------------------------------- */
function escolhe(k,o){
  if(travada||revelando) return;
  var c=achaCartao(k);
  if(c&&c.tentada){
    /* ⚠️ opcao ja tentada nao responde com SILENCIO nem se distingue so pela
       cor: som de retorno + a etiqueta em palavras que ja esta na tela. */
    sVolta();
    mostraDica("Nesta a gente <b>j&#225; tentou</b>. Escute de novo e escolha outra figura.");
    return;
  }
  if(k===R.alvo){ acertou(o); return; }
  errouUma(c,o);
}
function acertou(o){
  travada=true;                     /* ⚠️ trava NO INSTANTE do toque */
  if(erros===0) acertosDePrimeira++;
  /* ⚠️⚠️ LICAO PAGA (ago/2026), e o Marcos viu no celular: aqui estava
     uma ATRIBUICAO ao className (o cartao inteiro trocado por "opt fig certa"),
     que APAGA as outras classes.
     A classe `oaf` (o cartao de vidro fosco) ia embora junto, e o cartao certo
     perdia a moldura da casa bem no momento em que a crianca olha para ele.
     Classe de ESTADO se ACRESCENTA; nunca se troca o crachá inteiro. */
  if(o.className.indexOf("certa")<0) o.className=o.className+" certa ok";
  sCerto();
  /* ⭐ A COMEMORACAO, que o Marcos cobrou: *"nao tem a comemoracao quando acerta
     como no Broto"*. Antes era so um texto verde. Agora o cartao PULA, a festa
     toca e o restante da tela recua — a crianca sabe que acertou sem ler. */
  chuvinha(o);
  if(elAviso){ elAviso.innerHTML=R.msg; elAviso.className="aviso ver"; }
  fala(R.msg);
  /* ⭐ E O BOTAO PROXIMO, como no Broto: *"tem que ter o botao de proximo"*.
     Quem manda no ritmo e a crianca, nao um relogio de 1,6s — ela quer olhar a
     figura certa, ouvir de novo, e so entao seguir. */
  poeProximo();
}

/* faisquinhas em volta do cartao certo — CSS puro, sem imagem e sem biblioteca,
   e some sozinha. Respeita quem pediu menos animacao. */
function chuvinha(o){
  try{
    if(window.matchMedia&&window.matchMedia("(prefers-reduced-motion:reduce)").matches) return;
    var i,r=o.getBoundingClientRect();
    for(i=0;i<10;i++){
      var f=document.createElement("span");
      f.className="oafaisca";
      f.style.left=(r.left+r.width*(0.15+Math.random()*0.7))+"px";
      f.style.top=(r.top+r.height*(0.2+Math.random()*0.6))+"px";
      f.style.background=["#ffd23f","#7ed957","#ff9f45","#fff"][i%4];
      f.style.webkitAnimationDelay=(i*40)+"ms";
      f.style.animationDelay=(i*40)+"ms";
      document.body.appendChild(f);
      (function(el){ setTimeout(function(){ if(el.parentNode) el.parentNode.removeChild(el); },1100); })(f);
    }
  }catch(e){}
}

function poeProximo(){
  var alvo=document.getElementById("navOA");

   isso ela e anunciada por voz e escrita no crachazinho.

function pegaTinta(i){

function pintaBalde(){

/* ---------------------------------------------------------------
   PINTAR A REGIAO. Nao existe regiao errada: qualquer toque pinta.
   Tocar de novo numa regiao ja pintada TROCA a cor — e por isso a
   crianca pode mudar de ideia sem apagar o desenho inteiro.
   --------------------------------------------------------------- */
function tocouRegiao(ev){
  var z=this, e=ev||window.event;
  if(travada||!z||!z._p) return;
  if(!tinta){
    /* ainda sem tinta na mao. Nao e falta: e o proximo passo. A paleta CHAMA
       (anima), a barra de recado explica, e o som e o de sempre. */
    sTap();
    splash(e);
    chamaPaleta();
    mostraDica("Primeiro toque numa <b>cor</b> l&#225; embaixo. Depois toque no desenho.");
    fala("Primeiro toque numa cor lá embaixo. Depois toque no desenho.");
    atualizaQA();
    return;
  }
  var trocou=(cores[z._k]&&cores[z._k]!==tinta);
  var novo=!cores[z._k];
  cores[z._k]=tinta;
  z._p.style.fill=tinta;
  z.className="pd_zona cheia";
  splash(e);
  entornaBalde();
  sPinga(quantasCores());
  apagaDica();
  atualizaQA();
  if(novo) fala(z._n+" ficou " + nomeDaTinta(tinta) + ".");
  else if(trocou) fala(z._n+" trocou de cor.");
}
