 { selo:"AS BATIDAS DO TAMBOR", enun:"Tr&#234;s batidas diferentes se repetem. <b>Continue.</b>",
   seq:["F","M","f","F","M","f","F","M","f"], mostra:6, paleta:["F","M","f"],
   regra:"forte, m&#233;dia, fraca, e come&#231;a de novo",
   grupo:3, grupoTxt:"forte, m&#233;dia, fraca",
   d1:"Bata na mesa junto com a fila: forte, m&#233;dia, fraca. Depois da fraca, o que volta?" },
/* ⚠️ ESTA RODADA NAO TEM GRUPO QUE SE REPETE — ela CRESCE. Antes ela herdava
   o texto das outras ("depois dele, tudo recomeça igual"), que aqui e
   simplesmente falso: e o mesmo defeito do "resto de clone", em miniatura,
   dentro da propria peca. Por isso ela declara `salto` em vez de `grupo`, e o
   2o degrau acende as DUAS ultimas casas para mostrar o pulo.            */
 { selo:"DE QUANTO EM QUANTO?", enun:"Aqui o padr&#227;o &#233; um <b>salto</b>. Continue a fila.",
   seq:["2","4","6","8","10","12","14"], mostra:4, paleta:["9","10","11","12","13","14"],
   regra:"de 2 em 2",
   grupo:0, salto:2, grupoTxt:"o salto de 2 em 2",
   d1:"Olhe o salto de um n&#250;mero para o outro: de 2 para 4, de 4 para 6. Quanto anda cada vez?" }
];

/* ---------------- ESTADO ---------------- */
var rodada=0, feitos=0, totalGeral=0, descobertas=[];
var telaAtual=null, barraP=null, filaEl=null, bandEl=null;
var casas=[], botoes=[], passo=0, errosSeg=0, ger=0, travada=false;
/* ⭐ o estado do VER DESTINO: 0 = nada, 1 = sombra discreta + contorno que
   respira, 2 = acesa de vez. Volta ao piso da rodada a cada acerto.       */
var destNivel=0;

function temClasse(e,c){
  if(!e||e.nodeType!==1) return false;
  return (" "+String(e.className)+" ").indexOf(" "+c+" ")>=0;
}
/* ---------- a ajuda é ESCRITA e DITA ----------
   Quem lê ganha as duas coisas; quem não lê ganha pelo menos a voz. O `diz`
   é do motor da atividade (voz GRAVADA, Edge TTS) e não existe na peça
   solta — por isso a guarda. ⚠️ NUNCA a voz-robô do navegador direto: ela
   do navegador está desligada de propósito e o `_qa/vozrobo.py` reprova.  */
function semTag(t){
  var d=document.createElement("div");
  d.innerHTML=String(t===undefined||t===null?"":t).replace(/<br\s*\/?>/gi," ");
  return (d.textContent||d.innerText||"").replace(/\s+/g," ").replace(/^ | $/g,"");
}
function fala(txt){
  var t=semTag(txt);
  if(!t) return;
  if(typeof diz==="function") diz(t);
}
/* o andaime de TEXTO continua igual — o "ver destino" entra JUNTO com ele,
   nunca no lugar dele. */
function ajuda(txt){ mostraDica(txt); fala(txt); }
function viva(){ return telaAtual&&telaAtual.parentNode; }
/* ⚠️ tela antiga continua clicavel embaixo do banner: toda funcao que mexe no
   estado comeca perguntando se a partida ainda esta de pe. */
function emJogo(){ return viva()&&!travada; }
function ehNumero(k){ return /^[0-9]+$/.test(k); }
function nomeDe(k){ return ehNumero(k)?k:PEC[k].n; }
function somDe(k){
  if(ehNumero(k)){ nota(440,.09,.12,"triangle",0); return; }
  nota(PEC[k].hz,(k==="F")?.22:.12,(k==="f")?.09:.16,"triangle",0);
}
/* conta quanto vale o total de casas a produzir, para a barra andar de verdade */
function contaTotal(){
  var i,s=0;
  for(i=0;i<RODADAS.length;i++) s+=RODADAS[i].seq.length-RODADAS[i].mostra;
  return s;
}

/* ---------------- desenhar uma peça ---------------- */
function figDe(k,grande){
  if(ehNumero(k)) return el("span","pdnum",k);
  var e=el("span",PEC[k].cls,"");
  if(grande&&!ehNumero(k)) e.style.transform="scale(1.15)";
  return e;
}

/* ---------------- A TELA DA RODADA ---------------- */
function pecaPadrao(){
  ger++; limpa();
  if(!totalGeral) totalGeral=contaTotal();
  if(rodada<0||rodada>=RODADAS.length) rodada=0;
  var R=RODADAS[rodada];
  casas=[]; botoes=[]; passo=R.mostra; errosSeg=0; travada=false;
  destNivel=R.ver?1:0;   /* ⭐ modo facil pedido na gaveta */
  var t=el("div","tela"); telaAtual=t;
  setProg(t,Math.round(feitos*100/totalGeral));
  barraP=t.querySelector(".prog i");
  var c=el("div","centro");
  c.appendChild(el("div","selo",R.selo));
  c.appendChild(el("div","balao",R.enun));

  filaEl=el("div","pdfila");
  var i,cx,larg=(100/R.seq.length);
  for(i=0;i<R.seq.length;i++){
    cx=el("div","pdcx");
    cx.style.width=larg+"%";
    if(i<R.mostra){
      cx.className="pdcx pdfeito";
      cx.appendChild(envolve(R.seq[i]));
    }
    casas.push(cx);
    filaEl.appendChild(cx);
  }
  c.appendChild(filaEl);

  bandEl=el("div","pdband");
  /* ⚠️ a bandeja vai EMBARALHADA: se a peca certa ficasse sempre no mesmo
     lugar, a crianca aprenderia a posicao e nao o padrao (defeito da Fabrica
     de Estrelas). */
  var ordem=baguncar(R.paleta.slice(0));
  for(i=0;i<ordem.length;i++) bandEl.appendChild(fazBotao(ordem[i]));
  c.appendChild(bandEl);
  c.appendChild(el("div","hint","Toque na pe&#231;a que vem agora. Ela entra na casa que est&#225; esperando."));
  t.appendChild(c); app.appendChild(t);
  marcaVez();
}
/* a figura vai dentro de uma caixinha centrada — assim numero e desenho ficam
   na mesma altura em toda casa da fila */
function envolve(k){
  var w=el("span","pdfig","");
  w.appendChild(figDe(k,false));
  return w;
}
/* ⚠️ a peca da bandeja nasce com a classe `opt` sozinha e SO DEPOIS ganha a
   `pdp`. Nao e capricho: o portao das dinamicas (_qa/dinamicas.py) reconhece a
   familia "escolher" pelo literal `el("div","opt"` — escrito de uma vez como
   `"opt pdp"`, o portao nao reconhecia nada e devolvia "0 dinamica
   reconhecida", que e aprovacao VAZIA (pior do que reprovar). */
function fazBotao(k){
  var b=el("div","opt","");
  b.className="opt pdp";
  b.appendChild(figDe(k,true));
  if(!ehNumero(k)) b.appendChild(el("span","pdnome",PEC[k].n));
  b._k=k;
  b.onclick=function(){ tocaPeca(b); };
  botoes.push(b);
  return b;
}

/* ---------------- a casa da vez + a pista para o auditor ---------------- */
function marcaVez(){
  var R=RODADAS[rodada], i;
  for(i=0;i<casas.length;i++){
    if(temClasse(casas[i],"pdfeito")||temClasse(casas[i],"pdnovo")) continue;
    casas[i].className=(i===passo)?"pdcx pdvez":"pdcx";
  }
  /* a tela publica em data-qa qual peca serve AGORA — so para o
     auditor-jogador conseguir fechar a fase (convencao da casa). */
  for(i=0;i<botoes.length;i++)
    botoes[i].setAttribute("data-qa",(passo<R.seq.length&&botoes[i]._k===R.seq[passo])?"1":"0");
  pintaDestino();
}

/* ⭐ VER DESTINO: a casa que espera mostra a SOMBRA da peca que vem.
   ⚠️ `marcaVez()` reescreve a classe de todas as casas — por isso a pintura do
   destino e um passo SEPARADO, chamado depois dela. Sem isso o andaime sumia
   no toque seguinte, que e justamente quando a crianca precisa dele.      */
function pintaDestino(){
  var R=RODADAS[rodada], i, f, cx=(passo<casas.length)?casas[passo]:null;
  for(i=0;i<casas.length;i++){
    f=casas[i].getElementsByClassName("pdfan")[0];
    if(f&&(casas[i]!==cx||!destNivel)) f.parentNode.removeChild(f);
  }
  if(!cx||!destNivel||passo>=R.seq.length) return;
  cx.className="pdcx pdvez"+(destNivel>=2?" pddestf":" pddest");
  f=cx.getElementsByClassName("pdfan")[0];
  if(!f){ f=el("span","pdfan"); f.appendChild(figDe(R.seq[passo],false)); cx.appendChild(f); }
  f.className=(destNivel>=2)?"pdfan forte":"pdfan";
}
function mostraDestino(n){
  if(n>destNivel) destNivel=n;
  pintaDestino();
}

/* ---------------- a regra da peça ---------------- */
function tocaPeca(b){
  if(!emJogo()) return;
  var R=RODADAS[rodada];
  if(passo>=R.seq.length) return;
  somDe(b._k);
  if(b._k===R.seq[passo]) acerta(b._k); else erra(b);
}
function acerta(k){
  var R=RODADAS[rodada], cx=casas[passo];
  cx.className="pdcx pdfeito pdnovo";
  cx.innerHTML="";
  cx.appendChild(envolve(k));
  sCerto();
  passo++; feitos++; errosSeg=0;
  destNivel=R.ver?1:0;   /* acertou: a ajuda volta ao piso desta rodada */
  apagaDica(); apagaGrupo();
  if(barraP) barraP.style.width=Math.round(feitos*100/totalGeral)+"%";
  /* ⚠️ A TRAVA VAI NO INSTANTE DO ACERTO, nao no fim da animacao: a crianca
     toca duas vezes, e o segundo toque caia na rodada seguinte com o estado
     antigo. */
  if(passo>=R.seq.length){ travada=true; fecha(); return; }
  marcaVez();
}
/* ERRO NÃO PUNE: som grave curto, a peça treme, e o andaime CRESCE. */
function erra(b){
  sErro(); errosSeg++;
  b.className="opt pdp pdtreme";
  destreme(b);
  degrau();
  /* o VER DESTINO entra JUNTO com o andaime de texto e com o grupo aceso,
     nunca no lugar deles: no 2º erro a casa que espera mostra a sombra da
     peça que vem (discreta, contorno respirando); no 3º ela acende de vez e
     a peça se põe sozinha logo depois — nunca trava.                      */
  if(errosSeg===2){ acendeGrupo(); mostraDestino(1); }
  if(errosSeg>=3){ acendeGrupo(); mostraDestino(2); esperaERevela(); }
}
/* O ANDAIME QUE CRESCE — tres degraus, tres textos DIFERENTES:
   1) pergunta que orienta a leitura da fila (o texto vem da RODADA, nunca
      escrito a mao aqui — foi assim que a rodada das batidas parou de falar
      dos circulos da primeira);
   2) apoio concreto: o GRUPO que se repete acende na fila;
   3) revela e explica (ver esperaERevela).                                */
function degrau(){
  var R=RODADAS[rodada];
  if(errosSeg===1){ ajuda(R.d1); return; }
  if(errosSeg>=3){ ajuda("Deixa comigo: eu ponho a pr&#243;xima e te mostro a regra."); return; }
  /* 2o degrau: apoio concreto. As PALAVRAS mudam com o tipo de padrao — fila
     que se repete fala de "grupo", fila que cresce fala de "salto". */
  /* ⭐ e o texto AVISA que a sombra apareceu: quem le ganha as duas coisas,
     quem nao le ganha a sombra — nunca uma so das duas portas.            */
  if(R.salto&&passo>=2)
    ajuda("Olhe as duas casas acesas: de <b>"+R.seq[passo-2]+"</b> para <b>"+R.seq[passo-1]+
          "</b> a fila andou <b>"+R.salto+"</b>. Ela anda sempre o mesmo tanto. Na casa que espera apareceu a <b>sombra</b> do que vem.");
  else
    ajuda("Olhe o peda&#231;o aceso no come&#231;o da fila: <b>"+R.grupoTxt+"</b>. Depois dele, tudo recome&#231;a igual. Na casa que espera apareceu a <b>sombra</b> do que vem.");
}
function acendeGrupo(){
  var R=RODADAS[rodada], i, de=0, ate=R.grupo?R.grupo:R.mostra;
  if(R.salto){ de=Math.max(0,passo-2); ate=passo; }
  for(i=de;i<ate&&i<casas.length;i++)
    if(temClasse(casas[i],"pdfeito")) casas[i].className="pdcx pdfeito pdgrp";
}
function apagaGrupo(){
  var i;
  for(i=0;i<casas.length;i++)
    if(temClasse(casas[i],"pdgrp")) casas[i].className="pdcx pdfeito";
}
/* ⚠️ DEFEITO PAGO EM CINCO PEÇAS DE UM LOTE SÓ (ago/2026): no 3º degrau a
   explicacao era escrita e APAGADA no mesmo quadro, porque `revelar` chamava
   o "acertou" e o "acertou" limpa a dica. A peca se consertava sozinha e a
   crianca nao ficava sabendo por que. Ordem certa: espera a dica ser lida,
   REVELA, e so DEPOIS escreve a explicacao — que fica na tela.            */
function esperaERevela(){
  var g=ger, quando=passo;
  setTimeout(function(){
    if(g!==ger||!viva()) return;
    if(passo!==quando) return;                 /* a crianca resolveu sozinha */
    var R=RODADAS[rodada], k=R.seq[passo];
    if(k===undefined) return;
    acerta(k);
    if(g!==ger||!viva()) return;
    ajuda("Eu pus <b>"+nomeDe(k)+"</b>. A regra desta fila &#233;: <b>"+R.regra+"</b>.");
  },1100);
}
/* ⚠️ o temporizador continua correndo depois do limpa(): sem o guarda da
   geracao ele mexeria numa tela que ja saiu (e deixaria a tela nova travada). */
function destreme(b){
  var g=ger;
  setTimeout(function(){
    if(g!==ger||!viva()) return;
    b.className="opt pdp";
  },340);
}
function apagaDica(){
  var d=document.getElementById("dicaP");
  if(d&&d.parentNode) d.parentNode.removeChild(d);
}
/* ---------------- fim da rodada: A REGRA EM PALAVRAS ----------------
   Descobrir sem NOMEAR nao vira conhecimento. Aqui a fila fecha e a peca
   devolve, escrito, o que a crianca acabou de fazer com a mao.           */
function fecha(){
  var g=ger, R=RODADAS[rodada];
  if(descobertas.indexOf(R.regra)<0) descobertas.push(R.regra);
  setTimeout(function(){
    if(g!==ger||!viva()) return;
    mostraBanner("Fila completa! Voc&#234; descobriu a regra:<br><b>"+R.regra+"</b>",proximaRodada);
  },560);
}
function proximaRodada(){
  rodada++;
  if(rodada>=RODADAS.length) fimDaPeca(); else pecaPadrao();
}

function fimDaPeca(){
  ger++; limpa();
  filaEl=null; bandEl=null; travada=false;
  if(!totalGeral) totalGeral=contaTotal();
  var t=el("div","tela"); telaAtual=t; setProg(t,100);
  var c=el("div","centro");
  c.appendChild(el("div","selo","PE&#199;A FECHADA"));
  c.appendChild(el("div","medal",""));
  /* FECHO COM GANCHO: a peca termina deixando uma pergunta aberta. */
  c.appendChild(el("div","balao","Voc&#234; continuou <b>4 padr&#245;es</b>. E se um grupo tivesse <b>quatro</b> pe&#231;as? Tente inventar uma fila assim."));
  var i, regras=descobertas.length?descobertas:regrasTodas(), txt="As regras que voc&#234; descobriu:";
  for(i=0;i<regras.length;i++) txt+="<br>&#8226; <b>"+regras[i]+"</b>";
  c.appendChild(el("div","pdregra",txt));
  var b=el("button","btn","Jogar de novo");
  b.onclick=recomeca;
  c.appendChild(b);
  c.appendChild(el("div","hint","Esta &#233; a pe&#231;a O QUE VEM DEPOIS: a crian&#231;a PRODUZ a continua&#231;&#227;o."));
  t.appendChild(c); app.appendChild(t);
}
function regrasTodas(){
  var i,r=[];
  for(i=0;i<RODADAS.length;i++) r.push(RODADAS[i].regra);
  return r;
}
function recomeca(){ rodada=0; feitos=0; descobertas=[]; pecaPadrao(); }
    if(f && f.dados) RODADAS = f.dados;
    if(f && f.dadosExtra){ var _d = f.dadosExtra;
      if(_d.PEC !== undefined) PEC = _d.PEC;
    }
    try{ fimDaPeca = _seguir; }catch(_e){}
    pecaPadrao();
  })();
};

/* ==== PECA: repartir ==== */
MEC["repartir"] = function(f, cen, fim){
  cen.className = cen.className + " mec-repartir";
  /* ⚠️⚠️ LICAO PAGA, e a mais silenciosa de todas: a peca da MEMORIA declara a
     PROPRIA `function fim()`. Como o corpo dela entra dentro do fechamento, esse
     `fim` SOMBREAVA o parametro da ponte — e o `mostraBanner` daqui, que devia
     levar a fase seguinte, chamava a peca de volta. Laco infinito, sem erro de
     JS nenhum: o jogador so ficava PRESO, com todos os pares ja fechados e a
     medalha da peca na tela. Por isso a continuacao mora AQUI FORA, com um nome
     que o integrador confere que nenhuma peca usa (ver `confere_contra_motor`).
     E ela so dispara UMA vez: peca que chama o banner duas vezes pularia fase. */
  var _seguir = function(){ if(_seguir.ja) return; _seguir.ja = 1; fim(); };
  /* recolhe o enunciado da fase assim que a peca puser o balao dela (ver CSS) */
  setTimeout(function(){
    var b = cen.getElementsByClassName("pecabox")[0];
    if(b && b.getElementsByClassName("balao").length)
      cen.className = cen.className + " tembalaopeca";
  }, 120);
  (function(){
    /* a peca acha que esta sozinha; estes ajudantes fazem o meio de campo */
    var app = cen;
    /* o `ac()` DESTA peca: destrava o som (o motor chama isso de `arma()`) e
       devolve o AudioContext do motor. Fica local, dentro do fechamento, para
       nao brigar com o `var ac` do motor — que e o objeto, nao a funcao. */
    function ac(){ if(typeof arma === "function") arma(); return window.ac; }
    function limpa(){ var g = cen.getElementsByClassName("pecabox")[0];
      if(g) g.innerHTML = ""; else { g = document.createElement("div");
      g.className = "pecabox"; cen.appendChild(g); } app = g; }
    /* ⚠️ LICAO PAGA: este ajudante era um VAZIO — "quem manda na barra e o
       motor". So que o caca-palavras faz `setProg(t,0)` e depois PEGA A BARRA
       DE VOLTA (`t.getElementsByTagName("i")[0]`) para mostrar quantas palavras
       ja achou. Com o vazio, ele pegava `undefined` e estourava no primeiro
       toque: 446 erros de JS numa partida. Regra: o ajudante da ponte tem que
       FAZER o que o de verdade faz — nao pode so nao atrapalhar.
       A barra da PECA e a de dentro da fase (5 palavras achadas de 8); a do
       MOTOR e a da atividade (fase 4 de 32). As duas informam coisas
       diferentes, entao as duas ficam — a de dentro, menorzinha (ver CSS). */
    function setProg(t, p){
      if(!t || !t.appendChild) return;
      var pr = document.createElement("div"); pr.className = "prog progpeca";
      var i = document.createElement("i"); i.style.width = (p || 0) + "%";
      pr.appendChild(i); t.appendChild(pr);
    }
    /* ⚠️⚠️ LICAO PAGA (ago/2026), pega pelo Marcos JOGANDO: *"esta passando de
       fase sem aquele botao azul que aparecia com a palavra proximo... tem que
       ser parecida com a atividade do Broto"*.

       Esta ponte comemorava e PULAVA para a fase seguinte sozinha, 420ms
       depois. A crianca terminava uma fase e era JOGADA na outra: sem a tela de
       parabens, sem o mascote dizendo o que ela conseguiu, sem o botao para ela
       decidir quando seguir. No Broto — que e o modelo — cada fase fecha com o
       banner e a crianca TOCA para continuar. Era o fecho de toda fase de toda
       atividade montada que estava faltando.

       Agora a ponte chama o banner DE VERDADE do motor (`window.mostraBanner`,
       que a funcao local aqui dentro sombreia) e entrega o `_seguir` como o
       botao. A peca continua so avisando que acabou; quem manda no caminho
       segue sendo o motor — mas com a comemoracao no meio. */
    function mostraBanner(msg, cb){
      if(typeof festa === "function") festa();
      /* ⚠️⚠️ LICAO PAGA (Teatro, ago/2026), o Marcos jogando: uma fase fechava
         com um "QUADRADO GRANDE desconfigurado" em vez do aviso fininho das
         outras. Causa: 7 pecas (pintar, pintar-canvas, memoria, sete-erros,
         achar-na-cena, camadas-mapa, tracar-caminho) mandam no aviso de fim
         `<div class="medal">★</div>`. No motor a `.medal` e a MEDALHA DE 190px
         do FIM da atividade (imagem do mascote), entao o motor inflava aquilo
         num quadradao verde vazio com uma estrelinha. O aviso de FASE nao leva
         medalha — o motor ja comemora com confete. Tiro a medalha do aviso de
         fase aqui (conserto central: pega as 7 de uma vez). */
      if(msg) msg = msg.replace(/<div[^>]*class=["']?[^"'>]*medal[^"'>]*["']?[^>]*>[\s\S]*?<\/div>/gi, "");
      if(typeof window.mostraBanner === "function"){
        window.mostraBanner(msg || "Muito bem!", _seguir); return;
      }
      setTimeout(_seguir, 420);
    }
    /* ⚠️⚠️ LICAO PAGA (ago/2026), e foi o Marcos quem ouviu: *"onde tenho que
       ouvir a palavra nao funciona; o enunciado funciona, os sons das opcoes
       funcionam"*. So o botao OUVIR A PALAVRA era mudo.
       A causa: a peca sozinha nao tem gravacao nenhuma, entao ela fala pela
       VOZ ROBO do navegador (`speechSynthesis`). No PC da escola essa voz
       simplesmente nao existe (nao ha voz pt-BR instalada) — e falha CALADA,
       sem erro nenhum. O enunciado e as opcoes funcionavam porque passam pelo
       motor, que toca MP3 gravado.
       Aqui a ponte reaponta o `diz` da peca para a voz da casa. A conta da
       chave ignora maiusculas (`chaveVoz` faz `toLowerCase`), entao a palavra
       "pao" acha a gravacao feita para "PAO" — a mesma que o alto-falante da
       opcao ja usa. So cai na voz do navegador se nao houver gravacao. */
    var diz = function(txt){
      try{
        /* ⚠️⚠️ LICAO PAGA (ago/2026), e foi o Marcos quem OUVIU: *"o da padaria
           agora e falado duas vezes juntos, soa estranho"*.
           Varias pecas ganharam, no mesmo dia, a boa ideia de NARRAR SOZINHAS ao
           abrir — porque na bancada, sem motor, a fase ficava muda. So que dentro
           da atividade quem narra o balao e o MOTOR, sempre narrou. As duas vozes
           partiam juntas e se atropelavam.
           A peca nao tem como saber se esta na bancada ou na atividade; quem sabe
           e a ponte. Entao e AQUI que se decide: se o texto pedido e o mesmo que o
           motor ja esta dizendo (ou acabou de dizer, na meia janela de abertura da
           fase), a peca cala — o motor ja cumpriu o pedido dela. Qualquer outra
           fala (a palavra, a silaba, a dica) passa normalmente. */
        var _limpa = function(s){ return String(s||"").replace(/<[^>]*>/g," ")
          .replace(/&[a-z]+;|&#\d+;/gi," ").replace(/\s+/g," ").trim().toLowerCase(); };
        var _agora = _limpa(txt);
        if(_agora && window.__dizMotor && window.__dizMotor === _agora) return;
        try{
          var _b = document.getElementsByClassName("balao")[0];
          if(_b && _limpa(_b.textContent) === _agora){
            window.__dizMotor = _agora;
            setTimeout(function(){ window.__dizMotor = null; }, 1200);
            return;
          }
        }catch(_e){}
        var k = (typeof temVoz === "function") ? temVoz(txt) : null;
        if(k && typeof tocaVoz === "function"){ tocaVoz(k); return; }
        if(!window.speechSynthesis || !window.SpeechSynthesisUtterance) return;
        var u = new SpeechSynthesisUtterance(txt);
        u.lang = "pt-BR"; u.rate = .9; u.pitch = 1.05;
        window.speechSynthesis.cancel(); window.speechSynthesis.speak(u);
      }catch(e){}
    };
    limpa();

/* ====== A PEÇA COMEÇA AQUI ====== */

/* AS RODADAS. `un` = quantos pedacinhos a fita tem; `n` = quantos vão repartir.
   `un` sempre divisível por `n`, senão não existe divisão justa. O NOME da
   fração vem por último, na hora do fecho — nunca antes.                    */
/* Campos opcionais de tema (Marcos): `img` (fruta do banco na unidade),
   `coisa` (nome no plural: "maçãs"), `grupo`/`grupos` (rótulo do destino:
   "banca"/"bancas"). Sem eles, é a fita/pratos de fração de sempre. */
var RODADAS=[
  {un:8,  n:2, img:"", coisa:"pedacinhos", grupo:"prato", grupos:"pratos", nome:"a <b>metade</b>", selo:"REPARTIR IGUAL"},
  {un:12, n:3, nome:"<b>um ter&#231;o</b>",     selo:"REPARTIR IGUAL"},
  {un:12, n:4, nome:"<b>um quarto</b>",    selo:"REPARTIR IGUAL"}
];
var MAXP=6;   /* teto de cortes: abaixo disso a parte fica pequena de tocar */

var DICAS=[
  "Conte os pratos e corte a fita nesse mesmo tanto de partes.",
  "Olhe o placar: ele diz quantas partes voc&#234; j&#225; tem.",
  "Deixa comigo: eu ajeito o corte e voc&#234; reparte."
];

var idxR=0, partes=1, etapa=1, mexidas=0, entregues=0, ger=0, travada=false;
var telaAtual=null, barraP=null, elFita=null, elStat=null, elBts=null, elBanco=null, elPratos=null;
var btCorta=null, btJunta=null, pecas=[], vagas=[], marcada=null;
/* ⭐ O GUARDA DO MOUSE FANTASMA. O celular dispara mousedown/mouseup e um
   CLIQUE falsos logo depois do toque; sem este carimbo eles desmarcavam a
   parte que a criança tinha acabado de escolher. Pego DUAS vezes.         */
var ultimoToque=0, pego=null, somb=null, px0=0, py0=0, moveu=false, fimArrasto=0;

function agora(){ return (new Date()).getTime(); }
function souDedo(){ return agora()-ultimoToque<800; }
function cliqueDeArrasto(){ return agora()-fimArrasto<350; }
function viva(){ return telaAtual&&telaAtual.parentNode; }
function rodada(){ return RODADAS[idxR]; }
function temClasse(e,c){
  if(!e||e.nodeType!==1) return false;
  return (" "+String(e.className)+" ").indexOf(" "+c+" ")>=0;
}
function sCorte(){ nota(1500,.03,.10,"square",0); nota(700,.05,.09,"square",.03); }

/* ⭐ O TAMANHO DE CADA PARTE, CALCULADO — nunca desenhado à mão.
   piso(un/p) para todas e o resto espalhado de uma em uma. Quando `p` divide
   `un`, todas saem EXATAMENTE iguais; quando não divide, a diferença aparece
   na tela, que é a lição.                                                  */
function tamanhos(un,p){
  var base=Math.floor(un/p), resto=un-base*p, a=[], i;
  for(i=0;i<p;i++) a.push(base+(i<resto?1:0));
  return a;
}
function todasIguais(a){
  var i;
  for(i=1;i<a.length;i++) if(a[i]!==a[0]) return false;
  return true;
}

/* ---------------------------------------------------------- a tela */
function pecaRepartir(){
  ger++; limpa(); soltaSombra();
  partes=1; etapa=1; mexidas=0; entregues=0; marcada=null; pecas=[]; vagas=[]; travada=false;
  var r=rodada();
  var t=el("div","tela"); telaAtual=t;
  setProg(t,Math.round(idxR*100/RODADAS.length));
  barraP=t.querySelector(".prog i");
  var c=el("div","centro");
  c.appendChild(el("div","selo",r.selo));
  /* ⭐ texto temável: se a rodada traz `coisa`/`grupos` (frutas/bancas), fala a
     língua da atividade; senão, a fita/pratos de sempre. */
  var _coisa=r.coisa||"pedacinhos", _grupos=r.grupos||"pratos", _grupo=r.grupo||"prato";
  c.appendChild(el("div","balao", r.img
    ? ("Reparta as <b>"+r.un+" "+_coisa+"</b> em <b>"+r.n+" "+_grupos+"</b> iguais. Toque na fila para dividir.")
    : ("S&#227;o <b>"+r.n+" "+_grupos+"</b> e uma fita s&#243;. Corte a fita em partes <b>iguais</b>.")));

  elFita=el("div","fita");
  elFita.onclick=function(){ corta(); };
  c.appendChild(elFita);

  elStat=el("div","mstat","");
  c.appendChild(elStat);

  elBts=el("div","mbts");
  btCorta=el("button","btn","Cortar");
  btCorta.onclick=function(){ corta(); };
  btJunta=el("button","btn fraco","Juntar");
  btJunta.onclick=function(){ junta(); };
  elBts.appendChild(btCorta); elBts.appendChild(btJunta);
  c.appendChild(elBts);

  elBanco=el("div","banco","");
  elPratos=el("div","pratos","");
  c.appendChild(elBanco); c.appendChild(elPratos);

  c.appendChild(el("div","hint","Toque na fita (ou no bot&#227;o) para cortar. D&#225; para juntar de volta."));
  t.appendChild(c); app.appendChild(t);
  elBanco.style.display="none"; elPratos.style.display="none";
  desenhaFita();
}

/* ---------------------------------------------------- ETAPA 1: cortar */
function desenhaFita(){
  var r=rodada(), tam=tamanhos(r.un,partes), igual=todasIguais(tam), i, j, tr, uns, u;
  elFita.innerHTML="";
  for(i=0;i<tam.length;i++){
    tr=el("div","tira"+(igual&&partes===r.n?" certa":""));
    tr.style.width=(tam[i]*100/r.un)+"%";
    uns=el("div","uns");
    for(j=0;j<tam[i];j++){
      u=el("i","umped"+(rodada().img?" fruta":""),"");
      if(rodada().img) u.style.backgroundImage="url(\"img/"+rodada().img+".png\")";
      u.style.width=(100/tam[i])+"%";
      uns.appendChild(u);
    }
    tr.appendChild(uns);
    tr.appendChild(el("div","tnum",""+tam[i]));
    elFita.appendChild(tr);
  }
  if(partes===1){
    elStat.className="mstat";
    elStat.innerHTML=(r.img?"A fila tem <b>":"A fita est&#225; inteira: <b>")+r.un+"</b> "+(r.coisa||"pedacinhos")+".";
  } else if(igual){
    elStat.className="mstat igual";
    elStat.innerHTML="<b>"+partes+"</b> partes <b>IGUAIS</b>, de <b>"+tam[0]+"</b> pedacinhos cada.";
  } else {
    elStat.className="mstat";
    elStat.innerHTML="<b>"+partes+"</b> partes, mas <b>desiguais</b>: umas com "+
                     Math.max.apply(null,tam)+" e outras com "+Math.min.apply(null,tam)+".";
  }
  /* ⚠️ ESCONDER COM `display`, NUNCA COM `visibility`: um botao com
     visibility:hidden continua ocupando o lugar e o auditor de leiaute (regra
     5, "botao sobre botao") ve o dedo caindo em OUTRO elemento no centro dele
     — alarme falso numa tela perfeita. Fora da tela ele tem que sumir mesmo. */
  btCorta.style.display=(partes<Math.min(MAXP,r.un))?"":"none";
  btJunta.style.display=(partes>1)?"":"none";
  /* ⭐ data-qa="1" no botão que serve AGORA — só para o auditor-jogador. */
  if(partes<r.n){ btCorta.setAttribute("data-qa","1"); btJunta.removeAttribute("data-qa"); }
  else if(partes>r.n){ btJunta.setAttribute("data-qa","1"); btCorta.removeAttribute("data-qa"); }
  else { btCorta.removeAttribute("data-qa"); btJunta.removeAttribute("data-qa"); }
}
function corta(){
  var r=rodada();
  /* ⚠️ trava depois do acerto: sem isto, um toque a mais durante os 700ms de
     transicao (confere -> etapaDois) faz a fase avancar com a fita cortada
     no numero ERRADO de partes — corrida de eventos pega num toque rapido. */
  if(etapa!==1||travada) return;
  if(partes>=Math.min(MAXP,r.un)){ sErro(); mostraDica("A fita j&#225; est&#225; bem picada. Tente <b>juntar</b> e recomear."); return; }
  partes++; mexidas++; sCorte(); desenhaFita(); confere();
}
function junta(){
  if(etapa!==1||travada) return;
  if(partes<=1){ sErro(); return; }
  partes--; mexidas++; sTap(); desenhaFita(); confere();
}
function confere(){
  var r=rodada(), g=ger;
  if(partes===r.n&&todasIguais(tamanhos(r.un,partes))){
    travada=true;
    sCerto(); apagaDica();
    setTimeout(function(){ if(g!==ger||!viva()) return; etapaDois(); },700);
    return;
  }
  /* NUNCA TRAVA: depois de muita mexida o corte se ajeita sozinho. */
  if(mexidas===4) mostraDica(DICAS[0]);
  else if(mexidas===7) mostraDica(DICAS[1]);
  else if(mexidas>=10){
    mostraDica(DICAS[2]);
    partes=r.n; desenhaFita();
    setTimeout(function(){ if(g!==ger||!viva()) return; confere(); },300);
  }
}
function apagaDica(){
  var d=document.getElementById("dicaP");
  if(d&&d.parentNode) d.parentNode.removeChild(d);
}

/* ------------------------------------------- ETAPA 2: uma para cada prato */
function etapaDois(){
  var r=rodada(), tam=tamanhos(r.un,partes), i, p, v;
  etapa=2; marcada=null; entregues=0; pecas=[]; vagas=[];
  elFita.style.display="none";
  elBts.style.display="none";
  elFita.onclick=null;
  var _coisa2=r.coisa||"pedacinhos", _grupo2=r.grupo||"prato";
  elStat.className="mstat igual";
  elStat.innerHTML="<b>"+r.n+"</b> partes iguais, de <b>"+tam[0]+"</b> "+_coisa2+". Agora leve <b>uma para cada "+_grupo2+"</b>.";
  var bal=telaAtual.getElementsByClassName("balao")[0];
  if(bal) bal.innerHTML="Cada <b>"+_grupo2+"</b> leva <b>uma parte igual</b> &#8212; nem mais, nem menos.";
  elBanco.style.display="block"; elPratos.style.display="block";
  elBanco.innerHTML=""; elPratos.innerHTML="";
  for(i=0;i<r.n;i++){
    p=fazParte(tam[i]);
    elBanco.appendChild(p); pecas.push(p);
    v=el("div","cam");
    v.appendChild(el("i","pnome",(r.grupo?r.grupo.toUpperCase():"PRATO")+" "+(i+1)));
    v.onclick=cliqueVaga;
    elPratos.appendChild(v); vagas.push(v);
  }
  reindexa();
}
function fazParte(tam){
  var b=el("div","pc",""+tam);
  b._t=tam;
  b.onclick=cliquePeca;
  b.onmousedown=mouseIni;
  b.addEventListener("touchstart",toqueIni,false);
  b.addEventListener("touchmove",toqueMeio,false);
  b.addEventListener("touchend",toqueFim,false);
  return b;
}
/* ⭐ a MESMA chave na parte livre e no prato livre. Como todas as partes são
   iguais, qualquer uma serve em qualquer prato; a chave é recalculada a cada
   entrega só para o auditor-jogador (_qa/jogador.js) conseguir fechar.     */
function reindexa(){
  var i, k=0;
  for(i=0;i<pecas.length;i++){
    if(temClasse(pecas[i],"usada")) pecas[i].removeAttribute("data-qa");
    else { k++; pecas[i].setAttribute("data-qa",""+k); }
  }
  k=0;
  for(i=0;i<vagas.length;i++){
    if(temClasse(vagas[i],"ok")) vagas[i].removeAttribute("data-qa");
    else { k++; vagas[i].setAttribute("data-qa",""+k); }
  }
}

/* ---------- as TRÊS portas de entrada ----------
   ⚠️ os tratadores de toque sao FUNCOES COM NOME de proposito: assim nenhum
   `preventDefault` fica perto do `touchstart` (matar o toque no celular e a
   armadilha nº1 desta mecanica). Ele mora so no `touchmove`, e so depois que
   o dedo ANDOU de verdade. */
function cliquePeca(){
  if(cliqueDeArrasto()) return;   /* este clique e o rabo do arrasto */
  if(souDedo()) return;           /* clique FANTASMA do dedo: ja tratado no touchend */
  escolhe(this);
}
function mouseIni(ev){
  if(souDedo()) return;           /* mouse FANTASMA do celular: ignora */
  pegaEm(this,ev.clientX,ev.clientY);
}
function toqueIni(ev){
  ultimoToque=agora();
  var to=ev.touches[0]; if(!to) return;
  pegaEm(this,to.clientX,to.clientY);
}
function toqueMeio(ev){
  ultimoToque=agora();
  if(!pego) return;
  var to=ev.touches[0]; if(!to) return;
  moveEm(to.clientX,to.clientY);
  if(moveu) ev.preventDefault();  /* so no MEIO do arrasto, nunca no comeco */
}
function toqueFim(ev){
  ultimoToque=agora();
  var to=ev.changedTouches[0], arrastou=moveu, alvo=this;
  if(to) soltaEm(to.clientX,to.clientY); else soltaSombra();
  if(!arrastou) escolhe(alvo);    /* toque simples: vale como escolher */
}
function moveMouse(ev){ if(souDedo()) return; if(pego) moveEm(ev.clientX,ev.clientY); }
function soltaMouse(ev){ if(souDedo()) return; if(pego) soltaEm(ev.clientX,ev.clientY); }
document.onmousemove=moveMouse;
document.onmouseup=soltaMouse;

function pegaEm(b,x,y){
  if(!b||temClasse(b,"usada")) return;
  pego=b; px0=x; py0=y; moveu=false;
}
function moveEm(x,y){
  if(!pego) return;
  if(!moveu){
    if(Math.abs(x-px0)+Math.abs(y-py0)<10) return;
    moveu=true; sTap(); escolhe(pego);
    somb=el("div","somb",""+pego._t);
    document.body.appendChild(somb);
  }
  somb.style.left=(x-32)+"px"; somb.style.top=(y-22)+"px";
  acendeSob(x,y);
}
function soltaEm(x,y){
  var b=pego, arrastou=moveu;
  soltaSombra();
  if(!b||!arrastou) return;
  fimArrasto=agora();
  var v=vagaSob(x,y);
  if(v) poe(b,v);
}
function soltaSombra(){
  if(somb&&somb.parentNode) somb.parentNode.removeChild(somb);
  somb=null; pego=null; moveu=false;
  apagaAceso();
}
function vagaSob(x,y){
  var e=document.elementFromPoint(x,y), n=0;
  while(e&&e.nodeType===1&&n<6){
    if(temClasse(e,"cam")&&!temClasse(e,"ok")) return e;
    e=e.parentNode; n++;
  }
  return null;
}
/* ⭐ O PRATO ACENDE QUANDO A PARTE PASSA POR CIMA: a criança precisa saber
   onde pode soltar ANTES de soltar. */
function acendeSob(x,y){
  var v=vagaSob(x,y), i;
  for(i=0;i<vagas.length;i++){
    if(temClasse(vagas[i],"ok")) continue;
    vagas[i].className=(vagas[i]===v)?"cam alvo":"cam livre";
  }
}
function apagaAceso(){
  var i;
  for(i=0;i<vagas.length;i++){
    if(temClasse(vagas[i],"ok")) continue;
    vagas[i].className=marcada?"cam livre":"cam";
  }
}
function escolhe(b){
  if(!b||temClasse(b,"usada")) return;
  var i;
  for(i=0;i<pecas.length;i++) if(!temClasse(pecas[i],"usada")) pecas[i].className="pc";
  if(marcada===b){ marcada=null; sTap(); apagaAceso(); return; }
  b.className="pc sel"; marcada=b; sTap(); apagaAceso();
}
function cliqueVaga(){
  if(cliqueDeArrasto()) return;
  if(souDedo()&&!marcada) return;
  if(temClasse(this,"ok")) return;
  if(!marcada){ mostraDica("Primeiro toque numa <b>parte</b>. Depois toque no prato."); return; }
  poe(marcada,this);
}
/* Todas as partes são iguais, então qualquer uma serve em qualquer prato
   vazio: aqui não existe "resposta errada" — existe prato já servido, e ele
   apenas devolve a parte com um som curto e uma dica.                      */
function poe(b,v){
  if(!b||!v||temClasse(b,"usada")) return;
  if(temClasse(v,"ok")){
    sErro(); b.className="pc treme"; destreme(b);
    mostraDica("Esse prato j&#225; tem a parte dele. Cada um leva <b>uma</b>.");
    return;
  }
  v.className="cam ok";
  v.innerHTML="";
  v.appendChild(el("div","r3_posta",""+b._t));
  v.appendChild(el("i","pnome","SERVIDO"));
  b.className="pc usada";
  marcada=null;
  sCerto();
  entregues++;
  apagaDica(); apagaAceso(); reindexa();
  if(barraP) barraP.style.width=Math.round((idxR*rodada().n+entregues)*100/(RODADAS.length*rodada().n))+"%";

    function ac(){ if(typeof arma === "function") arma(); return window.ac; }
    function limpa(){ var g = cen.getElementsByClassName("pecabox")[0];
      if(g) g.innerHTML = ""; else { g = document.createElement("div");

    /* ⚠️ LICAO PAGA: este ajudante era um VAZIO — "quem manda na barra e o

    function mostraBanner(msg, cb){

        var _limpa = function(s){ return String(s||"").replace(/<[^>]*>/g," ")
