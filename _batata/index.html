<!doctype html><html lang="pt-BR"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>O Ateliê do Sr. Batata</title>
<style>
:root{--verde:#5bbf3a;--verde-d:#3f9a26;--sol:#ffd43b;--sol-d:#eab000;--terra:#a6703c;--coral:#ff7a6b;--rosa:#ff8ac2;--roxo:#7d3fe0;--texto:#3a3020;--card:#fffdf6;--linha:#e6dcc6;}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;font-family:"Segoe UI",'Baloo 2',Arial,sans-serif;}
html,body{margin:0;height:100%;overflow:hidden;background:var(--card);color:var(--texto);-webkit-user-select:none;user-select:none;}
#app{position:fixed;inset:0;}
.tela{position:absolute;inset:0;display:-webkit-flex;display:flex;-webkit-flex-direction:column;flex-direction:column;-webkit-align-items:center;align-items:center;-webkit-justify-content:center;justify-content:center;text-align:center;padding:16px;-webkit-animation:ap .4s;animation:ap .4s;}
@-webkit-keyframes ap{from{opacity:0;transform:translateY(10px)}to{opacity:1}}
@keyframes ap{from{opacity:0;transform:translateY(10px)}to{opacity:1}}
@-webkit-keyframes pop{0%{transform:translate(-50%,-50%) scale(.2)}70%{transform:translate(-50%,-50%) scale(1.15)}100%{transform:translate(-50%,-50%) scale(1)}}
@keyframes pop{0%{transform:translate(-50%,-50%) scale(.2)}70%{transform:translate(-50%,-50%) scale(1.15)}100%{transform:translate(-50%,-50%) scale(1)}}
.capa{background:-webkit-linear-gradient(top,#cdeafe,#eaf7d6);background:linear-gradient(#cdeafe,#eaf7d6);overflow:hidden;}
.capa .capabg{position:absolute;inset:0;width:100%;height:100%;-o-object-fit:cover;object-fit:cover;z-index:0;}
.capa::after{content:"";position:absolute;inset:0;background:-webkit-linear-gradient(top,rgba(20,15,8,.06),rgba(20,15,8,.42));background:linear-gradient(180deg,rgba(20,15,8,.06),rgba(20,15,8,.42));z-index:0;}
.capa .mascote,.capa .card{position:relative;z-index:1;}
.capa .centro{position:relative;z-index:1;display:-webkit-flex;display:flex;-webkit-flex-direction:column;flex-direction:column;-webkit-align-items:center;align-items:center;-webkit-justify-content:center;justify-content:center;width:100%;max-width:520px;min-height:100%;padding:12px 0;box-sizing:border-box;}
.capa h1{font-size:clamp(24px,7vw,38px);font-weight:800;color:#fff;margin:10px auto 4px;text-align:center;background:rgba(40,52,20,.80);padding:8px 20px;border-radius:22px;max-width:94%;box-sizing:border-box;line-height:1.14;text-shadow:0 2px 0 #1e5410,0 4px 10px rgba(0,0,0,.45);}
.capa .sub{color:#fff;font-weight:700;font-size:clamp(15px,4.2vw,19px);margin:4px 0 6px;background:rgba(40,52,20,.82);padding:6px 16px;border-radius:999px;}
.card{background:var(--card);border:3px solid var(--linha);border-radius:26px;padding:20px 18px 24px;max-width:440px;width:94%;box-shadow:0 12px 28px rgba(60,48,32,.18);}
h1{font-size:8vw;margin:4px 0;color:var(--terra);font-weight:800;letter-spacing:.3px;line-height:1.05}
@media(min-width:760px){h1{font-size:44px}}
.sub{color:#6b5d45;font-size:4.4vw;margin:2px 0 12px;font-weight:700}@media(min-width:760px){.sub{font-size:20px}}
.mascote{width:52vw;max-width:300px;filter:drop-shadow(0 12px 16px rgba(60,48,32,.28));-webkit-animation:fl 3s ease-in-out infinite;animation:fl 3s ease-in-out infinite;}
@-webkit-keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
@keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
.bt{border:0;border-radius:999px;padding:16px 32px;font-size:5.4vw;font-weight:800;color:#fff;background:var(--verde);box-shadow:0 6px 0 var(--verde-d),0 10px 16px rgba(0,0,0,.18);cursor:pointer;margin:8px;transition:transform .08s;}
@media(min-width:760px){.bt{font-size:22px}}
.bt:active{transform:translateY(4px);box-shadow:0 2px 0 var(--verde-d)}
.bt.sol{background:var(--sol);color:#5a4200;box-shadow:0 6px 0 var(--sol-d),0 10px 16px rgba(0,0,0,.18)}
.bt.roxo{background:var(--roxo);box-shadow:0 6px 0 #5a29ad,0 10px 16px rgba(0,0,0,.18)}
.campo{font-size:5vw;padding:13px 16px;border-radius:16px;border:3px solid var(--linha);text-align:center;width:86%;max-width:340px;margin:8px auto;display:block;}
@media(min-width:760px){.campo{font-size:22px}}
.figs{display:-webkit-flex;display:flex;-webkit-flex-wrap:wrap;flex-wrap:wrap;-webkit-justify-content:center;justify-content:center;gap:10px;margin:10px 0;}
.fig{width:21vw;max-width:96px;height:21vw;max-height:96px;border-radius:50%;background:#eafce0;border:4px solid var(--linha);padding:4px;cursor:pointer;overflow:hidden;}
.fig.sel{border-color:var(--verde);box-shadow:0 0 0 4px rgba(91,191,58,.4);}
.fig img{width:100%;height:100%;object-fit:contain;}
/* ==== ATELIE ==== */
#atelie{padding:0;background:var(--card);}
.topo{-webkit-flex:none;flex:none;width:100%;display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;gap:8px;padding:6px 12px;background:var(--terra);color:#fff;}
.topo .tt{font-weight:800;font-size:4.4vw}@media(min-width:760px){.topo .tt{font-size:20px}}
.topo .guia{height:44px;filter:drop-shadow(0 3px 4px #0004)}
.topo .zap{margin-left:auto;background:#ffffff2e;border:none;color:#fff;border-radius:14px;padding:8px 13px;font-size:20px;cursor:pointer}
#palco{-webkit-flex:1;flex:1;position:relative;width:100%;overflow:hidden;background:#dfeef7;}
#palcobg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;}
#boneco{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(46vh,74vw);height:min(64vh,98vw);}
#boneco .cam{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none;}
#boneco .cam img{position:absolute;object-fit:contain;}
.pegando{filter:brightness(1.07) drop-shadow(0 7px 11px #0007)!important;cursor:grabbing!important;}
.tocaflutua{-webkit-animation:flb 3.4s ease-in-out infinite;animation:flb 3.4s ease-in-out infinite;}
@-webkit-keyframes flb{0%,100%{transform:translate(-50%,-50%)}50%{transform:translate(-50%,-53%)}}
@keyframes flb{0%,100%{transform:translate(-50%,-50%)}50%{transform:translate(-50%,-53%)}}
.dica{position:absolute;left:0;right:0;bottom:6px;text-align:center;color:#fff;font-weight:700;font-size:12px;text-shadow:0 1px 3px #0009;pointer-events:none}
/* barra de categorias — ROLA de lado */
.cats{-webkit-flex:none;flex:none;width:100%;display:-webkit-flex;display:flex;overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch;gap:6px;padding:7px 8px;background:var(--sol);}
.cats::-webkit-scrollbar{height:6px}.cats::-webkit-scrollbar-thumb{background:#0002;border-radius:3px}
.cat{-webkit-flex:none;flex:none;min-width:64px;border:none;border-radius:14px;background:#ffffff8c;color:#5a4200;padding:7px 6px;font-size:12px;font-weight:800;cursor:pointer;}
.cat .ic{font-size:22px;display:block}
.cat.on{background:var(--verde);color:#fff}
/* bandeja de opções — ROLA de lado */
.bandeja{-webkit-flex:none;flex:none;width:100%;background:#f3ecd9;display:-webkit-flex;display:flex;overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch;gap:8px;padding:8px;min-height:100px;-webkit-align-items:center;align-items:center;}
.bandeja::-webkit-scrollbar{height:6px}.bandeja::-webkit-scrollbar-thumb{background:#0002;border-radius:3px}
.op{-webkit-flex:none;flex:none;width:82px;height:82px;background:#fff;border-radius:16px;border:3px solid var(--linha);display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;-webkit-justify-content:center;justify-content:center;padding:6px;cursor:pointer;}
.op:active{border-color:var(--verde);background:#eafce0}
.op img{max-width:100%;max-height:100%;object-fit:contain;pointer-events:none;}
.op.nenhum{font-size:12px;font-weight:800;color:#8a7f68;text-align:center;line-height:1.1}
.acoes{-webkit-flex:none;flex:none;width:100%;display:-webkit-flex;display:flex;gap:8px;padding:8px;background:var(--terra);}
.acoes .bt{-webkit-flex:1;flex:1;margin:0;font-size:4vw;padding:14px 6px}@media(min-width:760px){.acoes .bt{font-size:18px}}
.dragimg{position:fixed;pointer-events:none;z-index:60;width:84px;height:84px;object-fit:contain;transform:translate(-50%,-50%);filter:drop-shadow(0 6px 8px #0006);}
.conf{position:fixed;top:-20px;width:12px;height:16px;z-index:70;border-radius:2px;-webkit-animation:cai linear forwards;animation:cai linear forwards;}
@-webkit-keyframes cai{to{transform:translateY(105vh) rotate(600deg)}}
@keyframes cai{to{transform:translateY(105vh) rotate(600deg)}}
.galeria{display:-webkit-flex;display:flex;-webkit-flex-wrap:wrap;flex-wrap:wrap;gap:8px;-webkit-justify-content:center;justify-content:center;max-height:44vh;overflow:auto}
</style></head>
<body><div id="app"></div>
<audio id="au"></audio>
<script>
/* ===================== O ATELIÊ DO SR. BATATA (Pré) ===================== */
var IMG="img/", AUD="audio/", PRE="hb";
var CARIMBO_W=11;   /* tamanho padrao do carimbo (%) — menor; a crianca aumenta/diminui com − e + */
var CAT=[
 {k:"corpo", nome:"corpo",  ic:"🥔", itens:["hb_corpo1","hb_corpo2","hb_corpo3","hb_corpo4"], obrig:true},
 {k:"olho",  nome:"olhos",  ic:"👀", itens:["hb_olho1","hb_olho2","hb_olho3","hb_olho4","hb_olho5","hb_olho6"]},
 {k:"nariz", nome:"nariz",  ic:"👃", itens:["hb_nariz1","hb_nariz2","hb_nariz3","hb_nariz4"]},
 {k:"boca",  nome:"boca",   ic:"👄", itens:["hb_boca1","hb_boca2","hb_boca3","hb_boca4","hb_boca5","hb_boca6","hb_boca7","hb_boca8","hb_boca9"]},
 {k:"sobra", nome:"sobrancelha", ic:"〰️", itens:["hb_sobrancelha1","hb_sobrancelha2","hb_sobrancelha3","hb_sobrancelha4","hb_sobrancelha5","hb_sobrancelha6","hb_sobrancelha7","hb_sobrancelha8"]},
 {k:"orelha",nome:"orelhas",ic:"👂", itens:["hb_orelha1","hb_orelha2"]},
 {k:"oculos",nome:"óculos", ic:"👓", itens:["hb_oculos1","hb_oculos2"]},
 {k:"bigode",nome:"bigode", ic:"🧔", itens:["hb_bigode1","hb_bigode2","hb_bigode3","hb_bigode4","hb_bigode5","hb_bigode6","hb_bigode7","hb_bigode8"]},
 {k:"chapeu",nome:"chapéu", ic:"🎩", itens:["hb_chapeu7","hb_chapeu3","hb_chapeu4","hb_chapeu5","hb_chapeu6"]},
 {k:"carimbo",nome:"carimbos",ic:"⭐", stamp:true, itens:["hb_carimbo_estrela","hb_carimbo_coracao","hb_carimbo_arcoiris","hb_carimbo_balao","hb_carimbo_sol","hb_carimbo_flor","hb_carimbo_arvore","hb_carimbo_casa","hb_carimbo_foguete","hb_carimbo_abelha","hb_carimbo_borboleta","hb_carimbo_peixe"]}
 /* foguete e abelha voltaram em estilo massinha/alta resolucao; + borboleta e peixe. */
];
var CAMADAS=["orelha","corpo","sobra","olho","oculos","nariz","bigode","boca","chapeu"];
var ANCORA={corpo:{cx:50,cy:50,w:100},orelha:{cx:50,cy:40,w:72},
 sobra:{cx:50,cy:24,w:50},olho:{cx:50,cy:32,w:52},oculos:{cx:50,cy:33,w:56},
 nariz:{cx:50,cy:43,w:16},bigode:{cx:50,cy:52,w:26},boca:{cx:50,cy:54,w:30},chapeu:{cx:50,cy:8,w:56}};
var FUNDOS=[["cozinha","a cozinha"],["fazenda","a fazenda"],["cidade","a cidade"],["jardim","o jardim"],
 ["espaco","o espaço"],["hospital","o hospital"],["atelie","o ateliê"],["palco","o palco"],
 ["bombeiros","o quartel dos bombeiros"],["sala","a sala de aula"]];

var perfil={nome:"",fig:"hb_cr1"}, estado={}, catSel="corpo", fundoIdx=0, carimboSel=null;
function $(s){return document.getElementById(s);}
function el(t,c,h){var e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e;}

/* ---------- VOZ ---------- */
var _au=$("au"), _armado=false;
function arma(){ if(_armado)return; _armado=true; try{_au.play().catch(function(){});}catch(e){} }
function falar(id){ try{ _au.pause(); _au.src=AUD+id+".mp3"; _au.currentTime=0; var p=_au.play(); if(p&&p.catch)p.catch(function(){}); }catch(e){} }
var _ac=null;
function tom(f,d){ try{ if(!_ac)_ac=new (window.AudioContext||window.webkitAudioContext)(); var o=_ac.createOscillator(),g=_ac.createGain(); o.frequency.value=f; o.connect(g); g.connect(_ac.destination); g.gain.setValueAtTime(.14,_ac.currentTime); g.gain.exponentialRampToValueAtTime(.001,_ac.currentTime+(d||.15)); o.start(); o.stop(_ac.currentTime+(d||.15)); }catch(e){} }

/* ---------- MOVER peça/carimbo no palco (mouse + toque) — pedido do Marcos:
   "depois de colocar boca, olhos etc o estudante pudesse movimentar esses itens".
   As peças do rosto sao % da CAIXA do boneco; os carimbos sao % do PALCO. Cada um
   arrasta na sua propria referencia. Guarda do toque: nao deixo o clique que vem
   logo depois de um arrasto largar um carimbo novo (`_arrQuando`). */
var _arr=null, _arrQuando=0;
function _refPct(ref,cx,cy){ if(!ref)return null; var r=ref.getBoundingClientRect();
  return {x:Math.max(3,Math.min(97,((cx-r.left)/r.width)*100)), y:Math.max(4,Math.min(96,((cy-r.top)/r.height)*100))}; }
function _arrMove(cx,cy){ if(!_arr)return; if(Math.abs(cx-_arr.sx)>5||Math.abs(cy-_arr.sy)>5)_arr.moved=true;
  var q=_refPct(_arr.ref,cx,cy); if(!q)return; _arr.img.style.left=q.x+"%"; _arr.img.style.top=q.y+"%"; _arr.set(q.x,q.y); }
function _arrFim(){ if(!_arr)return; var a=_arr; _arr=null; a.img.style.zIndex=""; a.img.className=a.cls;
  if(!a.moved && a.tap){ a.tap(); }   /* soltou sem arrastar = TOQUE simples: seleciona */ }
document.addEventListener("mousemove",function(e){ if(_arr)_arrMove(e.clientX,e.clientY); });
document.addEventListener("mouseup",_arrFim);
document.addEventListener("touchmove",function(e){ if(_arr){var t=e.touches[0]; if(t){_arrMove(t.clientX,t.clientY); if(e.cancelable)e.preventDefault();}} },{passive:false});
document.addEventListener("touchend",_arrFim); document.addEventListener("touchcancel",_arrFim);
function movivel(img,ref,set,onTap){
  img.style.pointerEvents="auto"; img.style.cursor="grab"; img.style.touchAction="none";
  var cls=img.className||"";
  function pega(cx,cy){ arma(); _arr={img:img,ref:ref,set:set,cls:cls,tap:onTap,sx:cx,sy:cy,moved:false}; _arrQuando=(new Date()).getTime(); img.style.zIndex="55"; img.className=(cls?cls+" ":"")+"pegando"; tom(680,.08); }
  img.addEventListener("mousedown",function(e){ pega(e.clientX,e.clientY); if(e.preventDefault)e.preventDefault(); if(e.stopPropagation)e.stopPropagation(); });
  img.addEventListener("touchstart",function(e){ var t=e.touches[0]; pega(t?t.clientX:0,t?t.clientY:0); if(e.stopPropagation)e.stopPropagation(); },{passive:true});
}

/* ======================= TELAS ======================= */
function telaCapa(){
  var t=el("div","tela capa");
  var bg=el("img","capabg"); bg.src=IMG+"hb_fundo_atelie.png"; bg.alt=""; bg.onerror=function(){this.style.display='none';}; t.appendChild(bg);
  var c=el("div","centro");
  var m=el("img","mascote"); m.src=IMG+"hb_batata_feliz.png"; m.alt="Tato"; m.onerror=function(){this.style.display='none';}; c.appendChild(m);
  c.appendChild(el("h1",null,"O Ateliê do Sr. Batata"));
  c.appendChild(el("div","sub","Monte e vista o seu amigo batata!"));
  var b=el("button","bt","▶ Começar"); b.onclick=function(){arma();tom(660);falar("hb_abertura");telaQuem();};
  c.appendChild(b); t.appendChild(c);
  render(t); falar("hb_capa");
}
function telaQuem(){
  var t=el("div","tela capa");
  var bg=el("img","capabg"); bg.src=IMG+"hb_fundo_atelie.png"; bg.alt=""; bg.onerror=function(){this.style.display='none';}; t.appendChild(bg);
  var c=el("div","centro");
  c.appendChild(el("h1",null,"Quem vai brincar?"));
  var inp=el("input","campo"); inp.type="text"; inp.placeholder="Escreva o seu nome"; inp.maxLength=16; inp.value=perfil.nome||"";
  c.appendChild(inp);
  c.appendChild(el("div","sub","Escolha a sua figurinha:"));
  var figs=el("div","figs"),i;
  for(i=1;i<=6;i++){(function(n){ var f=el("div","fig"+(perfil.fig==n?" sel":"")); var im=el("img");im.src=IMG+n+".png";im.onerror=function(){this.style.display='none';};f.appendChild(im);
    f.onclick=function(){arma();tom(600);perfil.fig=n; var a=figs.getElementsByClassName("fig"),k;for(k=0;k<a.length;k++)a[k].className="fig"; f.className="fig sel";};
    figs.appendChild(f);})(PRE+"_cr"+i);}
  c.appendChild(figs);
  var b=el("button","bt","Vamos! ✨"); b.onclick=function(){arma();tom(720);perfil.nome=(inp.value||"").substring(0,16);telaAtelie();};
  c.appendChild(b); t.appendChild(c);
  render(t); falar("hb_quem");
}
function telaAtelie(){
  if(!estado.corpo) estado.corpo="hb_corpo1";
  var t=el("div"); t.id="atelie"; t.className="tela";
  var topo=el("div","topo");
  var g=el("img","guia"); g.src=IMG+"hb_batata_feliz.png"; g.id="guia"; g.onerror=function(){this.style.display='none';}; topo.appendChild(g);
  topo.appendChild(el("div","tt","Monte o seu Sr. Batata!"));
  var z=el("button","zap","🔊"); z.onclick=function(){falar("hb_ajuda");}; topo.appendChild(z);
  t.appendChild(topo);
  var palco=el("div"); palco.id="palco";
  var bg=el("img"); bg.id="palcobg"; bg.src=IMG+"hb_fundo_"+FUNDOS[fundoIdx][0]+".png"; palco.appendChild(bg);
  var bon=el("div"); bon.id="boneco"; bon.className="tocaflutua"; palco.appendChild(bon);
  var cbox=el("div"); cbox.id="carimbos"; cbox.style.cssText="position:absolute;inset:0;pointer-events:none;overflow:hidden"; palco.appendChild(cbox);
  palco.appendChild(el("div","dica","Toque numa peça 👇 — e arraste no rosto para mover ✋"));
  palco.addEventListener("click",function(e){ if(catSel!=="carimbo"||!carimboSel)return;
    if((new Date()).getTime()-_arrQuando<500)return;   /* acabou de arrastar: nao larga carimbo novo */
    if(e.target&&e.target.className&&(""+e.target.className).indexOf("pegando")>=0)return;
    var r=palco.getBoundingClientRect(); var x=((e.clientX-r.left)/r.width)*100, y=((e.clientY-r.top)/r.height)*100;
    x=Math.max(9,Math.min(91,x)); y=Math.max(12,Math.min(86,y)); /* trava dentro do quadro: carimbo nao corta na beira */
    if(!estado.carimbos)estado.carimbos=[]; estado.carimbos.push({it:carimboSel,x:x,y:y,w:CARIMBO_W}); carimboAtivo=estado.carimbos.length-1; arma(); tom(760); desenhaCarimbos(); });
  t.appendChild(palco);
  var cats=el("div","cats"),i;
  for(i=0;i<CAT.length;i++){(function(c){ var b=el("button","cat"+(catSel==c.k?" on":"")); b.innerHTML='<span class="ic">'+c.ic+'</span>'+c.nome; b.dataset.k=c.k;
    b.onclick=function(){arma();tom(560);catSel=c.k;marcaCat();bandeja();falar("hb_nome_"+c.k);};
    cats.appendChild(b);})(CAT[i]);}
  t.appendChild(cats);
  var bj=el("div","bandeja"); bj.id="bandeja"; t.appendChild(bj);
  var ac=el("div","acoes");
  var bf=el("button","bt sol","🖼️ Fundo"); bf.onclick=trocaFundo;
  var bl=el("button","bt roxo","🧽 Limpar"); bl.onclick=limpar;
  var bp=el("button","bt","✅ Pronto!"); bp.onclick=pronto;
  ac.appendChild(bf); ac.appendChild(bl); ac.appendChild(bp);
  t.appendChild(ac);
  render(t);
  desenhaBoneco(); desenhaCarimbos(); bandeja(); falar("hb_atelie");
}
var carimboAtivo=-1;   /* indice do carimbo selecionado (mostra o controle de tamanho) */
function desenhaCarimbos(){
  var box=$("carimbos"); if(!box)return; box.innerHTML="";
  var cs=estado.carimbos||[],i;
  if(carimboAtivo>=cs.length)carimboAtivo=-1;
  for(i=0;i<cs.length;i++){(function(ci,idx){ var im=el("img"); im.src=IMG+ci.it+".png"; im.onerror=function(){this.style.display='none';};
    var sel=(idx===carimboAtivo), w=(ci.w||CARIMBO_W);
    im.style.cssText="position:absolute;left:"+ci.x+"%;top:"+ci.y+"%;width:"+w+"%;transform:translate(-50%,-50%);object-fit:contain;-webkit-animation:pop .3s;animation:pop .3s;filter:drop-shadow(0 3px 5px #0005)"+(sel?";outline:3px dashed #ffcf3f;outline-offset:4px;border-radius:10px":"");
    movivel(im,$("palco"),function(x,y){ ci.x=x; ci.y=y; },
            function(){ carimboAtivo=(carimboAtivo===idx?-1:idx); tom(620); desenhaCarimbos(); });
    box.appendChild(im);
  })(cs[i],i);}
  box.style.pointerEvents="none";  /* a caixa nao pega; so os carimbos (auto) pegam */
  ctrlCarimbo();
}
/* barra de TAMANHO/apagar do carimbo selecionado (fixa no alto do palco: alvo grande e facil) */
function ctrlCarimbo(){
  var pal=$("palco"); if(!pal)return; var v=$("cctrl"); if(v)v.parentNode.removeChild(v);
  var cs=estado.carimbos||[]; if(carimboAtivo<0||!cs[carimboAtivo])return;
  var ci=cs[carimboAtivo];
  var c=el("div"); c.id="cctrl";
  c.style.cssText="position:absolute;left:50%;top:8px;transform:translateX(-50%);display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;gap:8px;background:rgba(255,255,255,.94);border:3px solid var(--linha);border-radius:18px;padding:5px 10px;z-index:45;box-shadow:0 4px 12px #0005";
  c.appendChild(el("span",null,"tamanho")).style.cssText="font-weight:800;color:#6a5a3a;font-size:14px";
  function bt(txt,bg,fn){ var b=el("button",null,txt); b.type="button";
    b.style.cssText="width:46px;height:46px;border-radius:50%;border:3px solid #fff;background:"+bg+";color:#fff;font-size:23px;font-weight:900;line-height:1;padding:0;cursor:pointer;box-shadow:0 3px 6px #0006";
    b.onclick=function(e){ if(e.stopPropagation)e.stopPropagation(); arma(); fn(); }; return b; }
  c.appendChild(bt("−","#e07a3f",function(){ ci.w=Math.max(5,(ci.w||CARIMBO_W)-2.5); tom(500); desenhaCarimbos(); }));
  c.appendChild(bt("+","#2e9e57",function(){ ci.w=Math.min(34,(ci.w||CARIMBO_W)+2.5); tom(780); desenhaCarimbos(); }));
  c.appendChild(bt("🗑","#c0455e",function(){ cs.splice(carimboAtivo,1); carimboAtivo=-1; tom(300); desenhaCarimbos(); }));
  pal.appendChild(c);
}
function marcaCat(){ var a=document.querySelectorAll(".cat"),i; for(i=0;i<a.length;i++)a[i].className="cat"+(a[i].dataset.k==catSel?" on":""); }
function desenhaBoneco(){
  var bon=$("boneco"); if(!bon)return; bon.innerHTML=""; estado.pos=estado.pos||{};
  for(var i=0;i<CAMADAS.length;i++){ var k=CAMADAS[i]; var v=estado[k]; if(!v)continue;
    var an=ANCORA[k]; var p=estado.pos[k]||{cx:an.cx,cy:an.cy};
    var cam=el("div","cam"); var im=el("img"); im.src=IMG+v+".png"; im.onerror=function(){this.style.display='none';};
    im.style.left=p.cx+"%"; im.style.width=an.w+"%"; im.style.top=p.cy+"%"; im.style.transform="translate(-50%,-50%)";
    if(k!=="corpo"){ (function(kk){ movivel(im,bon,function(x,y){ estado.pos[kk]={cx:x,cy:y}; }); })(k); }
    cam.appendChild(im); bon.appendChild(cam);
  }
}
function bandeja(){
  var bj=$("bandeja"); if(!bj)return; bj.innerHTML="";
  var c=null,i; for(i=0;i<CAT.length;i++) if(CAT[i].k==catSel)c=CAT[i];
  if(!c)return;
  if(c.stamp){ /* CARIMBOS: escolher o carimbo e depois tocar no quadro */
    var aviso=el("div","op nenhum","toque no quadro"); bj.appendChild(aviso);
    for(i=0;i<c.itens.length;i++){(function(it){
      var o=el("div","op"+(carimboSel==it?" sel":"")); var im=el("img"); im.src=IMG+it+".png";
      im.onerror=function(){ if(o.parentNode)o.parentNode.removeChild(o); }; o.appendChild(im);
      o.onclick=function(){ arma();tom(640); carimboSel=it; var a=bj.getElementsByClassName("op"),k;for(k=0;k<a.length;k++)a[k].className="op"; o.className="op sel"; falar("hb_nome_carimbo"); };
      bj.appendChild(o);
    })(c.itens[i]);}
    return;
  }
  if(!c.obrig){ var non=el("div","op nenhum","sem "+c.nome); non.onclick=function(){arma();tom(400);estado[c.k]=null;desenhaBoneco();}; bj.appendChild(non); }
  for(i=0;i<c.itens.length;i++){(function(it){
    var o=el("div","op"); var im=el("img"); im.src=IMG+it+".png"; im.onerror=function(){this.style.display='none';}; o.appendChild(im);
    o.onclick=function(){ aplica(c.k,it); };
    soDrag(o,c.k,it);   /* arrastar SÓ no mouse; no toque, o TAP acima aplica e a bandeja rola */
    bj.appendChild(o);
  })(c.itens[i]);}
}
function aplica(k,it){ arma(); tom(700); estado[k]=it; desenhaBoneco(); festinha(8); falar("hb_nome_"+k); }

/* arrastar com MOUSE (desktop). No celular vale o toque simples (tap) + rolar a bandeja. */
function soDrag(o,k,it){
  var ghost=null,arrastando=false;
  o.addEventListener("mousedown",function(e){
    arma(); arrastando=true; ghost=el("img","dragimg"); ghost.src=IMG+it+".png"; document.body.appendChild(ghost);
    mover(e.clientX,e.clientY);
    document.addEventListener("mousemove",move); document.addEventListener("mouseup",up);
  });
  function move(e){ if(arrastando)mover(e.clientX,e.clientY); }
  function mover(x,y){ if(ghost){ghost.style.left=x+"px";ghost.style.top=y+"px";} }
  function up(e){ if(!arrastando)return; arrastando=false;
    if(ghost&&ghost.parentNode)ghost.parentNode.removeChild(ghost); ghost=null;
    document.removeEventListener("mousemove",move); document.removeEventListener("mouseup",up);
    var pal=$("palco"); if(pal){var r=pal.getBoundingClientRect(); if(e.clientX>=r.left&&e.clientX<=r.right&&e.clientY>=r.top&&e.clientY<=r.bottom) aplica(k,it);}
  }
}
function trocaFundo(){ arma(); tom(520); fundoIdx=(fundoIdx+1)%FUNDOS.length; var bg=$("palcobg"); if(bg)bg.src=IMG+"hb_fundo_"+FUNDOS[fundoIdx][0]+".png"; falar("hb_fundo_"+FUNDOS[fundoIdx][0]); }
function limpar(){ arma(); tom(300); var corpo=estado.corpo; estado={corpo:corpo,pos:{}}; carimboAtivo=-1; desenhaCarimbos(); desenhaBoneco(); falar("hb_limpar"); }
function festinha(n){ var cores=["#ff5d5d","#ffd23f","#43c463","#3d9bff","#c86bff","#ff9a3d"],i;
  for(i=0;i<(n||18);i++){ var c=el("div","conf"); c.style.left=(Math.random()*100)+"vw"; c.style.background=cores[i%cores.length];
   var dur=(1+Math.random()*1.2); c.style.webkitAnimationDuration=dur+"s"; c.style.animationDuration=dur+"s"; document.body.appendChild(c);
   (function(cc){setTimeout(function(){if(cc.parentNode)cc.parentNode.removeChild(cc);},2600);})(c); } }
function miniBatata(box,e,f){ var bg=el("img"); bg.src=IMG+"hb_fundo_"+FUNDOS[f||0][0]+".png"; bg.style.cssText="position:absolute;inset:0;width:100%;height:100%;object-fit:cover"; box.appendChild(bg);
  var inner=el("div"); inner.style.cssText="position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:78%;height:88%";
  var ps=(e||{}).pos||{};
  for(var j=0;j<CAMADAS.length;j++){var k=CAMADAS[j],v=(e||{})[k];if(!v)continue;var an=ANCORA[k];var pp=ps[k]||an;var im=el("img");im.src=IMG+v+".png";im.style.cssText="position:absolute;left:"+pp.cx+"%;top:"+pp.cy+"%;width:"+an.w+"%;transform:translate(-50%,-50%);object-fit:contain";inner.appendChild(im);} box.appendChild(inner);
  var cs=(e||{}).carimbos||[]; for(var m=0;m<cs.length;m++){var ci=el("img");ci.src=IMG+cs[m].it+".png";ci.style.cssText="position:absolute;left:"+cs[m].x+"%;top:"+cs[m].y+"%;width:"+(cs[m].w||CARIMBO_W)+"%;transform:translate(-50%,-50%);object-fit:contain";box.appendChild(ci);} }
function pronto(){
  arma(); tom(880); festinha(60); salvaNaGaleria();
  var t=el("div","tela capa"); var c=el("div","card");
  c.appendChild(el("h1",null,"Que batata linda! 🎉"));
  c.appendChild(el("div","sub",(perfil.nome?perfil.nome+", v":"V")+"ocê é um artista!"));
  var mini=el("div"); mini.style.cssText="position:relative;width:46vw;max-width:250px;height:60vw;max-height:330px;margin:6px auto;border-radius:18px;overflow:hidden;box-shadow:0 8px 20px #0004;border:3px solid var(--linha)";
  miniBatata(mini,estado,fundoIdx); c.appendChild(mini);
  var b1=el("button","bt","🥔 Fazer outro"); b1.onclick=function(){arma();tom(660);telaAtelie();};
  var b2=el("button","bt sol","🖼️ Galeria"); b2.onclick=telaGaleria;
  c.appendChild(b1); c.appendChild(b2); t.appendChild(c);
  render(t); falar("hb_pronto");
}
function chaveG(){ return "batata_galeria"; }
function salvaNaGaleria(){ try{ var g=JSON.parse(localStorage.getItem(chaveG())||"[]"); g.unshift({e:estado,f:fundoIdx,q:(perfil.nome||"")}); g=g.slice(0,12); localStorage.setItem(chaveG(),JSON.stringify(g)); }catch(e){} }
function telaGaleria(){
  arma();tom(600); var g=[]; try{g=JSON.parse(localStorage.getItem(chaveG())||"[]");}catch(e){}
  var t=el("div","tela capa"); var c=el("div","card"); c.style.maxWidth="620px";
  c.appendChild(el("h1",null,"Minha galeria 🖼️"));
  if(!g.length) c.appendChild(el("div","sub","Ainda não tem nenhum. Faça o seu!"));
  var gal=el("div","galeria"),i;
  for(i=0;i<g.length;i++){(function(item){ var card=el("div"); card.style.cssText="position:relative;width:29vw;max-width:150px;height:39vw;max-height:200px;border-radius:12px;overflow:hidden;border:3px solid var(--linha)"; miniBatata(card,item.e,item.f); gal.appendChild(card); })(g[i]);}
  c.appendChild(gal);
  var b=el("button","bt","🥔 Fazer outro"); b.onclick=function(){arma();tom(660);telaAtelie();};
  c.appendChild(b); t.appendChild(c);
  render(t); falar("hb_galeria");
}
function render(t){ var a=$("app"); a.innerHTML=""; a.appendChild(t); }
setInterval(function(){ var g=$("guia"); if(!g)return; g.src=IMG+"hb_batata_pisca.png"; setTimeout(function(){ if($("guia"))$("guia").src=IMG+"hb_batata_feliz.png"; },180); }, 4200);
["click","touchstart","mousedown"].forEach(function(ev){ document.addEventListener(ev,arma,{once:true}); });
telaCapa();
</script>
