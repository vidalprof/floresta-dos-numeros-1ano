.lixo .lxt{font-size:10px;font-weight:800;line-height:1;margin-top:1px}
.lixo.hot{background:#c0455e;color:#fff;-webkit-transform:scale(1.2);transform:scale(1.2)}
/* barra de categorias — ROLA de lado */
.cats{-webkit-flex:none;flex:none;width:100%;display:-webkit-flex;display:flex;overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch;gap:6px;padding:7px 8px;background:var(--sol);}

  var figs=el("div","figs"),i;
  for(i=1;i<=6;i++){(function(n){ var f=el("div","fig"+(perfil.fig==n?" sel":"")); var im=el("img");im.src=IMG+n+".png";im.onerror=function(){this.style.display='none';};f.appendChild(im);
    f.onclick=function(){arma();tom(600);perfil.fig=n; var a=figs.getElementsByClassName("fig"),k;for(k=0;k<a.length;k++)a[k].className="fig"; f.className="fig sel";};
    figs.appendChild(f);})(PRE+"_cr"+i);}
  c.appendChild(figs);
  var b=el("button","bt","Vamos!"); b.onclick=function(){arma();tom(720);perfil.nome=(inp.value||"").substring(0,16);telaAtelie();};
  c.appendChild(b); t.appendChild(c);
  render(t); falar("hb_quem");
}
function telaAtelie(){
  if(!estado.corpo) estado.corpo="hb_corpo1";
  var t=el("div"); t.id="atelie"; t.className="tela";
  var topo=el("div","topo");
  var g=el("img","guia"); g.src=IMG+"hb_batata_feliz.png"; g.id="guia"; g.onerror=function(){this.style.display='none';}; topo.appendChild(g);
  topo.appendChild(el("div","tt","Monte o seu Sr. Batata!"));
  var z=el("button","zap",SVG.som); z.setAttribute("aria-label","Ouvir"); z.onclick=function(){falar("hb_ajuda");}; topo.appendChild(z);
  t.appendChild(topo);
  var palco=el("div"); palco.id="palco";
  var bg=el("img"); bg.id="palcobg"; bg.src=IMG+"hb_fundo_"+FUNDOS[fundoIdx][0]+".png"; palco.appendChild(bg);
  var bon=el("div"); bon.id="boneco"; bon.className="tocaflutua"; palco.appendChild(bon);
  var cbox=el("div"); cbox.id="carimbos"; cbox.style.cssText="position:absolute;inset:0;pointer-events:none;overflow:hidden"; palco.appendChild(cbox);
  palco.appendChild(el("div","dica","Arraste as peças no rosto. Para tirar, leve até a lixeira."));
  var lix=el("div","lixo"); lix.id="lixo"; lix.innerHTML=SVG.lixeira+'<span class="lxt">apagar</span>'; palco.appendChild(lix);
  palco.addEventListener("click",function(e){ if(!carimboSel)return;
    var cc=null,ii; for(ii=0;ii<CAT.length;ii++)if(CAT[ii].k===catSel)cc=CAT[ii];
    if(!cc||!cc.stamp)return;   /* so as categorias de CARIMBO e ORELHA colocam tocando no quadro */
    if((new Date()).getTime()-_arrQuando<500)return;   /* acabou de arrastar: nao larga peca nova */
    if(e.target&&e.target.className&&(""+e.target.className).indexOf("pegando")>=0)return;
    var r=palco.getBoundingClientRect(); var x=((e.clientX-r.left)/r.width)*100, y=((e.clientY-r.top)/r.height)*100;
    x=Math.max(9,Math.min(91,x)); y=Math.max(12,Math.min(86,y)); /* trava dentro do quadro: carimbo nao corta na beira */
    if(!estado.carimbos)estado.carimbos=[]; estado.carimbos.push({it:carimboSel,x:x,y:y,w:CARIMBO_W}); escolha={t:'c',i:estado.carimbos.length-1}; arma(); tom(760); redesenha(); });
  /* categorias no TOPO; a foto do 1o item vira o icone (a crianca do Pre NAO le,
     reconhece pela figura — nada de emoji, que nem aparece no PC da escola). */
  var cats=el("div","cats"),i;
  for(i=0;i<CAT.length;i++){(function(c){ var b=el("button","cat"+(catSel==c.k?" on":""));
    var ic0=c.itens[0]+(c.k==="orelha"?"_e":"");
    b.innerHTML='<img class="ici" src="'+IMG+ic0+'.png" alt="" onerror="this.style.display=\'none\'"><span class="cnm">'+c.nome+'</span>'; b.dataset.k=c.k;
    b.onclick=function(){arma();tom(560);catSel=c.k;carimboSel=null;marcaCat();bandeja();falar("hb_nome_"+c.k);};
    cats.appendChild(b);})(CAT[i]);}
  t.appendChild(cats);
  /* CORPO: itens numa COLUNA a ESQUERDA (pedido do Marcos) + palco grande a direita */
  var main=el("div"); main.id="main";
  var bj=el("div","bandeja"); bj.id="bandeja"; main.appendChild(bj);
  main.appendChild(palco);
  t.appendChild(main);
  var ac=el("div","acoes");
  var bf=el("button","bt sol",'<span class="bti">'+SVG.fundo+'</span> Fundo'); bf.onclick=trocaFundo;
  var bl=el("button","bt roxo",'<span class="bti">'+SVG.limpar+'</span> Limpar'); bl.onclick=limpar;
  var bp=el("button","bt",'<span class="bti">'+SVG.ok+'</span> Pronto'); bp.onclick=pronto;
  ac.appendChild(bf); ac.appendChild(bl); ac.appendChild(bp);
  t.appendChild(ac);
  render(t);
  desenhaBoneco(); desenhaCarimbos(); bandeja(); falar("hb_atelie");
}
/* SELECAO unica: um CARIMBO/orelha {t:'c',i} ou uma PECA do rosto {t:'p',k}.
   O que estiver selecionado ganha o controle de TAMANHO (− + 🗑). */
var escolha=null;
function redesenha(){ desenhaBoneco(); desenhaCarimbos(); }
function desenhaCarimbos(){
  var box=$("carimbos"); if(!box)return; box.innerHTML="";
  var cs=estado.carimbos||[],i;
  if(escolha&&escolha.t==='c'&&escolha.i>=cs.length)escolha=null;
  for(i=0;i<cs.length;i++){(function(ci,idx){ var im=el("img"); im.src=IMG+ci.it+".png"; im.onerror=function(){this.style.display='none';};
    var sel=(escolha&&escolha.t==='c'&&escolha.i===idx), w=(ci.w||CARIMBO_W);
    im.style.cssText="position:absolute;left:"+ci.x+"%;top:"+ci.y+"%;width:"+w+"%;transform:translate(-50%,-50%);object-fit:contain;-webkit-animation:pop .3s;animation:pop .3s;filter:drop-shadow(0 3px 5px #0005)"+(sel?";outline:3px dashed #ffcf3f;outline-offset:4px;border-radius:10px":"");
    movivel(im,$("palco"),function(x,y){ ci.x=x; ci.y=y; },
            function(){ escolha=(sel?null:{t:'c',i:idx}); tom(620); redesenha(); },
            function(){ var a=estado.carimbos||[]; a.splice(idx,1); escolha=null; redesenha(); });  /* arrastou p/ lixeira */
    box.appendChild(im);
  })(cs[i],i);}
  box.style.pointerEvents="none";  /* a caixa nao pega; so os itens (auto) pegam */
  ctrlTamanho();
}
/* SEM ferramenta de tamanho (Marcos: "não precisam aumentar ou diminuir").
   Apagar agora é ARRASTAR a peça até a LIXEIRA do canto (ver movivel/_arrFim). */
function ctrlTamanho(){ var v=$("cctrl"); if(v&&v.parentNode)v.parentNode.removeChild(v); }
function marcaCat(){ var a=document.querySelectorAll(".cat"),i; for(i=0;i<a.length;i++)a[i].className="cat"+(a[i].dataset.k==catSel?" on":""); }
/* AS DUAS ORELHAS JUNTAS — o par encaixa sozinho (fixo, simetrico, sem ajuste). */
function desenhaOrelhas(bon,style){ if(!style)return;
  if(typeof style==="string")style={img:style,filt:""};   /* galeria antiga */
  var lados=[["_e",ORELHA.le],["_d",ORELHA.ri]],s;
  for(s=0;s<2;s++){ var a=lados[s][1]; var cam=el("div","cam"); var im=el("img");
    im.src=IMG+style.img+lados[s][0]+".png"; im.onerror=function(){this.style.display='none';};
    im.style.left=a.cx+"%"; im.style.top=a.cy+"%"; im.style.width=a.w+"%"; im.style.transform="translate(-50%,-50%)";
    if(style.filt) im.style.filter=style.filt;
    cam.appendChild(im); bon.appendChild(cam); } }
function desenhaBoneco(){
  var bon=$("boneco"); if(!bon)return; bon.innerHTML=""; estado.pos=estado.pos||{}; estado.tam=estado.tam||{};
  for(var i=0;i<CAMADAS.length;i++){ var k=CAMADAS[i]; var v=estado[k]; if(!v)continue;
    if(k==="orelha"){ desenhaOrelhas(bon,v); continue; }   /* PAR fixo, nao ajusta */
    var an=ANCORA[k]; var p=estado.pos[k]||{cx:an.cx,cy:an.cy}; var w=an.w*(estado.tam[k]||1);
    var sel=(escolha&&escolha.t==='p'&&escolha.k===k);
    var cam=el("div","cam"); var im=el("img"); im.src=IMG+v+".png"; im.onerror=function(){this.style.display='none';};
    im.style.left=p.cx+"%"; im.style.width=w+"%"; im.style.top=p.cy+"%"; im.style.transform="translate(-50%,-50%)";
    if(sel){ im.style.outline="3px dashed #ffcf3f"; im.style.outlineOffset="3px"; im.style.borderRadius="10px"; }
    if(k!=="corpo"){ (function(kk){ movivel(im,bon,function(x,y){ estado.pos[kk]={cx:x,cy:y}; },
        function(){ escolha=(escolha&&escolha.t==='p'&&escolha.k===kk?null:{t:'p',k:kk}); tom(620); redesenha(); },
        function(){ estado[kk]=null; escolha=null; redesenha(); }); })(k); }   /* arrastou p/ lixeira = apaga a peça */
    cam.appendChild(im); bon.appendChild(cam);
  }
}
function bandeja(){
  var bj=$("bandeja"); if(!bj)return; bj.innerHTML="";
  var c=null,i; for(i=0;i<CAT.length;i++) if(CAT[i].k==catSel)c=CAT[i];
  if(!c)return;
  if(c.stamp){ /* CARIMBOS: escolher o carimbo e depois tocar no quadro */
    var aviso=el("div","op nenhum","toque no quadro"); bj.appendChild(aviso);
    for(i=0;i<c.itens.length;i++){(function(it){
      var o=el("div","op"+(carimboSel==it?" sel":"")); var im=el("img"); im.src=IMG+it+".png";
      im.onerror=function(){ if(o.parentNode)o.parentNode.removeChild(o); }; o.appendChild(im);
      o.onclick=function(){ arma();tom(640); carimboSel=it; var a=bj.getElementsByClassName("op"),k;for(k=0;k<a.length;k++)a[k].className="op"; o.className="op sel"; falar("hb_nome_carimbo"); };
      bj.appendChild(o);
    })(c.itens[i]);}
    return;
  }
  if(c.k==="orelha"){ /* PAR de orelhas, várias cores; encaixa sozinho ao tocar */
    var no=el("div","op nenhum","sem orelhas"); no.onclick=function(){arma();tom(400);estado.orelha=null;redesenha();}; bj.appendChild(no);
    for(i=0;i<ORELHA_ESTILOS.length;i++){(function(est){
      var o=el("div","op"); var im=el("img"); im.src=IMG+est.img+"_e.png"; im.onerror=function(){this.style.display='none';};
      if(est.filt)im.style.filter=est.filt; o.appendChild(im);
      o.onclick=function(){ aplica("orelha",est); };
      bj.appendChild(o);
    })(ORELHA_ESTILOS[i]);}
    return;
  }
  if(!c.obrig){ var non=el("div","op nenhum","sem "+c.nome); non.onclick=function(){arma();tom(400);estado[c.k]=null;if(escolha&&escolha.t==='p'&&escolha.k===c.k)escolha=null;redesenha();}; bj.appendChild(non); }
  for(i=0;i<c.itens.length;i++){(function(it){
    var o=el("div","op"); var im=el("img"); im.src=IMG+it+".png"; im.onerror=function(){this.style.display='none';}; o.appendChild(im);
    o.onclick=function(){ aplica(c.k,it); };
    soDrag(o,c.k,it);   /* arrastar SÓ no mouse; no toque, o TAP acima aplica e a bandeja rola */
    bj.appendChild(o);
  })(c.itens[i]);}
}
function aplica(k,it){ arma(); tom(700); estado[k]=it; redesenha(); festinha(8); falar("hb_nome_"+k); }

/* arrastar com MOUSE (desktop). No celular vale o toque simples (tap) + rolar a bandeja. */
function soDrag(o,k,it){
  var ghost=null,arrastando=false;
  o.addEventListener("mousedown",function(e){
    arma(); arrastando=true; ghost=el("img","dragimg"); ghost.src=IMG+it+".png"; document.body.appendChild(ghost);
    mover(e.clientX,e.clientY);
    document.addEventListener("mousemove",move); document.addEventListener("mouseup",up);
  });
  function move(e){ if(arrastando)mover(e.clientX,e.clientY); }
  function mover(x,y){ if(ghost){ghost.style.left=x+"px";ghost.style.top=y+"px";} }
  function up(e){ if(!arrastando)return; arrastando=false;
    if(ghost&&ghost.parentNode)ghost.parentNode.removeChild(ghost); ghost=null;
    document.removeEventListener("mousemove",move); document.removeEventListener("mouseup",up);
    var pal=$("palco"); if(pal){var r=pal.getBoundingClientRect(); if(e.clientX>=r.left&&e.clientX<=r.right&&e.clientY>=r.top&&e.clientY<=r.bottom) aplica(k,it);}
  }
}
function trocaFundo(){ arma(); tom(520); fundoIdx=(fundoIdx+1)%FUNDOS.length; var bg=$("palcobg"); if(bg)bg.src=IMG+"hb_fundo_"+FUNDOS[fundoIdx][0]+".png"; falar("hb_fundo_"+FUNDOS[fundoIdx][0]); }
function limpar(){ arma(); tom(300); var corpo=estado.corpo; estado={corpo:corpo,pos:{},tam:{}}; escolha=null; redesenha(); falar("hb_limpar"); }
function festinha(n){ var cores=["#ff5d5d","#ffd23f","#43c463","#3d9bff","#c86bff","#ff9a3d"],i;
  for(i=0;i<(n||18);i++){ var c=el("div","conf"); c.style.left=(Math.random()*100)+"vw"; c.style.background=cores[i%cores.length];
   var dur=(1+Math.random()*1.2); c.style.webkitAnimationDuration=dur+"s"; c.style.animationDuration=dur+"s"; document.body.appendChild(c);
   (function(cc){setTimeout(function(){if(cc.parentNode)cc.parentNode.removeChild(cc);},2600);})(c); } }
function miniBatata(box,e,f){ var bg=el("img"); bg.src=IMG+"hb_fundo_"+FUNDOS[f||0][0]+".png"; bg.style.cssText="position:absolute;inset:0;width:100%;height:100%;object-fit:cover"; box.appendChild(bg);
  var inner=el("div"); inner.style.cssText="position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:78%;height:88%";
  var ps=(e||{}).pos||{};
  var ts=(e||{}).tam||{};
  for(var j=0;j<CAMADAS.length;j++){var k=CAMADAS[j],v=(e||{})[k];if(!v)continue;
    if(k==="orelha"){ var st=(typeof v==="string")?{img:v,filt:""}:v; var L=[["_e",ORELHA.le],["_d",ORELHA.ri]],q;
      for(q=0;q<2;q++){var aa=L[q][1];var oi=el("img");oi.src=IMG+st.img+L[q][0]+".png";oi.style.cssText="position:absolute;left:"+aa.cx+"%;top:"+aa.cy+"%;width:"+aa.w+"%;transform:translate(-50%,-50%);object-fit:contain"+(st.filt?";filter:"+st.filt:"");inner.appendChild(oi);} continue; }
    var an=ANCORA[k];var pp=ps[k]||an;var tw=an.w*(ts[k]||1);var im=el("img");im.src=IMG+v+".png";im.style.cssText="position:absolute;left:"+pp.cx+"%;top:"+pp.cy+"%;width:"+tw+"%;transform:translate(-50%,-50%);object-fit:contain";inner.appendChild(im);} box.appendChild(inner);
  var cs=(e||{}).carimbos||[]; for(var m=0;m<cs.length;m++){var ci=el("img");ci.src=IMG+cs[m].it+".png";ci.style.cssText="position:absolute;left:"+cs[m].x+"%;top:"+cs[m].y+"%;width:"+(cs[m].w||CARIMBO_W)+"%;transform:translate(-50%,-50%);object-fit:contain";box.appendChild(ci);} }
function pronto(){
  arma(); tom(880); festinha(60); salvaNaGaleria();
  var t=el("div","tela capa"); var c=el("div","card");
  c.appendChild(el("h1",null,"Que batata linda!"));
  c.appendChild(el("div","sub",(perfil.nome?perfil.nome+", v":"V")+"ocê é um artista!"));
  var mini=el("div"); mini.style.cssText="position:relative;width:46vw;max-width:250px;height:60vw;max-height:330px;margin:6px auto;border-radius:18px;overflow:hidden;box-shadow:0 8px 20px #0004;border:3px solid var(--linha)";
  miniBatata(mini,estado,fundoIdx); c.appendChild(mini);
  var b1=el("button","bt","Fazer outro"); b1.onclick=function(){arma();tom(660);telaAtelie();};
  var b2=el("button","bt sol","Galeria"); b2.onclick=telaGaleria;
  c.appendChild(b1); c.appendChild(b2); t.appendChild(c);
  render(t); falar("hb_pronto");
}
function chaveG(){ return "batata_galeria"; }
function salvaNaGaleria(){ try{ var g=JSON.parse(localStorage.getItem(chaveG())||"[]"); g.unshift({e:estado,f:fundoIdx,q:(perfil.nome||"")}); g=g.slice(0,12); localStorage.setItem(chaveG(),JSON.stringify(g)); }catch(e){} }
function telaGaleria(){
  arma();tom(600); var g=[]; try{g=JSON.parse(localStorage.getItem(chaveG())||"[]");}catch(e){}
  var t=el("div","tela capa"); var c=el("div","card"); c.style.maxWidth="620px";
  c.appendChild(el("h1",null,"Minha galeria"));
  if(!g.length) c.appendChild(el("div","sub","Ainda não tem nenhum. Faça o seu!"));
  var gal=el("div","galeria"),i;
  for(i=0;i<g.length;i++){(function(item){ var card=el("div"); card.style.cssText="position:relative;width:29vw;max-width:150px;height:39vw;max-height:200px;border-radius:12px;overflow:hidden;border:3px solid var(--linha)"; miniBatata(card,item.e,item.f); gal.appendChild(card); })(g[i]);}
  c.appendChild(gal);
  var b=el("button","bt","Fazer outro"); b.onclick=function(){arma();tom(660);telaAtelie();};
  c.appendChild(b); t.appendChild(c);
  render(t); falar("hb_galeria");
}
function render(t){ var a=$("app"); a.innerHTML=""; a.appendChild(t); }
setInterval(function(){ var g=$("guia"); if(!g)return; g.src=IMG+"hb_batata_pisca.png"; setTimeout(function(){ if($("guia"))$("guia").src=IMG+"hb_batata_feliz.png"; },180); }, 4200);
["click","touchstart","mousedown"].forEach(function(ev){ document.addEventListener(ev,arma,{once:true}); });
telaCapa();
</script>
