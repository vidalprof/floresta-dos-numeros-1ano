<!DOCTYPE html>
<html lang="pt-BR"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Aprendendo a divisão: repartir em partes iguais, medir e o resto</title>
<meta name="description" content="DESCREVER: o assunto, o ano, quantas folhas e de onde vieram as folhas de papel colhidas.">
<!-- ============================================================
     ESQUELETO DA FOLHA VIVA — a casca, sem conteúdo nenhum.

     ⭐ POR QUE ELE EXISTE (pergunta do Marcos, 15/set/2026): *"mas por que você
     está clonando? Não é melhor colher as atividades da internet com o crivo e
     criar as interatividades que são pedidas, sem clonar?"*
     Ele estava certo sobre o problema. As INTERATIVIDADES nunca foram clonadas
     — o gesto sai do comando impresso na folha de papel. O que se clonava era o
     MOTOR, e junto com ele vinha o CONTEÚDO do caderno de origem: os objetivos
     do relatório, a citação do currículo, o sorteio das folhas, o prefixo das
     figuras, o `var LIGAR`. Na Fábrica de Nomes, CINCO das nove reprovações
     foram exatamente isso, e nenhuma tinha a ver com substantivos.
     Aqui não há o que esquecer de trocar, porque não há nada de ninguém dentro.

     ⚠️ NÃO SE COPIA ESTA PASTA À MÃO: use
        `bash _padrao/nova_folha_viva.sh <pasta> <prefixo> "<Título>"`,
        que carimba o prefixo em todos os lugares de uma vez e roda o pré-voo.

     O QUE JÁ VEM PRONTO, e não se reescreve: navegação e progresso, voz com
     alto-falante em tudo, o teclado de letras nas duas portas (tela e teclado de
     verdade), arrastar com mouse/dedo/caneta, gavetas, ligar, cruzadinha,
     boletim da criança, relatório do professor pela medalha, dossiê pedagógico,
     "continuar de onde parou" por 55 minutos, a chave 1275@ e o aviso ao
     controle da sala quando a criança termina.

     O QUE SE PREENCHE, e está marcado: GESTOS · ITENS · DADOS · NOMES ·
     CURRICULO · novaFolha() · OBJETIVOS (no folhas.js) · as folhas f01..fN.

     ES5 puro, um arquivo (mais o `folhas.js` ao lado), sem biblioteca.
     ============================================================ -->
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
:root{
  /* os tokens de cor da folha viva — sem eles o portão `_qa/cor_fixa.py` reprova
     cor de texto cravada, que num tema diferente vira letra invisível */
  --texto:#26201c;
  --texto2:#3a2f27;
  --texto3:#4a3d33;
  /* ⚠️ IDENTIDADE PRÓPRIA (Marcos, 18/set/2026: "cada caderno precisa ter capa
     diferente, cor diferente, animações"): este cinza é de ESQUELETO —
     CINZA DE ESQUELETO — TROCAR pela cor do ASSUNTO do caderno novo (`_padrao/identidade_capa.py`). O portão 0b11 (`_qa/identidade.py`)
     reprova cor, capa ou animação iguais às de qualquer outro caderno ou ao esqueleto. */
  /* ⭐ O AZUL-PETRÓLEO DOS POTES. A cor sai do ASSUNTO: o mundo deste caderno
     é uma bancada de potes em que a criança REPARTE com a mão, e o azul é o
     da louça. Conferido contra os 35 cadernos no ar: nenhum usa esta faixa. */
  --cor:#1f6f8b;
  --cor2:#124d61;
  --corclara:#e8f4f8;
}
body{font-family:"Segoe UI",Arial,sans-serif;background:#f4efe9;color:var(--texto);padding-bottom:160px}
#topo{position:-webkit-sticky;position:sticky;top:0;z-index:20;background:#fff;border-bottom:3px solid var(--cor);
  box-shadow:0 2px 14px rgba(70,40,20,.13);padding:8px 10px;display:flex;align-items:center;gap:10px;max-width:880px;margin:0 auto}
#topo .tit{font-weight:800;font-size:15px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prog{height:12px;background:#eee3d9;border-radius:8px;overflow:hidden;flex:1;min-width:60px;max-width:200px}
.prog i{display:block;height:100%;width:0;background:var(--cor);border-radius:8px;-webkit-transition:width .5s;transition:width .5s}
.pg{font-weight:800;font-size:14px;color:var(--cor2);white-space:nowrap}
button{font-family:inherit;cursor:pointer}
.bt{min-width:48px;min-height:48px;border:0;border-radius:16px;background:var(--cor);color:#fff;font-weight:800;font-size:17px;
  padding:10px 18px;box-shadow:0 4px 0 var(--cor2);-webkit-transition:transform .08s;transition:transform .08s}
.bt:active{transform:translateY(3px);box-shadow:0 1px 0 var(--cor2)}
.bt[disabled]{opacity:.45;cursor:default;box-shadow:none}
.bt.cinza{background:#eae2da;color:#57493f;box-shadow:0 4px 0 #cdc0b4}
.bt.verde{background:#15a34a;box-shadow:0 4px 0 #0d7736}
.zap{width:42px;height:42px;border-radius:50%;border:0;background:var(--cor);box-shadow:0 3px 0 var(--cor2);
  display:inline-flex;align-items:center;justify-content:center;padding:0;flex:none}
.zap svg{width:22px;height:22px;fill:#fff}
.zap.off{background:#c2b6ab;box-shadow:0 3px 0 #a3968b}
.zap.ouvir{background:#fff;box-shadow:0 3px 0 #ddd0c4;border:2px solid var(--cor)}
.zap.ouvir svg{fill:var(--cor)}
.zap.ouvir.tocando{-webkit-animation:pulsa 1s infinite;animation:pulsa 1s infinite}
@-webkit-keyframes pulsa{0%,100%{transform:scale(1)}50%{transform:scale(1.14)}}
@keyframes pulsa{0%,100%{transform:scale(1)}50%{transform:scale(1.14)}}

#livro{max-width:880px;margin:12px auto 0;padding:0 10px}
.pagina{position:relative;background:#fff;border-radius:22px;box-shadow:0 10px 34px rgba(70,40,20,.16);display:none;overflow:hidden;padding:0 0 20px}
.pagina.viva{display:block;-webkit-animation:entra .35s ease-out;animation:entra .35s ease-out}
@-webkit-keyframes entra{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes entra{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.faixa{background:var(--cor);color:#fff;padding:15px 18px 13px;display:flex;align-items:center;gap:12px}
.faixa h2{margin:0;font-size:clamp(17px,4.4vw,25px);letter-spacing:.4px;text-transform:uppercase;flex:1;line-height:1.1}
.faixa .num{background:#fff;color:var(--cor);font-weight:900;border-radius:50%;width:36px;height:36px;display:flex;
  align-items:center;justify-content:center;font-size:18px;flex:none}
/* uma cor por BLOCO da escada — a criança vê que mudou de assunto */
.pagina.c1 .faixa{background:#b0562a}.pagina.c1 .faixa .num{color:#b0562a}
.pagina.c2 .faixa{background:#1179bf}.pagina.c2 .faixa .num{color:#1179bf}
.pagina.c3 .faixa{background:#15803d}.pagina.c3 .faixa .num{color:#15803d}
.pagina.c4 .faixa{background:#8b5cf6}.pagina.c4 .faixa .num{color:#8b5cf6}
.pagina.c5 .faixa{background:#b45309}.pagina.c5 .faixa .num{color:#b45309}
.enun{margin:14px 16px 4px;font-size:clamp(15px,3.9vw,19px);font-weight:700;line-height:1.35}
.enun b{color:var(--cor2)}

.item{margin:12px 14px;padding:14px;border:2px solid #f0e6dd;border-radius:20px;background:#fffdfb}
.item.feito{border-color:#bfe6ce;background:#f3fcf6}
.item .n{font-weight:900;color:#b3a294;font-size:15px;margin-right:8px}
/* ⚠️ A FIGURA TEM ALTURA FIXA: com `height:auto` cada figura entrava no seu
   tamanho natural (o prédio com 230 px e o tijolo com 90) e, como `display:block`
   ignora o `text-align:center` do pai, todas encostavam na esquerda. */
.fig{display:block;width:auto;height:clamp(76px,19vw,116px);max-width:100%;
  margin:2px auto 6px;object-fit:contain;image-rendering:auto}
.figgrande{display:block;width:auto;height:clamp(84px,21vw,128px);max-width:100%;
  margin:0 auto;object-fit:contain}
.figbt{border:0;background:none;padding:4px;border-radius:16px;min-width:48px;min-height:48px}
/* ⚠️ O ALTO-FALANTE É DESENHADO EM CSS — caixinha + triângulo + duas ondas de
   borda arredondada. Nada de emoji (vira quadradinho nos PCs da escola) e nada
   de SVG solto (ordem do Marcos, set/2026). */
.som{position:relative;width:46px;height:46px;min-width:46px;border:3px solid var(--cor);
  border-radius:50%;background:var(--corclara);padding:0;cursor:pointer;flex:none}
.som:active{-webkit-transform:scale(.93);transform:scale(.93)}
.som .cone{position:absolute;left:12px;top:17px;width:7px;height:10px;background:var(--cor2);
  border-radius:2px 0 0 2px}
.som .cone:after{content:"";position:absolute;left:6px;top:-6px;width:0;height:0;
  border-top:11px solid transparent;border-bottom:11px solid transparent;
  border-right:11px solid var(--cor2)}
.som .onda{position:absolute;border:3px solid var(--cor2);border-left-color:transparent;
  border-top-color:transparent;border-bottom-color:transparent;border-radius:50%}
.som .o1{left:26px;top:16px;width:8px;height:12px}
.som .o2{left:29px;top:11px;width:13px;height:22px;opacity:.65}
/* ⚠️ A LINHA DO ENUNCIADO TEM DE QUEBRAR (19/set/2026, achado pela regra 5b).
   Sem `flex-wrap`, quando o texto ao lado é comprido o ALTO-FALANTE é empurrado
   para fora da tela — no `_nasal2`, folha 7, ele saía 47 px além da borda num
   celular pequeno, e a criança que não sabe ler ficava sem o botão que existe
   justamente para ela. Com wrap ele desce uma linha e continua ali. */
.enunlin{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin:0 2px}
.enunlin .enun{flex:1;min-width:0}

/* fileira genérica de opções */
.ops{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:10px}
/* ⚠️ O ALTO-FALANTE DA RESPOSTA — DISCRETO, e é regra do Marcos (20/set/2026):
   *"o alto-falante discreto para clicar caso o estudante queira ouvir"*. Ele
   vem AO LADO de cada opção, antes da escolha, para quem ainda não lê.
   ⚠️ 42 px e não menos: o portão de leiaute reprova alvo abaixo de 40 px, e
   dedo de criança não acerta menor que isso. "Discreto" aqui é a BORDA clara e
   a opacidade, não o tamanho. */
.opw{display:flex;align-items:center;gap:6px}
.opw.larga{width:100%;max-width:440px}
.opw.larga .op.frase{flex:1;width:auto;max-width:none}
.som.somop{width:42px;height:42px;min-width:42px;height:42px;border-width:2px;
  border-color:#e3d6ce;opacity:.85}
.som.somop:active{opacity:1}
.som.somop .cone{left:11px;top:15px}
.som.somop .o1{left:24px;top:14px}
.som.somop .o2{left:27px;top:9px}

.op{min-width:64px;min-height:56px;border:3px solid #e6dbd1;border-radius:16px;background:#fff;color:var(--texto);
  font-weight:900;font-size:20px;padding:8px 14px;-webkit-transition:transform .1s;transition:transform .1s}
.op:active{transform:scale(.94)}
.op.certa{border-color:#15a34a;background:#e7f8ee;color:#0d7736}
.op.erro{border-color:#e0562f;background:#fdeee9}
/* a opção que é uma FRASE (a definição, o porquê): texto corrido, alinhado à
   esquerda, largura cheia — frase centralizada em caixinha não se lê */
.op.frase{display:block;width:100%;max-width:420px;text-align:left;font-size:clamp(14px,3.7vw,17px);
  font-weight:700;line-height:1.35;letter-spacing:0;min-height:52px}
.op.curta{font-size:clamp(15px,4vw,19px);letter-spacing:.5px}
/* a opção COM figura */
.op.figbt{display:flex;flex-direction:column;align-items:center;gap:3px;
  min-width:96px;min-height:112px;padding:8px 10px}
.op.figbt .figop{display:block;width:auto;height:clamp(56px,14vw,80px);max-width:100%;object-fit:contain}
.rotop{font-weight:800;font-size:clamp(11px,2.9vw,13px);color:var(--texto2);letter-spacing:.4px;
  line-height:1.1;word-break:break-word}
/* ⚠️ A LEGENDA SECRETA. `visibility` e não `display`: o espaço fica guardado,
   então a folha não pula quando a palavra aparece no acerto. */
.segredo{visibility:hidden}
.segredo.revelado{visibility:visible;-webkit-animation:aparece .35s;animation:aparece .35s}
@-webkit-keyframes aparece{from{opacity:0}to{opacity:1}}
@keyframes aparece{from{opacity:0}to{opacity:1}}
.figsil{display:flex;flex-direction:column;align-items:center;gap:4px;margin:2px 0 6px}
.chamlin{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:center}
.chamlin b{font-size:clamp(15px,4vw,19px);color:var(--texto2);letter-spacing:.5px}

/* ---- marcar VÁRIAS certas (folha 1, da d18: "marque com x as corretas") ---- */
.marcax{display:flex;flex-direction:column;gap:8px;align-items:center;margin-top:10px}
.lx{display:flex;align-items:center;gap:12px;min-height:56px;border:3px solid #e6dbd1;border-radius:16px;
  background:#fff;padding:8px 14px;font-weight:700;font-size:clamp(14px,3.7vw,17px);color:var(--texto);
  width:100%;max-width:430px;text-align:left;line-height:1.3}
.lx .cx{width:34px;height:34px;border:3px solid #b3a294;border-radius:8px;display:inline-flex;align-items:center;
  justify-content:center;font-size:24px;font-weight:900;color:var(--cor);flex:none}
.lx.marcada{border-color:var(--cor);background:var(--corclara)}
.lx.marcada .cx{border-color:var(--cor)}
.lx.certa{border-color:#15a34a;background:#e7f8ee}
.lx.certa .cx{border-color:#15a34a;color:#15a34a}
.lx.errada{border-color:#e0562f;background:#fdeee9}

.alvonome.cheia{border-style:solid;border-color:#15a34a;background:#e7f8ee;color:#0d7736}
.banconome{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:8px 10px 10px}
.etiq{min-height:46px;padding:8px 14px;border:3px dashed #e6dbd1;border-radius:12px;background:#fff;
  font-weight:900;font-size:clamp(13px,3.6vw,17px);color:var(--texto3);cursor:pointer;letter-spacing:.5px;
  -ms-touch-action:none;touch-action:none}
.etiq.marcada{border-style:solid;border-color:var(--cor);background:var(--corclara)}
.etiq.usada{opacity:.32;pointer-events:none;border-style:solid}
.etiq.puxada{opacity:.35}

/* ---- juntar as sílabas numeradas (folha 5, da d18 item 4) ---- */
.tabsil{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;margin:8px 10px 6px}
.tsc{border:2px solid #e6dbd1;border-radius:10px;background:#fff;text-align:center;padding:5px 2px;
  min-height:46px;display:flex;flex-direction:column;justify-content:center;cursor:pointer}
.tsc .tsn{font-size:11px;font-weight:800;color:#b3a294;display:block;line-height:1}
/* ⚠️ tinta PRÓPRIA, não o token do fundo da atividade: a célula pinta o
   próprio fundo, então quem decide a cor da letra é ela (portão 4c). */
.tsc .tss{font-size:clamp(13px,3.6vw,18px);font-weight:900;color:#4a3d33;display:block;letter-spacing:.5px}
.tsc.usada{background:var(--corclara);border-color:var(--cor)}
.tsc:active{-webkit-transform:scale(.94);transform:scale(.94)}
.montada{display:flex;gap:5px;justify-content:center;flex-wrap:wrap;min-height:52px;align-items:center;margin:6px 0}
.mped{font-weight:900;font-size:clamp(17px,4.6vw,24px);color:#0d7736;background:#e7f8ee;border:2px solid #15a34a;
  border-radius:10px;padding:6px 10px;display:block}
.montada .vazio{font-weight:900;color:#c9bcb0;font-size:clamp(15px,4vw,19px)}

/* ---- ligar (folhas 8 e 22) ---- */
.ligar{position:relative;display:flex;gap:clamp(30px,10vw,96px);justify-content:space-between;margin:14px 6px}
.ligar .col{display:flex;flex-direction:column;gap:14px;flex:1 1 0;min-width:0}
.linhas{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none}
.ponta{border:3px solid #e6dbd1;border-radius:16px;background:#fff;height:92px;display:flex;align-items:center;
  /* flex-wrap: com figura + palavra comprida (ENSOLARADO a 320 px) a figura era
     empurrada para fora da caixa pela esquerda; embrulhando, ela sobe e a palavra
     fica embaixo (medido pelo leiaute_mao, _sinon2 folha 3) */
  flex-wrap:wrap;justify-content:center;font-weight:900;font-size:clamp(13px,3.4vw,17px);letter-spacing:.4px;padding:6px;
  text-align:center;line-height:1.15;color:var(--texto2);
  -ms-touch-action:none;touch-action:none;-webkit-transition:border-color .15s,box-shadow .15s;
  transition:border-color .15s,box-shadow .15s}
.ponta img{width:auto;height:70px;max-width:100%;object-fit:contain}
@media (max-width:420px){ .ponta{height:auto;min-height:78px} .ponta img{height:58px} }
.ponta.marcada{border-color:var(--cor);box-shadow:0 0 0 4px rgba(176,86,42,.22)}
.ponta.feita{border-color:#15a34a;background:#e7f8ee}
.ponta.mostra{border-color:#f0b64a;box-shadow:0 0 0 4px rgba(240,182,74,.4)}
.ponta.treme{-webkit-animation:treme .4s;animation:treme .4s}
@-webkit-keyframes treme{0%,100%{transform:none}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@keyframes treme{0%,100%{transform:none}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}

/* ---- caça-palavras dos materiais (folha 9, da d02) ---- */
.diagrama{display:grid;gap:2px;margin:8px auto 4px;max-width:430px;touch-action:none;
  -webkit-user-select:none;user-select:none}
.dcel{min-width:0;aspect-ratio:1/1;min-height:30px;border:1px solid #eee0d4;border-radius:6px;background:#fff;
  display:flex;align-items:center;justify-content:center;font-weight:900;
  font-size:clamp(11px,3.1vw,16px);color:var(--texto3);cursor:pointer;padding:0}
.dcel.tracando{background:#ffe9d6;border-color:var(--cor)}
.dcel.achada{background:#e7f8ee;border-color:#15a34a;color:#0d7736}
.listamat{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:6px 10px 4px}
.pmat{font-weight:900;font-size:clamp(12px,3.3vw,15px);color:var(--texto3);border:2px solid #e6dbd1;
  border-radius:10px;padding:5px 10px;background:#fff;letter-spacing:.5px}
.pmat.achada{border-color:#15a34a;background:#e7f8ee;color:#0d7736;text-decoration:line-through}

/* ---- classificar em colunas: lugares (11), vistas (19), cômodos (23) ---- */
.colunas{display:flex;gap:clamp(4px,1.6vw,10px);justify-content:center;margin:8px 8px 4px;flex-wrap:wrap}
.coluna{flex:1 1 28%;min-width:96px;max-width:200px;border:3px solid #e6dbd1;border-radius:14px;
  background:#fffdfb;padding:5px;min-height:112px;cursor:pointer}
.coluna.perto{border-color:var(--cor);background:var(--corclara)}
.coluna.erro{border-color:#e0562f;background:#fdeee9}
.ctit{font-weight:900;font-size:clamp(12px,3.2vw,15px);color:var(--texto2);margin-bottom:4px;
  border-bottom:2px solid #f0e6dd;padding-bottom:3px;display:flex;align-items:center;
  justify-content:center;gap:4px;flex-wrap:wrap;text-align:center;line-height:1.1}
.ctit .figmini{height:clamp(30px,7vw,40px)}
.cdentro{display:flex;flex-direction:column;gap:3px;align-items:center;min-height:56px}
.fdentro{font-weight:800;font-size:clamp(11px,3vw,14px);color:#0d7736;background:#e7f8ee;
  border-radius:8px;padding:3px 6px;display:block;max-width:100%;word-break:break-word;text-align:center}
.figmini{width:auto;height:clamp(34px,8vw,44px);max-width:100%;object-fit:contain;display:block}
.figbanco{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:6px 10px 10px}
.op.fig{padding:6px;min-width:96px;min-height:96px}
.op.fig .figmini{height:clamp(48px,12vw,64px)}
.op.fig.marcada{border-color:var(--cor);background:var(--corclara);
  -webkit-box-shadow:0 0 0 4px rgba(176,86,42,.18);box-shadow:0 0 0 4px rgba(176,86,42,.18)}
.op.fig.usada{opacity:.3;pointer-events:none}

/* ---- completar a lacuna (folha 15, da d23) ---- */
.frasel{font-size:clamp(15px,4vw,19px);font-weight:700;color:var(--texto2);line-height:1.7;
  text-align:center;margin:4px 6px 8px}
.lacuna{display:inline-block;min-width:96px;padding:2px 10px;border-bottom:4px solid var(--cor);
  color:var(--cor);font-weight:900;text-align:center}
.lacuna.cheia{border-bottom-color:#1f9d55;color:#1f9d55;background:#eafaf0;border-radius:8px 8px 0 0}

/* ---- cruzadinha (folha 16, da d08 reescrita) ---- */
.cruzenv{overflow-x:auto;margin:8px 0 4px}
.cruz{display:grid;gap:2px;margin:0 auto;width:-webkit-max-content;width:max-content}
.ccel{width:clamp(26px,7vw,34px);height:clamp(26px,7vw,34px);border:0;background:transparent;padding:0}
.ccel.viva{border:2px solid #d9c9bb;border-radius:5px;background:#fff;font-weight:900;
  font-size:clamp(13px,3.6vw,18px);color:var(--texto3);cursor:pointer;position:relative}
.ccel.viva.ativa{border-color:var(--cor);background:var(--corclara);
  -webkit-box-shadow:0 0 0 3px rgba(176,86,42,.25);box-shadow:0 0 0 3px rgba(176,86,42,.25)}
.ccel.viva.ok{border-color:#15a34a;background:#e7f8ee;color:#0d7736}
.ccel .cn{position:absolute;left:1px;top:0;font-size:9px;font-weight:800;color:#b3a294;line-height:1}
.pistas{display:flex;flex-direction:column;gap:6px;margin:8px 12px 4px}
.pista{display:flex;align-items:center;gap:8px;border:2px solid #f0e6dd;border-radius:12px;background:#fffdfb;

/* ---- a imagem aérea com pontos (folha 18) ---- */
.colho{text-align:center;margin:2px 0 4px;min-height:80px}
.credito{font-size:11px;line-height:1.35;color:#6b5347;margin:6px 2px 0;text-align:center}
.figolho{max-height:76px;width:auto;display:inline-block}
.aerea{position:relative;max-width:520px;margin:8px auto 4px;width:100%}
.aerea img{display:block;width:100%;height:auto;border-radius:16px;border:3px solid #e6dbd1}
/* ⚠️ O ALVO DA FOLHA 18 É INVISÍVEL ATÉ SER ACHADO, e isso é a folha inteira.
   A primeira versão pintava cada ponto com um anel branco por cima do desenho.
   Com três alvos já era discutível; com os dezessete da praça (uma fonte,
   quatro bancos, dez árvores e dois bebedouros) a figura virou um campo de
   bolhas — a criança tocava em qualquer anel e acertava sem OLHAR a praça, que
   é justamente o que a folha existe para medir. Agora o botão é só uma área de
   toque transparente do tamanho do dedo (52px, acima do piso de 44), e o anel
   verde só nasce quando ela acha. Achado por FOTO, 13/set/2026 — nenhum portão
   via, porque todos os alvos estavam lá, do tamanho certo, funcionando. */
.ponto{position:absolute;width:52px;height:52px;margin:-26px 0 0 -26px;border-radius:50%;
  border:3px solid transparent;background:transparent;cursor:pointer;padding:0}
.ponto.certo{background:rgba(21,163,74,.55);border-color:#0d7736;
  -webkit-box-shadow:0 2px 8px rgba(0,0,0,.3);box-shadow:0 2px 8px rgba(0,0,0,.3)}
.ponto.errado{background:rgba(224,86,47,.5);border-color:#fff}
.ponto:active{-webkit-transform:scale(.9);transform:scale(.9)}
/* teclado: quem navega por TAB precisa ver onde está */
.ponto:focus{outline:3px solid #fff;outline-offset:-3px}

/* ---- ordenar as cenas / o antes e o hoje (folhas 20 e 21) ---- */
.trilhaord{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:8px 6px 4px}
.slot{width:clamp(84px,23vw,124px);min-height:clamp(84px,23vw,124px);border:3px dashed var(--cor);
  border-radius:16px;background:var(--corclara);display:flex;flex-direction:column;align-items:center;
  justify-content:center;font-weight:900;font-size:20px;color:var(--cor2);padding:4px}
.slot .figmini{height:clamp(56px,15vw,86px)}
.slot.perto{border-style:solid;border-color:#15a34a;background:#e7f8ee}
.slot.cheia{border-style:solid;border-color:#15a34a;background:#e7f8ee}
.slot .rot{font-size:clamp(10px,2.7vw,12px);font-weight:800;color:#0d7736;line-height:1.05;text-align:center}
.sn{font-size:12px;font-weight:900;color:var(--cor2);display:block}

/* ---- achar as casas dentro do poema (folha 24, da d19) ---- */

  font-weight:600;margin:8px 12px 4px}
.poema .aut{display:block;font-size:13px;font-weight:800;color:#8a7768;margin-top:6px}

/* ================= A CAPA — A BANCADA DOS POTES =================
   ⭐ O MUNDO DESTE CADERNO. Regra do Marcos (18/set/2026): *"cada caderno
   precisa ter capa diferente, cor diferente, animações"*. A cena é a ideia do
   caderno desenhada: doze peças caindo, uma a uma, em três potes — e os potes
   ficando iguais. É o gesto das 35 folhas num desenho só, e é o gesto que o
   currículo pede com todas as letras (*"por meio de estratégias e registros
   pessoais"*, e não a conta armada na chave).
   ⚠️ `@keyframes` com NOME PRÓPRIO (`caiDiv3`, `balaDiv3`). */
.capa{position:relative;text-align:center;padding:18px 16px 24px;overflow:hidden;
  background:-webkit-linear-gradient(top,#cfe7ef 0%,#e8f4f8 58%,#fff 100%);
  background:linear-gradient(180deg,#cfe7ef 0%,#e8f4f8 58%,#fff 100%)}
.capa .ceu{position:absolute;left:0;right:0;top:0;bottom:0;pointer-events:none;overflow:hidden}
.capa .ceu:before,.capa .ceu:after{content:"";position:absolute;width:12px;height:12px;
  border-radius:50%;background:#7fb9cc;opacity:.45;left:16%;top:-6%;
  -webkit-animation:caiDiv3 6s linear infinite;animation:caiDiv3 6s linear infinite}
.capa .ceu:after{left:78%;-webkit-animation-delay:3s;animation-delay:3s}
@-webkit-keyframes caiDiv3{0%{-webkit-transform:translateY(0);opacity:0}
  12%{opacity:.45}100%{-webkit-transform:translateY(112vh);opacity:0}}
@keyframes caiDiv3{0%{transform:translateY(0);opacity:0}
  12%{opacity:.45}100%{transform:translateY(112vh);opacity:0}}
.capa .titu,.capa .sub,.capa .chamada,.capa .cena{position:relative;z-index:1}
.capa h1.titu{margin:12px 0 4px;line-height:1;display:flex;flex-wrap:wrap;justify-content:center;gap:2px}
.capa .titu .tpal{display:inline-flex;white-space:nowrap;gap:2px}
.capa .titu .lt{display:inline-block;font-size:clamp(20px,5.2vw,38px);font-weight:900;color:var(--cor2)}
.capa .titu .esp{display:inline-block;width:14px}
.capa .sub{font-weight:700;color:#124d61;font-size:clamp(13px,3.6vw,18px);margin:6px 0 4px}
.capa .cena{margin:16px auto 4px;max-width:620px;padding:6px 0 10px}
.bancada{display:-webkit-box;display:flex;-webkit-box-pack:center;justify-content:center;
  gap:clamp(10px,3vw,24px);flex-wrap:wrap;-webkit-box-align:end;align-items:flex-end}
.potec{width:clamp(74px,20vw,104px);border:3px solid var(--cor);border-top:0;
  border-radius:0 0 18px 18px;background:#fff;padding:8px 6px 10px;
  -webkit-box-shadow:0 5px 14px rgba(18,77,97,.18);box-shadow:0 5px 14px rgba(18,77,97,.18)}
.potec .pfila{display:-webkit-box;display:flex;flex-wrap:wrap;gap:4px;
  -webkit-box-pack:center;justify-content:center;min-height:48px;
  -webkit-box-align:end;align-items:flex-end}
.pbola{width:clamp(14px,4vw,18px);height:clamp(14px,4vw,18px);border-radius:50%;
  background:-webkit-linear-gradient(top,#ffd76a,#e0a800);
  background:linear-gradient(180deg,#ffd76a,#e0a800);
  -webkit-animation:balaDiv3 3.2s ease-in-out infinite;animation:balaDiv3 3.2s ease-in-out infinite}
.potec:nth-child(2) .pbola{-webkit-animation-delay:.35s;animation-delay:.35s}
.potec:nth-child(3) .pbola{-webkit-animation-delay:.7s;animation-delay:.7s}
.potec .prot{margin-top:6px;font:900 clamp(11px,3vw,13px)/1 system-ui;color:var(--cor2)}
@-webkit-keyframes balaDiv3{0%,100%{-webkit-transform:translateY(0)}45%{-webkit-transform:translateY(-6px)}}
@keyframes balaDiv3{0%,100%{transform:translateY(0)}45%{transform:translateY(-6px)}}
@media (prefers-reduced-motion:reduce){
  .pbola,.capa .ceu:before,.capa .ceu:after{-webkit-animation:none;animation:none}
}
.capa .chamada{margin-top:16px;font-weight:700;color:#124d61;font-size:clamp(13px,3.4vw,16px)}

#fim,#retomar{display:none;max-width:880px;margin:12px auto;background:#fff;border-radius:22px;padding:20px 16px;

.barra .tr i{display:block;height:100%;width:0;background:#15a34a;-webkit-transition:width .8s;transition:width .8s}
.barra b{flex:none;color:var(--cor2)}
/* ⚠️ SEM EMOJI E SEM SVG na tela da criança: nos PCs da escola o emoji vira
   quadradinho vazio, e a criança de sete anos não sabe o que é um quadradinho.
   Troféu e selos são PNG; as setas são triângulos de CSS puro. */
#medalha{width:132px;height:132px;border-radius:50%;background:radial-gradient(circle at 34% 30%,#ffe680,#e0a800);
  margin:14px auto;display:flex;align-items:center;justify-content:center;
  box-shadow:0 8px 22px rgba(180,140,0,.42);cursor:pointer;-ms-touch-action:none;touch-action:none}
#medalha img{width:92px;height:92px;object-fit:contain;display:block;pointer-events:none}
#medalha.semfig:after{content:"BOA!";font-weight:900;font-size:26px;color:#7a5600}
.seta{display:inline-block;width:0;height:0;vertical-align:middle;
  border-top:8px solid transparent;border-bottom:8px solid transparent}
.seta.esq{border-right:11px solid currentColor;margin-right:7px}
.seta.dir{border-left:11px solid currentColor;margin-left:7px}

#relatorio{display:none;text-align:left;background:#fbf7f3;border:2px solid #e6dbd1;border-radius:16px;padding:12px;margin-top:12px;font-size:13px}

  background:#fff;border-radius:0 12px 12px 0;font-size:13.5px;line-height:1.55;color:var(--texto2)}
#relatorio .comonota{margin:8px 0 0;font-size:11.5px;color:#7d6c5e;line-height:1.45}

#menuProf{display:none;position:fixed;inset:0;z-index:60;background:rgba(45,28,16,.62);align-items:center;justify-content:center;padding:14px}
#menuProf.aberto{display:flex}

  max-height:92vh;overflow:auto;box-shadow:0 14px 44px rgba(0,0,0,.4)}

#menuProf .folhas button{min-height:46px;border:0;border-radius:12px;background:#f4ebe3;color:#57493f;font-weight:800;
  font-size:14px;padding:8px 12px;box-shadow:0 3px 0 #ddd0c4;flex:1 1 150px;text-align:left}
/* ============================================================
   O CAMPO QUE CHAMA O TECLADO DO APARELHO.
   Ele mora EM CIMA da grade de casinhas e é praticamente invisível — mas
   continua sendo um campo de verdade, porque campo escondido não recebe foco
   e sem foco o teclado do celular não abre.
   ============================================================ */
#tecIn{position:absolute;z-index:5;border:0;background:transparent;color:transparent;
  caret-color:transparent;opacity:.01;font-size:16px;padding:0;margin:0;outline:0;
  -webkit-appearance:none;appearance:none}
#tecIn:focus{outline:0}
.cruz{position:relative}
#confete{position:fixed;inset:0;pointer-events:none;z-index:50;overflow:hidden}
.cf{position:absolute;width:9px;height:14px;opacity:.95;-webkit-animation:cai 1.5s linear forwards;animation:cai 1.5s linear forwards}
@-webkit-keyframes cai{to{transform:translateY(105vh) rotate(560deg);opacity:0}}
@keyframes cai{to{transform:translateY(105vh) rotate(560deg);opacity:0}}
.oculto{display:none!important}
.ajuda{text-align:center;font-size:14px;color:#7d6c5e;margin:2px 0 6px}
.fantasma{position:fixed;z-index:70;pointer-events:none;opacity:.92;
  -webkit-transform:scale(1.1);transform:scale(1.1);
  -webkit-box-shadow:0 12px 26px rgba(50,30,15,.3);box-shadow:0 12px 26px rgba(50,30,15,.3)}
/* o cinto e o suspensório do `draggable="false"`: navegador antigo não olha o
   atributo, mas olha esta regra */
img{-webkit-user-drag:none;-khtml-user-drag:none;-moz-user-drag:none;user-drag:none}
.bt.pronto{min-height:48px;padding:0 22px;font-size:16px;margin:6px auto 0;display:block}

/* =========================================================================
   ANIMAÇÃO DAS FOLHAS — e a regra que manda é NADA ANIMA SEM FUNÇÃO.
     · os itens ENTRAM EM CASCATA → a criança vê que a folha tem começo e ordem;
     · a faixa do título DESLIZA → marca a troca de folha;
     · o acerto DÁ UM PULINHO e a opção certa BRILHA → resposta tátil;
     · o erro BALANÇA de leve → diz "de novo" sem dizer "errou".
   `prefers-reduced-motion` desliga tudo e a folha continua inteira.
   ========================================================================= */
.pagina.viva .item{-webkit-animation:entraItem .42s ease-out both;animation:entraItem .42s ease-out both}
.pagina.viva .item:nth-child(2){-webkit-animation-delay:.05s;animation-delay:.05s}
.pagina.viva .item:nth-child(3){-webkit-animation-delay:.10s;animation-delay:.10s}
.pagina.viva .item:nth-child(4){-webkit-animation-delay:.15s;animation-delay:.15s}
.pagina.viva .item:nth-child(5){-webkit-animation-delay:.20s;animation-delay:.20s}
.pagina.viva .item:nth-child(6){-webkit-animation-delay:.25s;animation-delay:.25s}
.pagina.viva .item:nth-child(n+7){-webkit-animation-delay:.30s;animation-delay:.30s}
@-webkit-keyframes entraItem{from{opacity:0;-webkit-transform:translateY(14px)}to{opacity:1;-webkit-transform:none}}
@keyframes entraItem{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.pagina.viva .faixa{-webkit-animation:deslizaFaixa .4s cubic-bezier(.2,.9,.3,1) both;
  animation:deslizaFaixa .4s cubic-bezier(.2,.9,.3,1) both}
@-webkit-keyframes deslizaFaixa{from{opacity:0;-webkit-transform:translateX(-22px)}to{opacity:1;-webkit-transform:none}}
@keyframes deslizaFaixa{from{opacity:0;transform:translateX(-22px)}to{opacity:1;transform:none}}
.op.certa,.cartaocasa.escolhido{
  -webkit-animation:pulinho .4s cubic-bezier(.3,1.6,.5,1);animation:pulinho .4s cubic-bezier(.3,1.6,.5,1)}
@-webkit-keyframes pulinho{0%{-webkit-transform:scale(1)}45%{-webkit-transform:scale(1.09)}100%{-webkit-transform:scale(1)}}
@keyframes pulinho{0%{transform:scale(1)}45%{transform:scale(1.09)}100%{transform:scale(1)}}
.op.certa{position:relative;overflow:hidden}
.op.certa::after{content:"";position:absolute;top:0;bottom:0;left:-40%;width:38%;pointer-events:none;
  background:-webkit-linear-gradient(left,rgba(255,255,255,0),rgba(255,255,255,.75),rgba(255,255,255,0));
  background:linear-gradient(90deg,rgba(255,255,255,0),rgba(255,255,255,.75),rgba(255,255,255,0));
  -webkit-transform:skewX(-18deg);transform:skewX(-18deg);
  -webkit-animation:brilhoOp .55s .1s ease-out;animation:brilhoOp .55s .1s ease-out}
@-webkit-keyframes brilhoOp{from{left:-40%}to{left:112%}}
@keyframes brilhoOp{from{left:-40%}to{left:112%}}
.op.erro{-webkit-animation:balanca .34s;animation:balanca .34s}
@-webkit-keyframes balanca{0%,100%{-webkit-transform:translateX(0)}25%{-webkit-transform:translateX(-6px)}75%{-webkit-transform:translateX(6px)}}
@keyframes balanca{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.item{-webkit-transition:border-color .4s,background .4s;transition:border-color .4s,background .4s}
/* a figura responde ao toque — o alvo reage ao PRESSIONAR */
.op.figbt:active,.cartaocasa:active,.celmor:active{-webkit-transform:scale(.96);transform:scale(.96)}
@media (prefers-reduced-motion:reduce){
  .pagina.viva .item,.pagina.viva .faixa,.op.certa,.op.erro,.cartaocasa.escolhido{
    -webkit-animation:none!important;animation:none!important;opacity:1!important;
    -webkit-transform:none!important;transform:none!important}
  .op.certa::after{display:none}
}

/*</dossie-css>*/
/* ---------- as peças próprias deste caderno (ortografia) ----------
   ⚠️ Aqui não há figura para olhar: o conteúdo é PALAVRA. Então a palavra é que
   tem de ser grande, legível e com espaço em volta — é ela que faz o papel que
   a ilustração faz nos outros cadernos. */
.pgrande{font-size:clamp(22px,6.4vw,32px);font-weight:900;letter-spacing:clamp(1px,.6vw,3px);
  color:var(--texto3);text-align:center;line-height:1.25;word-break:break-word;padding:0 6px}
.pgrande .lacuna{display:inline-block;min-width:clamp(22px,6vw,30px);vertical-align:baseline;
  border-bottom:4px solid var(--cor);margin:0 2px}
/* o botão de PALAVRA (gavetas e quadro): texto, não figura */
.op.pal{min-width:clamp(88px,26vw,150px);min-height:52px;padding:8px 12px;
  font-size:clamp(13px,3.5vw,16px);font-weight:800;letter-spacing:.4px;color:var(--texto2)}
.op.pal.marcada{border-color:var(--cor);background:var(--corclara);
  -webkit-transform:scale(1.04);transform:scale(1.04)}
.op.pal.usada{opacity:.3;pointer-events:none}
.figbanco.quadro{border:3px dashed #e0d3c6;border-radius:16px;background:#fffdfa;
  padding:10px 8px;margin:10px}
/* a letra sozinha do "complete com T ou D" — alvo grande, pouca letra */
.op.letra{min-width:clamp(62px,17vw,84px);min-height:60px;font-size:clamp(20px,5.6vw,26px);
  font-weight:900;letter-spacing:1px}
/* o "circule a certa": o botão vira a roda de lápis em volta da palavra */
.op.circ{border-radius:999px;padding:10px 16px;min-height:52px;
  font-size:clamp(14px,3.9vw,18px);font-weight:800;letter-spacing:.4px}
.op.circ.certa{-webkit-box-shadow:0 0 0 4px #bdebd0;box-shadow:0 0 0 4px #bdebd0}
/* a palavra escrita ERRADA, quando ela precisa aparecer (folhas 12 e 19) */
.errada{color:#b23c17;text-decoration:line-through;-webkit-text-decoration-color:#e0562f;
  text-decoration-color:#e0562f;font-weight:900}
/* texto corrido de gênero: recado, notícia. Alinhado à esquerda, como no papel */
.poema.recado{text-align:left;line-height:1.65;font-size:clamp(14px,3.8vw,17px)}
.poema .tl{margin:2px 0}
.frases{margin:8px 0 4px}
.lacuna.grande{min-width:clamp(120px,34vw,190px);font-size:clamp(14px,3.8vw,17px);font-weight:900}
.lacuna.erro{border-bottom-color:#e0562f;background:#fdeee9;border-radius:8px 8px 0 0}
/* a fila da receita: passo é FRASE, então a fila é vertical e larga */
.trilhaord.passos{flex-direction:column;align-items:stretch;margin:8px 10px 4px}
.trilhaord.passos .slot{width:auto;min-height:52px;flex-direction:row;gap:8px;
  padding:8px 10px;justify-content:flex-start;text-align:left}
.trilhaord.passos .slot .rot{text-align:left;font-size:clamp(12px,3.3vw,15px)}
/* a linha de casas do "reescreva certo": uma palavra por vez */
/* ⚠️ A FILA DE ESCREVER NÃO PODE CRESCER SÓ PARA A DIREITA (lição paga no
   `_not2`, 19/set/2026, e repetida no `_seg2` no mesmo dia porque o conserto
   tinha ficado só lá). Com `grid-auto-flow:column` a fila cresce sem parar:
   GOLFINHO (8 letras) já saltava do cartão no celular, e CACHORRINHO (11)
   passava 46 px da tela — a criança escrevia às cegas nas últimas casinhas.
   Flex com `wrap` desce para a segunda linha, que é o que a folha de papel faz. */
.cruz.uma{display:flex;flex-wrap:wrap;gap:4px;justify-content:center;
  width:auto;max-width:100%;margin:4px auto 2px}
.cruz.uma .ccel{width:clamp(42px,9vw,50px);height:clamp(42px,9vw,50px);
  min-width:42px;min-height:42px;flex:none}
.pista.oculta{display:none}
/* o cartaz do fecho: as regras que a criança escolheu, uma embaixo da outra */
.rua.cartaz{flex-direction:column;align-items:stretch;gap:6px;padding:10px;
  border:3px solid #e6dbd1;border-radius:16px;background:#fffdfa;margin:0 10px 8px}
.regral{border-left:6px solid var(--cor);border-radius:8px;background:#fff;padding:7px 10px;
  text-align:left}
.regral b{display:block;font-size:clamp(13px,3.5vw,16px);color:#2c3350;line-height:1.3}
.regral i{display:block;font-style:normal;font-weight:800;font-size:clamp(11px,3vw,13px);
  color:#8a7768;letter-spacing:.4px;margin-top:2px}
/* a capa: os pares de letras que fazem o mesmo som são o desenho da capa */
.dupla{display:inline-flex;align-items:center;gap:4px;background:#fff;border:3px solid #e6dbd1;
  border-radius:14px;padding:6px 10px;margin:3px}
.dupla b{font-size:clamp(17px,4.6vw,22px);font-weight:900;color:#3b4064}
.dupla i{font-style:normal;font-weight:900;color:var(--cor);font-size:clamp(13px,3.4vw,16px)}
/* ---------- as peças próprias deste caderno (a loteria do S) ---------- */
/* a FICHA: figura + palavra, e a criança marca só as escritas certas (folha 1) */
.marcax.fichas{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.lx.ficha{flex:1 1 44%;max-width:230px;flex-direction:column;align-items:center;gap:4px;
  padding:8px 6px;text-align:center}
.lx.ficha .figmini{display:block;width:auto;height:clamp(46px,12vw,66px);max-width:100%;object-fit:contain}
.lx.ficha .ft{font-weight:900;font-size:clamp(13px,3.5vw,16px);letter-spacing:.5px;color:var(--texto2)}
.lx.ficha .cx{position:absolute;left:6px;top:6px}
.lx.ficha{position:relative}
.lx.ficha.erroficha{border-color:#e0a05a;background:#fff7ec}
.lx.ficha.erroficha .ft s{color:#b23c17;-webkit-text-decoration-color:#e0562f;text-decoration-color:#e0562f}
.lx.ficha.erroficha .ft b{display:block;color:#0d7736}
/* as SÍLABAS soltas e a palavra que se monta (folha 13) */
.op.sil{min-width:clamp(58px,16vw,86px);min-height:52px;font-size:clamp(15px,4vw,19px);
  font-weight:900;letter-spacing:1px}
.op.sil.usada{border-color:#15a34a;background:#e7f8ee;color:#0d7736;pointer-events:none}
.montada{min-height:34px;text-align:center;font-weight:900;letter-spacing:2px;
  font-size:clamp(16px,4.4vw,21px);color:var(--texto3);margin:2px 0 4px}
.montada[data-feito]::before{content:attr(data-feito);color:#0d7736}
/* a FRASE GRUDADA e os vãos onde entra o espaço (folha 18) */
.grudada{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;
  margin:6px 4px;padding:8px 4px;border:3px solid #e6dbd1;border-radius:14px;background:#fff}
.gl{font-weight:900;font-size:clamp(15px,4.2vw,20px);letter-spacing:0;color:var(--texto3);line-height:1.6}
.vao{width:14px;min-width:14px;height:42px;border:0;background:transparent;padding:0;
  position:relative;cursor:pointer}
.vao::after{content:"";position:absolute;left:5px;top:8px;width:3px;height:26px;border-radius:2px;
  background:#e6dbd1}
.vao.cortado::after{background:#15a34a;-webkit-box-shadow:0 0 0 2px #bdebd0;box-shadow:0 0 0 2px #bdebd0}
.vao.erro::after{background:#e0562f}
/* a VITRINE das duas figuras lado a lado (folha 16) */
.ficha.vitrine{flex:1 1 44%;max-width:210px;display:flex;flex-direction:column;align-items:center;
  gap:4px;padding:8px 6px;text-align:center;border:3px solid #e6dbd1;border-radius:14px;background:#fff}
.ficha.vitrine .figmini{display:block;width:auto;height:clamp(52px,14vw,78px);max-width:100%;object-fit:contain}
/* ⚠️ TINTA PRÓPRIA, não o token: esta peça pinta o PRÓPRIO fundo (branco), e o
   `--texto` é a tinta do fundo da atividade. Quem tem superfície própria tem
   tinta própria — senão, num tema diferente, a letra some. Mede o 4c. */
.ficha.vitrine .ft{font-weight:900;font-size:clamp(13px,3.5vw,16px);color:#3a2f27}
/* o TEXTINHO: a frase palavra por palavra, cada uma tocável (folhas 7, 13 e 21) */
.textinho{margin:6px 8px;padding:10px 8px;border:3px solid #e6dbd1;border-radius:14px;background:#fff;
  line-height:2.1;text-align:left}
.tp{border:0;background:transparent;padding:4px 3px;margin:0;font:inherit;font-weight:700;
  font-size:clamp(15px,4vw,18px);color:#4a3d33;border-radius:7px;cursor:pointer;
  min-height:40px;-webkit-transition:background .15s;transition:background .15s;min-width:42px;min-height:44px}
.tp:hover{background:#f7efe7}
.tp.achada{background:#e7f8ee;color:#0d7736;font-weight:900;
  -webkit-box-shadow:inset 0 -3px 0 #15a34a;box-shadow:inset 0 -3px 0 #15a34a}
.tp.marcap{background:#e8f1fb;color:#134f86;font-weight:900;
  -webkit-box-shadow:inset 0 -3px 0 #1d6fb8;box-shadow:inset 0 -3px 0 #1d6fb8}
.tp.marcad{background:#fdeee9;color:#8c3414;font-weight:900;
  -webkit-box-shadow:inset 0 -3px 0 #b8471d;box-shadow:inset 0 -3px 0 #b8471d}
.tp.nao{-webkit-animation:treme .34s;animation:treme .34s;background:#fdeee9}
/* o TEXTÃO: a história da folha 24 */
.textao{margin:6px 8px;padding:12px 12px;border:3px solid #e6dbd1;border-radius:14px;background:#fff;
  line-height:1.75;font-size:clamp(14px,3.8vw,17px);color:var(--texto3);text-align:left}
/* os LÁPIS: a cor da família (folha 20) e as duas marcas (folha 21) */
.ops.lapis{gap:6px;flex-wrap:wrap;justify-content:center;margin:4px 8px 6px}
/* ⚠️ O FUNDO É DECLARADO AQUI mesmo o JS o trocando pela cor da família: sem
   fundo próprio na regra, a tinta cravada briga com o tema (é o que o
   `_qa/cor_fixa.py` mede). Quem crava a tinta tem de cravar o chão embaixo. */
.op.lapiz{min-height:46px;font-weight:900;font-size:clamp(13px,3.4vw,16px);color:#26201c;
  background:#fff;border:3px solid #e6dbd1;border-radius:12px;padding:6px 12px}
.op.lapiz.marcada{-webkit-transform:scale(1.07);transform:scale(1.07);
  -webkit-box-shadow:0 0 0 3px rgba(0,0,0,.18);box-shadow:0 0 0 3px rgba(0,0,0,.18)}
.op.lapiz.marcap{background:#e8f1fb;border-color:#1d6fb8;color:#134f86}
.op.lapiz.marcad{background:#fdeee9;border-color:#b8471d;color:#8c3414}
/* as PALAVRAS ESPALHADAS que se pintam (folha 20) */
.espalhadas{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:6px 8px 10px}
.pal.solta{border:3px solid #e6dbd1;border-radius:12px;background:#fff;padding:9px 13px;
  min-height:46px;font-weight:900;font-size:clamp(13px,3.6vw,16px);letter-spacing:.5px;
  color:var(--texto3);cursor:pointer}
/* ⚠️ ELA PINTA O PRÓPRIO FUNDO em tempo real (a cor da família, vinda do JS),
   então a tinta tem de ser dela e escura o bastante para as cinco cores da
   paleta. O token `--texto` aqui seria a tinta do fundo da ATIVIDADE, que não
   é o fundo que está atrás desta letra. */
.pal.solta.pintada{background:#fff;border-color:rgba(0,0,0,.2);color:#1c1611;pointer-events:none}
.pal.solta.nao{-webkit-animation:treme .34s;animation:treme .34s;background:#fdeee9}
.op.pal.nao{-webkit-animation:treme .34s;animation:treme .34s}

/* ============================================================
   AS PEÇAS DESTE CADERNO — o CSS veio JUNTO COM A PEÇA, não reescrito.
   Do `_sil2` (caderno de sílaba do 2º ano): bolinhas, cortar, sílabas soltas,
   estojo de canetinhas, caça-palavras, trilha e cartaz. Do `_corpo5`: a
   memória e a forca. Clonar a peça e redesenhar o CSS dela seria arrumar lugar
   para um defeito já pago noutro caderno.
   ============================================================ */
.perg{flex:1;min-width:0;font-size:clamp(15px,3.9vw,18px);font-weight:800;line-height:1.35;
  color:var(--texto2)}
.dica{flex:1;min-width:0;font-size:clamp(14px,3.6vw,17px);font-weight:700;line-height:1.35;
  color:var(--texto3);font-style:italic}
/* ---- bolinhas (contar), clonadas do _fra1 ---- */
.bolinhas{display:flex;gap:clamp(8px,2.4vw,12px);justify-content:center;margin:8px 0 6px;flex-wrap:wrap}
.bolinha{width:clamp(42px,11vw,52px);height:clamp(42px,11vw,52px);min-width:42px;min-height:42px;
  border-radius:50%;border:3px solid #b9c0d4;background:#fff;cursor:pointer;
  -webkit-transition:.15s;transition:.15s}
.bolinha.cheia{background:#ffd233;border-color:#e0ac00;
  -webkit-box-shadow:0 2px 0 #c89600;box-shadow:0 2px 0 #c89600}
.bolinha:active{-webkit-transform:scale(.9);transform:scale(.9)}
.bolinhas.erro .bolinha{border-color:#e2574c}
.pronto{display:block;margin:6px auto 0}

/* ---- cortar a palavra (separar em sílabas) ---- */
.cortar{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;
  gap:2px;margin:10px 0 4px}
.clt{font:800 clamp(24px,6.6vw,34px)/1 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color:#243056;padding:6px 2px;background:none;border:0}
button.clt{cursor:pointer;min-width:40px;min-height:44px;border-radius:8px}
button.clt:active{background:#eef1f8}
.clt.vogal{background:#ffd233;color:#5a4300;-webkit-box-shadow:0 2px 0 #c89600;box-shadow:0 2px 0 #c89600}
.clt.nao{background:#ffd9d6;color:#9d2f26}
.pedaco{display:inline-flex;align-items:center;border:2px dashed #c6cde0;
  border-radius:10px;padding:0 3px}
.tra{font:800 clamp(20px,5vw,28px)/1 system-ui;color:#8a93ad;margin:0 2px}
.fresta{width:clamp(22px,6vw,30px);min-width:22px;height:clamp(44px,11vw,54px);min-height:44px;
  border:0;background:none;cursor:pointer;border-radius:8px;position:relative;min-width:40px;min-height:44px}
.fresta:before{content:"";position:absolute;left:50%;top:18%;width:3px;height:64%;
  margin-left:-1.5px;background:#dde2ee;border-radius:2px}
.fresta:active:before{background:#b9c0d4}
.fresta.cortada:before{background:#15a34a;width:4px;margin-left:-2px}
.fresta.cortada:after{content:"";position:absolute;left:50%;top:2px;width:14px;height:14px;
  margin-left:-7px;border-radius:50%;background:#15a34a}
.fresta.nao:before{background:#e2574c}

/* ---- as sílabas soltas (marcar, montar, trilha) ---- */
.sils{display:flex;flex-wrap:wrap;gap:clamp(6px,2vw,10px);justify-content:center;margin:8px 0}
.sils.erro .sil{border-color:#e2574c}
.sil{font:800 clamp(17px,4.6vw,22px)/1 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  min-width:52px;min-height:46px;padding:10px 14px;border-radius:12px;
  border:2px solid #c6cde0;background:#fff;color:#243056;cursor:pointer;
  -webkit-transition:.14s;transition:.14s}
.sil.larga{min-width:clamp(96px,26vw,150px)}
.sil:active{-webkit-transform:scale(.94);transform:scale(.94)}
.sil.marcada{background:#fff3c9;border-color:#e0ac00}
.sil.ok,.sil.usada{background:#d8f3e2;border-color:#15a34a;color:#0d6b33}
.sil.usada{opacity:.6}
.sil.nao{background:#ffd9d6;border-color:#e2574c;color:#9d2f26}

/* ---- as vagas onde a palavra se monta ---- */
.vagas{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:8px 0}
.cxs2{display:inline-block;min-width:clamp(46px,12vw,62px);min-height:clamp(42px,11vw,52px);
  border:2px dashed #b9c0d4;border-radius:10px;background:#fbfcff;
  font:800 clamp(17px,4.6vw,22px)/clamp(42px,11vw,52px) system-ui;color:#243056;text-align:center}
.cxs2.cheia{border-style:solid;border-color:#15a34a;background:#eafaf0}

/* ---- as duas linhas (letras x sílabas) ---- */
.duaslinhas{display:grid;grid-template-columns:auto 1fr;gap:4px 8px;align-items:center;
  margin:8px auto;max-width:520px}
.rotlin{font:700 clamp(12px,3.2vw,14px)/1 system-ui;color:#6b748f;text-align:right}
.linhacx{display:flex;flex-wrap:wrap;gap:4px}
.cxl{display:inline-block;min-width:clamp(30px,8vw,38px);min-height:clamp(34px,9vw,42px);
  border:2px solid #c6cde0;border-radius:7px;background:#fff;
  font:800 clamp(15px,4vw,19px)/clamp(34px,9vw,42px) system-ui;color:#243056;text-align:center}

/* ---- o estojo de canetinhas (pintar pela legenda) ---- */
.estojo{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:8px 0 12px}
/* ⚠️ o FUNDO vem junto com a cor do texto, e de propósito: sem ele, o dia em
   que a classe da cor não pegasse deixaria letra branca em fundo branco. */
.cnt{font:700 clamp(12px,3.2vw,15px)/1 system-ui;min-height:44px;padding:10px 14px;
  border-radius:12px;border:3px solid transparent;cursor:pointer;
  color:#fff;background:#6b748f;
  -webkit-transition:.14s;transition:.14s}
.cnt:active{-webkit-transform:scale(.94);transform:scale(.94)}
.cnt.pega{border-color:#243056;-webkit-box-shadow:0 0 0 3px #fff inset;box-shadow:0 0 0 3px #fff inset}
.cnt-m{background:#1179bf}.cnt-d{background:#15a34a}
.cnt-t{background:#e0870a}.cnt-p{background:#8b5cf6}
.petala{font:800 clamp(13px,3.6vw,16px)/1 system-ui;min-width:clamp(88px,24vw,120px);
  min-height:46px;padding:12px 10px;border-radius:999px;border:2px solid #c6cde0;
  background:#fff;color:#243056;cursor:pointer}
.petala:active{-webkit-transform:scale(.95);transform:scale(.95)}
.pin{color:#fff!important;background:#6b748f!important;border-color:transparent!important}
.pin-m{background:#1179bf!important}.pin-d{background:#15a34a!important}
.pin-t{background:#e0870a!important}.pin-p{background:#8b5cf6!important}
.sacode{-webkit-animation:sac .38s;animation:sac .38s}
@-webkit-keyframes sac{0%,100%{-webkit-transform:translateX(0)}25%{-webkit-transform:translateX(-5px)}75%{-webkit-transform:translateX(5px)}}
@keyframes sac{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}

/* ---- uma sílaba, três palavras ---- */
.juntas{display:flex;flex-direction:column;gap:8px;align-items:center;margin:8px 0}

 "p10enun": "Folha dez. Agora quatro problemas seguidos. Leia cada um até o fim antes de escolher: o número grande nem sempre é o de repartir.",
 "p11enun": "Folha onze. Os últimos da repartição. Todos perguntam a mesma coisa: quantos para cada um?",
 "p12enun": "Folha doze. Agora é outra pergunta. O tamanho do pote está dito: encha um, depois outro, e veja quantos potes você precisou.",
 "p13enun": "Folha treze. Mesma pergunta nova, com mais peças. Encha um pote de cada vez, sem misturar.",
 "p14enun": "Folha catorze. Agora só o problema escrito. Repare: ele não pergunta quantos para cada um. Pergunta quantos grupos dão. A conta é a mesma.",

 "p16enun": "Folha dezesseis. A conta de volta. Se a multiplicação está aí em cima, a divisão já está respondida. Olhe bem.",
 "p17enun": "Folha dezessete. Agora sem a multiplicação à vista. Pense: que número vezes esse dá o total? Esse número é a resposta.",
 "p18enun": "Folha dezoito. Treino de contas, e os cubinhos estão aí para contar se você quiser. Contar é uma estratégia, não é trapaça.",
 "p19enun": "Folha dezenove. Agora sem os cubinhos. Use a tabuada ao contrário: que número vezes esse dá o total?",
 "p1enun": "Folha um. Arraste cada peça para um pote, até todos ficarem iguais. No computador dá para arrastar; no celular, toque na peça e depois no pote.",

var AC = null;
function ac(){ try{ if(!AC) AC = new (window.AudioContext || window.webkitAudioContext)(); if(AC.state === "suspended") AC.resume(); }catch(e){} return AC; }
function bip(f, dur, tipo, vol){
  var a = ac(); if(!a) return;
  try{
    var o = a.createOscillator(), g = a.createGain();
    o.type = tipo || "sine"; o.frequency.value = f;
    g.gain.setValueAtTime(vol || .13, a.currentTime);
    g.gain.exponentialRampToValueAtTime(.001, a.currentTime + dur);
    o.connect(g); g.connect(a.destination); o.start(); o.stop(a.currentTime + dur);
  }catch(e){}
}

function chaveVoz(t){
  t = (t || "").replace(/\s+/g, " ").trim().toLowerCase();
  var h = 5381, i;
  for(i = 0; i < t.length; i++) h = ((h * 33) ^ t.charCodeAt(i)) >>> 0;
  return h.toString(36);
}
function achaVoz(){
  try{
    var vs = window.speechSynthesis.getVoices();
    for(var i = 0; i < vs.length; i++) if((vs[i].lang || "").toLowerCase().indexOf("pt-br") === 0) return vs[i];
    for(i = 0; i < vs.length; i++) if((vs[i].lang || "").toLowerCase().indexOf("pt") === 0) return vs[i];
  }catch(e){}
  return null;
}
