/* ===== JOGO DA MEMORIA — GRANDE, COM ARTE E COM EFEITO =====
   Duas ordens do Marcos (ago/2026), no mesmo dia:
   1) *"quando fizer jogo da memória faça cartas maiores"* — a carta e o alvo
      mais dificil da atividade: a crianca precisa VER a figura, LER a palavra e
      ainda LEMBRAR onde ela estava. Carta pequena mata as tres coisas.
   2) *"os jogos da memória tem que ter bastante efeitos e sons, devem ficar
      lindos, tamanho maior, claro adequando a tela, chamar atenção do
      estudante"* — dai a VIRADA de verdade (a carta gira em 3D), o brilho
      dourado que corre pela carta parada, o par que pulsa e a moldura que
      acende. E o verso e ARTE DE IA (regra nova dele), nao um retangulo azul.  */
.mcartas{display:-webkit-box;display:-webkit-flex;display:flex;-webkit-flex-wrap:wrap;flex-wrap:wrap;
  gap:11px;-webkit-box-pack:center;justify-content:center;margin-top:12px;max-width:440px;width:100%;
  -webkit-perspective:900px;perspective:900px}
.mcarta{position:relative;width:47%;max-width:206px;min-height:118px;border-radius:16px;cursor:pointer;
  -webkit-transform-style:preserve-3d;transform-style:preserve-3d;

   com `width:31px` dentro de uma caixa de 328px: cabiam DEZ por linha. Aí a
   palavra deitada até saía certa por sorte, mas a palavra EM PÉ (que ocupa
   as posicoes i, i+9, i+18) aparecia na diagonal, letra por letra espalhada —
   a crianca procurava uma palavra que, na tela, nao existia.

   tinha estilo: a crianca tocava na letra e a tela nao respondia NADA, e a
   palavra achada nao acendia. Sem retorno, o jogo parece quebrado — e estava.

/* ================= TELAS DA MÁQUINA DO TEMPO =================
   Tudo com cor sólida antes de cada gradiente (PC velho vê a cor) e animação
   só por transform/opacity, que não repinta a tela. */
/* --- cena grande, em moldura de foto --- */
.cena{width:100%;max-width:420px;margin-top:10px;border-radius:16px;overflow:hidden;
  background:#fffdf6;border:3px solid #fffdf6;
  -webkit-box-shadow:0 8px 22px rgba(30,25,10,.4);box-shadow:0 8px 22px rgba(30,25,10,.4)}

.cena .cenacap{font-size:12.5px;font-weight:700;color:#6b6252;padding:5px 8px;text-align:center}
/* --- SIMULADOR: janela do tempo --- */
.janela{width:100%;max-width:420px;margin-top:10px;border-radius:16px;overflow:hidden;
  background:#2b2416;border:4px solid #fffdf6;position:relative;
  -webkit-box-shadow:0 10px 26px rgba(20,15,5,.5);box-shadow:0 10px 26px rgba(20,15,5,.5)}
.janela .cenaimg{width:100%;display:block;-webkit-animation:apfoto .45s;animation:apfoto .45s}
/* ⚠️ a figura do mapa dentro da janela: SEM esta regra ela vinha no tamanho
   natural (860px de altura) e a fase do roteiro ficava com 1900px — a crianca
   nao via o mapa e as setas ao mesmo tempo.                                  */
.janela .jimg{width:100%;height:auto;display:block;-webkit-animation:apfoto .45s;animation:apfoto .45s}
/* o Nico voando por cima do mapa, no roteiro: posicao ABSOLUTA (a .silh do
   motor e outra coisa — barras de esqueleto — e empurrava a tela para 1900px) */
.janela .voando{position:absolute;width:52px;height:52px;margin:-26px 0 0 -26px;z-index:4;
  -webkit-transition:left .55s ease,top .55s ease;transition:left .55s ease,top .55s ease}
.janela .voando img{width:100%;height:100%;-o-object-fit:contain;object-fit:contain;display:block;
  -webkit-filter:drop-shadow(0 3px 5px rgba(0,0,0,.35));filter:drop-shadow(0 3px 5px rgba(0,0,0,.35))}
.janela{position:relative}

/* ---------- 14) ⭐ CAÇA AO TESOURO POR COORDENADA (coordenada) ----------
   O mapa ganha linhas (A,B,C,D) e colunas (1,2,3,4). É assim que um mapa de
   verdade diz onde as coisas estão — e é a primeira vez que a criança usa

/* ⚠️ AS COORDENADAS ESTAVAM ERRADAS — e isso chegava na crianca como erro
   DELA. Conferi desenhando a grade por cima da figura: "as casas" apontava
   para C2, que e a copa da arvore; "o rio" apontava para B4, que e fundo

           {q:"a <b>linha de cima</b> do mapa, que est&#225; vazia",cels:["A1","A2","A3","A4"],unico:1},

    var it=COORD[idx],fim=false;

/* ---------- 14) CAÇA-PALAVRAS ----------
   ⚠️ REESCRITA (defeito que o Marcos pegou, ago/2026): *"o caça palavras ele
   bugou... tem que destacar melhor as palavras encontradas, de preferência
   cores diferentes, e ter uma comemoração e barulho para cada palavra"*.

   Eram TRÊS defeitos empilhados, e o primeiro explica os outros:

   1. **A tela não respondia.** O JS punha a classe `mark` ao tocar e `ok` ao
      completar — e NENHUMA DAS DUAS tinha regra de CSS. A criança tocava na
      letra e não acontecia nada; a palavra achada não acendia. Um jogo que não
      responde ao toque não está "feio": está quebrado.
   2. **Palavra que cruza travava a outra.** Ao achar, as células trocavam de
      `mark` para `ok` — e a conferência só olhava `mark`. Então a palavra que
      cruzasse uma já achada NUNCA fechava.
   3. **Tocar numa palavra achada apagava ela.** O clique era um interruptor
      cego (`tem mark ? tira : põe`), então a criança encostava numa letra já
      conquistada e via a palavra se desfazer.

   Agora: cada palavra tem a SUA COR (e o chip da lista usa a mesma), a célula
   conquistada fica TRAVADA, a conferência conta `mark` OU `ok`, e ao fechar uma
   palavra as letras acendem UMA A UMA com som subindo, faísca na cor da
   palavra, o chip carimba, a faixa "ACHOU!" sobe e a VOZ diz a palavra.       */
var CACAM=["MAPA","RIO","PONTE","LEGENDA","MAQUETE"];
function mCaca(){
  limpa();var t=el("div","tela");setProg(t,86);
  var N=9,g=[],i,j;
  for(i=0;i<N;i++){ g[i]=[]; for(j=0;j<N;j++) g[i][j]=""; }
  var achadas={},posicoes={},onde={},cor={};
  var LET="ABCDEFGHIJLMNOPRSTUV";
  function cabe(p,li,co,dl,dc){ var k;
    for(k=0;k<p.length;k++){ var y=li+dl*k,x=co+dc*k;
      if(y<0||y>=N||x<0||x>=N) return false;
      if(g[y][x]&&g[y][x]!==p.charAt(k)) return false; }
    return true; }
  for(i=0;i<CACAM.length;i++){
    var p=CACAM[i],posto=false,tent=0;
    cor[p]="p"+(i+1);
    while(!posto&&tent<300){ tent++;
      var hor=Math.random()<0.6, dl=hor?0:1, dc=hor?1:0;
      var li=Math.floor(Math.random()*N), co=Math.floor(Math.random()*N);
      if(cabe(p,li,co,dl,dc)){ var cel=[],k;
        for(k=0;k<p.length;k++){ g[li+dl*k][co+dc*k]=p.charAt(k); cel.push((li+dl*k)+"_"+(co+dc*k)); }
        posicoes[p]=cel; onde[p]={r:li,c:co,n:p.length,h:hor}; posto=true; }
    }
  }
  for(i=0;i<N;i++) for(j=0;j<N;j++) if(!g[i][j]) g[i][j]=LET.charAt(Math.floor(Math.random()*LET.length));
  var c=el("div","centro");
  c.appendChild(el("div","selo","CA&#199;A-PALAVRAS DO MAPA"));
  var bal=el("div","balao","Ache as <b>cinco palavras</b> do mundo dos mapas. Cada uma tem a <b>sua cor</b>.");
  c.appendChild(bal);
  var lista=el("div","lista"),chips={};
  for(i=0;i<CACAM.length;i++){
    var ch=el("div","pchip "+cor[CACAM[i]]);
    ch.innerHTML='<i class="pbola"></i>'+CACAM[i];
    chips[CACAM[i]]=ch; lista.appendChild(ch);
  }
  c.appendChild(lista);
  var grade=el("div","grade");
  /* onde cada palavra ficou — SO para o auditor jogador: clicando ao acaso numa
     grade de 81 casas ele nunca acharia, e reprovaria uma fase que funciona.
     Nao aparece para ninguem.                                                */
  grade.setAttribute("data-qa",JSON.stringify(onde));
  grade.style.gridTemplateColumns="repeat("+N+",1fr)";
  var cels={};
  for(i=0;i<N;i++) for(j=0;j<N;j++){(function(y,x){
    var q=el("div","cquad",g[y][x]);
    cels[y+"_"+x]=q;
    q.onclick=function(){ arma();
      /* letra ja conquistada NAO se desmarca: a palavra achada e da crianca */
      if(q.className.indexOf("ok")>=0){ sTap(); return; }
      q.className = q.className.indexOf("mark")>=0 ? "cquad" : "cquad mark";
      sTap(); confere();
    };
    grade.appendChild(q);
  })(i,j);}
  /* uma celula conta para a conferencia se esta SELECIONADA (mark) ou ja
     CONQUISTADA por outra palavra (ok) — e isso que destrava as cruzadas */
  function pega(id){ var cl=cels[id].className;
    return cl.indexOf("mark")>=0||cl.indexOf("ok")>=0; }
  function sAchou(){ var n=[659,784,988,1175,1568],z;
    for(z=0;z<n.length;z++) tom(n[z],0.26,"sine",0.16,z*0.075); }
  function faixa(p){
    var f=el("div","achouf",p+"!");
    f.style.background=({p1:"#2a6ea8",p2:"#2e7a1c",p3:"#a8531a",p4:"#6b3fa0",p5:"#a8306b"})[cor[p]];
    document.body.appendChild(f);
    setTimeout(function(){ if(f.parentNode) f.parentNode.removeChild(f); },1200);
  }
  function comemora(p){
    var cels_p=posicoes[p],k,COR={p1:"#2a6ea8",p2:"#2e7a1c",p3:"#a8531a",p4:"#6b3fa0",p5:"#a8306b"}[cor[p]];
    /* as letras acendem UMA A UMA, na ordem da palavra — o olho acompanha */
    for(k=0;k<cels_p.length;k++){(function(q,atraso){
      setTimeout(function(){
        q.className="cquad ok "+cor[p];
        var ce=centroTela(q); faisca(ce[0],ce[1],COR,7);
      },atraso);
    })(cels[cels_p[k]],k*75);}
    sAchou(); faixa(p);
    chips[p].className="pchip "+cor[p]+" feito";
    setTimeout(function(){ var v=temVoz(p); if(v) tocaVoz(v,null); },520);
  }
  function confere(){ var p,k,todas,n=0;
    for(p in posicoes){ if(!posicoes.hasOwnProperty(p)||achadas[p]) continue;
      todas=true;
      for(k=0;k<posicoes[p].length;k++) if(!pega(posicoes[p][k])) todas=false;
      if(todas){ achadas[p]=1; comemora(p); reg("producao",true,1);
        n=0; for(k in posicoes) if(posicoes.hasOwnProperty(k)&&achadas[k]) n++;
        bal.innerHTML="J&#225; achou <b>"+n+"</b> de <b>"+CACAM.length+"</b>!";
      } }
    n=0; for(p in posicoes) if(posicoes.hasOwnProperty(p)&&achadas[p]) n++;
    if(n>=CACAM.length){ setTimeout(function(){ sFesta(); festa(); },700);
      setTimeout(function(){
        depoisDaFala("mp_caca_revela",8000,function(){
          mostraBanner("Estas s&#227;o as palavras de quem l&#234; e faz mapas.",mCruzada); }); },1500); }
  }
  c.appendChild(grade);
  c.appendChild(el("div","hint","Toque em cada letra da palavra. Tocou errado? Toque de novo para tirar."));
  t.appendChild(c);app.appendChild(t);
  montaBarra("mp_caca_dica","As palavras est&#227;o deitadas ou em p&#233;.");
  falar("mp_caca_intro");
}

/* ---------- 15) CRUZADINHA (teclado na tela E teclado de verdade) ---------- */
var CRUZM=[{p:"MAPA",d:"Desenho do lugar visto de cima."},
           {p:"LEGENDA",d:"A parte do mapa que ensina a ler os s&#237;mbolos."},
           {p:"MAQUETE",d:"O mapa que tem altura e d&#225; para pegar."}];
function mCruzada(){
  var idx=0,err=0;

    limpa();var t=el("div","tela");setProg(t,90+idx);

      mostraBanner("Voc&#234; j&#225; sabe as palavras <b>e</b> o que elas querem dizer.",mForca); }); return; }
    var it=CRUZM[idx],pos=0,fim=false;

    for(i=0;i<it.p.length;i++){ var s=el("div","slot",""); linha.appendChild(s); caixas.push(s); }
    c.appendChild(linha);
    var tecs=el("div","letras"),bts={};
    var alfa="ABCDEFGHIJLMNOPQRSTUVXZ";
    function poe(L){
      if(fim||pos>=it.p.length) return;
      if(L===it.p.charAt(pos)){
        caixas[pos].innerHTML=L; caixas[pos].className="slot cheio"; pos++; sPop(pos);
        marcaQA();
        if(pos>=it.p.length){ fim=true; sCerto(); elogio();
          reg("producao",err===0,err+1);
          var ce=centroTela(linha); faisca(ce[0],ce[1],"#ffd43b",14);
          setTimeout(function(){ idx++; err=0; passo(); },1200); }
      } else { err++; sErro();
        if(bts[L]){ bts[L].className="tec no"; setTimeout(function(){ if(bts[L]) bts[L].className="tec"; },420); }
        if(err===2) consolo();
        if(err>=3) mostraDica("A pr&#243;xima letra &#233; <b>"+it.p.charAt(pos)+"</b>.");
      }
    }
    function marcaQA(){ var k;
      for(k in bts) if(bts.hasOwnProperty(k)) bts[k].setAttribute("data-qa", (!fim&&pos<it.p.length&&k===it.p.charAt(pos))?"1":"0"); }
    for(i=0;i<alfa.length;i++){(function(L){
      var b=el("div","tec",L);
      b.onclick=function(){ arma(); poe(L); };
      tecs.appendChild(b); bts[L]=b;
    })(alfa.charAt(i));}
    marcaQA();

    document.onkeydown=function(ev){

    t.appendChild(c);app.appendChild(t);
    montaBarra("mp_cruz_dica","Pense na palavra e v&#225; letra por letra.");
    if(idx===0) falar("mp_cruz_intro");
  }
  passo();
}

/* ---------- 16) MEMÓRIA (símbolo ↔ lugar) — no padrão novo da casa ----- */

/* ---------- ⭐ O BAIRRO LÁ DE CIMA (a vista aérea, sem legenda) -----------

   ⚠️ REFEITA (cobrança do Marcos, ago/2026): *"tem que ser mais intuitivo. Você

   Ele está certo nas três coisas, e as três eram o mesmo erro de fundo: eu
   tinha tratado uma FOTO como se fosse um quiz de ponto único.

   1. **O alvo virou ZONA, e são VÁRIAS.** O rio tem oito pontos ao longo do
      curso, a mata tem sete moitas, a rua tem quatro trechos, a ponte tem as
      duas pontes. Vale tocar em qualquer um. E o toque é medido pela DISTÂNCIA
      até a zona mais próxima, não por um quadradinho invisível: a criança toca
      no rio, em qualquer lugar do rio, e dá certo.
   2. **A pergunta mudou onde ela era ambígua.** "Um quarteirão de casas" numa
      foto que é toda casas não é pergunta, é adivinhação. Saiu. Entraram
      coisas que só existem uma vez ou que são inconfundíveis — o rio, a ponte,
      a mata em volta, a rua, e o pedaço do bairro do OUTRO LADO do rio (que
      ainda é relação espacial, do currículo).
   3. **O achado virou LUZ, não quadrado.** Um anel dourado aceso no lugar
      tocado, com o nome da coisa numa plaquinha — fica bonito, fica marcado, e
      a criança vê o que já achou sem tapar a figura.                        */

/* ---------- ⭐ A PALAVRA DO MAPA (forca) ----------

var FORCAP=[{p:"BUSSOLA", d:"O aparelhinho que mostra onde fica o Norte."},

/* ---------- ⭐ O QUEBRA-CABEÇA DO MAPA (montar por encaixe) ----------

   COMO as partes se ligam: o rio que continua, a rua que atravessa. E o gesto

function mQuebra(){

  for(i=0;i<LINS;i++) for(j=0;j<COLS;j++){(function(li,co){
    var v=el("div","qcvaga");
    v.setAttribute("data-vaga",li+"_"+co);
    v.onclick=function(){ solta(li,co,v); };
    vagas.push(v); grade.appendChild(v);
  })(i,j);}
  c.appendChild(grade);
  var banca=el("div","qcban"),ordem=[],k;
  for(k=0;k<total;k++) ordem.push(k);
  ordem=baguncar(ordem);
  for(k=0;k<ordem.length;k++){(function(n){
    var li=Math.floor(n/COLS), co=n%COLS;

      var a=banca.getElementsByClassName("qcpc"),z;
      for(z=0;z<a.length;z++) if(a[z].className.indexOf("usada")<0) a[z].className="qcpc";
      b.className="qcpc sel"; sel={li:li,co:co,el:b}; arma(); sTap(); };
    banca.appendChild(b);
  })(ordem[k]);}

  function solta(li,co,v){
    if(!sel){ mostraDica("Toque primeiro num <b>peda&#231;o</b> a&#237; embaixo."); return; }

    } else { err++; v.className="qcvaga no"; sErro();
      setTimeout(function(){ if(v.className.indexOf("cheia")<0) v.className="qcvaga"; },420);
      if(err===2) consolo();
      if(err>=3) mostraDica("Olhe as <b>bordas</b>: o rio de um peda&#231;o tem que continuar no outro.");
    }
  }
  c.appendChild(el("div","hint","Toque no peda&#231;o e depois no lugar dele."));
  t.appendChild(c);app.appendChild(t);
  montaBarra("mp_quebra_dica","Comece pelos peda&#231;os que t&#234;m o rio ou a igreja.");

function segredoRelatorio(elm){

}

  var frase=(acc>=tot*0.8)?"Voc&#234; foi <b>muito bem</b> do come&#231;o ao fim!":

/* ---------- TREINAR SO O QUE FALTOU ----------
   Pergunta do Marcos (ago/2026): "se ela nao domina, ela consegue fazer so as
   atividades que nao domina?". Da: o app ja mede cada objetivo (DOM). Aqui ele

   Truque para nao mexer em nenhuma fase: enquanto o treino roda, o mostraBanner
   ignora o "proximo" original e chama a proxima fase da fila.               */
var FILATREINO=null;
var _bannerOriginal=mostraBanner;
mostraBanner=function(msg,cb){ _bannerOriginal(msg, FILATREINO ? proximoTreino : cb); };
function fracos(){
  var k,out=[];
  for(k in DOM){ if(DOM.hasOwnProperty(k)&&(DOM[k]||0)<0.75&&TREINO[k]) out.push(k); }
  return out;
}
function proximoTreino(){
  if(!FILATREINO||!FILATREINO.length){ FILATREINO=null; salva(); TELAFIM(); return; }
  var f=FILATREINO.shift();
  try{ f(); }catch(e){ proximoTreino(); }
}
function treinarFracos(){
  var f=fracos(),i,fila=[];
  for(i=0;i<f.length;i++) fila.push(TREINO[f[i]]);
  if(!fila.length){ TELAFIM(); return; }
  FILATREINO=fila; proximoTreino();
}
