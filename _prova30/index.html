MEC["memoria"] = function(f, cen, fim){
  cen.className = cen.className + " mec-memoria";
  /* ⚠️⚠️ LICAO PAGA, e a mais silenciosa de todas: a peca da MEMORIA declara a
     PROPRIA `function fim()`. Como o corpo dela entra dentro do fechamento, esse
     `fim` SOMBREAVA o parametro da ponte — e o `mostraBanner` daqui, que devia
     levar a fase seguinte, chamava a peca de volta. Laco infinito, sem erro de
     JS nenhum: o jogador so ficava PRESO, com todos os pares ja fechados e a
     medalha da peca na tela. Por isso a continuacao mora AQUI FORA, com um nome
     que o integrador confere que nenhuma peca usa (ver `confere_contra_motor`).
     E ela so dispara UMA vez: peca que chama o banner duas vezes pularia fase. */
  var _seguir = function(){ if(_seguir.ja) return; _seguir.ja = 1; fim(); };
  /* recolhe o enunciado da fase assim que a peca puser o balao dela (ver CSS) */
  setTimeout(function(){
    var b = cen.getElementsByClassName("pecabox")[0];
    if(b && b.getElementsByClassName("balao").length)
      cen.className = cen.className + " tembalaopeca";
  }, 120);
  (function(){
    /* a peca acha que esta sozinha; estes ajudantes fazem o meio de campo */
    var app = cen;
    /* o `ac()` DESTA peca: destrava o som (o motor chama isso de `arma()`) e
       devolve o AudioContext do motor. Fica local, dentro do fechamento, para
       nao brigar com o `var ac` do motor — que e o objeto, nao a funcao. */
    function ac(){ if(typeof arma === "function") arma(); return window.ac; }
    function limpa(){ var g = cen.getElementsByClassName("pecabox")[0];
      if(g) g.innerHTML = ""; else { g = document.createElement("div");
      g.className = "pecabox"; cen.appendChild(g); } app = g; }
    /* ⚠️ LICAO PAGA: este ajudante era um VAZIO — "quem manda na barra e o
       motor". So que o caca-palavras faz `setProg(t,0)` e depois PEGA A BARRA
       DE VOLTA (`t.getElementsByTagName("i")[0]`) para mostrar quantas palavras
       ja achou. Com o vazio, ele pegava `undefined` e estourava no primeiro
       toque: 446 erros de JS numa partida. Regra: o ajudante da ponte tem que
       FAZER o que o de verdade faz — nao pode so nao atrapalhar.
       A barra da PECA e a de dentro da fase (5 palavras achadas de 8); a do
       MOTOR e a da atividade (fase 4 de 32). As duas informam coisas
       diferentes, entao as duas ficam — a de dentro, menorzinha (ver CSS). */
    function setProg(t, p){
      if(!t || !t.appendChild) return;
      var pr = document.createElement("div"); pr.className = "prog progpeca";
      var i = document.createElement("i"); i.style.width = (p || 0) + "%";
      pr.appendChild(i); t.appendChild(pr);
    }
    /* ⚠️⚠️ LICAO PAGA (ago/2026), pega pelo Marcos JOGANDO: *"esta passando de
       fase sem aquele botao azul que aparecia com a palavra proximo... tem que
       ser parecida com a atividade do Broto"*.

       Esta ponte comemorava e PULAVA para a fase seguinte sozinha, 420ms
       depois. A crianca terminava uma fase e era JOGADA na outra: sem a tela de
       parabens, sem o mascote dizendo o que ela conseguiu, sem o botao para ela
       decidir quando seguir. No Broto — que e o modelo — cada fase fecha com o
       banner e a crianca TOCA para continuar. Era o fecho de toda fase de toda
       atividade montada que estava faltando.

       Agora a ponte chama o banner DE VERDADE do motor (`window.mostraBanner`,
       que a funcao local aqui dentro sombreia) e entrega o `_seguir` como o
       botao. A peca continua so avisando que acabou; quem manda no caminho
       segue sendo o motor — mas com a comemoracao no meio. */
    function mostraBanner(msg, cb){
      if(typeof festa === "function") festa();
      if(typeof window.mostraBanner === "function"){
        window.mostraBanner(msg || "Muito bem!", _seguir); return;
      }
      setTimeout(_seguir, 420);
    }
    limpa();

 {k:"abelha", pal:"ABELHA",  sen:"faz o mel"},

function sVira(){ nota(300,.05,.13,"square",0); nota(520,.06,.10,"square",.045); }

function temTresD(){
  var s=document.body.style;
  return ("transformStyle" in s)||("webkitTransformStyle" in s)||("MozTransformStyle" in s);

function fazCarta(o){
  var d=el("div","mcarta");

  var f=el("div","mflip");

function atualiza(){

function tocar(o){
  if(travado) return;
  if(o.el.className.indexOf("par")>=0){ sTap(); return; }     /* ja fechada */
  if(virada===o) return;
  /* ⚠️ LICAO PAGA (ago/2026): aqui era `if(...vira...) return;` — carta virada
     nao se toca. So que se sobrar UMA carta de cara para cima que a peca nao
     esta mais seguindo em `virada` (qualquer descompasso entre o desenho e a
     memoria do jogo), ela vira uma carta MORTA: nunca mais aceita toque, e a
     fase nao fecha NUNCA. A crianca fica com dois quadradinhos na tela sem
     conseguir juntar o ultimo par. Foi assim que o auditor-jogador ficou preso
     com 3 de 4 pares fechados.
     Agora a carta orfa e ADOTADA: se esta virada e ninguem a segura, ela passa
     a ser a carta da vez. Nao ha estado do qual a crianca nao consiga sair.  */
  if(o.el.className.indexOf("m2_vira")>=0){
    if(!virada){ virada=o; }
    return;
  }
  o.el.className="mcarta m2_vira";
  sVira();
  if(!virada){ virada=o; return; }
  tentativas++;
  if(virada.k===o.k){ fechaPar(virada,o); virada=null; return; }
  /* nao formou par: as duas voltam. Erro NUNCA pune — so devolve. */
  travado=true;
  var a=virada; virada=null;
  setTimeout((function(x,y){ return function(){
    if(x.el.className.indexOf("par")<0) x.el.className="mcarta";
    if(y.el.className.indexOf("par")<0) y.el.className="mcarta";
    travado=false;
    ajuda(tentativas);
  }; })(a,o),900);
}

function fechaPar(a,b){
  a.el.className="mcarta m2_vira par";
  b.el.className="mcarta m2_vira par";
  a.el.appendChild(el("div","vpar","✓"));
  b.el.appendChild(el("div","vpar","✓"));
  a.el.removeAttribute("data-qa");
  b.el.removeAttribute("data-qa");
  sPar();
  feitos++;
  atualiza();
  if(feitos===PARES.length) setTimeout(fim,800);
}

/* O ANDAIME QUE CRESCE — a cada 6 tentativas sem par ele ajuda mais; na terceira
   vez abre um par sozinho. Assim a peca nao trava nem para quem tem pouca
   memoria de trabalho (e nem para o auditor-jogador).                        */
function ajuda(n){
  if(n%6!==0) return;
  var vez=n/6, alvo=proximoPar();
  if(!alvo) return;
  if(vez===1){ mostraDica("Leia a carta em voz baixa e pense: <b>quem faz isso?</b>"); }
  else if(vez===2){ mostraDica("Dica: uma das cartas fala de <b>"+alvo.pal.toLowerCase()+"</b>."); }
  else { mostraDica("Vou abrir este par para você: <b>"+alvo.pal+"</b> — "+alvo.sen+"."); abrePar(alvo.k); }
}
function proximoPar(){
  var i,j;
  for(i=0;i<PARES.length;i++){
    for(j=0;j<cartas.length;j++){
      if(cartas[j].k===PARES[i].k && cartas[j].el.className.indexOf("par")<0) return PARES[i];
    }
  }
  return null;
}
function abrePar(k){
  var i,a=null,b=null;
  for(i=0;i<cartas.length;i++){ if(cartas[i].k===k){ if(!a) a=cartas[i]; else b=cartas[i]; } }
  if(!a||!b) return;
  if(virada){ if(virada.el.className.indexOf("par")<0) virada.el.className="mcarta"; virada=null; }
  fechaPar(a,b);
}

  b.onclick=cliqueFicha;

function cliqueFicha(){

  if(Date.now()-ultimoToque<700) return;

   tambem aparece escrito no crachazinho ao lado do balde. */
function diz(txt){
  try{
    if(!window.speechSynthesis||!window.SpeechSynthesisUtterance) return;
    var u=new SpeechSynthesisUtterance(txt);
    u.lang="pt-BR"; u.rate=.98; u.pitch=1.06;
    window.speechSynthesis.cancel();
    window.speechSynthesis.speak(u);
  }catch(e){}
}
/* som de MOLHAR o pincel — nunca som de acerto, porque aqui nao ha acerto */
function sPinga(){ nota(659.25,.09,.12,"triangle",0); nota(880,.09,.09,"triangle",.06); }
function sPega(){ nota(523.25,.05,.10,"square",0); }

/* ---------------------------------------------------------------
   O DESENHO. A MESMA funcao monta a folha grande e a miniatura da
   galeria — assim o que a crianca ve no fim e exatamente o que ela
   pintou, e nao um desenho parecido.
   --------------------------------------------------------------- */
function montaDesenho(des,pintado,classe,vivo){
  var q=el("div",classe), i, r, z, pth;
  for(i=0;i<des.regs.length;i++){
    r=des.regs[i];
    z=el("div","pd_zona");
    z.innerHTML='<svg viewBox="0 0 100 100"><path class="reg" d="'+r.d+'"></path></svg>';
    pth=z.getElementsByTagName("path")[0];
    pth.style.fill=(pintado&&pintado[r.k])?pintado[r.k]:PAPEL;
    if(vivo){
      z._k=r.k; z._n=r.n; z._p=pth;
      z.onclick=tocouRegiao;
      zonaEls.push(z);
    }
    q.appendChild(z);
  }
  var tr=el("div","tracos");
  tr.innerHTML='<svg viewBox="0 0 100 100">'+des.tracos+'</svg>';
  q.appendChild(tr);
  return q;
}

/* ---------------------------------------------------------------
   A TELA DE PINTAR. Uma folha, uma paleta, um balde e dois botoes.
   Nao ha pergunta, nao ha resposta, nao ha placar.
   --------------------------------------------------------------- */
function telaPintar(){
  if(di>=DESENHOS.length){ fimDaPeca(); return; }
  ger++; travada=false;
  limpa();
  var des=DESENHOS[di], i;
  cores={}; tinta=null; zonaEls=[]; corEls=[];
  var t=el("div","tela"); telaAtual=t;
  setProg(t, Math.round(di*100/DESENHOS.length));
  var c=el("div","centro");
  c.appendChild(el("div","selo",des.selo));
  c.appendChild(el("div","balao","Pinte "+des.nome+" do jeito que <b>voc&#234;</b> quiser."));
  c.appendChild(montaDesenho(des,null,"quadro",1));

  /* o balde mostra a tinta que esta na mao, e o crachazinho diz o nome dela */
  var f=el("div","pd_ferr");
  baldeEl=el("i","balde","");
  baldeEl.appendChild(el("i","tintab",""));
  nomeEl=el("span","pd_cnome","Escolha uma cor");
  f.appendChild(baldeEl); f.appendChild(nomeEl);
  c.appendChild(f);

  var pl=el("div","paleta");
  for(i=0;i<TINTAS.length;i++) pl.appendChild(fazTinta(i));
  c.appendChild(pl);

  var ac2=el("div","acoes");
  var br=el("button","btn bmenor bclaro","Recome&#231;ar");
  br.setAttribute("aria-label","Apagar tudo e começar o desenho de novo");
  br.onclick=recomecar;
  var bp=el("button","btn bmenor","Pronto!");
  bp.setAttribute("data-qa","1");
  bp.onclick=pronto;
  ac2.appendChild(br); ac2.appendChild(bp);
  c.appendChild(ac2);
  c.appendChild(el("div","hint","Toque numa cor e depois no desenho. "+
                   "Tocou de novo, <b>troca a cor</b>. Desenho "+(di+1)+" de "+DESENHOS.length+"."));
  t.appendChild(c); app.appendChild(t);
  pintaBalde();
  atualizaQA();
  diz("Pinte " + des.voz + " do jeito que você quiser.");
}
function fazTinta(i){
  var b=el("div","tcor","");
  b.style.background=TINTAS[i].c;
  b.setAttribute("aria-label","Tinta "+TINTAS[i].n);
  b._i=i;
  b.onclick=function(){ pegaTinta(this._i); };
  corEls.push(b);
  return b;
}

/* ---------------------------------------------------------------
   PEGAR A TINTA. E a primeira decisao de verdade da crianca — por
   isso ela e anunciada por voz e escrita no crachazinho.
   --------------------------------------------------------------- */
function pegaTinta(i){
  if(travada||!TINTAS[i]) return;
  tinta=TINTAS[i].c;
  sPega();
  var k;
  for(k=0;k<corEls.length;k++) corEls[k].className=(k===i)?"tcor pd_on":"tcor";
  if(nomeEl) nomeEl.innerHTML=TINTAS[i].n;
  pintaBalde();
  apagaDica();
  atualizaQA();
  diz(TINTAS[i].voz);
}
/* ⚠️ todo ajudante que mexe no DOM comeca conferindo se o DOM existe. */
function pintaBalde(){
  if(!baldeEl) return;
  var t2=baldeEl.getElementsByTagName("i")[0];
  if(!t2) return;
  t2.style.background=tinta?tinta:"#e6dcc8";
}

/* ---------------------------------------------------------------
   PINTAR A REGIAO. Nao existe regiao errada: qualquer toque pinta.
   Tocar de novo numa regiao ja pintada TROCA a cor — e por isso a
   crianca pode mudar de ideia sem apagar o desenho inteiro.
   --------------------------------------------------------------- */
function tocouRegiao(){
  var z=this;
  if(travada||!z||!z._p) return;
  if(!tinta){
    /* ainda sem tinta na mao. Nao e falta: e o proximo passo. A paleta CHAMA
       (anima), a barra de recado explica, e o som e o de sempre. */
    sTap();
    chamaPaleta();
    mostraDica("Primeiro toque numa <b>cor</b> l&#225; embaixo. Depois toque no desenho.");
    atualizaQA();
    return;
  }
  var trocou=(cores[z._k]&&cores[z._k]!==tinta);
  var novo=!cores[z._k];
  cores[z._k]=tinta;
  z._p.style.fill=tinta;
  z.className="pd_zona cheia";
  sPinga();
  apagaDica();
  atualizaQA();
  if(novo) diz(z._n+" ficou " + nomeDaTinta(tinta) + ".");
  else if(trocou) diz(z._n+" trocou de cor.");
}
function nomeDaTinta(c){
  var i;
  for(i=0;i<TINTAS.length;i++) if(TINTAS[i].c===c) return TINTAS[i].voz;
  return "colorido";
}
function chamaPaleta(){
  var i;
  if(!corEls.length) return;
  for(i=0;i<corEls.length;i++) corEls[i].className="tcor chama";
  var g=ger;
  setTimeout(function(){
    if(g!==ger||!viva()) return;
    var k;
    for(k=0;k<corEls.length;k++)
      corEls[k].className=(TINTAS[k]&&TINTAS[k].c===tinta)?"tcor pd_on":"tcor";
  },2500);
}
/* `data-qa` = o que serve AGORA, so para o auditor-jogador. Sem tinta na mao,
   a proxima coisa a tocar e uma COR; com tinta, e uma regiao ainda em branco;
   com tudo pintado, e o botao de fechar o desenho. */
function atualizaQA(){
  var i, achou=false;
  for(i=0;i<corEls.length;i++) corEls[i].removeAttribute("data-qa");
  for(i=0;i<zonaEls.length;i++) zonaEls[i].removeAttribute("data-qa");
  if(!tinta){ if(corEls[0]) corEls[0].setAttribute("data-qa","1"); return; }
  for(i=0;i<zonaEls.length;i++){
    if(!achou&&!cores[zonaEls[i]._k]){ zonaEls[i].setAttribute("data-qa","1"); achou=true; }
  }
}
function apagaDica(){
  var d=document.getElementById("dicaP");
  if(d&&d.parentNode) d.parentNode.removeChild(d);
}

/* RECOMECAR: a folha volta ao branco. A tinta continua na mao — quem apertou
   "recomecar" quer pintar de novo, nao escolher tudo outra vez. */
function recomecar(){
  if(travada) return;
  var i;
  cores={};
  for(i=0;i<zonaEls.length;i++){
    zonaEls[i].className="pd_zona";
    if(zonaEls[i]._p) zonaEls[i]._p.style.fill=PAPEL;
  }
  sTap();
  apagaDica();
  atualizaQA();
  diz("Folha limpa! Pode pintar de novo.");
}
/* PRONTO: guarda o desenho da crianca e segue. Vale mesmo sem pintar nada —
   e por isso a peca nunca trava. */
function pronto(){
  if(travada) return;
  travada=true;                     /* ⚠️ trava NO INSTANTE do toque */
  var copia={}, k;
  for(k in cores) if(cores.hasOwnProperty(k)) copia[k]=cores[k];
  GALERIA.push({d:di, cores:copia});
  var quantas=0;
  for(k in copia) if(copia.hasOwnProperty(k)) quantas++;
  sCerto();
  var g=ger;
  setTimeout(function(){
    if(g!==ger||!viva()) return;
    di++;
    var msg=quantas
      ? "<b>Que desenho bonito!</b><br>Voc&#234; pintou "+quantas+" parte"+(quantas>1?"s":"")+"."
      : "<b>Guardei a sua folha.</b><br>Voc&#234; pode pintar de novo quando quiser.";
    if(di<DESENHOS.length) mostraBanner(msg,telaPintar);
    else mostraBanner(msg,fimDaPeca);
  },420);
}

/* ---------------------------------------------------------------
   A GALERIA E A MEDALHA. O fim nao tem nota nem placar: tem o que
   ELA fez, pendurado na parede.
   --------------------------------------------------------------- */
function fimDaPeca(){
  ger++; travada=false;

  c.appendChild(el("div","selo","A SUA EXPOSI&#199;&#195;O"));
  c.appendChild(el("div","medal",""));
  c.appendChild(el("div","balao","Estes desenhos s&#227;o <b>seus</b>. Ningu&#233;m pintou igual."));

  for(i=0;i<GALERIA.length;i++){
    g2=GALERIA[i];
    if(!DESENHOS[g2.d]) continue;
    gal.appendChild(montaDesenho(DESENHOS[g2.d],g2.cores,"pd_mini",0));
  }
  if(!GALERIA.length) gal.appendChild(montaDesenho(DESENHOS[0],null,"pd_mini",0));
  c.appendChild(gal);
  var b=el("button","btn","Pintar de novo");
  b.style.marginTop="10px";
  b.onclick=function(){ di=0; GALERIA=[]; telaPintar(); };
  c.appendChild(b);
  c.appendChild(el("div","hint","Esta &#233; a pe&#231;a PINTAR O DESENHO: sem certo, sem errado, s&#243; a sua cor."));
  t.appendChild(c); app.appendChild(t);
  diz("A sua exposição está pronta!");
}
    if(f && f.dados) DESENHOS = f.dados;
    if(f && f.dadosExtra){ var _d = f.dadosExtra;
      if(_d.TINTAS !== undefined) TINTAS = _d.TINTAS;
      if(_d.GALERIA !== undefined) GALERIA = _d.GALERIA;

/* ==== PECA: relogio ==== */
MEC["relogio"] = function(f, cen, fim){
  cen.className = cen.className + " mec-relogio";
  /* ⚠️⚠️ LICAO PAGA, e a mais silenciosa de todas: a peca da MEMORIA declara a
     PROPRIA `function fim()`. Como o corpo dela entra dentro do fechamento, esse
     `fim` SOMBREAVA o parametro da ponte — e o `mostraBanner` daqui, que devia
     levar a fase seguinte, chamava a peca de volta. Laco infinito, sem erro de
     JS nenhum: o jogador so ficava PRESO, com todos os pares ja fechados e a
     medalha da peca na tela. Por isso a continuacao mora AQUI FORA, com um nome
     que o integrador confere que nenhuma peca usa (ver `confere_contra_motor`).
     E ela so dispara UMA vez: peca que chama o banner duas vezes pularia fase. */
  var _seguir = function(){ if(_seguir.ja) return; _seguir.ja = 1; fim(); };
  /* recolhe o enunciado da fase assim que a peca puser o balao dela (ver CSS) */
  setTimeout(function(){
    var b = cen.getElementsByClassName("pecabox")[0];
    if(b && b.getElementsByClassName("balao").length)
      cen.className = cen.className + " tembalaopeca";
  }, 120);
  (function(){
    /* a peca acha que esta sozinha; estes ajudantes fazem o meio de campo */
    var app = cen;
    /* o `ac()` DESTA peca: destrava o som (o motor chama isso de `arma()`) e
       devolve o AudioContext do motor. Fica local, dentro do fechamento, para
       nao brigar com o `var ac` do motor — que e o objeto, nao a funcao. */
    function ac(){ if(typeof arma === "function") arma(); return window.ac; }
    function limpa(){ var g = cen.getElementsByClassName("pecabox")[0];
      if(g) g.innerHTML = ""; else { g = document.createElement("div");
      g.className = "pecabox"; cen.appendChild(g); } app = g; }
    /* ⚠️ LICAO PAGA: este ajudante era um VAZIO — "quem manda na barra e o
       motor". So que o caca-palavras faz `setProg(t,0)` e depois PEGA A BARRA
       DE VOLTA (`t.getElementsByTagName("i")[0]`) para mostrar quantas palavras
       ja achou. Com o vazio, ele pegava `undefined` e estourava no primeiro
       toque: 446 erros de JS numa partida. Regra: o ajudante da ponte tem que
       FAZER o que o de verdade faz — nao pode so nao atrapalhar.
       A barra da PECA e a de dentro da fase (5 palavras achadas de 8); a do
       MOTOR e a da atividade (fase 4 de 32). As duas informam coisas
       diferentes, entao as duas ficam — a de dentro, menorzinha (ver CSS). */
    function setProg(t, p){
      if(!t || !t.appendChild) return;
      var pr = document.createElement("div"); pr.className = "prog progpeca";
      var i = document.createElement("i"); i.style.width = (p || 0) + "%";
      pr.appendChild(i); t.appendChild(pr);
    }
    /* ⚠️⚠️ LICAO PAGA (ago/2026), pega pelo Marcos JOGANDO: *"esta passando de
       fase sem aquele botao azul que aparecia com a palavra proximo... tem que
       ser parecida com a atividade do Broto"*.

       Esta ponte comemorava e PULAVA para a fase seguinte sozinha, 420ms
       depois. A crianca terminava uma fase e era JOGADA na outra: sem a tela de
       parabens, sem o mascote dizendo o que ela conseguiu, sem o botao para ela
       decidir quando seguir. No Broto — que e o modelo — cada fase fecha com o
       banner e a crianca TOCA para continuar. Era o fecho de toda fase de toda
       atividade montada que estava faltando.

       Agora a ponte chama o banner DE VERDADE do motor (`window.mostraBanner`,
       que a funcao local aqui dentro sombreia) e entrega o `_seguir` como o
       botao. A peca continua so avisando que acabou; quem manda no caminho
       segue sendo o motor — mas com a comemoracao no meio. */
    function mostraBanner(msg, cb){
      if(typeof festa === "function") festa();
      if(typeof window.mostraBanner === "function"){
        window.mostraBanner(msg || "Muito bem!", _seguir); return;
      }
      setTimeout(_seguir, 420);
    }
    limpa();

/* ====== A PEÇA COMEÇA AQUI ====== */

/* O CONTEÚDO É SÓ EXEMPLO (6 a 8 anos). Para reusar a peça, troque SÓ estas
   três tabelas.
   ⚠️ A ESCADA sobe em DOIS eixos ao mesmo tempo:
     - dificuldade da hora: cheia -> meia -> de 15 em 15;
     - tipo de tarefa: FORMAR (produzir) e depois LER (interpretar).
   Formar e ler são habilidades diferentes: quem forma 3h00 ainda pode não ler
   4h30. Por isso as rodadas vêm em par, e a mesma dificuldade aparece nas duas
   formas antes de subir o degrau.
   `ih`/`im` = onde os ponteiros COMEÇAM. Nunca no lugar da resposta, nunca tão
   longe que a criança canse antes de chegar — e ⚠️ NUNCA um em cima do outro
   (às 12:00 o pequeno desaparece debaixo do grande, e a criança não descobre
   que há DOIS ponteiros para mexer). */
var FORMAR=[
  {h:3, m:0,  ih:11, im:0, selo:"HORA CHEIA",   apelido:"3 horas"},
  {h:6, m:30, ih:9,  im:0, selo:"MEIA HORA",    apelido:"6 e meia"},
  {h:9, m:15, ih:2,  im:0, selo:"DE 15 EM 15",  apelido:"9 e quinze"}
];
var LER=[
  {h:8, m:0,  selo:"QUE HORAS S&Atilde;O?",
   erradas:["doze horas","quatro horas","oito e meia"]},
  {h:4, m:30, selo:"OLHE O PEQUENO",
   /* "seis e vinte" é o erro CLÁSSICO: a criança lê o ponteiro grande como se
      fosse a hora. O distrator existe para esse engano aparecer e ser tratado
      pelo andaime, não para enfeitar a lista. */
   erradas:["seis e vinte","quatro horas","cinco e meia"]},
  {h:7, m:45, selo:"E AGORA?",
   erradas:["nove e trinta e cinco","oito e quarenta e cinco","sete e quinze"]}
];
/* o par FORMAR/LER, alternado */
var ROT=["f","l","f","l","f","l"];
var NOMEH=["doze","uma","duas","tr&ecirc;s","quatro","cinco","seis","sete","oito","nove","dez","onze","doze"];
/* ⚠️ os minutos VÃO POR EXTENSO. Enquanto era "doze e 5", a criança que ainda
   soletra lia "doze e cinco" numa tela e via "5" na outra — e a peça é
   justamente sobre juntar o número com a palavra. */
var NOMEM=["","cinco","dez","quinze","vinte","vinte e cinco","trinta","trinta e cinco",
           "quarenta","quarenta e cinco","cinquenta","cinquenta e cinco"];

var pos=0;            /* onde estamos no roteiro */
var fi=0, li=0;       /* rodada de FORMAR / de LER (calculadas de `pos`) */
var hh=12, mm=0;      /* a hora que o relógio mostra AGORA (hh de 1 a 12) */
var ger=0;            /* geração: mata o setTimeout de uma tela que já saiu */
var travada=false;    /* ⚠️ trava NO INSTANTE do toque — criança toca duas vezes */
var erros=0;          /* erros DESTA rodada: é o degrau do andaime */
var dePrimeira=0;     /* rodadas resolvidas sem ajuda: vira o parecer do fim */
var eRelo=null, eHora=null, eMin=null, eDig=null, eTexto=null, eZona=null, eOk=null;
var teclas=[], opcoes=[];
/* ⭐ O GUARDA DO MOUSE FANTASMA. O celular dispara mousedown/mouseup e um
   CLIQUE falsos logo depois do toque; sem este carimbo eles atrapalhavam o
   arrasto que a criança acabara de fazer. Defeito já pego DUAS vezes. */
var ultimoToque=0, pego=null, moveuP=false, fimArrasto=0, maoPega="min";

function agora(){ return (new Date()).getTime(); }
function souDedo(){ return agora()-ultimoToque<800; }
function viva(){ return !!(eRelo&&eRelo.parentNode); }
function sTic(){ nota(1046.5,.02,.08,"square",0); }
function sPasso(){ nota(659.25,.05,.10,"triangle",0); }

/* ---------- as contas da hora ---------- */
function tot(h,m){ return ((((h%12)*60+m)%720)+720)%720; }
function setTotal(t){
  t=((t%720)+720)%720;
  var h=Math.floor(t/60); if(h===0) h=12;
  hh=h; mm=t%60;
}
function digital(h,m){ return h+":"+(m<10?"0"+m:""+m); }
/* ⚠️ O VOCABULÁRIO SAI DAQUI, SEMPRE. Nenhuma dica escreve "seis e meia" à
   mão: na 2ª rodada de outra peça as frases ainda diziam palavras da 1ª, e
   isso não estoura nada — só a criança percebe. */
function textoDaHora(h,m){
  var nh=NOMEH[h%12===0?12:h%12];
  if(m===0)  return nh+(h===1?" hora":" horas");
  if(m===30) return nh+" e meia";
  if(m%5===0) return nh+" e "+NOMEM[m/5];
  return nh+" e "+m;
}
/* para que n&uacute;mero do mostrador o ponteiro GRANDE aponta */
function numeroDoMinuto(m){ var n=Math.round(m/5); return n===0?12:n; }
function idxDe(tipo){ var i,n=0; for(i=0;i<pos;i++) if(ROT[i]===tipo) n++; return n; }
function cenaF(){ return FORMAR[fi]||FORMAR[0]; }
function cenaL(){ return LER[li]||LER[0]; }

/* ---------- desenhar o relógio ---------- */
function montaRelogio(h,m,mexivel){
  var r=el("div","relo"), i, a, e;
  for(i=0;i<12;i++){
    a=i*30*Math.PI/180;
    e=el("i","rtick","");
    e.style.left=(50+Math.sin(a)*47)+"%";
    e.style.top=(50-Math.cos(a)*47)+"%";
    r.appendChild(e);
  }
  for(i=1;i<=12;i++){
    a=i*30*Math.PI/180;
    e=el("i","rnum",""+i);
    e.style.left=(50+Math.sin(a)*37)+"%";
    e.style.top=(50-Math.cos(a)*37)+"%";
    r.appendChild(e);
  }
  eHora=el("b","rmao rhora","");
  eMin=el("b","rmao rmin","");
  if(mexivel){
    eHora.appendChild(el("u","rgrab",""));
    eMin.appendChild(el("u","rgrab",""));
  }
  r.appendChild(eHora); r.appendChild(eMin);
  r.appendChild(el("s","rpino",""));
  eRelo=r;
  hh=h; mm=m;
  poeMao();
  if(mexivel) ligaArrasto(r);
  return r;
}
/* ⚠️ ajudante que toca no DOM começa sempre com a saída: uma função de
   limpeza chamada antes de o elemento existir derrubou quatro portões de uma
   vez com TypeError. */
function poeMao(){
  if(!eHora||!eMin) return;
  var ah=(((hh%12)*60+mm))*0.5, am=mm*6;
  eHora.style.webkitTransform="rotate("+ah+"deg)";
  eHora.style.transform="rotate("+ah+"deg)";
  eMin.style.webkitTransform="rotate("+am+"deg)";
  eMin.style.transform="rotate("+am+"deg)";
  mostraLeitura();
  marcaQA();
}
function mostraLeitura(){
  if(!eDig) return;
  eDig.innerHTML="AGORA O REL&Oacute;GIO MARCA<b>"+digital(hh,mm)+"</b>";
  if(eTexto) eTexto.innerHTML=textoDaHora(hh,mm);
}

/* ---------- as TRÊS portas: arrastar, botão e teclado ----------
   ⚠️ os tratadores de toque são FUNÇÕES COM NOME de propósito: assim nenhum
   `preventDefault` fica perto do `touchstart` (matar o toque no celular é a
   armadilha nº 1 desta família). Ele mora só no `touchmove`, e só depois que o
   dedo ANDOU de verdade. */
function ligaArrasto(r){
  r.onmousedown=mouseIni;
  r.addEventListener("touchstart",toqueIni,false);
  r.addEventListener("touchmove",toqueMeio,false);
  r.addEventListener("touchend",toqueFim,false);
}
function mouseIni(ev){
  if(souDedo()) return;      /* mouse FANTASMA do celular: ignora */
  pegaEm(ev.clientX,ev.clientY);
}
function toqueIni(ev){
  ultimoToque=agora();
  var to=ev.touches[0]; if(!to) return;
  pegaEm(to.clientX,to.clientY);
}
function toqueMeio(ev){
  ultimoToque=agora();
  if(!pego) return;
  var to=ev.touches[0]; if(!to) return;
  moveEm(to.clientX,to.clientY);
  if(moveuP&&ev.preventDefault) ev.preventDefault();  /* só no MEIO do arrasto */
}
function toqueFim(ev){
  ultimoToque=agora();
  soltaMao();
}
function moveMouse(ev){ if(souDedo()) return; if(pego) moveEm(ev.clientX,ev.clientY); }
function soltaMouse(){ if(souDedo()) return; if(pego) soltaMao(); }
document.onmousemove=moveMouse;
document.onmouseup=soltaMouse;

/* ⭐ O DEDO NÃO PRECISA ACERTAR O PONTEIRO. O alvo é o relógio inteiro; quem
   decide qual ponteiro foi pego é a distância até a PONTA de cada um. */
function pegaEm(x,y){
  if(travada||!eRelo||!eRelo.parentNode) return;
  var r=eRelo.getBoundingClientRect();
  var cx=r.left+r.width/2, cy=r.top+r.height/2, lado=r.width;
  var am=mm*6*Math.PI/180, ah=((hh%12)*60+mm)*0.5*Math.PI/180;
  var mx=cx+Math.sin(am)*lado*0.41, my=cy-Math.cos(am)*lado*0.41;
  var ox=cx+Math.sin(ah)*lado*0.29, oy=cy-Math.cos(ah)*lado*0.29;
  var dm=(x-mx)*(x-mx)+(y-my)*(y-my), dh=(x-ox)*(x-ox)+(y-oy)*(y-oy);
  maoPega=(dm<=dh)?"min":"hora";
  pego=1; moveuP=false;
}
function moveEm(x,y){
  if(!pego||!eRelo||!eRelo.parentNode||travada) return;
  var r=eRelo.getBoundingClientRect();
  var dx=x-(r.left+r.width/2), dy=y-(r.top+r.height/2);
  if(Math.abs(dx)+Math.abs(dy)<14) return;   /* perto do pino: sem ângulo confiável */
  if(!moveuP){ moveuP=true; sTap(); eRelo.className="relo pegando"; }
  var a=Math.atan2(dx,-dy)*180/Math.PI; if(a<0) a+=360;
  if(maoPega==="min") giraMinuto(a); else giraHora(a);
}
function soltaMao(){
  if(moveuP) fimArrasto=agora();
  pego=null; moveuP=false;
  if(eRelo&&eRelo.parentNode) eRelo.className="relo";
}
/* ⭐ ENCAIXA DE 5 EM 5, E O PONTEIRO PEQUENO ANDA JUNTO. A virada do 55 para o
   0 (e a volta) sobe/desce a HORA — é assim que a criança descobre sozinha que
   uma volta do grande é uma hora do pequeno. */
function giraMinuto(a){
  var novo=(Math.round(a/30)*5)%60, ant=mm;
  if(novo!==ant){
    if(ant>=45&&novo<=15) hh=(hh%12)+1;
    else if(ant<=15&&novo>=45) hh=((hh+10)%12)+1;
    mm=novo; sTic(); poeMao();
  }
}
function giraHora(a){
  var h=Math.round(a/30-mm/60);
  h=((h%12)+12)%12; if(h===0) h=12;
  if(h!==hh){ hh=h; sTic(); poeMao(); }
}
function mexeMin(d){ if(travada) return; setTotal(tot(hh,mm)+d); sTic(); poeMao(); }
function mexeHora(d){ if(travada) return; setTotal(tot(hh,mm)+d*60); sTic(); poeMao(); }

/* ⚠️ data-qa é SÓ para o auditor-jogador: ele não sabe arrastar ponteiro, e
   sem isto reprovaria uma tela que funciona. A marca anda: fica sempre no
   botão que APROXIMA da hora pedida, e passa para o "Está pronto!" quando o
   relógio já está certo. Uma marca por vez, nunca duas. */
function marcaQA(){
  var i, alvo, d;
  if(!teclas.length) return;
  for(i=0;i<teclas.length;i++) teclas[i].removeAttribute("data-qa");
  if(eOk) eOk.removeAttribute("data-qa");
  alvo=tot(cenaF().h,cenaF().m);
  d=((alvo-tot(hh,mm))+720)%720;
  if(d===0){ if(eOk) eOk.setAttribute("data-qa","1"); return; }
  var chave;
  if(d<=360) chave=(d>=60)?"+h":"+m";
  else chave=((720-d)>=60)?"-h":"-m";
  for(i=0;i<teclas.length;i++) if(teclas[i]._k===chave){ teclas[i].setAttribute("data-qa","1"); return; }
}

/* ---------------------------------------------------------------
   TELA 1 — FORMAR A HORA. A criança move os ponteiros até chegar na
   hora pedida. É a tela que o professor pediu com todas as letras.
   --------------------------------------------------------------- */
function telaFormar(){
  limpa();
  ger++; travada=false; erros=0; teclas=[]; opcoes=[]; eOk=null;
  pego=null; moveuP=false;
  fi=idxDe("f"); li=idxDe("l");

  eDig=el("div","rdig","");
  c.appendChild(eDig);
  eTexto=el("div","rtexto","");
  c.appendChild(eTexto);

  var bts=el("div","rbts",""), i;
  var DEF=[{k:"-h",r:"<b>&#8722;1</b><i>hora</i>"},{k:"-m",r:"<b>&#8722;5</b><i>min</i>"},
           {k:"+m",r:"<b>+5</b><i>min</i>"},{k:"+h",r:"<b>+1</b><i>hora</i>"}];
  for(i=0;i<DEF.length;i++) bts.appendChild(fazTecla(DEF[i].k,DEF[i].r));
  c.appendChild(bts);

  eZona=el("div","rzona","");

  c.appendChild(el("div","hint","Arraste um ponteiro, use os bot&otilde;es "+
                   "ou as setas do teclado. Depois aperte Enter."));
  t.appendChild(c); app.appendChild(t);
  mostraLeitura(); marcaQA();
  /* AS DUAS PORTAS: no PC da escola tem teclado e a criança vai usar. */
  document.onkeydown=function(ev){
    var e=ev||window.event, k=e.keyCode||e.which;
    if(travada) return;
    if(k===37){ mexeMin(-5); }
    else if(k===39){ mexeMin(5); }
    else if(k===38){ mexeHora(1); }
    else if(k===40){ mexeHora(-1); }
    else if(k===13||k===32){ confereFormar(g); }
    else return;
    if(e.preventDefault) e.preventDefault();
  };
}
function fazTecla(k,rot){
  var b=el("div","tecl",rot);

    else if(k==="+m") mexeMin(5);
    else mexeMin(-5);
  };
  teclas.push(b);
  return b;
}
function confereFormar(g){
  if(g!==ger||travada) return;

  erraFormar(g);
}
function acertaFormar(g){

  document.onkeydown=null;
  if(erros===0) dePrimeira++;

               textoDaHora(c0.h,c0.m)+".", proximo);
}
/* ERRO NÃO PUNE: som grave curto, o relógio treme e o andaime CRESCE.
   ⚠️ TODO caminho de erro chama o andaime — inclusive o mais natural desta
   mecânica, que é acertar a hora e deixar os minutos para trás. Numa peça de
   traçar, o erro mais natural escrevia uma dica FIXA e a criança lia a mesma
   frase para sempre. */
function erraFormar(g){
  if(g!==ger) return;
  sErro(); erros++;
  if(eRelo){ eRelo.className="relo treme"; destreme(g); }
  if(erros===1){ mostraDica(dicaFormar1()); return; }
  if(erros===2){ poeFantasma(); mostraDica(dicaFormar2()); return; }
  revelaFormar(g);
}
function dicaFormar1(){
  var c0=cenaF();

    return "O ponteiro <b>pequeno e gordo</b> mostra a HORA. "+
           "Ele precisa chegar no <b>"+c0.h+"</b>.";

}
function dicaFormar2(){

         "Em <b>"+textoDaHora(c0.h,c0.m)+"</b>, o comprido fica no <b>"+
         numeroDoMinuto(c0.m)+"</b>.";
}
/* 2º degrau: APOIO CONCRETO. Repetir a frase mais alto não é degrau; mostrar
   ONDE o ponteiro tem que chegar, é. */
function poeFantasma(){
  if(!eRelo||document.getElementById("fantH")) return;
  var c0=cenaF();
  var fh=el("b","rfant rfhora",""), fm=el("b","rfant rfmin","");

  fh.style.webkitTransform="rotate("+ah+"deg)"; fh.style.transform="rotate("+ah+"deg)";
  fm.style.webkitTransform="rotate("+am+"deg)"; fm.style.transform="rotate("+am+"deg)";
  eRelo.insertBefore(fm,eRelo.firstChild);

/* ⚠️ 3º DEGRAU: REVELA E SÓ DEPOIS ESCREVE A DICA — e a dica FICA na tela até
   a criança tocar em "Entendi!". Em cinco peças de um lote a explicação do 3º
   degrau era escrita e apagada no mesmo quadro, porque o "revelar" chamava o
   "acertou" e o "acertou" limpava a barra de dica. A criança se via corrigida
   sem saber por quê. Nenhum portão vê isso: só medindo o texto na tela depois
   de errar. */
function revelaFormar(g){
  travada=true;
  document.onkeydown=null;
  poeFantasma();
  var c0=cenaF();

function destreme(g){

/* o botão que garante que a explicação do 3º degrau FOI LIDA: nada some

function fazOpcao(o,g){

}
function escolheu(b,g){
  if(g!==ger||travada) return;
  if((" "+b.className+" ").indexOf(" no ")>=0){
    /* opção já tentada: etiqueta em PALAVRAS e som de retorno. Um retângulo
       rosa e um `return` seco faz quem não distingue cor tocar ali para
       sempre achando que travou. */
    sTap(); mostraDica("Nessa a gente j&aacute; tentou. Tente uma das outras."); return;
  }
  if(b._ok){ acertaLer(b,g); return; }
  erraLer(b,g);
}
function acertaLer(b,g){
  travada=true;                      /* ⚠️ trava NO INSTANTE do toque */
  b.className="opt oph ok";

  mostraBanner("<b>Isso mesmo!</b> "+textoDaHora(c0.h,c0.m)+".", proximo);
}
function erraLer(b,g){

  b.className="opt oph no";
  b.removeAttribute("data-qa");

  for(i=0;i<opcoes.length;i++)

    mostraDica("Comece pelo ponteiro <b>pequeno e gordo</b>: ele diz a HORA. "+
               "O comprido s&oacute; diz os minutos.");
    return;
  }
  /* a REDE: se as erradas acabarem antes do 3º erro, revela na hora em vez de
     deixar uma tela com uma opção só. */
  if(erros===2&&sobrou>0){

    mostraDica("Olhe: o pequeno est&aacute; "+ondeEstaOPequeno(c0)+
               ", ent&atilde;o a hora &eacute; <b>"+c0.h+"</b>. Agora conte os minutos no comprido.");
    return;
  }
  revelaLer(g);
}
function ondeEstaOPequeno(c0){
  if(c0.m===0) return "bem no <b>"+c0.h+"</b>";
  return "entre o <b>"+c0.h+"</b> e o <b>"+(c0.h===12?1:c0.h+1)+"</b>";

/* ⚠️ revela -> DEPOIS a dica; e a dica fica de pé até a criança seguir. */
function revelaLer(g){
  travada=true;

  for(i=0;i<opcoes.length;i++){
    opcoes[i].removeAttribute("data-qa");

/* ==== PECA: sete-erros ==== */
MEC["sete-erros"] = function(f, cen, fim){
  cen.className = cen.className + " mec-sete-erros";
  /* ⚠️⚠️ LICAO PAGA, e a mais silenciosa de todas: a peca da MEMORIA declara a
     PROPRIA `function fim()`. Como o corpo dela entra dentro do fechamento, esse
     `fim` SOMBREAVA o parametro da ponte — e o `mostraBanner` daqui, que devia
     levar a fase seguinte, chamava a peca de volta. Laco infinito, sem erro de
     JS nenhum: o jogador so ficava PRESO, com todos os pares ja fechados e a
     medalha da peca na tela. Por isso a continuacao mora AQUI FORA, com um nome
     que o integrador confere que nenhuma peca usa (ver `confere_contra_motor`).
     E ela so dispara UMA vez: peca que chama o banner duas vezes pularia fase. */
  var _seguir = function(){ if(_seguir.ja) return; _seguir.ja = 1; fim(); };
  /* recolhe o enunciado da fase assim que a peca puser o balao dela (ver CSS) */
  setTimeout(function(){
    var b = cen.getElementsByClassName("pecabox")[0];
    if(b && b.getElementsByClassName("balao").length)
      cen.className = cen.className + " tembalaopeca";
  }, 120);
  (function(){
    /* a peca acha que esta sozinha; estes ajudantes fazem o meio de campo */
    var app = cen;
    /* o `ac()` DESTA peca: destrava o som (o motor chama isso de `arma()`) e
       devolve o AudioContext do motor. Fica local, dentro do fechamento, para
       nao brigar com o `var ac` do motor — que e o objeto, nao a funcao. */
    function ac(){ if(typeof arma === "function") arma(); return window.ac; }
    function limpa(){ var g = cen.getElementsByClassName("pecabox")[0];
      if(g) g.innerHTML = ""; else { g = document.createElement("div");
      g.className = "pecabox"; cen.appendChild(g); } app = g; }
    /* ⚠️ LICAO PAGA: este ajudante era um VAZIO — "quem manda na barra e o
       motor". So que o caca-palavras faz `setProg(t,0)` e depois PEGA A BARRA
       DE VOLTA (`t.getElementsByTagName("i")[0]`) para mostrar quantas palavras
       ja achou. Com o vazio, ele pegava `undefined` e estourava no primeiro
       toque: 446 erros de JS numa partida. Regra: o ajudante da ponte tem que
       FAZER o que o de verdade faz — nao pode so nao atrapalhar.
       A barra da PECA e a de dentro da fase (5 palavras achadas de 8); a do
       MOTOR e a da atividade (fase 4 de 32). As duas informam coisas
       diferentes, entao as duas ficam — a de dentro, menorzinha (ver CSS). */
    function setProg(t, p){
      if(!t || !t.appendChild) return;

/* ---------------------------------------------------------------
   1) O DADO ÚNICO. Nove lugares (grade 3x3). Cada lugar tem um objeto
   ou nada. `n` = quantidade (frutas, janelas); `esc` = tamanho.
   --------------------------------------------------------------- */
var GC=3, GL=3;
var CENA_A=[
 {t:"sol"},              {t:"nuvem"},          {t:"passaro"},
 {t:"arvore", n:3},      {t:"casa", n:2},      {t:"arvore", n:2},
 {t:"flor"},             {t:"bola", esc:1},    {t:"flor"}
];
/* as MUDANÇAS que a cena 2 recebe por cima. Nenhuma é de cor:
   sumir, quantidade, tamanho e "virou outra coisa" — quem não distingue
   cor joga exatamente igual. */
var MUDA=[
 {sp:2, acao:"sumir"},
 {sp:3, acao:"n",   val:2},
 {sp:4, acao:"n",   val:1},
 {sp:7, acao:"esc", val:.5},
 {sp:8, acao:"t",   val:"pedra"}
];

function copiaObj(o){ if(!o) return null;
  return {t:o.t, n:o.n, esc:o.esc}; }
function fazCenaB(){
  var b=[], i, m, o;
  for(i=0;i<CENA_A.length;i++) b.push(copiaObj(CENA_A[i]));
  for(i=0;i<MUDA.length;i++){
    m=MUDA[i]; o=b[m.sp];
    if(m.acao==="sumir"){ b[m.sp]=null; }
    else if(o){ o[m.acao]=m.val; }
  }
  return b;
}
/* ⚠️ CALCULADO NA HORA DE JOGAR, NAO NA DECLARACAO. Antes era
   `var CENA_B=fazCenaB();` aqui mesmo — e dentro de uma atividade montada pelo
   esqueleto o conteudo da fase (`CENA_A`/`MUDA`) so chega DEPOIS desta linha.
   Resultado: a fase mostrava a cena de EXEMPLO, com os erros de exemplo, sem
   erro de JS nenhum. Regra: valor derivado do conteudo se calcula quando a
   peca comeca, nunca quando ela e lida.                                     */
var CENA_B=null;

/* ---------------------------------------------------------------
   2) A LISTA DO QUE DIFERE NÃO É ESCRITA À MÃO: é comparada.
   `naZona(sp)` responde a pergunta honesta desta mecânica — este lugar
   da tela é uma diferença? Não há ponto, nem raio, nem distância.
   --------------------------------------------------------------- */
function serial(o){ if(!o) return "-";
  return o.t+"/"+(o.n===undefined?"-":o.n)+"/"+(o.esc===undefined?1:o.esc); }
function difEm(sp){ return serial(CENA_A[sp])!==serial(CENA_B[sp]); }
function naZona(sp){ return difEm(sp); }
function tipoDaDif(sp){
  var a=CENA_A[sp], b=CENA_B[sp];
  if(a&&!b) return "alguma coisa <b>sumiu</b>";
  if(!a&&b) return "<b>apareceu</b> alguma coisa";
  if(a.t!==b.t) return "uma coisa <b>virou outra</b>";
  if(a.n!==b.n) return "mudou a <b>quantidade</b>";
  return "mudou o <b>tamanho</b>";
}
function listaDifs(){ var i,r=[]; for(i=0;i<9;i++){ if(difEm(i)) r.push(i); } return r; }

   impossível nascer uma diferença que não esteja no dado.

var POSFRU=[[14,16],[54,14],[34,40],[62,42]];
var POSJAN=[[22,46],[60,46]];
function desenhaObj(o){
  var s="", i, p, d;
  if(!o) return "";
  if(o.t==="sol")   return '<i class="fsol"></i>';
  if(o.t==="nuvem") return '<i class="fnu1"></i><i class="fnu2"></i>';
  if(o.t==="passaro") return '<i class="fpco"></i><i class="fpaz"></i><i class="fpbi"></i>';
  if(o.t==="pedra") return '<i class="fped"></i>';
  if(o.t==="flor")  return '<i class="fcau"></i><i class="fpet"></i><i class="fmio"></i>';
  if(o.t==="arvore"){
    s='<i class="ftro"></i><i class="fcop"></i>';
    for(i=0;i<(o.n||0)&&i<POSFRU.length;i++){
      p=POSFRU[i];
      s+='<i class="ffru" style="left:'+p[0]+'%;top:'+p[1]+'%"></i>';
    }

  if(o.t==="casa"){

var FORMAS=[

];

  "Olhe o <b>contorno</b> da sombra: o que ela tem em cima e o que ela tem embaixo?",

function temClasse(e,c){

function fazCartao(f,som){

     (_qa/jogador.js) consegue fechar a peca sozinho. */
  l.setAttribute("data-qa",f.k);
  l._k=f.k; l._lado=som?"d":"e";

/* ---------- o toque simples: um lado, depois o outro ---------- */
function toca(l){
  if(temClasse(l,"feita")) return;
  if(!marcada){ sTap(); marca(l); return; }
  if(marcada===l){ sTap(); desmarca(); return; }
  if(marcada._lado===l._lado){ sTap(); marca(l); return; }   /* mesmo lado: troca */
  junta(marcada,l);
}
function marca(l){
  desmarca();
  l.className="lig sel";
  marcada=l;
}
function desmarca(){
  var a=app.getElementsByClassName("lig"), i;
  for(i=0;i<a.length;i++) if(!temClasse(a[i],"feita")) a[i].className="lig";
  marcada=null;
}

function junta(a,b){
  if(!a||!b||a===b||a._lado===b._lado) return;
  if(temClasse(a,"feita")||temClasse(b,"feita")) return;
  if(a._k===b._k){ fecha(a,b); return; }
  /* ERRO NAO PUNE: som grave curto, as pontas voltam e o andaime CRESCE.
     Nunca um X vermelho, nunca a palavra "errou". */
  sErro(); erros++;
  var guardar=a;
  desmarca();
  mostraDica(DICAS[Math.min(erros,DICAS.length)-1]);
  if(erros>=3) revela(guardar);
}

/* ⭐ o par que fecha ACENDE E PULSA: sem isso a crianca nao tem certeza de
   que acertou, e fica tocando de novo no que ja esta pronto.
   ⚠️ o temporizador continua correndo depois que a tela sai: sem o guarda da
   geracao (`ger`) ele mexeria numa tela que ja foi embora.
   ⚠️ e este aviso mora AQUI FORA de proposito: a bancada descobre as telas
   procurando a chamada de faxina dentro do corpo da funcao, e ela nao sabe
   distinguir codigo de comentario — com o aviso la dentro, a bancada chamava
   `fecha()` sem argumento nenhum e o portao estourava numa peca sadia. */
