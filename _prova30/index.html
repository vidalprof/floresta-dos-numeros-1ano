*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0}
html,body{height:100%;overflow:hidden}
body{font-family:"Fredoka",ui-rounded,"Segoe UI",system-ui,Arial,sans-serif;color:var(--texto);background:#bfe9ff;-webkit-user-select:none;user-select:none}
#bg{position:fixed;inset:0;z-index:0;background:#cdeeff center/cover no-repeat;background-image:none}
#ceu{position:fixed;inset:0;width:100%;height:100%;display:block;z-index:1;pointer-events:none}
#app{position:fixed;inset:0;z-index:2}
.tela{position:absolute;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch;display:-webkit-box;display:flex;-webkit-box-orient:vertical;-webkit-flex-direction:column;flex-direction:column;-webkit-box-align:center;align-items:center;padding:calc(40px + env(safe-area-inset-top)) 16px calc(104px + env(safe-area-inset-bottom));-webkit-animation:assadeira .38s cubic-bezier(.2,.9,.3,1);animation:assadeira .38s cubic-bezier(.2,.9,.3,1)}
/* ⭐ A TRANSICAO DE ASSADEIRA: a tela nova entra deslizando de baixo, como a
   bandeja que sai do forno. Corte seco parece prototipo; 0,38s de transicao
   parece produto — e e o unico enfeite da lista que custa CSS e mais nada.
   Curta de proposito: acima de ~0,45s a crianca sente que esta esperando. */
@-webkit-keyframes assadeira{from{opacity:0;-webkit-transform:translateY(22px)}to{opacity:1;-webkit-transform:none}}
@keyframes assadeira{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}
@-webkit-keyframes fade{from{opacity:0}to{opacity:1}}@keyframes fade{from{opacity:0}to{opacity:1}}
.balao{position:relative;max-width:430px;background:rgba(255,253,246,.95);border:0;border-radius:22px;padding:13px 18px;font-size:17px;font-weight:600;text-align:center;line-height:1.35;
  -webkit-box-shadow:0 6px 18px rgba(30,50,20,.22);box-shadow:0 6px 18px rgba(30,50,20,.22)}
.balao b{color:#2c7318}

/* ⭐ PENSAR e COMEMORAR sao MOVIMENTO da pose parada, nunca desenho novo.
   ⚠️ LICAO PAGA (ago/2026): o montador pedia cinco poses (`_pensa`, `_festa`
   alem das tres); as duas extras davam 404 e, quando mandei o Gemini EDITAR a
   pose parada para cria-las, voltaram dois personagens completamente
   diferentes — o Fuba e um ratinho padeiro em 3D e vieram dois meninos humanos
   em 2D. Desenho novo do mascote sai fora do personagem com uma facilidade
   assustadora; movimento nao tem como sair, porque e o MESMO desenho.
   `pensando`: inclina e desacelera — o corpo dela diz "estou esperando voce",
   sem tirar a vez da crianca. `festejando`: pulinho curto e animado. */
.broto.pensando{-webkit-animation:pensa 2.6s ease-in-out infinite;animation:pensa 2.6s ease-in-out infinite}

@-webkit-keyframes festeja{0%{-webkit-transform:translateY(0) scale(1)}35%{-webkit-transform:translateY(-22px) scale(1.07)}70%{-webkit-transform:translateY(0) scale(.97)}100%{-webkit-transform:translateY(0) scale(1)}}

/* ⭐ A VITRINE QUE ENCHE — o progresso que a crianca de 6 anos LE.
   Pesquisa que sustenta: competencia visivel (Deci & Ryan) e o impulso de
   COLECAO. Barra de porcentagem a crianca de 1o ano nao le; vitrine enchendo
   ela le de longe, e quer completar. A cada fase vencida entra um doce atras
   do vidro; no fim a vitrine esta cheia, e aquilo e a foto do dia dela.
   O acabamento e o VIDRO FOSCO da cartela — nao e imitacao de vitrine, e a
   vitrine. (Dos doze acabamentos, este era o unico que nao servia para
   resposta justamente porque a leitura depende do fundo; como superficie, isso
   deixa de ser defeito e vira a qualidade dele.)

/* alto-falante discreto: le a resposta para quem ainda nao le.
   ⚠️ LICAO PAGA (ago/2026) — o Marcos apontou este botao TRES vezes ate dizer
   *"esse botao de som esta horrivel. A parte preta tem que estar no meio do
   circulo"*. O desenho vinha de TRES filhos absolutos (`i` corpo, `b` cone,
   `s` onda) com left/top em pixel, repetidos em CADA quebra de tela: 6 blocos
   de aritmetica na mao para um icone de 18px. Bastava um deles sair de lugar
   (ou uma peca redefinir a caixa do `.zap`) para o boneco desmontar — circulo
   de um lado, corpinho do outro, a onda solta como um ")".
   Agora e UM SVG embutido no proprio botao: centra-se sozinho pelo `viewBox`,
   nao tem coordenada para errar e fica nitido em qualquer zoom. Nas telas
   pequenas so muda o `background-size`. Data URI = continua 1 arquivo so.
   ⚠️ A cor mora DENTRO do SVG, entao `background-color` e `background-image`
   ficam SEPARADOS aqui — usar o atalho `background:` em qualquer regra abaixo
   (hover, tocando, variante branca) apagaria o desenho. */
.zap{position:relative;-webkit-flex:none;flex:none;width:30px;height:30px;border-radius:50%;background-color:rgba(58,48,32,.09);border:0;cursor:pointer;padding:0;margin-left:8px;vertical-align:middle;display:inline-block;opacity:.55;-webkit-transition:opacity .2s;transition:opacity .2s;
  background-image:url("data:image/svg+xml;charset=utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 20 20'%3E%3Cpath fill='%233a3020' d='M4 7.6h3.1L11 3.9v12.2L7.1 12.4H4z'/%3E%3Cpath fill='none' stroke='%233a3020' stroke-width='1.7' stroke-linecap='round' d='M13.3 7.1a4.2 4.2 0 0 1 0 5.8'/%3E%3C/svg%3E");
  background-repeat:no-repeat;background-position:center center;-webkit-background-size:18px 18px;background-size:18px 18px}
.zap:hover,.zap:active{opacity:1;background-color:rgba(58,48,32,.2)}
.zap i,.zap b,.zap s{display:none}
.zap.tocando{opacity:1;background-color:rgba(255,212,59,.5);-webkit-animation:zpul .8s ease-in-out infinite;animation:zpul .8s ease-in-out infinite}
/* ⭐ ALTO-FALANTE NA PERGUNTA (pedido do Marcos, ago/2026: "precisa acrescentar
   um botao de som na atividade do 2 ano onde sao as perguntas, para ajudar quem
   nao sabe ler"). No 2o ano MUITA crianca ainda nao le: a narracao toca sozinha
   uma vez, mas se ela se distrai, perdeu. O botao "Ouvir de novo" existe la
   embaixo, na barra — longe do texto e com NOME ESCRITO, que e justamente o que
   ela nao le. O lugar do botao e GRUDADO no enunciado, e ele e um desenho de
   alto-falante, nao uma palavra.                                            */
/* ⚠️ O BOTAO NAO PODE TAPAR A PERGUNTA. A primeira versao pousava no canto de
   cima do balao e cobria a ultima palavra ("Toque na RAI[z]", "Que parte da
   planta e esta[?]"). Um botao de acessibilidade que esconde justamente o texto
   que a crianca precisa e o contrario do que ele existe para fazer. Agora o
   balao ABRE ESPACO para ele (classe `comzap`) e o botao mora dentro desse
   espaco, no meio da altura.                                               */
.balao.comzap{padding-right:56px}
.zapb{position:absolute;right:9px;top:50%;margin-top:-19px;width:38px;height:38px;border-radius:50%;
  background-color:#ffd43b;border:3px solid #fffdf6;cursor:pointer;padding:0;
  background-image:url("data:image/svg+xml;charset=utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 20 20'%3E%3Cpath fill='%234a3a10' d='M4 7.6h3.1L11 3.9v12.2L7.1 12.4H4z'/%3E%3Cpath fill='none' stroke='%234a3a10' stroke-width='1.7' stroke-linecap='round' d='M13.3 7.1a4.2 4.2 0 0 1 0 5.8'/%3E%3C/svg%3E");
  background-repeat:no-repeat;background-position:center center;
  -webkit-background-size:22px 22px;background-size:22px 22px;
  -webkit-box-shadow:0 3px 9px rgba(60,45,15,.35);box-shadow:0 3px 9px rgba(60,45,15,.35)}
/* mesmo glifo do `.zap` — dois desenhos diferentes de alto-falante na MESMA
   tela e amadorismo, e era o que estava acontecendo (o do balao tinha duas
   ondas, o das respostas uma so). */
.zapb i,.zapb b,.zapb s{display:none}
.zapb.tocando{background-color:#7bd44a;-webkit-animation:zpul .8s ease-in-out infinite;animation:zpul .8s ease-in-out infinite}
@-webkit-keyframes zpul{0%,100%{-webkit-transform:scale(1)}50%{-webkit-transform:scale(1.14)}}
@keyframes zpul{0%,100%{transform:scale(1)}50%{transform:scale(1.14)}}
/* fundo escuro (relampago, peca usada, ligacao certa) -> desenho branco */
.bin .zap,.pc.usada .zap,.lig.ok .zap{background-color:rgba(255,255,255,.22);
  background-image:url("data:image/svg+xml;charset=utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 20 20'%3E%3Cpath fill='%23ffffff' d='M4 7.6h3.1L11 3.9v12.2L7.1 12.4H4z'/%3E%3Cpath fill='none' stroke='%23ffffff' stroke-width='1.7' stroke-linecap='round' d='M13.3 7.1a4.2 4.2 0 0 1 0 5.8'/%3E%3C/svg%3E")}
.opt .zap,.pc .zap,.bin .zap{margin-left:6px}
.lig .zap{margin:3px 0 0 5px}
/* em tela baixa encolhe o CIRCULO e o desenho junto — uma linha, nao tres
   caixas para reposicionar na mao (era daqui que ele saia torto). */
@media (max-height:720px){ .zap{width:26px;height:26px;margin-left:5px;
  -webkit-background-size:16px 16px;background-size:16px 16px} }
@media (max-height:620px){ .zap{width:23px;height:23px;margin-left:4px;
  -webkit-background-size:14px 14px;background-size:14px 14px} }
/* menu do professor (codigo mestre) — nao e tela de crianca */
.mestre{display:-webkit-box;display:-webkit-flex;display:flex;-webkit-flex-wrap:wrap;flex-wrap:wrap;-webkit-box-pack:center;justify-content:center;gap:6px;margin-top:10px;width:100%;max-width:400px;max-height:56vh;overflow-y:auto}

/* ⭐ REGRA PERMANENTE (Marcos, ago/2026): CARTA DE MEMORIA E GRANDE.
   "quando fizer jogo da memoria faca cartas maiores, registre para sempre".
   A carta e FLUIDA (48% da largura) em vez de ter px fixo: no celular pequeno
   ela ainda entra duas por linha, e no PC ela cresce ate 210px. No PC largo a
   caixa abre para TRES colunas, e ai o tabuleiro inteiro cabe sem rolar.     */
@media (min-width:760px){ .mcartas{max-width:680px} }


/* ⭐ AS FIGURAS TÊM VIDA (ordem do Marcos, ago/2026: *"imagens devem ser lindas,
   sem fundo e animadas se possível"*). Duas animações, e só duas:
   · a figura ENTRA (aparece crescendo um tiquinho) — dá a sensação de que a
     tela respondeu, que é o que prende a criança pequena;
   · a figura da rodada FLUTUA devagar — sinal de "é aqui que você olha".
   ⚠️ nada de piscar, girar ou saltar: numa tela com 8 figuras isso vira
   poluição e atrapalha quem tem dificuldade de atenção.
   ⚠️ quem pediu menos movimento no sistema operacional recebe menos movimento
   (`prefers-reduced-motion`) — é acessibilidade, não enfeite.
   ⚠️ o "sem fundo" NÃO se resolve aqui: vem do RECORTE (a cartela é gerada em
   fundo preto e o `_padrao/cartela.py cortar` transforma em alfa de verdade). */
@-webkit-keyframes figentra{0%{opacity:0;-webkit-transform:scale(.86)}100%{opacity:1;-webkit-transform:scale(1)}}
@keyframes figentra{0%{opacity:0;transform:scale(.86)}100%{opacity:1;transform:scale(1)}}
@-webkit-keyframes figflutua{0%,100%{-webkit-transform:translateY(0)}50%{-webkit-transform:translateY(-5px)}}
@keyframes figflutua{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
.pecabox img{-webkit-animation:figentra .3s ease-out both;animation:figentra .3s ease-out both}
.jsFig img,.bsFig img,.oaFig img,.figrod img{
  -webkit-animation:figflutua 3.6s ease-in-out infinite;animation:figflutua 3.6s ease-in-out infinite}
@media (prefers-reduced-motion: reduce){
  .tela{-webkit-animation:fade .3s;animation:fade .3s}
  .pecabox img,.jsFig img,.bsFig img,.oaFig img,.figrod img{
    -webkit-animation:none !important;animation:none !important}
  /* o mascote para de bobear/pensar/festejar, mas a INCLINACAO do "estou
     esperando voce" fica — ela e informacao, nao enfeite. */
  .broto,.broto.festejando{-webkit-animation:none !important;animation:none !important}
  .broto.pensando{-webkit-animation:none !important;animation:none !important;
    -webkit-transform:rotate(-7deg);transform:rotate(-7deg)}
}
/* GERADO por integrar.py — nao editar a mao */

/* ⭐ A FESTA DO ACERTO — o CSS da comemoracao generica (ver o olheiro no

.pfaisca{position:fixed;width:9px;height:9px;border-radius:50%;pointer-events:none;

  25%{opacity:1}100%{transform:translateY(-58px) scale(1.15);opacity:0}}

@keyframes pfpula{0%,100%{transform:scale(1)}40%{transform:scale(1.07)}}
@media (prefers-reduced-motion:reduce){

/* ============================================================
   ⭐⭐ O JEITO DO BROTO — o molde visual da casa, para as 76 pecas.

   Ordem do Marcos (ago/2026), depois de abrir a Padaria: *"quero atividade
   bonita tipo app como o broto, o visual tem que ser mais caprichado"* e
   *"a atividade tem que ser nos moldes do que a gente vinha fazendo por
   ultimo, com o molde do broto"*.

   ⚠️ O QUE EU TINHA ERRADO: extrai do Broto a MOLDURA (capa, cracha, barra,
   banner, boletim) e deixei as FASES com o visual de cada peca, que nasceu na
   bancada — cartao branco chapado, borda fina, tudo encostado a esquerda. Por
   fora era o Broto; por dentro, nao. Todos os defeitos visuais que ele apontou
   numa noite (nome fora do quadro, letra pela metade, quadrado desalinhado,
   silaba sem cor) sao ESTE unico problema.

   Os valores abaixo NAO foram inventados: sao os do proprio `_jardim/index.html`
   — a mesma paleta, o mesmo raio, a mesma sombra, e a assinatura da casa, que e
   a BORDA DE BAIXO MAIS GROSSA (5px). E ela que da o ar de app, de peca que da
   para apertar.

   Especificidade: as regras da peca entram como `.mec-<nome> .opt` (0,2,0).
   Estas usam tres classes (0,3,0) de proposito — precisam ganhar, e sem
   `!important`, que seria pior de depurar.
   ============================================================ */
.centro .pecabox .opt,.centro .pecabox .pc,.centro .pecabox .ficha,.centro .pecabox .cx{
  background:rgba(255,253,246,.96);border:2px solid #e6dcc6;border-bottom-width:5px;
  border-radius:18px;color:#3a3020;font-weight:600;
  -webkit-box-shadow:0 5px 12px rgba(30,50,20,.16);box-shadow:0 5px 12px rgba(30,50,20,.16)}
.centro .pecabox .opt.ok,.centro .pecabox .pc.ok{border-color:#5bbf3a;background:#eafce0}
.centro .pecabox .opt.no{border-color:#ff7a6b;background:#fff0ee}
.centro .pecabox .balao{background:rgba(255,253,246,.95);border:0;border-radius:22px;
  padding:13px 18px;font-size:17px;font-weight:600;line-height:1.35;
  -webkit-box-shadow:0 6px 18px rgba(30,50,20,.22);box-shadow:0 6px 18px rgba(30,50,20,.22)}
.centro .pecabox .selo{background:#7d3fe0;color:#fff;font-size:13px;font-weight:700;
  padding:5px 12px;border-radius:999px}
/* ⚠️ `background-color`, NUNCA o atalho `background:` — o desenho do
   alto-falante e um SVG que mora no `background-image` do `.zap` (motor). O
   atalho zera o `background-image` junto, e o botao fica um circulo VAZIO.
   Foi exatamente o que aconteceu no dia em que o SVG entrou: no cartao da
   `ouvir-achar` o desenho aparecia, e nas fases de `completar` — que passam
   por esta ponte — o circulo saia em branco. */
.centro .pecabox .zap{width:30px;height:30px;border-radius:50%;
  background-color:rgba(58,48,32,.09);border:0;opacity:.62;padding:0}
.centro .pecabox .hint{color:#fffdf6;background:rgba(58,48,32,.55);border-radius:999px;
  padding:6px 14px;display:inline-block;font-size:14px}

/* ⭐ O MEDALHAO: no Broto a figura da rodada e GRANDE, redonda e centrada — a
   arte e a estrela da tela, nao um selinho no canto do cartao. */
.centro .pecabox .medalhao{width:168px;height:168px;margin:12px auto 4px;border-radius:50%;

/* ==== O QUE A PONTE PRECISA (vale para todas as mecanicas) ==== */
/* a barra de DENTRO da fase (quantas palavras achou, que rodada e esta) — a de
   cima, do motor, e a da atividade inteira. Duas informacoes diferentes, entao
   as duas ficam; esta e menorzinha para nao competir com a de cima.          */
.progpeca{height:6px;margin:2px 0 10px;opacity:.85}
/* ⚠️ o SELO da peca e o mesmo rotulo que o motor ja poe em cima, vindo do
   conteudo.json: duas plaquinhas iguais, uma embaixo da outra, so ocupam a tela
   da crianca. O BALAO da peca FICA — nele mora a pergunta da rodada, que muda
   dentro da fase e nao esta no enunciado.                                    */
.pecabox .selo{display:none}
/* ⚠️ LICAO PAGA, medida: com o enunciado da FASE em cima e o balao da PECA
   logo abaixo, o tabuleiro do jogo da memoria comecava tao baixo que 4 das 8
   cartas caiam fora da tela de 640px do monitor da escola. Da para rolar, mas
   memoria e um jogo de VER o tabuleiro: metade escondida acaba com a mecanica.
   E o dobro de enunciado tambem e defeito por si so — a regra da casa e uma
   ideia por tela, enunciado curto (carga cognitiva).
   Entao: quando a peca escreve o balao DELA (a pergunta da rodada), o
   enunciado da fase recolhe. Ele ja foi FALADO na abertura da fase, e o botao
   "Ouvir de novo" continua repetindo — nao se perde nada, ganha-se a tela. */
.centro.tembalaopeca > .balao{display:none}
/* ⚠️⚠️ A COLISAO DE CSS QUE DESMONTAVA O TABULEIRO. Toda peca constroi a tela
   dela com `el("div","tela")` e `el("div","centro")` — os mesmos nomes do
   motor, o que ate aqui era uma vantagem (por isso nenhuma peca precisou ser
   reescrita). So que no motor `.tela` e uma CAMADA ABSOLUTA DE TELA CHEIA
   (`position:absolute;inset:0`) em coluna. Dentro da fase, a tela da peca
   virava uma camada solta por cima de tudo, sem largura propria — e o
   tabuleiro do jogo da memoria, que devia ficar em 3 colunas, empilhava as 8
   cartas numa coluna so, 950px de altura: quatro delas fora da tela do
   monitor da escola. Medido: as 8 cartas no MESMO x.
   Aqui a tela da peca volta a ser o que ela e por dentro da fase: um bloco
   comum. O CSS proprio da peca (com `.mec-<nome>` na frente) manda no resto. */
.pecabox{width:100%}
.pecabox > .tela{position:static;inset:auto;display:block;padding:0;
  -webkit-animation:none;animation:none;height:auto;overflow:visible}
.pecabox > .tela > .centro{width:100%}

   de uma atividade montada quem fala e o MOTOR, com o mp3 do Edge TTS: as duas

   Aqui a voz do navegador e DESLIGADA de uma vez, para as 76: numa atividade
   montada existe o mp3, e voz de navegador nunca vai para a crianca (regra da
   casa). O que a peca queria dizer continua sendo dito — pelo olheiro do balao,

/* ⚠️⚠️ LICAO PAGA (ago/2026), e o Marcos pegou NO CELULAR, nao no PC:
   *"tem voz do navegador junto com a voz do Antonio e as vezes os dois falam ao
   mesmo tempo"*. No meu teste de mesa a medicao dava ZERO chamadas — e dava
   mesmo. A primeira versao deste guarda fazia
       window.speechSynthesis.speak = vazio;
   que e uma atribuicao de propriedade PROPRIA num objeto do navegador. No
   Chrome de mesa ela cria a sombra e funciona; no celular (e no Safari) o
   objeto costuma recusar a propriedade nova **em silencio** — sem erro, sem
   excecao — e o `speak` original continua ali, falando por cima do mp3 do
   Antonio.
   Por isso agora sao TRES camadas, e basta uma pegar:
     1. trocar o `window.speechSynthesis` inteiro por um objeto inerte;
     2. neutralizar o `speak` no PROTOTIPO (pega quem guardou a referencia);
     3. deixar o `SpeechSynthesisUtterance` sem texto — sem fala para enfileirar.
   A licao geral: guarda que depende de UMA atribuicao funcionar nao e guarda.
   E teste de mesa nao prova celular — o navegador de la e outro bicho. */
(function(){
  var vazio = function(){};
  var inerte = {
    speak: vazio, cancel: vazio, pause: vazio, resume: vazio,
    getVoices: function(){ return []; },
    speaking: false, pending: false, paused: false
  };
  /* 1) o objeto inteiro */
  try{ if(window.speechSynthesis) window.speechSynthesis.cancel(); }catch(e){}
  try{ Object.defineProperty(window, "speechSynthesis", {
         configurable: true, get: function(){ return inerte; } }); }catch(e){}
  /* 2) o prototipo — pega quem guardou a referencia antes de mim */
  try{ if(window.SpeechSynthesis && window.SpeechSynthesis.prototype){
         window.SpeechSynthesis.prototype.speak = vazio;
         window.SpeechSynthesis.prototype.cancel = vazio; } }catch(e){}
  /* 3) a propria fala nasce vazia */
  try{ if(window.SpeechSynthesisUtterance){
         var U = window.SpeechSynthesisUtterance;
         window.SpeechSynthesisUtterance = function(){ var u = new U(""); u.text = ""; return u; };
         window.SpeechSynthesisUtterance.prototype = U.prototype; } }catch(e){}
  /* 4) ultima linha: se ainda assim algo falar, cala na hora */
  try{ setInterval(function(){
         try{ if(inerte.speaking) inerte.cancel(); }catch(e){}
       }, 1500); }catch(e){}
})();

(function(){

     e pintar), `par` (memoria). Sem esta lista a festa so aparecia em 5 das 11 —

     ⚠️ `usada` FICA DE FORA de proposito: em `ouvir-achar` ela marca a opcao JA
     TENTADA, ou seja, um ERRO. Comemorar erro e pior que nao comemorar. */
  var MARCA = /(^|\s)(ok|certa|acerto|acertou|feito|cheia|par|casada|encaixou)(\s|$)/;
  var vistos = "__jaFestejou";
  /* ⚠️ LICAO PAGA: isto era lido UMA VEZ, no carregamento, e guardado. Se o

  function menosAnimacao(){

      window.matchMedia("(prefers-reduced-motion:reduce)").matches); }catch(e){ return false; }
  }

     que o CLONAR-MOTOR.md manda evitar; aqui ele apareceu na forma mais boba,
     a de imitar em CSS o que ja estava pronto em canvas. */
  function faiscas(el){
    if(menosAnimacao()) return;
    try{
      var r = el.getBoundingClientRect();
      if(!(r.width > 4)) return;
      var x = r.left + r.width / 2, y = r.top + r.height / 2;
      /* as mesmas cores e a mesma quantidade do Broto */

  new MutationObserver(function(){ setTimeout(olhaAcerto, 60); })

/* ==== FERRAMENTAS QUE AS PECAS USAM E O MOTOR NAO TINHA ====
   ⚠️ LICAO PAGA (achada pelo auditor-jogador, na 3a fase): o integrador so
   trazia o SEGUNDO <script> da peca (a mecanica). O PRIMEIRO — o motorzinho do
   MOLDE — ficava para tras, e com ele o `nota()` que faz o som. A peca escolher
   passou, a completar passou, e a MEMORIA morreu no primeiro som de carta
   virando. O motor tem `tom()`, mas as pecas foram afinadas com estes numeros
   (PESQUISA-SOM-E-GAMEFEEL), entao o `nota` vem junto.

   ⚠️⚠️ E A SEGUNDA METADE DA MESMA LICAO: o `ac` da peca e uma FUNCAO (destrava
   o som), e o `ac` do motor e o OBJETO AudioContext — o mesmo que alimenta o
   lip-sync do mascote. Declarar a funcao aqui NAO deu erro nenhum: o `var ac=`
   do motor simplesmente sobrescreveu, e a memoria voltou a morrer, agora com
   'ac is not a function'. Nome igual e TIPO diferente e a colisao que nao
   aparece. Solucao: `nota` usa o AudioContext do motor direto, e cada peca
   ganha o SEU `ac()` local dentro do fechamento (ver PONTE) — que destrava com
   `arma()`, o nome que o motor usa para isso, e devolve o contexto.

   Todo o resto do motorzinho (el, limpa, setProg, mostraDica, mostraBanner,
   baguncar, sCerto, sErro, sTap, festa) o motor ja tem com o MESMO nome E o
   mesmo tipo — e por isso a peca nunca precisou ser reescrita. */
function nota(f, dur, vol, tipo, atraso){
  if(typeof arma === "function") arma();
  var c = window.ac; if(!c || !c.createOscillator) return;
  try{
    var o = c.createOscillator(), g = c.createGain(), t = c.currentTime + (atraso||0);
    o.type = tipo || "triangle"; o.frequency.value = f;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol || 0.18, t + 0.014);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(c.destination); o.start(t); o.stop(t + dur + 0.02);
  }catch(e){}
}

/* LEVAR CADA PEÇA AO SEU LUGAR — a criança monta uma casinha: o telhado em
   cima, a janela na parede, a porta no chão, o sol no céu. Conteúdo neutro
   de propósito: trocar a tabela PARTES (chave, nome, e o retângulo da vaga
   dentro da figura) adapta a peça a qualquer conteúdo — as partes do corpo,
   as partes da planta, as peças de um mapa. */
/* o retangulo da vaga vai em PORCENTAGEM da figura (nunca em px): assim a

var PARTES=[
  {k:"sol",     n:"SOL",     x:0.8,  y:1.2,  w:16.9, h:25.9},

var telaAtual=null, barraP=null, casaEl=null;

/* ⭐ O GUARDA DO MOUSE FANTASMA. O celular dispara mousedown/mouseup e um

   peça que a criança tinha acabado de escolher. Pego DUAS vezes.        */
var ultimoToque=0, pego=null, somb=null, px0=0, py0=0, moveu=false, fimArrasto=0;

function agora(){ return (new Date()).getTime(); }
function souDedo(){ return agora()-ultimoToque<800; }
function cliqueDeArrasto(){ return agora()-fimArrasto<350; }
function temClasse(e,c){

}

/* ---------- o desenho, em porcentagem (serve na peça e na vaga) ---------- */
function desenho(tipo,tam){

  else if(tipo==="porta"){ d.appendChild(el("div","pt pport","")); d.appendChild(el("div","pt pmaca","")); }

/* ---------- as TRÊS portas de entrada ----------
   ⚠️ os tratadores de toque sao FUNCOES COM NOME de proposito: assim
   nenhum `preventDefault` fica perto do `touchstart` (matar o toque no
   celular e a armadilha nº1 desta mecanica). Ele mora so no `touchmove`,
   e so depois que o dedo ANDOU de verdade. */
function cliquePeca(){
  if(cliqueDeArrasto()) return;   /* este clique e o rabo do arrasto */
  if(souDedo()) return;           /* clique FANTASMA do dedo: ja tratado no touchend */
  escolhe(this);
}
function mouseIni(ev){
  if(souDedo()) return;           /* mouse FANTASMA do celular: ignora */

}
function toqueIni(ev){
  ultimoToque=agora();
  var to=ev.touches[0]; if(!to) return;
  pegaEm(this,to.clientX,to.clientY);
}
function toqueMeio(ev){
  ultimoToque=agora();
  if(!pego) return;
  var to=ev.touches[0]; if(!to) return;
  moveEm(to.clientX,to.clientY);
  if(moveu) ev.preventDefault();  /* so no MEIO do arrasto, nunca no comeco */
}
function toqueFim(ev){
  ultimoToque=agora();
  var to=ev.changedTouches[0], arrastou=moveu, alvo=this;
  if(to) soltaEm(to.clientX,to.clientY); else soltaSombra();
  if(!arrastou) escolhe(alvo);    /* toque simples: vale como escolher */

function moveMouse(ev){ if(souDedo()) return; if(pego) moveEm(ev.clientX,ev.clientY); }
function soltaMouse(ev){ if(souDedo()) return; if(pego) soltaEm(ev.clientX,ev.clientY); }

/* ---------- o arrasto de verdade (mouse e dedo pelo mesmo caminho) ------- */
function pegaEm(b,x,y){
  if(!b||temClasse(b,"usada")) return;

}
function moveEm(x,y){
  if(!pego) return;
  if(!moveu){
    if(Math.abs(x-px0)+Math.abs(y-py0)<10) return;
    moveu=true;

    escolhe(pego);
    somb=el("div","somb");
    somb.appendChild(desenho(pego._k,"dvg"));

  }

  acendeVagaSob(x,y);
}
function soltaEm(x,y){
  var b=pego, arrastou=moveu;
  soltaSombra();
  if(!b||!arrastou) return;
  fimArrasto=agora();
  var v=vagaSob(x,y);
  if(v) poe(b,v);

function soltaSombra(){
  if(somb&&somb.parentNode) somb.parentNode.removeChild(somb);
  somb=null; pego=null; moveu=false;

/* quem esta embaixo do dedo? sobe ate 6 pais porque o dedo pode cair no
   desenho que esta DENTRO da vaga. */
function vagaSob(x,y){
  var e=document.elementFromPoint(x,y), n=0;
  while(e&&e.nodeType===1&&n<6){
    if(temClasse(e,"cam")&&!temClasse(e,"ok")) return e;
    e=e.parentNode; n++;

  return null;
}
/* ⭐ A VAGA ACENDE QUANDO A PEÇA PASSA POR CIMA. Acende QUALQUER vaga que
   esteja embaixo do dedo — acender so a certa seria entregar a resposta.  */
function acendeVagaSob(x,y){
  var v=vagaSob(x,y), k;
  for(k in vagas){
    if(!vagas.hasOwnProperty(k)) continue;
    if(temClasse(vagas[k],"ok")) continue;
    vagas[k].className=(vagas[k]===v)?"cam alvo":"cam livre";
  }
}
function apagaAceso(){
  var k;
  for(k in vagas){
    if(!vagas.hasOwnProperty(k)) continue;
    if(temClasse(vagas[k],"ok")) continue;
    vagas[k].className=marcada?"cam livre":"cam";
  }
}

/* ---------- o toque simples: escolhe a peça, depois toca no lugar ------- */
function escolhe(b){
  if(!b||temClasse(b,"usada")) return;
  var i;
  for(i=0;i<pecas.length;i++) if(!temClasse(pecas[i],"usada")) pecas[i].className="pc";
  if(marcada===b){ marcada=null; sTap(); apagaAceso(); return; }
  b.className="pc sel"; marcada=b; sTap(); apagaAceso();
}
function cliqueVaga(){
  if(cliqueDeArrasto()) return;
  if(souDedo()&&!marcada) return;
  if(temClasse(this,"ok")) return;
  if(!marcada){ mostraDica("Primeiro toque numa <b>pe&#231;a</b> l&#225; embaixo. Depois toque no lugar."); return; }
  poe(marcada,this);
}

/* ---------- a regra da peça ---------- */
function poe(b,v){
  if(!b||!v||temClasse(b,"usada")||temClasse(v,"ok")) return;
  if(b._k===v._k) acerta(b,v); else erra(b);
}
function acerta(b,v){
  v.className="cam ok";
  v.innerHTML="";
  v.appendChild(desenho(b._k,"dvg"));
  b.className="pc usada";
  marcada=null;
  sCerto();
  postas++; errosSeg=0;

/* ERRO NÃO PUNE: som grave curto, a peça treme, e o andaime CRESCE. Nunca
   um X vermelho, nunca a palavra "errou". */
function erra(b){
  sErro(); errosSeg++;
  b.className="pc treme";
  destreme(b);
  mostraDica(DICAS[Math.min(errosSeg,DICAS.length)-1]);

/* ⚠️ DEFEITO PAGO NA BANCADA (ago/2026): no 3º degrau a dica sumia no MESMO

function piscaCerta(b){

   garante que a criança nunca fica presa. */
function revela(b){
  var v=vagas[b._k];
  if(v&&!temClasse(v,"ok")) acerta(b,v);

/* ====== A PEÇA COMEÇA AQUI ====== */

/* O CONTEÚDO É SÓ EXEMPLO (a horta da escola, 8 anos). Ao copiar a peça para
   uma atividade, troque APENAS esta lista. Palavras curtas, sem acento e sem
   Ç: o quadro de letras não tem tecla de acento e a criança compara letra a
   letra — MAÇÃ na grade viraria MACA e ela acharia que está errada.        */
var PAL=["MILHO","ALFACE","TOMATE","CENOURA","FEIJAO"];
var CORP=["p1","p2","p3","p4","p5"];
var LADO=8;                 /* a grade tem LADO x LADO casas */
var LETRAS="ABCDEFGHIJLMNOPRSTUVZ";

var ger=0;                  /* geracao da tela: mata timer de fase que ja saiu */
var relogio=0;              /* o relogio do andaime */

function pecaCaca(){
  ger++;
  if(relogio){ clearInterval(relogio); relogio=0; }
  limpa();
  var t=el("div","tela");
  setProg(t,0);
  var barraP=t.getElementsByTagName("i")[0];
  /* ⚠️ LICAO PAGA: a grade era SEMPRE LADO x LADO. Palavra maior que o lado
     nunca cabia; `sorteia()` devolvia false as 60 tentativas, a peca seguia com
     a grade incompleta e estourava no primeiro toque — 857 erros de JS numa
     partida, e a crianca presa numa fase sem saida. A grade existe para caber
     as palavras: agora ela CRESCE ate a maior delas. */
  var maior = 0, _z;
  for(_z = 0; _z < PAL.length; _z++)
    if(PAL[_z].length > maior) maior = PAL[_z].length;
  var N = Math.max(LADO, maior + 1), g=[], posicoes={}, onde={}, cor={}, achadas={}, cels={};
  var i,j,k,p;

  for(i=0;i<PAL.length;i++) cor[PAL[i]]=CORP[i%CORP.length];

  /* --- 1) sortear a grade ------------------------------------------------
     `cabe` deixa a palavra passar POR CIMA de outra quando a letra bate: e
     assim que nascem os cruzamentos, que sao a graca do caca-palavras (e a
     armadilha nº 5: as letras do cruzamento ja vem marcadas).            */
  function cabe(w,li,co,dl,dc){
    var z,y,x;
    for(z=0;z<w.length;z++){
      y=li+dl*z; x=co+dc*z;
      if(y<0||y>=N||x<0||x>=N) return false;
      if(g[y][x]&&g[y][x]!==w.charAt(z)) return false;
    }
    return true;
  }
  function poe(w,li,co,dl,dc){
    var z,cs=[];
    for(z=0;z<w.length;z++){
      g[li+dl*z][co+dc*z]=w.charAt(z);
      cs.push((li+dl*z)+"_"+(co+dc*z));
    }
    posicoes[w]=cs;
    onde[w]={r:li,c:co,n:w.length,h:(dl===0),dl:dl,dc:dc};
  }
  function zera(){
    var a,b2;
    g=[]; posicoes={}; onde={};
    for(a=0;a<N;a++){ g[a]=[]; for(b2=0;b2<N;b2++) g[a][b2]=""; }
  }
  /* a palavra CRUZA outra? (passa por uma casa que ja tem letra) */
  function cruza(w,li,co,dl,dc){
    var z;
    for(z=0;z<w.length;z++) if(g[li+dl*z][co+dc*z]) return true;
    return false;
  }
  /* ⚠️ DEFEITO PEGO NO TESTE À MÃO (e que portão nenhum via): sorteando a
     direção A CADA palavra, saía grade em que NENHUMA palavra estava na
     diagonal — e o enunciado, esse, prometia diagonal sempre. A criança
     varre a diagonal à toa, e "a atividade mentiu" é pior que diagonal
     nenhuma. Agora as quatro direções são um PLANO embaralhado: com cinco
     palavras, as quatro direções entram sempre, a diagonal inclusive.

     E, entre todas as casas onde a palavra cabe, prefere as que CRUZAM outra
     palavra — cruzamento é o que faz um caça-palavras de verdade (e é o que
     exercita a armadilha nº 5: as letras do cruzamento já vêm marcadas). */
  function sorteia(){
    var w,dl,dc,li,co,vagas,comCruz,esc,z;
    var dirs=[[0,1],[1,0],[1,1],[1,-1]];   /* deitada, em pe e as DUAS diagonais */
    var plano=[];
    zera();
    for(z=0;z<PAL.length;z++) plano.push(dirs[z%dirs.length]);
    baguncar(plano);
    for(w=0;w<PAL.length;w++){
      dl=plano[w][0]; dc=plano[w][1];
      vagas=[]; comCruz=[];
      for(li=0;li<N;li++) for(co=0;co<N;co++){
        if(!cabe(PAL[w],li,co,dl,dc)) continue;
        vagas.push([li,co]);
        if(cruza(PAL[w],li,co,dl,dc)) comCruz.push([li,co]);
      }
      /* a 1a palavra nao tem quem cruzar; da 2a em diante, cruzar vem antes */
      if(comCruz.length&&w>0) esc=comCruz[Math.floor(Math.random()*comCruz.length)];
      else if(vagas.length) esc=vagas[Math.floor(Math.random()*vagas.length)];
      else return false;
      poe(PAL[w],esc[0],esc[1],dl,dc);
    }
    return true;
  }
  function faltaAlguma(){
    var z;
    for(z=0;z<PAL.length;z++) if(!onde[PAL[z]]) return true;
    return false;
  }
  var voltas=0;
  while(!sorteia()&&voltas<60) voltas++;
  if(faltaAlguma()){
    /* rede de seguranca: se o sorteio nao fechou (praticamente impossivel,
       mas palavra comprida demais para a grade fecharia aqui), monta deitado,
       uma palavra por linha. A peca NUNCA nasce quebrada.                */
    zera();
    for(i=0;i<PAL.length;i++) poe(PAL[i],i%N,0,0,1);
  }
  /* ⭐ O ENUNCIADO DIZ A VERDADE SOBRE ESTA GRADE.
     Não é frase decorada: ele é montado a partir de onde as palavras
     REALMENTE ficaram. Prometer diagonal numa grade sem diagonal é pôr a
     criança para varrer o que não existe — e é o tipo de mentira que
     nenhum portão vê, porque o código está "funcionando".              */
  function temDir(dl,dc){
    var w;
    for(w in onde) if(onde.hasOwnProperty(w)&&onde[w].dl===dl&&onde[w].dc===dc) return true;
    return false;
  }
  var jeitos=[];
  if(temDir(0,1)) jeitos.push("deitadas");
  if(temDir(1,0)) jeitos.push("em p&#233;");
  var temDiag=(temDir(1,1)||temDir(1,-1));
  var comoEstao = jeitos.join(", ") + (temDiag ? (jeitos.length?" ou na <b>diagonal</b>":"na <b>diagonal</b>") : "");
  /* --- 2) a grade fica CHEIA: toda casa vazia ganha uma letra sorteada --- */
  for(i=0;i<N;i++) for(j=0;j<N;j++)
    if(!g[i][j]) g[i][j]=LETRAS.charAt(Math.floor(Math.random()*LETRAS.length));

  /* --- 3) a tela --------------------------------------------------------- */
  var c=el("div","centro");
  c.appendChild(el("div","selo","CA&#199;A-PALAVRAS DA HORTA"));
  var bal=el("div","balao","Ache as <b>"+PAL.length+" palavras</b> da horta. Elas est&#227;o "+comoEstao+".");
  c.appendChild(bal);

  var lista=el("div","cp_lista"), chips={};
  for(i=0;i<PAL.length;i++){
    var ch=el("div","pchip "+cor[PAL[i]]);
    ch.innerHTML='<i class="pbola"></i>'+PAL[i];
    chips[PAL[i]]=ch;
    lista.appendChild(ch);
  }
  c.appendChild(lista);

  var grade=el("div","cp_grade");
  /* ⭐ data-qa: onde cada palavra ficou (r, c, tamanho, deitada?, e o PASSO
     dl/dc, que e o que ensina a diagonal ao auditor). Existe SO para o
     auditor-jogador; a crianca nao ve diferenca nenhuma.                 */
  grade.setAttribute("data-qa",JSON.stringify(onde));
  for(i=0;i<N;i++) for(j=0;j<N;j++){(function(y,x){
    var q=el("div","cp_cel",g[y][x]);
    /* ⭐ A ARMADILHA Nº 1: porcentagem, nunca px. */
    q.style.width=(100/N)+"%";
    cels[y+"_"+x]=q;
    q.onclick=function(){
      if(q.className.indexOf("ok")>=0){ sTap(); confere(); return; }  /* TRAVA */
      q.className = q.className.indexOf("mark")>=0 ? "cp_cel" : "cp_cel mark";
      sTap();
      confere();
    };
    grade.appendChild(q);
  })(i,j);}
  c.appendChild(grade);
  c.appendChild(el("div","hint","Toque em cada letra da palavra. Tocou errado? Toque de novo para tirar."));
  t.appendChild(c);
  app.appendChild(t);

  /* --- 4) conferir: `mark` OU `ok` (armadilha nº 5) ---------------------- */
  function pega(id){
    var cl=cels[id].className;
    return cl.indexOf("mark")>=0||cl.indexOf("ok")>=0;
  }
  function quantas(){
    var n=0,w;
    for(w in achadas) if(achadas.hasOwnProperty(w)) n++;
    return n;
  }
  function faixa(w){
    var f=el("div","achouf",w+"!");
    document.body.appendChild(f);
    setTimeout(function(){ if(f.parentNode) f.parentNode.removeChild(f); },1200);
  }
  function comemora(w){
    /* cinto de seguranca: palavra sem lugar na grade nao pode virar estouro */
    var cs=posicoes[w],z;
    if(!cs) return;
    for(z=0;z<cs.length;z++){(function(q,atraso){
      setTimeout(function(){ q.className="cp_cel ok "+cor[w]; },atraso);
    })(cels[cs[z]],z*70);}
    sCerto();
    faixa(w);
    chips[w].className="pchip "+cor[w]+" feito";
  }
  function confere(){
    var w,z,todas,n;
    for(w in posicoes){
      if(!posicoes.hasOwnProperty(w)||achadas[w]) continue;
      todas=true;
      for(z=0;z<posicoes[w].length;z++) if(!pega(posicoes[w][z])) todas=false;
      if(todas){
        achadas[w]=1;
        comemora(w);
        relogioAjuda();
      }
    }
    n=quantas();
    barraP.style.width=Math.round(n*100/PAL.length)+"%";
    if(n>0&&n<PAL.length) bal.innerHTML="J&#225; achou <b>"+n+"</b> de <b>"+PAL.length+"</b>! Faltam as outras.";
    if(n>=PAL.length){
      if(relogio){ clearInterval(relogio); relogio=0; }
      bal.innerHTML="Achou as <b>"+PAL.length+"</b> palavras da horta!";
      var meu=ger;
      setTimeout(function(){
        if(meu!==ger) return;
        mostraBanner("Voc&#234; varreu a cp_grade inteira &#8212; at&#233; a <b>diagonal</b>!",fimDaPeca);
      },900);
    }
  }

  /* --- 5) o andaime CRESCE pelo TEMPO PARADO (armadilha nº 7) ------------ */
  function proxima(){
    var z;
    for(z=0;z<PAL.length;z++) if(!achadas[PAL[z]]) return PAL[z];
    return null;
  }
  function direcaoDe(w){
    var o=onde[w];
    if(!o) return "";
    if(o.dl===0) return "deitada";
    if(o.dc===0) return "em p&#233;";
    return "na <b>diagonal</b>";
  }
  function relogioAjuda(){
    var nivel=0, meu=ger;
    if(relogio) clearInterval(relogio);
    relogio=setInterval(function(){
      if(meu!==ger){ clearInterval(relogio); relogio=0; return; }
      var w=proxima();
      if(!w){ clearInterval(relogio); relogio=0; return; }
      nivel++;
      if(nivel===1){
        mostraDica("Procure a palavra <b>"+w+"</b> &#8212; ela est&#225; "+direcaoDe(w)+".");
      } else {
        var c0=posicoes[w][0];
        if(cels[c0]&&cels[c0].className.indexOf("ok")<0)
          cels[c0].className=cels[c0].className+" cp_pisca";
        mostraDica("A palavra <b>"+w+"</b> come&#231;a na letra que est&#225; piscando.");
        clearInterval(relogio); relogio=0;
      }
    },20000);
  }
  relogioAjuda();
}

function fimDaPeca(){
  ger++;
  if(relogio){ clearInterval(relogio); relogio=0; }
  limpa();
  var t=el("div","tela");
  setProg(t,100);
  var c=el("div","centro");
  c.appendChild(el("div","selo","PE&#199;A FECHADA"));
  c.appendChild(el("div","medal",""));
  c.appendChild(el("div","balao","Voc&#234; achou as "+PAL.length+" palavras da horta."));
  var b=el("button","btn","Jogar de novo");
  b.onclick=function(){ pecaCaca(); };
  c.appendChild(b);
  c.appendChild(el("div","hint","Esta &#233; a pe&#231;a CA&#199;A-PALAVRAS: cp_grade em porcentagem, quatro dire&#231;&#245;es, letra conquistada travada."));
  t.appendChild(c);
  app.appendChild(t);
}
    if(f && f.dados) PAL = f.dados;
    if(f && f.dadosExtra){ var _d = f.dadosExtra;
      if(_d.CORP !== undefined) CORP = _d.CORP;
      if(_d.LETRAS !== undefined) LETRAS = _d.LETRAS;

    pecaCaca();

};

/* ==== PECA: classificar ==== */
MEC["classificar"] = function(f, cen, fim){
  cen.className = cen.className + " mec-classificar";
  /* ⚠️⚠️ LICAO PAGA, e a mais silenciosa de todas: a peca da MEMORIA declara a
     PROPRIA `function fim()`. Como o corpo dela entra dentro do fechamento, esse
     `fim` SOMBREAVA o parametro da ponte — e o `mostraBanner` daqui, que devia
     levar a fase seguinte, chamava a peca de volta. Laco infinito, sem erro de
     JS nenhum: o jogador so ficava PRESO, com todos os pares ja fechados e a
     medalha da peca na tela. Por isso a continuacao mora AQUI FORA, com um nome
     que o integrador confere que nenhuma peca usa (ver `confere_contra_motor`).
     E ela so dispara UMA vez: peca que chama o banner duas vezes pularia fase. */
  var _seguir = function(){ if(_seguir.ja) return; _seguir.ja = 1; fim(); };
  /* recolhe o enunciado da fase assim que a peca puser o balao dela (ver CSS) */
  setTimeout(function(){
    var b = cen.getElementsByClassName("pecabox")[0];
    if(b && b.getElementsByClassName("balao").length)
      cen.className = cen.className + " tembalaopeca";
  }, 120);
  (function(){
    /* a peca acha que esta sozinha; estes ajudantes fazem o meio de campo */
    var app = cen;
    /* o `ac()` DESTA peca: destrava o som (o motor chama isso de `arma()`) e
       devolve o AudioContext do motor. Fica local, dentro do fechamento, para
       nao brigar com o `var ac` do motor — que e o objeto, nao a funcao. */
    function ac(){ if(typeof arma === "function") arma(); return window.ac; }
    function limpa(){ var g = cen.getElementsByClassName("pecabox")[0];
      if(g) g.innerHTML = ""; else { g = document.createElement("div");
      g.className = "pecabox"; cen.appendChild(g); } app = g; }
    /* ⚠️ LICAO PAGA: este ajudante era um VAZIO — "quem manda na barra e o
       motor". So que o caca-palavras faz `setProg(t,0)` e depois PEGA A BARRA
       DE VOLTA (`t.getElementsByTagName("i")[0]`) para mostrar quantas palavras
       ja achou. Com o vazio, ele pegava `undefined` e estourava no primeiro
       toque: 446 erros de JS numa partida. Regra: o ajudante da ponte tem que
       FAZER o que o de verdade faz — nao pode so nao atrapalhar.
       A barra da PECA e a de dentro da fase (5 palavras achadas de 8); a do
       MOTOR e a da atividade (fase 4 de 32). As duas informam coisas
       diferentes, entao as duas ficam — a de dentro, menorzinha (ver CSS). */
    function setProg(t, p){
      if(!t || !t.appendChild) return;
      var pr = document.createElement("div"); pr.className = "prog progpeca";
      var i = document.createElement("i"); i.style.width = (p || 0) + "%";
      pr.appendChild(i); t.appendChild(pr);
    }
    /* ⚠️⚠️ LICAO PAGA (ago/2026), pega pelo Marcos JOGANDO: *"esta passando de
       fase sem aquele botao azul que aparecia com a palavra proximo... tem que
       ser parecida com a atividade do Broto"*.

       Esta ponte comemorava e PULAVA para a fase seguinte sozinha, 420ms
       depois. A crianca terminava uma fase e era JOGADA na outra: sem a tela de
       parabens, sem o mascote dizendo o que ela conseguiu, sem o botao para ela
       decidir quando seguir. No Broto — que e o modelo — cada fase fecha com o
       banner e a crianca TOCA para continuar. Era o fecho de toda fase de toda
       atividade montada que estava faltando.

       Agora a ponte chama o banner DE VERDADE do motor (`window.mostraBanner`,
       que a funcao local aqui dentro sombreia) e entrega o `_seguir` como o
       botao. A peca continua so avisando que acabou; quem manda no caminho
       segue sendo o motor — mas com a comemoracao no meio. */
    function mostraBanner(msg, cb){
      if(typeof festa === "function") festa();
      if(typeof window.mostraBanner === "function"){
        window.mostraBanner(msg || "Muito bem!", _seguir); return;
      }
      setTimeout(_seguir, 420);
    }
    limpa();

/* ====== A PEÇA COMEÇA AQUI ====== */

/* O CONTEÚDO É SÓ EXEMPLO (partes da planta, 8 anos). Ao copiar a peça para
   uma atividade, troque APENAS este bloco: as gavetas, as fichas e as três
   dicas (dica -> apoio concreto -> revela). Duas ou três gavetas; mais que
   isso a criança não segura na cabeça de uma vez.                          */
var GAVETAS=[
  {k:"raiz",  n:"A RAIZ<br>(embaixo da terra)"},
  {k:"folha", n:"A FOLHA<br>(no ar, verde)"}
];
/* `img` e OPCIONAL e vai VAZIO no exemplo de proposito: e assim que o montador
   aprende que o campo existe (ele confere os campos da fase contra este bloco).
   Com figura, a ficha mostra o desenho em cima da palavra — no 1o ano tem quem
   ainda nao le. Sem figura, continua so a palavra, e nenhuma atividade antiga
   quebra. */
var FICHAS=[
  {t:"BEBE A ÁGUA",     alvo:"raiz",  img:""},
  {t:"SEGURA A PLANTA", alvo:"raiz",  img:""},
  {t:"PEGA O SOL",      alvo:"folha", img:""},
  {t:"FAZ O ALIMENTO",  alvo:"folha", img:""}
];
/* ⚠️⚠️ RESTO DE CLONE CRAVADO NA PECA (ago/2026) — o pior tipo, porque nao da
   erro nenhum e viaja para TODA atividade que usar esta mecanica.
   O balao desta peca dizia, em texto fixo: *"Cada ficha conta uma TAREFA DA
   PLANTA. Guarde a ficha na parte que faz essa tarefa."* — enunciado do Jardim
   do Broto, de onde a peca foi clonada. Na Padaria das Letras a crianca lia
   sobre planta enquanto separava BOLACHA e MAMAO. Eu so vi porque fotografei a
   tela; nenhum portao pega texto que esta certo em portugues.
   A REGRA: enunciado e CONTEUDO, entao mora na gaveta — nunca no corpo da
   peca. O texto abaixo e so o exemplo, e e neutro de proposito. */
var ENUN="Cada ficha vai numa gaveta. Toque na ficha e depois na gaveta certa.";
var DICAS=[
  "Pense onde essa coisa acontece: debaixo do chão ou no ar?",
  "A RAIZ fica na terra: ela puxa a água e segura a planta. A FOLHA fica no ar: ela recebe o sol e faz o alimento.",
  "Olhe a gaveta que está com a borda amarela: é ali que esta ficha mora."
];

var feitos=0;          /* fichas ja guardadas */
var fila=[], vez=0;    /* a esteira: a ordem das fichas e em qual estamos */
var passo=null;        /* o rodape "doce 2 de 6 - ja guardados: ..." */
var marcada=null;      /* a ficha escolhida pelo toque simples */
var barraP=null;       /* a barrinha de progresso, para andar sem refazer a tela */
var ger=0;             /* geracao da tela: mata setTimeout de fase que ja saiu */

/* ⭐ O GUARDA DO MOUSE FANTASMA. O celular dispara mousedown/mousemove/mouseup
   FALSOS logo depois do toque; sem este carimbo eles desmarcavam a ficha que a
   criança tinha acabado de escolher. Defeito pego DUAS vezes pelo Marcos.  */
var ultimoToque=0;
var pegou=null, fantasma=null, x0=0, y0=0, arrastando=false, fimArrasto=0;

function agora(){ return (new Date()).getTime(); }
function souDedo(){ return agora()-ultimoToque<800; }
function cliqueDeArrasto(){ return agora()-fimArrasto<350; }

function pecaClassificar(){
  feitos=0; marcada=null; pegou=null; arrastando=false; ger++;
  limpa();
  var t=el("div","tela");
  setProg(t,0);
  barraP=t.querySelector(".prog i");
  var c=el("div","centro");
  c.appendChild(el("div","selo","ONDE CADA UMA MORA?"));
  c.appendChild(el("div","balao",ENUN));

  /* ⭐ A ESTEIRA — UMA FICHA POR VEZ (decisao do Marcos, ago/2026: *"pode ficar
     mais bonita, intuitiva, moderna e profissional"*, e ele deixou a escolha
     comigo). Antes a crianca encarava SEIS coisas de uma vez: quatro fichas,
     duas gavetas e o enunciado. Agora vem UMA ficha, grande, e so ha duas
     escolhas — uma ideia por tela (carga cognitiva, Sweller). Ela erra menos
     por confusao e mais por CONTEUDO, que e o erro que ensina.
     ⚠️ o gesto de ARRASTAR nao se perde: a ficha unica continua arrastavel, e
     o toque-toque continua valendo. Trocar a mecanica para "escolher" teria
     estreitado o leque que o `_qa/padrao.py` mede. */
  fila=[]; vez=0;
  var i;
  for(i=0;i<FICHAS.length;i++) fila.push(FICHAS[i]);
  baguncar(fila);
  var band=el("div","bandeja"); band.id="esteira";
  c.appendChild(band);

  var gs=el("div","gavs");
  for(i=0;i<GAVETAS.length;i++) gs.appendChild(fazGaveta(GAVETAS[i]));
  c.appendChild(gs);

  passo=el("div","passo","");
  c.appendChild(passo);
  c.appendChild(el("div","hint","Toque na ficha e depois na gaveta. Também dá para arrastar com o dedo ou com o mouse."));
  t.appendChild(c);
  app.appendChild(t);
  poeAVez();
}

/* poe na esteira a ficha da vez. Fase acabada = esteira vazia. */
function poeAVez(){
  var e=document.getElementById("esteira");
  if(!e) return;
  e.innerHTML="";
  if(vez<fila.length) e.appendChild(fazFicha(fila[vez]));
  if(passo){
    var ja=[], i;
    for(i=0;i<vez;i++) ja.push(fila[i].t);
    passo.innerHTML = (vez<fila.length ? ("doce "+(vez+1)+" de "+fila.length) : "todos guardados")
      + (ja.length ? (" &middot; j&aacute; guardados: "+ja.join(", ")) : "");

function fazFicha(f){
  /* ⭐ a FIGURA junto da palavra: no 1o ano tem quem ainda nao le, e a ficha
     so com texto ("BOLACHA") virava adivinhacao. Se a fase nao trouxer figura,
     a ficha continua so com a palavra — nenhuma atividade antiga quebra. */
  var p=el("div","pc","");
  if(f.img){ var im=el("img","pcfig"); im.src="img/"+f.img+".png"; im.alt=""; p.appendChild(im); }
  p.appendChild(el("b","pctxt",f.t));
  /* ficha e gaveta publicam a MESMA chave: e assim que o auditor-jogador
     consegue terminar a fase (e so ele olha para isto). */
  p.setAttribute("data-qa",f.alvo);
  p.onclick=function(){
    if(cliqueDeArrasto()) return;          /* este clique e o rabo do arrasto */
    if(p.className.indexOf("usada")>=0) return;
    sTap(); seleciona(p);
  };
  p.onmousedown=function(ev){
    if(souDedo()) return;                  /* mouse FANTASMA do celular: ignora */
    comeca(p,ev.clientX,ev.clientY);
  };
  p.addEventListener("touchstart",function(ev){
    ultimoToque=agora();
    var d=ev.touches[0];
    comeca(p,d.clientX,d.clientY);
  },false);
  return p;
}

/* ⚠️ NUNCA `preventDefault` no touchstart acima — mata o toque no celular.
   Ele mora no touchmove, la embaixo, e so enquanto ha ficha na mao.        */
function comeca(p,x,y){
  if(p.className.indexOf("usada")>=0) return;
  pegou=p; x0=x; y0=y; arrastando=false;
  seleciona(p);
}

function move(x,y){
  if(!pegou) return;
  if(!arrastando){
    if(Math.abs(x-x0)+Math.abs(y-y0)<10) return;
    arrastando=true;
    fantasma=el("div","fant",pegou.innerHTML);
    document.body.appendChild(fantasma);
  }
  fantasma.style.left=(x-52)+"px";
  fantasma.style.top=(y-24)+"px";
}

function solta(x,y){
  if(!pegou) return;
  var p=pegou; pegou=null;
  if(fantasma&&fantasma.parentNode){ fantasma.parentNode.removeChild(fantasma); }

  if(o.className.indexOf("no")>=0) return;   /* opcao ja apagada: nao responde */
  var f=QZ[qi];
  if(certa){

    trancaTudo();

    setTimeout(function(){
      if(g!==ger) return;                    /* a fase ja mudou: nao mexe */
      qi++;

    },560);

  /* ERRO: não pune. Som grave curto + a opção sai do alcance + o andaime CRESCE. */
  sErro();
  o.className="opt no";
  o.onclick=null;
  err++;

     não pode ficar olhando uma tela onde só resta uma opção sem ninguém
     dizer nada. Com 4 opções isso coincide com o 3º erro.                 */
  var acabou=(sobramErradas()===0);

}

   nunca trava — sempre existe caminho para fechar. */

  for(i=0;i<a.length;i++){
    if(a[i].getAttribute("data-qa")==="1"){

      if(a[i].innerHTML.indexOf("marca")<0)
        a[i].innerHTML=a[i].innerHTML+'<span class="marca">é esta</span>';

   parentesco do "vocabulario de outra rodada". A palavra do que ACABOU de
   acontecer sai daqui, nunca escrita a mao no meio do codigo.
   O 3o degrau e o que sempre falta nas pecas: ele DA UM PASSO pela crianca e
   so DEPOIS escreve a explicacao. */
var DICAS={
 parede:[
  "A parede riscada n&#227;o deixa passar. Ande pelo caminho <b>claro</b>.",
  "A casinha certa est&#225; <b>piscando</b>. Aperte a seta que vai at&#233; ela.",
  "Eu dei um passo por voc&#234;. Agora siga a casinha que <b>pisca</b>."],
 borda:[
  "Aqui o tabuleiro acaba. Experimente <b>outra seta</b>.",
  "A casinha certa est&#225; <b>piscando</b>. Aperte a seta que vai at&#233; ela.",
  "Eu dei um passo por voc&#234;. Agora siga a casinha que <b>pisca</b>."],
 espinhudo:[
  "O espinhudo estava ali! O amigo voltou para o come&#231;o. Passe <b>longe</b> dele.",
  "A casinha que <b>pisca</b> passa longe do espinhudo. Aperte a seta que vai at&#233; ela.",
  "Eu dei um passo por voc&#234;, por fora do espinhudo. Agora siga a casinha que <b>pisca</b>."]
};
var DIRS=[
 {dl:-1,dc:0, cls:"pcima",  rot:"cima",     lbl:"para cima"},
 {dl:0, dc:-1,cls:"pesq",   rot:"esquerda", lbl:"para a esquerda"},
 {dl:1, dc:0, cls:"pbaixo", rot:"baixo",    lbl:"para baixo"},
 {dl:0, dc:1, cls:"pdir",   rot:"direita",  lbl:"para a direita"}
];

var ti=0;              /* trecho de agora */
var grade=[];          /* o tabuleiro desta rodada, linha a linha */
var lin=0, col=0;      /* onde o bichinho esta */
var iniL=0, iniC=0;    /* onde ele comeca (e para onde volta) */
var fimL=0, fimC=0;    /* onde esta a estrela */
var celEls=[];         /* os quadradinhos, na ordem linha x coluna */
var setaEls=[];        /* os quatro botoes de seta */
var barraP=null, telaAtual=null;
var passos=0, tropecos=0, errosSeg=0;
var ger=0;             /* geracao: mata o setTimeout de uma tela que ja saiu */
var travada=false;     /* ⚠️ trava NO INSTANTE do acerto — crianca toca 2x */

function viva(){ return telaAtual&&telaAtual.parentNode; }
function nLin(){ return grade.length; }
function nCol(){ return grade.length?grade[0].length:0; }
function marca(r,c){ return (grade[r]&&grade[r][c])?grade[r][c]:"#"; }
function anda(r,c){
  if(r<0||c<0||r>=nLin()||c>=nCol()) return false;
  return marca(r,c)!=="#";
}
/* seguro = da para pisar E nao tem espinhudo. E o que a busca usa para
   garantir que existe caminho ate a estrela SEM encostar em ninguem. */
function seguro(r,c){ return anda(r,c)&&marca(r,c)!=="X"; }

/* A VOZ. Web Speech: se o PC nao tiver voz, a peca continua inteira — tudo o
   que a voz diz tambem esta desenhado na tela. */
function diz(txt){
  try{
    if(!window.speechSynthesis||!window.SpeechSynthesisUtterance) return;
    var u=new SpeechSynthesisUtterance(txt);
    u.lang="pt-BR"; u.rate=.98; u.pitch=1.06;
    window.speechSynthesis.cancel();
    window.speechSynthesis.speak(u);
  }catch(e){}
}
function sPasso(){ nota(523.25,.05,.10,"triangle",0); }
function sParede(){ nota(196,.10,.10,"sine",0); }
/* ⭐ O SOM DA VOLTA E GENTIL DE PROPOSITO. Encostar no espinhudo nao e falta:
   e um "opa, por aqui nao". Duas notas curtas descendo, sem aspereza. */
function sVolta(){ nota(392,.16,.12,"triangle",0); nota(294,.20,.11,"triangle",.09); }

/* ---------------------------------------------------------------
   A BUSCA EM LARGURA. Ela serve a DUAS coisas ao mesmo tempo:
     1. publicar em `data-qa` qual seta serve AGORA (so o auditor-jogador
        usa isso — ele nao sabe resolver labirinto, e sem isto reprovaria
        uma peca que funciona);
     2. GARANTIR que sempre existe caminho: e a mesma busca que o degrau 3
        do andaime usa para dar um passo pela crianca.
   --------------------------------------------------------------- */
function proximoPasso(){
  var L=nLin(), C=nCol(), i, j;
  if(!L||!C) return null;
  var de=[], fila=[[lin,col]], visto={};
  visto[lin+"_"+col]=1;
  var achou=false, k=0;
  while(k<fila.length&&!achou){
    var at=fila[k]; k++;
    for(i=0;i<DIRS.length;i++){
      var nr=at[0]+DIRS[i].dl, nc=at[1]+DIRS[i].dc;
      if(!seguro(nr,nc)) continue;
      if(visto[nr+"_"+nc]) continue;
      visto[nr+"_"+nc]=1;
      de[nr+"_"+nc]=at;
      fila.push([nr,nc]);
      if(nr===fimL&&nc===fimC){ achou=true; break; }
    }
  }
  if(!achou) return null;
  var cur=[fimL,fimC];
  while(true){
    var pai=de[cur[0]+"_"+cur[1]];
    if(!pai) return null;
    if(pai[0]===lin&&pai[1]===col) break;
    cur=pai;
  }
  for(j=0;j<DIRS.length;j++)
    if(lin+DIRS[j].dl===cur[0]&&col+DIRS[j].dc===cur[1]) return j;
  return null;
}

/* ---------------------------------------------------------------
   A TELA DO TRECHO. Ela se monta UMA vez; depois disso quem muda o
   tabuleiro e `pintaLab()`, que so troca o conteudo dos quadradinhos.
   Assim a barra de dica nao e apagada a cada passo.
   --------------------------------------------------------------- */
function telaLabirinto(){
  if(ti>=TRECHOS.length){ fimDaPeca(); return; }
  ger++; travada=false; errosSeg=0;
  limpa();
  var tr=TRECHOS[ti], r, c, linha;
  grade=[]; celEls=[]; setaEls=[];
  for(r=0;r<tr.linhas.length;r++){
    linha=tr.linhas[r].split("");
    grade.push(linha);
    for(c=0;c<linha.length;c++){
      if(linha[c]==="S"){ lin=r; col=c; iniL=r; iniC=c; }
      if(linha[c]==="F"){ fimL=r; fimC=c; }
    }
  }
  var t=el("div","tela"); telaAtual=t;
  setProg(t, Math.round(ti*100/TRECHOS.length));
  barraP=t.getElementsByTagName("i")[0];
  var ce=el("div","centro");
  ce.appendChild(el("div","selo",tr.selo));
  ce.appendChild(el("div","balao","Leve o amigo at&#233; a <b>estrela</b>. Desvie dos espinhudos!"));

  var lb=el("div","l_lab");
  for(r=0;r<nLin();r++){
    var lr=el("div","llin");
    for(c=0;c<nCol();c++){
      var q=el("div","lcel");
      lr.appendChild(q);
      celEls.push(q);
    }
    lb.appendChild(lr);
  }
  ce.appendChild(lb);

  /* AS SETAS — a porta do DEDO. Alvo de 56px, como o pre-escolar pede. */
  var dp=el("div","dpad");
  var l1=el("div","dlin"), l2=el("div","dlin");
  setaEls[0]=fazSeta(0); l1.appendChild(setaEls[0]);
  setaEls[1]=fazSeta(1); l2.appendChild(setaEls[1]);
  setaEls[2]=fazSeta(2); l2.appendChild(setaEls[2]);
  setaEls[3]=fazSeta(3); l2.appendChild(setaEls[3]);
  dp.appendChild(l1); dp.appendChild(l2);
  ce.appendChild(dp);
  ce.appendChild(el("div","hint","Aperte as setas na tela <b>ou</b> as setas do teclado. "+
                    "Trecho "+(ti+1)+" de "+TRECHOS.length+"."));
  t.appendChild(ce); app.appendChild(t);

  /* AS DUAS PORTAS: no PC da escola tem teclado e a crianca vai usar. */
  document.onkeydown=teclaLab;
  pintaLab();
  diz("Leve o amigo até a estrela. Desvie dos espinhudos!");
}
function fazSeta(i){
  var b=el("button","btn seta","");
  b.appendChild(el("i","pta "+DIRS[i].cls,""));
  b.setAttribute("aria-label","Andar "+DIRS[i].lbl);
  b.onclick=function(){ move(DIRS[i].dl,DIRS[i].dc); };
  return b;
}
/* ⚠️ todo ajudante que mexe no DOM comeca conferindo se o DOM existe: uma
   funcao dessas, chamada antes do elemento nascer, ja derrubou quatro
   portoes de uma vez com TypeError. */
function pintaLab(){
  if(!celEls.length) return;
  var r,c,q,m,dica=proximoPasso(),alvo=null;
  if(dica!==null) alvo=[lin+DIRS[dica].dl, col+DIRS[dica].dc];
  for(r=0;r<nLin();r++) for(c=0;c<nCol();c++){
    q=celEls[r*nCol()+c]; if(!q) continue;
    m=marca(r,c);
    q.className="lcel"+(m==="#"?" parede":"");
    q.innerHTML="";
    if(r===iniL&&c===iniC&&!(r===lin&&c===col)) q.appendChild(el("i","casa",""));
    if(r===fimL&&c===fimC) q.appendChild(el("i","prem",""));
    if(m==="X") q.appendChild(el("i","guarda",""));
    if(r===lin&&c===col) q.appendChild(el("i","bicho",""));
    /* o piscar so acende a partir do 2o degrau do andaime */
    if(errosSeg>=2&&alvo&&alvo[0]===r&&alvo[1]===c) q.className+=" l_pisca";
  }
  marcaSetaCerta(dica);
}
/* `data-qa` = a seta que serve AGORA. So o auditor-jogador le isso; para a
   crianca o atributo nao existe (nao muda um pixel na tela). */
function marcaSetaCerta(dica){
  var i;
  if(!setaEls.length) return;
  for(i=0;i<setaEls.length;i++){
    if(!setaEls[i]) continue;
    if(i===dica) setaEls[i].setAttribute("data-qa","1");
    else setaEls[i].removeAttribute("data-qa");
  }
}

/* ---------------------------------------------------------------
   O PASSO. Um so caminho para as duas portas (dedo e teclado): assim
   nao existe regra que valha num jeito de jogar e no outro nao.
   --------------------------------------------------------------- */
function teclaLab(ev){
  var e=ev||window.event, k=e.keyCode||e.which;
  if(k===38||k===87){ move(-1,0); }
  else if(k===40||k===83){ move(1,0); }
  else if(k===37||k===65){ move(0,-1); }
  else if(k===39||k===68){ move(0,1); }
  else return;
  if(e.preventDefault) e.preventDefault();
}
function move(dl,dc){
  if(travada||!viva()) return;
  var nr=lin+dl, nc=col+dc;
  /* saiu do tabuleiro: nao pune, mas o andaime CRESCE */
  if(nr<0||nc<0||nr>=nLin()||nc>=nCol()){
    sParede();
    ajuda(errosSeg+1,"borda");
    return;
  }
  /* bateu na parede: idem, com a palavra da PAREDE */
  if(marca(nr,nc)==="#"){
    sParede();
    ajuda(errosSeg+1,"parede");
    return;
  }
  /* encostou no espinhudo: volta ao comeco do TRECHO. Sem vida perdida, sem
     fim de jogo, sem a palavra que reprova — e o andaime cresce igual. */
  if(marca(nr,nc)==="X"){
    tropecos++;
    sVolta();
    lin=iniL; col=iniC;
    ajuda(errosSeg+1,"espinhudo");
    diz("Opa! O espinhudo estava ali. O amigo voltou para o começo.");
    return;
  }
  sPasso();
  lin=nr; col=nc; passos++; errosSeg=0;
  apagaDica();
  pintaLab();
  if(lin===fimL&&col===fimC) pegou();
}
function pegou(){
  travada=true;                       /* ⚠️ trava NO INSTANTE, nao no fim */
  document.onkeydown=null;
  sCerto();
  if(barraP) barraP.style.width=Math.round((ti+1)*100/TRECHOS.length)+"%";
  var g=ger;
  setTimeout(function(){
    if(g!==ger||!viva()) return;
    ti++;
    if(ti<TRECHOS.length)
      mostraBanner("<b>Pegou a estrela!</b><br>Voc&#234; desviou dos espinhudos.",telaLabirinto);
    else
      mostraBanner("<b>Voc&#234; pegou as tr&#234;s estrelas!</b><br>Olhar antes de andar deu certo.",fimDaPeca);
  },520);
}

/* ---------------------------------------------------------------
   O ANDAIME QUE CRESCE. Os TRES caminhos de erro (parede, borda e
   espinhudo) passam por aqui — e nao por uma frase fixa. A dica fixa
   num ramo natural de erro ja fez a crianca ler a MESMA frase para
   sempre, sem nunca chegar aos degraus de piscar e de revelar.
   --------------------------------------------------------------- */
function ajuda(n,tipo){
  var fala=DICAS[tipo]||DICAS.parede;
  errosSeg=Math.min(n,fala.length);
  if(errosSeg<3){
    pintaLab();
    mostraDica(fala[errosSeg-1]);
    return;
  }
  /* ⚠️ 3o DEGRAU: primeiro DA o passo, DEPOIS escreve a dica. Ao contrario,
     a explicacao e apagada no mesmo quadro em que nasce (defeito que
     apareceu em cinco pecas do mesmo lote). */
  passoSozinho();
  pintaLab();
  mostraDica(fala[2]);
}
function passoSozinho(){
  var d=proximoPasso();
  if(d===null) return;
  var nr=lin+DIRS[d].dl, nc=col+DIRS[d].dc;
  if(!seguro(nr,nc)) return;
  lin=nr; col=nc; passos++;
  sPasso();
  if(lin===fimL&&col===fimC){
    pintaLab();
    pegou();
  }
}
function apagaDica(){
  var d=document.getElementById("dicaP");
  if(d&&d.parentNode) d.parentNode.removeChild(d);
}

/* ---------------------------------------------------------------
   A MEDALHA. Parecer em palavras, nunca nota — e nunca a palavra que
   reprova. Quem tropecou muito ouve que tropecar faz parte.
   --------------------------------------------------------------- */
function fimDaPeca(){
  ger++; travada=false;
  document.onkeydown=null;
  limpa();
  var t=el("div","tela"); telaAtual=t;
  setProg(t,100);
  var c=el("div","centro");
  c.appendChild(el("div","selo","PE&#199;A FECHADA"));
  c.appendChild(el("div","medal",""));
  var parecer;
  if(tropecos===0) parecer="Voc&#234; passou por <b>todos</b> os espinhudos sem encostar em nenhum.";
  else if(tropecos<=2) parecer="Voc&#234; encostou <b>"+tropecos+"</b> vez"+(tropecos>1?"es":"")+
                               " e achou o caminho do mesmo jeito.";
  else parecer="Voc&#234; voltou ao come&#231;o <b>"+tropecos+"</b> vezes e n&#227;o desistiu. "+
               "&#201; assim que se aprende um caminho.";
  c.appendChild(el("div","balao",parecer));
  var b=el("button","btn","Jogar de novo");
  b.onclick=function(){ ti=0; passos=0; tropecos=0; telaLabirinto(); };
  c.appendChild(b);
  c.appendChild(el("div","hint","Esta &#233; a pe&#231;a LABIRINTO: setas na tela <b>e</b> setas do teclado."));
  t.appendChild(c); app.appendChild(t);
  diz("Peça fechada!");
}
    if(f && f.dados) TRECHOS = f.dados;
    if(f && f.dadosExtra){ var _d = f.dadosExtra;
      if(_d.DICAS !== undefined) DICAS = _d.DICAS;
      if(_d.DIRS !== undefined) DIRS = _d.DIRS;
    }
    telaLabirinto();
  })();
};

/* ==== PECA: ligar ==== */
MEC["ligar"] = function(f, cen, fim){
  cen.className = cen.className + " mec-ligar";
  /* ⚠️⚠️ LICAO PAGA, e a mais silenciosa de todas: a peca da MEMORIA declara a
     PROPRIA `function fim()`. Como o corpo dela entra dentro do fechamento, esse
     `fim` SOMBREAVA o parametro da ponte — e o `mostraBanner` daqui, que devia
     levar a fase seguinte, chamava a peca de volta. Laco infinito, sem erro de
     JS nenhum: o jogador so ficava PRESO, com todos os pares ja fechados e a
     medalha da peca na tela. Por isso a continuacao mora AQUI FORA, com um nome
     que o integrador confere que nenhuma peca usa (ver `confere_contra_motor`).
     E ela so dispara UMA vez: peca que chama o banner duas vezes pularia fase. */
  var _seguir = function(){ if(_seguir.ja) return; _seguir.ja = 1; fim(); };
  /* recolhe o enunciado da fase assim que a peca puser o balao dela (ver CSS) */
  setTimeout(function(){
    var b = cen.getElementsByClassName("pecabox")[0];
    if(b && b.getElementsByClassName("balao").length)
      cen.className = cen.className + " tembalaopeca";
  }, 120);
  (function(){
    /* a peca acha que esta sozinha; estes ajudantes fazem o meio de campo */
    var app = cen;
    /* o `ac()` DESTA peca: destrava o som (o motor chama isso de `arma()`) e
       devolve o AudioContext do motor. Fica local, dentro do fechamento, para
       nao brigar com o `var ac` do motor — que e o objeto, nao a funcao. */
    function ac(){ if(typeof arma === "function") arma(); return window.ac; }
    function limpa(){ var g = cen.getElementsByClassName("pecabox")[0];
      if(g) g.innerHTML = ""; else { g = document.createElement("div");
      g.className = "pecabox"; cen.appendChild(g); } app = g; }
    /* ⚠️ LICAO PAGA: este ajudante era um VAZIO — "quem manda na barra e o
       motor". So que o caca-palavras faz `setProg(t,0)` e depois PEGA A BARRA
       DE VOLTA (`t.getElementsByTagName("i")[0]`) para mostrar quantas palavras
       ja achou. Com o vazio, ele pegava `undefined` e estourava no primeiro
       toque: 446 erros de JS numa partida. Regra: o ajudante da ponte tem que
       FAZER o que o de verdade faz — nao pode so nao atrapalhar.
       A barra da PECA e a de dentro da fase (5 palavras achadas de 8); a do
       MOTOR e a da atividade (fase 4 de 32). As duas informam coisas
       diferentes, entao as duas ficam — a de dentro, menorzinha (ver CSS). */
    function setProg(t, p){
      if(!t || !t.appendChild) return;
      var pr = document.createElement("div"); pr.className = "prog progpeca";
      var i = document.createElement("i"); i.style.width = (p || 0) + "%";
      pr.appendChild(i); t.appendChild(pr);
    }
    /* ⚠️⚠️ LICAO PAGA (ago/2026), pega pelo Marcos JOGANDO: *"esta passando de
       fase sem aquele botao azul que aparecia com a palavra proximo... tem que
       ser parecida com a atividade do Broto"*.

       Esta ponte comemorava e PULAVA para a fase seguinte sozinha, 420ms
       depois. A crianca terminava uma fase e era JOGADA na outra: sem a tela de
       parabens, sem o mascote dizendo o que ela conseguiu, sem o botao para ela
       decidir quando seguir. No Broto — que e o modelo — cada fase fecha com o
       banner e a crianca TOCA para continuar. Era o fecho de toda fase de toda
       atividade montada que estava faltando.

       Agora a ponte chama o banner DE VERDADE do motor (`window.mostraBanner`,
       que a funcao local aqui dentro sombreia) e entrega o `_seguir` como o
       botao. A peca continua so avisando que acabou; quem manda no caminho
       segue sendo o motor — mas com a comemoracao no meio. */
    function mostraBanner(msg, cb){
      if(typeof festa === "function") festa();
      if(typeof window.mostraBanner === "function"){
        window.mostraBanner(msg || "Muito bem!", _seguir); return;
      }
      setTimeout(_seguir, 420);
    }
    limpa();

/* ====== A PEÇA COMEÇA AQUI ====== */

/* O CONTEÚDO É SÓ EXEMPLO (partes da planta, 8 anos). Ao copiar a peça para
   uma atividade troque APENAS este bloco: no máximo 6 pares, texto curto dos
   dois lados, e as três dicas (dica -> apoio concreto -> revela).          */
var LIG=[
  {k:"p0", t:"A RAIZ",  s:"Bebe a água da terra"},
  {k:"p1", t:"O CAULE", s:"Leva a água para cima"},
  {k:"p2", t:"A FOLHA", s:"Faz o alimento com o sol"},
  {k:"p3", t:"A FLOR",  s:"Vira fruto e semente"}
];
var DICAS=[
  "Pense no que essa parte da planta FAZ o dia inteiro.",
  "A raiz puxa a água da terra. O caule é o cano em pé. A folha recebe o sol. A flor vira fruto.",
  "Olhe do outro lado: a resposta certa está com a borda amarela. Toque nela."
];

var caixaL=null;     /* a .ligbox — as linhas sao medidas a partir dela */
var camadaL=null;    /* a .linhas, onde as linhas moram */
var barraP=null;     /* a barrinha, para andar sem refazer a tela */
var FEITOS=[];       /* pares ja fechados, para redesenhar as linhas */
var marcada=null;    /* a ponta escolhida pelo toque simples */
var ger=0;           /* geracao da tela: mata setTimeout de fase que ja saiu */

/* ⭐ O GUARDA DO MOUSE FANTASMA. O celular dispara mousedown/mousemove/mouseup
   FALSOS logo depois do toque; sem este carimbo eles desmarcavam a ponta que a
   criança tinha acabado de escolher. Defeito pego DUAS vezes pelo Marcos.  */
var ultimoToque=0;
var pegou=null, linhaViva=null, x0=0, y0=0, arrastando=false, fimArrasto=0;

function agora(){ return (new Date()).getTime(); }
function souDedo(){ return agora()-ultimoToque<800; }
function cliqueDeArrasto(){ return agora()-fimArrasto<350; }
function temClasse(e,c){
  if(!e||e.nodeType!==1) return false;
  return (" "+String(e.className)+" ").indexOf(" "+c+" ")>=0;
}

function pecaLigar(){
  FEITOS=[]; marcada=null; pegou=null; arrastando=false; ger++;
  limpa();
  var t=el("div","tela");
  setProg(t,0);
  barraP=t.querySelector(".prog i");
  var c=el("div","centro");
  c.appendChild(el("div","selo","CADA PARTE, SEU TRABALHO"));
  c.appendChild(el("div","balao","Ligue cada parte da planta com o <b>trabalho</b> que ela faz."));

  caixaL=el("div","ligbox");
  camadaL=el("div","linhas");
  caixaL.appendChild(camadaL);

  var esq=el("div","lcol lesq"), dir=el("div","lcol ldir"), i;
  var lista=[];
  for(i=0;i<LIG.length;i++) lista.push(LIG[i]);
  /* o lado direito vai EMBARALHADO: senao a criança liga pela posição
     (linha 1 com linha 1) e não pelo sentido. */
  var sort=[];
  for(i=0;i<LIG.length;i++) sort.push(LIG[i]);
  baguncar(sort);
  for(i=0;i<lista.length;i++) esq.appendChild(fazPonta(lista[i],"e",lista[i].t));
  for(i=0;i<sort.length;i++)  dir.appendChild(fazPonta(sort[i],"d",sort[i].s));
  caixaL.appendChild(esq);
  caixaL.appendChild(dir);
  c.appendChild(caixaL);

  c.appendChild(el("div","hint","Toque de um lado e depois do outro. Também dá para puxar com o dedo ou com o mouse."));
  t.appendChild(c);
  app.appendChild(t);
}

function fazPonta(dado,lado,texto){
  var l=el("div","lig",texto);
  /* os DOIS lados publicam a MESMA chave: é assim que o auditor-jogador
     consegue fechar a fase. A criança não vê diferença nenhuma. */
  l.setAttribute("data-qa",dado.k);
  l._lado=lado;
  l.onclick=function(){
    if(cliqueDeArrasto()) return;            /* este clique e o rabo do arrasto */
    if(souDedo()) return;                    /* o CLIQUE FANTASMA do dedo: ja tratado no touchend */
    toca(l);
  };
  l.onmousedown=function(ev){
    if(souDedo()) return;                    /* mouse FANTASMA do celular: ignora */
    comeca(l,ev.clientX,ev.clientY);
  };
  l.addEventListener("touchstart",function(ev){
    ultimoToque=agora();
    var d=ev.touches[0];
    comeca(l,d.clientX,d.clientY);
  },false);
  return l;
}

/* ⚠️ NUNCA `preventDefault` no touchstart acima — mata o toque no celular.
   Ele mora no touchmove, mais abaixo, e só enquanto há ponta na mão.       */
/* ⚠️ LIÇÃO: aqui NÃO se marca a ponta. Marcar no mousedown fazia o `click`
   que vem logo depois cair em "já estava marcada" e DESMARCAR — com o mouse
   a criança clicava e nada acontecia. A marca é do clique (que serve ao
   mouse, ao dedo e ao toque simples); o arrasto marca só quando anda mesmo. */
function comeca(l,x,y){
  if(temClasse(l,"feita")) return;
  pegou=l; x0=x; y0=y; arrastando=false;
}

function move(x,y){
  if(!pegou||!caixaL) return;
  if(!arrastando){
    if(Math.abs(x-x0)+Math.abs(y-y0)<10) return;
    arrastando=true;
    marca(pegou);
  }
  var b=caixaL.getBoundingClientRect();
  if(linhaViva&&linhaViva.parentNode) linhaViva.parentNode.removeChild(linhaViva);
  var p=ponto(pegou);
  linhaViva=traca(p.x,p.y,x-b.left,y-b.top,"viva");
}

/* ⚠️ DEFEITO PAGO NESTA PEÇA (medido com dedo de verdade, ago/2026): o celular
   dispara mousedown/mouseup e um CLIQUE fantasma logo depois do toque. Como
   tocar duas vezes na mesma ponta DESMARCA (e tem que desmarcar mesmo), o
   clique fantasma apagava a escolha que a criança acabara de fazer — ela
   tocava e nada ficava marcado. Cura: quem veio do DEDO resolve tudo aqui no
   `touchend` (`doDedo`), e o clique que vier atrás é engolido pelo souDedo().
   O mouse de verdade continua entrando pelo `click`, como sempre.          */
function solta(x,y,doDedo){
  if(!pegou) return;
  var l=pegou; pegou=null;
  if(linhaViva&&linhaViva.parentNode) linhaViva.parentNode.removeChild(linhaViva);
  linhaViva=null;
  if(!arrastando){ if(doDedo) toca(l); return; }   /* foi so um toque do dedo */
  arrastando=false; fimArrasto=agora();
  var alvo=document.elementFromPoint(x,y);
  while(alvo&&alvo.nodeType===1&&!temClasse(alvo,"lig")) alvo=alvo.parentNode;
  if(alvo&&temClasse(alvo,"lig")&&alvo!==l) juntar(l,alvo);
}

document.onmousemove=function(ev){ if(souDedo()) return; move(ev.clientX,ev.clientY); };
document.onmouseup=function(ev){ if(souDedo()) return; solta(ev.clientX,ev.clientY,false); };
document.addEventListener("touchmove",function(ev){
  ultimoToque=agora();
  if(!pegou) return;
  var d=ev.touches[0];
  move(d.clientX,d.clientY);
  if(arrastando) ev.preventDefault();        /* so aqui, e so com ponta na mao */
},{passive:false});
document.addEventListener("touchend",function(ev){
  ultimoToque=agora();
  var d=ev.changedTouches[0];
  solta(d.clientX,d.clientY,true);
},false);

/* ---- o TOQUE SIMPLES: escolhe de um lado, escolhe do outro ---- */
function toca(l){
  if(temClasse(l,"feita")) return;
  if(!marcada){ sTap(); marca(l); return; }
  if(marcada===l){ sTap(); desmarca(); return; }
  if(marcada._lado===l._lado){ sTap(); marca(l); return; }   /* mesmo lado: troca */
  juntar(marcada,l);
}

function marca(l){
  desmarca();
  l.className="lig sel";
  marcada=l;
}

function desmarca(){
  var a=app.getElementsByClassName("lig"), i;
  for(i=0;i<a.length;i++) if(!temClasse(a[i],"feita")) a[i].className="lig";
  marcada=null;
}

function juntar(a,b){
  if(!a||!b||a===b) return;
  if(temClasse(a,"feita")||temClasse(b,"feita")) return;
  if(a._lado===b._lado) return;
  if(a.getAttribute("data-qa")===b.getAttribute("data-qa")){
    sCerto();
    a.className="lig feita"; b.className="lig feita";
    marcada=null;
    FEITOS.push([a,b]);
    redesenha();
    if(barraP) barraP.style.width=Math.round(FEITOS.length*100/LIG.length)+"%";
    if(FEITOS.length>=LIG.length){
      var ge=ger;
      setTimeout(function(){
        if(ge!==ger) return;
        mostraBanner("Você ligou cada parte da planta ao trabalho dela!", fimDaPeca);
      },520);
    }
    return;
  }
  /* ERRO: não pune. Som grave curto, as pontas voltam e o andaime CRESCE. */
  sErro();
  a._err=(a._err||0)+1;
  mostraDica(DICAS[Math.min(a._err,DICAS.length)-1]);
  var guardar=a;
  desmarca();
  if(guardar._err>=3) revela(guardar);
}

/* 3º erro: acende a ponta certa do outro lado e DEIXA seguir — é o que
   garante que a peça nunca trava. A dica diz isso em palavras também.    */
function revela(l){
  var a=app.getElementsByClassName("lig"), i, k=l.getAttribute("data-qa");
  for(i=0;i<a.length;i++){
    if(temClasse(a[i],"feita")) continue;
    if(a[i]!==l&&a[i].getAttribute("data-qa")===k) a[i].className="lig l2_pisca";
  }
  l.className="lig sel";
  marcada=l;
}

/* ---- as linhas ---- */
function ponto(l){
  var r=l.getBoundingClientRect(), b=caixaL.getBoundingClientRect();
  var x=(l._lado==="e") ? (r.right-b.left) : (r.left-b.left);
  return {x:x, y:r.top+r.height/2-b.top};
}

function traca(x1,y1,x2,y2,extra){
  var dx=x2-x1, dy=y2-y1, comp=Math.sqrt(dx*dx+dy*dy);
  var ang=Math.atan2(dy,dx)*180/Math.PI;
  var ln=el("div","linha");
  if(extra) ln.className="linha viva";
  ln.style.left=x1+"px"; ln.style.top=y1+"px"; ln.style.width=comp+"px";
  ln.style.webkitTransform="rotate("+ang+"deg)";
  ln.style.transform="rotate("+ang+"deg)";
  camadaL.appendChild(ln);
  return ln;
}

function redesenha(){
  if(!camadaL) return;
  camadaL.innerHTML="";
  linhaViva=null;
  var i,p1,p2;
  for(i=0;i<FEITOS.length;i++){
    p1=ponto(FEITOS[i][0]); p2=ponto(FEITOS[i][1]);
    traca(p1.x,p1.y,p2.x,p2.y,"");
  }
}
/* a tela do PC vira ao contrario e as linhas ficariam tortas: redesenha */
window.onresize=function(){ redesenha(); };

  t.appendChild(c);

}
    if(f && f.dados) LIG = f.dados;
