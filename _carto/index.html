<style>
/* ===== O LIVRO DOS MAPAS — 3º ano (representações cartográficas) =====

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;min-height:100%;}

  min-height:100vh;-webkit-text-size-adjust:100%;
}
#app{max-width:900px;margin:0 auto;min-height:100vh;height:100vh;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 0 30px;position:relative;}

.svgwrap{background:#eaf3f6;border:2px solid #cfe4ea;border-radius:14px;padding:8px;}

.zoomcity{-webkit-animation:zoomc 5s ease-in-out infinite;animation:zoomc 5s ease-in-out infinite;transform-origin:50% 60%;}

@keyframes surge{0%,20%{opacity:0;}40%,100%{opacity:1;}}
.rota{stroke-dasharray:6 6;-webkit-animation:anda 1.2s linear infinite;animation:anda 1.2s linear infinite;}

var _falaAudio=null,_ultimaFala="";
function _chaveVoz(t){var s=(""+t).replace(/\s+/g," ").replace(/^\s+|\s+$/g,"");var h=5381,i;for(i=0;i<s.length;i++){h=((h*33)+s.charCodeAt(i))>>>0;}return h===0?"v0":("v"+h.toString(36));}
function pararFala(){if(_falaAudio){try{_falaAudio.pause();_falaAudio.src="";}catch(e){}_falaAudio=null;}}
var _actx=null;
function somToque(){if(VOZ_MUDA){return;}try{if(!_actx){var AC=window.AudioContext||window.webkitAudioContext;if(!AC){return;}_actx=new AC();}if(_actx.state==="suspended"&&_actx.resume){_actx.resume();}var t=_actx.currentTime,o=_actx.createOscillator(),g=_actx.createGain();o.type="triangle";o.frequency.setValueAtTime(520,t);o.frequency.exponentialRampToValueAtTime(760,t+0.1);g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(0.16,t+0.012);g.gain.exponentialRampToValueAtTime(0.0001,t+0.16);o.connect(g);g.connect(_actx.destination);o.start(t);o.stop(t+0.18);}catch(e){}}
function falar(texto,_f){_ultimaFala=texto;if(VOZ_MUDA&&!_f){return;}pararFala();try{var a=new Audio("audio/"+_chaveVoz(texto)+".mp3");_falaAudio=a;a.play();}catch(e){}}

function selAvatar(b,id){avatarSel=id;var e=document.getElementsByClassName("avbox"),i;for(i=0;i<e.length;i++){e[i].className="avbox opt";}b.className="avbox opt on";somToque();}
function comecar(){
  var nm=($("cNome")&&$("cNome").value||"").replace(/\s+/g," ").replace(/^\s+|\s+$/g,"");
  if(!nm){falar(MSG_NOME,true);if($("cNome"))$("cNome").focus();return;}
  if(!turmaSel){falar(MSG_TURMA,true);return;}
  if(!avatarSel){falar(MSG_AVATAR,true);return;}
  nomeAluno=nm;turmaAluno=turmaSel;avatarAluno=avatarSel;somToque();paginaAtual=0;telaLivro();
}
function crachaHTML(){var av=avatarAluno?'<img src="img/'+avatarAluno+'" alt="" onerror="this.style.display=\'none\'">':'';return '<div class="cracha"><div class="cav">'+av+'</div><span class="cnm">'+esc(nomeAluno||"")+'</span></div>';}

/* ====== LIVRO ====== */
var paginaAtual=0;
function telaLivro(){
  var p=PAGINAS[paginaAtual],h='';
  h+='<div class="ppasso">&#128214; Página '+(paginaAtual+1)+' de '+PAGINAS.length+'</div>';
  h+='<div class="livro"><div class="pagina">';
  h+='<span class="ptag">'+esc(p.tag)+'</span>';
  h+='<div class="ptit">'+esc(p.tit)+'</div>';
  h+='<div class="svgwrap">'+diag(p.d)+'</div>';
  h+='<p class="ptx">'+p.tx+'</p>';
  h+='<div style="text-align:center;margin-top:4px"><button class="ouvirp" onclick="ouvirPagina('+paginaAtual+')">&#128266; Ouvir esta página</button></div>';
  h+='<span class="pnum">'+(paginaAtual+1)+'</span></div></div>';
  h+='<div class="pnav">';
  h+='<button class="navb" onclick="virarPagina(-1)"'+(paginaAtual===0?' disabled':'')+'>&#9664; Voltar</button>';
  if(paginaAtual<PAGINAS.length-1){h+='<button class="navb opt" onclick="virarPagina(1)">Próxima &#9654;</button>';}
  else{h+='<button class="navb opt" style="background:#2e9e57;-webkit-box-shadow:0 4px 0 #22773f;box-shadow:0 4px 0 #22773f" onclick="irJogos()">Aos desafios! &#127942;</button>';}
  h+='</div>';
  $("app").innerHTML=h;$("app").scrollTop=0;
  setBarra((paginaAtual+1)/(PAGINAS.length+3));
  falar(p.fala);
}
function virarPagina(d){var n=paginaAtual+d;if(n<0||n>=PAGINAS.length)return;paginaAtual=n;somToque();telaLivro();}

/* ====== JOGOS: sequência quiz -> caça -> digitar ====== */
function irJogos(){atual=0;respostas=[];var i;for(i=0;i<QUIZ.length;i++){respostas.push(-1);}somToque();telaQuizIntro();}
function telaQuizIntro(){
  var h='<div class="card"><h1>Desafio 1: Quiz</h1>'+crachaHTML().replace('cracha','cracha')+
    '<p class="grande">Vamos ver o que você descobriu sobre os mapas! São 10 perguntas. A Cartô lê cada uma.</p>'+
    '<button class="btn verde" onclick="telaPergunta()">Começar o quiz!</button></div>';
  $("app").innerHTML=h;$("app").scrollTop=0;falar(TXT_QUIZINTRO);
}
function passaporte(){var h='<div id="passa">',i;for(i=0;i<QUIZ.length;i++){var st=(i<atual?"feito":(i===atual?"agora":""));h+='<span class="selo '+st+'">'+(i<atual?"&#10003;":(i+1))+'</span>';}return h+'</div>';}
function telaPergunta(){
  var q=QUIZ[atual],h='';
  h+='<div id="trilha">&#129517; Pergunta '+(atual+1)+' de '+QUIZ.length+'</div>'+passaporte();
  h+='<div class="card qcard">'+crachaHTML();
  h+='<img class="guia" src="'+GUIA+'" alt="Cartô" onerror="this.style.display=\'none\'">';
  h+='<span class="disc">CARTOGRAFIA</span>';
  if(q.img){h+='<div class="qfig">'+diag(q.img)+'</div>';}
  h+='<p class="pergunta">'+esc(q.pergunta)+'</p>';
  h+='<button id="btnOuvir" onclick="repetirUltima()">&#128266; Ouvir a pergunta</button><div class="opcoes">';
  var letras=["A","B","C"],i;
  for(i=0;i<q.opcoes.length;i++){h+='<div class="opc c'+i+' opt" role="button" tabindex="0"'+(i===q.correta?' data-qa="1"':'')+' onclick="responder('+i+')"><span class="let">'+letras[i]+'</span><span class="otx">'+esc(q.opcoes[i])+'</span><button class="ospk" title="Ouvir" onclick="event.stopPropagation();ouvirOpc('+i+')">&#128266;</button></div>';}
  h+='</div></div>';
  $("app").innerHTML=h;$("app").scrollTop=0;falar(falaQuiz(q,atual+1));
}
function responder(idx){somToque();respostas[atual]=idx;pararFala();atual++;if(atual>=QUIZ.length){telaCaca();}else{falar(FRASES_NEXT[atual%FRASES_NEXT.length]);setTimeout(telaPergunta,60);}}

/* ====== CAÇA-PALAVRAS ====== */
function montaCaca(){
  var N=CACA_N,i,j;cacaGrade=[];pos={};cacaAchou={};
  for(i=0;i<N;i++){cacaGrade.push([]);for(j=0;j<N;j++){cacaGrade[i].push("");}}
  for(i=0;i<CACA.length;i++){var w=CACA[i],k;for(k=0;k<w.p.length;k++){var r=w.r+(w.h?0:k),c=w.c+(w.h?k:0);cacaGrade[r][c]=w.p.charAt(k);}pos[w.p]={r:w.r,c:w.c,n:w.p.length,dl:(w.h?0:1),dc:(w.h?1:0)};}
  var L="ABCDEFGHIJLMNOPRSTUV";
  for(i=0;i<N;i++){for(j=0;j<N;j++){if(!cacaGrade[i][j]){cacaGrade[i][j]=L.charAt(Math.floor(Math.random()*L.length));}}}
}
function telaCaca(){
  montaCaca();
  var N=CACA_N,h='';
  h+='<div class="card"><h1>Desafio 2: Caça-palavras</h1>'+crachaHTML();
  h+='<p class="cacatop">Ache as palavras dos mapas! Toque na 1ª e na última letra de cada palavra (elas estão deitadas &#8594; ou em pé &#8595;).</p>';
  h+='<div class="grade" id="grade" data-qa=\''+JSON.stringify(pos)+'\'>';
  var i,j;for(i=0;i<N;i++){for(j=0;j<N;j++){h+='<button class="cel" data-r="'+i+'" data-c="'+j+'" onclick="tocaCel('+i+','+j+')">'+cacaGrade[i][j]+'</button>';}}
  h+='</div><div class="palavras">';
  for(i=0;i<CACA.length;i++){h+='<span class="pchip" id="chip'+i+'" data-qa="'+CACA[i].p+'">'+CACA[i].p+'</span>';}
  h+='</div><p id="cacamsg" class="grande" style="min-height:22px"></p></div>';
  $("app").innerHTML=h;$("app").scrollTop=0;
  falar(TXT_CACAINTRO);
}
var cacaSel=null;
function cel(i,j){var g=$("grade");return g?g.children[i*CACA_N+j]:null;}
function tocaCel(i,j){
  somToque();var c=cel(i,j);if(!c||c.className.indexOf("ok")>=0)return;
  if(!cacaSel){cacaSel={r:i,c:j};c.className="cel sel";return;}
  var r1=cacaSel.r,c1=cacaSel.c;var el1=cel(r1,c1);
  // segunda ponta: confere se forma uma palavra da lista
  var achou=-1,pi;
  for(pi=0;pi<CACA.length;pi++){var w=CACA[pi];var er=w.r+(w.h?0:w.p.length-1),ec=w.c+(w.h?w.p.length-1:0);
    if((r1===w.r&&c1===w.c&&i===er&&j===ec)||(r1===er&&c1===ec&&i===w.r&&j===w.c)){achou=pi;break;}}
  if(achou>=0&&!cacaAchou[achou]){
    var w=CACA[achou],k;cacaAchou[achou]=1;
    for(k=0;k<w.p.length;k++){var rr=w.r+(w.h?0:k),cc=w.c+(w.h?k:0);var cc2=cel(rr,cc);if(cc2){cc2.className="cel ok";}}
    var chip=$("chip"+achou);if(chip){chip.className="pchip achou feito";}
    if(el1)el1.className="cel ok";cacaSel=null;
    falar(falaAchou(w.p),true);
    var n=0;for(k=0;k<CACA.length;k++){if(cacaAchou[k])n++;}
    $("cacamsg").innerHTML="Você achou "+n+" de "+CACA.length+"!";
    if(n>=CACA.length){setTimeout(telaDigitarIntro,900);}
  }else{
    if(el1)el1.className="cel";cacaSel=null;
    $("cacamsg").innerHTML="Tente de novo: a 1ª e a última letra da mesma palavra.";
  }
}

/* ====== DIGITAR ====== */
function telaDigitarIntro(){
  var h='<div class="card"><h1>Desafio 3: Digitar</h1>'+crachaHTML()+
    '<p class="grande">Agora escreva as palavras! Você pode tocar no teclado da tela OU usar o teclado de verdade.</p>'+
    '<button class="btn verde" onclick="startDigitar()">Vamos digitar!</button></div>';
  $("app").innerHTML=h;$("app").scrollTop=0;falar(TXT_DIGINTRO);
}
function startDigitar(){digAtual=0;somToque();telaDigitar();}
function telaDigitar(){
  var q=DIGITAR[digAtual];digTexto="";
  var h='<div id="trilha">&#9997;&#65039; Palavra '+(digAtual+1)+' de '+DIGITAR.length+'</div>';
  h+='<div class="card qcard">'+crachaHTML();
  h+='<img class="guia" src="'+GUIA+'" alt="Cartô" onerror="this.style.display=\'none\'">';
  h+='<div class="svgwrap" style="max-width:280px;margin:2px auto">'+diag(q.d)+'</div>';
  h+='<p class="digpergunta">'+esc(q.pergunta)+'</p>';
  h+='<input class="digin" id="digin" data-qa="'+q.resp+'" autocomplete="off" oninput="digInput()">';
  h+='<div class="digcampo" id="digcampo" onclick="focoDig()">&nbsp;</div>';
  h+='<div class="tecl">';
  var L="ABCDEFGHIJKLMNOPQRSTUVWXYZ",i;
  for(i=0;i<L.length;i++){h+='<button class="tec" onclick="teclaDig(\''+L.charAt(i)+'\')">'+L.charAt(i)+'</button>';}
  h+='<button class="tec apaga" onclick="apagaDig()">&#9003;</button>';
  h+='<button class="tec ok" onclick="confereDig()">OK</button>';
  h+='</div><p id="digmsg" class="grande" style="min-height:22px"></p></div>';
  $("app").innerHTML=h;$("app").scrollTop=0;
  falar(falaDigitar(q,digAtual+1));
  attDigCampo();
}
function focoDig(){var e=$("digin");if(e){try{e.focus();}catch(x){}}}
function attDigCampo(){var c=$("digcampo");if(c){c.innerHTML=digTexto?esc(digTexto):"&nbsp;";}}
function teclaDig(ch){if(digTexto.length>=12)return;digTexto+=ch;somToque();syncDigin();attDigCampo();checaAuto();}
function apagaDig(){digTexto=digTexto.slice(0,-1);syncDigin();attDigCampo();}
function syncDigin(){var e=$("digin");if(e)e.value=digTexto;}
function digInput(){ // veio do teclado de verdade (ou do auditor via data-qa)
  var e=$("digin");if(!e)return;digTexto=(e.value||"").toUpperCase().replace(/[^A-Z]/g,"").slice(0,12);e.value=digTexto;attDigCampo();checaAuto();
}
function checaAuto(){ if(DIGITAR[digAtual]&&digTexto===DIGITAR[digAtual].resp){confereDig();} }
function confereDig(){
  var q=DIGITAR[digAtual];if(!q)return;somToque();
  if(digTexto===q.resp){
    falar(falaDigOK(q.resp),true);
    digAtual++;
    if(digAtual>=DIGITAR.length){telaFinal();}
    else{telaDigitar();}
  }else{
    $("digmsg").innerHTML=TXT_QUASEDIG;falar(TXT_QUASEDIG,true);
  }
}
/* teclado de verdade */
document.addEventListener("keydown",function(ev){
  if(!$("digin"))return;
  if(ev.key==="Enter"){confereDig();return;}
  if(ev.key==="Backspace"){apagaDig();ev.preventDefault();return;}
  var k=(ev.key||"");if(k.length===1&&/[a-zA-Z]/.test(k)){teclaDig(k.toUpperCase());ev.preventDefault();}
},false);

/* ====== FINAL ====== */
function calcularAcertos(){var a=0,i;for(i=0;i<QUIZ.length;i++){if(respostas[i]===QUIZ[i].correta)a++;}return a;}
function medalhaHTML(){return '<div class="medalha medal"><span class="fita e"></span><span class="fita d"></span><div class="disco"><span class="estrela"></span>'+(avatarAluno?'<img class="mav" src="img/'+avatarAluno+'" alt="" onerror="this.style.display=\'none\'">':'')+'</div></div>';}
function telaFinal(){
  var ac=calcularAcertos();confete();
  var h='<div class="card"><h1>Livro fechado com chave de ouro!</h1>'+medalhaHTML()+
    '<h2>'+esc(nomeAluno)+', você é um(a) cartógrafo(a)!</h2>'+
    '<p class="grande">Você leu O Livro dos Mapas e venceu os três desafios. Parabéns!</p>'+
    '<p id="statusenvio"></p></div>';
  $("app").innerHTML=h;$("app").scrollTop=0;setBarra(1);
  falar(TXT_FINAL);enviarResultado(ac);
}
function enviarResultado(ac){
  if(enviado)return;enviado=true;
  var letras="",i;for(i=0;i<QUIZ.length;i++){letras+=(respostas[i]<0?"-":(respostas[i]===QUIZ[i].correta?"C":"E"));}
  var quando=new Date().toLocaleString("pt-BR");
  var nota10=QUIZ.length?Math.round(ac/QUIZ.length*100)/10:0;
  var reg={nome:nomeAluno,turma:turmaAluno,nota:nota10,acertos:ac+"/"+QUIZ.length,respostas:letras,data:quando};
  try{var chave=(nomeAluno+"_"+turmaAluno+"_"+Date.now()).replace(/[^A-Za-z0-9_]/g,"_");var x=new XMLHttpRequest();x.open("PUT",FIREBASE_DB+"/provas/"+SLUG+"/"+chave+".json",true);x.setRequestHeader("Content-Type","application/json");x.send(JSON.stringify(reg));}catch(e){}
}
function confete(){try{var c=document.createElement("canvas");c.style.position="fixed";c.style.left=0;c.style.top=0;c.style.pointerEvents="none";c.style.zIndex=9998;c.width=window.innerWidth;c.height=window.innerHeight;document.body.appendChild(c);var x=c.getContext("2d"),ps=[],i,cores=["#e07a3f","#2e9e57","#1f7a86","#3a7bd5","#f2c14e"];for(i=0;i<90;i++){ps.push({x:Math.random()*c.width,y:-20-Math.random()*c.height,r:6+Math.random()*6,vy:2+Math.random()*3,co:cores[i%cores.length],vx:-1.5+Math.random()*3});}var t=0,tot=150;function loop(){x.clearRect(0,0,c.width,c.height);var k;for(k=0;k<ps.length;k++){var p=ps[k];p.y+=p.vy;p.x+=p.vx;x.fillStyle=p.co;x.fillRect(p.x,p.y,p.r,p.r);}t++;if(t<tot){requestAnimationFrame(loop);}else{if(c.parentNode)c.parentNode.removeChild(c);}}loop();}catch(e){}}
function setBarra(f){var b=$("topbar");if(b){f=Math.max(0,Math.min(1,f));b.style.width=(f*100)+"%";}}

/* ====== boot ====== */
function boot(){attMudo();telaCapa();}
document.addEventListener("click",function(){if(_histTocada)return;if(!document.getElementById("cNome"))return;_histTocada=true;falar(HISTORIA,true);},false);
boot();
</script>
