var PRONUNCIA = [[/[Tt]angram/g, "tângram"]];
function paraVoz(t){
  var s = "" + t, i;
  for(i = 0; i < PRONUNCIA.length; i++){ s = s.replace(PRONUNCIA[i][0], PRONUNCIA[i][1]); }
  return s;
}

function somToque(){
  if(VOZ_MUDA){return;}
  try{
    if(!_actx){var AC=window.AudioContext||window.webkitAudioContext;if(!AC){return;}_actx=new AC();}
    if(_actx.state==="suspended"&&_actx.resume){_actx.resume();}
    var t=_actx.currentTime,o=_actx.createOscillator(),g=_actx.createGain();
    o.type="triangle";o.frequency.setValueAtTime(520,t);o.frequency.exponentialRampToValueAtTime(760,t+0.10);
    g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(0.16,t+0.012);g.gain.exponentialRampToValueAtTime(0.0001,t+0.16);
    o.connect(g);g.connect(_actx.destination);o.start(t);o.stop(t+0.18);
  }catch(e){}
}

  }
  if(parteAtual<PARTES.length-1){
    h+='<button type="button" class="btn" onclick="partePara('+(parteAtual+1)+')">Li! Agora '+esc(PARTES[parteAtual+1].titulo.toLowerCase())+'</button>';
  }else{
    h+='<button type="button" class="btn" onclick="comecarProva()">Li os dois textos: começar a prova!</button>';
  }
  h+='</div></div>';
  $("app").innerHTML=h;
  $("app").scrollTop=0;
  falar(P.abre);
}
function partePara(n){ if(n<0||n>=PARTES.length){return;} somToque(); pararSeq(); parteAtual=n; telaEstudo(); }
function comecarProva(){ somToque(); pararSeq(); atual=0; telaPergunta(); }

/* ====== "OUVIR O TEXTO TODO": as falas, uma atrás da outra ==================
   ⚠️ NÃO é um mp3 gigante do texto inteiro, e isso é decisão. Aqui a leitura
      corrida REUSA os mesmos arquivos das frases soltas — então o botão não
      custou gravação nenhuma, e uma frase corrigida amanhã corrige os dois
      caminhos de uma vez. Se fosse um arquivo só, seriam duas verdades.
   ⚠️ E ele PARA: quem começa a ouvir dois minutos de texto tem de poder
      interromper, senão a voz continua por cima da tela seguinte. */
var _seq=null;
function pararSeq(){ _seq=null; pararFala(); var b=$("btnOuvir"); if(b){ b.textContent="Ouvir o texto todo"; } }
function lerTextoTodo(){
  if(_seq){ pararSeq(); somToque(); return; }
  var P=PARTES[parteAtual], lista=[], i, k;
  for(i=P.de;i<=P.ate;i++){
    lista.push(ESTUDO[i].titulo+".");
    for(k=0;k<ESTUDO[i].linhas.length;k++){ lista.push(semTag(ESTUDO[i].linhas[k])); }
  }
  var meu={}; _seq=meu; somToque();
  var b=$("btnOuvir"); if(b){ b.textContent="Parar a leitura"; }
  var n=0;
  function proxima(){
    if(_seq!==meu){ return; }                  /* alguém parou ou trocou de tela */
    if(n>=lista.length){ pararSeq(); return; }
    var t=lista[n++];
    _ultimaFala=t;
    try{
      var a=new Audio("audio/"+_chaveVoz(paraVoz(t))+".mp3");
      _falaAudio=a;
      a.onended=proxima;
      /* ⚠️ `onerror` TEM de chamar a próxima: se um mp3 faltar, sem isto a
         leitura morre no meio e ninguém fica sabendo — o silêncio outra vez. */
      a.onerror=proxima;
      a.play();
    }catch(e){ proxima(); }
  }
  proxima();
}
function crachaHTML(){
  return '<div class="cracha"><div class="cav"><img src="img/'+avatarAluno+'" alt="" onerror="this.style.display=\'none\'"></div>'+
    '<span class="cnm">'+esc(nomeAluno)+'</span></div>';
}
function passaporte(){
  var h='<div id="passa">',i;
  for(i=0;i<QUESTOES.length;i++){
    var st=(i<atual?"feito":(i===atual?"agora":""));
    h+='<span class="selo '+st+'"></span>';
  }
  return h+'</div>';
}
function telaPergunta(){
  var q=QUESTOES[atual],h='';
  h+='<div id="trilha">Pergunta '+(atual+1)+' de '+QUESTOES.length+'</div>';
  h+=passaporte();
  h+='<div class="card qcard">';
  h+=crachaHTML();
  h+='<img class="guia" src="img/ej_leo.png" alt="Léo, o leão treinador" onerror="this.style.display=\'none\'">';
  h+='<span class="disc '+q.disc+'">'+(DISCNOME[q.disc]||"")+'</span>';
  if(q.fig&&FIG[q.fig]){h+='<div class="qfig">'+FIG[q.fig]()+'</div>';}
  h+='<p class="pergunta">'+esc(q.pergunta)+'</p>';
  h+='<button id="btnOuvir" onclick="repetirUltima()">Ouvir a pergunta de novo</button>';
  /* ⭐ O ANDAIME: "não lembro, quero ver a ficha". Ordem do Marcos (22/set/2026):
     *"faça a prova de um jeito que não fique difícil para os estudantes tirarem
     uma nota boa, pois são estudantes do 3, 4 e 5 anos"*. Ver o comentário
     grande do `verFicha()` — inclusive o que ISTO CUSTA ao professor. */
  if(typeof q.ficha==="number"&&ESTUDO[q.ficha]){
    h+='<div><button type="button" class="bsec" id="btnFicha" onclick="verFicha()">Não lembro — ver no texto</button></div>';
    h+='<div id="cxficha" style="display:none"></div>';
  }
  h+='<div class="opcoes">';
  var letras=["A","B","C","D"],i;
  for(i=0;i<q.opcoes.length;i++){
    h+='<div class="opc c'+i+'" role="button" tabindex="0" onclick="responder('+i+')" data-qa="o'+i+'">'+
       '<span class="let">'+letras[i]+'</span>'+
       '<span class="otx">'+esc(q.opcoes[i])+'</span>'+
       '<button class="ospk" aria-label="Ouvir esta resposta" onclick="event.stopPropagation();ouvirOpc('+i+')">'+svgFala()+'</button>'+
       '</div>';
  }
  h+='</div></div>';
  $("app").innerHTML=h;
  $("app").scrollTop=0;
  falar(falaDaQuestao(atual));
}
/* ====== "NÃO LEMBRO — VER A FICHA": o andaime da prova ======================
   ⭐ POR QUE ELE EXISTE. Ordem do Marcos (22/set/2026): *"faça a prova de um
      jeito que não fique difícil para os estudantes tirarem uma nota boa, pois
      são estudantes do 3, 4 e 5 anos"*.

   ⭐ POR QUE ESTE E NÃO OUTRO CAMINHO. Havia três jeitos de baixar a
      dificuldade, e dois eram ruins:
        · tirar as regras difíceis (o "não se acumula +2", os dois lados do
          desafio do +4) — seria apagar justamente o que o professor ensinou;
        · deixar as alternativas erradas obviamente bobas — a criança acerta
          sem saber nada, e o painel do professor passa a mentir.
      O terceiro é este: **a resposta continua exigindo saber, mas a criança tem
      onde ir buscar** — a mesma ficha que ela leu e ouviu minutos antes. É o
      andaime da casa (dica → apoio concreto → revelar) e é o que Bjork chama de
      dificuldade DESEJÁVEL: ela ainda tem de ler a ficha e escolher.

   ⚠️ E ISTO TEM UM PREÇO, QUE FICA DITO: com a ficha à mão, a nota mede
      "sabe procurar e entender" e já não mede "decorou". Por isso a prova
      GRAVA quantas vezes cada criança abriu a ficha (campo `dicas`), para o
      professor ler a nota sabendo disso. Uma prova que parece medir uma coisa
      e mede outra seria pior do que uma prova difícil. */
var dicasUsadas=0;
function verFicha(){
  var q=QUESTOES[atual], f=ESTUDO[q.ficha], cx=$("cxficha"), h='', k;
  if(!cx||!f){return;}
  if(cx.style.display!=="none"){ cx.style.display="none"; pararFala(); somToque(); return; }
  dicasUsadas++;
  h+='<p class="etit" style="margin-top:10px">'+esc(f.titulo)+'</p>';
  if(f.figs&&f.figs.length){
    h+='<div class="efigs">';
    for(k=0;k<f.figs.length;k++){ if(FIG[f.figs[k]]){ h+='<div class="qfig">'+FIG[f.figs[k]]()+'</div>'; } }
    h+='</div>';
  }
  for(k=0;k<f.linhas.length;k++){
    h+='<div class="elin"><span class="etx">'+f.linhas[k]+'</span>'+
       '<button class="ospk" aria-label="Ouvir esta frase" onclick="ouvirLinhaFicha('+q.ficha+','+k+')">'+svgFala()+'</button></div>';
  }
  cx.innerHTML=h; cx.style.display="block"; somToque();
  falar(falaDaFicha(q.ficha),true);
}
function ouvirLinhaFicha(fi,k){ pararFala(); falar(semTag(ESTUDO[fi].linhas[k]),true); }
function responder(idx){
  somToque();respostas[atual]=idx;pararFala();atual++;
  if(atual>=QUESTOES.length){telaFinal();}
  else{
    var frases=["Próxima pergunta!","Vamos continuar!","Muito bem, siga em frente!","Continue!"];
    falar(frases[atual%frases.length]);setTimeout(telaPergunta,60);
  }
}
function calcularAcertos(){var a=0,i;for(i=0;i<QUESTOES.length;i++){if(respostas[i]===QUESTOES[i].correta){a++;}}return a;}

function medalhaHTML(){
  return '<div class="medalha"><span class="fita e"></span><span class="fita d"></span>'+
    '<div class="disco"><span class="estrela"></span>'+
    (avatarAluno?'<img class="mav" src="img/'+avatarAluno+'" alt="" onerror="this.style.display=\'none\'">':'')+
    '</div></div>';
}
function telaFinal(){
  var ac=calcularAcertos();confete();
  var h='';
  h+='<div class="card">';
  h+='<h1>Prontinho!</h1>';
  h+=medalhaHTML();
  h+='<h2>'+esc(nomeAluno)+', você terminou a prova!</h2>';
  h+='<p class="grande">O Léo adorou jogar com você. Parabéns!</p>';
  h+='<p id="statusenvio"></p></div>';
  $("app").innerHTML=h;
  $("app").scrollTop=0;
  falar("Prontinho! Você terminou a prova. O Léo adorou jogar com você. Parabéns!");
  enviarResultado(ac);
}

/* ====== ENVIO (Firebase), SEM mostrar nota ao aluno ====== */
function enviarResultado(ac){
  if(enviado){return;}enviado=true;
  var letras="",i;for(i=0;i<QUESTOES.length;i++){letras+=(respostas[i]<0?"-":String(respostas[i]));}
  var quando=new Date().toLocaleString("pt-BR");
  var nota10=QUESTOES.length?Math.round(ac/QUESTOES.length*100)/10:0;
  /* ⚠️ `dicas` é campo NOVO (22/set/2026): quantas vezes a criança abriu a ficha
     durante a prova. O painel do professor lê chaves pelo nome, então acrescentar
     uma não quebra nada — e sem ela a nota não conta a história inteira. */
  var reg={nome:nomeAluno,turma:turmaAluno,nota:nota10,acertos:ac+"/"+QUESTOES.length,respostas:letras,dicas:dicasUsadas,data:quando};
  try{
    var chave=(nomeAluno+"_"+turmaAluno+"_"+Date.now()).replace(/[^A-Za-z0-9_]/g,"_");
    var x=new XMLHttpRequest();
    x.open("PUT",FIREBASE_DB+"/provas/"+SLUG+"/"+chave+".json",true);
    x.setRequestHeader("Content-Type","application/json");
    x.send(JSON.stringify(reg));
  }catch(e){}
  if(URL_PLANILHA){try{
    var dados="nome="+encodeURIComponent(nomeAluno)+"&turma="+encodeURIComponent(turmaAluno)+"&nota="+encodeURIComponent(nota10)+"&acertos="+encodeURIComponent(ac+"/"+QUESTOES.length)+"&respostas="+encodeURIComponent(letras)+"&data="+encodeURIComponent(quando);
    var y=new XMLHttpRequest();y.open("POST",URL_PLANILHA,true);y.setRequestHeader("Content-Type","application/x-www-form-urlencoded");y.send(dados);
  }catch(e){}}
}

/* ====== confete leve ====== */
function confete(){try{
  var c=document.createElement("canvas");c.style.position="fixed";c.style.left=0;c.style.top=0;c.style.pointerEvents="none";c.style.zIndex=9998;
  c.width=window.innerWidth;c.height=window.innerHeight;document.body.appendChild(c);
  var x=c.getContext("2d"),ps=[],i,cores=["#E5202E","#0099DD","#F7B500","#3EA72D","#fffdf6"];
  for(i=0;i<80;i++){ps.push({x:Math.random()*c.width,y:-20-Math.random()*c.height,r:6+Math.random()*6,vy:2+Math.random()*3,co:cores[i%cores.length],vx:-1.5+Math.random()*3});}
  var t=0,tot=140;function loop(){x.clearRect(0,0,c.width,c.height);var k;for(k=0;k<ps.length;k++){var p=ps[k];p.y+=p.vy;p.x+=p.vx;x.fillStyle=p.co;x.fillRect(p.x,p.y,p.r,p.r);}t++;if(t<tot){requestAnimationFrame(loop);}else{if(c.parentNode){c.parentNode.removeChild(c);}}}loop();
}catch(e){}}

/* ====== boot ====== */
function boot(){attMudo();telaCapa();}
document.addEventListener("click",function(){
  if(_histTocada){return;}
  if(!document.getElementById("cNome")){return;}
  _histTocada=true;falar(HISTORIA,true);
},false);
boot();
