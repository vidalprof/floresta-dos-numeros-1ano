<script>

var AVATARES=[
 {id:"ej_cr1.png", cor:"#3EA72D"},{id:"ej_cr2.png", cor:"#0099DD"},

];
var SLUG="educacao-fisica-jogos-345";   /* caminho no Firebase: /provas/<SLUG> */

var URL_PLANILHA="";
var HISTORIA="Olá! Eu sou o Léo, o treinador. Hoje a nossa aula de Educação Física é na mesa de jogos! São vinte perguntas: quinze sobre as regras oficiais do UNO, aquelas que o professor explicou para a turma, e cinco sobre a origem do Tangram, o jogo das sete peças. Eu leio cada pergunta e cada resposta em voz alta, e você toca na que achar certa. Se quiser ouvir uma resposta de novo, toque no alto-falante do lado dela. Agora escreva o seu nome, escolha o seu ano, a sua turma e o seu personagem, e toque em começar!";

/* ===================================================================
   AS FIGURAS — SVG desenhado aqui, com as cores do nosso jogo `_uno345`
   =================================================================== */
var UCOR={v:"#E5202E", a:"#0099DD", m:"#F7B500", g:"#3EA72D", p:"#1b1b1b"};

function simbPular(c){
  return '<circle cx="50" cy="50" r="30" fill="none" stroke="'+c+'" stroke-width="11"/>'+
         '<line x1="29" y1="29" x2="71" y2="71" stroke="'+c+'" stroke-width="11" stroke-linecap="round"/>';
}
function simbInverte(c){
  return '<g stroke="'+c+'" stroke-width="9" fill="none" stroke-linecap="round"><path d="M32 38 A22 22 0 0 1 72 49"/><path d="M68 62 A22 22 0 0 1 28 51"/></g>'+
         '<polygon points="23,33 41,33 30,49" fill="'+c+'"/><polygon points="77,67 59,67 70,51" fill="'+c+'"/>';
}
function simbMais2(c){
  return '<rect x="22" y="26" width="30" height="44" rx="6" fill="#fff" stroke="'+c+'" stroke-width="5"/>'+
         '<rect x="40" y="34" width="30" height="44" rx="6" fill="'+c+'" stroke="#fff" stroke-width="4"/>'+
         '<text x="55" y="64" font-family="Trebuchet MS,sans-serif" font-size="22" font-weight="bold" fill="#fff" text-anchor="middle">+2</text>';
}
function simbCoringa(){
  return '<circle cx="50" cy="50" r="33" fill="#fff"/>'+
         '<path d="M50 50 L50 17 A33 33 0 0 1 83 50 Z" fill="'+UCOR.v+'"/>'+
         '<path d="M50 50 L83 50 A33 33 0 0 1 50 83 Z" fill="'+UCOR.a+'"/>'+
         '<path d="M50 50 L50 83 A33 33 0 0 1 17 50 Z" fill="'+UCOR.m+'"/>'+
         '<path d="M50 50 L17 50 A33 33 0 0 1 50 17 Z" fill="'+UCOR.g+'"/>'+
         '<circle cx="50" cy="50" r="8" fill="#fff"/>';
}
function simbMais4(){
  /* ⚠️ SEM o "+4" escrito aqui dentro: ele já está nos dois cantos da carta, e
     no meio ficava meio para fora do oval branco — parecia defeito de desenho.
     Visto em tamanho grande; na miniatura não dava para notar. */
  return '<g stroke="#fff" stroke-width="3">'+
         '<rect x="28" y="28" width="21" height="28" rx="4" fill="'+UCOR.v+'"/>'+
         '<rect x="51" y="28" width="21" height="28" rx="4" fill="'+UCOR.a+'"/>'+
         '<rect x="28" y="58" width="21" height="28" rx="4" fill="'+UCOR.m+'"/>'+
         '<rect x="51" y="58" width="21" height="28" rx="4" fill="'+UCOR.g+'"/></g>';
}
/* uma carta de UNO: o oval branco inclinado, o símbolo grande e os dois cantos.
   `tipo`: num | pula | inverte | mais2 | coringa | mais4 */
function carta(tipo, cor, valor, x, y, esc, gira){
  var c=UCOR[cor]||UCOR.v, w=66, h=96, miolo=c, dentro="", canto="";
  if(tipo==="mais4"||tipo==="coringa"){ miolo=UCOR.p; }
  if(tipo==="num"){ dentro='<text x="50" y="68" font-family="Trebuchet MS,sans-serif" font-size="60" font-weight="bold" fill="'+c+'" text-anchor="middle">'+valor+'</text>'; canto=valor; }
  else if(tipo==="pula"){ dentro=simbPular(c); canto=""; }
  else if(tipo==="inverte"){ dentro=simbInverte(c); canto=""; }
  else if(tipo==="mais2"){ dentro=simbMais2(c); canto="+2"; }
  else if(tipo==="mais4"){ dentro=simbMais4(); canto="+4"; }
  else { dentro=simbCoringa(); canto=""; }
  var s=esc||1, tr='translate('+x+','+y+') scale('+s+')'+(gira?' rotate('+gira+',33,48)':'');
  return '<g transform="'+tr+'">'+
    '<rect x="0" y="0" width="'+w+'" height="'+h+'" rx="9" fill="#fff" stroke="rgba(0,0,0,.25)" stroke-width="1.5"/>'+
    '<rect x="5" y="5" width="'+(w-10)+'" height="'+(h-10)+'" rx="7" fill="'+miolo+'"/>'+
    '<ellipse cx="33" cy="48" rx="34" ry="19" fill="#fff" transform="rotate(-32,33,48)"/>'+
    '<g transform="translate(8,23) scale(0.5)">'+dentro+'</g>'+
    (canto?'<text x="11" y="19" font-family="Trebuchet MS,sans-serif" font-size="15" font-weight="bold" fill="#fff">'+canto+'</text>'+
           '<text x="55" y="88" font-family="Trebuchet MS,sans-serif" font-size="15" font-weight="bold" fill="#fff" text-anchor="middle" transform="rotate(180,55,83)">'+canto+'</text>':'')+
    '</g>';
}
function svgBox(vb, corpo){ return '<svg viewBox="'+vb+'" role="img" aria-hidden="true">'+corpo+'</svg>'; }
/* verso de carta (para a mão e o monte) */
function verso(x,y,esc,gira){
  var s=esc||1, tr='translate('+x+','+y+') scale('+s+')'+(gira?' rotate('+gira+',33,48)':'');
  return '<g transform="'+tr+'">'+

    contrário. A conta que decide é a ÁREA: num quadrado de lado 100 a unidade
    do tangram vale 625, e as sete peças dão 4 + 4 + 1 + 2 + 1 + 2 + 2 = 16.
    Conferido também por amostragem: as sete cobrem o quadrado sem UM buraco e

function repetirUltima(){if(_ultimaFala){pararFala();falar(_ultimaFala,true);}}
function alternarMudo(){VOZ_MUDA=!VOZ_MUDA;try{localStorage.setItem("efjogos_mudo",VOZ_MUDA?"1":"0");}catch(e){}if(VOZ_MUDA){pararFala();}attMudo();}
function attMudo(){var b=$("btnMudo");if(b){b.innerHTML=VOZ_MUDA?svgMudo():svgFala("#ffe9b8");b.title=VOZ_MUDA?"Voz desligada":"Voz ligada";}}

/* ====== TELAS ====== */
function telaCapa(){
  var h='';
  h+='<div class="card">';
  h+='<img class="masc-capa" src="img/ej_leo.png" alt="Léo, o leão treinador" onerror="this.style.display=\'none\'">';
  h+='<h1>A Mesa de Jogos do Léo</h1>';
  h+='<h2>Educação Física &middot; 3º, 4º e 5º anos</h2>';
  h+='<p class="grande">As regras do UNO e a história do Tangram. Eu leio cada pergunta e cada resposta em voz alta — é só ouvir e tocar na certa.</p>';
  h+='<button id="btnHist" onclick="ouvirHistoria()">Ouvir o Léo</button>';
  h+='<div class="formrow">';
  h+='<div class="fcol">';
  h+='<label for="cNome">Qual é o seu nome?</label>';
  h+='<input id="cNome" maxlength="26" placeholder="Escreva o seu nome">';
  h+='<label>Qual é o seu ano?</label><div class="turmas">';
  var i;for(i=0;i<ANOS.length;i++){h+='<button type="button" class="tbox tano" onclick="selAno(this,\''+ANOS[i]+'\')">'+ANOS[i]+'</button>';}
  h+='</div>';
  h+='<label>E a sua turma?</label><div class="turmas">';
  for(i=0;i<LETRAS.length;i++){h+='<button type="button" class="tbox tlet" onclick="selLetra(this,\''+LETRAS[i]+'\')">'+LETRAS[i]+'</button>';}
  h+='</div></div>';
  h+='<div class="fcol">';
  h+='<label>Escolha o seu personagem!</label><div class="avs">';
  for(i=0;i<AVATARES.length;i++){var a=AVATARES[i];
    h+='<button type="button" class="avbox" style="background:'+a.cor+'" onclick="selAvatar(this,\''+a.id+'\')">'+
       '<img src="img/'+a.id+'" alt="Personagem '+(i+1)+'" onerror="this.style.display=\'none\'"></button>';}
  h+='</div></div>';
  h+='</div>';
  h+='<div><button class="btn" onclick="comecar()">Começar!</button></div>';
  h+='</div>';
  $("app").innerHTML=h;
}
function ouvirHistoria(){ _histTocada=true; falar(HISTORIA,true); }
function selAno(b,t){anoSel=t;var els=document.getElementsByClassName("tano"),i;for(i=0;i<els.length;i++){els[i].className="tbox tano";}b.className="tbox tano on";somToque();}
function selLetra(b,t){letraSel=t;var els=document.getElementsByClassName("tlet"),i;for(i=0;i<els.length;i++){els[i].className="tbox tlet";}b.className="tbox tlet on";somToque();}
function selAvatar(b,id){avatarSel=id;var els=document.getElementsByClassName("avbox"),i;for(i=0;i<els.length;i++){els[i].className="avbox";}b.className="avbox on";somToque();}
function comecar(){
  var nm=($("cNome")&&$("cNome").value||"").replace(/\s+/g," ").replace(/^\s+|\s+$/g,"");
  if(!nm){falar("Escreva o seu nome para começar.",true);if($("cNome"))$("cNome").focus();return;}
  if(!anoSel){falar("Escolha o seu ano.",true);return;}
  if(!letraSel){falar("Escolha a sua turma.",true);return;}
  if(!avatarSel){falar("Escolha o seu personagem.",true);return;}
  nomeAluno=nm;turmaAluno=anoSel+" "+letraSel;avatarAluno=avatarSel;atual=0;somToque();telaPergunta();
}
function crachaHTML(){
  return '<div class="cracha"><div class="cav"><img src="img/'+avatarAluno+'" alt="" onerror="this.style.display=\'none\'"></div>'+
    '<span class="cnm">'+esc(nomeAluno)+'</span></div>';
}
function passaporte(){
  var h='<div id="passa">',i;
  for(i=0;i<QUESTOES.length;i++){
    var st=(i<atual?"feito":(i===atual?"agora":""));
    h+='<span class="selo '+st+'"></span>';
  }
  return h+'</div>';
}
function telaPergunta(){
  var q=QUESTOES[atual],h='';
  h+='<div id="trilha">Pergunta '+(atual+1)+' de '+QUESTOES.length+'</div>';
  h+=passaporte();
  h+='<div class="card qcard">';
  h+=crachaHTML();
  h+='<img class="guia" src="img/ej_leo.png" alt="Léo, o leão treinador" onerror="this.style.display=\'none\'">';
  h+='<span class="disc '+q.disc+'">'+(DISCNOME[q.disc]||"")+'</span>';
  if(q.fig&&FIG[q.fig]){h+='<div class="qfig">'+FIG[q.fig]()+'</div>';}
  h+='<p class="pergunta">'+esc(q.pergunta)+'</p>';
  h+='<button id="btnOuvir" onclick="repetirUltima()">Ouvir a pergunta de novo</button>';
  h+='<div class="opcoes">';
  var letras=["A","B","C","D"],i;
  for(i=0;i<q.opcoes.length;i++){
    h+='<div class="opc c'+i+'" role="button" tabindex="0" onclick="responder('+i+')" data-qa="o'+i+'">'+
       '<span class="let">'+letras[i]+'</span>'+
       '<span class="otx">'+esc(q.opcoes[i])+'</span>'+
       '<button class="ospk" aria-label="Ouvir esta resposta" onclick="event.stopPropagation();ouvirOpc('+i+')">'+svgFala()+'</button>'+
       '</div>';
  }
  h+='</div></div>';
  $("app").innerHTML=h;
  $("app").scrollTop=0;
  falar(falaDaQuestao(atual));
}
function responder(idx){
  somToque();respostas[atual]=idx;pararFala();atual++;
  if(atual>=QUESTOES.length){telaFinal();}
  else{
    var frases=["Próxima pergunta!","Vamos continuar!","Muito bem, siga em frente!","Continue!"];
    falar(frases[atual%frases.length]);setTimeout(telaPergunta,60);
  }
}
function calcularAcertos(){var a=0,i;for(i=0;i<QUESTOES.length;i++){if(respostas[i]===QUESTOES[i].correta){a++;}}return a;}

function medalhaHTML(){
  return '<div class="medalha"><span class="fita e"></span><span class="fita d"></span>'+
    '<div class="disco"><span class="estrela"></span>'+
    (avatarAluno?'<img class="mav" src="img/'+avatarAluno+'" alt="" onerror="this.style.display=\'none\'">':'')+
    '</div></div>';
}
function telaFinal(){
  var ac=calcularAcertos();confete();
  var h='';
  h+='<div class="card">';
  h+='<h1>Prontinho!</h1>';
  h+=medalhaHTML();
  h+='<h2>'+esc(nomeAluno)+', você terminou a prova!</h2>';
  h+='<p class="grande">O Léo adorou jogar com você. Parabéns!</p>';
  h+='<p id="statusenvio"></p></div>';
  $("app").innerHTML=h;
  $("app").scrollTop=0;
  falar("Prontinho! Você terminou a prova. O Léo adorou jogar com você. Parabéns!");
  enviarResultado(ac);
}

/* ====== ENVIO (Firebase), SEM mostrar nota ao aluno ====== */
function enviarResultado(ac){
  if(enviado){return;}enviado=true;
  var letras="",i;for(i=0;i<QUESTOES.length;i++){letras+=(respostas[i]<0?"-":String(respostas[i]));}
  var quando=new Date().toLocaleString("pt-BR");
  var nota10=QUESTOES.length?Math.round(ac/QUESTOES.length*100)/10:0;
  var reg={nome:nomeAluno,turma:turmaAluno,nota:nota10,acertos:ac+"/"+QUESTOES.length,respostas:letras,data:quando};
  try{
    var chave=(nomeAluno+"_"+turmaAluno+"_"+Date.now()).replace(/[^A-Za-z0-9_]/g,"_");
    var x=new XMLHttpRequest();
    x.open("PUT",FIREBASE_DB+"/provas/"+SLUG+"/"+chave+".json",true);
    x.setRequestHeader("Content-Type","application/json");
    x.send(JSON.stringify(reg));
  }catch(e){}
  if(URL_PLANILHA){try{
    var dados="nome="+encodeURIComponent(nomeAluno)+"&turma="+encodeURIComponent(turmaAluno)+"&nota="+encodeURIComponent(nota10)+"&acertos="+encodeURIComponent(ac+"/"+QUESTOES.length)+"&respostas="+encodeURIComponent(letras)+"&data="+encodeURIComponent(quando);
    var y=new XMLHttpRequest();y.open("POST",URL_PLANILHA,true);y.setRequestHeader("Content-Type","application/x-www-form-urlencoded");y.send(dados);
  }catch(e){}}
}

/* ====== confete leve ====== */
function confete(){try{
  var c=document.createElement("canvas");c.style.position="fixed";c.style.left=0;c.style.top=0;c.style.pointerEvents="none";c.style.zIndex=9998;
  c.width=window.innerWidth;c.height=window.innerHeight;document.body.appendChild(c);
  var x=c.getContext("2d"),ps=[],i,cores=["#E5202E","#0099DD","#F7B500","#3EA72D","#fffdf6"];
  for(i=0;i<80;i++){ps.push({x:Math.random()*c.width,y:-20-Math.random()*c.height,r:6+Math.random()*6,vy:2+Math.random()*3,co:cores[i%cores.length],vx:-1.5+Math.random()*3});}
  var t=0,tot=140;function loop(){x.clearRect(0,0,c.width,c.height);var k;for(k=0;k<ps.length;k++){var p=ps[k];p.y+=p.vy;p.x+=p.vx;x.fillStyle=p.co;x.fillRect(p.x,p.y,p.r,p.r);}t++;if(t<tot){requestAnimationFrame(loop);}else{if(c.parentNode){c.parentNode.removeChild(c);}}}loop();
}catch(e){}}

/* ====== boot ====== */
function boot(){attMudo();telaCapa();}
document.addEventListener("click",function(){
  if(_histTocada){return;}
  if(!document.getElementById("cNome")){return;}
  _histTocada=true;falar(HISTORIA,true);
},false);
boot();
</script>
