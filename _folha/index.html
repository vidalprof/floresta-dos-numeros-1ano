<title>Somando com Desenhos — a folha viva</title>

<!-- ============================================================
     FOLHA VIVA — TESTE pedido pelo Marcos (8/set/2026)
     "Pegar uma atividade de alfabetização das que há aos milhares na internet em
      Word ou PDF e dar interatividade a ela: tudo o que se pede no papel, fazer no
      computador. A interatividade que você tem que dar é o que a atividade pede."
     A folha e a folha: as 6 paginas do PDF "Somando com Desenhos — adicao simples
     ate 10" (1o ano, EF01MA06, atividadesdealfabetizacao.com.br, material gratuito
     para professores) ficam na tela como estao. Por cima, so o que o papel pede:
       · onde ha linha de resposta -> quadradinho que aceita DIGITAR (teclado na
         tela E teclado de verdade — as duas portas);
       · onde diz "ligue" -> a crianca liga com linha (toque-toque ou arrasto);
       · onde diz "desenhe" -> area de desenhar com o dedo/mouse;
       · onde ha texto -> alto-falante que LE (voz da casa, Antonio; navegador so
         de reserva);
       · NOME e DATA da folha: ela escreve o nome, a data se preenche sozinha.
     Erro nunca e "errou": som grave curto, o quadradinho treme e a voz ajuda a
     contar. Continua de onde parou por 55 min (a aula). Relatorio do professor
     segurando a medalha 2 s. Nada disto vira regra da casa: e um teste para ver.
     ES5 puro (Chrome 109 / Firefox 106), um arquivo, sem biblioteca.
     ============================================================ -->

  for(var i = 0; i < ordem.length; i++){
    var b = el("button", ordem[i] === "ap" ? "ap" : (ordem[i] === "ok" ? "ok" : ""), ordem[i] === "ap" ? "⌫ apagar" : (ordem[i] === "ok" ? "OK" : ordem[i]));
    b.setAttribute("data-t", ordem[i]); b.setAttribute("aria-label", ordem[i] === "ap" ? "Apagar" : (ordem[i] === "ok" ? "Confirmar" : "Número " + ordem[i]));
    b.onclick = (function(t){ return function(){ digita(t); }; })(ordem[i]);
    tk.appendChild(b);
  }
})();
/* a segunda porta: o teclado de verdade */
document.addEventListener("keydown", function(ev){
  if(!ATIVA) return;
  if(document.activeElement && document.activeElement.className && String(document.activeElement.className).indexOf("nome") > -1) return;
  if(ev.key >= "0" && ev.key <= "9"){ ev.preventDefault(); digita(ev.key); }
  else if(ev.key === "Backspace"){ ev.preventDefault(); digita("ap"); }
  else if(ev.key === "Enter"){ ev.preventDefault(); digita("ok"); }
  else if(ev.key === "Escape"){ ATIVA.el.className = "resp"; ATIVA.el.innerHTML = '<i class="zi"></i>'; ATIVA = null; document.getElementById("teclado").className = ""; }
});

/* ---------- ligar ---------- */
function montaLigar(d, P, pi){
  var svg = document.createElementNS("http://www.w3.org/2000/svg", "svg"); svg.setAttribute("class", "linhas"); svg.setAttribute("viewBox", "0 0 " + PW + " " + PH); svg.setAttribute("preserveAspectRatio", "none");
  d.appendChild(svg);
  var marcada = null, viva = null, arrastando = false, E = {}, D = {};
  function centro(R, lado){ return {x: lado === "e" ? R.x + R.w : R.x, y: R.y + R.h / 2}; }
  function linha(a, b, cor, larg, tracejada){ var l = document.createElementNS("http://www.w3.org/2000/svg", "line"); l.setAttribute("x1", a.x); l.setAttribute("y1", a.y); l.setAttribute("x2", b.x); l.setAttribute("y2", b.y); l.setAttribute("stroke", cor); l.setAttribute("stroke-width", larg || 9); if(tracejada) l.setAttribute("stroke-dasharray", "18 14"); svg.appendChild(l); return l; }
  function ponto(ev){ var r = d.getBoundingClientRect(); return {x:(ev.clientX - r.left) / r.width * PW, y:(ev.clientY - r.top) / r.height * PH}; }
  function desmarca(){ if(marcada){ marcada.el.className = "ponta"; } marcada = null; if(viva){ svg.removeChild(viva); viva = null; } for(var k in D) if(D[k].el.className.indexOf("mostra") > -1) D[k].el.className = "ponta"; }
  function fecha(Re, Rd){
    var id = "l" + pi + "_" + Re.k;
    if(Rd.k === Re.k){
      tentativa(id, true); ST.lig[id] = 1; salvar();
      linha(centro(Re, "e"), centro(Rd, "d"), "#43a047", 10);
      Re.el.className = "ponta feita"; Rd.el.className = "ponta feita";
      desmarca(); sCerto(); falar(Re.certo);
      setTimeout(function(){ confereFolha(pi); }, 900);
    } else {
      tentativa(id, false); var n = ST.tent[id].erros;
      var l = linha(centro(Re, "e"), centro(Rd, "d"), "#e57373", 8); setTimeout(function(){ if(l.parentNode) svg.removeChild(l); }, 600);
      Rd.el.className = "ponta treme"; setTimeout(function(){ if(Rd.el.className.indexOf("feita") < 0) Rd.el.className = "ponta"; }, 500);
      sErro(); falar(n >= 2 ? Re.dica : "essaNao");
      if(n >= 2){ var alvo = D[Re.k]; if(alvo && alvo.el.className.indexOf("feita") < 0) alvo.el.className = "ponta mostra"; }
      if(viva){ svg.removeChild(viva); viva = null; }
    }
  }
  var i;
  for(i = 0; i < P.esq.length; i++){ (function(R){
    var e = el("div", "ponta"); pos(e, R.x, R.y, R.w, R.h); e.setAttribute("role", "button"); e.setAttribute("tabindex", "0"); e.setAttribute("aria-label", FALAS[R.fala]); e.setAttribute("data-qa", "lig-" + R.k);
    R.el = e; E[R.k] = R;
    if(ST.lig["l" + pi + "_" + R.k]){ e.className = "ponta feita"; }
    e.addEventListener("pointerdown", function(ev){
      if(e.className.indexOf("feita") > -1) return;
      ev.preventDefault(); try{ e.setPointerCapture(ev.pointerId); }catch(x){}
      desmarca(); marcada = R; e.className = "ponta marcada"; sLinha(); falar(R.fala);
      arrastando = true; var c = centro(R, "e"); viva = linha(c, c, "#f59e0b", 8, true);
    });
    e.addEventListener("pointermove", function(ev){ if(!arrastando || !viva || marcada !== R) return; var p = ponto(ev); viva.setAttribute("x2", p.x); viva.setAttribute("y2", p.y); });
    e.addEventListener("pointerup", function(ev){
      if(!arrastando || marcada !== R) return; arrastando = false;
      var p = ponto(ev), alvo = null;
      for(var k in D){ var Rd = D[k]; if(p.x >= Rd.x - 20 && p.x <= Rd.x + Rd.w + 20 && p.y >= Rd.y - 10 && p.y <= Rd.y + Rd.h + 10 && Rd.el.className.indexOf("feita") < 0) alvo = Rd; }
      if(alvo){ fecha(R, alvo); }
      else { /* soltou no vazio: fica marcada, esperando o toque no outro lado (toque simples) */ if(viva){ var c = centro(R, "e"); viva.setAttribute("x2", c.x + 60); viva.setAttribute("y2", c.y); } }
    });
    e.onkeydown = function(ev){ if(ev.key === "Enter" || ev.key === " "){ ev.preventDefault(); desmarca(); marcada = R; e.className = "ponta marcada"; falar(R.fala); } };
    d.appendChild(e);
  })(P.esq[i]); }
  for(i = 0; i < P.dir.length; i++){ (function(R){
    var e = el("div", "ponta"); pos(e, R.x, R.y, R.w, R.h); e.setAttribute("role", "button"); e.setAttribute("tabindex", "0"); e.setAttribute("aria-label", FALAS[R.fala]); e.setAttribute("data-qa", "lig-" + R.k);
    R.el = e; D[R.k] = R;
    if(ST.lig["l" + pi + "_" + R.k]){ e.className = "ponta feita"; }
    e.addEventListener("pointerdown", function(ev){
      if(e.className.indexOf("feita") > -1) return;
      ev.preventDefault();
      if(marcada){ fecha(marcada, R); }
      else { sPasso(); falar(R.fala); falarDepois("ligue", 900); }
    });
    e.onkeydown = function(ev){ if(ev.key === "Enter" || ev.key === " "){ ev.preventDefault(); if(marcada) fecha(marcada, R); } };
    d.appendChild(e);
  })(P.dir[i]); }
  /* redesenha as linhas ja feitas (retomada) */
  for(var k in E){ if(ST.lig["l" + pi + "_" + k]) linha(centro(E[k], "e"), centro(D[k], "d"), "#43a047", 10); }
  d.addEventListener("pointerup", function(){ setTimeout(function(){ if(arrastando){ arrastando = false; } }, 0); });
}

/* ---------- desenhar ---------- */
var CORES = ["#1d4ed8", "#e53935", "#43a047", "#f5b400", "#8e24aa", "#3a2600"];
function montaDesenho(d, A, pi, di){
  var box = el("div", "desenho"); pos(box, A.x, A.y, A.w, A.h); box.setAttribute("aria-label", "Área para desenhar");
  var cv = document.createElement("canvas"); box.appendChild(cv); d.appendChild(box);
  var ctx = cv.getContext("2d"), cor = CORES[0], tracos = [], atual = null, pintando = false;
  function ajusta(){ var r = box.getBoundingClientRect(); if(r.width < 2) return; var dpr = Math.min(2, window.devicePixelRatio || 1); cv.width = Math.round(r.width * dpr); cv.height = Math.round(r.height * dpr); ctx.setTransform(dpr, 0, 0, dpr, 0, 0); redesenha(r); }
  function redesenha(r){ r = r || box.getBoundingClientRect(); ctx.clearRect(0, 0, r.width, r.height); ctx.lineCap = "round"; ctx.lineJoin = "round"; ctx.lineWidth = Math.max(3, r.width / 140); for(var i = 0; i < tracos.length; i++){ var t = tracos[i]; if(t.p.length < 1) continue; ctx.strokeStyle = t.c; ctx.beginPath(); ctx.moveTo(t.p[0][0] * r.width, t.p[0][1] * r.height); if(t.p.length === 1) ctx.lineTo(t.p[0][0] * r.width + .1, t.p[0][1] * r.height); for(var j = 1; j < t.p.length; j++) ctx.lineTo(t.p[j][0] * r.width, t.p[j][1] * r.height); ctx.stroke(); } }
  function rel(ev){ var r = box.getBoundingClientRect(); return [(ev.clientX - r.left) / r.width, (ev.clientY - r.top) / r.height]; }
  box.addEventListener("pointerdown", function(ev){ ev.preventDefault(); try{ box.setPointerCapture(ev.pointerId); }catch(x){} pintando = true; atual = {c:cor, p:[rel(ev)]}; tracos.push(atual); redesenha(); });
  box.addEventListener("pointermove", function(ev){ if(!pintando || !atual) return; atual.p.push(rel(ev)); redesenha(); });
  function solta(){ pintando = false; atual = null; }
  box.addEventListener("pointerup", solta); box.addEventListener("pointercancel", solta);
  /* ferramentas: cores e apagar, pousadas na borda de cima da area */
  var f = el("div", "ferr"); f.style.left = "6.5%"; f.style.top = (A.ty / PH * 100).toFixed(2) + "%";
  for(var i = 0; i < 3; i++){ (function(c){ var b = el("button", "cor" + (c === cor ? " sel" : "")); b.style.background = c; b.setAttribute("aria-label", "Cor do lápis"); b.onclick = function(){ cor = c; var bs = f.querySelectorAll(".cor"); for(var k = 0; k < bs.length; k++) bs[k].className = "cor"; b.className = "cor sel"; sPasso(); }; f.appendChild(b); })(CORES[i]); }
  var ap = el("button", "apaga", '<svg viewBox="0 0 24 24"><path d="M16.2 3.6a2 2 0 0 1 2.8 0l1.4 1.4a2 2 0 0 1 0 2.8L10.6 17.6H6.4l-2.2-2.2a2 2 0 0 1 0-2.8zM6.9 13.4l-1.3 1.3 1.6 1.6h2.6l1.1-1.1zM4 20h16v1.5H4z" fill="#8d3b00"/></svg>'); ap.setAttribute("aria-label", "Apagar o desenho");
  ap.onclick = function(){ tracos = []; redesenha(); sPasso(); falar("apaguei"); };
  f.appendChild(ap); d.appendChild(f);
  box._ajusta = ajusta;
  window.addEventListener("resize", function(){ if(d.className.indexOf("viva") > -1) ajusta(); });
}
function ajustaDesenhos(pi){ var bs = PAGEL[pi].querySelectorAll(".desenho"); for(var i = 0; i < bs.length; i++) if(bs[i]._ajusta) bs[i]._ajusta(); }

/* ---------- pagina pronta? navegacao ---------- */
function pendentes(pi){
  var P = PAGINAS[pi], n = 0, i;
  if(P.resps) for(i = 0; i < P.resps.length; i++) if(String(ST.resp["r" + pi + "_" + i]) !== String(P.resps[i].r)) n++;
  if(P.esq) for(i = 0; i < P.esq.length; i++) if(!ST.lig["l" + pi + "_" + P.esq[i].k]) n++;
  return n;
}
function confereFolha(pi){
  if(pendentes(pi) > 0 || ST.prontas[pi]) return;
  ST.prontas[pi] = 1; salvar();
  PAGEL[pi].className += " pronta"; sFesta(); confete(24);
  if(pi < PAGINAS.length - 1){ falar("paginaPronta"); setTimeout(function(){ if(ST.pag === pi) vaiPara(pi + 1); }, 2600); }
  else { setTimeout(fim, 1400); }
  atualizaNav();
}
function vaiPara(pi){
  calar(); if(ATIVA){ ATIVA.el.className = ATIVA.el.className.indexOf("certa") > -1 ? "resp certa" : "resp"; if(ATIVA.el.className === "resp") ATIVA.el.innerHTML = '<i class="zi"></i>'; ATIVA = null; }
  document.getElementById("teclado").className = "";
  document.getElementById("barraCapa").className = pi === 0 ? "aberta" : "";
  if(pi === 0) espelhaNome(ST.nome || "");
  document.getElementById("fim").style.display = "none"; document.getElementById("retomar").style.display = "none"; document.getElementById("nav").style.display = pi === 0 ? "none" : "flex";
  for(var i = 0; i < PAGEL.length; i++) PAGEL[i].className = PAGEL[i].className.replace(" viva", "");
  ST.pag = pi; salvar();
  var d = PAGEL[pi]; d.className += " viva";
  if(pi > 0) window.scrollTo(0, 0);
  ajustaDesenhos(pi); setTimeout(function(){ ajustaDesenhos(pi); }, 60);
  atualizaNav();
  var P = PAGINAS[pi];
  if(P.tipo === "capa") falarDepois("capa", 300);
  else if(pi === 1 && !ST.prontas[1]) { falar("p2intro"); }
  else falarDepois(P.fala, 250);
}
function atualizaNav(){
  var pi = ST.pag, total = PAGINAS.length;
  document.getElementById("pg").textContent = pi === 0 ? "Capa" : "Página " + pi + " de " + (total - 1);
  var feitas = 0; for(var k in ST.prontas) feitas++;
  document.getElementById("progI").style.width = (feitas / (total - 1) * 100) + "%";
  document.getElementById("bAnt").disabled = pi === 0;
  var prox = document.getElementById("bProx");
  prox.style.visibility = pi === 0 ? "hidden" : "visible";
  var pend = pi > 0 ? pendentes(pi) : 0;
  prox.textContent = pi === total - 1 ? (pend ? "Faltam " + pend : "Ver o resultado ★") : (pend ? "Faltam " + pend + " ▶" : "Próxima ▶");
  prox.className = pend ? "bt cinza" : "bt verde";
  document.getElementById("navTxt").textContent = pi === 0 ? "" : PAGINAS[pi].nome;
}
document.getElementById("bAnt").onclick = function(){ sPasso(); if(ST.pag > 0) vaiPara(ST.pag - 1); };
document.getElementById("bProx").onclick = function(){
  sPasso(); var pi = ST.pag, pend = pendentes(pi);
  if(pend){ falar("faltam"); var r = PAGEL[pi].querySelector(".resp:not(.certa), .ponta:not(.feita)"); if(r){ r.className += " treme"; setTimeout(function(){ r.className = r.className.replace(" treme", ""); }, 500); try{ r.scrollIntoView({behavior:"smooth", block:"center"}); }catch(e){} } return; }
  if(pi < PAGINAS.length - 1) vaiPara(pi + 1); else fim();
};
document.getElementById("bOuvir").onclick = function(){ sPasso(); var b = this, P = PAGINAS[ST.pag]; if(document.getElementById("fim").style.display === "block"){ falar("fim", b); return; } if(ST.pag === 1){ falar("p2intro", b, function(){ falar("p2enun", b); }); return; } falar(P.fala, b); };
document.getElementById("bVoz").onclick = function(){ vozLigada = !vozLigada; var b = document.getElementById("bVoz"); if(vozLigada){ b.className = "zap"; falar("vozOn"); } else { calar(); b.className = "zap off"; } };

/* ---------- confete ---------- */
function confete(n){ var cs = ["#f5b400", "#43a047", "#1d4ed8", "#e53935", "#8e24aa"]; for(var i = 0; i < n; i++){ var c = el("div", "confete"); c.style.left = (Math.random() * 100) + "vw"; c.style.background = cs[i % cs.length]; c.style.animationDelay = (Math.random() * .5) + "s"; c.style.transform = "rotate(" + (Math.random() * 360) + "deg)"; document.body.appendChild(c); setTimeout((function(x){ return function(){ if(x.parentNode) x.parentNode.removeChild(x); }; })(c), 2600); } }

/* ---------- fim: boletim, medalha, relatorio do professor ---------- */
var _segura = null;
function fim(){
  calar(); for(var i = 0; i < PAGEL.length; i++) PAGEL[i].className = PAGEL[i].className.replace(" viva", "");
  document.getElementById("teclado").className = ""; document.getElementById("barraCapa").className = ""; document.getElementById("nav").style.display = "none";
  var f = document.getElementById("fim"); f.style.display = "block"; window.scrollTo(0, 0);
  sFesta(); confete(60); falar("fim");
  var tot = 0, prim = 0, k; for(k in ST.tent){ tot++; if(ST.tent[k].erros === 0) prim++; }
  var est = document.getElementById("estrelas"); est.innerHTML = "";
  var n = prim >= tot * .85 ? 3 : (prim >= tot * .6 ? 2 : 1);
  for(i = 0; i < 3; i++){ var s = el("div", "estrela", '<svg viewBox="0 0 24 24" width="48" height="48"><path d="M12 2l3 6.6 7 .8-5.2 4.8 1.5 7L12 17.6 5.7 21.2l1.5-7L2 9.4l7-.8z" fill="' + (i < n ? "#f5b400" : "#e6dcc4") + '" stroke="#b98400" stroke-width="1"/></svg>'); est.appendChild(s); setTimeout((function(x){ return function(){ x.className = "estrela acesa"; }; })(s), 300 + i * 350); }
  var bar = document.getElementById("barras"); bar.innerHTML = "";
  for(var pi = 1; pi < PAGINAS.length; pi++){ (function(pi){ var t = 0, p = 0; for(var kk in ST.tent){ if(kk.indexOf("r" + pi + "_") === 0 || kk.indexOf("l" + pi + "_") === 0){ t++; if(ST.tent[kk].erros === 0) p++; } } var b = el("div", "barra", "<span>" + PAGINAS[pi].nome + "</span><div class='tr'><i></i></div><b>" + p + "/" + t + "</b>"); bar.appendChild(b); setTimeout(function(){ b.querySelector("i").style.width = (t ? p / t * 100 : 0) + "%"; }, 400); })(pi); }
  document.getElementById("fimTxt").textContent = (ST.nome ? ST.nome + ", você" : "Você") + " acertou de primeira " + prim + " de " + tot + " respostas.";
  document.getElementById("relatorio").style.display = "none";
}
(function(){
  var m = document.getElementById("medalha");
  function comeca(ev){ ev.preventDefault(); m.className = "medalha segurando"; _segura = setTimeout(function(){ m.className = "medalha"; relatorio(); }, 2000); }
  function solta(){ m.className = "medalha"; if(_segura){ clearTimeout(_segura); _segura = null; } }
  m.addEventListener("pointerdown", comeca); m.addEventListener("pointerup", solta); m.addEventListener("pointerleave", solta); m.addEventListener("pointercancel", solta);
})();
function relatorio(){
  var r = document.getElementById("relatorio"), h = "<b>Relatório do professor</b> — " + (ST.nome || "(sem nome)") + " · " + Math.round(((Date.now() - (ST.inicio || Date.now())) / 60000)) + " min<table><tr><th>Item</th><th>Erros antes de acertar</th></tr>";
  var nomes = {};
  for(var pi = 1; pi < PAGINAS.length; pi++){ var P = PAGINAS[pi]; if(P.resps) for(var i = 0; i < P.resps.length; i++) nomes["r" + pi + "_" + i] = P.nome + " · item " + (i + 1) + " (= " + P.resps[i].r + ")"; if(P.esq) for(i = 0; i < P.esq.length; i++) nomes["l" + pi + "_" + P.esq[i].k] = P.nome + " · " + FALAS[P.esq[i].fala]; }
  var tot = 0, prim = 0, ruins = [];
  for(var k in nomes){ var t = ST.tent[k]; tot++; var e = t ? t.erros : "—"; if(t && t.erros === 0) prim++; if(t && t.erros >= 2) ruins.push(nomes[k]); h += "<tr><td>" + nomes[k] + "</td><td>" + e + "</td></tr>"; }
  var parecer = prim >= tot * .85 ? "Dominou a adição até 10 com apoio de desenhos." : (prim >= tot * .6 ? "Está construindo: acerta, mas ainda conta de novo em alguns itens." : "Precisa retomar a contagem um a um com material concreto.");
  h += "</table><p><b>Parecer:</b> " + parecer + (ruins.length ? "<br><b>Itens com 2 ou mais tentativas:</b> " + ruins.join("; ") : "") + "</p>";
  r.innerHTML = h; r.style.display = "block"; falar("fimRel");
}
document.getElementById("bRever").onclick = function(){ sPasso(); document.getElementById("nav").style.display = "flex"; vaiPara(1); };
document.getElementById("bRecomecar").onclick = function(){ sPasso(); try{ localStorage.removeItem(CHAVE_LS); }catch(e){} ST = {pag:0, nome:ST.nome, resp:{}, lig:{}, tent:{}, prontas:{}, inicio:0}; monta(); document.getElementById("nav").style.display = "flex"; vaiPara(0); };

/* ---------- retomar (55 min = a aula) ---------- */
(function(){
  var salvo = carregar();
  monta();
  if(salvo && salvo.pag > 0 && !(salvo.prontas && salvo.prontas[PAGINAS.length - 1])){
    document.getElementById("retomar").style.display = "block";
    document.getElementById("retTxt").textContent = (salvo.nome ? salvo.nome + ", você" : "Você") + " estava na página " + salvo.pag + ". Quer continuar de onde parou?";
    document.getElementById("bRetSim").onclick = function(){ ST = salvo; monta(); vaiPara(salvo.pag); };
    document.getElementById("bRetNao").onclick = function(){ try{ localStorage.removeItem(CHAVE_LS); }catch(e){} vaiPara(0); };
    PAGEL[0].className += " viva"; atualizaNav();
    falarDepois("retomar", 400);
  } else { vaiPara(0); }
  /* destrava o audio no primeiro gesto (regra do navegador, nao defeito) */
  var destrava = function(){ ac(); document.removeEventListener("pointerdown", destrava); document.removeEventListener("keydown", destrava); };
  document.addEventListener("pointerdown", destrava); document.addEventListener("keydown", destrava);
})();
</script>
