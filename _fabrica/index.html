   vinham do caca-palavras 9x9 (celula pequena); aqui sao 36 numeros. */
.cel{min-height:44px;height:auto;display:-webkit-box;display:-webkit-flex;display:flex;-webkit-box-align:center;align-items:center;-webkit-box-pack:center;justify-content:center}
.mem{display:-webkit-box;display:-webkit-flex;display:flex;-webkit-flex-wrap:wrap;flex-wrap:wrap;gap:7px;-webkit-box-pack:center;justify-content:center;margin:16px 0;max-width:340px}

/* ===== TELA GRANDE (computador) — letra maior =====
   Pedido do Marcos: "no computador ficam pequenas". O app foi desenhado na
   medida do celular; num monitor a mesma caixa fica longe do olho.
   ⚠️ ARMADILHA MEDIDA AQUI: o monitor da escola (1366x768) e MAIS BAIXO que o
   celular (a janela util fica ~640px). Aumentar tudo la faz a tela ROLAR e a
   crianca perde o botao. Por isso sao DOIS casos: monitor alto = tudo maior;
   monitor baixo e largo = so a LETRA cresce, as caixas ficam do tamanho. */

  .lig{font-size:17px}
  .cel{font-size:19px}
  .placar{font-size:18px}
  .relcard{font-size:32px}

/* ===== FASES NOVAS: bagunca, reta, prateleira, caixa, girar, corte, quadro ===== */
.bagunca{display:-webkit-box;display:-webkit-flex;display:flex;-webkit-flex-wrap:wrap;flex-wrap:wrap;-webkit-box-pack:center;justify-content:center;gap:2px;margin:14px 0;max-width:340px}
.dsolto{cursor:pointer;-webkit-transition:opacity .18s,-webkit-transform .18s;transition:opacity .18s,transform .18s}
.dsolto img{width:38px;height:38px;object-fit:contain;display:block}
.dsolto.visto{opacity:.32;-webkit-transform:scale(.82);transform:scale(.82)}
.apoio{background:rgba(255,253,244,.97);border:2px solid var(--linha);border-radius:14px;padding:9px 12px;margin-top:12px;max-width:330px;-webkit-animation:pop .3s;animation:pop .3s}
.apoio .aptit{font-size:12.5px;font-weight:700;color:#6b6555;margin-bottom:5px;text-align:center}
.apfila{display:-webkit-box;display:-webkit-flex;display:flex;-webkit-box-align:center;align-items:center;gap:3px;margin-bottom:3px}
.apfila img{width:22px;height:22px;object-fit:contain}
.apfila .apnum{margin-left:6px;font-size:15px;font-weight:800;color:var(--tinta-d)}
.apoio .apmais{font-size:12.5px;font-weight:700;color:#6b6555;margin-top:4px;text-align:center}
.acesa{-webkit-animation:acende 1s ease-in-out infinite;animation:acende 1s ease-in-out infinite;
  -webkit-box-shadow:0 0 0 3px var(--dourado),0 0 16px rgba(255,212,59,.8);box-shadow:0 0 0 3px var(--dourado),0 0 16px rgba(255,212,59,.8)}
@-webkit-keyframes acende{0%,100%{-webkit-transform:scale(1)}50%{-webkit-transform:scale(1.07)}}
@keyframes acende{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}

/* reta numerica */
.reta{position:relative;display:-webkit-box;display:-webkit-flex;display:flex;-webkit-box-align:end;align-items:flex-end;
  background:rgba(255,253,244,.95);border:2px solid var(--linha);border-radius:14px;
  padding:46px 24px 8px;margin:16px 0;width:100%;max-width:356px;min-height:96px;
  -webkit-box-shadow:0 6px 14px rgba(50,40,20,.22);box-shadow:0 6px 14px rgba(50,40,20,.22)}
.reta .marca{-webkit-box-flex:1;-webkit-flex:1;flex:1;text-align:center;cursor:pointer;min-height:42px;
  display:-webkit-box;display:-webkit-flex;display:flex;-webkit-box-orient:vertical;-webkit-flex-direction:column;flex-direction:column;
  -webkit-box-align:center;align-items:center;-webkit-box-pack:end;justify-content:flex-end}
.reta .marca i{display:block;width:2px;height:13px;background:#b8ae95;border-radius:2px}
.reta .marca b{font-size:11.5px;font-weight:800;color:#6b6555;margin-top:2px}
.reta .marca.caiu i{background:var(--ok);height:19px;width:3px}
/* verde ESCURO so no texto: o --ok claro dava 3,3:1 sobre o creme (auditor 4) */
.reta .marca.caiu b{color:#2b6b18;font-size:13px}
.reta .marca.conta i{background:var(--dourado);height:17px}
.reta .marca.no i{background:var(--erro);height:19px}
.reta .salta{position:absolute;top:4px;width:38px;height:38px;object-fit:contain;-webkit-transform:translateX(-50%);transform:translateX(-50%);
  -webkit-transition:left .42s cubic-bezier(.3,-.4,.4,1.4);transition:left .42s cubic-bezier(.3,-.4,.4,1.4)}

/* prateleiras */
.prats{display:-webkit-box;display:-webkit-flex;display:flex;-webkit-box-orient:vertical;-webkit-flex-direction:column;flex-direction:column;gap:6px;margin:14px 0}
.prat{display:-webkit-box;display:-webkit-flex;display:flex;-webkit-box-pack:center;justify-content:center;gap:3px;
  background:-webkit-linear-gradient(top,#c69a63,#9d7340);background:linear-gradient(#c69a63,#9d7340);
  border:2px solid #6f4f26;border-bottom-width:5px;border-radius:9px;padding:4px 7px;min-height:38px;
  -webkit-box-align:center;align-items:center;-webkit-animation:pop .25s;animation:pop .25s}
.prat img{width:26px;height:26px;object-fit:contain}

/* caixa / dinheiro */
.sacos{display:-webkit-box;display:-webkit-flex;display:flex;-webkit-flex-wrap:wrap;flex-wrap:wrap;-webkit-box-pack:center;justify-content:center;gap:9px;margin:14px 0}
.saco{position:relative;text-align:center}
.saco img{width:56px;height:56px;object-fit:contain;display:block}
.vagam{margin-top:3px;min-width:34px;height:28px;line-height:26px;border-radius:9px;background:var(--papel);
  border:2px dashed var(--linha);font-size:15px;font-weight:800;color:#6b6555}
.vagam.paga{border-style:solid;border-color:#24710f;background:-webkit-linear-gradient(top,#3f9a26,#287a14);
  background:linear-gradient(#3f9a26,#287a14);color:#fff}
.vagam.dica{border-color:var(--dourado);background:#fff6d8;color:#8a6a00}
.moedas{display:-webkit-box;display:-webkit-flex;display:flex;-webkit-box-pack:center;justify-content:center;gap:11px;margin-top:12px}
.moeda{position:relative;width:62px;height:62px;cursor:pointer;-webkit-transition:-webkit-transform .12s;transition:transform .12s}
.moeda img{width:62px;height:62px;object-fit:contain;display:block;
  -webkit-filter:drop-shadow(0 4px 6px rgba(60,40,10,.35));filter:drop-shadow(0 4px 6px rgba(60,40,10,.35))}
.moeda b{position:absolute;left:0;right:0;top:50%;margin-top:-13px;font-size:25px;font-weight:800;color:#4a3410;
  text-align:center;text-shadow:0 1px 0 rgba(255,255,255,.6)}
.moeda:active{-webkit-transform:translateY(2px);transform:translateY(2px)}
.moeda.no{-webkit-animation:shk .4s;animation:shk .4s}

/* girar a bandeja */
.virabox{-webkit-transition:-webkit-transform .5s;transition:transform .5s}
.virabox.girando{-webkit-transform:rotate(90deg) scale(.86);transform:rotate(90deg) scale(.86)}

/* corte da bandeja */
.grade2.cortavel{position:relative}
.linhac{height:14px;margin:-2px 0;cursor:pointer;border-radius:4px;background:rgba(255,255,255,.16)}
.linhac.conta{background:rgba(255,212,59,.55)}
.linhac.no{background:rgba(239,90,74,.6)}
.linhac.cortada{background:#fff;height:8px;-webkit-box-shadow:0 0 0 2px #24710f;box-shadow:0 0 0 2px #24710f}
.fila.parteA{background:rgba(107,210,63,.34);border-radius:7px}
.fila.parteB{background:rgba(138,107,255,.34);border-radius:7px}

/* quadro da semana */
.quadro{display:-webkit-box;display:-webkit-flex;display:flex;-webkit-box-orient:vertical;-webkit-flex-direction:column;flex-direction:column;gap:5px;
  background:rgba(255,253,244,.96);border:2px solid var(--linha);border-bottom-width:5px;border-radius:14px;padding:9px;margin:14px 0;
  -webkit-box-shadow:0 6px 14px rgba(50,40,20,.22);box-shadow:0 6px 14px rgba(50,40,20,.22)}
.qlin{display:-webkit-box;display:-webkit-flex;display:flex;-webkit-box-align:center;align-items:center;gap:4px}
.qcab{min-width:74px;font-size:12px;font-weight:800;color:#6b4a1e;text-align:right;padding-right:4px}
.qcel{-webkit-box-flex:1;-webkit-flex:1;flex:1;min-width:34px;height:34px;line-height:32px;text-align:center;
  border-radius:8px;background:#f3ecda;border:1px solid #ddd3bb;font-size:15px;font-weight:800;color:var(--tinta-d)}
.qcel.vazia{background:#fff;border:2px dashed var(--linha);color:#6b6555}
.qcel.vazia.conta{border-color:var(--dourado);background:#fff6d8}
.saco{position:relative;display:inline-block}
.saco .cont{position:absolute;bottom:-6px;left:50%;margin-left:-16px;min-width:32px;height:23px;line-height:23px;border-radius:999px;background:rgba(30,27,18,.86);color:#fff;font-size:13.5px;font-weight:800;text-align:center;padding:0 5px}
.qcel.cheia{background:-webkit-linear-gradient(top,#2f7a1c,#1d5a0b);background:linear-gradient(#2f7a1c,#1d5a0b);
  border-color:#164607;color:#fff;-webkit-animation:pop .25s;animation:pop .25s}

<script>
"use strict";
/* ================= IMAGENS ================= */
var IMGS=["fb_base","fb_fala","fb_pisca","fb_cr1","fb_cr2","fb_cr3","fb_cr4","fb_cr5","fb_cr6","fb_bola","fb_boneca","fb_caixa","fb_caixote","fb_carrinho","fb_cubo","fb_med","fb_mola","fb_parafuso","fb_piao","fb_roda","fb_urso"];
var IMG={};(function(){var i;for(i=0;i<IMGS.length;i++){var im=new Image();im.src="img/"+IMGS[i]+".png";IMG[IMGS[i]]=im;}})();

var AC=window.AudioContext||window.webkitAudioContext, ac=AC?new AC():null;

function tom(f,d,tp,v,w){ if(!ac)return; try{var o=ac.createOscillator(),g=ac.createGain();o.type=tp||"sine";o.frequency.value=f;o.connect(g);g.connect(ac.destination);var t=ac.currentTime+(w||0);g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(v||0.2,t+0.01);g.gain.exponentialRampToValueAtTime(0.0001,t+d);o.start(t);o.stop(t+d+0.03);}catch(e){} }
function sTap(){ tom(520,0.06,"triangle",0.11); }
function sPop(i){ tom(540+((i||0)%6)*70,0.11,"triangle",0.13); }
function sCerto(){ tom(659,0.12,"sine",0.18); tom(880,0.13,"sine",0.18,0.08); tom(1318,0.2,"sine",0.16,0.16); }
function sErro(){ tom(210,0.17,"sawtooth",0.11); tom(160,0.22,"sawtooth",0.11,0.07); }
function sFesta(){ var n=[523,659,784,1046,1318],i; for(i=0;i<n.length;i++) tom(n[i],0.3,"triangle",0.17,i*0.085); }
function sMaquina(){ var i; for(i=0;i<5;i++) tom(300+i*40,0.05,"square",0.06,i*0.07); }
/* ================= NARRAÇÃO + LIP-SYNC ================= */
var narr=document.getElementById("narr");
var anaNode=null,anaBuf=null,anaOk=false,anaTent=false,bocaAlvo=0,bocaSuave=0,falaTimer=0,falaAtual="",falandoCb=null;
function ligaAnalisador(){ if(anaOk||anaTent)return; anaTent=true;
  try{ if(!ac)return; var src=ac.createMediaElementSource(narr); anaNode=ac.createAnalyser(); anaNode.fftSize=256;
    anaBuf=new Uint8Array(anaNode.fftSize); src.connect(anaNode); anaNode.connect(ac.destination); anaOk=true; }catch(e){} }
function falar(id,cb){ falandoCb=cb||null; falaAtual=id;
  if(ac&&ac.state==="suspended"){try{ac.resume();}catch(e){}}
  try{ narr.pause(); narr.currentTime=0; }catch(e){}
  narr.src="audio/"+id+".mp3";
  var p=narr.play(); if(p&&p["catch"]){ p["catch"](function(){}); }
  if(btnOuvir) btnOuvir.className="mini tocando";
  iniciaBoca(); }
function fimFala(){ paraBoca(); if(btnOuvir) btnOuvir.className="mini"; var c=falandoCb; falandoCb=null; if(c)c(); }
narr.addEventListener("ended",fimFala);
narr.addEventListener("error",function(){ fimFala(); });
function iniciaBoca(){ if(falaTimer)clearInterval(falaTimer); bocaAlvo=0.7;
  falaTimer=setInterval(function(){ if(narr.paused||narr.ended){bocaAlvo=0;} else if(!anaOk){ bocaAlvo=0.25+Math.random()*0.75; } },95); }
function paraBoca(){ if(falaTimer){clearInterval(falaTimer);falaTimer=0;} bocaAlvo=0; }
function depoisDaFala(id,maxMs,cb){
  var fired=false;
  function fim(){ if(fired)return; fired=true; if(cb)cb(); }
  falar(id,fim);
  function guarda(){ if(fired)return; if(narr&&!narr.paused&&!narr.ended){ setTimeout(guarda,700); return; } fim(); }
  setTimeout(guarda,maxMs||6000);

var bentoAtual=null;
function loopBoca(){
  if(anaOk&&!narr.paused&&!narr.ended){
    try{ anaNode.getByteTimeDomainData(anaBuf); var i,s=0;
      for(i=0;i<anaBuf.length;i+=4){ var v=(anaBuf[i]-128)/128; s+=v*v; }
      var rms=Math.sqrt(s/(anaBuf.length/4));

    }catch(e){}
  }
  bocaSuave += (bocaAlvo-bocaSuave)*0.4;
  if(bentoAtual&&bentoAtual.fala) bentoAtual.fala.style.opacity=bocaSuave.toFixed(3);
  requestAnimationFrame(loopBoca);
}
requestAnimationFrame(loopBoca);
setInterval(function(){
  if(bentoAtual&&bentoAtual.pisca&&bocaSuave<0.05&&Math.random()<0.45){
    bentoAtual.pisca.style.opacity="1";
    setTimeout(function(){ if(bentoAtual&&bentoAtual.pisca) bentoAtual.pisca.style.opacity="0"; },140);
  }
},3200);
/* ================= PÓ DE PAPEL (ambiente) ================= */
var po=document.getElementById("po"),px=po.getContext("2d"),CW,CH,TK=0,motes=[];
function sizePo(){CW=po.clientWidth;CH=po.clientHeight;po.width=CW;po.height=CH;
  if(!motes.length){var i;for(i=0;i<14;i++)motes.push({x:Math.random()*CW,y:Math.random()*CH,ph:Math.random()*6,sp:0.15+Math.random()*0.3,r:1+Math.random()*2,a:0.10+Math.random()*0.25});}}
window.addEventListener("resize",sizePo);
function poLoop(){TK++;if(!CW)sizePo();px.clearRect(0,0,CW,CH);var i;
  for(i=0;i<motes.length;i++){var m=motes[i];m.y-=m.sp;m.x+=Math.sin(TK/55+m.ph)*0.25;if(m.y<-6){m.y=CH+6;m.x=Math.random()*CW;}
    px.globalAlpha=m.a*(0.6+0.4*Math.sin(TK/24+m.ph));px.fillStyle="#fff6de";px.beginPath();px.arc(m.x,m.y,m.r,0,6.29);px.fill();}
  px.globalAlpha=1;requestAnimationFrame(poLoop);}
sizePo();poLoop();
/* ================= CONFETE ================= */
var cc=document.getElementById("conf"),c2=cc.getContext("2d"),cf=[];
function scf(){cc.width=cc.clientWidth;cc.height=cc.clientHeight;}window.addEventListener("resize",scf);scf();
function festa(){var i,co=["#2f6bd8","#ffd43b","#8a6bff","#6bd23f","#ff8ac2"];for(i=0;i<90;i++)cf.push({x:cc.width/2,y:cc.height*0.34,vx:(Math.random()-0.5)*11,vy:-Math.random()*13-3,g:0.32,r:5+Math.random()*4,c:co[i%5],a:1,rot:Math.random()*6,vr:(Math.random()-0.5)*0.4,sq:1});}
function faisca(x,y,cor,n){var i;n=n||14;for(i=0;i<n;i++){var a=Math.random()*6.283,sp=1.5+Math.random()*4;cf.push({x:x,y:y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-1,g:0.14,r:2+Math.random()*3,c:cor,a:1,rot:0,vr:0,sq:0});}}
function lcf(){c2.clearRect(0,0,cc.width,cc.height);var i;for(i=cf.length-1;i>=0;i--){var p=cf[i];p.vy+=p.g;p.x+=p.vx;p.y+=p.vy;p.rot+=p.vr;p.a-=(p.sq?0.008:0.02);if(p.a<=0||p.y>cc.height+20){cf.splice(i,1);continue;}c2.save();c2.globalAlpha=Math.max(0,p.a);c2.translate(p.x,p.y);if(p.sq){c2.rotate(p.rot);c2.fillStyle=p.c;c2.fillRect(-p.r,-p.r*0.6,p.r*2,p.r*1.2);}else{c2.fillStyle=p.c;c2.beginPath();c2.arc(0,0,p.r,0,6.29);c2.fill();}c2.restore();}requestAnimationFrame(lcf);}lcf();

function reg(c,ok,t){ MED.ev.push({c:c,ok:ok?1:0,t:t||1,ms:(new Date()).getTime()-MED.ini});

/* ================= HELPERS ================= */
var app=document.getElementById("app"),banner=document.getElementById("banner"),bmsg=document.getElementById("bmsg"),bcta=document.getElementById("bcta"),barra=document.getElementById("barra");
var btnOuvir=null,btnDica=null,dicaId="",dicaTxt="";
function el(t,c,h){var e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e;}

  var b=el("div","balao dicain",txt); b.id="dicabox";
  var alvos=tela.getElementsByClassName("balao"), ref=null, i;
  for(i=0;i<alvos.length;i++){ if(alvos[i].id!=="dicabox"){ ref=alvos[i]; break; } }

function elogio(){ var n=["fb_acerto1","fb_acerto2","fb_acerto3"]; falar(n[Math.floor(Math.random()*3)]); }
function consolo(){ falar(Math.random()<0.5?"fb_erro1":"fb_erro2"); }
/* monta uma frase em palavras tocáveis; alvo = índice da palavra certa */
function fraseEl(palavras,alvo,onOk,onNo){

  for(i=0;i<palavras.length;i++){(function(txt,idx){

function baguncar(a){var i,j,x;for(i=a.length-1;i>0;i--){j=Math.floor(Math.random()*(i+1));x=a[i];a[i]=a[j];a[j]=x;}return a;}
function unicos(a,quero){var i,v={},o=[];for(i=0;i<a.length;i++){if(a[i]>0&&!v[a[i]]){v[a[i]]=1;o.push(a[i]);}}
  while(o.length<quero){var n=o[o.length-1]+1+Math.floor(Math.random()*3);if(!v[n]){v[n]=1;o.push(n);}}
  return baguncar(o.slice(0,quero));}

/* ---------- 12) ⭐ A ESTEIRA QUE PULA (múltiplos / fatos básicos) ---------- */
var MULP=[{p:4,n:8},{p:6,n:7},{p:7,n:6},{p:8,n:6},{p:9,n:5}];
function fEsteiraMult(){
  var idx=0,err=0;

    limpa();var t=el("div","tela");setProg(t,62);
    var it=MULP[idx],passoAt=1,fim=false;

    var bal=el("div","balao","A esteira anda de <b>"+it.p+" em "+it.p+"</b>. Toque na marca onde ela vai parar.");
    c.appendChild(bal);
    /* ⚠️ BUG PAGO (Marcos, ago/2026): "falta a marca ou a linha para clicar".
       A .marca do molde so aparece se tiver os FILHOS <i> (o tracinho) e <b> (o
       numero) — eu tinha posto o numero solto no innerHTML e a fase ficava sem
       nada visivel para tocar. Marca = <i></i> + <b>numero</b>, sempre.        */
    var reta=el("div","reta"),marcas=[],i;
    var boneco=el("img","salta"); boneco.src="img/fb_base.png"; boneco.alt="";
    reta.appendChild(boneco);

      var v=k*it.p;

      m.appendChild(el("i",""));

        if(fim||m.className.indexOf("caiu")>=0) return;
        if(k===passoAt){
          m.className="marca caiu"; sPop(k); passoAt++; poe();
          if(passoAt>it.n){ fim=true; sCerto(); reg("multiplos",err===0,err+1);
            bal.innerHTML="Chegou em <b>"+(it.n*it.p)+"</b>!";
            var cf=contaEl(it.n+" pulos de "+it.p+" = <b>"+(it.n*it.p)+"</b>",it.n+" &#215; "+it.p+" = "+(it.n*it.p));
            c.appendChild(cf);
            var ce=centroTela(cf); faisca(ce[0],ce[1],"#ffb45e",16);
            setTimeout(function(){ idx++;

        } else { err++; m.className="marca no"; sErro();

          ajudaFb(err,{dica:"Some <b>"+it.p+"</b> ao &#250;ltimo n&#250;mero que acendeu.",

      boneco.style.left=(m.offsetLeft+m.offsetWidth/2)+"px"; }

  /* ⚠️ LIÇÃO PAGA (aqui, ago/2026): no celular o navegador dispara mousedown/

     mouseup fantasma rodava o solta() de novo e DESMARCAVA a peca que a crianca
     tinha acabado de escolher — o toque simples nunca entregava a carga.
     Guardar so o onclick nao basta: tem que barrar o mouse inteiro.        */
  var ultimoToque=0;

  function daArrasto(b){
    var g=null,dx=0,dy=0,x0=0,y0=0,pegou=false,moveu=false,tratado=0;

    function move(e){ if(!pegou||!g) return; var q=pto(e);
      if(Math.abs(q[0]-x0)>6||Math.abs(q[1]-y0)>6) moveu=true;
      g.style.left=(q[0]-dx)+"px"; g.style.top=(q[1]-dy)+"px";
      var z,al=alvoEm(q[0],q[1]);
      for(z=0;z<vagas.length;z++) if(!vagas[z]._ok) vagas[z].className=(vagas[z]===al)?"cam mira":"cam";
      if(e.preventDefault&&e.type.indexOf("touch")===0) e.preventDefault(); }
    function solta(e){ if(ehMouseFantasma(e)) return;
      if(e.type.indexOf("touch")===0) ultimoToque=(new Date()).getTime();
      if(!pegou) return; pegou=false;
      var q=pto(e); if(g&&g.parentNode) g.parentNode.removeChild(g); g=null;

    b.onclick=function(){ if((new Date()).getTime()-tratado<700) return; toque(); };
  }

/* ---------- TREINAR SO O QUE FALTOU ----------
   O app ja mede cada objetivo (DOM). Aqui ele monta um percurso CURTO so com as
   fases dos objetivos fracos e volta para a medalha no fim. A crianca nao

var FILATREINO=null;

mostraBanner=function(msg,cb){ _bannerOriginal(msg, FILATREINO ? proximoTreino : cb); };
function fracos(){
  var k,out=[];
  for(k in DOM){ if(DOM.hasOwnProperty(k)&&(DOM[k]||0)<0.75&&TREINO[k]) out.push(k); }
  return out;
}
function proximoTreino(){
  if(!FILATREINO||!FILATREINO.length){ FILATREINO=null; salva(); TELAFIM(); return; }
  var f=FILATREINO.shift();
  try{ f(); }catch(e){ proximoTreino(); }
}
function treinarFracos(){
  var f=fracos(),i,fila=[];
  for(i=0;i<f.length;i++) fila.push(TREINO[f[i]]);

}
